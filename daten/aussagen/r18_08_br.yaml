- id: br.beob.kneser_logkonvex
  titel: 'Kneser hat T′ log-konvex (Minimum von (log T′)″ = 0.9196) — aber das kennzeichnet nicht'
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: forschung
  objekte: [kneser_T, konvexitaet]
  bereich: 'Kneser-Tetration zur Basis $e$ auf $(-2,\infty)$'
  aussage: |
    $(\log T')''>0$ auf $(-2,\infty)$ mit Minimum $0.9196$ bei $x\approx-0.04$ (gleichwertig: $1/\mathrm{slog}'$ konvex). Gemessen auf $(-2,2]$ (Schritt 0.02, dps 40);
    rechts davon bewiesen über $(\log T')''(x+1)=(\log T')''(x)+T''(x)$ und $T''>0$ für $x\ge0$. Die lineare Tetration hat $(\log T')''=0$ auf $(-1,1)$, liegt also genau auf dem Rand.
    Nicht kennzeichnend: es ist eine offene Bedingung, alle nahen Verbiegungen erfüllen sie auch.
  einfach: >-
    Die Ableitung von Knesers Tetration ist „logarithmisch nach oben gekrümmt“, mit deutlichem Abstand. Das gilt aber auch für leicht verbogene Tetrationen, darum legt es Kneser nicht fest.
