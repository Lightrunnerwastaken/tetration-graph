- id: kn.beob.polynom_rand_plateau
  titel: 'Bis zum Rand gleichmässig konvergiert das Verfahren vermutlich nicht: in Modellen mit schneller Drehung bleibt der Fehler nahe L stehen'
  art: beobachtung
  ebene: B
  status: numerisch
  niveau: forschung
  objekte: [superfunktion, fixpunkt_L]
  bereich: 'Abschneide-Verfahren für Modelle mit Randfixpunkt $L$ und Multiplikator $\mu$; $\Pi_NU-U$ bei bekannter exakter Lösung $U$'
  aussage: |
    In einem Modell mit $|\mu|=2.6$ hört der Fehler $\Pi_NU-U$ in einer **festen** Zone nahe $L$ auf der $\Gamma_{\rm out}$-Seite ($|x-L|\approx0.13$–$0.15$) ab $N\approx1000$ auf zu fallen:
    Plateau $1.2$–$2.3\cdot10^{-6}$ bis $N=3200$; in $L$ selbst, auf der $\Gamma_{\rm in}$-Seite und im Inneren konvergiert er weiter. Bei $|\mu|=2$ fällt er bis $N=2400$ überall.
    Ursache ist die Drehung des Eckmusters: der primale Eckkopf dreht auf der $\Gamma_{\rm out}$-Seite in seinen Wachstumssektor.
    **Folgerung (Kette, nicht nachgerechnet):** Bei Knesers $|\mu|=1.172$ träte derselbe Effekt erst ab $N\gtrsim10^{10}$ im Abstand $r_*\sim10^{-6}$ von $L$ auf.
  einfach: >-
    Die schärfste Fassung der Vermutung — „gleichmässig bis zum Rand“ — ist für astronomisch grosse Grade wahrscheinlich falsch: In Modellen, in denen sich die Ecke schneller dreht,
    bleibt der Fehler in einer kleinen Zone neben L stehen. Koeffizienten und p_N(1) liegen weit weg davon und sind nicht betroffen.
  gegenbeispielsuche: >-
    Vorhersage vor der Rechnung aufgeschrieben (Strang V), dann in drei sauberen Quintik-Modellen geprüft; das ungeeignete Modell (|μ| = 2, fast singuläre Abschnitte) verworfen.
  experimente: []
  pruefung:
    f1_folgt_unmittelbar: 'Nein; Modellbefund plus Schlusskette über das explizite Eckprofil.'
    f2_benutzte_voraussetzungen: '—'
    f3_spezialfall: '—'
    f4_uebertragbar: 'Jede Basis mit drehendem Randfixpunkt; die Zone wird mit kleinerem |μ| winzig.'
    f5_neue_frage: 'Beweis oder Widerlegung der gleichmässigen Konvergenz auf D̄ für Kneser selbst.'
  bewertung: {richtigkeit: 'numerisch an Modellen (N ≤ 3200); für Kneser nur Hochrechnung', neuheit: vermutlich_neu, recherche: 'Keine Vorarbeit bekannt.', nutzen: 'Legt die richtige Zielfassung fest: gleichmässig ohne kleine Umgebungen von L, L̄.', nutzen_stufe: hoch}
  quellen: [{ref: team_polynom_halbexp, stelle: 'phase3/v_pruefstand/BERICHT §3.14 (Test T1), phase3/k_kern/BERICHT §22–§23'}]
  kanten:
    - {typ: motiviert, ziel: kn.satz.polynom_hauptsatz_kr0}
    - {typ: verwandt, ziel: kn.verm.polynom_halbexp_eckmoden}

- id: kn.satz.polynom_eckprofil
  titel: 'Die Ecke bei L in geschlossener Form: Grenzprofile als Gamma-Reihen mit dem Exponenten L/(4π)'
  art: satz
  ebene: B
  status: skizze
  niveau: forschung
  objekte: [superfunktion, fixpunkt_L]
  bereich: 'Rang-1-Bausteine („Köpfe“) der Inversen $J_n^{-1}$ nahe $L$ auf der Skala $d_n=\rho n^{-a}$, $a=1/\kappa_1=1-L/(4\pi i)=0.89359+0.02532i$; $\alpha=L/(4\pi)$'
  aussage: |
    Mit $F_\beta(u)=\sum_{k\ge0}\Gamma(\beta-i\alpha k)(-u)^k/(k!\,\Gamma(\beta))=\Gamma(\beta)^{-1}\int_0^\infty t^{\beta-1}e^{-t-u\,t^{-i\alpha}}dt$:
    (i) **bewiesen:** das Grenzproblem an der Ecke (Mellin–Wiener–Hopf mit dem Faktor $1+\mu^{s-2}$, $\mu=\sqrt L$) hat die Lösungen $F_{\beta_A}$, $\beta_A=\tfrac12-2i\alpha$ (adjungiert), und
    $F_{\beta_P}$, $\beta_P=\tfrac12+i\alpha$ (primal), mit $\lambda_P=-\mu^{-1/2}\lambda_A$; unter einer Mellin-Randbedingung sind sie eindeutig.
    (ii) **gemessen:** die echten Köpfe laufen wie $n^{-0.894}$ gegen diese Profile (Gs Eckprofil auf $2.5\cdot10^{-7}$ mit einem Parameter getroffen); das Eckprodukt folgt
    $K_n(L,L)\approx C\,L/d_n$ mit $C=-\tilde\lambda_P\Gamma(\tfrac12+i\alpha)/((\mu+\mu^{-1})\Gamma(\tfrac12+2i\alpha))=-0.010118-0.598298i$ (gemessen $-0.01012-0.59830i$).
  einfach: >-
    Das Verhalten der Gleichungen ganz nahe am Fixpunkt L lässt sich in Formeln hinschreiben: Es sind Reihen aus Gammafunktionen, in denen nur die Zahl L/(4π) vorkommt —
    eine Folge von log L = L. Die Rechnungen treffen diese Formeln auf sieben Stellen.
  formen:
    - {tex: '\alpha=\frac{\log\mu}{2\pi}=\frac{L}{4\pi},\qquad \kappa_1=\frac{2\pi i}{2\pi i-\log\mu}', notiz: 'wegen log L = L ist log μ = L/2'}
  beweis:
    art: skizze
    text: |
      Mellin-Transformation macht das Grenzproblem diagonal; der Faktor $1+\mu^{s-2}$ zerfällt über die Spiegelungsformel in Gammafunktionen (Malyuzhinets-Faktor $\Gamma(\tfrac12+i\alpha(s-2))$);
      Existenz durch Rücktransformation, Eindeutigkeit über Liouville unter der Mellin-Randbedingung; die Integraldarstellung durch Vertauschen von Reihe und Integral.
    luecken:
      - 'Lemma K12 (Übersetzung der Mellin-Randbedingung in Sektorbedingungen) nur skizziert.'
      - 'Dass die echten Köpfe gegen die Grenzlösung konvergieren, ist gemessen, nicht bewiesen; ebenso die Formel für C (Anpassung an die Aussenlösung).'
  stuetzt_sich_auf: [kn.satz.halbexp_singularitaet_L]
  experimente: [exp.polynom_phase3]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; Mellin–Wiener–Hopf mit explizitem Faktor.'
    f2_benutzte_voraussetzungen: 'Nur die lokale Form von f bei L (L, μ = √L).'
    f3_spezialfall: 'Malyuzhinets-Faktor der Keilbeugung; Stokes-Struktur eines Wendepunkts.'
    f4_uebertragbar: 'Jede Basis: α = log μ/(2π) mit dem jeweiligen Multiplikator.'
    f5_neue_frage: 'Anpassung an die globale Lösung mit Fehlerschranken (der offene Kern).'
  bewertung: {richtigkeit: 'Grenzproblem bewiesen bis auf Lemma K12 (von V gegengelesen); Konvergenz der echten Köpfe numerisch', neuheit: vermutlich_neu, recherche: 'Malyuzhinets-Funktionen sind aus der Beugungstheorie bekannt; ihre Rolle bei Abschnitten von Kompositionsoperatoren nicht gefunden.', nutzen: 'Explizite lokale Parametrix für jeden Beweisweg an der Ecke.', nutzen_stufe: mittel}
  quellen: [{ref: team_polynom_halbexp, stelle: 'phase3/k_kern/BERICHT §18–§19, §24–§25, §27.3; phase3/v_pruefstand/BERICHT §1.9–1.10, §1.12, §3.17'}]
  kanten:
    - {typ: verwandt, ziel: kn.satz.halbexp_singularitaet_L}

- id: kn.satz.polynom_cd_identitaet
  titel: 'Christoffel–Darboux-Formel für die abgeschnittenen Gleichungen mit Komposition'
  art: satz
  ebene: B
  status: bewiesen
  niveau: forschung
  objekte: [superfunktion]
  bereich: '$J_n=T_nJ_\infty|_{P_n}$ mit $J_\infty u=u\circ f+m\,u$ ($f$ holomorph um 0, $f(0)\ne0$); $K_n(z,t)$ der Kern von $J_n^{-1}$, $q_{n+1}$ primaler Kopf, $\lambda_n$ adjungierter Kopf, $\nu_n=J_n^{-1}\mathbf 1$'
  aussage: |
    $$(z-t)\,K_n(z,t)=q_{n+1}(z)\,\lambda_n(t)-t\,\nu_n(z)+\Xi_n(z,t),\qquad \Xi_n(z,t)=\frac1{2\pi i}\oint K_n(z,s)\,(f(s)-s)\,K_n(f(s),t)\,\frac{ds}{s}.$$
    Ohne Komposition ($f(s)=s$) bleibt die klassische Christoffel–Darboux-Formel für Toeplitz-Inverse. Der Dyson-Term $\Xi_n$ verschwindet in den Fixpunkten. Am Steg ist das Produkt
    $m\,q_{n+1}\lambda_n/t$ unabhängig von $n$ (z. B. $1.03968$ bei $180^\circ$).
  einfach: >-
    Für die Inverse der Gleichungsmatrix gibt es eine exakte Formel wie für orthogonale Polynome: Sie besteht aus einem einzigen Paar von Bausteinen, einem glatten Teil und einem
    Zusatzterm, der von der Verkettung p(p(x)) kommt.
  beweis:
    art: vollstaendig
    text: |
      Die Verschiebung erster Ordnung des Kompositionskanals: $JS-SJ=T_nM_{f-x}C_f-(T_nf^{n+1})e_n^{\mathsf T}$. Für $X=J_n^{-1}$ folgt $SX-XS=X(JS-SJ)X$; zwischen den Erzeugenden
      $e(z)$ und $\hat e(t)$ ausgewertet ergibt der zweite Term das Kopfpaar, der Randterm $\nu_n$, und der Kompositionsteil den Dyson-Term als Konturintegral.
  stuetzt_sich_auf: []
  experimente: []
  pruefung:
    f1_folgt_unmittelbar: 'Fast: es ist die Kommutatorformel für Inverse, ausgewertet mit dem expliziten Kompositions-Kommutator.'
    f2_benutzte_voraussetzungen: 'Holomorphie von f und m um 0; bei f_K gilt die Konturform nur auf Kreisen |s| < ρ.'
    f3_spezialfall: 'Christoffel–Darboux / Gohberg–Semencul für Toeplitz-Inverse (Fall f(s) = s).'
    f4_uebertragbar: 'Jede gewichtete Komposition.'
    f5_neue_frage: 'Abschätzung des Dyson-Terms; eine Kontraktion für ihn scheitert (Spektralradius > 1 ab n ≈ 58).'
  bewertung: {richtigkeit: 'bewiesen; mit zwei unabhängigen Programmen auf 1e-176 bzw. 2e-89 bestätigt (kubisch und Kneser)', neuheit: vermutlich_neu, recherche: 'CD-Formeln für Kompositionsoperatoren nicht gefunden.', nutzen: 'Exakte Darstellung des ganzen Kerns durch wenige Objekte.', nutzen_stufe: mittel}
  quellen: [{ref: team_polynom_halbexp, stelle: 'phase3/k_kern/BERICHT §39–§41; phase3/v_pruefstand/BERICHT §1.13'}]
  kanten:
    - {typ: verwandt, ziel: kn.satz.polynom_eckprofil}

- id: kn.satz.polynom_approximation_ecke
  titel: 'Wie gut Polynome Knesers halbe e-Funktion bis an die Ecke annähern: Rate N^{−3.96}'
  art: satz
  ebene: C
  status: skizze
  niveau: forschung
  objekte: [superfunktion, fixpunkt_L]
  bereich: '$E\supset\bar D\setminus U_{r_0}(L,\bar L)$ ein Kompaktum mit Spiralecke bei $L$ (Aussenöffnung $\Theta=131.7^\circ$, $\alpha_E=\Theta/\pi$); $\mathcal P_N$ Polynome vom Grad $\le N$'
  aussage: |
    $\operatorname{dist}_E(f_K,\mathcal P_N)\le C_E\,N^{-5.417\,\alpha_E}$, beim Standardfenster also $N^{-3.96}$.
  einfach: >-
    Knesers halbe e-Funktion lässt sich auf dem Gebiet, das der Beweis braucht, sehr gut durch Polynome annähern: der Fehler fällt wie N hoch minus vier.
  beweis:
    art: skizze
    text: |
      Satz 2 von Andrievskii–Pritsker–Varga (Approximation auf Quasischeiben, $|f-p_n|\le c\,\rho_{1/n}^{r}\,\omega(\rho_{1/n})$) mit $r=5$; $f_K\in C^{5,0.417}(E)$ aus der Struktur bei $L$
      (Exponent $5.447$, Verlust $0.030$ durch die Blattdrehung); an der Spiralecke $\rho_{1/N}(L)\asymp N^{-\alpha_E}$.
    luecken:
      - 'Dass E eine Quasischeibe ist (Jordan-Gebiet, Dreipunkt-Bedingung, Öffnung), ist nur numerisch auf einem Raster geprüft (kubisch und f_K).'
  stuetzt_sich_auf: [kn.satz.halbexp_singularitaet_L]
  experimente: []
  pruefung:
    f1_folgt_unmittelbar: 'Fast: Anwendung eines bekannten Satzes; die Arbeit steckt in Glattheit und Geometrie.'
    f2_benutzte_voraussetzungen: 'Andrievskii–Pritsker–Varga Satz 2; Struktur von f_K bei L.'
    f3_spezialfall: 'Dzjadyk-Typ-Sätze der konstruktiven Funktionentheorie.'
    f4_uebertragbar: 'Andere Basen, andere Ecköffnungen (Exponent 5.417·α_E).'
    f5_neue_frage: 'Strenger Beweis der Quasischeiben-Geometrie.'
  bewertung: {richtigkeit: 'Satz im Original gelesen (Strang K); Geometrie numerisch; synthetischer Test 3.37/3.97/5.02 gegen 3.36/3.96/5.02; gemessen 3.9–4.1', neuheit: folklore, nutzen: 'Datenseite des bedingten Hauptsatzes.', nutzen_stufe: mittel}
  quellen: [{ref: andrievskii_pritsker_varga2001, stelle: 'Satz 2'}, {ref: team_polynom_halbexp, stelle: 'phase3/k_kern/BERICHT §35–§36; phase3/v_pruefstand/BERICHT §3.19, §3.23'}]
  kanten:
    - {typ: stuetzt, ziel: kn.satz.polynom_hauptsatz_kr0}

- id: kn.verm.polynom_halbexp_kern
  titel: 'Der offene Kern nach Phase 3: Eck-Pol-Antwort, ferne Raten und Familien-Kohärenz'
  art: vermutung
  ebene: B
  status: vermutung
  niveau: forschung
  objekte: [superfunktion, fixpunkt_L]
  bereich: '$K_{r_0}=\bar D\setminus U_{r_0}(L,\bar L)$; $u_n=\Pi_ns$ die Antwort auf den Pol in $L$; Köpfe wie in kn.satz.polynom_eckprofil'
  aussage: |
    Für den bedingten Hauptsatz (kn.satz.polynom_hauptsatz_kr0) fehlen drei Aussagen, alle numerisch mit Reserve erfüllt:
    **(G-P)** die Zuwächse der Eck-Pol-Antwort sind auf $K_{r_0}$ polynomial klein: $\sup_{K_{r_0}}|\Delta u_n|\le Cn^{\kappa_G}$ (gemessen $\kappa_G\approx-3.1$);
    **(FA)** die adjungierten Köpfe fallen fern von $L$ auf $n$-ter-Wurzel-Ebene mit strikter Reserve (Linse $-0.013$, $\Gamma_{\rm out}$-Bogen $-0.037$ je Grad);
    **(Fam-koh)** für die Fast-Lösungen gibt es Keim-Repräsentanten, deren mit $|\Lambda_N/\Lambda_N(L)|$ gewichteter Abstand zu $f_K$ auf der Kontur polynomial bleibt
    (gemessen $\sim N^{-4.7}$, $3\cdot10^{-16}$ bei $N=2000$, für jede Linse).
    Alle drei sind Kohärenzaussagen an Stellen, an denen sich ein wachsender und ein fallender Faktor genau ausgleichen; jede Abschätzung, die die Faktoren einzeln beschränkt, hat dort keine Reserve.
  einfach: >-
    Nach drei Arbeitsphasen ist das Problem auf wenige, genau benannte Aussagen eingeschrumpft. Alle sind in den Rechnungen deutlich erfüllt. Sie zu beweisen braucht ein Werkzeug,
    das zeigt, wie zwei sich exakt aufhebende Grössen zusammen schwingen — so ein Werkzeug fehlt bisher.
  gegenbeispielsuche: >-
    Stärkere Fassungen sind gemessen falsch: Familien-Repräsentant ohne Gewicht auf dicker Linse (wächst e^{0.0137N}), primale Reserve auf n-ter-Wurzel-Ebene (H_P ≡ 0, Lemma K20),
    gleichmässige Konvergenz bis an L (kn.beob.polynom_rand_plateau). Die benannten Fassungen halten bis N = 2000 bzw. 3000.
  experimente: [exp.polynom_phase3]
  pruefung:
    f1_folgt_unmittelbar: 'Nein.'
    f2_benutzte_voraussetzungen: '—'
    f3_spezialfall: 'Starke Asymptotik mit Verbindungsformel an einem Wendepunkt; nichtlokale Schweiss-Aufgabe.'
    f4_uebertragbar: 'Gleiche Form für jede Basis b > η.'
    f5_neue_frage: 'Ein Riemann–Hilbert-Rahmen mit Verschiebung, der beide Kanäle (Komposition und Multiplikation) an L enthält.'
  bewertung: {richtigkeit: 'numerisch, mit Reserve; von zwei Strängen unabhängig gemessen', neuheit: vermutlich_neu, recherche: 'Phasen 1–3 und GPT-Strang: keine passende Theorie gefunden (Problemblatt OPEN_PROBLEM_2_en.md).', nutzen: 'Die einzige verbleibende Lücke zum Beweis von Janis’ Vermutung in der K_{r₀}-Fassung.', nutzen_stufe: hoch}
  quellen: [{ref: team_polynom_halbexp, stelle: 'phase3/HAUPTSATZ_KR0.md §2, phase3/KERNPROBLEM.md, phase3/OFFENES_PROBLEM_2.md'}]
  kanten:
    - {typ: motiviert, ziel: kn.satz.polynom_hauptsatz_kr0}
    - {typ: verwandt, ziel: kn.verm.polynom_halbexp_eckmoden}

- id: kn.satz.polynom_hauptsatz_kr0
  titel: 'Hauptsatz, Fassung ohne Umgebungen von L: aus dem offenen Kern folgt Konvergenz gegen Knesers halbe e-Funktion'
  art: satz
  ebene: B
  status: bedingt
  bedingungen: [kn.verm.polynom_halbexp_kern, kn.satz.polynom_approximation_ecke]
  niveau: forschung
  objekte: [superfunktion, kneser_T]
  bereich: '$p_N$ wie in kn.verm.polynom_halbexp; $K_{r_0}=\bar D\setminus U_{r_0}(L,\bar L)$ mit $r_0>r_*$ (für Kneser $r_*\sim10^{-6}$)'
  aussage: |
    Gilt der Kern (kn.verm.polynom_halbexp_kern), so ist $\sup_{K_{r_0}}|\Pi_Nf_K-f_K|\le C\,N^{\gamma-3.96}$ mit gemessenem $\gamma\approx0$, und der von $p_1$ fortgesetzte Zweig ist ab
    $N_0=400$ die einzige Lösung in der Kugel um $f_K$; also $p_N\to f_K$ **gleichmässig auf $K_{r_0}$**, insbesondere $a_k^{(N)}\to a_k$ und $p_N(1)\to T_e(\tfrac12)$.
  einfach: >-
    Das ist der Stand des Beweises: Alles ist bewiesen oder mit dem Computer zertifiziert, bis auf die wenigen Aussagen des Kerns. Gelten sie, dann ist Janis’ Vermutung bewiesen —
    in der Fassung, die alles abdeckt, worum es ihr geht: Koeffizienten und p_N(1).
  beweis:
    art: skizze
    text: |
      1. **Datenseite (K19):** $\Pi_Nf-q_N=J_N^{-1}T_NJ(f-q_N)$ für jedes Polynom $q_N$; mit der Kopfentwicklung auf einer festen Kontur wird der Fehler durch $\operatorname{dist}_E(f_K,\mathcal P_N)$
         (kn.satz.polynom_approximation_ecke) mal einer Summe über die Köpfe beschränkt — keine abgeschnittenen Pole, kein Drehproblem.
      2. **Köpfe:** über die Rang-1-Zerlegung $\Delta K_n=\delta_n\Lambda_n/\ell_{nn}$ zerfällt die Kopfsumme in die drei Aussagen des Kerns.
      3. **Nichtlinear:** die Sätze H1/H2 (Sekanten-Identität, Überlagerung, σ-Homotopie) mit Kugeln in $\sup_{K_{r_0}}$; Start bei $N_0=400$ aus kn.satz.polynom_zweig_400.
    luecken:
      - 'Die drei Aussagen des Kerns (kn.verm.polynom_halbexp_kern).'
      - 'Die Umstellung von H1/H2 auf K_{r₀} und K19 sind von Strang V gegengelesen, nicht von der Leitung Zeile für Zeile.'
  stuetzt_sich_auf: [kn.satz.kneser_e_zertifiziert, kn.satz.polynom_zweig_400, kn.satz.polynom_approximation_ecke, kn.satz.halbexp_singularitaet_L]
  experimente: [exp.polynom_phase3]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; neue Datenseite (K19) und Kopfzerlegung statt der Pol-Annahme (H).'
    f2_benutzte_voraussetzungen: 'Kern, zertifizierte Kneser-Werte, Zweig bis 400, Approximationsrate.'
    f3_spezialfall: 'Galerkin-artige „Konsistenz + Stabilität“ mit Stabilität nur auf K_{r₀}.'
    f4_uebertragbar: 'Andere Basen b > η.'
    f5_neue_frage: 'Beweis des Kerns.'
  bewertung: {richtigkeit: 'bedingt; Bausteine von Strang V gegengelesen; numerisch bis N = 2000 gestützt', neuheit: vermutlich_neu, recherche: 'wie kn.satz.polynom_halbexp_hauptsatz.', nutzen: 'Stand des Beweises nach drei Arbeitsphasen.', nutzen_stufe: hoch}
  quellen: [{ref: team_polynom_halbexp, stelle: 'phase3/HAUPTSATZ_KR0.md (Fassung 3)'}]
  kanten:
    - {typ: stuetzt, ziel: kn.verm.polynom_halbexp}
    - {typ: verwandt, ziel: kn.satz.polynom_halbexp_hauptsatz}

- id: kn.gescheitert.polynom_ecke_wege
  titel: 'Acht Wege an der Ecke, die nicht tragen — und warum'
  art: gescheitert
  ebene: B
  status: gescheitert
  niveau: forschung
  objekte: [superfunktion, fixpunkt_L]
  bereich: 'Versuche aus Phase 3 (Stränge K und V), den offenen Kern zu beweisen'
  aussage: |
    (1) **Reserve in der konformen Koordinate:** die gleichmässige Stabilität enthält die Eckaussage für glatte Daten, braucht also dieselbe polynomiale Genauigkeit.
    (2) **Klassische Abschnittstheorie:** lokale Invertierbarkeit genügt nicht — der Kompositionskanal transportiert Anteile durch den ganzen Phasenraum.
    (3) **Cotlar–Stein:** asymptotisch nicht besser als die Dreiecksungleichung. (4) **Liouville auf dem Abel-Torus:** die Köpfe sind nur in komplementären Sektoren homogen.
    (5) **Vergleichsprinzip:** es gibt keine superharmonische Vergleichsfunktion mit der Singularität der Köpfe (Gesamtmasse). (6) **Dyson-Kontraktion der CD-Formel:** Spektralradius $>1$ ab $n\approx58$.
    (7) **Integrabler Eckkern:** die Ecke ist skaleninvariant, $f(s)-s$ und der Kern sind homogen vom Grad 0 — kein kleiner Parameter. (8) **Explizite Parametrix bzw. Abschneide-Rest:**
    ausserhalb von $D$ dominiert die äussere Wachstumslösung; der Rest wächst um $0.252$ je Grad.
  einfach: >-
    Acht verschiedene Werkzeuge wurden an der Ecke bei L ausprobiert. Jedes scheitert an derselben Stelle: Zwei Grössen gleichen sich dort exakt aus, und keine Abschätzung, die sie
    einzeln behandelt, hat Spielraum.
  experimente: []
  pruefung:
    f1_folgt_unmittelbar: '—'
    f2_benutzte_voraussetzungen: '—'
