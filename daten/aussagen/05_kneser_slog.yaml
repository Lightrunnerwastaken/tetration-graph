- id: kn.satz.polynom_halbexp_endlich
  titel: 'Für alle Grade N ≤ 120 streng: die Polynom-Wurzel existiert, ist eindeutig in ihrer Box und bleibt auf |x| ≤ |L| unter 2.2405'
  art: satz
  ebene: B
  status: bewiesen
  niveau: forschung
  objekte: [superfunktion]
  bereich: '$1\le N\le120$; $p_N$ wie in kn.verm.polynom_halbexp'
  aussage: |
    Für jedes $N\le120$ gibt es in der Box $\{a:|a_k-\tilde a_k|\le2^{-250}|L|^{-k}\}$ um die berechnete Näherung $\tilde a$ genau eine Lösung von $p(p(x))=e^x+O(x^{N+1})$, und für sie gilt
    $$\max_{|x|\le|L|}|p_N(x)|\le\sum_{k\le N}|a_k|\,|L|^k\le2.2405.$$
    Die Schranke ist also für alle bisher gerechneten Grade bewiesen — die Vermutung kn.verm.polynom_halbexp_schranke betrifft nur noch $N>120$.
  einfach: >-
    Für jeden einzelnen Grad bis 120 hat der Rechner mit Intervallrechnung (jede Zahl mit garantierten Fehlergrenzen) nachgewiesen: Die Lösung gibt es wirklich, sie ist dort die
    einzige, und das Polynom bleibt auf der ganzen Kreisscheibe bis zum Fixpunkt L unter 2.2405.
  beweis:
    art: vollstaendig
    text: |
      Rechnergestützt mit Ball-Arithmetik (arb, 600 Bit). Krawczyk-Test: Mit $C\approx J(\tilde a)^{-1}$ und der Box $X$ ist
      $K(X)=\tilde a-CF(\tilde a)+(I-CJ(X))(X-\tilde a)$; liegt $K(X)$ im Inneren von $X$, so hat $F$ in $X$ genau eine Nullstelle. Der Test gelingt für jedes $N=1,\dots,120$.

      Die Schranke folgt aus $|p_N(x)|\le\sum|a_k||x|^k$ mit den oberen Grenzen der Bälle. Für $N=1,2,3,5,40,120$: $1.875$, $2.200$, $2.233$, $2.2393$, $2.24047$, $2.24047$.
  experimente: [exp.polynom_schranke]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus dem Krawczyk-Kriterium; der Aufwand steckt in der Rechnung.'
    f2_benutzte_voraussetzungen: 'Nur die Polynom-Gleichungen; keine Kneser-Werte.'
    f3_spezialfall: 'Standardverfahren rechnergestützter Beweise (Intervall-Newton).'
    f4_uebertragbar: 'Auf jedes $N$ einzeln, solange die Rechengenauigkeit mit der Kondition (Faktor ≈ 1.9 pro Grad) mitwächst; nicht auf alle $N$ zugleich.'
    f5_neue_frage: 'Ein Argument, das alle N > N₀ auf einmal erfasst (kn.gescheitert.polynom_kantorovich zeigt, warum es nicht einfach ist).'
  bewertung: {richtigkeit: 'streng (Ball-Arithmetik), für N ≤ 120', neuheit: vermutlich_neu, recherche: 'Forum-Spiegel (alle 1265 Themen) nach f(f(x)) = exp(x) mit Polynom/Koeffizienten/Abschneiden durchsucht: nur verwandte Verfahren (tid 228 Höcker-Trick, tid 842 Matrix-Wurzel), nicht dieses.', nutzen: 'Sichert die Zahlen ab und zeigt, dass die Schranke bei 2.2405 liegt.', nutzen_stufe: mittel}
  quellen: [{ref: diese_arbeit}]
  kanten:
    - {typ: stuetzt, ziel: kn.verm.polynom_halbexp_schranke}

- id: kn.gescheitert.polynom_kantorovich
  titel: 'Newton–Kantorovich um Knesers abgeschnittene Reihe reicht für die Schranke nicht'
  art: gescheitert
  ebene: B
  status: gescheitert
  niveau: forschung
  objekte: [superfunktion, periodische_stoerung, fixpunkt_L]
  bereich: '$p_N$ wie in kn.verm.polynom_halbexp, $q_N$ Knesers Taylor-Polynom vom Grad $N$; Normen $\|\delta\|_X=\sum|\delta_k|1.3^k$, $\|r\|_Y=\sum|r_k|0.5^k$'
  aussage: |
    Naheliegender Ansatz: $p_N$ als Lösung nahe $q_N$ mit dem Satz von Newton–Kantorovich ($h_N=\beta_N\gamma\eta_N\le\tfrac12$ mit $\beta_N=\|J^{-1}\|$, $\eta_N=\|J^{-1}F(q_N)\|$, $\gamma$ Lipschitz-Konstante).
    Das scheitert, obwohl die Lösung existiert:

    (i) $\eta_N$ sagt den wahren Abstand $\|p_N-q_N\|_X$ auf 1 % voraus und fällt ($1.3\cdot10^{-5}$ bei $N=10$, $8\cdot10^{-10}$ bei $N=60$).

    (ii) $\beta_N$ wächst aber etwa um den Faktor $2.6$ pro Grad ($10^4$ bei $N=10$, $3\cdot10^{24}$ bei $N=60$); $h_N$ steigt von $0.5$ auf $10^{16}$.

    (iii) **Korrektur (Forschungsteam):** Die Leiter fast-singulärer Richtungen ($1.5\cdot10^{-12}$, je $\times3.4$, Vektor bei $\pm\arg L$) entsteht nur durch die **ungleichen Gewichte**
    $1.3$ und $0.5$; bei gleichen Gewichten $|L|^k$ gibt es sie nicht. Richtig bleibt das Scheitern: Kugel-Kantorovich versagt in jeder Norm, weil die Eckmode bei $L$ (kn.beob.polynom_eckmode)
    exponentiell wächst und Zufallsrichtungen $\gtrsim1.17^N$ verstärkt werden. Ein Beweis muss kohärente Richtungen benutzen (kn.satz.polynom_halbexp_hauptsatz).
  einfach: >-
    Der Standardweg wäre: Knesers Reihe ist fast eine Lösung, also liegt eine echte Lösung in der Nähe. Dafür müsste die Gleichung „gut gestellt“ sein. Sie ist es nicht:
    In einige Richtungen — genau die, in die sich andere halbe e-Funktionen von Kneser unterscheiden — reagiert die Gleichung fast gar nicht. Dass die Lösung trotzdem nicht dorthin
    abdriftet, liegt an einer Auslöschung, die man mit Abschätzungen der Grösse nicht fassen kann.
  experimente: [exp.polynom_schranke]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus den gemessenen Grössen; die Lösung selbst existiert (kn.satz.polynom_halbexp_endlich).'
    f2_benutzte_voraussetzungen: 'Gewichtete ℓ¹-Normen; andere Gewichte (s = 0.3, ρ = 1.2) zeigen dasselbe (β wächst noch schneller).'
    f3_spezialfall: 'Typisch für schlecht gestellte Probleme (analytische Fortsetzung): Regularisierung durch Abschneiden, Stabilität nur in ausgewählten Richtungen.'
    f4_uebertragbar: 'Gleiche Schwierigkeit beim intuitiven Superlogarithmus und bei der Matrix-Wurzel.'
    f5_neue_frage: 'Erledigt durch die kohärente Architektur des Hauptsatzes; offen nur (H).'
  bewertung: {richtigkeit: 'numerisch (die Grössen β, η, h); als Hindernis eindeutig', neuheit: vermutlich_neu, recherche: 'Forum-Spiegel (alle 1265 Themen) nach f(f(x)) = exp(x) mit Polynom/Koeffizienten/Abschneiden durchsucht: nur verwandte Verfahren (tid 228 Höcker-Trick, tid 842 Matrix-Wurzel), nicht dieses.', nutzen: 'Zeigt, welche Art von Argument für alle N gebraucht wird.', nutzen_stufe: mittel}
  quellen: [{ref: diese_arbeit}]
  kanten:
    - {typ: motiviert, ziel: kn.verm.polynom_halbexp_schranke}
    - {typ: verwandt, ziel: kn.satz.halbexp_beschraenkt}

# ---------------------------------------------------------------- Forschungsteam Polynom-Wurzel (10.10.2026, forschung/polynom_halbexp)
- id: kn.satz.halbexp_singularitaet_L
  titel: 'Knesers halbe e-Funktion am Fixpunkt L: f_K = φ(√L·Ψ·e^{Lε(Ψ^γ)}) — Exponenten 1 + nγ + j, ohne Logarithmen'
  art: satz
  ebene: B
  status: bewiesen
  niveau: forschung
  objekte: [kneser_T, schroeder, fixpunkt_L, theta_kneser]
  bereich: '$L=0.3181+1.3372i$, $\Psi$ Schröder-Funktion von exp an $L$ ($\Psi(e^z)=L\Psi(z)$), $\varphi=\Psi^{-1}$, $\gamma=2\pi i/L=4.44695+1.05794i$, $t=z-L$'
  aussage: |
    $$f_K=\varphi\bigl(\sqrt L\,\Psi\,e^{L\varepsilon(q)}\bigr),\qquad q=\Psi^{\gamma},\quad\varepsilon=2\kappa_1q+4\pi i\kappa_1^2q^2+\dots$$
    mit den Fourier-Koeffizienten $\kappa_m$ von Knesers θ-Abbildung ($\kappa_1=-8.35216\cdot10^{-6}-2.75680\cdot10^{-4}i$). Also
    $f_K-L=\sqrt L\,t\,(1+\sum c_mt^m)+\sum_{n\ge1}d_n\,t^{1+n\gamma}(1+\sum_je_{n,j}t^j)$: der analytische Teil ist die reguläre (Schröder-)Halbiterierte an $L$, die Singularitäten haben
    die Exponenten $1+n\gamma+j$, Logarithmen kommen nicht vor. Leitterm $d_1=2L^{3/2}\kappa_1=8.1712\cdot10^{-4}+3.5008\cdot10^{-4}i$, in der Form $D_1(1-z/L)^{1+\gamma}$:
    $D_1=-0.0320033-0.0112441i$. Daraus die Taylor-Koeffizienten um 0:
    $$a_k=2\operatorname{Re}\Bigl[D_1L^{-k}\frac{\Gamma(k-1-\gamma)}{\Gamma(-1-\gamma)\,k!}\Bigr](1+O(1/k)),\qquad|a_k|\lesssim71.57\,k^{-6.447}|L|^{-k}.$$
  einfach: >-
    Am komplexen Fixpunkt L sieht Knesers halbe e-Funktion fast so aus wie die „reguläre“ halbe Iteration an diesem Punkt — dazu kommen sehr schwache
    Zusatzglieder mit komplexen Hochzahlen. Diese Zusatzglieder bestimmen, wie schnell die Taylor-Koeffizienten abfallen.
  beweis:
    art: vollstaendig
    text: |
      Knesers Struktur (kn.konstr.kneser): $A=u+\vartheta(u)$ mit $u=\log\Psi/L$ und $\vartheta=\sum_{m\ge0}\kappa_me^{2\pi imu}$ (nur nichtnegative Moden). Einsetzen in
      $f_K=T(A+\tfrac12)$ mit $T(w)=\varphi(e^{L(w+\vartheta'(w))})$ und $e^{2\pi iu}=\Psi^{\gamma}$ gibt die Formel; $\varepsilon$ ist die Differenz $\vartheta(A+\tfrac12)-\vartheta(A)$ als Reihe in $q$.
      Die Darboux-Formel folgt aus der Singularitätsanalyse (Flajolet–Odlyzko) des Leitterms. Die Konstanten sind numerisch (Kneser-Motor, Formel auf $5\cdot10^{-37}$ geprüft).
  stuetzt_sich_auf: [kn.konstr.kneser]
  experimente: [exp.polynom_team]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus Knesers Struktursatz; neu ist die explizite Form und die Zahl der Konstanten.'
    f2_benutzte_voraussetzungen: 'Kneser-Struktur mit nur nichtnegativen Moden von ϑ (Grenzwert L für Im → +∞).'
    f3_spezialfall: 'Ja: Struktur von Abel-Funktionen an abstossenden Fixpunkten (Écalle-artige Entwicklung).'
    f4_uebertragbar: 'Auf jede Basis b > η und jede gebrochene Iterierte exp^{[c]} (Exponenten 1 + nγ_b + j).'
    f5_neue_frage: 'Ist κ₁ (und damit d₁) eine bekannte Konstante?'
  bewertung: {richtigkeit: 'Herleitung aus Knesers Struktur; Konstanten numerisch, Darboux-Reihe trifft a_k auf 1e-18 bei k = 300', neuheit: vermutlich_neu, recherche: 'Forum-Spiegel und Paulsen–Cowgill: Singularitätsexponenten der halben e-Funktion an L nicht gefunden.', nutzen: 'Erklärt den Koeffizientenabfall k^{−6.45} und liefert die Konstanten für das Fehlergesetz der Polynom-Wurzeln.', nutzen_stufe: mittel}
  quellen: [{ref: team_polynom_halbexp, stelle: 'Strang A (a_moden/BERICHT.md §4), Strang B Lemma 8.2'}, {ref: kneser1950}]
  kanten:
    - {typ: verwandt, ziel: kn.satz.halbe_exp}

- id: kn.beob.polynom_halbexp_fehlergesetz
  titel: 'Fehlergesetz der Polynom-Wurzeln: ein einziger Störmodus mit Amplitude ~ N^{1−2γ̄}, bestätigt bis N = 1500'
  art: beobachtung
  ebene: B
  status: numerisch
  niveau: forschung
  objekte: [superfunktion, periodische_stoerung, fixpunkt_L]
  bereich: '$p_N$ wie in kn.verm.polynom_halbexp; $\delta_{\mp1}=T''(A+\tfrac12)\,e^{\mp2\pi iA}$ die Tangenten der Konkurrenz-Lösungen; $\gamma=2\pi i/L$'
  aussage: |
    (i) **Ein Modus:** Im Inneren von $D$ ist $p_N-f_K=c_N\delta_{-1}+\bar c_N\delta_{+1}$ — $p_N$ ist bis auf $O(c_N^2)$ selbst eine exakte halbe e-Funktion „Kneser plus eine Störung“; die übrigen
    Moden sind relativ $10^{-14}$ bis $10^{-20}$ klein.

    (ii) **Amplitude:** $c_N\approx K\cdot N\cdot u_N/(\delta_{-1})_N\sim N^{1-2\bar\gamma}$, also $|c_N|\sim N^{-7.894}$; freier Fit $N^{-7.888-2.107i}$ gegen $1-2\gamma=-7.894-2.116i$,
    $K_\infty\approx0.0017-0.0533i$. **Blindtest:** vorhergesagt war ein Vorzeichenwechsel von $p_N(1)-T_e(\tfrac12)$ zwischen $N=216$ und $218$; gerechnet pendelt das Vorzeichen bei $215$–$218$
    und ist ab $219$ positiv.

    (iii) **Rand:** $|p_N(L)-L|\sim N^{-4.84}$; vorhergesagt aus der Ecke des Konvergenzgebiets $W=D\cup D(a_0,|L-a_0|)$ bei $L$ (Aussenwinkel $0.883\pi$): $N^{-\alpha(1+\operatorname{Re}\gamma)}=N^{-4.81}$.

    (iv) **Bis N = 1500:** Die lineare Projektion $\Pi_Nf_K$ bleibt auf $D$ unter $2.232651$, echte $p_N$ existieren (Newton quadratisch), es zeigt sich kein exponentieller Anteil
    (Rate unter $10^{-4}$ pro Grad).

    (v) **Andere Fälle:** Für $b^x$ mit $b=1.5,\,2,\,10$ und für $f\circ f\circ f=\exp$ konvergiert das Verfahren ebenso gegen Kneser, mit Exponent $1-2\operatorname{Re}\gamma_b$ (gemessen $\approx-27$ bei
    $b=1.5$, vorhergesagt $-27.5$; $\approx-11$ bei $b=2$, vorhergesagt $-10.2$). Auf dem äusseren Halbmond von $W$ konvergiert $p_N$ nur vorübergehend (bis $N\approx600$–$900$).
  einfach: >-
    Die Abweichung der Polynome von Knesers Lösung ist keine beliebige Fehlerwolke, sondern genau eine einzige „Störschwingung“ — dieselbe, durch die sich die anderen halben
    e-Funktionen von Knesers unterscheiden. Ihre Grösse fällt wie N hoch −7.9, und das Gesetz sagt sogar voraus, bei welchem Grad der Fehler das Vorzeichen wechselt.
  gegenbeispielsuche: >-
    Gerechnet bis N = 1500 (lineare Projektion und echte Lösungen), Vorzeichenwechsel als Blindtest vorhergesagt; nach exponentiellen Anteilen (Eckmode) gezielt gesucht
    (Rate < 1e-4 pro Grad). Auf dem Halbmond ausserhalb von D wurde Divergenz gefunden — dort behauptet die Vermutung nichts.
  experimente: [exp.polynom_team, exp.polynom_halbexp]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; erklärt teilweise durch Satz T im Modell (Schwanzsumme) und durch die Singularitätsformel an L.'
    f2_benutzte_voraussetzungen: '—'
    f3_spezialfall: 'Wie der Fehler des Miller-Algorithmus für Minimallösungen: Auswahl über das Verhältnis der Koeffizientenwachstümer.'
    f4_uebertragbar: 'Andere Basen und Drittel-Iterierte (bestätigt).'
    f5_neue_frage: 'Herleitung der Konstante K∞ und des Faktors N aus dem inneren Problem bei L.'
  bewertung: {richtigkeit: 'numerisch bis N = 1500, Blindtest bestanden', neuheit: vermutlich_neu, recherche: 'Forum-Spiegel (alle 1265 Themen) und Literatur (Walker 1991, Paulsen 2016): keine solche Fehleranalyse für Abschneide-Verfahren gefunden.', nutzen: 'Zeigt, was ein Beweis leisten muss: polynomiale, nicht geometrische Konvergenz, getragen von einem Modus.', nutzen_stufe: hoch}
  quellen: [{ref: team_polynom_halbexp, stelle: 'Stränge A (k3b, k9, R2), B (b09–b10), C, E'}]
  kanten:
    - {typ: stuetzt, ziel: kn.verm.polynom_halbexp}

- id: kn.beob.polynom_eckmode
  titel: 'Eckmode der abgeschnittenen Linearisierung: wächst wie e^{0.012N}, stört die Konvergenz aber nicht'
  art: beobachtung
  ebene: B
  status: numerisch
  niveau: forschung
  objekte: [superfunktion, fixpunkt_L]
  bereich: '$J_N$ Jacobi-Matrix des abgeschnittenen Systems an $f_K$ bzw. $p_N$; Gewichte $|L|^k$'
  aussage: |
    (i) $J_N^{-1}$ konvergiert eintragsweise gegen einen Grenzoperator $G$; im Inneren ist $|L|^{k-j}G_{kj}$ eine Toeplitz-Matrix mit dem **Sprungsymbol**
    $\sigma=f'(x)e^{-x}\cdot\mathbf 1[|f(x)|<|L|]$ auf $|x|=|L|$ (Sprung genau bei $\arg L$).

    (ii) $J_N^{-1}$ ist **nicht** gleichmässig beschränkt: in $\ell^1$ wächst die Norm logarithmisch, in gewichtetem $\ell^2$ setzen 1–3 **Eckmoden** ein, $\sigma_1\approx C\,N^{-0.82}e^{0.0120N}$
    (bis $N=1000$), alle übrigen Singulärwerte bleiben $\|\sigma\|_\infty=1.3663$.

    (iii) Ursache ist der **abstossende, drehende** Randfixpunkt $L$: Ein reelles kubisches Polynom mit Fixpunkten $L,\bar L$ und Multiplikator $\sqrt L$ reproduziert die Eckmode auf 3–5 %;
    ohne Abstossung (Möbius-Drehung, $|f'|=1$) oder ohne Drehung gibt es keine.

    (iv) Die Eckmode wird von **kohärenten** Eingaben kaum angeregt: ihr Anteil an $\Pi_Nf_K$ fällt von $8\cdot10^{-7}$ auf $8\cdot10^{-9}$ ($N=200\to1000$), an Pol-Antworten wächst er nur wie
    $N^{0.7}$. Zufällige Störungen werden dagegen um $\gtrsim1.17^N$ verstärkt — Beweise müssen kohärente Richtungen benutzen.
  einfach: >-
    Die Gleichungen haben eine Schwachstelle in der Nähe des Fixpunkts L, die mit dem Grad exponentiell wächst. Knesers Lösung „trifft“ diese Schwachstelle aber praktisch nicht —
    nur zufällige Fehler würden sie aufschaukeln. Darum funktioniert das Verfahren, und darum scheitern Beweise, die nur mit Grössenabschätzungen arbeiten.
  gegenbeispielsuche: >-
    Ob die Eckmode die Konvergenz bei grossen N kippt, wurde bis N = 1500 geprüft (Strang A): nein. Eine frühere Hochrechnung „Probleme ab N ≈ 5000“ wurde zurückgezogen.
  experimente: [exp.polynom_team]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; (i) ist ein numerisch gestütztes Argument, (iii) über Modelle belegt.'
    f2_benutzte_voraussetzungen: '—'
    f3_spezialfall: 'Endliche Abschnitte von Toeplitz-Operatoren mit stückweise stetigem Symbol (Gohberg–Feldman, Böttcher–Silbermann) — hier aber mit Komposition auf Γout, die Standardtheorie greift nicht.'
    f4_uebertragbar: 'Jede Basis b > η (drehender abstossender Fixpunkt).'
    f5_neue_frage: 'Geschlossene Herleitung der Rate 0.012 und des Randprofils der adjungierten Eckmode.'
  bewertung: {richtigkeit: 'numerisch bis N = 1000 (Eckmode) bzw. 1500 (Konvergenz)', neuheit: vermutlich_neu, recherche: 'Literatur zu Abschneide-Verfahren (Strang C): keine Analyse der Inversen gefunden.', nutzen: 'Erklärt, warum Normabschätzungen scheitern und welche Struktur ein Beweis braucht.', nutzen_stufe: mittel}
  quellen: [{ref: team_polynom_halbexp, stelle: 'Strang D (d05, d06, d18–d29), Strang A (R2), Strang B (b45, b46)'}]
  kanten:
    - {typ: korrigiert, ziel: kn.gescheitert.polynom_kantorovich}

- id: kn.verm.polynom_halbexp_eckmoden
  titel: 'Annahme (H): Pole nahe L regen die Eckmoden nur schwach an — die einzige offene Stelle des Beweises'
  art: vermutung
  ebene: B
  status: vermutung
  niveau: forschung
  objekte: [superfunktion, fixpunkt_L]
  bereich: '$\Pi^P_N$ Sekanten-Projektion an einer Fast-Lösung $P$ (bei $P=f_K$: $\Pi_N=J_N^{-1}T_NJ_\infty$); $E^P_N(\zeta,z)=\Pi^P_Nk_\zeta(z)-k_\zeta(z)$, $k_\zeta=1/(\zeta-z)$; $g$ Green-Funktion von $\mathbb C\setminus\bar W$'
  aussage: |
    Für alle grossen $N$ und alle Fast-Lösungen $P$ in der Kugel um $f_K$: (H-i) die Linearisierungen sind invertierbar; (H-ii) für $z\in\bar D$ und Pole $\zeta$ auf den Schlitzen bei
    $L,\bar L$ und einer festen Niveaulinie $\{g=d\}$ gilt $|E^P_N(\zeta,z)|\le C\,N^{\kappa}e^{-\varepsilon Ng(\zeta)}/\operatorname{dist}(\zeta,\bar W)$ mit $\kappa<4.69$; (H-iii) die Antwort auf $x^N$ ist stabil.

    Bei $P=f_K$ zerfällt (H-ii) in zwei lineare Aussagen: **(a′)** nach Abspalten der Eckmoden ist $\sigma_{r+1}((I+K_N)^{-1})\le1+o(1)$ ($K\delta=(\delta\circ f)/(f'\circ f)$), und **(E_L)** das
    Randprofil der adjungierten Eckmoden fällt zur Ecke hin schneller als $|\tau|^{1.13}$: $\sigma_i|\tilde V_i(\arg L+\tau)|\le CN^\kappa e^{\lambda(\tau)N}$, $\lambda\le A|\tau|^p$, $p>1/\alpha=1.13$.

    Gemessen: (a′) $1.0001$–$1.0002$ ($N\le400$); (E_L) $p\approx1.44$–$1.52$, Mittelwert $\int\lambda\,d\nu=0.086$ (Grenze 1, Reserve ≈ 11; $N\le1200$); Pol-Antworten bis $N=1000$.
  einfach: >-
    Alles andere am Beweis steht. Offen ist nur eine Aussage über eine einzige Stelle: Wie stark wird die exponentiell wachsende Schwachstelle der Gleichungen bei L von einem
    „Stoss“ ganz in der Nähe von L angeregt? Die Rechnungen sagen: viel schwächer als nötig. Ein Beweis fehlt.
  gegenbeispielsuche: >-
    Stärkere Fassungen sind numerisch FALSCH und deshalb nicht angenommen: gleichmässige Stabilität sup|J_N⁻¹| < ∞ (Eckmode) und die globale polynomiale Pol-Schranke (H*) (ab N ≈ 420–650).
    Die lokale Fassung (H) hält in allen Messungen bis N = 1200 mit Reserve. Phase 3: (H) verlangt Kontrolle bis an L; nach kn.beob.polynom_rand_plateau ist das für N ≳ 10¹⁰
    vermutlich falsch. Für die Fassung ohne Umgebungen von L tritt kn.verm.polynom_halbexp_kern an ihre Stelle.
  experimente: [exp.polynom_team]
  pruefung:
    f1_folgt_unmittelbar: 'Nein — eine Stabilitätsaussage für einen stark nicht-normalen abgeschnittenen Operator.'
    f2_benutzte_voraussetzungen: '—'
    f3_spezialfall: 'Pseudospektrale Fassung der Stabilität endlicher Abschnitte; im Möbius-Modell dieselbe Frage ohne Eckmode, dort ebenfalls offen.'
    f4_uebertragbar: 'Gleiche Form für andere Basen.'
    f5_neue_frage: 'Beweis über eine Grenzschicht-Beschreibung der Eckmode an der Abschneidekante (WKB) bzw. eine Parametrix „Toeplitz innen + Mellin bei L, L̄ + Eckteil“.'
  bewertung: {richtigkeit: 'numerisch, mit Reserve', neuheit: vermutlich_neu, recherche: 'Forum-Spiegel und Literatur zu finiten Abschnitten (Strang C): nicht gefunden.', nutzen: 'Einzige offene Annahme des Hauptsatzes.', nutzen_stufe: hoch}
  quellen: [{ref: team_polynom_halbexp, stelle: 'ARCHITEKTUR.md §5; Strang D §10–11, Strang C §13'}]
  kanten:
    - {typ: motiviert, ziel: kn.satz.polynom_halbexp_hauptsatz}

- id: kn.satz.polynom_halbexp_hauptsatz
  titel: 'Hauptsatz: aus Annahme (H) folgt, dass die Polynom-Wurzeln gegen Knesers halbe e-Funktion konvergieren'
  art: satz
  ebene: B
  status: bedingt
  bedingungen: [kn.verm.polynom_halbexp_eckmoden]
  niveau: forschung
  objekte: [superfunktion, kneser_T]
  bereich: '$p_N$ wie in kn.verm.polynom_halbexp, $D=\{|z|<|L|\}$'
  voraussetzungen:
    - {text: 'Knesers Struktursatz (K) — slog = u + ϑ(u) mit ϑ periodisch, beschränkt für Im → +∞', benutzt: ja, notiz: 'kn.konstr.kneser'}
    - {text: 'Annahme (H) über die Eckmoden', benutzt: ja, notiz: 'kn.verm.polynom_halbexp_eckmoden'}
    - {text: 'Startbedingung (A): der Zweig liegt bei einem N₀ in der Kugel B_{N₀}', benutzt: ja, notiz: 'endliche Rechnung; bis N = 300 geprüft, N ≤ 120 streng (Krawczyk)'}
  aussage: |
    Für alle $N\ge N_0$ hat das abgeschnittene System in der Kugel $B_N=\{p:\sup_{\bar D}|p-f_K|\le R_N\}$, $R_N=K_0C'N^{\kappa-4.69}$, **genau eine** Lösung $p^*_N$, und
    $\sup_{\bar D}|p^*_N-f_K|\le C'N^{\kappa-4.69}$. Mit (A) ist der stetig fortgesetzte Zweig $p_N=p^*_N$ für alle $N\ge N_0$. Also $p_N\to f_K$ **gleichmässig auf $\bar D$** —
    gemessen mit $\kappa\approx0$: am Rand wie $N^{-4.8}$, im Inneren wie $N^{-7.9}$.
  einfach: >-
    Das Forschungsteam hat den Beweis so weit gebaut, dass nur noch eine einzige lineare Aussage über die Schwachstelle der Gleichungen bei L fehlt. Gilt sie, dann konvergieren
    die Polynome für jeden Grad gegen Knesers halbe e-Funktion — genau wie in Janis’ Vermutung.
  beweis:
    art: skizze
    text: |
      1. (K) ⇒ (F): $f_K$ ist um $\bar W$ holomorph bis auf zwei Schlitze bei $L,\bar L$, der Sprung dort ist $O(|\zeta-L|^{5.447})$ (aus kn.satz.halbexp_singularitaet_L; Inklusionen mit arb).
      2. Lineare Aussage: $\Pi_Nf_K-f_K$ als Cauchy-Integral über Schlitze und Niveaulinie; die Pol-Antwort ist rational in $\zeta$ mit Polen nur in $0$ und $a_0$, also greifen Bernstein–Walsh
         und Poisson–Jensen; mit (H) ergibt das $\sup_{\bar D}|\Pi_Nf_K-f_K|=O(N^{\kappa-4.69})$.
      3. Nichtlinear (Satz H1): Jede Lösung in $B_N$ erfüllt $P-f=\lambda(\Pi^P_Nf-f)$ (Sekanten-Identität) — a-priori-Schranke strikt im Inneren; implizite Funktionen + Überlagerung über
         $\lambda\in[0,1]$ mit genau einem Blatt (bei $\lambda=0$ nur $Q=0$) geben Existenz und Eindeutigkeit, ohne eine Operatornorm von $J_N^{-1}$.
      4. Zweig (Satz H2): σ-Homotopie von $\mathrm{pad}(p_N)$ zu $p_{N+1}$ bleibt in $B_{N+1}$; Induktion ab $N_0$.
    luecken:
      - 'Annahme (H) ist offen (kn.verm.polynom_halbexp_eckmoden).'
      - 'Phase 3: (H) in der Form bis an L ist für astronomisch grosse N vermutlich falsch (kn.beob.polynom_rand_plateau); tragfähige Fassung: kn.satz.polynom_hauptsatz_kr0.'
      - 'Die Einzelbeweise stehen in forschung/polynom_halbexp/ARCHITEKTUR.md §4 und den Strang-Berichten; die Leitung hat sie nicht Zeile für Zeile nachgeprüft.'
      - 'Eine Prüfung (f_K(e^z) ∉ (−∞,0] auf dem linken Bogen) ist nur numerisch.'
  stuetzt_sich_auf: [kn.satz.halbexp_singularitaet_L, kn.konstr.kneser]
  experimente: [exp.polynom_team, exp.polynom_schranke]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; Kern sind Pol-Antworten (rational in ζ), Bernstein–Walsh/Poisson–Jensen und ein Überlagerungsargument statt Normabschätzungen.'
    f2_benutzte_voraussetzungen: '(K), (H), (A); weder gleichmässige Stabilität noch die Korridor-Bedingung noch die Form von slog(D).'
    f3_spezialfall: 'Schema „Konsistenz + kohärente Stabilität“ wie bei Galerkin-Verfahren, hier mit Stabilität nur entlang kohärenter Richtungen.'
    f4_uebertragbar: 'Auf andere Basen und gebrochene Iterierte (gleiche Architektur, andere Exponenten); im Möbius-Modell bis auf (H*)_M durchgezogen.'
    f5_neue_frage: 'Beweis von (H) — bzw. des Kerns der Fassung ohne Umgebungen von L (kn.verm.polynom_halbexp_kern).'
  bewertung: {richtigkeit: 'bedingt; Beweisarchitektur von fünf Forschungssträngen, nicht unabhängig nachgeprüft; numerisch bis N = 1500 gestützt', neuheit: vermutlich_neu, recherche: 'Für kein Abschneide-Verfahren, das gegen Kneser laufen soll, ist Konvergenz bewiesen (Walker 1991 §4, Paulsen 2016, Forum TPID 18; nur f(x) = bx bei Trappmann 2010).', nutzen: 'Führt die Vermutung auf eine einzige, präzise lineare Aussage zurück.', nutzen_stufe: hoch}
  quellen: [{ref: team_polynom_halbexp, stelle: 'ARCHITEKTUR.md §0, §4'}, {ref: walker1991, stelle: '§4: no proof of convergence is known'}, {ref: paulsen2016}, {ref: trappmann2010_intuitiv}]
  kanten:
    - {typ: stuetzt, ziel: kn.verm.polynom_halbexp}
    - {typ: verwandt, ziel: kn.satz.polynom_halbexp_reduktion}

- id: kn.satz.polynom_modelle
  titel: 'Modellprobleme: wo das Abschneide-Verfahren bewiesen konvergiert, und warum'
  art: satz
  ebene: B
  status: bewiesen
  niveau: forschung
  objekte: [superfunktion]
  bereich: 'Abschneide-Verfahren für $f\circ f=g$: Polynom $p$ vom Grad $N$ mit $[x^k]p\circ p=[x^k]g$, $k\le N$'
  aussage: |
    (i) **Kontraktiver Fall (Satz K, K′):** Hat die Lösung eine anziehende Lage (sie bildet eine Scheibe streng in sich ab), so ist $J_N^{-1}$ gleichmässig beschränkt und $p_N\to f$ geometrisch.
    Explizit, rechnergestützt mit arb: für $g=(3-x)/(8-3x)$ existiert der Zweig ab $p_1=\tfrac13+\tfrac x8$ für alle $N$, und $\|p_N-T_Nf\|_1\le7.71\cdot6^{-N-1}$ mit $f=1/(3-x)$.

    (ii) **Translationsmodell (Satz T):** Für $u(x+s)+u(x)=h$ ist die abgeschnittene Lösung exakt $u_N=\varphi_s(D)T_Nh$, $\varphi_s(z)=1/(1+e^{sz})$; sie konvergiert genau dann, wenn $h$ einen
    Exponentialtyp $<\pi/s$ hat, und zwar gegen die einzige Lösung kleinsten Typs. Haben Lösung und Kern denselben Typ, aber verschiedene Singularitätsstärke, fällt der Fehler wie
    $N^{1-\text{Lücke}}$ — genau die Form $N^{1-2\bar\gamma}$ des exp-Gesetzes samt Faktor $N$.

    (iii) **Möbius-Drehung:** Für die Drehung $g$ der projektiven Geraden ist $\Pi_Nf_M-f_M$ exakt eine einzige Pol-Antwort am Pol $\zeta_p$ der Möbius-Wurzel; $\zeta_p$ liegt genau dann im
    Konvergenzgebiet $\bar W$, wenn der Drehwinkel $c>\pi/3$ ist, und die Green-Funktion ist explizit.
  einfach: >-
    An einfacheren Gleichungen lässt sich das Verfahren ganz durchrechnen. Dort sieht man den Mechanismus in Reinform: Das Abschneiden wählt unter allen Lösungen die „ruhigste“ aus —
    und es scheitert, sobald die gewünschte Lösung selbst unruhiger ist als die Konkurrenz.
  beweis:
    art: vollstaendig
    text: |
      (i) Kompaktheit der Komposition auf der Scheibe ⇒ gleichmässige Stabilität ⇒ Kantorovich; K′ mit Ball-Arithmetik für alle N (Induktion mit expliziter Kontraktionskonstante).
      (ii) Die Verschiebung erhält die Polynome vom Grad ≤ N, also ist das Abschneiden überflüssig und $u_N=(I+e^{sD})^{-1}T_Nh$; die Taylor-Koeffizienten von $\varphi_s$ wachsen wie $(s/\pi)^n$
      (Pole bei $i\pi(2m+1)/s$), daraus Konvergenz, Divergenz und das Schwanzgesetz $-\sum_{n>N}c_nn!h_n\sim N^{-\sigma}$.
      (iii) Residuenrechnung im Cayley-Bild, in dem $f$ die lineare Abbildung $w\mapsto\lambda w$ wird.
  pruefung:
    f1_folgt_unmittelbar: '(ii) ja aus der exakten Formel; (i) mit rechnergestütztem Kern; (iii) Rechnung.'
    f2_benutzte_voraussetzungen: '(i) anziehende Lage — exp hat sie nicht; (ii) lineares Modell.'
    f3_spezialfall: '(i) Standard-Galerkin-Theorie; (ii) Miller-Algorithmus/Minimallösungen.'
    f4_uebertragbar: 'Der Mechanismus von (ii) und die Pol-Darstellung von (iii) übertragen sich wörtlich auf exp (in Abel-Koordinaten ist f eine Translation); die gleichmässige Stabilität von (i) nicht.'
    f5_neue_frage: 'Die Möbius-Fassung von (H) beweisen (dort ohne Eckmode, aber ebenfalls pseudospektral).'
  bewertung: {richtigkeit: 'vollständig (K′ rechnergestützt)', neuheit: vermutlich_neu, recherche: 'Trappmann 2010 beweist ein Abschneide-Verfahren nur für f(x) = bx; diese Modelle nicht gefunden.', nutzen: 'Prüfsteine und Vorbilder für den exp-Beweis.', nutzen_stufe: mittel}
  quellen: [{ref: team_polynom_halbexp, stelle: 'Strang E (e_modelle/BERICHT.md §3–5, Runden 2–3)'}]
  kanten:
    - {typ: analog_zu, ziel: kn.verm.polynom_halbexp}

- id: kn.beob.polynom_moebius_schwelle
  titel: 'Warnbeispiel Möbius-Drehung: knapp über der Schwelle sieht das Verfahren bis N ≈ 100 konvergent aus und kippt dann'
  art: beobachtung
  ebene: B
  status: numerisch
  niveau: vertiefung
  objekte: [superfunktion]
  bereich: 'Drehung $g$ der projektiven Geraden um nichtreelle Fixpunkte (keine reellen Fixpunkte, wie exp), Drehwinkel $c$; kanonische Wurzel = Drehung um $c/2$'
  aussage: |
    Unterhalb der Schwelle ($c<\pi/3$ im symmetrischen Fall) konvergiert $p_N$ geometrisch gegen die Möbius-Wurzel, mit der Rate $e^{-g(\zeta_p)}$ (Green-Funktion am Pol der Wurzel) und
    konstantem Vorfaktor; darüber läuft der Zweig weg — **knapp über der Schwelle erst nach scheinbarer Konvergenz bis $N\approx100$**. Im hyperbolischen Fall ($c=2$) springt der Zweig
    schon bei $N=1$ auf eine falsche Lösungsfamilie. Mit den Fixpunkten $L,\bar L$ („Möbius-exp“, fast Knesers Geometrie, aber ohne Eckmode) hält die lineare Pol-Schranke mit Konstante $1.01$.
  einfach: >-
    Ein Modell ohne reelle Fixpunkte zeigt, wie trügerisch Zahlen sein können: Bis Grad 100 sieht alles nach Konvergenz aus, und dann kippt es. Darum reichen auch bei eˣ gute Zahlen allein
    nicht — und darum wurde dort bis Grad 1500 gerechnet.
  pruefung:
    f1_folgt_unmittelbar: 'Schwelle ⇔ Pol in W bewiesen (Satz M2), Verhalten numerisch.'
    f2_benutzte_voraussetzungen: '—'
    f3_spezialfall: 'Wie das Forums-Warnbeispiel „intuitiv = regulär“ bei Basis √2 (tid 153), das bis Matrixgrösse 100 gleich aussah.'
    f4_uebertragbar: 'Bei exp liegt im Gebiet W kein Pol von f_K — nur L, L̄ auf dem Rand; deshalb bleibt nur der polynomiale Anteil.'
    f5_neue_frage: 'Negativrichtung beweisen (Konvergenz auf D erzwingt Konvergenz auf W).'
  bewertung: {richtigkeit: 'numerisch, Schwelle bewiesen', neuheit: vermutlich_neu, recherche: 'Literatur zu Abschneide-Verfahren (Strang C) und Forum-Spiegel: nur das verwandte √2-Warnbeispiel (tid 153).', nutzen: 'Prüfstein für jedes Beweisgerüst und Mahnung zur Vorsicht bei Zahlen.', nutzen_stufe: mittel}
  quellen: [{ref: team_polynom_halbexp, stelle: 'Strang E (m1*–m8*, r2_*, r3_*)'}]
  kanten:
    - {typ: verwandt, ziel: kn.satz.polynom_modelle}

- id: kn.satz.kneser_e_zertifiziert
  titel: 'Knesers Tetration zur Basis e rechnergestützt zertifiziert: Werte auf 1e-168, halbe e-Funktion mit Koeffizienten und Restschranke'
  art: satz
  ebene: C
  status: bewiesen
  niveau: forschung
  objekte: [kneser_T, superfunktion, fixpunkt_L]
  bereich: 'Kneser-sexp zur Basis $e$ auf dem Streifen $-\tfrac12\le\operatorname{Re}z\le\tfrac12$; $f_K=T_e(\operatorname{slog}x+\tfrac12)$ mit Taylor-Koeffizienten $a_k$ um 0, $\rho=|L|$'
  aussage: |
    (i) **Werte:** $\operatorname{sexp}_K=\tilde T\pm1.3\cdot10^{-168}$ für $|\operatorname{Im}z|\le0.45$ ($\tilde T$ reelles Polynom vom Grad 519) und $\operatorname{sexp}_K=\tilde U\pm1.3\cdot10^{-168}$
    für $\operatorname{Im}z\ge0.35$ ($\tilde U=P(L^{z+\tilde\theta})$ mit 241 Fourier-Moden); oberhalb $\operatorname{Im}z=0.36$ ist auch Knesers Strukturfunktion $\theta_K$ auf $4.4\cdot10^{-167}$ eingeschlossen.

    (ii) **Halbe e-Funktion:** $a_0,\dots,a_{640}$ mit Fehler$\cdot\rho^k\le2.9\cdot10^{-127}$; für **alle** $k$ gilt $|a_k|\rho^k\le461.36\,k^{-6}$; ausserdem $f_K(L)=L$ und $f_K'(L)=\sqrt L$.
  einfach: >-
    Knesers Lösung zur Basis e ist nicht mehr nur „sehr genau berechnet“, sondern mit garantierter Fehlergrenze bekannt — auf 168 Stellen. Für die halbe e-Funktion gibt es
    die ersten 641 Koeffizienten mit Garantie und eine bewiesene Schranke für alle übrigen.
  beweis:
    art: vollstaendig
    text: |
      1. Daten aus einem eigenen Cousin-Newton-Verfahren (Start vom Kneser-Motor), Residuen $2\cdot10^{-31}\to5\cdot10^{-169}$.
      2. Defekte von Band und Naht mit Taylor-Modellen und Maximumprinzip eingeschlossen ($\le6.5\cdot10^{-173}$); aus ihnen eine glatte Funktion $F_0$, die die Funktionalgleichung exakt erfüllt.
      3. Eine quasikonforme Glättung (Beltrami-Koeffizient $\le1.3\cdot10^{-171}$; Ahlfors–Bers, Stoilow) führt zu einer exakten Lösung; Identifikation mit Kneser über Paulsen–Cowgill.
      4. Koeffizienten aus 4096 Krawczyk-Auswertungen und DFT mit Aliasschranke; die Restschranke durch sechsfache partielle Integration auf $|z|=\rho$ mit eingeschlossenem $\partial_\theta^6f_K$.
    luecken:
      - 'Drei formale Lücken ohne Wirkung auf die Zahlen (Fehlerbudget in Prüfung B, eine Lipschitz-Schranke, Zweigtreue der DFT-Knoten), benannt in phase3/v_pruefstand/BERICHT §1.1.'
  stuetzt_sich_auf: [kn.konstr.kneser]
  experimente: [exp.polynom_phase3]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; rechnergestützter Existenz- und Einschlussbeweis mit Glättung.'
    f2_benutzte_voraussetzungen: 'Ahlfors–Bers, Stoilow, eine L⁴-Schranke der Beurling-Transformation, Paulsen–Cowgill (Eindeutigkeit).'
    f3_spezialfall: 'Schema „Näherungslösung + Defektschranke + quasikonforme Korrektur“.'
    f4_uebertragbar: 'Auf andere Basen b > η mit gleicher Programmkette.'
    f5_neue_frage: 'Einschlüsse für andere Basen und für gebrochene Iterierte allgemein.'
  bewertung: {richtigkeit: 'rechnergestützt bewiesen (Strang P), Schritte von Strang V gegengelesen; Restschranke (K2) von V gebaut und von K gegengelesen', neuheit: vermutlich_neu, recherche: 'Bisher nur numerische Werte (Paulsen–Cowgill, Forum, Kouznetsov); kein Einschluss mit Garantie gefunden.', nutzen: 'Macht die Startbedingung und alle Kneser-Eingaben des Polynom-Hauptsatzes streng.', nutzen_stufe: hoch}
  quellen: [{ref: team_polynom_halbexp, stelle: 'ARCHITEKTUR.md §9.8–§9.9 (Satz P-V, p26–p32a); phase3/v_pruefstand/BERICHT §1.1, §2.2 (K2)'}, {ref: paulsen_cowgill2017}]
  kanten:
    - {typ: stuetzt, ziel: kn.satz.polynom_hauptsatz_kr0}

- id: kn.satz.polynom_zweig_400
  titel: 'Der Polynom-Zweig ist bis zum Grad 400 streng zertifiziert und liegt dort 1e-12 nah an Knesers halber e-Funktion'
  art: satz
  ebene: C
  status: bewiesen
  niveau: forschung
  objekte: [superfunktion]
  bereich: '$p_N$ wie in kn.verm.polynom_halbexp'
  aussage: |
    Für jedes $N\le400$ existiert der von $p_1=x+\tfrac12$ stetig fortgesetzte Zweig und ist in einer expliziten Box eingeschlossen (Krawczyk, Kette $193\to400$ einzeln geprüft).
    Für $N_0\in[318,400]$ gilt $\sup_{\bar D}|p_{N_0}-f_K|\le3.6\cdot10^{-12}$, bei $N=400$ sogar $1.75\cdot10^{-12}$ — rund $10^8$-mal kleiner als der Kugelradius, den der bedingte Hauptsatz braucht.
  einfach: >-
    Bis zum Grad 400 ist mit dem Computer bewiesen, dass die gerechneten Polynome wirklich die richtigen sind und Knesers Funktion bis auf 12 Stellen treffen.
  beweis:
    art: vollstaendig
    text: |
      Krawczyk-Test je Übergang $N\to N+1$ mit Startbox $2^{-(N+150)}$ (Strang X, auf dem Server parallel); die Kette (Box von $N$ liegt im Startgebiet von $N+1$) separat geprüft (Strang V,
      eigener Code). Der Abstand zu $f_K$ über die zertifizierten Kneser-Koeffizienten (kn.satz.kneser_e_zertifiziert) und die Restschranke.
  stuetzt_sich_auf: [kn.satz.kneser_e_zertifiziert, kn.satz.polynom_halbexp_endlich]
  experimente: []
  pruefung:
    f1_folgt_unmittelbar: 'Nein; endliche, aber grosse rechnergestützte Prüfung.'
    f2_benutzte_voraussetzungen: 'Nur Intervallarithmetik und die zertifizierten Kneser-Werte.'
    f3_spezialfall: 'Fortsetzung von kn.satz.polynom_halbexp_endlich (dort N ≤ 120).'
    f4_uebertragbar: 'Mit mehr Rechenzeit auf höhere Grade (N ≈ 1000 braucht ≈ 2320 Bit).'
    f5_neue_frage: 'Wie weit trägt das, bevor die Verstärkung ≈ 1.17^N die Präzision sprengt?'
  bewertung: {richtigkeit: 'rechnergestützt bewiesen, Kette unabhängig geprüft', neuheit: vermutlich_neu, recherche: 'Fortsetzung der eigenen Arbeit (kn.satz.polynom_halbexp_endlich).', nutzen: 'Erfüllt die Startbedingung (A) des bedingten Hauptsatzes mit grosser Reserve.', nutzen_stufe: mittel}
  quellen: [{ref: team_polynom_halbexp, stelle: 'x_alternativen/zert/, phase3/v_pruefstand/BERICHT §2.1'}]
  kanten:
    - {typ: verallgemeinert, ziel: kn.satz.polynom_halbexp_endlich}
    - {typ: stuetzt, ziel: kn.satz.polynom_hauptsatz_kr0}

- id: kn.beob.polynom_konforme_stabilitaet
  titel: 'In der richtigen Koordinate verschwindet die Eckmode: die abgeschnittenen Gleichungen bleiben bis N = 2000 gleichmässig stabil'
  art: beobachtung
  ebene: B
  status: numerisch
  niveau: forschung
  objekte: [superfunktion, fixpunkt_L]
  bereich: '$\hat J_N=T_N^wC_kJ_N$: die Jacobi-Matrix in der konformen Koordinate $w$ von $\bar D\cup$ Linse über $\Gamma_{\rm in}$ ($k:\mathbb D\to$ Inneres, $k(0)=0$); Linsenhöhe $S$'
  aussage: |
    (i) Mit Linse $S=0.0166$ ist $\|\hat J_N^{-1}\|=1.251155$ für **jedes** gemessene $N=100\dots2000$ (kubisches Modell mit gleicher Ecke), $1.250337$ mit Knesers Koeffizienten
    und ebenso am echten $p_N$ bis $N=2000$ — während in der üblichen Koordinate $\|\tilde J_N^{-1}\|=1.852,\ 9.10,\ 70.7$ ($N=200,400,600$) exponentiell wächst.

    (ii) Die Linse muss überall über dem Wachstumsprofil $\Lambda(\tau)$ der Eckmode liegen (Schwelle $S^*\approx0.0118$, Kerben-Test blind vorhergesagt und bestätigt).
    Wegen des komplexen Exponenten $\kappa_1$ dreht sich das Eckmuster um $1.45^\circ\cdot\ln N$: eine **tangentiale** Linse verliert ab $N\approx1000$, eine Linse mit **Ecke** an $L$ bleibt stabil
    (faktorisierte Schur-Norm konstant $1.332$ bis $N=2000$).
  einfach: >-
    Die exponentiell wachsende Schwachstelle der Gleichungen ist zum grossen Teil eine Folge der Koordinaten, in denen man rechnet. Schreibt man die Gleichungen in einer an die Ecke
    angepassten Koordinate, bleibt alles gleichmässig gut lösbar — gemessen bis Grad 2000.
  gegenbeispielsuche: >-
    Gezielt gesucht: dünnere Linsen, Kerben im Profil, Keile, das echte p_N statt f_K, Grade bis 2000. Instabil wird es genau dann, wenn die Linse irgendwo unter Λ liegt oder
    tangential an L anliegt — beides vorhergesagt.
  experimente: [exp.polynom_phase3]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; numerischer Befund, unabhängig von zwei Strängen mit eigenem Code bestätigt.'
    f2_benutzte_voraussetzungen: '—'
    f3_spezialfall: 'Stabilität des Abschnittsverfahrens (Böttcher–Silbermann) — hier aber mit Kompositionstransport, die klassische Theorie greift nicht direkt.'
    f4_uebertragbar: 'Jede Basis b > η; jedes kubische Modell mit gleichem μ.'
    f5_neue_frage: 'Beweis der gleichmässigen Stabilität; sie enthält die offene Eckaussage (kn.verm.polynom_halbexp_kern).'
  bewertung: {richtigkeit: 'numerisch bis N = 2000, zwei unabhängige Programme', neuheit: vermutlich_neu, recherche: 'Keine Analyse dieser Abschnitte in der Literatur gefunden (Phasen 1–3).', nutzen: 'Zeigt, dass die Eckmode kein Hindernis der Sache, sondern der Darstellung ist.', nutzen_stufe: mittel}
  quellen: [{ref: team_polynom_halbexp, stelle: 'phase3/k_kern/BERICHT §3–§5, phase3/v_pruefstand/BERICHT §3.1–3.2, §3.12–3.13'}]
