gebiet: kn
aussagen:

- id: kn.gescheitert.regulaer_an_L
  titel: Reguläre Iteration am komplexen Fixpunkt L ist nicht reell
  art: gescheitert
  ebene: C
  status: gescheitert
  objekte: [regulaer_T, fixpunkt_L, schroeder]
  bereich: '$b>\eta$, primärer Fixpunkt $L$ mit $|\lambda|>1$'
  aussage: |
    Naheliegender Ansatz: Koenigs-Funktion an $L$ (für $\log_b$, anziehend) und $T:=\sigma^{-1}(\lambda^{x}c)$.
    Das ergibt eine holomorphe Superfunktion, die auf der reellen Achse **nicht reell** ist: $L$ und $\bar L$ sind
    gleichberechtigt, die Wahl von $L$ bricht die Symmetrie $T(\bar z)=\overline{T(z)}$.
  beweis: {art: vollstaendig, text: 'Für $|\lambda|>1$ gilt $\lambda^{x}\to0$ für $x\to-\infty$, also $F(x)=\sigma^{-1}(\lambda^x c)\to L\notin\mathbb R$. Eine auf ganz $\mathbb R$ reelle Funktion kann nicht gegen $L$ streben.'}
  pruefung:
    f1_folgt_unmittelbar: Ja.
    f2_benutzte_voraussetzungen: '$\ln\lambda\notin\mathbb R$, d. h. $L$ nicht reell — genau der Fall $b>\eta$.'
    f3_spezialfall: nein
    f4_uebertragbar: 'Gilt an jedem nichtreellen Fixpunkt.'
    f5_neue_frage: 'Korrektur durch eine 1-periodische Funktion, die die Realität wiederherstellt → kn.konstr.kneser'
  bewertung: {richtigkeit: vollständig, neuheit: klassisch, nutzen: 'Erklärt, warum Kneser eine Riemann-Abbildung braucht.', nutzen_stufe: mittel}
  quellen: [{ref: kneser1950}, {ref: diese_arbeit}]
  kanten:
    - {typ: motiviert, ziel: kn.konstr.kneser}

- id: kn.konstr.kneser
  titel: Knesers Konstruktion
  art: konstruktion
  ebene: C
  status: bewiesen_literatur
  objekte: [kneser_T, schroeder, theta_kneser, riemann_abbildung, fixpunkt_L]
  bereich: 'ursprünglich $b=e$ (halbe Iterierte von $e^x$), allgemein $b>\eta$'
  voraussetzungen:
    - {text: 'b > η reell', benutzt: ja}
  aussage: |
    Aus der Abel-Koordinate $\chi=\log\sigma/\log\lambda$ am Fixpunkt $L$ entsteht durch eine Riemann-Abbildung
    eine 1-periodische Korrektur $\theta_K$ (holomorph in der oberen Halbebene, $\theta_K\to$ const für $\operatorname{Im}\to+\infty$),
    so dass $\operatorname{slog}=\chi+\theta_K(\chi)$ auf der reellen Achse reell ist. Ergebnis: eine reell-analytische,
    streng wachsende Lösung von $\varphi(\varphi(x))=e^x$ bzw. eine reell-analytische Tetration.
  beweis: {art: literatur, text: 'Kneser 1950; numerisch: Kouznetsov 2009 (Cauchy-Integral), Levenstein fatou.gp (Theta-Iteration).'}
  stuetzt_sich_auf: [it.satz.koenigs, fg.satz.schroeder_abel, fp.satz.lambert]
  quellen: [{ref: kneser1950}, {ref: kouznetsov2009}, {ref: levenstein_fatou}]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; die Riemann-Abbildung ist der wesentliche Schritt.'
    f2_benutzte_voraussetzungen: 'Fixpunktpaar $L,\bar L$ nichtreell, abstossend.'
    f3_spezialfall: 'Methode für Abel-Funktionen an komplexen Fixpunktpaaren allgemein (Trappmann–Kouznetsov).'
    f4_uebertragbar: 'Auf komplexe Basen (Paulsen 2019) und auf andere Funktionen mit nichtreellem Fixpunktpaar.'
    f5_neue_frage: 'Wie hängt $\theta_K$ von der Basis ab? → bw.def.auswahlprinzip (Paper V)'
  bewertung: {richtigkeit: gesichert (Literatur), neuheit: klassisch, nutzen: 'Die Standardlösung für b > η.', nutzen_stufe: hoch}
  kanten:
    - {typ: uebertragbar_auf, ziel: kn.satz.paulsen_komplex}

- id: kn.satz.kneser_eigenschaften
  titel: Komplexe Eigenschaften der Kneser-Tetration
  art: satz
  ebene: C
  status: bewiesen_literatur
  objekte: [kneser_T, fixpunkt_L, singularitaet_m2]
  bereich: '$b>\eta$'
  voraussetzungen:
    - {text: 'T = Kneser-Lösung zur Basis b > η', benutzt: ja}
  aussage: |
    $T_b^{\mathrm K}$ ist holomorph auf $\mathbb C\setminus(-\infty,-2]$, erfüllt $T(\bar z)=\overline{T(z)}$ und
    $T(x+iy)\to L$ für $y\to+\infty$, $\to\bar L$ für $y\to-\infty$ (für jedes feste $x>-2$).
  beweis: {art: literatur, text: 'Kouznetsov 2009, Paulsen–Cowgill 2017.'}
  stuetzt_sich_auf: [kn.konstr.kneser]
  quellen: [{ref: paulsen_cowgill2017}, {ref: kouznetsov2009}]
  pruefung:
    f1_folgt_unmittelbar: Nein.
    f2_benutzte_voraussetzungen: 'Genaue Herkunft jeder Teilaussage nicht am Original geprüft.'
    f3_spezialfall: nein
    f4_uebertragbar: 'Komplexe Basen mit angepasstem Schnitt (Paulsen 2019).'
    f5_neue_frage: 'Diese Eigenschaften charakterisieren die Lösung → kn.satz.paulsen_cowgill'
  bewertung: {richtigkeit: 'gesichert (Literatur), Detailzuordnung ungeprüft', neuheit: bekannt, nutzen: 'Liefert die Eindeutigkeitsbedingungen.', nutzen_stufe: hoch}

- id: kn.satz.paulsen_cowgill
  titel: Eindeutigkeit (Paulsen–Cowgill, Prop. 2)
  art: satz
  ebene: B
  status: bewiesen_literatur
  objekte: [T_b, kneser_T, fixpunkt_L]
  bereich: '$b>\eta$, $H_{-2}=\{\operatorname{Re}z>-2\}$'
  voraussetzungen:
    - {text: 'F_1, F_2 holomorph auf Re z > −2', benutzt: ja}
    - {text: 'F_j(z+1) = b^{F_j(z)} und F_j(0) = 1', benutzt: ja}
    - {text: 'für jedes x > −2: F_j(x+iy) → L für y → +∞ und → L̄ für y → −∞', benutzt: ja, notiz: 'beide vertikalen Grenzwerte sind Voraussetzung; Konjugationssymmetrie ersetzt den unteren nicht'}
  aussage: 'Dann ist $F_1=F_2$ auf $H_{-2}$. Die Kneser-Lösung erfüllt die Bedingungen, ist also die einzige solche.'
  beweis: {art: literatur, text: 'Paulsen–Cowgill 2017, Prop. 2. Mechanismus: $F_2=F_1\circ(\mathrm{id}+\theta)$, θ periodisch, und die Grenzwerte zwingen θ zur Beschränktheit in beiden Halbebenen.'}
  stuetzt_sich_auf: [fg.lem.periodisch_liouville]
  quellen: [{ref: paulsen_cowgill2017, stelle: 'Prop. 2', geprueft: sekundaer}, {ref: justus_p6, stelle: 'Thm. 11.11 (Wiedergabe)'}]
  pruefung:
    f1_folgt_unmittelbar: 'Kern ja (fg.lem.periodisch_liouville); technisch ist zu zeigen, dass $F_1^{-1}\circ F_2$ auf einem Streifen definiert ist.'
    f2_benutzte_voraussetzungen: 'Beide Grenzwerte; Holomorphie nur auf der Halbebene, nicht auf der geschlitzten Ebene.'
    f3_spezialfall: 'Verwandt mit Trappmann–Kouznetsov (Abel-Funktionen an Fixpunktpaaren).'
    f4_uebertragbar: 'Auf komplexe Basen (Paulsen 2019); in Paper V/VI als Identifikationswerkzeug benutzt (bw.satz.zertifikat_kette).'
    f5_neue_frage: 'Gibt es eine reelle Kennzeichnung? → br.frage.bohr_mollerup'
  bewertung: {richtigkeit: gesichert (Literatur), neuheit: bekannt, nutzen: 'Macht „die“ Kneser-Tetration wohldefiniert.', nutzen_stufe: hoch}
  kanten:
    - {typ: analog_zu, ziel: kn.satz.trappmann_kouznetsov}

- id: kn.satz.trappmann_kouznetsov
  titel: Eindeutigkeit holomorpher Abel-Funktionen an einem Fixpunktpaar
  art: satz
  ebene: B
  status: bewiesen_literatur
  objekte: [abel, slog, fixpunkt_L]
  bereich: 'Funktionen mit einem Paar nichtreeller Fixpunkte, insbesondere $\exp_b$, $b>\eta$'
  voraussetzungen:
    - {text: 'Eindeutigkeitstest von Trappmann–Kouznetsov (Wortlaut nicht geprüft)', benutzt: unklar}
  aussage: |
    Es gibt ein Eindeutigkeitskriterium für holomorphe Abel-Funktionen an einem komplexen Fixpunktpaar;
    Knesers Abel-Funktion für $\exp$ erfüllt es, ebenso für $b>\eta$.
  beweis: {art: literatur, text: 'Trappmann–Kouznetsov 2011.'}
  stuetzt_sich_auf: [fg.lem.periodisch_liouville]
  quellen: [{ref: trappmann_kouznetsov2011}]
  pruefung:
    f1_folgt_unmittelbar: Nein.
    f2_benutzte_voraussetzungen: 'Am Original zu prüfen.'
    f3_spezialfall: nein
    f4_uebertragbar: 'Auf andere Funktionen mit Fixpunktpaar (laut Abstract).'
    f5_neue_frage: 'Verhältnis der beiden Kriterien (PC vs. TK) — äquivalent?'
  bewertung: {richtigkeit: 'gesichert (Literatur), Wortlaut ungeprüft', neuheit: bekannt, nutzen: 'Zweite unabhängige Eindeutigkeitsbegründung.', nutzen_stufe: mittel}

- id: kn.satz.paulsen_komplex
  titel: Tetration für komplexe Basen, holomorph in der Basis
  art: satz
  ebene: C
  status: bewiesen_literatur
  objekte: [kneser_T, fixpunkt_L]
  bereich: 'komplexe Basen ausserhalb eines Ausnahmebereichs'
  voraussetzungen:
    - {text: 'Basis im Gültigkeitsbereich von Paulsen 2019 (nicht am Original geprüft)', benutzt: unklar}
  aussage: |
    Die Kneser-Konstruktion setzt sich auf komplexe Basen fort; die Lösung hängt holomorph von $b$ ab.
    Paper V benutzt das als (K3) zur Identifikation $V=\partial_\beta A_b$.
  beweis: {art: literatur, text: 'Paulsen 2019.'}
  stuetzt_sich_auf: [kn.konstr.kneser]
  quellen: [{ref: paulsen2019}]
  pruefung:
    f1_folgt_unmittelbar: Nein.
    f2_benutzte_voraussetzungen: 'Am Original zu prüfen (welche Basen genau).'
    f3_spezialfall: nein
    f4_uebertragbar: —
    f5_neue_frage: 'Basisableitung $\partial_\beta\operatorname{slog}_b$ ist wohldefiniert → bw.satz.antwortkern'
  bewertung: {richtigkeit: 'gesichert (Literatur), Bereich ungeprüft', neuheit: bekannt, nutzen: 'Trägt die Störungstheorie in der Basis.', nutzen_stufe: hoch}
  kanten:
    - {typ: stuetzt, ziel: bw.ann.basis_diffbar, notiz: 'liefert Differenzierbarkeit von A_b, nicht die gleichmässige Vertauschung des Grenzwerts'}

- id: kn.def.slog
  titel: Superlogarithmus
  art: definition
  ebene: B
  niveau: einstieg
  status: definition
  objekte: [slog, abel]
  aussage: |
    Für eine streng wachsende Tetration $T_b$ ist $\operatorname{slog}_b:=T_b^{-1}:\mathbb R\to(-2,\infty)$; er erfüllt
    $\operatorname{slog}_b(b^x)=\operatorname{slog}_b(x)+1$ und $\operatorname{slog}_b(1)=0$.

- id: kn.satz.singulaer_minus2
  titel: Logarithmische Singularität bei −2
  art: satz
  ebene: A
  niveau: einstieg
  einfach: >-
    Kurz vor −2 sieht jede glatte Tetration aus wie ein Logarithmus und fällt nach minus unendlich.
  status: bewiesen
  objekte: [T_b, singularitaet_m2]
  bereich: 'reelle Lösungen auf $(-2,-1]$, $b>0$, $b\ne1$'
  voraussetzungen:
    - {text: 'T reelle Lösung mit T(0)=1 auf (−2,0]', benutzt: ja}
    - {text: 'T differenzierbar in −1 (nur im Punkt)', benutzt: ja}
    - {text: 'T′(−1) ≠ 0', benutzt: ja, notiz: 'impliziert T′(−1) > 0, weil T(−1+ε) = b^{T(−2+ε)} > 0'}
    - {text: 'T differenzierbar in einer Umgebung von −1 (Paper I)', benutzt: nein}
  aussage: |
    $$T(-2+\varepsilon)=\frac{\ln\varepsilon}{\ln b}+\frac{\ln T'(-1)}{\ln b}+o(1),\qquad \varepsilon\to0^+ .$$
  beweis:
    art: vollstaendig
    text: '$T(-1+\varepsilon)=T''(-1)\varepsilon+o(\varepsilon)$ und $b^{T(-2+\varepsilon)}=T(-1+\varepsilon)$; logarithmieren.'
  quellen: [{ref: justus_p1, stelle: 'Prop. 7.1'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja: Funktionalgleichung + Taylor erster Ordnung.'
    f2_benutzte_voraussetzungen: 'Nur Differenzierbarkeit **im Punkt** −1 und $T''(-1)\ne0$; Paper I fordert eine Umgebung — unnötig. Das Vorzeichen $T''(-1)>0$ folgt automatisch.'
    f3_spezialfall: 'Ja: für jede Superfunktion $F$ von $f$ mit $F(x_0)=$ Randwert von $f$ gibt $f^{-1}$ die Singularität ($\log_b$ bei 0).'
    f4_uebertragbar: 'Auf alle Konstruktionen (Kneser, regulär, Walker); linear: $T''(-1)=1$ ⇒ $T(-2+\varepsilon)=\log_b\varepsilon$ exakt.'
    f5_neue_frage: 'Höhere Terme (Korollar 7.2 in Paper I braucht $T''''(-1)$); komplexe Version: Verzweigung bei −2 → Schnitt $(-\infty,-2]$.'
  bewertung: {richtigkeit: vollständig, neuheit: folklore, nutzen: 'Beschreibt den Rand jeder Tetration.', nutzen_stufe: mittel}
  experimente: [exp.singulaer]
  versionen:
    - {datum: '2026-06', fassung: 'Paper I, Prop. 7.1', aenderung: 'Voraussetzung: differenzierbar in einer Umgebung von −1.'}
    - {datum: '2026-10-08', fassung: 'Graph', aenderung: 'Abgeschwächt auf Differenzierbarkeit im Punkt; Vorzeichen als Folgerung.', grund: 'Prüffrage 2'}
  kanten:
    - {typ: folgt_unmittelbar_aus, ziel: fg.lem.ganzzahlwerte}

- id: kn.kor.basisvergleich
  titel: Basenvergleich an der Singularität
  art: korollar
  ebene: A
  status: bewiesen
  objekte: [T_b, singularitaet_m2]
  bereich: 'zwei Basen $b,c>0$, $\ne1$'
  voraussetzungen:
    - {text: 'T_b, T_c erfüllen die Voraussetzungen von kn.satz.singulaer_minus2', benutzt: ja, ref: kn.satz.singulaer_minus2}
  aussage: '$\displaystyle\lim_{\varepsilon\to0^+}\frac{T_b(-2+\varepsilon)}{T_c(-2+\varepsilon)}=\frac{\ln c}{\ln b}$.'
  beweis: {art: vollstaendig, text: 'Durch $\ln\varepsilon$ teilen.'}
  stuetzt_sich_auf: [kn.satz.singulaer_minus2]
  quellen: [{ref: justus_p1, stelle: 'Prop. 7.3'}]
  pruefung:
    f1_folgt_unmittelbar: Ja.
    f2_benutzte_voraussetzungen: 'Nur der führende Term; die Konstanten fallen weg.'
    f3_spezialfall: Ja, von kn.satz.singulaer_minus2.
    f4_uebertragbar: Alle Konstruktionen.
    f5_neue_frage: Keine neue — reine Folgerung.
  bewertung: {richtigkeit: vollständig, neuheit: nur_schreibweise, nutzen: 'Gering; eigenständiger Inhalt fehlt.', nutzen_stufe: gering}

- id: kn.konstr.linear
  titel: Lineare Tetration
  art: konstruktion
  ebene: C
  niveau: einstieg
  einfach: >-
    Die einfachste Tetration: zwischen −1 und 0 eine gerade Linie, der Rest ergibt sich aus der Gleichung. Sie hat Knicke an den ganzen Stellen.
  status: bewiesen
  objekte: [T_b]
  bereich: '$b>1$'
  aussage: '$T(x)=x+1$ auf $(-1,0]$, sonst durch die Gleichung fortgesetzt. Stetige, streng wachsende Lösung.'
  beweis: {art: vollstaendig, text: 'Fortsetzung durch $T(x+1)=b^{T(x)}$ und $T(x-1)=\log_b T(x)$; Stetigkeit bei 0: $T(0^+)=b^{T(-1^+)}=b^0=1$.'}
  quellen: [{ref: hooshmand2006}, {ref: diese_arbeit}]
  pruefung:
    f1_folgt_unmittelbar: Ja.
    f2_benutzte_voraussetzungen: Keine.
    f3_spezialfall: 'Jede Wahl einer stetigen Startfunktion auf einer Periode mit passenden Randwerten gibt eine Lösung.'
    f4_uebertragbar: —
    f5_neue_frage: 'Glattheit an den Nahtstellen → kn.satz.linear_glatt'
  bewertung: {richtigkeit: vollständig, neuheit: klassisch, nutzen: 'Einfachste Vergleichslösung.', nutzen_stufe: gering}

- id: kn.satz.linear_glatt
  titel: Lineare Tetration ist genau für b = e stetig differenzierbar, nie C²
  art: gegenbeispiel
  ebene: C
  status: bewiesen
  objekte: [T_b]
  bereich: 'lineare Tetration, $b>1$'
  aussage: |
    $T'(0^-)=1$, $T'(0^+)=\ln b$: $C^1$ genau für $b=e$. Für $b=e$ ist $T''(0^-)=0\ne1=T''(0^+)$, also nie $C^2$.
  beweis: {art: vollstaendig, text: 'Auf $(0,1]$ ist $T(x)=b^{x}$, also $T''(0^+)=\ln b$, $T''''(0^+)=\ln^2 b$.'}
  stuetzt_sich_auf: [kn.konstr.linear]
  quellen: [{ref: diese_arbeit}]
  pruefung:
    f1_folgt_unmittelbar: Ja.
    f2_benutzte_voraussetzungen: Nur die Definition.
    f3_spezialfall: 'Paper IV Prop. 4.1: $C^m$-Nähte ⇒ Fourier-Abfall $k^{-(m+2)}$ — die lineare Tetration ist das Testobjekt mit $m=0$ (bzw. 1 bei $b=e$).'
    f4_uebertragbar: 'Analog: jede stückweise definierte Konstruktion hat endliche Glattheit, solange die Nahtbedingungen nicht alle Ordnungen erfüllen (Walker: alle Ordnungen).'
    f5_neue_frage: 'Wie zeigt sich die Naht in den Basiswechsel-Phasen? (bw.satz.fourier_naht)'
  bewertung: {richtigkeit: vollständig, neuheit: folklore, nutzen: 'Gegenbeispiel: Monotonie + C¹ reichen nicht für Eindeutigkeit oder Glattheit.', nutzen_stufe: gering}
  kanten:
    - {typ: verwandt, ziel: bw.satz.fourier_naht}

- id: kn.satz.hooshmand
  titel: Hooshmands Eindeutigkeitssatz für die ultra-exponentielle Funktion
  art: satz
  ebene: B
  status: bewiesen_literatur
  objekte: [T_b, konvexitaet]
  bereich: 'Basis $0<a\ne1$, $f$ stetig auf $(-2,\infty)$; zweiter Satz für $a=e$'
  voraussetzungen:
    - {text: 'f(x) = a^{f(x−1)} für x > −1 und f(0) = 1', benutzt: ja}
    - {text: 'f differenzierbar auf (−1, 0), f′ dort monoton', benutzt: ja}
    - {text: 'Nahtbedingung f′(0⁺) = ln(a)·f′(0⁻) oder f′(−1⁺) = f′(0⁻)', benutzt: ja}
  aussage: |
    **Erster Satz.** Unter diesen Bedingungen ist $f$ eindeutig, und zwar die lineare Tetration $f(x)=\exp_a^{\lfloor x\rfloor+1}(\{x\})$.
    **Zweiter Satz** (Basis $e$): Ist $f(x)=e^{f(x-1)}$, $f(0)=1$, $f$ konvex auf $(-1,0)$ und $f'(0^-)\le f'(0^+)$, dann ist $f$ die lineare Tetration.
    Folge: Die lineare Tetration ist die einzige auf $(-1,\infty)$ konvexe Lösung; jede andere hinreichend glatte Lösung hat einen **Wendepunkt in $(-1,0)$**.
  beweis: {art: literatur, text: 'Hooshmand 2006; Wortlaut nach Wikipedia (en). Kern: die Bedingungen erzwingen, dass f auf [−1, 0] eine Gerade ist.'}
  quellen: [{ref: hooshmand2006}, {ref: wikipedia_tetration, stelle: 'Abschnitt „Linear approximation for real heights“'}, {ref: tetrationforum, stelle: 'Thread „Hooshmand''s extension of tetration“'}]
  pruefung:
    f1_folgt_unmittelbar: 'Fast: monotones f′ auf (−1,0) plus Nahtbedingung lässt nur eine konstante Steigung zu; das Original ist nicht gelesen.'
    f2_benutzte_voraussetzungen: 'Monotonie von f′ auf einem Intervall und eine Nahtbedingung; keine Glattheit an den ganzen Stellen.'
    f3_spezialfall: 'Reelles Eindeutigkeitskriterium vom Konvexitätstyp, wie Bohr–Mollerup für Γ.'
    f4_uebertragbar: 'Folge für glatte Lösungen: Kneser zur Basis e hat seinen Wendepunkt bei −0.5218, also in (−1, 0) (gr.beob.wendepunkte) — wie vorhergesagt.'
    f5_neue_frage: 'Zeigt, dass reelle Eindeutigkeitsbedingungen eine nicht-analytische Lösung auswählen können → br.frage.bohr_mollerup'
  bewertung: {richtigkeit: 'Literatur; Wortlaut über Sekundärquelle (Wikipedia), Original nicht gelesen', neuheit: bekannt, nutzen: 'Beispiel für ein reelles Kriterium; erklärt, warum glatte Lösungen in (−1,0) einen Wendepunkt haben.', nutzen_stufe: mittel}
  versionen:
    - {datum: '2026-10-08', fassung: 'Graph', aenderung: 'Wortlaut der beiden Sätze aus Wikipedia eingetragen (vorher „ungeprüft“); Wendepunkt-Folge ergänzt.'}
  stuetzt_sich_auf: [kn.konstr.linear]
  kanten:
    - {typ: verwandt, ziel: gr.beob.wendepunkte, notiz: 'jede glatte nichtlineare Lösung hat einen Wendepunkt in (−1, 0)'}

- id: kn.konstr.walker
  titel: Walkers C^∞-Lösungen
  art: konstruktion
  ebene: C
  status: bewiesen_literatur
  objekte: [T_b, slog]
  bereich: 'verallgemeinerte Logarithmen/Exponentiale'
  aussage: |
    Walker konstruiert unendlich oft differenzierbare Lösungen (verallgemeinerte Exponential- und Logarithmusfunktionen) als Grenzwert
    $\operatorname{dexp}^{-n}\circ\exp^{n}$ mit $\operatorname{dexp}(x)=e^x-1$ — ein Basiswechsel-artiger Grenzwert von der parabolischen Iteration von
    $e^x-1$ zu $\exp$. Bewiesen ist $C^\infty$ auf der reellen Achse; Analytizität ist nicht bewiesen und wird im Tetration-Forum bezweifelt.
  beweis: {art: literatur, text: 'Walker 1991; DLMF §4.12 zitiert Walker für C^∞, Kneser für analytisch. Form des Grenzwerts nach Trappmann im Tetration-Forum (2009).'}
  quellen: [{ref: walker1991}, {ref: forum_trappmann2009, stelle: 'Walkers Grenzwert dexp^−n ∘ exp^n, nur reell C^∞'}, {ref: forum_levenstein2011, stelle: 'Vermutung: nirgends analytisch'}]
  pruefung:
    f1_folgt_unmittelbar: Nein.
    f2_benutzte_voraussetzungen: 'Am Original zu prüfen.'
    f3_spezialfall: 'Gleiche Bauart wie der Basiswechsel zwischen zwei Basen (bw.def.F_bd): Logarithmen einer fremden Superfunktion iterieren.'
    f4_uebertragbar: —
    f5_neue_frage: 'Ist Walkers Lösung = Kneser? Vermutlich nicht einmal analytisch (bw.verm.nirgends_analytisch).'
  bewertung: {richtigkeit: 'gesichert (Literatur), Details ungeprüft', neuheit: bekannt, nutzen: 'Zwischenstufe zwischen linear und analytisch; Modellfall für Basiswechsel-Grenzwerte.', nutzen_stufe: mittel}
  versionen:
    - {datum: '2026-10-08', fassung: 'Graph', aenderung: 'Form des Grenzwerts und Forum-Vermutung eingetragen.'}
  kanten:
    - {typ: analog_zu, ziel: bw.def.F_bd, notiz: 'Grenzwert iterierter Logarithmen einer fremden Superfunktion'}

- id: kn.konstr.carleman
  titel: Intuitiver slog über abgeschnittene Carleman-Systeme
  art: konstruktion
  ebene: C
  status: bewiesen
  objekte: [slog, carleman, abel]
  bereich: '$b=e$; Ansatz $\operatorname{slog}_n(x)=-1+\sum_{k=1}^{n}a_k x^k$'
  aussage: |
    Koeffizientenvergleich in $\operatorname{slog}(e^x)-\operatorname{slog}(x)=1$ bis Grad $n-1$ gibt das lineare System
    $\sum_{k=1}^{n}a_k\,k^j/j!-a_j=\delta_{j0}$ $(0\le j\le n-1)$. Seine Lösung definiert $\operatorname{slog}_n$
    (Walker 1991, Robbins 2005 „natural slog“).
  beweis: {art: vollstaendig, text: 'Konstruktion; Lösbarkeit für jedes n numerisch beobachtet, nicht allgemein bewiesen.'}
  quellen: [{ref: walker1991}, {ref: robbins2005}]
  experimente: [exp.carleman]
  pruefung:
    f1_folgt_unmittelbar: Ja (Definition).
    f2_benutzte_voraussetzungen: 'Entwicklung um 0; $e^{kx}$ in Potenzreihe.'
    f3_spezialfall: 'Galerkin-Verfahren für die Abel-Gleichung.'
    f4_uebertragbar: 'Andere Basen, andere Funktionen mit Fixpunkt ausserhalb des Entwicklungspunkts.'
    f5_neue_frage: 'Konvergiert $\operatorname{slog}_n$, und gegen Kneser? → kn.verm.carleman_kneser'
  bewertung: {richtigkeit: 'als Definition vollständig', neuheit: bekannt, nutzen: 'Rein algebraische Konstruktion ohne komplexe Geometrie.', nutzen_stufe: mittel}

- id: kn.verm.carleman_kneser
  titel: Intuitiver slog konvergiert gegen Knesers slog
  art: vermutung
  ebene: C
  status: vermutung
  objekte: [slog, carleman, kneser_T]
  bereich: '$b=e$, $|x|<|L_e|\approx1.3746$'
  aussage: '$\operatorname{slog}_n(x)\to\operatorname{slog}^{\mathrm K}_e(x)$ für $n\to\infty$.'
  gegenbeispielsuche: |
    exp.carleman: Systeme $n=4\dots128$ (bis 720 Stellen), Vergleich an 5 Punkten mit Kneser-Referenzwerten (gp-tetration, 80 Stellen).
    Fehler sinkt ohne Stagnation von $1.7\cdot10^{-5}$ ($n=16$) auf $9\cdot10^{-9}$ ($n=128$) — aber nur **algebraisch** ($\approx n^{-3.8}$).
    Kein Gegenbeispiel; die vorab erwarteten 10 Stellen bei $n=128$ wurden nicht erreicht.
  experimente: [exp.carleman]
  stuetzt_sich_auf: [kn.konstr.carleman]
  quellen: [{ref: tetrationforum, stelle: 'Helms: 5–10+ Stellen; Walker stellt die Frage'}, {ref: walker1991}, {ref: forum_tpid, stelle: 'TPID 18 (Helms 2022): dieselbe Frage für die sexp-Seite'}, {ref: forum_tid341, stelle: 'Trappmann 2009, „Grand Unity Conjecture“: Matrix-Potenz-Tetration (Helms) = intuitive Tetration = regulär unter η, = Cauchy/Kneser über η'}]
  pruefung:
    f1_folgt_unmittelbar: Nein — offen seit 1991.
    f2_benutzte_voraussetzungen: —
    f3_spezialfall: 'Gegenstück auf der sexp-Seite: TPID 18 — konvergiert die „Polynom-Tetration“ aus abgeschnittenen Carleman-Matrizen gegen Kneser? (Helms: 5–10 Stellen bei 64 × 64)'
    f4_uebertragbar: 'Gleiche Frage für $1<b<\eta$: konvergiert der intuitive slog gegen die reguläre oder eine andere Abel-Funktion?'
    f5_neue_frage: 'Falls ja: eine rein reell-algebraische Kennzeichnung der Kneser-Lösung (br.frage.bohr_mollerup).'
  bewertung: {richtigkeit: 'Vermutung, numerisch gestützt', neuheit: bekannt, nutzen: 'Würde eine algebraische Charakterisierung liefern.', nutzen_stufe: hoch}
  kanten:
    - {typ: motiviert, ziel: br.frage.bohr_mollerup}

