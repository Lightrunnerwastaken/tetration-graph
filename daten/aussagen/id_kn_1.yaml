gebiet: kn
# Identitätssuche Etappe 1 (14.10.2026): Struktur der Störungsreihe und Fourier-Abfall von Knesers θ.
# Rechnungen: forschung/identitaeten_2026_10_14/ (BERICHT_ETAPPE1.md).
aussagen:

- id: kn.satz.stoerungsreihe_tangens
  titel: 'Der Rand der Störungsreihe ist die Tangensfunktion: Leitkoeffizienten sind Tangentenzahlen'
  art: satz
  ebene: C
  status: bewiesen
  niveau: vertiefung
  objekte: [superfunktion]
  bereich: '$G(y)=e^{G(y-1)}-1+u$, $G(0)=0$, $G=\sum g_n(y)u^n$ wie in kn.konstr.stoerungsreihe'
  aussage: |
    Sammelt man von jedem Polynom $g_n$ nur das höchste Glied $y^{2n-1}$, so entsteht eine geschlossene Funktion:
    $$\sum_{n\ge1}\mathrm{LC}(g_n)\,u^n y^{2n-1}=\sqrt{2u}\,\tan\!\Bigl(y\sqrt{u/2}\Bigr),\qquad \mathrm{LC}(g_n)=\frac{2^{1-n}\,T_n}{(2n-1)!},$$
    mit den Tangentenzahlen $T_n=1,2,16,272,7936,\dots$ ($\tan x=\sum T_n x^{2n-1}/(2n-1)!$). Auch die nächste Schicht ist geschlossen: mit
    $H(y)=G(y-1)$ und $\vartheta=y\sqrt{u/2}$ ist der Anteil vom Gewicht $-3$
    $$H_1=\frac u3\Bigl(\sec^2\vartheta\,\ln\cos\vartheta+1-4\sec^2\vartheta\Bigr).$$
  einfach: >-
    Die Polynome der Störungsreihe sehen kompliziert aus. Nimmt man aber von jedem nur den grössten Teil, ergibt sich zusammen genau die
    Tangensfunktion aus der Schule. Auch der zweitgrösste Teil lässt sich mit Kosinus und Logarithmus geschlossen hinschreiben.
  formen:
    - {tex: '\sum_n \mathrm{LC}(g_n)u^ny^{2n-1}=\sqrt{2u}\tan(y\sqrt{u/2})', notiz: 'höchste Schicht'}
    - {tex: 'H_1=\tfrac u3(\sec^2\vartheta\ln\cos\vartheta+1-4\sec^2\vartheta),\ \vartheta=y\sqrt{u/2}', notiz: 'zweite Schicht'}
  beweis:
    art: vollstaendig
    text: |
      Gib $y$ das Gewicht 1 und $u$ das Gewicht $-2$. Aus $H(y+1)-H(y)=u+\sum_{m\ge2}H^m/m!$ und $H(y+1)-H(y)=H'+\tfrac12H''+\dots$ (jede Ableitung senkt
      das Gewicht um 1) folgt Schicht für Schicht: Gewicht $-2$: $H_0'=H_0^2/2+u$, $H_0(0)=0$, also $H_0=\sqrt{2u}\tan\vartheta$. Gewicht $-3$:
      $H_1'-H_0H_1=-H_0^3/12-uH_0/2$ mit $H_1(0)=-u$ (aus $G(-1)=\ln(1-u)$); integrierender Faktor $\cos^2\vartheta$. Beide Schichten stimmen mit den
      exakten Polynomen bis $n=12$ überein.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/identitaeten_2026_10_14/BERICHT_ETAPPE1.md, K1/K2 und Beweis B1; b_gewichte.py'}]
  pruefung:
    f1_folgt_unmittelbar: 'Nein — man braucht die Gewichtszerlegung; dann ist jede Schicht eine gewöhnliche Differentialgleichung.'
    f2_benutzte_voraussetzungen: 'Nur die formale Rekursion der Störungsreihe.'
    f3_spezialfall: 'Ja: die höchste Schicht ist der parabolische Grenzfall $H''=H^2/2+u$ (Riccati), wie bei der parabolischen Implosion.'
    f4_uebertragbar: 'Auf jede Störung $h(z)-1+u$ mit $h(z)=1+z+z^2/2+\dots$ und auf $x\,e^x$; die höchste Schicht hängt nur vom $z^2$-Koeffizienten ab.'
    f5_neue_frage: 'Die Pole von $\tan$ bei $y\sqrt{u/2}=\pi(k+\frac12)$ — legen sie die Singularitäten der Borel-Transformierten fest (kn.frage.stoerungsreihe)?'
  bewertung: {richtigkeit: 'vollständig; exakt geprüft bis n = 12', neuheit: neu_ungeprueft, nutzen: 'Erste geschlossene Struktur in der Störungsreihe; verbindet sie mit Tangentenzahlen und gibt Kandidaten für ihre Singularitäten.', nutzen_stufe: mittel}
  kanten:
    - {typ: verwandt, ziel: kn.konstr.stoerungsreihe}
    - {typ: motiviert, ziel: kn.frage.stoerungsreihe}
    - {typ: verwandt, ziel: it.satz.leau_fatou}

- id: kn.satz.stoerungsreihe_baeume
  titel: 'Die Störungsreihe zählt Bäume: n!·gₙ(k) sind markierte Bäume der Höhe ≤ k (bei k = 3 die Bell-Zahlen)'
  art: satz
  ebene: C
  status: bewiesen
  niveau: vertiefung
  objekte: [superfunktion]
  aussage: |
    An ganzen Höhen ist $G(k)=f^{\circ k}(0)$ mit $f(z)=u+e^z-1$. Kombinatorisch heisst das: $n!\,g_n(k)$ ist die Anzahl der Bäume mit $n$ markierten
    Blättern und Höhe $\le k$, deren innere Knoten nichtleere Mengen von Kindern sind (Einzelkinder erlaubt). Folgerungen:
    $n!\,g_n(2)=1$, $\;n!\,g_n(3)=B_{n+1}$ (Bell-Zahlen), $\;g_n(-1)=-1/n$ (wegen $G(-1)=\ln(1-u)$).
    Die Folgen $n!\,g_n(4)=4,14,87,658,5801,\dots$ und das ganzzahlige Newton-Dreieck der $g_n$ (Zeilensummen $1,3,70,4640,668316$) stehen nicht in der OEIS.
    Die Polynome $g_n(y)$ setzen diese Baumzählung auf gebrochene Höhen fort — die Tetration bei $u=1$ ist die „Zahl der Bäume der Höhe $x+1$“.
  einfach: >-
    Die Zahlen in der Störungsreihe zählen etwas Konkretes: Bäume mit beschrifteten Blättern, die nicht höher als k sind. Für Höhe 3 kommen genau die
    Bell-Zahlen heraus, die zählen, wie man eine Menge in Gruppen aufteilen kann. Die Tetration ist damit eine Art „Baumzählung bei gebrochener Höhe“.
  beweis:
    art: vollstaendig
    text: |
      $u$ ist die erzeugende Funktion eines einzelnen markierten Blatts, $e^z-1$ die einer nichtleeren Menge; $f^{\circ k}(0)$ ist daher die exponentielle
      erzeugende Funktion der Bäume der Höhe $\le k$ (Spezies-Komposition). $G(3)=e^{e^u-1+u}-1+u$ und $\tfrac{d}{du}e^{e^u-1}=e^{e^u-1+u}$ geben die Bell-Zahlen.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/identitaeten_2026_10_14/BERICHT_ETAPPE1.md, K3; b_baeume.py, b_kombinatorik.py'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, sobald man die Rekursion als Spezies-Komposition liest.'
    f2_benutzte_voraussetzungen: 'Exponentielle erzeugende Funktionen; nur ganze Höhen.'
    f3_spezialfall: 'Ja: Bäume als Iteration von eˣ − 1 (vgl. it.satz.zeta_polynom_partitionen).'
    f4_uebertragbar: 'Auf $x\,e^x$ (Bäume mit ausgezeichnetem Kind, br.beob.produkt_iteration_dreieck).'
    f5_neue_frage: 'Gibt es eine Zähldeutung der Werte bei halber Höhe (positive Rationalzahlen?) oder des Grenzwerts bei $u=1$?'
  bewertung: {richtigkeit: vollständig, neuheit: folklore, nutzen: 'Gibt der Störungsreihe eine anschauliche Bedeutung und liefert neue Zählfolgen.', nutzen_stufe: mittel}
  kanten:
    - {typ: verwandt, ziel: kn.konstr.stoerungsreihe}
    - {typ: analog_zu, ziel: it.satz.zeta_polynom_partitionen}

- id: kn.beob.theta_fourier_algebraisch
  titel: 'Knesers θ hat Fourier-Koeffizienten, die nur langsam fallen (lokal etwa n^(−1.2)) — θ ist auf der reellen Achse singulär'
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: forschung
  objekte: [kneser_T, theta_kneser]
  bereich: 'Basis $e$; $\mathrm{sexp}(z)=F(z+\theta(z))$ mit der regulären Superfunktion $F=\sigma^{-1}(e^{Lz})$ am Fixpunkt $L$, $\sigma''(L)=1$; $\theta=\sum a_ne^{2\pi inz}$ in der oberen Halbebene'
  aussage: |
    Die ersten Koeffizienten (auf 162 Stellen):
    $a_1=0.00385157873541-0.09056477795412\,i$, $a_2=0.00210091678690-0.03795624815248\,i$, $a_3=0.00144754775842-0.02281729713002\,i$.
    $|a_n|$ fällt **nicht** geometrisch: der lokale Exponent ist $1.254$ ($n=2$), $1.184$ ($64$), $1.137$ ($1024$), $1.121$ ($4096$) und sinkt weiter
    (Koeffizienten bis $n=4096$ auf 44 Stellen, zwei unabhängige Einstellungen). $\arg a_n$ wandert langsam ($-1.53$ bei $n=1$, $-1.37$ bei $n=4096$)
    und hat keinen Grenzwert — die Angabe „$\arg a_n\to-\pi/2$“ aus Etappe 1 war falsch. Also hat $\theta$ Singularitäten auf der reellen Achse;
    wo und welcher Art sie sind, steht in kn.satz.theta_singularitaet, die genaue Asymptotik in kn.satz.theta_koeffizienten.
  einfach: >-
    Knesers Tetration ist die „gewöhnliche“ Lösung am komplexen Fixpunkt plus eine kleine Welle. Die Welle besteht aus Schwingungen, deren Stärke
    erstaunlich langsam abnimmt. Das zeigt: die Welle hat auf der reellen Achse scharfe Stellen.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/identitaeten_2026_10_14/BERICHT_ETAPPE1.md (K8) und etappe2/BERICHT_ETAPPE2.md (Abschnitt 3.0)'}]
  pruefung:
    f1_folgt_unmittelbar: 'Nein (gemessen).'
    f2_benutzte_voraussetzungen: 'fatou.gp-Fork bei dps 60–200 nahe der reellen Achse (|Im z| ≤ 0.2); Etappe 1 und 2 stimmen für a₁…a₆₄ auf 3.5·10⁻⁸⁰ überein.'
    f3_spezialfall: nein
    f4_uebertragbar: 'Basis 2 zeigt dieselbe Struktur (|a₄₀₉₆| = 4.579·10⁻⁶ gegen 4.603·10⁻⁶ bei e).'
    f5_neue_frage: 'Erklärt durch kn.satz.theta_singularitaet und kn.satz.theta_koeffizienten.'
  bewertung: {richtigkeit: 'numerisch, 44–162 Stellen', neuheit: neu_ungeprueft, nutzen: 'Erste hochgenaue θ-Koeffizienten; zeigt eine unerwartete Singularitätsstruktur.', nutzen_stufe: mittel}
  versionen:
    - {aenderung: 'Etappe 1: „arg a_n → −π/2“ behauptet.', grund: 'Etappe 2 (n bis 4096) zeigt: das Argument wandert und hat keinen Grenzwert; korrigiert am 14.10.2026.'}
  kanten:
    - {typ: verwandt, ziel: kn.konstr.kneser}
    - {typ: verwandt, ziel: fg.satz.kohomologisch}
    - {typ: motiviert, ziel: kn.frage.theta_exponent}

- id: kn.frage.theta_exponent
  titel: 'Welche Zahl bestimmt den Fourier-Abfall von Knesers θ? — Antwort: keine eigene, der Exponent ist genau 1'
  art: frage
  ebene: C
  status: offen
  niveau: forschung
  objekte: [kneser_T, theta_kneser]
  aussage: |
    Ausgangsfrage (Etappe 1): Fallen die $a_n$ wie $n^{-1-c}$ mit einer Kneser-eigenen Konstante $c$, oder wie $n^{-1}(\ln n)^{-p}$?
    **Antwort (Etappe 2): weder noch.** Der Exponent ist genau 1, mit einem Produkt iterierter Logarithmen,
    $|a_n|\asymp1/(n\ln n\ln\ln n\cdots)$; die Drift des lokalen Exponenten ist $1+1/\ln n$ (kn.satz.theta_koeffizienten). Eine eigene
    „Kneser-Exponentenzahl“ gibt es nicht; der Abfall wird von $A=\mathrm{sexp}'(0)$ und der regulären Abel-Funktion $h$ bestimmt.
    Die Übertragung von der Singularität auf die Koeffizienten ist inzwischen bewiesen (kn.satz.theta_koeffizienten). **Beantwortet (25.10.2026, Skizze):**
    $\arg a_n=\pi+\Phi(\sigma_n)+\arctan\frac{\pi}{2(\ln n-\ln(A/2\pi))}+O(1/(\ln n\ln\ln n))$ mit $\Phi=\arg(1+\theta')$ auf der reellen Achse und
    $\sigma_n\approx1/(2\pi n)$ (kn.satz.theta_phase_koeffizienten). Offen bleibt, ob der stetige Zweig von $\arg a_n$ unbeschränkt ist (kn.verm.theta_phase_unbeschraenkt).
  einfach: >-
    Die Welle in Knesers Tetration wird so langsam schwächer wie 1/n, nur noch ein klein wenig schneller. Eine neue Zahl steckt nicht darin —
    aber eine schöne Formel (siehe die verwandten Einträge), die inzwischen auch bewiesen ist.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/identitaeten_2026_10_14/etappe2/BERICHT_ETAPPE2.md'}]
  kanten:
    - {typ: verwandt, ziel: kn.beob.theta_fourier_algebraisch}
    - {typ: verwandt, ziel: kn.satz.theta_koeffizienten}
    - {typ: verwandt, ziel: br.satz.gevrey_fourier}
    - {typ: verwandt, ziel: kn.satz.theta_phase_koeffizienten}

- id: kn.satz.theta_singularitaet
  titel: 'θ ist genau an den ganzen Zahlen singulär — mit einer „Superlogarithmus-Singularität“'
  art: satz
  ebene: C
  status: bedingt
  bedingungen_text: 'Motor-Annahme (E): die Motor-θ-Reihe trifft Knesers θ bei z₀ = 0.05i bis auf 0.027 (mod 2πi/ℓ); die Zweigwahl selbst ist mit Intervallarithmetik bewiesen, Basis e und 2 (kn.satz.zweigwahl_zertifikat); Hilfsschranken nahe 0 unter (E2) (kn.satz.sexp_schlicht_nahe_null). Belege für (E): zwei Motoreinstellungen auf 2·10⁻⁵⁹ gleich; Basis e stimmt auf Im z ≥ 0.36 mit dem zertifizierten θ_K (kn.satz.kneser_e_zertifiziert) auf 3·10⁻⁷⁹'
  niveau: forschung
  objekte: [kneser_T, theta_kneser]
  bereich: 'Basis $b>\eta$ (gerechnet für $e$ und 2); $\mathrm{sexp}(z)=F(z+\theta(z))$, $F(s)=\Psi(\lambda^s)$ mit der Poincaré-Funktion $\Psi$ am Fixpunkt $L$, $\lambda=L\ln b$; $h=F^{-1}$ die reguläre Abel-Funktion'
  aussage: |
    (i) $\Psi'$ hat keine Nullstelle und $\Psi$ lässt den Wert 0 aus; daher ist $F'\neq0$ und $F\neq0$ überall.
    (ii) Weil $\mathrm{sexp}(-1)=0$, aber $F$ nie 0 wird, muss $z+\theta(z)$ bei $z\to-1$ unbeschränkt werden: **θ ist an jeder ganzen Zahl singulär**.
    An allen anderen reellen Stellen ist $\theta$ analytisch.
    (iii) Die Singularität wächst weder wie eine Potenz noch wie ein Logarithmus; topologisch ist sie ein Verzweigungspunkt unendlicher Ordnung (kn.kor.theta_verzweigung_unendlich).
    Nahe $z=0$ gilt (Basis $e$)
    $$\theta(z)=2-z+h\bigl(\log(Az)+\kappa z+O(z^2)\bigr),\qquad A=\mathrm{sexp}'(0),\quad\kappa=\frac{\mathrm{sexp}''(0)}{2A}-\frac A2$$
    (modulo $2\pi i/L$; gemeint ist der Zweig von $h$, der an $z_0=0.05i$ den Datenwert von θ liefert — die „Zweigzahl 0“ des Programms ist nur eine Konvention).
    $\theta$ wächst dort unbeschränkt, aber unvorstellbar langsam: von $z=10^{-2}i$ bis $10^{-30}i$ ändert sich $\theta$ nur um $0.14$
    (von $26.205+5.227i$ nach $26.330+4.763i$). Die Singularität ist selbstähnlich: für sehr kleine $z$ enthält sie $\theta$ selbst.
  einfach: >-
    Die Welle in Knesers Tetration hat scharfe Stellen genau bei den ganzen Zahlen. Der Grund: bei −1 ist die Tetration 0, und die gewöhnliche Lösung
    am komplexen Fixpunkt kann den Wert 0 nie erreichen — die Welle muss das ausgleichen und wird dort unendlich, aber so langsam wie ein
    Superlogarithmus.
  beweis:
    art: skizze
    text: |
      (i) Aus $\lambda\Psi'(\lambda u)=\ln b\cdot b^{\Psi(u)}\Psi'(u)$: eine Nullstelle $u_0$ von $\Psi'$ gäbe Nullstellen $u_0\lambda^{-k}$, die sich bei 0 häufen,
      Widerspruch zu $\Psi'(0)=1$; $\Psi(\lambda u)=b^{\Psi(u)}\neq0$. (ii) Wäre $z+\theta(z)$ bei $z\to-1$ beschränkt, gäbe es einen Häufungspunkt $s^*$ mit
      $F(s^*)=0$. (iii) $\theta(z)=h(\mathrm{sexp}\,z)-z$, $h(w)=1+h(\log_bw)$ zweimal angewandt und Taylor-Entwicklung von $\log\log\mathrm{sexp}$ bei 0;
      numerisch bestätigt: der Rest fällt wie $|z|^2$ bis $|z|=10^{-12}$. Holomorphie von $h$ auf dem nötigen Gebiet ohne Zitat: die Schröder-Funktion $\sigma$ ist
      auf der ganzen oberen Halbebene schlicht, weil der Hauptzweig-Logarithmus sie injektiv in sich abbildet (Lemma U, luecken/BERICHT_LUECKEN_ANALYTISCH.md).
    luecken:
      - 'Zweigwahl: mit Intervallen zertifiziert für Basis e und 2 (kn.satz.zweigwahl_zertifikat); offen ist nur die Motor-Annahme (E) mit Toleranz 0.027.'
  stuetzt_sich_auf: [kn.satz.zweigwahl_zertifikat, kn.satz.sexp_schlicht_nahe_null]
  quellen: [{ref: diese_arbeit, stelle: 'forschung/identitaeten_2026_10_14/etappe2/BERICHT_ETAPPE2.md, Abschnitt 2 (S1–S6) und 3.1; p5_lokal.py'}]
  pruefung:
    f1_folgt_unmittelbar: '(i), (ii) ja, sobald man sieht, dass F den Wert 0 auslässt; (iii) ist eine kurze Rechnung.'
    f2_benutzte_voraussetzungen: 'Kneser-Darstellung sexp = F(z+θ(z)); Poincaré-Funktion ganz.'
    f3_spezialfall: nein
    f4_uebertragbar: 'Auf jede Basis über η (Basis 2 gleich geprüft) und vermutlich auf Kneser-artige Pentation (dort trifft die Pentation den Wert, den die reguläre Lösung auslässt). Zweigwahl für Basis 2 jetzt ebenfalls zertifiziert. (i)–(ii) gelten wörtlich auch für komplexe Basen ausserhalb Shell–Thron (kn.satz.komplex_radius).'
    f5_neue_frage: 'Gilt dasselbe für die Welle zwischen regulärer und Kneser-artiger Pentation (kn.beob.einheitliche_raenge)?'
  bewertung: {richtigkeit: 'Kern bewiesen; Zweigwahl mit Intervallen zertifiziert (Basis e und 2) unter Motor-Annahme (E); Lokalform numerisch auf 10⁻²⁷', neuheit: neu_ungeprueft, nutzen: 'Erklärt, warum Kneser und die reguläre Lösung an L sich nicht analytisch ineinander überführen lassen, und wo genau.', nutzen_stufe: hoch}
  versionen:
    - {datum: '2026-10-25', aenderung: 'Bedingung „Zweigwahl nur in Gleitkomma, nur Basis e“ ersetzt durch die viel schwächere Motor-Annahme (E) mit Toleranz 0.027; Status bleibt bedingt.', grund: 'Zweigwahl mit Intervallarithmetik zertifiziert, Basis e und 2 (kn.satz.zweigwahl_zertifikat; Bericht forschung/runde_2026_10_25/03_zweigwahl_zertifikat).'}
  kanten:
    - {typ: verwandt, ziel: kn.beob.theta_fourier_algebraisch}
    - {typ: verwandt, ziel: kn.gescheitert.regulaer_an_L}
    - {typ: verwandt, ziel: kn.konstr.kneser}
    - {typ: verwandt, ziel: kn.kor.theta_verzweigung_unendlich}

- id: kn.satz.theta_koeffizienten
  titel: 'Formel für die Fourier-Koeffizienten von θ: aₙ = [qⁿ] h(c + log(1−q)) + O(1/(n² ln n)), Exponent genau 1'
  art: satz
  ebene: C
  status: bedingt
  bedingungen_text: 'dieselbe Bedingung wie kn.satz.theta_singularitaet: Motor-Annahme (E); die Zweigwahl ist mit Intervallen zertifiziert (kn.satz.zweigwahl_zertifikat), Basis e und 2'
  niveau: forschung
  objekte: [kneser_T, theta_kneser]
  bereich: 'Basis $b>\eta$; $\theta(z)=\sum a_nq^n$, $q=e^{2\pi iz}$; $h$, $A$, $\kappa$ wie in kn.satz.theta_singularitaet'
  aussage: |
    Aus der Singularität bei $q=1$ folgt eine geschlossene Asymptotik der Koeffizienten:
    $$a_n=[q^n]\,h\Bigl(\frac{c+\log(1-q)}{\ln b}\Bigr)+O\Bigl(\frac1{n^2\ln n}\Bigr),\qquad c=\ln\frac{A}{2\pi\ln b}+\frac{i\pi}2 .$$
    Mit der Korrektur $\delta_1=\tfrac12+i\kappa/2\pi$ wird der Rest $O(1/(n^3\ln n))$. Führend ist $a_n=-h'(v_n)/n+O(1/(n\ln^2n))$ mit $v_n=(c-\ln n)/\ln b$, und
    $$\frac{c_1}{n\ln n\,(\ln\ln n)^4}\le|a_n|\le\frac{C_1}{n\ln n}:$$
    **der Exponent ist genau 1**, der lokale Exponent sinkt wie $1+1/\ln n$ (heuristisch $|a_n|\asymp1/(n\ln n\ln\ln n\cdots)$).
    Gemessen bis $n=4000$: relativer Rest $1.9\cdot10^{-5}$ (erste Ordnung), $4.8\cdot10^{-9}$ (zweite Ordnung); für Basis 2 gleich gut.
    Die Koeffizienten der Kneser-Welle werden also von der regulären Abel-Funktion am komplexen Fixpunkt und der einen Zahl $A=\mathrm{sexp}'(0)$ bestimmt.
  einfach: >-
    Man kann die Stärken der Schwingungen in Knesers Welle fast genau vorhersagen: man nimmt die gewöhnliche Lösung am komplexen Fixpunkt und
    setzt einen Logarithmus ein. Die Vorhersage stimmt bis zur 4000. Schwingung auf acht bis neun Stellen, und inzwischen ist sie auch bewiesen.
  formen:
    - {tex: 'a_n=[q^n]\,h\bigl((c+\log(1-q))/\ln b\bigr)+O(1/(n^2\ln n))', notiz: 'Koeffizientenformel'}
    - {tex: '\frac{c_1}{n\ln n(\ln\ln n)^4}\le|a_n|\le\frac{C_1}{n\ln n}', notiz: 'Exponent genau 1'}
  beweis:
    art: vollstaendig
    text: |
      $\theta$ ist auf $|q|\le1$ ausser bei $q=1$ analytisch (kn.satz.theta_singularitaet), also $\Delta$-analytisch bei $q=1$. Aus der Lokalform und den Schranken
      für $h'$ (Grunsky/Koebe, wie bei kn.satz.theta_mittelwerte) folgt $\theta(q)-H(q)=O(|1-q|/\log(1/|1-q|))$ im $\Delta$-Gebiet mit $H(q)=h((c+\log(1-q))/\ln b)$;
      der Übertragungssatz für O-Terme (Flajolet–Odlyzko, Flajolet–Sedgewick Satz VI.3) gibt $a_n-[q^n]H=O(1/(n^2\ln n))$. Die Schranken für $|a_n|$ kommen aus
      denselben Schranken für $h'$ über eine Hankel-Kontur.
  stuetzt_sich_auf: [kn.satz.theta_singularitaet]
  quellen: [{ref: diese_arbeit, stelle: 'forschung/identitaeten_2026_10_14/etappe2/BERICHT_ETAPPE2.md, S7–S9 und 3.2; Beweis: luecken/BERICHT_LUECKEN_ANALYTISCH.md, l2_transfer.py'}]
  pruefung:
