- id: bw.gescheitert.orbitanker
  titel: Naive Orbitsummation entlang der Rückwärtsspirale
  art: gescheitert
  ebene: C
  status: gescheitert
  objekte: [kern_V, fixpunkt_L]
  aussage: 'Ein Anker mit der nackten Schröder-Funktion entlang $w_{k+1}=\log_d w_k\to L$ divergiert wie $|\lambda|^n$: die Theta-Ableitung multipliziert den Pol ($|p''|\approx0.5$ für $d=e$).'
  quellen: [{ref: justus_p5, stelle: 'Bem. 3'}]
  pruefung:
