  aussage: |
    Für komplexe Basen, deren Bahn flieht, wählt jeder Logarithmus-Schritt einen Streifen $m_j$ (Adresse $\mathbf s$). Für Basen mit
    verträglichen Adressen konvergieren die gestoppten Schwänze gegen einen Kozykel $\Phi_{b,d}(\theta,\mathbf s)$ über Phasenkreis und
    Adressverschiebung; schliesslich $q$-periodische Adressen geben eine $q$-periodische Höhenphase. Der reelle Fall (Adresse $0,0,\dots$)
    ist das Phasengesetz.
  gegenbeispielsuche: |
    Versuch 08.10.2026 (experimente/e26_adressen.py, gestoppte Kette mit Kneser/Paulsen-Werten für komplexe Basen): die reelle Kontrolle
    b = 3, d = 2 stimmt (μ = −1.3208260715, Phase 1-periodisch, unabhängig von der Stoppschwelle auf 10⁻¹⁶). Für komplexe Paare
    (4 + 0.5i mit 3 + 0.3i) liefert der Rechenmotor an den nötigen Punkten in 25 Minuten keine Werte — nicht entschieden. Nebenbefund:
    die meisten komplexen Basen nahe der reellen Achse fliehen gar nicht (Ausflug und Rückfall, vgl. fp.beob.negative_achse).
  pruefung:
    f1_folgt_unmittelbar: Nein.
    f2_benutzte_voraussetzungen: —
    f3_spezialfall: 'Verallgemeinert bw.satz.phasengesetz.'
    f4_uebertragbar: —
    f5_neue_frage: 'Erstes Testpaar: zwei komplexe Basen mit konstanter Adresse $m\ne0$.'
  bewertung: {richtigkeit: offen, neuheit: unklar, nutzen: 'Würde das Phasengesetz auf komplexe Basen ausdehnen.', nutzen_stufe: mittel}
  quellen: [{ref: justus_synthese_jul, stelle: '§20.2, Conjecture I'}]
  kanten:
    - {typ: verallgemeinert, ziel: bw.satz.phasengesetz}

- id: bw.satz.imaginaere_richtung
  titel: In imaginärer Richtung konvergiert der Basiswechsel
  art: satz
  ebene: C
  status: bewiesen
  niveau: forschung
  objekte: [F_bd, kneser_T, fixpunkt_L, schroeder]
  bereich: '$b\ne d>\eta$, Kneser-Tetration $T_d$, $\Phi(w)=A_b(A_d^{-1}(w))$; $L_d$ im Linearisierungsgebiet von $E_b$ (Rückwärtsbahn erreicht $L_b$)'
  voraussetzungen:
    - {text: 'L_d ≠ L_b und A_b holomorph bei L_d', benutzt: ja}
    - {text: 'Kneser', benutzt: nein, notiz: 'jede Tetration verschiebt das Argument nur um eine 1-periodische Funktion'}
  aussage: |
    $$A_b\bigl(T_d(iy)\bigr)\longrightarrow A_b(L_d)\quad(y\to+\infty),\qquad \Phi(w)=A_b(L_d)+\sum_{k\ge1}K_k\lambda_d^{kw},\quad K_1=A_b'(L_d).$$
    Die Annäherung ist eine gedämpfte Drehung: Abklingrate $\arg\lambda_d$, Drehrate $\log|\lambda_d|$ (für reelle $d$: $\mathrm{Im}\,\lambda_d$ bzw.
    $\log\log d+\mathrm{Re}\,\lambda_d$). Für $b=e$, $d=2$: Grenzwert $0.326448651629+0.523513968910i$, $K_1=-0.0305475247-1.2919819448i$, Periode 30.63.
    Für $d\to b$ wächst $|A_b(L_d)|\sim|\log|L_d-L_b||/|\mathrm{Log}\lambda_b|$. Drei Richtungen: reell → divergent mit 1-periodischer Welle;
    imaginär nach oben → $A_b(L_d)$; nach unten → $A_b(\overline{L_d})$.
  einfach: >-
    Lässt man die Höhe nicht nach rechts, sondern nach oben ins Komplexe laufen, läuft die Tetration in ihren Fixpunkt statt ins
    Unendliche. Dort ist die andere Basis harmlos, und der Basiswechsel kommt zur Ruhe — mit einer Drehung, die so schnell gedämpft
    wird, dass man sie fast nie sieht.
  beweis: {art: vollstaendig, text: '$\kappa_d(A_d^{-1}(w))=\lambda_d^w$ ⇒ $A_d^{-1}(w)=L_d+\lambda_d^w+O(\lambda_d^{2w})$; $A_b$ ist bei $L_d$ holomorph ⇒ Taylorentwicklung in $\lambda_d^w$, $|\lambda_d^{iy}|=e^{-y\arg\lambda_d}\to0$. Kneser: $T_d(x+iy)\to L_d$ (Paulsen–Cowgill-Bedingung).'}
  stuetzt_sich_auf: [kn.satz.paulsen_cowgill, it.satz.koenigs]
  experimente: [exp.funde]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, sobald man die Paulsen–Cowgill-Bedingung nimmt.'
    f2_benutzte_voraussetzungen: 'Holomorphie von A_b bei L_d (Domänentest: über 200 Rückwärtsschritte nötig).'
    f3_spezialfall: 'Dieselbe Dichotomie wie kl.satz.basiswechsel_gleiches_L mit vertauschten Rollen.'
    f4_uebertragbar: 'Komplexe Basen mit gemeinsamem oberem Fixpunkt: dann divergiert der Ausdruck wie A_b(T_b(iy)) (kl.frage.gleiches_L_kneser).'
    f5_neue_frage: 'Welche Funktion der beiden Basen ist A_b(L_d)? (Analytisch in b, d bis zur Diagonale, dort log-singulär.)'
  gegenbeispielsuche: 'Original: K₁ zweifach bestimmt, 19 Stellen; Annäherung bis y = 40. exp.funde: A_e(L_2), K₁ und A_2(L_e) unabhängig mit eigener Koenigs-Rechnung, Abweichung < 10⁻¹⁸ bzw. 10⁻¹².'
  bewertung: {richtigkeit: vollständig, neuheit: neu_ungeprueft, nutzen: 'Neue, konvergente Seite des Basiswechsels über η.', nutzen_stufe: hoch}
  quellen: [{ref: justus_imaginaer}]
  kanten:
    - {typ: verwandt, ziel: bw.satz.phasengesetz}
    - {typ: analog_zu, ziel: kl.satz.basiswechsel_gleiches_L}
    - {typ: verwandt, ziel: kl.frage.gleiches_L_kneser}

- id: bw.frage.halbiter_vergleich
  titel: 'Wachsen gebrochene Exponential-Iterierte zu verschiedenen Basen geordnet? (Taranovsky, MO 2017)'
  art: frage
  ebene: C
  status: offen
  niveau: forschung
  objekte: [phase, hoehe]
  aussage: |
    Für Basen $a,b>\eta$ und Höhen $c<d$: Gilt $\lim_{x\to\infty}\exp_a^{[c]}(x)/\exp_b^{[d]}(x)=0$? Für $c=1<d$ ja (für jede Tetration mit steigender Ableitung). Levenstein vermutet
    (Forum 2018): Für Walkers Lösung gilt es allgemein, für Kneser **nicht** — es gibt dann $c<d$ (sogar mit $a<b$) und beliebig grosse $x$ mit $\exp_a^{[c]}(x)>\exp_b^{[d]}(x)$.
    Der Grund wäre die periodische Welle des Basiswechsels: Kneser-Iterierte zweier Basen sind nur bis auf ein Wackeln ineinander verschoben.
  einfach: >-
    Wenn man die Exponentialfunktion „halb“ oder „drei Viertel mal“ anwendet, wächst die höhere Stufe dann immer schneller — auch bei verschiedenen Basen?
    Vermutlich hängt die Antwort davon ab, welche Fortsetzung der Tetration man nimmt.
  pruefung:
    f1_folgt_unmittelbar: 'Nein, offen.'
    f2_benutzte_voraussetzungen: 'Basiswechsel-Welle (bw.satz.phasengesetz).'
    f3_spezialfall: 'Frage nach einer „natürlichen“ Wachstumsskala zwischen quasipolynomial und quasiexponentiell.'
    f4_uebertragbar: 'Alle Konstruktionen gebrochener Iterierter.'
    f5_neue_frage: 'Lässt sich aus der gemessenen Welle eine konkrete Gegenbeispiel-Folge für Kneser bauen?'
  bewertung: {richtigkeit: offen, neuheit: bekannt, nutzen: 'Verbindet den Basiswechsel mit einer natürlichen Wachstumsfrage.', nutzen_stufe: mittel}
  quellen: [{ref: forum_tid1189}]
  kanten:
    - {typ: verwandt, ziel: bw.satz.phasengesetz}
    - {typ: verwandt, ziel: kn.satz.halbe_exp_wachstum}
