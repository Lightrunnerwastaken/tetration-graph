- id: bw.verm.nirgends_analytisch
  titel: Basiswechsel-Tetrationen sind nirgends analytisch (Forum-Vermutung)
  art: vermutung
  ebene: C
  status: vermutung
  niveau: forschung
  objekte: [phase, schwanz_D, gevrey]
  bereich: '$b\ne d>\eta$, Kneser-Tetration $T_d$; $D_{b,d}(\theta)=\lim_n\log_b^{\circ n}T_d(n+\theta)$'
  aussage: |
    Die per Basiswechsel gewonnene Tetration $D_{b,d}=T_b\circ(\mathrm{id}+\Phi_{b,d})$ ist auf der reellen Achse unendlich oft differenzierbar,
    aber **an keiner Stelle analytisch**. Gleichwertig: die Phase $\Phi_{b,d}$ ist nirgends analytisch — insbesondere in keinem Streifen holomorph,
    also $\sigma^*=0$ im Modenabfall.
  einfach: Übersetzt man eine glatte Tetration in eine andere Basis, ist das Ergebnis vermutlich zwar unendlich glatt, aber nirgends durch eine Potenzreihe darstellbar.
  gegenbeispielsuche: |
    Forum (Levenstein 2011): Die Näherungen nach $n$ Logarithmenstufen haben Singularitäten, deren Abstand zur reellen Achse mit $n$ gegen $0$ geht
    (nächste bei Radius $0.46$, nach einer weiteren Stufe $0.035$); Trappmann (2009) beweist für $\log_a^{\circ n}\circ\exp_b^{\circ n}$ Verzweigungspunkte bei
    $\log_b^{\circ n}\{a,\dots,\exp_a^{\circ n-2}(1)\}$. Eigene Daten: $\sigma_{\mathrm{eff}}(k)$ fällt bis $k\approx520$ weiter, Gevrey- und Streifenmodell passen gleich gut
    (bw.frage.streifen_gevrey); die Turmanalyse aus Runde 20 spricht eher für Gevrey. Nicht entschieden.
  quellen: [{ref: forum_levenstein2011, stelle: 'tid 578 (2011), tid 825 (2014)'}, {ref: forum_trappmann2009, stelle: 'Proposition über die Verzweigungspunkte'}, {ref: justus_log, stelle: 'Runde 20 (Turmanalyse)'}]
  pruefung:
