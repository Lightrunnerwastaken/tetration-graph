  aussage: '(K1) Streifengeometrie: $T_d$ holomorph auf $\mathbb H$, $T_d(z)\to L$ für $\operatorname{Im}z\to\infty$; (K2) Theta-Struktur: $p=A_d\circ T_{\mathrm{reg}}-\mathrm{id}$ 1-periodisch, $p''\to0$.'
  quellen: [{ref: justus_p5, stelle: '(K1)–(K2)'}]
