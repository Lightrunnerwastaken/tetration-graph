gebiet: bw
aussagen:

# ---------------------------------------------------------------- Grundbegriffe
- id: bw.def.F_bd
  titel: Mischbasen-Höhenabbildung, Schwänze, Phase
  art: definition
  ebene: B
  status: definition
  objekte: [F_bd, schwanz_D, phase, slog]
  bereich: 'reguläre (Kneser/Paulsen–Cowgill) Zweige $T_b,T_d$, $b,d>\eta$; $\alpha=\log_b d$'
  aussage: |
    $F_{b,d}:=\operatorname{slog}_b\circ T_d$. Schwänze $D_n(\theta):=\log_b^{\circ n}\bigl(T_d(n+\theta)\bigr)$.
    Falls der Limes existiert: $\Phi_{b,d}(\theta)=A_b(D_{b,d}(\theta))-\theta$, Mittel $\mu_{b,d}=\int_0^1\Phi$,
    Profil $P_{b,d}=\Phi-\mu$; Lift $\tilde H_{b,d}=\mathrm{id}+\Phi_{b,d}$.
  quellen: [{ref: justus_p1, stelle: '§2, §5'}, {ref: forum_fox2007, stelle: 'Basiswechsel-Formel mit Konstante μ_b(a), 2007'}, {ref: forum_trappmann2009, stelle: 'Verzweigungspunkte von log_a^n ∘ exp_b^n'}]

- id: bw.prop.gruppoid
  titel: Gruppoid-Identitäten
  art: satz
  ebene: A
  status: bewiesen
  objekte: [F_bd]
  bereich: 'beliebige Lösungen $T_b,T_c,T_d$ mit Umkehrungen auf den nötigen Bildern'
  voraussetzungen:
    - {text: 'T_b, T_c umkehrbar (A_b = T_b^{-1}) auf den Bildern', benutzt: ja}
    - {text: 'reguläre Kneser-Zweige', benutzt: nein, notiz: 'für jede Wahl von Tetrationen gültig'}
  aussage: '$F_{b,b}=\mathrm{id}$, $F_{b,d}^{-1}=F_{d,b}$, $F_{b,d}=F_{b,c}\circ F_{c,d}$.'
  beweis: {art: vollstaendig, text: '$A_b T_c A_c T_d=A_b T_d$.'}
  quellen: [{ref: justus_p1, stelle: 'Prop. 6.1'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus $A_c\circ T_c=\mathrm{id}$.'
    f2_benutzte_voraussetzungen: 'Nur Umkehrbarkeit; keine Regularität, kein Kneser.'
    f3_spezialfall: 'Ja: Koordinatenwechsel zwischen Abel-Koordinaten bilden immer ein Gruppoid.'
    f4_uebertragbar: 'Jede Familie von Superfunktionen beliebiger Abbildungen.'
    f5_neue_frage: 'Inhalt entsteht erst asymptotisch (Phasengesetz).'
  bewertung: {richtigkeit: vollständig, neuheit: nur_schreibweise, nutzen: 'Organisationsprinzip; kein neuer mathematischer Inhalt.', nutzen_stufe: mittel}

- id: bw.prop.ganzzahl
  titel: Exaktes Abschälen auf ganzen Höhen
  art: satz
  ebene: B
  status: bewiesen
  objekte: [F_bd, schwanz_D]
  bereich: '$n\in\mathbb N$, sofern die iterierten Logarithmen definiert sind'
  voraussetzungen:
    - {text: 'log_b^{∘n}(T_d(n)) definiert', benutzt: ja}
  aussage: '$\operatorname{slog}_b(T_d(n))-n=A_b(C^n_{b,d})$ mit $C^n_{b,d}=\log_b^{\circ n}(T_d(n))$. Ganze Höhen sehen nur die Phase 0.'
  beweis: {art: vollstaendig, text: 'Abel-Gleichung $n$-mal.'}
  quellen: [{ref: justus_p1, stelle: 'Prop. 3.2, Kor. 3.3'}]
  pruefung:
    f1_folgt_unmittelbar: Ja.
    f2_benutzte_voraussetzungen: 'Definiertheit der Logarithmen.'
    f3_spezialfall: Ja, $\theta=0$ im Phasengesetz.
    f4_uebertragbar: Alle Konstruktionen.
    f5_neue_frage: 'Was passiert bei nichtganzen Höhen? → Phasengesetz.'
  bewertung: {richtigkeit: vollständig, neuheit: nur_schreibweise, nutzen: 'Erklärt die naheliegende falsche Erwartung einer konstanten Verschiebung.', nutzen_stufe: gering}

# ------------------------------------------------------------- Annahmen Paper I
- id: bw.ann.hyp22
  titel: Annahme „regulärer reeller Logarithmenkanal“ (Paper I, Hyp. 2.2)
  art: annahme
  ebene: B
  status: annahme
  objekte: [schwanz_D, slog]
  aussage: |
    (R1) $T_d$ positiv, stetig, lokal von 0 weg beschränkt; (R2) die Logarithmen $\log_b^{\circ k}(T_d(n+\theta))$
    bleiben im reellen Kanal; (R3) $A_b$ lokal Lipschitz auf einer Umgebung der Grenzschwänze.
  quellen: [{ref: justus_p1, stelle: 'Hyp. 2.2'}]
  kanten:
    - {typ: verwandt, ziel: bw.lem.stoppregel, notiz: '(R2) für die gestoppte Kette bewiesen'}
  nachgeprueft:
    - {gegen: bw.gegen.unverschoben, datum: '2026-07', ergebnis: 'Paper III: für Grenzobjekte nur in der Offset-Fassung (bw.lem.offset) richtig.'}

- id: bw.ann.hyp24
  titel: Annahme „gleichmässiges Abschälwachstum“ (Paper I, Hyp. 2.4)
  art: annahme
  ebene: B
  status: annahme
  objekte: [schwanz_D]
  aussage: '$\log_b^{\circ k}(T_d(n+\theta))\ge a\,T_d(n-k+\theta)-B$ und $s_j=\inf_\theta T_d(j+\theta)\to\infty$.'
  quellen: [{ref: justus_p1, stelle: 'Hyp. 2.4'}]

- id: bw.lem.wachstumsluecke
  titel: Turmdivergenz mit expliziter Lücke
  art: lemma
  ebene: A
  status: bewiesen
  objekte: [eta, T_b]
  bereich: '$d>\eta$, alle $x\in\mathbb R$'
  voraussetzungen:
    - {text: 'd > η', benutzt: ja}
  aussage: '$d^x-x\ge\delta_0(d)=\dfrac{1+\ln\ln d}{\ln d}>0$; daher $s_{j+1}\ge s_j+\delta_0$, $s_j\to\infty$, und Hyp. 2.4 gilt.'
  beweis: {art: vollstaendig, text: 'Konvexität (fp.satz.reelle_fixpunkte). Wachstum selbstverstärkend: $s_{j+1}=d^{s_j}$.'}
  stuetzt_sich_auf: [fp.satz.reelle_fixpunkte]
  quellen: [{ref: justus_p3, stelle: 'Lemma 1'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja — wörtlich die Minimumsrechnung aus fp.satz.reelle_fixpunkte.'
    f2_benutzte_voraussetzungen: 'Nur $d>\eta$; für $s_j\to\infty$ jede Lösung mit $T_d(0)=1$, nicht nur Kneser.'
    f3_spezialfall: Ja, von fp.satz.reelle_fixpunkte.
    f4_uebertragbar: 'Jede Tetration zur Basis $d>\eta$ (Ebene A).'
    f5_neue_frage: '—'
  bewertung: {richtigkeit: vollständig, neuheit: klassisch, nutzen: 'Entlastet Hyp. 2.4 vollständig.', nutzen_stufe: mittel}
  kanten:
    - {typ: entlastet, ziel: bw.ann.hyp24}
    - {typ: folgt_unmittelbar_aus, ziel: fp.satz.reelle_fixpunkte}

- id: bw.lem.stoppregel
  titel: Stoppregel — unbedingte Positivität der gestoppten Kette
  art: lemma
  ebene: B
  status: bewiesen
  objekte: [schwanz_D]
  bereich: '$b,d>\eta$, $J_0=\min\{j:s_j\ge2C_0\}$, $C_0=|\log_b\alpha|+\ln2/\ln b$'
  voraussetzungen:
    - {text: 'b, d > η', benutzt: ja}
    - {text: 'T_d wachsend mit T_d(0)=1 (für s_j)', benutzt: ja}
  aussage: |
    Für $n\ge J_0+1$ sind die Kettenwerte $W_k^{(n)}=\alpha T_d(n-k+\theta)(1+\sigma_k)$, $|\sigma_k|\le C_0/s_{n-k}\le\tfrac12$,
    für $0\le k\le n-J_0$ definiert und positiv: (R2) gilt bis zur Stoppstufe $J_0$ ohne Annahme.
  beweis: {art: vollstaendig, text: 'Abwärtsinduktion; erzeugt die Kanalpositivität statt sie anzunehmen.'}
  stuetzt_sich_auf: [bw.lem.wachstumsluecke]
  quellen: [{ref: justus_p3, stelle: 'Lemma 2, Kor. 3'}]
  pruefung:
    f1_folgt_unmittelbar: 'Nein, aber kurz (Induktion).'
    f2_benutzte_voraussetzungen: 'Monotonie von $T_d$ und $s_j\to\infty$; keine Kneser-Spezifika.'
    f3_spezialfall: 'Fehlerkontrolle der Auswertungsleiter = Induktionsinvariante.'
    f4_uebertragbar: 'Jede wachsende Tetration $T_d$ mit $d>\eta$ (Klasse B).'
    f5_neue_frage: 'Reicht die gestoppte Kette für alle Grenzaussagen? → bw.satz.phasengesetz_gestoppt'
  bewertung: {richtigkeit: vollständig, neuheit: vermutlich_neu, recherche: 'Papers I–III; keine Vorlage bekannt.', nutzen: 'Macht die Auswertung bedingungsfrei.', nutzen_stufe: hoch}

# ------------------------------------------------------------- Phasengesetz
- id: bw.satz.schwanzkonvergenz
  titel: Konvergenz der logarithmischen Schwänze (Paper I, Thm. 5.6)
  art: satz
  ebene: B
  status: bedingt
  bedingungen: [bw.ann.hyp22, bw.ann.hyp24]
  objekte: [schwanz_D]
  voraussetzungen:
    - {text: 'Hyp. 2.2', benutzt: ja, ref: bw.ann.hyp22}
    - {text: 'Hyp. 2.4', benutzt: ja, ref: bw.ann.hyp24}
  aussage: '$D_n\to D_{b,d}$ gleichmässig auf $[0,1]$.'
  beweis: {art: bedingt, text: 'Dämpfungsprodukte (Lemmas 5.2–5.4) summierbar ⇒ Cauchy in sup-Norm.'}
  stuetzt_sich_auf: [bw.ann.hyp22, bw.ann.hyp24]
  quellen: [{ref: justus_p1, stelle: 'Thm. 5.6'}]
  pruefung:
    f1_folgt_unmittelbar: Nein.
    f2_benutzte_voraussetzungen: '(R2) nur im Indexbereich $j\ge J_0$ — dort durch die Stoppregel gesichert.'
    f3_spezialfall: 'Kontraktionsargument für iterierte Logarithmen (vgl. Konvergenz von $\log^{\circ n}$ auf Türmen).'
    f4_uebertragbar: 'Jedes Paar wachsender Tetrationen mit $b,d>\eta$, sofern $A_b$ lokal Lipschitz.'
    f5_neue_frage: 'Unbedingte Fassung → bw.satz.phasengesetz_gestoppt'
  bewertung: {richtigkeit: 'bedingt bewiesen', neuheit: vermutlich_neu, recherche: 'Paper I Einleitung.', nutzen: 'Basis des Phasengesetzes.', nutzen_stufe: hoch}

- id: bw.satz.phasengesetz
  titel: Mischbasen-Phasengesetz (Paper I, Thm. 5.7)
  art: satz
  ebene: B
  status: bedingt
  bedingungen: [bw.ann.hyp22, bw.ann.hyp24]
  objekte: [F_bd, phase]
  aussage: '$\operatorname{slog}_b(T_d(x))-x=\mu_{b,d}+P_{b,d}(\{x\})+o(1)$ für $x\to+\infty$, $P$ 1-periodisch mit Mittel 0.'
  beweis: {art: bedingt, text: 'Thm. 5.6 + lokale Lipschitz-Stetigkeit von $A_b$.'}
  stuetzt_sich_auf: [bw.satz.schwanzkonvergenz]
  quellen: [{ref: justus_p1, stelle: 'Thm. 5.7'}, {ref: forum_fox2007, stelle: 'Konstante μ (als exakt angenommen)'}, {ref: forum_levenstein2009, stelle: 'Werte und „wobbles“'}]
  versionen:
    - {datum: '2026-10-08', fassung: 'Graph', aenderung: 'Vorarbeiten aus dem Tetration-Forum (2007, 2009) eingetragen.'}
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus Thm. 5.6.'
    f2_benutzte_voraussetzungen: 'Hyp. 2.2 (R3) für $A_b$; Hyp. 2.4 inzwischen entlastet.'
    f3_spezialfall: 'Allgemeines Muster: Vergleich zweier Abel-Koordinaten ⇒ asymptotisch periodische Abweichung (vgl. kl.beob.zwei_abel für zwei Fixpunkte).'
    f4_uebertragbar: 'Auf $1<b,d<\eta$ (reguläre Zweige) nicht direkt: dort beschränkte Türme, Hyp. 2.4 falsch.'
    f5_neue_frage: 'Regularität von $P$ (Streifen? Gevrey?) und Grösse von $\mu$.'
  bewertung: {richtigkeit: 'bedingt bewiesen', neuheit: vermutlich_neu, recherche: 'Das Phänomen ist im Tetration-Forum bekannt: J. D. Fox (2007) schrieb die Basiswechsel-Formel mit einer additiven Konstante μ auf, S. Levenstein (2009) mass slog_2 − slog_e ≈ 1.1282 usw. und bemerkte, dass der Wechsel „ein wenig wackelt“. Als Satz mit Beweis (Schwanzkonvergenz, Periodizität, Mittel plus Welle) dort nicht gefunden — das bleibt vermutlich neu.', nutzen: 'Zentrales Ergebnis der Serie; erklärt die beobachtete Nicht-Skalarität.', nutzen_stufe: hoch}

- id: bw.satz.phasengesetz_gestoppt
  titel: Phasengesetz für die gestoppte Kette (Paper III-Lesart)
  art: satz
  ebene: B
  status: skizze
  objekte: [F_bd, phase, schwanz_D]
  bereich: 'alle $b,d>\eta$, Kneser-Zweige'
  aussage: 'Das Phasengesetz gilt ohne Hyp. 2.2/2.4, wenn man die gestoppten Schwänze $D_n^{\mathrm{stop}}$ benutzt.'
  beweis:
    art: skizze
    text: 'Stoppregel + Wachstumslücke; Paper III: „alle Schwanzabschätzungen von [1,2] gelten wörtlich für $j\ge J_0$“.'
    luecken:
      - 'Die wörtliche Übertragung der Lemmas 5.2–5.4 (Paper I) auf $j\ge J_0$ ist behauptet, nicht ausgeschrieben.'
      - '(R3) — lokale Lipschitz-Stetigkeit von $A_b$ — folgt aus reeller Analytizität von $\operatorname{slog}_b^{\mathrm K}$; im Text nicht explizit gemacht.'
  stuetzt_sich_auf: [bw.lem.stoppregel, bw.lem.wachstumsluecke, kn.konstr.kneser]
  quellen: [{ref: justus_p3, stelle: '§4, §7'}]
  pruefung:
    f1_folgt_unmittelbar: 'Fast: Inhalt von Paper I + Stoppregel; die Arbeit ist Buchhaltung.'
    f2_benutzte_voraussetzungen: 'Monotonie, $d>\eta$, Lipschitz von $A_b$.'
    f3_spezialfall: —
    f4_uebertragbar: 'Klasse B: jede wachsende reell-analytische Tetration.'
    f5_neue_frage: 'Ausschreiben und als eigenständigen Satz prüfen — dann sind Papers I–II weitgehend unbedingt.'
  bewertung: {richtigkeit: 'plausibel, Lücken benannt', neuheit: vermutlich_neu, recherche: 'Paper III.', nutzen: 'Würde die Bedingtheit der ganzen Serie aufheben.', nutzen_stufe: hoch}
  naechste_frage: 'Lemmas 5.2–5.4 für $j\ge J_0$ ausschreiben (1–2 Seiten).'
  kanten:
    - {typ: verallgemeinert, ziel: bw.satz.phasengesetz}

- id: bw.lem.offset
  titel: Offset-ausgerichteter Grenzkanal
  art: lemma
  ebene: B
  status: bedingt
  bedingungen: [bw.satz.phasengesetz_gestoppt]
  objekte: [phase, kreishomoeo]
  bereich: '$m_\star=\inf\tilde H\ge\mu-\sum_k A_k$, $s=\max(0,\lceil-1-m_\star\rceil)$'
  voraussetzungen:
    - {text: 'Phasengesetz-Paket (P) für (b,d)', benutzt: ja, ref: bw.satz.phasengesetz_gestoppt}
  aussage: '$E_j(\theta)=T_b(j+\tilde H(\theta))>0$ für alle $j\ge s+1$; die gesamte Struktur von Papers I–II gilt für die um $s$ verschobenen Objekte.'
  beweis: {art: bedingt, text: 'Monotonie von $T_b$ auf $(-1,\infty)$ und Verschiebungsäquivarianz.'}
  stuetzt_sich_auf: [bw.satz.phasengesetz_gestoppt]
  quellen: [{ref: justus_p3, stelle: 'Lemma 5'}]
  pruefung:
    f1_folgt_unmittelbar: Ja, aus Monotonie, sobald (P) gilt.
    f2_benutzte_voraussetzungen: '(P) — also ist das Lemma nicht unabhängig vom Phasengesetz (keine Zirkularität, aber Reihenfolge beachten).'
    f3_spezialfall: nein
    f4_uebertragbar: Alle Konstruktionen mit wachsendem $T_b$.
    f5_neue_frage: 'Rand: Paare mit $\mu$ nahe ganzzahlig haben dünne Ränder (e, 1.46: 0.056).'
  bewertung: {richtigkeit: 'bedingt, Beweis vollständig', neuheit: vermutlich_neu, recherche: 'Paper III.', nutzen: 'Repariert die falsche unverschobene Lesart.', nutzen_stufe: mittel}

- id: bw.gegen.unverschoben
  titel: Unverschobene Kanallesart scheitert für (10,2) und (e,1.5)
  art: gegenbeispiel
  ebene: C
  status: numerisch
  objekte: [phase]
  bereich: 'Paare mit $\mu_{b,d}\le-2+\|P\|_\infty$'
  aussage: |
    Für $(10,2)$: $\mu=-2.26496\ldots$, $\inf\tilde H<-2$ ⇒ $T_b(\tilde H)$ auf einem Teil der Periode undefiniert,
    $E_1$ teilweise negativ. Mit $s=2$ ist alles repariert (Rand 0.7346). $(e,1.5)$: $\mu=-9.776$, $s=9$.
  quellen: [{ref: justus_p3, stelle: 'Example 6, Table 1'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus dem gemessenen µ.'
    f2_benutzte_voraussetzungen: 'Gemessenes µ (Engine); rigoros wäre eine Intervallschranke für µ nötig.'
    f3_spezialfall: —
    f4_uebertragbar: 'Alle Paare mit stark negativem µ, z. B. alle $(e,b)$ mit $b$ nahe $\eta$.'
    f5_neue_frage: '—'
  bewertung: {richtigkeit: 'numerisch eindeutig (Abstand zu −2 gross)', neuheit: vermutlich_neu, recherche: 'Paper III.', nutzen: 'Korrigiert eine Lesart von Paper I.', nutzen_stufe: mittel}
  kanten:
    - {typ: korrigiert, ziel: bw.ann.hyp22, notiz: 'unverschobene Lesart von (R2) ist für diese Paare falsch'}

- id: bw.beob.offset_zertifikat
  titel: Offset-Bedingung für 45 Paare zertifiziert
  art: beobachtung
  ebene: C
  status: numerisch
  objekte: [phase, hub_m]
  aussage: 'Alle 45 gemessenen Paare erfüllen $s+m_\star+1>0$ mit rigoroser Modenschranke; engster Rand $(e,1.46)$: 0.0563.'
  quellen: [{ref: justus_p3, stelle: 'Table 1'}]
  pruefung:
    f1_folgt_unmittelbar: Nein (Rechnung).
    f2_benutzte_voraussetzungen: 'Modenamplituden aus der Engine (fatou.gp-Fork).'
    f3_spezialfall: —
    f4_uebertragbar: 'Für jedes neue Paar a priori aus dem Hub prüfbar.'
    f5_neue_frage: 'Gibt es eine allgemeine Schranke $\|P_{b,d}\|_\infty<\mathrm{frac}$-Abstand, die die Bedingung für alle Paare beweist?'
  bewertung: {richtigkeit: numerisch zertifiziert, neuheit: vermutlich_neu, recherche: 'Paper III.', nutzen: 'Restbedingung des Phasengesetzes pro Paar.', nutzen_stufe: mittel}
  kanten:
    - {typ: stuetzt, ziel: bw.lem.offset}

# ------------------------------------------------------------- Kozykel & Kreis
- id: bw.prop.kozykel
  titel: Nichtlinearer Phasen-Kozykel
  art: satz
  ebene: B
  status: bedingt
  bedingungen: [bw.satz.phasengesetz]
  objekte: [phase]
  aussage: '$\Phi_{b,d}(\theta)=\Phi_{c,d}(\theta)+\Phi_{b,c}(\{\theta+\Phi_{c,d}(\theta)\})$; für inverse Paare $\Phi_{d,b}(\{\theta+\Phi_{b,d}(\theta)\})=-\Phi_{b,d}(\theta)$.'
  beweis: {art: bedingt, text: 'Gruppoid-Identität + gleichmässige Phasengrenzwerte.'}
  stuetzt_sich_auf: [bw.prop.gruppoid, bw.satz.phasengesetz]
  quellen: [{ref: justus_p1, stelle: 'Prop. 6.4, Kor. 6.5'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja: Gruppoid + Grenzwert.'
    f2_benutzte_voraussetzungen: 'Existenz der drei Phasengrenzwerte, gleichmässig.'
    f3_spezialfall: 'Lifts bilden ein Gruppoid in $\mathrm{Homeo}^+(S^1)$ — reine Kompositionsregel.'
    f4_uebertragbar: Alle Konstruktionen mit Phasengesetz.
    f5_neue_frage: 'Hub-Zerlegung der Mittel → bw.prop.hub'
  bewertung: {richtigkeit: 'bedingt, Beweis trivial', neuheit: nur_schreibweise, nutzen: 'Strukturgleichung; Inhalt steckt im Phasengesetz.', nutzen_stufe: mittel}

- id: bw.prop.antisym_c1
  titel: Inverse Mittel-Antisymmetrie unter C¹-Diffeo-Annahme (Paper I, Prop. 6.6)
  art: satz
  ebene: B
  status: ueberholt
  objekte: [phase, kreishomoeo]
  voraussetzungen:
    - {text: 'H = id + Φ orientierungserhaltender C¹-Kreisdiffeomorphismus', benutzt: nein, notiz: 'Paper II zeigt: unnötig'}
  aussage: '$\mu_{b,d}=-\mu_{d,b}$.'
  beweis: {art: bedingt, text: 'Substitution mit $H''>0$.'}
  stuetzt_sich_auf: [bw.prop.kozykel]
  quellen: [{ref: justus_p1, stelle: 'Prop. 6.6'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus der inversen Phasengleichung + Substitution.'
    f2_benutzte_voraussetzungen: 'Die C¹-Annahme ist überflüssig (Paper II, Thm. B).'
    f3_spezialfall: 'Ja, von br.satz.young_kreis.'
    f4_uebertragbar: —
    f5_neue_frage: '—'
  bewertung: {richtigkeit: 'richtig, aber mit überflüssiger Voraussetzung', neuheit: nur_schreibweise, nutzen: 'Historische Fassung.', nutzen_stufe: gering}
  versionen:
    - {datum: '2026-06', fassung: 'Paper I', aenderung: 'mit C¹-Annahme'}
    - {datum: '2026-07', fassung: 'Paper II, Thm. B', aenderung: 'ohne jede Glattheit', grund: 'Riemann–Stieltjes-Substitution'}

- id: bw.satz.homoeo
  titel: Phasenabbildung ist Kreishomöomorphismus (Paper II, Thm. A)
  art: satz
  ebene: B
  status: bedingt
  bedingungen: [bw.satz.phasengesetz]
  objekte: [kreishomoeo, phase]
  voraussetzungen:
    - {text: 'Phasengesetz-Paket (P) für (b,d) und (d,b)', benutzt: ja}
  aussage: '$\tilde H_{b,d}$ ist ein streng wachsender, mit $x\mapsto x+1$ vertauschbarer Homöomorphismus mit $\tilde H_{b,d}^{-1}=\tilde H_{d,b}$; die Phasenabbildungen bilden ein Gruppoid in $\mathrm{Homeo}^+(S^1)$.'
  beweis: {art: bedingt, text: 'Grenzwert streng wachsender Abbildungen + inverse Gleichung ⇒ beide Seiten injektiv.'}
  stuetzt_sich_auf: [bw.prop.kozykel]
  quellen: [{ref: justus_p2, stelle: 'Thm. A'}]
  pruefung:
    f1_folgt_unmittelbar: 'Fast: Limites monotoner Funktionen sind monoton; Striktheit aus der Inversen.'
    f2_benutzte_voraussetzungen: '(P) für beide Ordnungen; keine Glattheit.'
    f3_spezialfall: nein
    f4_uebertragbar: Alle wachsenden Konstruktionen.
    f5_neue_frage: 'Antisymmetrie → bw.satz.antisymmetrie'
  bewertung: {richtigkeit: 'bedingt, vollständig', neuheit: vermutlich_neu, recherche: 'Paper II.', nutzen: 'Topologischer Kern.', nutzen_stufe: mittel}

