- id: bw.lem.randgesetz
  titel: Parabolisches Randgesetz m(b) bei b ↓ η (Paper IV, Lemma 8.2)
  art: lemma
  ebene: C
  status: skizze
  objekte: [hub_m, eta, sattel_knoten]
  aussage: '$m(b)=\mu_{e,b}=-\pi\sqrt{2\eta/e}\,(b-\eta)^{-1/2}(1+o(1))$, $\pi\sqrt{2\eta/e}=3.2389305\ldots$ (Paper IV: 3.23907, siehe bw.korr.konstante), mit Korrektur der Ordnung $\ln(b-\eta)$.'
  beweis:
    art: skizze
    text: 'Engpass $w\mapsto w+e^2\delta+w^2/(2e)$, Kontinuumsnäherung: Durchgangszeit $\pi\sqrt{2/(e\delta)}$.'
    luecken:
      - 'Kontinuumsnäherung statt rigoroser Durchgangszeit (Douady–Lavaurs-Theorie).'
      - 'Behauptete Korrektur $O(\ln(b-\eta))$ nicht hergeleitet.'
  stuetzt_sich_auf: [br.satz.sattel_knoten]
  experimente: [exp.randgesetz]
  quellen: [{ref: justus_p4, stelle: 'Lemma 8.2'}]
  pruefung:
    f1_folgt_unmittelbar: '**Ja, als Spezialfall** der klassischen Sattel-Knoten-Durchgangszeit $\pi/\sqrt{a\varepsilon}$ (Pomeau–Manneville-Intermittenz).'
    f2_benutzte_voraussetzungen: 'Nur der quadratische Term am Engpass.'
    f3_spezialfall: 'Ja, von br.satz.sattel_knoten.'
    f4_uebertragbar: 'Jede Grösse, die Höhen zwischen $b$ nahe $\eta$ und einer festen Basis vergleicht.'
    f5_neue_frage: 'Rigorose Fassung mit Konstante und Phasenterm über parabolische Implosion → br.frage.implosion'
  bewertung: {richtigkeit: 'Leitterm: reine Iteration bestätigt $A$ auf 6e-5; Hub-Daten nur auf 4–7 % (modellabhängig), nicht 2.3 % wie in Paper IV', neuheit: folklore, nutzen: 'Erklärt die Divergenz der Hub-Spalte.', nutzen_stufe: mittel}
  kanten:
