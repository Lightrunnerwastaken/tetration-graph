- id: bw.satz.ursache_kozykel
  titel: Ursache der Singularitäten — Periodenfehlanpassung im Koenigs-Konjugator
  art: satz
  ebene: C
  status: skizze
  objekte: [phase, multiplikator, kneser_T]
  aussage: |
    Mit $P_a=2\pi i/\ln\lambda_a$ erfüllt der Konjugator $\kappa=K-\mathrm{id}$ der Koenigs-Koordinaten
    $\kappa(\xi+P_d)-\kappa(\xi)=P_b-P_d$; daher ist er in jeder Zelle singulär, mit Residuensumme
    $1/\ln\lambda_d-1/\ln\lambda_b$. Äquivalent: $D=T_b\circ\tilde H$ ist eine **nicht-Kneser** Basis-$b$-Tetration
    (sonst Widerspruch zur Eindeutigkeit).
  beweis:
    art: skizze
    text: 'Periodenvergleich der beiden Koenigs-Koordinaten; Eindeutigkeit nach Paulsen–Cowgill.'
    luecken:
      - 'Herleitung im Forschungslog, nicht als Beweis ausgeschrieben.'
      - 'Zusammenhang mit der gemessenen Lage (Positionsgesetz) nur numerisch.'
  stuetzt_sich_auf: [kn.satz.paulsen_cowgill, fg.satz.schroeder_abel]
  quellen: [{ref: justus_log, stelle: 'Runde 20 (4)'}]
  pruefung:
    f1_folgt_unmittelbar: 'Der Teil „$T_b\circ\tilde H$ ist nicht Kneser“ folgt unmittelbar aus fg.satz.allgemeine_loesung + Eindeutigkeit, sobald $P\not\equiv0$.'
    f2_benutzte_voraussetzungen: 'Fortsetzbarkeit der Koenigs-Koordinaten; Perioden exakt.'
    f3_spezialfall: 'Allgemeines Prinzip: zwei Abel-Koordinaten mit verschiedenen komplexen Perioden können nicht global holomorph konjugiert sein.'
    f4_uebertragbar: 'Modellfall kl.verm.streifenbreite (dort reelle Perioden, gleiche Mechanik).'
    f5_neue_frage: 'Liegen die Singularitäten dicht am Rand (Gevrey) oder in festem Abstand (Streifen)?'
  bewertung: {richtigkeit: 'Skizze, plausibel', neuheit: vermutlich_neu, recherche: 'Runde 20.', nutzen: 'Erklärt, warum Φ singulär sein muss.', nutzen_stufe: hoch}
  kanten:
    - {typ: analog_zu, ziel: kl.verm.streifenbreite}

