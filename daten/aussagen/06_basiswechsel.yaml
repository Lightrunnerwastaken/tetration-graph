  objekte: [kern_V]
  aussage: '$G:=\partial_\beta\chi/\chi''$ erfüllt $G(d^y)=(\ln d)\,d^y\,(G(y)-y)$; daher löst $A_d''G+h\circ A_d$ die kohomologische Gleichung für jedes periodische $h$.'
  beweis: {art: vollstaendig, text: 'Drei Zeilen über $A_d''(d^y)d^y\ln d=A_d''(y)$.'}
  stuetzt_sich_auf: [fg.satz.kohomologisch]
  quellen: [{ref: justus_p5, stelle: 'Lemma 7'}]
  pruefung:
