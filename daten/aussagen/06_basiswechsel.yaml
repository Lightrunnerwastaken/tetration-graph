  art: definition
  ebene: C
  status: definition
  objekte: [kern_V, rh_problem]
  aussage: |
    (i) $V(d^y)-V(y)=-A_d'(d^y)\,y\ln d\,d^y$; (ii) reell auf $\mathbb R$; (iii) vorgeschriebene Fixpunktsingularität
    (Pol $dL/d\beta=\ln d\,L^2/(1-\lambda)$, log-Koeffizient $d\lambda/d\beta$, radial gelesen); (iv) $V(1)=0$.
  quellen: [{ref: justus_p5, stelle: 'Def. 1'}]

