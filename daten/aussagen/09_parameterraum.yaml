  bewertung: {richtigkeit: vollständig, neuheit: vermutlich_neu, recherche: 'Literaturabgleich L1, 12.10.2026: Die Literatur zum Bereich unter $e^{-e}$ behandelt den Turm (Barrow 1936, Knoebel 1981, de Villiers–Robinson 1986, MacDonnell 1989, Cho–Kim 2004, Baker–Rippon 1985/89, Galidakis 2005), nicht eine Tetration in gebrochener Höhe. Im Forum hat tid 352 (2009, drei Seiten) genau diese Frage gestellt; dort scheitern reguläre Iteration am abstossenden Fixpunkt und am 2-Zyklus, Helms rechnet über einen komplexen Fixpunkt — Rechteckwelle und Kreuzen der Julia-Menge kommen nicht vor. Ueda 2021 (arXiv 2105.00247, zurückgezogen) gibt nur eine stückweise Formel. Cho–Kim 2004 im Original gelesen (nur Grenzfunktionen des Turms); Gao–Han–Schilling (Bezahlschranke) nicht.', nutzen: 'Zeigt, was aus der Basiswechsel-Welle wird, wenn der Fixpunkt abstossend reell ist.', nutzen_stufe: hoch}
