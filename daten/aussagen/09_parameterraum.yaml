- id: fp.beob.partner_keil
  titel: Anziehende Partner gibt es nur im Keil links der Shell–Thron-Region
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: forschung
  objekte: [fixpunkt_L, multiplikator, shell_thron]
  bereich: 'Familie $c_m=(\lambda+2\pi im)e^{-\lambda}$, $|\lambda|<1$, Basis nur, wenn $|\mathrm{Im}\,c_m|\le\pi$ (Hauptzweig)'
  aussage: |
    Eine Basis $b$ hat einen **anziehenden** Partner mit gleichem Fixpunkt genau dann, wenn $|\lambda_b-2\pi ik|<1$ für ein ganzes $k\ne0$.
    Im Hauptzweig kommen dabei nur $m=\pm1$ vor ($m=\pm2$: kein einziger der 12 547 460 Gitterpunkte der Einheitsscheibe landet im Streifen),
    jeweils 18.371 % der Scheibe. Alle solchen Basen haben $\mathrm{Re}\,b<0$: sie bilden einen Keil links der Shell–Thron-Region mit Spitze bei
    $e^{-e}$ ($\mathrm{Re}\,b\in[-141.12,-0.006]$, $|\mathrm{Im}\,b|\le22.288$); die Bilder von $m=+1$ und $m=-1$ treffen sich genau auf der
    negativen reellen Achse ($\mathrm{Im}\,\mathrm{Log}\,b=\pi$). Die klassischen Basen $2,e,3,4$ haben keinen anziehenden Partner.
    Beispiele (Partner $d$, $\sigma=\mathrm{Log}\lambda_d/\mathrm{Log}\lambda_b$): $-19/25\to1.425186736-0.046203369i$; $-1\to1.417109495-0.024735158i$;
    $-2\to1.419386100+0.023509055i$; $-1+i\to1.444590692-0.000093874i$ (fast $\eta$, schwach gedämpft).
  einfach: >-
    Damit eine Basis einen „ruhigen Zwilling“ mit demselben Fixpunkt hat, muss sie links von der Shell–Thron-Region liegen,
    im Bereich mit negativem Realteil. Die gewohnten Basen 2, e, 3, 4 haben keinen.
  formen:
    - {tex: 'b=-\tfrac{19}{25}:\ L=1.9047135243-0.3776210535i,\ \lambda_b=0.6636079560+6.0874671461i,\ \lambda_d=\lambda_b-2\pi i', notiz: 'Musterpaar'}
  gegenbeispielsuche: 'Original: Gitter mit 12 547 460 Punkten; exp.funde rechnet das Musterpaar −19/25 unabhängig nach (Abweichung 4·10⁻¹⁴, genau ein Partner, m = +1).'
  experimente: [exp.funde]
  pruefung:
    f1_folgt_unmittelbar: 'Kriterium ja (Multiplikatoren der Familie liegen im Abstand 2πi); Keil und „nur ±1“ numerisch.'
    f2_benutzte_voraussetzungen: 'Hauptzweig von Log b; anziehend heisst |λ_d| < 1.'
    f3_spezialfall: 'Spezialfall von fp.satz.gleiches_L mit der Streifenbedingung.'
    f4_uebertragbar: 'Auf andere Zweige von Log: dann erscheinen weitere Blätter.'
    f5_neue_frage: 'Beweis, dass m = ±2 nie im Streifen landet (Abschätzung von arg((λ + 4πi)e^{−λ})).'
  bewertung: {richtigkeit: 'numerisch, Kriterium bewiesen', neuheit: neu_ungeprueft, nutzen: 'Sagt, wo der wellenfreie Basiswechsel überhaupt möglich ist.', nutzen_stufe: mittel}
  quellen: [{ref: justus_bc_geteilt, stelle: '§§1.1, 3.2'}]
  kanten:
    - {typ: spezialfall_von, ziel: fp.satz.gleiches_L}
    - {typ: verwandt, ziel: fp.beob.negative_achse}

- id: fp.beob.negative_achse
  titel: Die negative reelle Achse — beschränkt, Ausflug, Flucht als Staub
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: vertiefung
  objekte: [turm, shell_thron]
  bereich: '$b\in[-3,0]$, Hauptzweig $\mathrm{Log}\,b=\ln|b|+i\pi$, Startwert 1'
  aussage: |
    Links der Shell–Thron-Region gibt es drei Verhaltensarten: Turm **beschränkt** (Zyklen, z. B. $b=-2$ Periode 8, $b=-3/4$ Periode 6,
    $b=-1$: $1\mapsto-1\mapsto-1$), **riesiger Ausflug und Rückfall** (die Bahn wird gross, fällt aber auf fast 0 und beginnt bei 1 neu —
    nicht divergent), und **echte Flucht** (z. B. $b=-19/25$). Die fliehenden Basen bilden **Staub**: 4196 getrennte Stücke in $[-3,0]$,
    mittlere Breite $5\cdot10^{-5}$. Für $-0.0805281576<b<0$ liegt ein anziehender 2-Zyklus vor (fp.satz.p2_form).
  einfach: >-
    Bei negativen Basen springt der Turm wild hin und her. Meist bleibt er beschränkt oder macht nur einen riesigen Ausflug und fällt
    zurück; echtes Davonlaufen kommt nur an winzigen, verstreuten Stellen vor.
  experimente: [exp.parameterraum]
  pruefung:
    f1_folgt_unmittelbar: Nein.
    f2_benutzte_voraussetzungen: 'Endliche Iterationszahl; „Ausflug und Rückfall“ von Flucht durch den „entscheidenden Schritt“ getrennt (Re(c z) < 0 nach dem Ausflug).'
    f3_spezialfall: 'Analogon der Cantor-Bündel fliehender Parameter der Exponentialfamilie.'
    f4_uebertragbar: —
    f5_neue_frage: 'Hausdorff-Dimension des Staubs auf der Achse.'
  bewertung: {richtigkeit: numerisch, neuheit: neu_ungeprueft, nutzen: 'Erklärt, warum komplexe/negative Basen fast nie wirklich fliehen.', nutzen_stufe: gering}
  quellen: [{ref: justus_bc_geteilt, stelle: 'figure_real_axis_strip, figure_base_plane'}]
  kanten:
    - {typ: verwandt, ziel: fp.beob.regionen}

- id: fp.satz.p2_form
  titel: Die Periode-2-Region in geschlossener Form
  art: satz
  ebene: C
  status: bewiesen
  niveau: forschung
  objekte: [turm, multiplikator, shell_thron]
  bereich: '$E_c(z)=e^{cz}$, 2-Zyklus $\{z_1,z_2\}$; Parameter $s\in\mathbb C$, $p=(s/2)^2$'
  aussage: |
    $$u=-\frac{s}{e^s-1},\quad v=u\,e^s,\quad z_1=e^v,\ z_2=e^u,\quad c=v\,e^{-u}=u\,e^{-v},\quad b=e^c,\quad \mu=uv=\Bigl(\frac{s}{2\sinh(s/2)}\Bigr)^2=G(p)^2,$$
    $G(p)=\sqrt p/\sinh\sqrt p$. $p$ durchläuft die Komponente genau einmal, $|\mu|<1$ ist die Zugehörigkeit. Reelles $s>0$ gibt genau die Strecke
    $(0,e^{-e})$ mit $\mu\in(0,1)$ reell: **auf der reellen Achse gibt es unter $e^{-e}$ keine Periodenverdopplung**, der Turm bleibt bis $b\to0$
    2-periodisch; die Kaskade liegt ganz im Komplexen (Wurzel der Periode-4-Komponente $b=0.0295202424-0.0645122059i$).
  einfach: >-
    Für Basen zwischen 0 und etwa 0.066 springt der Turm zwischen zwei Werten. Welche Basen das sind, lässt sich mit einer einzigen
    Formel aufschreiben — und auf der reellen Achse wird aus dem Zweierwechsel nie ein Viererwechsel.
  formen:
    - {tex: 'z_1\ln z_1=z_2\ln z_2', notiz: 'reelle Form; dieselbe Gleichung wie bei den Turm-Integralen (gr.kor.turmintegral_formen)'}
    - {tex: 's\to0:\ c\to-e,\ b\to e^{-e},\ \mu\to1', notiz: 'Spitze'}
  beweis: {art: vollstaendig, text: '$u=cz_1$, $v=cz_2$ erfüllen $u=ce^v$, $v=ce^u$; mit $s=u-v$ folgt $u-v=c(e^v-e^u)$ und daraus die Auflösung. $\mu=(E\circ E)''(z_1)=c^2z_1z_2=uv$. $c(-s)=c(s)$ (Zyklenpunkte vertauscht), also analytisch in $p$. Reell: $s/(2\sinh(s/2))\in(0,1)$ für $s>0$.'}
  experimente: [exp.funde]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, zwei Zeilen Algebra.'
    f2_benutzte_voraussetzungen: 'Nur die Zyklusgleichung.'
    f3_spezialfall: 'Gegenstück zur Rezeptur c = λe^{−λ} für Fixpunkte (fp.satz.multiplikator_rezept).'
    f4_uebertragbar: 'Für Zyklen der Länge ≥ 3 keine so einfache Auflösung bekannt.'
    f5_neue_frage: 'Form der Komponente → fp.satz.p2_kein_kreis; Raten → fp.satz.p2_raten'
  gegenbeispielsuche: 'Original: μ = uv auf 10⁻⁵¹, Rand auf 10⁻¹⁶, 400 reelle Basen μ ∈ (0,1). exp.funde: Zyklusprobe bei s = 1.3 exakt, μ reell in (0,1) bei b = 0.06 … 10⁻⁶.'
  bewertung: {richtigkeit: vollständig, neuheit: bekannt, recherche: 'Literaturabgleich L1, 12.10.2026 — im Kern bekannt. Reell: dass der Turm für alle $0<b<e^{-e}$ zwischen zwei Grenzwerten pendelt (keine weitere Periodenverdopplung), steht schon bei Euler 1778 (E489, §§38–39, Übersetzung gelesen) und Barrow 1936, ausführlich bei Knoebel 1981, de Villiers–Robinson 1986 und Cho–Kim 2004 (Analytizität der beiden Grenzfunktionen). Komplex: Baker–Rippon 1985 (Fibonacci Quart.) parametrisieren Türme mit zwei abwechselnden Basen durch $\log a=se^{-t}$, $\log b=te^{-s}$, Konvergenz genau bei $|st|\le1$; für $a=b$ ist das unsere Form mit $(s,t)=(v,u)$ und $\mu=uv$; allgemein für periodische Basen Baker–Rippon 1989; $D_2$ zusammenhängend: Baker–Rippon 1984; zweite Hilfsgleichung mit Lambert W: Galidakis 2005. Eigen sind nur die Schreibweise mit $G(p)=\sqrt p/\sinh\sqrt p$ und die Zahl der Periode-4-Wurzel.', nutzen: 'Exakte Beschreibung dessen, was unter der Eulerschen Schranke e^{−e} geschieht.', nutzen_stufe: hoch}
  quellen: [{ref: justus_periode2, stelle: '§§0–1, 7'}, {ref: barrow1936, stelle: 'Oszillation zwischen zwei Werten für a < e^{−e} (JFM-Rezension)'}, {ref: baker_rippon1985, stelle: 'Parametrisierung log a = s e^{−t}, log b = t e^{−s}, |st| ≤ 1', geprueft: sekundaer}, {ref: baker_rippon1989a, geprueft: sekundaer}, {ref: baker_rippon1984, stelle: 'D_2 zusammenhängend', geprueft: sekundaer}, {ref: galidakis2005, geprueft: sekundaer}, {ref: euler1778, stelle: '§§38–39', geprueft: original}, {ref: cho_kim2004, stelle: 'Thm. 2.1 (h_e, h_o analytisch in √(e^{−e} − x))', geprueft: original}]
  kanten:
    - {typ: analog_zu, ziel: fp.satz.multiplikator_rezept}
    - {typ: verwandt, ziel: gr.kor.turmintegral_formen}

- id: fp.satz.p2_kein_kreis
  titel: Die Periode-2-Blase ist kein Kreis
  art: satz
  ebene: C
  status: bewiesen_literatur
  niveau: forschung
  objekte: [multiplikator, shell_thron]
  bereich: 'hyperbolische Komponente $W$ (Periode 2) der $c$-Ebene, sichtbarer Teil $V=\exp(W\cap\{|\mathrm{Im}\,c|\le\pi\})$'
  aussage: |
    $e^{cz}$ hat keinen kritischen Punkt, also kein Zentrum mit $\mu=0$: $\mu:W\to\mathbb D\setminus\{0\}$ ist eine universelle Überlagerung,
    $W$ ist unbeschränkt und kann keine Kreisscheibe sein (anders als $|c+1|<\tfrac14$ bei $z^2+c$). Sichtbar ist $V=\{0<|b|<R(\arg b)\}$,
    sternförmig um 0 (gelocht), $R(0)=e^{-e}$, $R(\pm\pi)=0.0805281576254835628\ldots$ ($b_{\text{links}}$), $R_{\max}/R_{\min}=1.2203448185$,
    Fläche $0.016396425069$; bester Kreis um $-0.0067418921$ mit Radius $0.0722455899$ weicht bis 2.13 % ab. Bei $b_{\text{links}}$ hat der Rand
    einen Knick (Innenwinkel $175.0897607°$, Schnitt des Hauptzweigs), der den $1/k^2$-Schwanz der Fourier-Koeffizienten von $R(\theta)$ erzeugt.
  einfach: >-
    Die Region, in der der Turm zwischen zwei Werten springt, sieht fast wie ein Kreis aus, ist aber keiner — nach links ist sie gut 20 %
    breiter. Der Grund: Die Exponentialfunktion hat keinen „Mittelpunkt“, um den sich ein Kreis bilden könnte.
  beweis: {art: literatur, text: 'Kein singulärer Wert wird angenommen ⇒ μ ≠ 0 auf W. Dass hyperbolische Komponenten der Exponentialfamilie einfach zusammenhängend und unbeschränkt sind und der Multiplikator eine universelle Überlagerung von D \ {0} ist: Baker–Rippon, Eremenko–Lyubich, Schleicher. Zahlen: Original (Randpunkte auf 10⁻¹⁶, Fläche zweifach bestimmt).'}
  experimente: [exp.funde]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus der Literatur über hyperbolische Komponenten der Exponentialfamilie.'
    f2_benutzte_voraussetzungen: 'Fehlen eines kritischen Punkts.'
    f3_spezialfall: 'Ja: allgemeiner Satz über hyperbolische Komponenten von e^z + κ (fp.satz.exp_normalform).'
    f4_uebertragbar: 'Gilt für jede hyperbolische Komponente (jede Periode) dieser Familie.'
    f5_neue_frage: 'Blattstruktur: die Randkurve schneidet jede Höhe Im c = kπ einmal (zweites Blatt bei b = 0.0494).'
  gegenbeispielsuche: 'exp.funde: b_links unabhängig über |G(p)| = 1, Im c = π bestimmt: −0.08052815762548356282 (alle 20 Stellen).'
  bewertung: {richtigkeit: 'gesichert (Literatur), Zahlen bestätigt', neuheit: bekannt, nutzen: 'Erklärt die Form der blauen Blase in Bild 1.', nutzen_stufe: mittel}
  quellen: [{ref: justus_periode2, stelle: '§§2–3'}, {ref: schleicher2004}, {ref: baker_rippon1985}, {ref: baker_rippon1984, stelle: 'D_2 zusammenhängend', geprueft: sekundaer}]
  kanten:
    - {typ: stuetzt_sich_auf, ziel: fp.satz.p2_form}

- id: fp.satz.p2_raten
  titel: Wie schnell der Zweierwechsel einrastet
  art: satz
  ebene: C
  status: bewiesen
  niveau: forschung
  objekte: [turm, multiplikator]
  bereich: 'Periode-2-Region, Startwert 1'
  aussage: |
    Pro Exponentiation schrumpft der Fehler um $|\mu|^{1/2}=|G(p)|$ (Koenigs der Rückkehrabbildung): $z_{2n}=z_1+K(1)\mu^n+O(\mu^{2n})$.
    An der Spitze $b=e^{-e}$ nur algebraisch: $|z_n-1/e|\sim\frac{\sqrt6}{e}\,n^{-1/2}$, $\frac{\sqrt6}e=0.9011169177\ldots$
    Nahe der Spitze, $b=e^{-e}(1-t)$: $1-\mu=\frac2e\,t+O(t^2)$ und $|z_1-z_2|=2\sqrt6\,e^{-3/2}\sqrt t+O(t)$.
    Komplexe Basen: der Rest spiralt mit $\arg\mu/2$ pro Exponentiation (z. B. $b=-0.05+0.04i$: eine Umdrehung je 7.41 Schritte).
  einfach: >-
    Tief in der Region rastet der Zweierwechsel in wenigen Schritten ein, am Rand immer langsamer, und genau an der Spitze e^(−e) nur noch
    wie 1 durch Wurzel n — mit dem exakten Vorfaktor √6/e.
  beweis: {art: vollstaendig, text: '$E(L+h)=L-h+\tfrac e2h^2-\tfrac{e^2}6h^3+\dots$ ⇒ $E^{\circ2}(L+h)=L+h-\tfrac{e^2}6h^3+O(h^4)$ ⇒ $h_{m+1}^{-2}=h_m^{-2}+\tfrac{e^2}3+\dots$, also $|h|\sim\sqrt6/(e\sqrt n)$ ($n=2m$). Spitzenentwicklung aus der geschlossenen Form bei kleinem s.'}
  stuetzt_sich_auf: [fp.satz.p2_form, fp.satz.parabolisch_rand]
  experimente: [exp.funde]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus Koenigs bzw. der kubischen Normalform.'
    f2_benutzte_voraussetzungen: 'Nur lokale Taylorentwicklung.'
    f3_spezialfall: 'Ja: fp.satz.parabolisch_rand mit q = 2, hier mit Konstante.'
    f4_uebertragbar: 'Gleiche Rechnung an jeder Knospenwurzel.'
    f5_neue_frage: 'Amplitude |K(1)| (Maximum 0.1240 bei b = 0.043) — geschlossene Form?'
  gegenbeispielsuche: 'exp.funde: √n|z_n − 1/e| = 0.901664 bei n = 10⁶ (Original 0.901664); (1 − μ)/t = 0.735758883, |z₁ − z₂|/√t = 1.093110076 bei t = 10⁻⁸.'
  bewertung: {richtigkeit: vollständig, neuheit: folklore, recherche: 'Literaturabgleich L1, 12.10.2026: Das Gesetz $n^{-1/2}$ am parabolischen Punkt mit Multiplikator $-1$ ist die Standardrechnung für Iterationen nahe einem Fixpunkt mit Multiplikator 1 (Leau–Fatou; Raten bei Thron 1960 und de Bruijn 1958, Kap. 8). Cho–Kim 2004 (Original gelesen, Thm. 2.1) enthalten die Spitzen-Entwicklung der beiden Grenzwerte in $\sqrt{e^{-e}-x}$ mit Leitkoeffizient $\sqrt{6/e}$ — daraus folgt unsere Lücke $|z_1-z_2|\sim2\sqrt6e^{-3/2}\sqrt t$: dieser Teil ist bekannt. Die Konvergenzrate $\tfrac{\sqrt6}{e}n^{-1/2}$ der Folge selbst und $1-\mu\sim\tfrac2et$ stehen dort nicht; Gao–Han–Schilling 2012 (Bezahlschranke) ungeprüft.', nutzen: 'Exakte Konstanten an der Eulerschen Schranke.', nutzen_stufe: mittel}
  quellen: [{ref: justus_periode2, stelle: '§§4–5'}, {ref: cho_kim2004, stelle: 'Thm. 2.1 und Folgerung: Entwicklung in √(e^{−e} − x), A = √(6/e)', geprueft: original}, {ref: gao_han_schilling2012, stelle: 'Konvergenzrate (Inhalt unbekannt)'}, {ref: thron1960}]
  kanten:
    - {typ: verwandt, ziel: gr.verm.turmintegral_rate, notiz: 'dieselbe n^{−1/2}-Spitze erzeugt dort den Exponenten 3/2'}

- id: fp.satz.rechteckwelle
  titel: Unter e^{−e} wird die Phase zur Rechteckwelle
  art: satz
  ebene: B
  status: bewiesen
  niveau: forschung
  objekte: [T_b, turm, periodische_stoerung]
  bereich: '$0<b<e^{-e}$, $T$ eine stetige reelle Tetration, die $L$ auf $[0,1)$ genau einmal kreuzt (z. B. monoton auf $[0,1]$)'
  voraussetzungen:
    - {text: 'T stetig, reell, T(0) = 1, T(x+1) = b^{T(x)}', benutzt: ja}
    - {text: 'T kreuzt den Fixpunkt L auf [0,1) genau einmal', benutzt: ja}
    - {text: 'T analytisch oder regulär', benutzt: nein}
  aussage: |
    Es gibt genau ein $x^*\in(0,1)$ mit $T(x^*)=L$, und dann $T(x^*+n)=L$ für alle $n$ (die Tetration **kreuzt die Julia-Menge**).
    $\Omega(x)=\lim_nT(x+2n)$ ist eine 2-periodische **Rechteckwelle**: $z_A$ auf $(x^*-1,x^*)$, $z_B$ auf $(x^*,x^*+1)$ (mod 2), $\Omega(x^*)=L$.
    Eine stetige 2-periodische Grenzfunktion gibt es nicht. Fourier: $c_0=\tfrac{z_A+z_B}2$, $c_k=\frac{i(z_A-z_B)e^{-i\pi kx^*}}{\pi k}$ für ungerades $k$,
    0 für gerades. Die Form ist **universell**; nur $x^*$ hängt von der gewählten Tetration ab. Zwei Raten: neben dem Sprung $|\mu|^{n/2}$,
    Breite des Übergangs $|\lambda|^{-n}$ ($\lambda=cL<-1$).
  einfach: >-
    Unter e^(−e) springt der Turm zwischen zwei Werten. Zeichnet man die stetige Tetration bei geraden Höhen immer weiter oben,
    wird ihre Kurve zu einem Rechteck: genau an einer Stelle muss sie den abstossenden Fixpunkt treffen und bleibt dort hängen.
  formen:
