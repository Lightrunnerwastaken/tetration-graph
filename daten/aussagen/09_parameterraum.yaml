  beweis: {art: vollstaendig, text: '$E$ ist auf ℝ fallend, $E\circ E$ wachsend mit Fixpunkten $z_B<L<z_A$; $(L,\infty)$ ist Becken von $z_A$, $(0,L)$ von $z_B$, einzige Trennstelle $L$. $T(0)=1>L>b=T(1)$ ⇒ Zwischenwertsatz. Ein stetiges 2-periodisches Ω hätte ein zusammenhängendes E-invariantes Bild in zwei getrennten Becken — unmöglich. Fourier-Reihe der Rechteckwelle.'}
  stuetzt_sich_auf: [fp.satz.p2_form]
