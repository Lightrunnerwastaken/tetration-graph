- id: it.satz.moebius_familie
  titel: 'Ein Modell für den Übergang bei η: die Möbius-Familie ist durch den parabolischen Fall hindurch analytisch'
  art: satz
  ebene: A
  status: bewiesen
  niveau: vertiefung
  objekte: [iterationsgruppe, multiplikator]
  bereich: '$f_\varepsilon(z)=\dfrac{z+1}{1-\varepsilon z}$, Matrix $A_\varepsilon=\begin{pmatrix}1&1\\-\varepsilon&1\end{pmatrix}$'
  aussage: |
    Für $\varepsilon<0$ hat $f_\varepsilon$ zwei reelle Fixpunkte (wie $b^x$ unter $\eta$), für $\varepsilon=0$ einen parabolischen ($z\mapsto z+1$, wie bei $\eta$), für $\varepsilon>0$
    ein komplexes Paar (wie über $\eta$). Die Iterierten $f_\varepsilon^{[t]}$ zur Matrix $A_\varepsilon^t=\exp(t\log A_\varepsilon)$ sind für jedes reelle $\varepsilon$ reell, an beiden
    Fixpunkten dieselben (kein „Bummer“) und **analytisch in $\varepsilon$ durch $\varepsilon=0$ hindurch**. Bei der Tetration ist genau das offen (kl.frage.eta_analytisch):
    Dort unterscheiden sich schon die beiden regulären Iterationen unter $\eta$.
  einfach: >-
    Für Bruchfunktionen kann man den Übergang „zwei Fixpunkte → einer → keiner reeller“ ganz durchrechnen: Die gebrochenen Iterierten ändern sich dabei
    vollkommen glatt. Bei der Exponentialfunktion ist das gerade die ungelöste Frage.
  beweis:
    art: vollstaendig
    text: |
      $A_\varepsilon=I+N$ mit $N^2=-\varepsilon I$; mit $\mu=\sqrt{-\varepsilon}$ hat $N$ die Eigenwerte $\pm\mu$, also $A^t=a_tI+b_tN$ mit
      $a_t=\frac{(1+\mu)^t+(1-\mu)^t}2$, $b_t=\frac{(1+\mu)^t-(1-\mu)^t}{2\mu}$. Beide sind gerade in $\mu$, also analytisch in $\varepsilon=-\mu^2$ für $|\varepsilon|<1$, und reell für reelles
      $\varepsilon$ (dann ist $\mu$ reell oder rein imaginär).
      Gleiche Iterierte an beiden Fixpunkten: Die reguläre Iteration an einem Fixpunkt ist die einzige dort holomorphe (it.satz.vertauschbar), und $A^t$ ist an beiden holomorph.
  experimente: [exp.forum_iteration]
  stuetzt_sich_auf: [it.satz.moebius_iteration]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, Matrixrechnung.'
    f2_benutzte_voraussetzungen: 'Möbius-Abbildungen entsprechen 2×2-Matrizen.'
    f3_spezialfall: 'Ja: parabolische Implosion ist bei Möbius-Abbildungen trivial.'
    f4_uebertragbar: 'Nicht auf exp — dort fehlt die globale Linearisierung.'
    f5_neue_frage: 'Was genau zerstört bei exp die Analytizität (falls sie fehlt)? → br.frage.implosion'
  bewertung: {richtigkeit: vollständig, neuheit: bekannt, nutzen: 'Zeigt am einfachsten Modell, was man bei η erwarten könnte — und was bei exp anders ist.', nutzen_stufe: mittel}
  quellen: [{ref: forum_tid1608}, {ref: schroeder1871, stelle: 'Iterierte gebrochen linearer Abbildungen', geprueft: sekundaer}]
  kanten:
    - {typ: verwandt, ziel: kl.frage.eta_analytisch}
    - {typ: verwandt, ziel: br.frage.implosion}
