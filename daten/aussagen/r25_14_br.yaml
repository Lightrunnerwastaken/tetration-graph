- id: br.beob.ausgewogene_raenge_entartung
  titel: 'Ausgewogene Ränge entarten bei 1: die ausgewogene Pentation hat dort einen dreifachen Fixpunkt'
  art: beobachtung
  ebene: X
  status: numerisch
  niveau: forschung
  objekte: [hyperoperation, fatou_koord]
  bereich: 'Ausgewogene Pentation $P(y)=y[4]y$ mit der Fortsetzung br.satz.klammerung_fortsetzung; Log-Koordinate $\ell=\ln y$'
  aussage: |
    Aus $\ln P(e^\ell)=F^{[s]}(\ell)$ mit $s=\ell/\ln2$ und $F^{[s]}(\ell)=\ell+s\ell^2+(s^2-\tfrac s2)\ell^3+\dots$ folgt formal
    $$\ln P(e^\ell)=\ell+\frac{\ell^3}{\ln2}-\frac{\ell^4}{2\ln2}+O(\ell^5).$$
    Numerisch: $(\ln P-\ell)/\ell^3=1.439155$ bei $\ell=0.005$ und $1.446369$ bei $\ell=-0.005$; Mittel $1.442762$ gegen $1/\ln2=1.442695$, Steigung $-0.7214$ gegen $-1/(2\ln2)=-0.7213$
    (zwei Einstellungen auf 22 Stellen gleich). Der Fixpunkt 1 ist also dreifach (zwei Blätter, auf beiden reellen Seiten abstossend).
    Formal (nur gerechnet für Rang 5) ist der ausgewogene Schritt von Rang $k$ von der Form $\zeta+\zeta^{k-2}/(\ln2)^{k-4}+\dots$: die Entartung wächst mit dem Rang.
  einfach: >-
    Bei den ausgewogenen Varianten wird der Punkt 1 mit jedem Rang „flacher“: Die Abbildung weicht dort immer langsamer von der Identität ab.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/14_klammerungen/BERICHT.md, Befund 12; kanonisch.py (kanonisch_A.txt, kanonisch_B.txt; der Bericht nennt 1.43932 statt 1.439155)'}]
  pruefung:
    f1_folgt_unmittelbar: 'Formal ja (Einsetzen der Flussformel); die gleichmässige Gültigkeit für $s\to0$ ist nicht bewiesen.'
    f2_benutzte_voraussetzungen: 'Fortsetzung über die Fatou-Koordinate; Entwicklung der gebrochenen Iterierten für kleine $s$.'
    f3_spezialfall: 'Nein.'
    f4_uebertragbar: 'Ränge ≥ 6 brauchen mehrblättrige Fatou-Koordinaten (nicht gerechnet).'
    f5_neue_frage: 'Ausgewogene Ränge ≥ 6 numerisch; wie viele Blätter hat der Schritt von Rang k wirklich?'
  bewertung: {richtigkeit: 'numerisch für Rang 5 (4 Stellen im Koeffizienten), formal für höhere Ränge', neuheit: neu_ungeprueft, nutzen: 'Zeigt, dass linke und ausgewogene Ränge ab 5 verschieden gebaut sind.', nutzen_stufe: gering}
  kanten:
    - {typ: stuetzt_sich_auf, ziel: br.satz.klammerung_fortsetzung}
    - {typ: verwandt, ziel: it.satz.leau_fatou}
    - {typ: verwandt, ziel: br.satz.linke_raenge_keim}
