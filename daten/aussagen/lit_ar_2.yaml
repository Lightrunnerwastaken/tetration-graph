gebiet: ar
# Exponentielle Fakultät aus sexp (Forum tid 1828), nachgerechnet in exp.verwandte_funktionen (13.10.2026).
aussagen:

- id: ar.konstr.ef_sexp
  titel: 'Exponentielle Fakultät über die Tetration fortgesetzt — und was sie bei 0 ergibt (TPID 2)'
  art: konstruktion
  ebene: C
  status: numerisch
  niveau: vertiefung
  objekte: [superfunktion]
  bereich: '$x!_2=x^{(x-1)!_2}$, $1!_2=1$; Kneser-$\mathrm{sexp}_e$ mit $\mathrm{sexp}_e(0)=1$; reelle $x>0$'
  aussage: |
    Die Folge $n!_2$ ($1,2,9,262144,5^{262144},\dots$) wächst wie die Tetration: $D=\lim_n(\mathrm{slog}_e(n!_2)-n)$ existiert, und man setzt fort durch
    $$x!_2=\lim_{k\to\infty}\log_{x+1}\Bigl(\log_{x+2}\bigl(\cdots\log_{x+k}(\mathrm{sexp}_e(x+k+D))\bigr)\Bigr).$$
    Nachgerechnet mit Kneser ($\mathrm{slog}_e(1)=0$): $D=-1.0552140087127$ (ab $n=6$ stabil auf 13 Stellen). Die Formel gibt $1!_2=1$ und $2!_2=2$ auf
    $10^{-12}$ und konvergiert in $k$ doppelt exponentiell: $0.5!_2=0.7575097219$, $1.5!_2=1.3595364027$.
    Der Forumswert $D\approx-0.0613312423$ passt nicht zu dieser Normierung (mit ihm gäbe die Formel $1!_2\approx3.5$); woher er kommt, ist unklar.
    **Bei $x\downarrow0$** hat die Fortsetzung den Grenzwert $0.573049\ldots$ — erstaunlich nahe an der Euler–Mascheroni-Konstante $\gamma=0.577216$
    aus der Vermutung TPID 2 (ar.frage.ef_fortsetzung), aber um $0.004$ daneben. Diese Fortsetzung ist also, falls TPID 2 stimmt, nicht die
    total monotone.
  einfach: >-
    Die exponentielle Fakultät (4 hoch 3 hoch 2 hoch 1 und so weiter) wächst fast genau wie eine Tetration. Deshalb kann man weit draussen die
    Tetration benutzen und mit Logarithmen zurückrechnen — das ergibt Werte zwischen den ganzen Zahlen. Bei 0 kommt etwa 0.573 heraus: nah an
    der berühmten Zahl 0.5772 aus einer alten Vermutung, aber nicht gleich.
  formen:
    - {tex: 'D=\lim_{n\to\infty}\bigl(\mathrm{slog}_e(n!_2)-n\bigr)=-1.0552140087\ldots', notiz: 'Kneser, $\mathrm{slog}_e(1)=0$'}
    - {tex: '\lim_{x\downarrow0}x!_2=0.573049\ldots\neq\gamma=0.577216\ldots', notiz: 'für diese Fortsetzung'}
  experimente: [exp.verwandte_funktionen]
  quellen: [{ref: forum_tid1828}, {ref: diese_arbeit, stelle: 'D in Kneser-Normierung, Ganzzahlprobe, Grenzwert bei 0 (13.10.2026)'}]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; die Konvergenz ist gemessen, nicht bewiesen (das Forum gibt ausdrücklich keine Beweise).'
    f2_benutzte_voraussetzungen: 'Kneser-sexp und -slog aus gp-tetration; Logarithmen der riesigen Werte symbolisch eine Stufe vorgezogen; 40–60 Stellen.'
    f3_spezialfall: 'Ja: ein Fall des Grenzwert-Tricks mit Vergleichsfunktion (br.satz.vergleichsfunktion).'
    f4_uebertragbar: 'Auf jede Turmfolge mit wechselnden Basen; mit einer anderen Vergleichsfunktion (etwa Tetration zur Basis 2) erhält man eine vielleicht andere Fortsetzung.'
    f5_neue_frage: 'Hängt der Grenzwert bei 0 von der Vergleichsfunktion ab? Gibt es eine Vergleichsfunktion, mit der $\gamma$ herauskommt — oder ist TPID 2 falsch?'
  bewertung: {richtigkeit: 'numerisch; Ganzzahlprobe auf 10⁻¹²', neuheit: neu_ungeprueft, nutzen: 'Erste genaue Zahlen zu dieser Fortsetzung und ein konkreter Test von TPID 2.', nutzen_stufe: mittel}
  kanten:
    - {typ: verwandt, ziel: ar.frage.ef_fortsetzung}
    - {typ: spezialfall_von, ziel: br.satz.vergleichsfunktion}
    - {typ: verwandt, ziel: ar.satz.ef_liouville}
