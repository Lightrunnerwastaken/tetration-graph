- id: kl.satz.newton_reihe
  titel: 'Die Newton-Reihe der ganzen Turmwerte ergibt unter η die reguläre Tetration'
  art: satz
  ebene: B
  status: bewiesen
  niveau: vertiefung
  objekte: [regulaer_T, schroeder]
  bereich: '$1<b<\eta$, $T$ die reguläre Tetration am unteren Fixpunkt $a$, Multiplikator $\lambda=a\ln b\in(0,1)$; $h>-1$'
  aussage: |
    Aus den ganzen Werten allein, ohne Fixpunkt und ohne Schröder-Funktion:
    $$T(h)=\sum_{n\ge0}\binom hn\Delta^nT(0),\qquad\Delta^nT(0)=\sum_{j=0}^n(-1)^{n-j}\binom njT(j),$$
    und die Summe ist die reguläre Tetration. Die Konvergenz ist nur algebraisch: Für $b=\sqrt2$, $h=\tfrac12$ ist der Abstand nach $10/20/40/90$ Gliedern
    $3.2\cdot10^{-4}$, $5.3\cdot10^{-5}$, $8.3\cdot10^{-6}$, $9.4\cdot10^{-7}$ (etwa $N^{-2.7}$). Über $\eta$ divergiert die Reihe (die Turmwerte wachsen zu schnell).
  einfach: >-
    Man nimmt nur die Turmwerte an den ganzen Stellen und interpoliert sie mit der Newton-Formel aus der Schule, wie man ein Polynom durch Punkte legt.
    Unter η kommt dabei genau die reguläre Tetration heraus — langsam, aber sicher.
  beweis:
    art: vollstaendig
    text: |
      Die reguläre Tetration ist $T(h)=\Psi(s_0\lambda^h)=a+\sum_{k\ge1}\psi_ks_0^k\lambda^{kh}$ mit der ganzen Poincaré-Funktion $\Psi$ (kl.satz.regulaer), also
      $\sum_k|\psi_ks_0^k|<\infty$. Für jedes $k$ ist $\lambda^{kh}=\sum_n\binom hn(\lambda^k-1)^n$ (Binomialreihe, $|\lambda^k-1|<1$), und
      $\Delta^nT(0)=\sum_k\psi_ks_0^k(\lambda^k-1)^n$ für $n\ge1$. Die Doppelsumme konvergiert absolut, weil $\sum_n|\binom hn|<\infty$ für $h>-1$ ($|\binom hn|\sim n^{-1-h}$)
      und $|\lambda^k-1|\le1$ — also darf man vertauschen.
  experimente: [exp.forum_formeln]
  stuetzt_sich_auf: [kl.satz.regulaer]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, sobald man die Koenigs-Reihe in λ^{kh} hinschreibt.'
    f2_benutzte_voraussetzungen: 'Ganze Poincaré-Funktion; 0 < λ < 1; h > −1.'
    f3_spezialfall: 'Ja: Newton-Interpolation einer Exponentialsumme mit Basen in (0, 1). Das q-Analogon (Reshetnikov) konvergiert schneller: kl.beob.q_binomial.'
    f4_uebertragbar: 'Jede Iteration mit anziehendem reellem Fixpunkt und Multiplikator in (0, 1); Woons Variante mit Parameter w.'
    f5_neue_frage: 'Genaue Rate: von den hohen Moden mit λ^k → 0 bestimmt?'
  bewertung: {richtigkeit: 'vollständig; √2 bei h = ½ nachgerechnet', neuheit: bekannt, nutzen: 'Zeigt, dass unter η schon die ganzen Werte die reguläre Lösung festlegen — ohne jede Zusatzwahl.', nutzen_stufe: mittel}
  quellen: [{ref: forum_tid12}, {ref: forum_tid719}]
  kanten:
    - {typ: analog_zu, ziel: kl.beob.q_binomial}
    - {typ: verwandt, ziel: kl.satz.regulaer}

- id: kl.frage.tpid5
  titel: 'TPID 5: Ist jede Tetration zur Basis √2 mit f(−f(x)) = −x überall unstetig?'
  art: frage
  ebene: C
  status: offen
  niveau: forschung
  objekte: [regulaer_T]
  aussage: |
    Vermutung (Trappmann 2009): Jede reelle Funktion $f$ auf $(-2,\infty)$ mit $f(0)=1$, $f(x+1)=\sqrt2^{\,f(x)}$ und der Spiegelbedingung $f(-f(x))=-x$ ist an keiner Stelle stetig.
    Die Spiegelbedingung verlangt eine Symmetrie, die die beiden regulären Lösungen (an 2 und an 4, kl.satz.vier_sqrt2) nicht haben.
  einfach: >-
    Verlangt man von einer Tetration zur Basis √2 eine bestimmte Spiegel-Symmetrie, dann — so die Vermutung — kann sie nirgends stetig sein.
  pruefung:
    f1_folgt_unmittelbar: 'Nein, offen.'
    f2_benutzte_voraussetzungen: 'Spiegelbedingung.'
    f3_spezialfall: 'Ähnlich dem „Bummer“: zwei Fixpunkte, zwei unverträgliche Wünsche.'
    f4_uebertragbar: 'Andere Basen unter η.'
    f5_neue_frage: 'nein'
  bewertung: {richtigkeit: offen, neuheit: bekannt, nutzen: 'Vollständigkeit der Liste offener Probleme.', nutzen_stufe: gering}
  quellen: [{ref: forum_tpid, stelle: 'TPID 5 (Trappmann 2009)'}]
  kanten:
    - {typ: verwandt, ziel: kl.satz.vier_sqrt2}

- id: kl.satz.carlson
  titel: 'Carlsons Satz: höchstens eine Tetration ist in der rechten Halbebene holomorph und beschränkt'
  art: satz
  ebene: B
  status: bewiesen
  niveau: forschung
  objekte: [regulaer_T, periodische_stoerung]
  aussage: |
    Sind $F,G$ zwei Tetrationen zur Basis $b$ ($F(0)=G(0)=1$), beide auf $\operatorname{Re}z\ge0$ holomorph und dort beschränkt (oder nur langsamer als $e^{\pi|z|}$ wachsend auf der
    imaginären Achse und von Exponentialtyp in der Halbebene), dann ist $F=G$. Für $1<b\le\eta$ ist die reguläre Tetration so eine Lösung: Sie bleibt auf
    $\operatorname{Re}z\ge0$ beschränkt (gemessen: $|T-L|\le L-1$ auf einer vollen Periode, kl.satz.folgen_vollmonoton). Über $\eta$ greift der Satz nicht — jede reelle Tetration wächst
    auf der reellen Achse schneller als jede Exponentialfunktion; dort übernimmt die senkrechte Bedingung von Paulsen–Cowgill.
  einfach: >-
    Unter η gibt es eine kurze Antwort auf „Welche Tetration ist die richtige?“: diejenige, die in der rechten Halbebene beschränkt bleibt. Zwei solche
    stimmen an allen ganzen Zahlen überein, und ein klassischer Satz (Carlson) sagt, dass sie dann überall gleich sind.
  beweis:
    art: vollstaendig
    text: |
      $H=F-G$ ist auf $\operatorname{Re}z\ge0$ holomorph, beschränkt und verschwindet an $0,1,2,\dots$ (beide haben die Turmwerte $b\uparrow\uparrow n$). Carlson: Eine solche Funktion
      von Exponentialtyp, die auf der imaginären Achse langsamer als $e^{\pi|y|}$ wächst und an allen natürlichen Zahlen verschwindet, ist identisch null.
  stuetzt_sich_auf: [fg.lem.ganzzahlwerte]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus Carlsons Satz.'
    f2_benutzte_voraussetzungen: 'Holomorphie und Wachstumsschranke in der rechten Halbebene; gleiche ganzzahlige Werte.'
    f3_spezialfall: 'Ja: Carlson-Eindeutigkeit für Interpolation ganzzahliger Werte (wie Wielandt für Gamma).'
    f4_uebertragbar: 'Jede Superfunktion mit anziehendem Fixpunkt; mike3 (2010) für die Basis η.'
    f5_neue_frage: 'Ist die reguläre Tetration für alle 1 < b ≤ η beweisbar beschränkt in der Halbebene (ohne kl.verm.vollmonoton)?'
  bewertung: {richtigkeit: 'vollständig (Eindeutigkeit); Beschränktheit der regulären Lösung numerisch', neuheit: bekannt, nutzen: 'Einfachste Eindeutigkeitsbedingung unter η, ohne Fixpunkt-Argumente.', nutzen_stufe: hoch}
  quellen: [{ref: forum_tid496}]
  kanten:
    - {typ: analog_zu, ziel: kn.satz.paulsen_cowgill}
    - {typ: verwandt, ziel: kl.satz.folgen_vollmonoton}
    - {typ: verwandt, ziel: it.satz.vertauschbar}
