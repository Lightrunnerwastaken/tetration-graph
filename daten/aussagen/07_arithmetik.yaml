- id: ar.satz.ef_liouville
  titel: 'Die Summe der Kehrwerte der exponentiellen Fakultät ist eine Liouville-Zahl'
  art: satz
  ebene: X
  status: bewiesen
  niveau: vertiefung
  objekte: [transzendenz]
  aussage: |
    Die exponentielle Fakultät $\mathrm{EF}(n)=n^{\mathrm{EF}(n-1)}$, $\mathrm{EF}(1)=1$, ist ein Turm aus absteigenden Zahlen: $1,\,2,\,9,\,262144,\,5^{262144},\dots$ Die Summe
    $$\sum_{n\ge1}\frac1{\mathrm{EF}(n)}=1.6111149258083767361111\ldots$$
    ist eine Liouville-Zahl, also transzendent: Die Teilsumme bis $n=4$ (Nenner $q=4718592$) trifft sie bis auf $5^{-262144}\approx q^{-27455}$.
  einfach: >-
    Statt immer dieselbe Zahl zu stapeln, stapelt man n, n−1, …, 2, 1. Die Kehrwerte werden so schnell klein, dass ihre Summe von Brüchen unnatürlich gut
    angenähert wird — und solche Zahlen sind nach Liouville nie algebraisch.
  beweis:
    art: vollstaendig
    text: |
      Teilsumme $p_N/q_N$ mit $q_N\mid\mathrm{EF}(1)\cdots\mathrm{EF}(N)\le\mathrm{EF}(N)^N$. Der Rest ist $<2/\mathrm{EF}(N+1)=2/(N+1)^{\mathrm{EF}(N)}$, und das ist kleiner als $q_N^{-k}$ für jedes
      feste $k$, sobald $N$ gross ist ($\mathrm{EF}(N)\gg kN\log\mathrm{EF}(N)$). Liouville: Solche Zahlen sind transzendent.
  experimente: [exp.forum_rand]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, Liouville-Kriterium.'
    f2_benutzte_voraussetzungen: 'Nur das Wachstum von EF.'
    f3_spezialfall: 'Ja: Σ 1/(b↑↑n) ist aus demselben Grund eine Liouville-Zahl.'
    f4_uebertragbar: 'Jede Summe 1/a_n mit a_{n+1} ≥ a_n^{f(n)}, f → ∞.'
    f5_neue_frage: 'nein'
  bewertung: {richtigkeit: vollständig, neuheit: klassisch, nutzen: 'Ein sicheres Transzendenz-Ergebnis aus der Turm-Welt.', nutzen_stufe: gering}
  quellen: [{ref: forum_tid361}, {ref: wikipedia_ef}]
  kanten:
    - {typ: verwandt, ziel: ar.satz.hermite_lindemann}

- id: ar.frage.ef_fortsetzung
  titel: 'TPID 2: Gibt es eine natürliche glatte exponentielle Fakultät — und ist dann EF(0) = γ?'
  art: frage
  ebene: C
  status: offen
  niveau: forschung
  objekte: [transzendenz]
  aussage: |
    $\mathrm{EF}(x)=x^{\mathrm{EF}(x-1)}$ für reelle $x$ verlangt, wie die Tetration, eine Zusatzbedingung. Vermutung im Forum (TPID 2): Unter totaler Monotonie
    (wie Szekeres' Kennzeichnung, it.satz.szekeres_monoton) gibt es genau eine Lösung, und für sie wäre $\mathrm{EF}(0)$ die Euler–Mascheroni-Konstante $\gamma=0.5772\ldots$
  einfach: >-
    Wie bei der Tetration fragt man, wie die exponentielle Fakultät zwischen den ganzen Zahlen weitergeht. Eine Forumsvermutung sagt: Mit einer natürlichen
    Glattheitsbedingung gibt es genau eine Antwort, und bei 0 käme die Eulersche Konstante heraus.
  pruefung:
    f1_folgt_unmittelbar: 'Nein, offen.'
    f2_benutzte_voraussetzungen: 'Totale Monotonie als Eindeutigkeitsbedingung.'
    f3_spezialfall: 'Analog zu Gamma (Bohr–Mollerup) und Tetration.'
    f4_uebertragbar: 'Auf andere „Fakultäten“ von Hyperoperationen.'
    f5_neue_frage: 'Woher sollte γ kommen?'
  bewertung: {richtigkeit: offen, neuheit: bekannt, nutzen: 'Zeigt dasselbe Eindeutigkeitsproblem an einem Nachbarobjekt.', nutzen_stufe: gering}
  quellen: [{ref: forum_tpid}, {ref: forum_tid361}]
  kanten:
    - {typ: analog_zu, ziel: br.frage.bohr_mollerup}
