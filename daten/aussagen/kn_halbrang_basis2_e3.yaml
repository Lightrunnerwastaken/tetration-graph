gebiet: kn
# Halber Rang an Basis 2, Etappe 3 (Borel-Raum), übernommen 13.10.2026.
aussagen:

- id: kn.beob.halbrang_theta_grenze
  titel: 'Die 10⁻⁴-Grenze beim halben Rang ist die θ-Freiheit selbst'
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: forschung
  objekte: [hyperoperation]
  aussage: |
    Die wachsenden Anteile der Entwicklung um $x+1$ (späte $\varepsilon$-Glieder, hohe Ordnungen bei wachsendem Rang) haben in der Höhe die Form $a\sin2\pi x+b(1-\cos2\pi x)$ — 1-periodisch, null an ganzen Höhen:
    genau die θ-Moden, die jede Tetration frei lässt (ein Ein-Parameter-Fit trifft bei $j=12$, $x=0.5+i$: $134.37-212.77i$ gegen gemessen $134.28-212.79i$).
    Die Borel-Singularitäten in $\varepsilon$ fehlen bei Rang 0, liegen bei Rang 1 bei $|t|\approx8$ und bei Rang 2 bei $|t|\approx0.7$–$1.1$; ihr Näherrücken erzeugt die Raten $\rho_j^n$.
    Seitliche Laplace-Summen unterscheiden sich gerade um θ-Moden: **eine Summationsvorschrift wählen heisst θ wählen.** Darum gibt die Rangfortsetzung im Borel-Raum nicht mehr Stellen, und Kneser gegen eine θ-Variante lässt sich nur mit einer nicht-störungstheoretischen Bedingung entscheiden.
    Gegenprobe über die volle Rangkette $H_3,\ldots,H_9$ im Rang fortgesetzt: $H_{3.5}(2,0.5)\in[1.44246,1.44266]$ (Störungsrechnung $1.44302$), $H_{3.5}(2,1.5)\in[2.78245,2.78254]$ ($2.78231$) — Übereinstimmung auf $\le6\cdot10^{-4}$.
  einfach: >-
    Die Rechnung bleibt bei etwa vier Stellen stehen, weil genau dort die Freiheit beginnt, die jede gebrochene Rechenart hat: man kann eine kleine Welle
    dazugeben, ohne die ganzen Werte zu ändern. Welche Welle die richtige ist, entscheidet keine Summationsregel — dafür braucht es eine Bedingung wie bei Kneser.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/BERICHT_ETAPPE3.md'}]
  pruefung:
    f1_folgt_unmittelbar: 'Nein (gemessen); bewiesen sind nur: keine Borel-Singularität bei Rang 0, kein weiterer injektiver Fixpunkt von T, θ-Moden liegen ausserhalb der Klasse 𝒜.'
    f2_benutzte_voraussetzungen: 'Borel–Padé-Lage der Singularitäten numerisch; Fit der Modenform mit einem freien Parameter.'
    f3_spezialfall: 'Ja: die Nicht-Eindeutigkeit gebrochener Iteration (fg.kor.nichteindeutigkeit), hier im Rang.'
    f4_uebertragbar: 'Jede störungstheoretische Konstruktion gebrochener Ränge und Höhen um einen entarteten Punkt.'
    f5_neue_frage: 'Welches θ hat Kneser gegenüber der perturbativen Tetration (Rang 1)? Lässt sich diese Regel auf den Halbrang übertragen?'
  bewertung: {richtigkeit: 'numerisch; drei Teilaussagen bewiesen', neuheit: neu_ungeprueft, nutzen: 'Erklärt, warum H₃.₅ eine Auswahlbedingung wie Kneser braucht, und nicht nur bessere Numerik.', nutzen_stufe: hoch}
  kanten:
    - {typ: verwandt, ziel: kn.beob.halbrang_divergenz}
    - {typ: verwandt, ziel: fg.kor.nichteindeutigkeit}
    - {typ: motiviert, ziel: kn.frage.halber_rang}
