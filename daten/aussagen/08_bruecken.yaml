- id: br.satz.ackermann
  titel: 'Ackermann-Funktion und schnell wachsende Hierarchie: A(4, n) = 2↑↑(n+3) − 3, f₃ ≥ 2↑↑n'
  art: satz
  ebene: X
  status: bewiesen
  niveau: einstieg
  objekte: [hyperoperation, berechenbarkeit]
  aussage: |
    Für die Ackermann–Péter-Funktion ($A(0,n)=n+1$, $A(m+1,0)=A(m,1)$, $A(m+1,n+1)=A(m,A(m+1,n))$) gilt
    $$A(1,n)=n+2,\quad A(2,n)=2n+3,\quad A(3,n)=2^{n+3}-3,\quad A(4,n)=2\uparrow\uparrow(n+3)-3,$$
    allgemein $A(m,n)=2\uparrow^{m-2}(n+3)-3$: Die Zeilen der Ackermann-Funktion sind die Hyperoperationen zur Basis 2. In der schnell wachsenden Hierarchie
    ($f_0(n)=n+1$, $f_{k+1}(n)=f_k^{[n]}(n)$) ist $f_3(n)\ge2\uparrow\uparrow n$ — Tetration ist die Stufe $f_3$. Die Umkehrungen wachsen entsprechend langsam:
    $\log^*$ (gr.satz.logstern) und noch langsamer die inverse Ackermann-Funktion $\alpha(n)$, die in der Laufzeit von Union-Find steckt.
  einfach: >-
    Die berühmte Ackermann-Funktion ist nichts anderes als die Hyperoperationen zur Basis 2, um 3 verschoben: die vierte Zeile ist Tetration.
  beweis:
    art: vollstaendig
    text: |
      Induktion über $n$: $A(m+1,n+1)=A(m,A(m+1,n))$ mit $A(m,x)=2\uparrow^{m-2}(x+3)-3$ gibt $2\uparrow^{m-2}(2\uparrow^{m-1}(n+3))-3=2\uparrow^{m-1}(n+4)-3$; Start
      $A(m+1,0)=A(m,1)=2\uparrow^{m-2}4-3=2\uparrow^{m-1}3-3$. FGH: $f_2(m)=m2^m\ge2^m$, also $f_3(n)=f_2^{[n]}(n)\ge(2^{\,\cdot})^{[n]}(n)\ge2\uparrow\uparrow n$.
  experimente: [exp.forum_rand]
  stuetzt_sich_auf: [br.def.hyperoperation]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, Induktion.'
    f2_benutzte_voraussetzungen: 'Definition der Hyperoperationen (br.def.hyperoperation).'
    f3_spezialfall: 'Ja: Grzegorczyk-Hierarchie, Kalmár (br.satz.kalmar).'
    f4_uebertragbar: 'Auf transfinite Stufen f_α (br.satz.ordinal_tetration).'
    f5_neue_frage: 'nein'
  bewertung: {richtigkeit: vollständig, neuheit: klassisch, nutzen: 'Verbindet Tetration mit Berechenbarkeit und Algorithmen-Laufzeiten.', nutzen_stufe: mittel}
  quellen: [{ref: forum_tid10}, {ref: kalmar_grzegorczyk}]
  kanten:
    - {typ: verwandt, ziel: br.satz.kalmar}
    - {typ: verwandt, ziel: gr.satz.logstern}

- id: br.satz.ordinal_tetration
  titel: 'Tetration der Ordinalzahlen: ω↑↑ω = ε₀, und danach bleibt sie stehen'
  art: satz
  ebene: X
  status: bewiesen_literatur
  niveau: vertiefung
  objekte: [hyperoperation]
  aussage: |
    Mit Cantors Potenz der Ordinalzahlen ist $\omega\uparrow\uparrow n=\omega^{\omega^{\cdot^{\cdot^\omega}}}$ und $\omega\uparrow\uparrow\omega=\sup_n\omega\uparrow\uparrow n=\varepsilon_0$, die kleinste Lösung von
    $\omega^x=x$. Die naive Fortsetzung $\omega\uparrow\uparrow(\alpha+1)=\omega^{\omega\uparrow\uparrow\alpha}$ steht danach still: $\omega\uparrow\uparrow(\omega+1)=\omega^{\varepsilon_0}=\varepsilon_0$.
    $\varepsilon_0$ ist die Beweisstärke der Peano-Arithmetik (Gentzen); daran hängt Goodsteins Satz, dessen Folgen mit Türmen wachsen.
  einfach: >-
    Auch mit unendlichen Ordinalzahlen kann man Türme bauen. Der unendlich hohe Turm aus ω heisst ε₀ — und weil ε₀ hoch ω wieder ε₀ ist, kommt man mit
    höheren Türmen nicht weiter.
  beweis: {art: literatur, text: 'Cantor (ε-Zahlen); Fixpunkteigenschaft ω^{ε₀} = ε₀ direkt aus der Definition als Supremum. Gentzen 1936.'}
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus der Definition von ε₀.'
    f2_benutzte_voraussetzungen: 'Stetigkeit der Ordinalpotenz in der Hochzahl.'
    f3_spezialfall: 'Ja: Fixpunkte normaler Funktionen (Veblen).'
    f4_uebertragbar: 'Höhere Operationen über Veblen-Funktionen.'
    f5_neue_frage: 'nein'
  bewertung: {richtigkeit: Literatur, neuheit: klassisch, nutzen: 'Zeigt, wo die Tetration in der Logik auftaucht.', nutzen_stufe: gering}
  quellen: [{ref: forum_tid124}, {ref: goodstein1947}]
  kanten:
    - {typ: verwandt, ziel: br.satz.ackermann}

- id: br.satz.hyperop_varianten
  titel: 'Andere Klammerungen: linke, ausgewogene und Bennetts kommutative Hyperoperationen'
  art: satz
  ebene: X
  status: bewiesen
  niveau: vertiefung
  objekte: [hyperoperation, iterationsgruppe]
  aussage: |
    (i) **Links geklammert** ist die Tetration trivial: mit $x[4']0=x$ ist $x[4']n=x^{x^n}$; nicht trivial wird erst die linke Pentation
    ($x[5']0=x$, $x[5'](n+1)=(x[5']n)[4']x$): $x[5']1=x^{x^x}$, $x[5']2=x^{x^{x+x^{x+1}}}$.
    (ii) **Ausgewogen** ($a[n+1](2b)=(a[n+1]b)[n](a[n+1]b)$) gibt für Stufe 2, 3 wieder $\cdot$ und Potenz; die ausgewogene Tetration ist die Iteration von $x\mapsto x^x$
    an der Stelle $2^t$: $a[4]2^t=f^{[t]}(a)$ mit $f(x)=x^x$ — ein Fixpunkt bei 1 mit $f'(1)=1$ (parabolisch).
    (iii) **Bennett (1915):** $x\oplus_sy=\exp^{[s]}\bigl(\log^{[s]}x+\log^{[s]}y\bigr)$ gibt für $s=0,1,2$ Addition, Multiplikation und $x\oplus_2y=e^{\ln x\ln y}$; jede Stufe ist
    kommutativ, assoziativ und verteilt sich über die vorige. Mit $\exp^{[1/2]}$ (kn.satz.halbe_exp) entsteht eine Operation „zwischen + und ·“.
  einfach: >-
    Wie man einen Turm klammert, ist eine Wahl. Von oben geklammert entsteht die übliche Tetration, von unten etwas Einfaches. Bennett schlug 1915 eine
    ganz andere Leiter vor, bei der jede Stufe kommutativ bleibt — und mit der halben Exponentialfunktion bekommt man sogar Zwischenstufen.
  beweis:
    art: vollstaendig
    text: |
      (i) $x[4'](n+1)=(x[4']n)^x$ mit $x[4']0=x$ gibt $x^{x^n}$; die linke Pentation durch Einsetzen. (ii) Induktion über $b=2^k$. (iii) Konjugation mit $\log^{[s]}$ überträgt Kommutativität und Assoziativität der
      Addition; Distributivität: $\log^{[s]}(x\oplus_s y)=\log^{[s]}x+\log^{[s]}y$, und $\exp$ verwandelt Summen in Produkte, also verteilt sich $\oplus_{s+1}$ über $\oplus_s$.
  pruefung:
    f1_folgt_unmittelbar: 'Ja.'
    f2_benutzte_voraussetzungen: 'Für (iii) mit nicht ganzem s: eine Iterationsgruppe exp^[s].'
    f3_spezialfall: 'Ja: Konjugation einer Gruppenoperation.'
    f4_uebertragbar: 'Jede Iterationsgruppe statt exp^[s].'
    f5_neue_frage: 'Gibt es eine natürliche Wahl für die Zwischenstufen (Nixons Halboperationen, Forum tid 1386, 1535)?'
  bewertung: {richtigkeit: vollständig, neuheit: klassisch, nutzen: 'Zeigt, welche Freiheit in der Definition der Hyperoperationen steckt.', nutzen_stufe: gering}
  quellen: [{ref: forum_tid145}, {ref: forum_tid150}, {ref: bennett1915}]
  kanten:
    - {typ: verwandt, ziel: br.def.hyperoperation}
    - {typ: verwandt, ziel: kn.satz.halbe_exp}
