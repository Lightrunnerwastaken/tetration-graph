gebiet: ar
# Runde 25.10.2026, Bericht 29: Transzendenz und Irrationalitätsmasse — was man beweisen kann (Kehrwertsummen, Ableitungen, metrische Sätze)
# und eine Kettenbruch-Population von 47 Kneser-Werten. Rechnungen: forschung/runde_2026_10_25/29_transzendenz/ (BERICHT.md, EINTRAG.md).
aussagen:

- id: ar.satz.kehrwertsumme_liouville
  titel: 'Die Summe der Kehrwerte eines Turms ganzer Zahlen ist eine Liouville-Zahl — mit vollständig explizitem Kettenbruch'
  art: satz
  ebene: A
  status: bewiesen
  niveau: vertiefung
  objekte: [transzendenz, turm, hyperoperation]
  bereich: 'ganze Basis $b\ge2$; $C_b=\sum_{k\ge1}1/(b\uparrow\uparrow k)$ wie in gr.satz.kehrwert_turmsumme'
  aussage: |
    Mit $e_1=1$, $e_{k+1}=b^{e_k}$ (also $b\uparrow\uparrow k=b^{e_k}$) hat die Teilsumme $S_N=\sum_{k\le N}b^{-e_k}$ den gekürzten Nenner $q_N=b^{e_N}$, und
    $$0<C_b-S_N<2\,q_N^{-e_{N+1}/e_N},\qquad \frac{e_{N+1}}{e_N}=\frac{b^{e_N}}{e_N}\to\infty .$$
    Also ist $C_b$ eine **Liouville-Zahl** (Irrationalitätsexponent $\infty$) und transzendent. Der Kettenbruch entsteht durch Faltung: ist $S_N=[0;a_1,\dots,a_n]$ mit geradem $n$
    und $x_N=b^{e_{N+1}-2e_N}$, so ist $S_{N+1}=[0;a_1,\dots,a_n,\,x_N-1,\,1,\,a_n-1,\,a_{n-1},\dots,a_1]$ (Nullen mit den Nachbarn zusammengefasst). Beispiel
    $$C_2=[0;1,4,2,1,255,3,4,1,\,2^{65504}-1,\,5,3,255,1,2,4,1,\dots],$$
    für $b\ge3$ beginnt er $[0;\,b-1,\,1,\,b^{b-2}-1,\,b,\,b^{b^b-2b}-1,\,1,\,b-1,\,b^{b-2}-1,\,1,\,b-1,\dots]$.
  einfach: >-
    1/2 + 1/4 + 1/16 + 1/65536 + … ist keine Wurzel aus einer Gleichung mit ganzen Zahlen: Die Teilsummen sind Brüche, die die Summe so unnatürlich gut treffen,
    dass das nach Liouville nur bei transzendenten Zahlen geht. Man sieht es auch am Kettenbruch: dort tauchen riesige Glieder wie 2^65504 − 1 auf.
  beweis:
    art: vollstaendig
    text: |
      $b^{e_N}S_N=\sum_{k\le N}b^{e_N-e_k}\equiv1\pmod b$, also ist $q_N=b^{e_N}$ der gekürzte Nenner. Der Rest ist $<2b^{-e_{N+1}}=2q_N^{-e_{N+1}/e_N}$, und $e_{N+1}/e_N\to\infty$:
      für jedes $k$ gibt es unendlich viele Brüche mit $|C_b-p/q|<q^{-k}$ — Liouville. Kettenbruch: Faltungslemma $p/q+(-1)^n/(xq^2)=[a_0;a_1,\dots,a_n,x,-a_n,\dots,-a_1]$
      ($q=q_n$), hier mit $b^{-e_{N+1}}=1/(q_N^2x_N)$, $x_N$ ganz wegen $b^{e_N}\ge2e_N$; Normalisieren mit $[\dots,x,-y]=[\dots,x-1,1,y-1]$ (bei ungeradem $n$ vorher $a_n\to a_n-1,1$).
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B1; e2_kehrwertsumme_liouville.py'}, {ref: vanderpoorten_shallit1992, stelle: 'Faltungslemma', geprueft: nein}]
  nachgeprueft:
    - {ergebnis: 'Gegenprobe 25.10.2026: e2_kehrwertsumme_liouville.py neu gerechnet (exakte Brüche): Faltungsregel stimmt für b = 2 bis N = 5, b = 3, 4, 5, 7 bis N = 3, b = 10 bis N = 2.'}
  pruefung:
    f1_folgt_unmittelbar: 'Ja, Liouville-Kriterium wie bei ar.satz.ef_liouville; der Kettenbruch aus dem klassischen Faltungslemma (van der Poorten–Shallit).'
    f2_benutzte_voraussetzungen: 'Nur b ganz (Nenner exakt eine Potenz von b) und das Turmwachstum.'
    f3_spezialfall: 'Liouville-Zahlen vom Typ Σ b^{−e_k} mit e_{k+1}/e_k → ∞; gefaltete Kettenbrüche.'
    f4_uebertragbar: 'Auf jede Summe Σ 1/a_k ganzer a_k mit log a_{k+1}/log(a₁⋯a_k) → ∞; nicht auf b = e oder nicht ganze b (ar.frage.kehrwertsumme_e).'
    f5_neue_frage: 'Ist C_e transzendent? → ar.frage.kehrwertsumme_e'
  bewertung: {richtigkeit: vollständig, neuheit: klassisch, recherche: 'Liouville elementar; Faltungslemma klassisch (van der Poorten–Shallit 1992, Angaben ungeprüft).', nutzen: 'Beantwortet die im Graph offen gelassene Frage nach C_2 (gr.satz.kehrwert_turmsumme).', nutzen_stufe: mittel}
  kanten:
    - {typ: korrigiert, ziel: gr.satz.kehrwert_turmsumme, notiz: 'Prüffragen f4/f5 dort: „ob C_b transzendent ist, ist offen“ — für ganze b erledigt'}
    - {typ: analog_zu, ziel: ar.satz.ef_liouville}

- id: ar.satz.rang_dichotomie_kehrwerte
  titel: 'Kehrwertsummen der Hyperoperationen: divergent bis Rang 2, rational bei Rang 3, Liouville ab Rang 4'
  art: satz
  ebene: A
  status: bewiesen
  niveau: einstieg
  objekte: [transzendenz, hyperoperation]
  bereich: 'ganze Basis $b\ge2$; $H_r(b,k)$ die Hyperoperation vom Rang $r$ ($H_1=b+k$, $H_2=bk$, $H_3=b^k$, $H_4=b\uparrow\uparrow k$, …)'
  aussage: |
    $$\sum_{k\ge1}\frac1{H_r(b,k)}\ \text{ist}\ \begin{cases}\text{divergent}, & r\le2,\\[2pt] \dfrac1{b-1}\ \text{(rational)}, & r=3,\\[4pt] \text{eine Liouville-Zahl}, & r\ge4.\end{cases}$$
    Der Sprung von „rational“ zu „transzendent“ liegt genau zwischen Potenz und Tetration.
  einfach: >-
    Addiert man die Kehrwerte von b+1, b+2, … oder von b, 2b, 3b, …, wird die Summe unendlich. Bei den Potenzen b, b², b³, … kommt ein einfacher Bruch heraus.
    Ab den Türmen ist die Summe immer eine transzendente Zahl.
  beweis:
    art: vollstaendig
    text: |
      $r=1,2$: harmonische Reihe. $r=3$: geometrische Reihe. $r\ge4$: induktiv ist $H_r(b,k)=b\uparrow\uparrow M_k$ mit streng wachsendem $M_k$, also $1/H_r(b,k)=b^{-E_k}$ mit
      $E_k=e_{M_k}$ und $E_{k+1}\ge b^{E_k}$; derselbe Beweis wie ar.satz.kehrwertsumme_liouville.
  stuetzt_sich_auf: [ar.satz.kehrwertsumme_liouville]
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B2'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus ar.satz.kehrwertsumme_liouville und H_r(b,k) = b↑↑M_k für r ≥ 4.'
    f2_benutzte_voraussetzungen: 'b ganz; Rangkonvention H₃ = Potenz, H₄ = Tetration.'
    f3_spezialfall: nein
    f4_uebertragbar: 'Auf jede Folge, die schneller als jeder Turm fester Höhe wächst.'
    f5_neue_frage: 'Wo liegt die Kehrwertsumme bei gebrochenem Rang zwischen 3 und 4 (kn.frage.halber_rang)?'
  bewertung: {richtigkeit: vollständig, neuheit: folklore, nutzen: 'Einfacher Einstieg in Transzendenz entlang der Rangleiter.', nutzen_stufe: gering}
  kanten:
    - {typ: verwandt, ziel: br.satz.ackermann}
    - {typ: verwandt, ziel: kn.frage.halber_rang}

- id: ar.satz.ableitungsorbit
  titel: 'Ableitungen an ganzen Stellen: T′(0) und T′(1) = e·T′(0) sind nicht beide algebraisch; bei ganzer Basis höchstens ein algebraisches T′(n)'
  art: satz
  ebene: A
  status: bewiesen
  niveau: vertiefung
  objekte: [T_b, transzendenz]
  bereich: 'jede differenzierbare reelle Lösung mit $T(0)=1$ und $T''(0)\ne0$'
  aussage: |
    Aus $T'(x+1)=\ln b\cdot T(x+1)\,T'(x)$ folgt $T'(0)=\ln b\,T'(-1)$ und $T'(n)=T'(-1)\,(\ln b)^{n+1}\prod_{k=0}^{n}T(k)$.
    (i) Basis $e$: $T'(-1)=T'(0)$, $T'(1)=e\,T'(0)$, $T'(n)=T'(0)\prod_{k=1}^nT(k)$; also sind $T'(0)$ und $T'(1)$ **nicht beide algebraisch**.
    (ii) Algebraische Basis $b\notin\{0,1\}$: unter $T'(-1),T'(0),T'(1)$ ist höchstens eine Zahl algebraisch (Quotienten $\ln b$, $b\ln b$, $b\ln^2b$).
    (iii) Ganze Basis $b\ge2$: die ganze Folge $(T'(n))_{n\ge-1}$ enthält höchstens eine algebraische Zahl und liegt in $\mathbb Q(T'(-1),\ln b)$ (Transzendenzgrad $\le2$).
  einfach: >-
    Die Steigung der Tetration an ganzen Stellen hängt einfach zusammen: bei der Basis e ist sie bei 1 genau e-mal so gross wie bei 0. Darum können nicht beide
    Steigungen „schöne“ algebraische Zahlen sein.
  beweis:
    art: vollstaendig
    text: |
      Kettenregel (gr.satz.kettenregel), $T(-1)=0$, $T(0)=1$. Die Quotienten $T'(n)/T'(m)$ sind $(\ln b)^{n-m}$ mal einer Zahl aus $\mathbb Q(T(m+1),\dots,T(n))$: bei Basis $e$ für $n=1,m=0$ gleich $e$,
      bei ganzer Basis $(\ln b)^{n-m}$ mal einer positiven ganzen Zahl, bei algebraischer Basis für $n,m\in\{-1,0,1\}$ gleich $\ln b$, $b\ln b$, $b\ln^2b$. Diese sind transzendent
      (Hermite–Lindemann: $\ln b$ transzendent für algebraisches $b\ne1$; ein algebraisches $(\ln b)^m\cdot q$ machte $\ln b$ algebraisch).
  stuetzt_sich_auf: [ar.satz.hermite_lindemann, gr.satz.kettenregel]
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B3–B5'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, Kettenregel plus Hermite–Lindemann.'
    f2_benutzte_voraussetzungen: 'Differenzierbarkeit, T(0) = 1, T′(0) ≠ 0 (sonst wären alle T′(n) = 0 algebraisch); keine Kneser-Eigenschaft.'
    f3_spezialfall: 'Gegenstück zu ar.satz.orbitschranke für Ableitungen statt Werte.'
    f4_uebertragbar: 'Alle differenzierbaren Lösungen; für Basis e unter Schanuel verschärft (ar.satz.schanuel_ableitungen).'
    f5_neue_frage: 'Ist sexp′(0) = 1.0917673512583… algebraisch unabhängig von e, e^e, …?'
  bewertung: {richtigkeit: vollständig, neuheit: folklore, nutzen: 'Sichere, einfache Arithmetik der Steigungen.', nutzen_stufe: gering}
  kanten:
    - {typ: analog_zu, ziel: ar.satz.orbitschranke}
    - {typ: verwandt, ziel: gr.beob.kneser_ableitung}

- id: ar.satz.schanuel_ableitungen
  titel: 'Unter Schanuel: unter den Steigungen T′(0), T′(1), T′(2), … (Basis e) ist höchstens eine algebraisch'
  art: satz
  ebene: A
  status: bedingt
  bedingungen: [ar.verm.schanuel]
  niveau: forschung
  objekte: [T_b, schanuel, transzendenz]
  bereich: 'Basis $e$, jede differenzierbare reelle Lösung mit $T(0)=1$, $T''(0)\ne0$'
  aussage: |
    Unter Schanuels Vermutung enthält $\{T'(n):n\ge0\}$ höchstens eine algebraische Zahl; ist $T'(0)$ algebraisch, so sind $T'(1),\dots,T'(n)$ algebraisch unabhängig; allgemein
    $\mathrm{trdeg}_{\mathbb Q}\,\mathbb Q(T'(0),\dots,T'(n))\ge n$. Gegensatz: bei ganzer Basis hat die ganze Folge Transzendenzgrad $\le2$ (ar.satz.ableitungsorbit).
  einfach: >-
    Nimmt man die berühmte (unbewiesene) Vermutung von Schanuel an, dann sind die Steigungen der Tetration zur Basis e an den ganzen Stellen fast alle voneinander unabhängige,
    transzendente Zahlen.
  beweis:
    art: bedingt
    text: |
      $T(k)=\exp^{\circ k}(1)$; nach ar.satz.schanuel_orbit ($\alpha=1$) sind $T(1),\dots,T(n)$ algebraisch unabhängig. $T'(n)/T'(m)=\prod_{k=m+1}^nT(k)$ ist ein nichtkonstantes Monom
      in unabhängigen Zahlen, also transzendent. Ist $T'(0)$ algebraisch, erzeugen $T'(1),\dots,T'(n)$ über $\bar{\mathbb Q}$ denselben Körper wie $T(1),\dots,T(n)$ ($T(k)=T'(k)/T'(k-1)$).
      Allgemein enthält $\mathbb Q(T'(0),\dots,T'(n))$ die Quotienten $T(1),\dots,T(n)$.
  stuetzt_sich_auf: [ar.satz.schanuel_orbit, ar.satz.ableitungsorbit]
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B6'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, aus ar.satz.schanuel_orbit und den Quotienten in ar.satz.ableitungsorbit.'
    f2_benutzte_voraussetzungen: 'Schanuel; T(0) = 1, T′(0) ≠ 0.'
    f3_spezialfall: 'Folgerung aus Schanuel für iterierte Exponentiale.'
    f4_uebertragbar: 'Alle differenzierbaren Lösungen zur Basis e.'
    f5_neue_frage: 'Unter Schanuel nur trdeg ≥ n für n + 1 Zahlen — ist sexp′(0) selbst unabhängig von e, e^e, …?'
  bewertung: {richtigkeit: 'bedingt (Schanuel), vollständig', neuheit: neu_ungeprueft, nutzen: 'Zeigt, was Schanuel für die Steigungen liefert.', nutzen_stufe: gering}

- id: ar.satz.jet_identitaeten
  titel: 'slog′(0) = 1/a₁ und slog″(0) = (a₁² − 2a₂)/a₁³: die Taylor-Koeffizienten bei −1 und von slog sind Polynome in denen bei 0'
  art: satz
  ebene: B
  status: bewiesen
  niveau: vertiefung
  objekte: [T_b, slog, transzendenz]
  bereich: 'Basis $e$, jede bei $0$ analytische Lösung $T(h)=1+a_1h+a_2h^2+\dots$ mit $a_1\ne0$'
  aussage: |
    $T(-1+h)=\log T(h)$, also $T'(-1)=a_1$, $T''(-1)=2a_2-a_1^2$ und
    $$\mathrm{slog}'(0)=\frac1{a_1},\qquad \mathrm{slog}''(0)=\frac{a_1^2-2a_2}{a_1^3}.$$
    Allgemein liegen alle Taylor-Koeffizienten von $T$ bei $-1$ und von $\mathrm{slog}$ bei $0$ in $\mathbb Q(a_1,a_2,\dots)$, die von $T$ bei $n\ge1$ in $\mathbb Q(e,e^e,\dots,T(n))[a_1,a_2,\dots]$.
    Folge: In der Relationssuche ar.beob.keine_relationen waren $\mathrm{slog}'(0)$ und $\mathrm{slog}''(0)$ keine von $a_1,a_2$ unabhängigen Konstanten (die Beziehung ist rational, nicht linear).
  einfach: >-
    Kennt man die Taylor-Reihe der Tetration bei 0, kennt man auch die bei −1 und die des Superlogarithmus bei 0 — mit Formeln aus Brüchen, ohne neue Konstanten.
  beweis:
    art: vollstaendig
    text: |
      $T(-1+h)=\log(1+a_1h+a_2h^2+\dots)=a_1h+(a_2-\tfrac12a_1^2)h^2+\dots$, Koeffizienten mit rationalen Zahlen. $\mathrm{slog}$ ist bei $0$ die Umkehrung von $T$ bei $-1$:
      $\mathrm{slog}'(0)=1/T'(-1)$, $\mathrm{slog}''(0)=-T''(-1)/T'(-1)^3$. Bei $n\ge1$: $T(n+h)=\exp T(n-1+h)=T(n)\exp\bigl(T(n-1+h)-T(n-1)\bigr)$, Induktion.
  stuetzt_sich_auf: [gr.satz.slog_ableitung]
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B7; e4_jet_identitaeten.py'}]
  nachgeprueft:
    - {ergebnis: 'Gegenprobe 25.10.2026: e4_jet_identitaeten.py neu gerechnet: alle Differenzen < 10⁻¹⁹⁹ an Kneser-Werten (200 Stellen).'}
  pruefung:
    f1_folgt_unmittelbar: 'Ja (Logarithmus einer Potenzreihe, Umkehrreihe).'
    f2_benutzte_voraussetzungen: 'Analytizität bei 0, Basis e (bei Basis b kommt der Faktor 1/ln b dazu).'
    f3_spezialfall: 'Umkehrformel für Potenzreihen (Lagrange).'
    f4_uebertragbar: 'Jede Basis: dann liegen die Koeffizienten in ℚ(ln b, a₁, a₂, …).'
    f5_neue_frage: 'Welche Kneser-Konstanten sind wirklich unabhängig? (Liste für künftige Relationssuchen bereinigen.)'
  bewertung: {richtigkeit: 'vollständig; auf 199 Stellen bestätigt', neuheit: folklore, nutzen: 'Bereinigt die Liste der Konstanten für Relationssuchen.', nutzen_stufe: gering}
  kanten:
    - {typ: verwandt, ziel: ar.beob.keine_relationen}
    - {typ: verwandt, ziel: gr.beob.kneser_ableitung}

- id: ar.satz.keine_arith_info_ableitung
  titel: 'Auch sexp′(0) ist durch die reelle Gleichung nicht festgelegt; „Schanuel ⇒ T(½) transzendent für jede Lösung“ ist gleichwertig mit „Schanuel ist falsch“'
  art: satz
  ebene: A
  status: bewiesen
  niveau: vertiefung
  objekte: [T_b, periodische_stoerung, transzendenz, schanuel]
  bereich: 'Basis $e$; reell-analytische, streng wachsende Lösungen mit $T(0)=1$'
  aussage: |
    (i) Für **jedes** $c>0$ gibt es eine reell-analytische, streng wachsende Tetration $\tilde T$ zur Basis $e$ mit $\tilde T(0)=1$ und $\tilde T'(0)=c$.
    (ii) Die Aussage „für jede solche Lösung gilt: Schanuel $\Rightarrow$ $T(\tfrac12)$ transzendent“ ist gleichwertig mit der Verneinung von Schanuels Vermutung.
    Jede bedingte Transzendenzaussage über $T_e^{\rm K}(\tfrac12)$ muss also eine Eigenschaft benutzen, die nur Knesers Lösung hat.
  einfach: >-
    Die Gleichung T(x+1) = e^T(x) allein legt weder den Wert bei ½ noch die Steigung bei 0 fest — man kann beide fast beliebig machen.
    Wer etwas über die Zahl T(½) beweisen will, muss darum benutzen, was Knesers Lösung besonders macht.
  beweis:
    art: vollstaendig
    text: |
      (i) $T$ Kneser, $\gamma=c/T'(0)$. Poisson-Kern $P_r(x)=(1-r^2)/(1-2r\cos2\pi x+r^2)$: analytisch, 1-periodisch, Mittel 1, Werte in $[\tfrac{1-r}{1+r},\tfrac{1+r}{1-r}]$.
      Für $\gamma\ge1$ wähle $r$ mit $\tfrac{1+r}{1-r}\ge\gamma$ und $g=1+t(P_r-1)$, $t=(\gamma-1)/(P_r(0)-1)\in[0,1]$; für $\gamma<1$ wähle $r$ mit $\tfrac{1-r}{1+r}<\gamma$ und
      $g=1+t(P_r(\cdot-\tfrac12)-1)$, $t=(1-\gamma)/(1-\tfrac{1-r}{1+r})\in(0,1]$. Dann ist $g>0$, Mittel 1, $g(0)=\gamma$; $\varphi(x)=\int_0^xg$ ist analytisch, streng wachsend,
      $\varphi(x+1)=\varphi(x)+1$, $\varphi(0)=0$, und $\tilde T=T\circ\varphi$ leistet das Verlangte.
      (ii) Nach ar.satz.keine_arith_info gibt es unbedingt eine Lösung mit $\tilde T(\tfrac12)=\tfrac32$. Also ist „$\forall T:\ \mathrm{SC}\Rightarrow T(\tfrac12)$ transzendent“ gleichwertig mit „$\mathrm{SC}\Rightarrow$ falsch“.
  stuetzt_sich_auf: [ar.satz.keine_arith_info, fg.kor.nichteindeutigkeit]
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B8, B9'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja: (i) dieselbe Umparametrisierung wie fg.kor.nichteindeutigkeit mit einem positiven Poisson-Kern; (ii) Logik.'
    f2_benutzte_voraussetzungen: 'Existenz einer reell-analytischen Lösung (Kneser); ar.satz.keine_arith_info.'
    f3_spezialfall: 'Gegenstück zu ar.satz.keine_arith_info für die Steigung.'
    f4_uebertragbar: 'Jede Basis b > 1 mit einer reell-analytischen Lösung.'
    f5_neue_frage: 'T̃(½) und T̃′(0) gleichzeitig frei wählbar (Bericht B8′, nur skizziert: Positivität der gemischten Kerne fehlt). Welche Kneser-Eigenschaft (z. B. T(z) → L für Im z → ∞) passt in eine Transzendenzmethode?'
  bewertung: {richtigkeit: vollständig, neuheit: neu_ungeprueft, nutzen: 'Schärft die methodische Schranke aus ar.satz.keine_arith_info zu einer Äquivalenz und dehnt sie auf die Steigung aus.', nutzen_stufe: mittel}
  kanten:
    - {typ: verallgemeinert, ziel: ar.satz.keine_arith_info}
    - {typ: verwandt, ziel: ar.verm.ks}

- id: ar.satz.metrisch_fast_alle
  titel: 'An fast allen Stellen sind x und T(x) algebraisch unabhängig und T(x) hat einen „zufälligen“ Kettenbruch — das sagt nichts über eine bestimmte Stelle'
  art: satz
  ebene: B
  status: bewiesen
  niveau: vertiefung
  objekte: [T_b, transzendenz, hoehe]
  bereich: 'jede reell-analytische Lösung $T$ auf $(-2,\infty)$ zu einer Basis $b>1$ mit $T''>0$'
  aussage: |
    (i) Die Menge $\{x:\ x\text{ und }T(x)\text{ algebraisch abhängig}\}$ ist abzählbar.
    (ii) Für Lebesgue-fast alle $(x_1,\dots,x_n)$ sind die $2n$ Zahlen $x_i,T(x_i)$ algebraisch unabhängig — die Kneser–Schanuel-Aussage (ar.verm.ks) gilt fast überall sogar mit $2n$ statt $n$.
    (iii) Für fast alle $x$ hat $T(x)$ den Irrationalitätsexponenten 2, und sein Kettenbruch folgt den Gesetzen von Chintschin, Lévy und Gauss–Kuzmin.
    Darum beweist keine Kettenbruch-Statistik etwas über eine einzelne Stelle wie $T_e(\tfrac12)$.
  einfach: >-
    Für fast jede Stelle x ist der Wert der Tetration eine transzendente, „zufällig aussehende“ Zahl. Das gilt aber nur fast überall — für eine bestimmte Stelle wie ½
    weiss man damit gar nichts.
  beweis:
    art: vollstaendig
    text: |
      $T$ ist keine algebraische Funktion (wächst schneller als jede). Für $P\ne0$ in $\mathbb Q[X_1..X_n,Y_1..Y_n]$ ist $F(x)=P(x,T(x_1),\dots,T(x_n))$ analytisch und nicht identisch
      null (Induktion über $n$: bei generischen $x_1,\dots,x_{n-1}$ bleibt ein nichttriviales Polynom in $x_n,T(x_n)$). Die Nullstellenmenge hat Mass 0 (für $n=1$: diskret, also abzählbar);
      es gibt abzählbar viele $P$. (iii): Die Ausnahmemengen der metrischen Kettenbruchsätze sind Nullmengen, und $T$ ist ein $C^1$-Diffeomorphismus, zieht Nullmengen also auf Nullmengen zurück.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B10'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja (Nullstellenmengen analytischer Funktionen, metrische Zahlentheorie).'
    f2_benutzte_voraussetzungen: 'Reelle Analytizität, T′ > 0, T nicht algebraisch; keine Kneser-Eigenschaft.'
    f3_spezialfall: 'Metrische Transzendenz für Werte transzendenter analytischer Funktionen.'
    f4_uebertragbar: 'Fast alle Basen b > η bei fester Stelle x (Bericht B10′) — dafür fehlt der Nachweis, dass b ↦ T_b^K(x) reell-analytisch und nicht konstant ist.'
    f5_neue_frage: 'Gibt es eine einzige explizite nichtganze Stelle, an der man Irrationalität zeigen kann (ar.satz.keine_arith_info_ableitung zeigt: nur mit Kneser-Eigenschaften)?'
  bewertung: {richtigkeit: vollständig, neuheit: folklore, nutzen: 'Ordnet die Kettenbruch-Messungen richtig ein: Beleg für „keine Struktur“, kein Beweis.', nutzen_stufe: mittel}
  kanten:
    - {typ: verwandt, ziel: ar.verm.ks}
    - {typ: verwandt, ziel: ar.satz.bpw}

- id: ar.satz.fixpunkt_transzendent
  titel: 'Der Fixpunkt L = −W(−1) und der Multiplikator sind transzendent; bei algebraischer Basis jeder nichtreelle Fixpunkt'
  art: satz
  ebene: X
  status: bewiesen
  niveau: vertiefung
  objekte: [fixpunkt_L, multiplikator, transzendenz, schanuel]
  bereich: '$b^L=L$; Multiplikator $\lambda_b=L_b\ln b$, $\lambda e^{-\lambda}=\ln b$'
  aussage: |
    (i) $L=-W_0(-1)=0.3181315+1.3372357\,i$ (und jeder andere Fixpunkt von $e^z$) ist transzendent, ebenso der Multiplikator $\lambda=L$.
    (ii) Für algebraisches $b\notin\{0,1\}$ ist jeder nichtreelle Fixpunkt $L_b$ von $b^z$ transzendent.
    (iii) Für algebraisches $b$ mit nichtrationalem Fixpunkt (z. B. $b=2$) ist die Transzendenz von $\lambda_b$ unbedingt offen; Schanuel $\Rightarrow$ $\lambda_b$ transzendent für jedes algebraische $b\notin\{0,1\}$.
  einfach: >-
    Der komplexe Fixpunkt L, um den Knesers Tetration gebaut ist, ist keine algebraische Zahl — das folgt aus klassischen Sätzen.
  beweis:
    art: vollstaendig
    text: |
      (i) Wäre $L$ algebraisch ($\ne0$), so wäre $e^L=L$ algebraisch — Widerspruch zu Hermite–Lindemann. (ii) Wäre $L_b$ algebraisch, so nicht rational (nichtreell), also
      $b^{L_b}$ transzendent nach Gelfond–Schneider; aber $b^{L_b}=L_b$. (iii) $\lambda e^{-\lambda}=\ln b$. Sind $\lambda,\ln b$ über $\mathbb Q$ unabhängig, gibt Schanuel
      $\mathrm{trdeg}\,\mathbb Q(\lambda,\ln b,e^\lambda,b)\ge2$; bei algebraischem $\lambda$ und $b$ ist $e^\lambda=\lambda/\ln b$, der Grad also $\le1$. Abhängig: $\lambda=q\ln b$ gibt
      $b^q=q$, $L_b=q$ rational und $\lambda=\ln q$ transzendent.
  stuetzt_sich_auf: [ar.satz.hermite_lindemann, ar.satz.gelfond_schneider, fp.satz.lambert]
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B11'}]
  pruefung:
    f1_folgt_unmittelbar: 'Ja (Hermite–Lindemann, Gelfond–Schneider); (iii) kurze Schanuel-Rechnung.'
    f2_benutzte_voraussetzungen: 'Nur die Fixpunktgleichung.'
    f3_spezialfall: 'Ja, klassische Transzendenzsätze.'
    f4_uebertragbar: 'Auf Fixpunkte der Iterierten (periodische Punkte) nur unter Schanuel.'
    f5_neue_frage: 'Ist λ₂ = L₂ ln 2 unbedingt transzendent (kein algebraisches λ mit λe^{−λ} = ln 2)?'
  bewertung: {richtigkeit: 'vollständig; (iii) bedingt formuliert', neuheit: folklore, nutzen: 'Sichert die Arithmetik der Grundkonstanten von Knesers Konstruktion.', nutzen_stufe: gering}
  kanten:
    - {typ: verwandt, ziel: fp.satz.abstossend}

- id: ar.beob.kf_population
  titel: '47 Kneser-Werte, 21 485 gesicherte Kettenbruchglieder: in jeder Prüfung wie Zufallszahlen'
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: vertiefung
  objekte: [kneser_T, transzendenz, hoehe]
  bereich: '$T_e$ an 26 rationalen Stellen, $\mathrm{slog}_e$ an 12, $T_2$ an 5, $\mathrm{slog}_2$ an 4; Daten mit 520 Stellen ($\ge494$ wahre), Kettenbruch des Intervalls $[x\pm10^{-470}]$'
  aussage: |
    Zusammen 21 485 gesicherte Teilnenner (Mittel 457 je Wert). Gauss–Kuzmin $\chi^2=12.0$ (8 Freiheitsgrade, $p=0.15$; 40 Zufalls-Pools gleicher Grösse: $2.1$–$23.2$),
    Chintschin-Mittel $2.664$ (Pools $2.645$–$2.718$, Soll $2.685$), Lévy $1.180\pm0.006$ (Soll $1.1866$, $z=-1.06$), grösster Teilnenner $154\,488$ (bei $T_e(\tfrac23)$, $p=0.18$),
    effektiver Irrationalitätsexponent $\mu_{\max}\le2.231$ (Median $2.120$ gegen $2.131$ bei Zufallszahlen). Kontrollen werden erkannt: $e$ ($\chi^2=780$), $\sqrt2$ ($2995$).
    Funktionalgleichung zwischen den gespeicherten Werten auf $10^{-519}$ erfüllt. Ableitungs-Konstanten ($\mathrm{sexp}_e'(0)$, $a_2$, $T''(0)$, $\int T$, $0!_2$, $\mathrm{sexp}_2'(0)$) auf 150 Stellen:
    generisch, $\mu_{\max}\le2.15$; $\mathrm{sexp}_e'(0)=[1;10,1,8,1,2,1,1,2,1,6,3,\dots]$.
  einfach: >-
    Wir haben die Kettenbrüche von 47 Kneser-Zahlen untersucht. Sie sehen in jeder Statistik aus wie die von zufällig gewählten Zahlen — kein Hinweis auf eine
    verborgene Formel. Beweisen kann so eine Statistik aber nichts.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B12, B13; e1_kf_statistik.py, e3_ableitungen_kf.py, cache/e1_ergebnis.json'}, {ref: justus_a1, stelle: 'Teil A (ein Wert, 1936 Glieder)'}]
  nachgeprueft:
    - {ergebnis: 'Gegenprobe 25.10.2026: e1_kf_statistik.py neu gerechnet, Ergebnisdatei bitgleich (χ² = 12.03, Chintschin 2.6643, Lévy 1.1800, μ_max 2.2308); e3_ableitungen_kf.py: gleiche Kettenbrüche, Gegenprobe gegen 160er-Stufe bestanden, μ_max ≤ 2.1483.'}
  pruefung:
    f1_folgt_unmittelbar: 'Nein (gemessen).'
    f2_benutzte_voraussetzungen: 'Intervall-Kettenbruch (nur Glieder, die für beide Intervallenden gleich sind); Richtigkeit der 494 Stellen (Funktionalgleichung als Gegenprobe).'
    f3_spezialfall: 'Erweitert ar.beob.ausschluss (ein Wert, 1936 Glieder) auf eine Population.'
    f4_uebertragbar: 'Auf jede neue Konstante (Pentation, Basis η).'
    f5_neue_frage: 'Nach ar.satz.metrisch_fast_alle ist das genau das erwartete Verhalten — nur ein Kneser-spezifisches Argument könnte mehr zeigen.'
  bewertung: {richtigkeit: 'numerisch, streng im Sinn der Intervallarithmetik der Kettenbrüche', neuheit: neu_ungeprueft, nutzen: 'Schliesst Strukturen wie bei e oder quadratischen Irrationalzahlen in den ersten ~460 Gliedern aus.', nutzen_stufe: gering}
  kanten:
    - {typ: verallgemeinert, ziel: ar.beob.ausschluss}
    - {typ: verwandt, ziel: ar.beob.keine_relationen}

- id: ar.frage.kehrwertsumme_e
  titel: 'Offen: Ist e⁻¹ + e⁻ᵉ + e^(−e^e) + … transzendent?'
  art: frage
  ebene: A
  status: offen
  niveau: vertiefung
  objekte: [transzendenz, turm]
  aussage: |
    Ist $C_e=\sum_{k\ge1}1/(e\uparrow\uparrow k)=e^{-1}+e^{-e}+e^{-e^e}+\dots=0.43386773918949380481\ldots$ transzendent, oder wenigstens irrational? Ist $C_b$ für rationales, nicht ganzes $b$ irrational?
    Der Liouville-Weg aus ar.satz.kehrwertsumme_liouville versagt, weil die Teilsummen keine Brüche sind; man bräuchte ein Mass der algebraischen Unabhängigkeit von
    $e,e^e,e^{e^e}$, das niemand hat. Der Rest nach drei Gliedern ist $e^{-e^{e^e}}\approx e^{-3.8\cdot10^6}$.
  einfach: >-
    Bei ganzen Basen ist die Summe der Kehrwerte des Turms sicher transzendent. Bei der Basis e weiss man es nicht — obwohl die Summe nach drei Gliedern auf Millionen Stellen fertig ist.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/29_transzendenz/BERICHT.md, B15, Offene Frage 1'}]
  naechste_frage: 'Schon e^e ist offen (ar.frage.e_hoch_e); unter Schanuel sind e, e^e, e^{e^e} unabhängig, aber ein quantitatives Unabhängigkeitsmass fehlt auch dann.'
  kanten:
    - {typ: verwandt, ziel: ar.frage.e_hoch_e}
    - {typ: verwandt, ziel: gr.satz.kehrwert_turmsumme}
    - {typ: verwandt, ziel: ar.satz.kehrwertsumme_liouville}
