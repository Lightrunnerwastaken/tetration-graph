gebiet: kn
# Runde 18.10.2026, Bericht 03 (Basis-Ebene): Verhalten des Motors für komplexe Basen und Kneser-Grössen für grosse Basen.
aussagen:

- id: kn.beob.motor_komplex_regulaer
  titel: 'Der Motor rechnet für komplexe Basen im Shell–Thron-Inneren die reguläre Tetration, Kneser nur im Horn rechts von η'
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: forschung
  objekte: [regulaer_T, kneser_T, shell_thron]
  bereich: 'Motor = fatou.gp-Fork (forschung/runde_2026_10_18/03_basis_ebene/motor.py); komplexe Basen nahe der reellen Achse'
  aussage: |
    Für Basen im Shell–Thron-Inneren liefert der Motor die reguläre (Koenigs-)Tetration am anziehenden Fixpunkt: bei $b=1.4\pm0.01i$ und $b=1.4+0.1i$ stimmt er mit
    einer unabhängigen Koenigs-Rechnung (regulaer.py) auf 15 Stellen überein, auch bei $z=0.5+3i$. Kneser rechnet er nur ausserhalb, nahe $\eta$ also nur im dünnen
    Horn (fp.satz.horn_eta). Beim Kreis um $\eta$ wechselt er daher automatisch zwischen Kneser und regulär. Kneser-Werte unter $b=\eta+10^{-4}$ scheitern bei 40 Stellen (Überlauf).
  einfach: >-
    Unser Rechenprogramm für komplexe Basen macht nicht immer Kneser: Wo der unendliche Turm einen Grenzwert hat, rechnet es die einfachere reguläre Tetration.
    Das muss man wissen, bevor man seine Zahlen deutet.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_18/03_basis_ebene/BERICHT.md, B2; regulaer.py, motor.py'}]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; Eigenschaft der Software.'
    f2_benutzte_voraussetzungen: 'Drei Basen, mehrere Höhen, 15 Stellen.'
    f3_spezialfall: nein
    f4_uebertragbar: 'Betrifft jede Rechnung mit dem Motor bei komplexen Basen (Monodromie, Paulsen-Vergleich).'
    f5_neue_frage: 'Welche Lösung wählt Paulsen 2019 im Shell–Thron-Inneren, und hängt sie holomorph von b ab?'
  bewertung: {richtigkeit: 'numerisch, 15 Stellen', neuheit: neu_ungeprueft, nutzen: 'Warnung und Werkzeug: der Motor ist im Inneren eine geprüfte reguläre Rechnung.', nutzen_stufe: mittel}
  kanten:
    - {typ: verwandt, ziel: kn.satz.paulsen_komplex}
    - {typ: verwandt, ziel: kl.satz.regulaer}

- id: kn.beob.grosse_basis
  titel: 'Kneser für grosse Basen: T′(0) wächst langsam, der Wendepunkt wandert nach links'
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: vertiefung
  objekte: [kneser_T]
  bereich: 'reelle Basen $2\le b\le10^4$, 30 Stellen'
  aussage: |
    | $b$ | $T_b'(0)$ | $T_b''(0)$ | Wendepunkt $x_w$ |
    |---|---|---|---|
    | 2 | 0.889364954620976 | 0.0173530979307 | −0.0302445427536393 |
    | 3 | 1.14909879145946 | 0.716664350009 | −0.603863714358098 |
    | 5 | 1.40602362406508 | 1.62222718161 | −0.84692037022525 |
    | 30 | 2.03120317345009 | 4.63385039301 | −1.11289628131011 |
    | 100 | 2.33385048951909 | 6.47678151514 | −1.18188034423232 |
    | 1000 | 2.78599024341557 | 9.67356140182 | −1.25479311682541 |
    | $10^4$ | 3.1405112564132 | 12.5406025267 | −1.29677936033631 |

    $x_w(2)$ trifft den zertifizierten Wert. Ein Gesetz für das Wachstum wurde nicht gefunden; $b=10^6$ scheitert im Motor.
  einfach: >-
    Je grösser die Basis, desto steiler ist die Tetration bei 0 — aber nur langsam. Ihr Knick (Wendepunkt) rückt dabei immer weiter nach links Richtung −1.3.
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_18/03_basis_ebene/BERICHT.md, B10; e9_grosse_basis.py'}]
  pruefung:
    f1_folgt_unmittelbar: 'Nein (gemessen).'
    f2_benutzte_voraussetzungen: 'Motor bei dps 30.'
    f3_spezialfall: nein
    f4_uebertragbar: 'Auf die Frage nach dem Grenzverhalten für b → ∞.'
    f5_neue_frage: 'Strebt x_w(b) gegen eine Grenze (−3/2? −2?)? T′(0) wächst zwischen 10 und 10⁴ etwa wie (ln b)^0.45 (ε₀ = ∂ln T′(0)/∂ln ln b ≈ 0.41–0.49, gr.beob.eps0_tabelle), nicht wie ln ln b.'
  bewertung: {richtigkeit: 'numerisch, 30 Stellen', neuheit: neu_ungeprueft, nutzen: 'Werte für grosse Basen, Ausgangspunkt einer Asymptotik.', nutzen_stufe: gering}
  kanten:
    - {typ: verwandt, ziel: gr.beob.wendepunkte}
    - {typ: verwandt, ziel: gr.verm.ein_wendepunkt}
