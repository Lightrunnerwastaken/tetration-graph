- id: br.frage.momente_doppelpunkt
  titel: 'Gibt es eine Tetration ≠ Kneser mit sich schneidender θ_T-Kurve, die die ganze Momentenfamilie erfüllt?'
  art: frage
  ebene: B
  status: offen
  niveau: forschung
  objekte: [T_b, theta_kneser, fourier_moden]
  aussage: |
    Nach br.satz.momente_jordan bleibt von br.frage.momentenfamilie nur der Fall, dass $\Gamma_T$ Doppelpunkte hat; solche Tetrationen gibt es schon bei kleinen Störungen
    (br.beob.gegenbeispiel_doppelpunkt). Dann zerfällt $\mathbb C\setminus\Gamma_T$ in mehrere Teilgebiete $U_j$: $C_T=1/(\zeta-c)$ gilt auf $\Omega_T$, auf jedem $U_j$ ist $C_T$
    holomorph, mit Sprüngen an den Kanten, summiert über die Blätter. Auf einer sich schneidenden Kurve gibt es viele darstellende Masse für $c$ (Mischungen harmonischer
    Masse verschiedener Teilgebiete) — das Argument des Jordan-Falls reicht dort nicht. Ein Gegenbeispiel wurde weder gefunden noch gesucht.
    Mögliche Wege: die Umlaufzahlfunktion der Kurve und ein Argument wie im Jordan-Fall auf dem immersierten Gebiet über $\Gamma_T$ (Blanks Problem); numerisch Störungen mit
    $\sin4\pi x$ und grossem $p'$, an denen man $V_2,\dots,V_K$ zugleich nullsetzt, und prüfen, ob die Lösungen mit wachsendem $K$ konvergieren.
  einfach: >-
    Offen ist nur noch der Fall, in dem die Wellenkurve sich selbst schneidet: Könnte dort eine andere Tetration als Kneser alle Potenz-Mittelwerte richtig haben?
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/04_momentenfamilie/BERICHT.md, Befund O, Abschnitt „Was offen bleibt“, Offene Fragen 1–2'}]
  kanten:
    - {typ: verwandt, ziel: br.frage.momentenfamilie}
    - {typ: verwandt, ziel: br.satz.momente_jordan}
    - {typ: verwandt, ziel: br.beob.gegenbeispiel_doppelpunkt}
