- id: kl.verm.lambert_zeta
  titel: Von Lambert-Reihen zu Digamma beim Grenzübergang b → η
  art: vermutung
  ebene: C
  status: vermutung
  niveau: forschung
  objekte: [regulaer_T, fatou_koord, eta]
  aussage: |
    Für $b\uparrow\eta$ gehen die Lambert-Bruchsummen (kl.satz.koenigs_spektral, Nenner $1-\lambda_b^n\to0$) in die parabolische
    Darstellung mit $\psi$ und Hurwitz-Zeta (kl.satz.eta_digamma) über: $S_b(x)\to S_\eta(x)$ mit Fehler $O(\eta-b)$. Die „geeignete
    Umskalierung“ ist die Resummation zur q-Digamma-Funktion mit $q=\lambda_b$ (im Möbius-Modell exakt, kl.satz.moebius_qdigamma);
    offen ist der Beweis für die echte Abbildung samt dem Anteil $\tfrac13\log k$.
  gegenbeispielsuche: |
    exp.lambert_zeta: sechs Basen $b=\exp(\lambda e^{-\lambda})$, $\delta=1-\lambda=0.2\dots0.005$: $|S_b(1/2)-S_\eta(1/2)|$ fällt monoton bis $2.3\cdot10^{-6}$,
    Ordnung 2.0 in δ, also 1 in $\eta-b$. Rest „echt − Möbius“ → η-Rest (0.014572 → 0.014687).
  pruefung:
    f1_folgt_unmittelbar: Nein.
    f2_benutzte_voraussetzungen: 'Stetigkeit der Tetration in b bei η (kl.frage.stetig_eta).'
    f3_spezialfall: 'Analog zu „parabolischer Implosion“ (Lavaurs).'
    f4_uebertragbar: —
    f5_neue_frage: 'Welche Umskalierung: in log λ_b oder in √(η − b) (vgl. gr.satz.wurzel_eta)?'
  bewertung: {richtigkeit: 'Mechanismus bewiesen (Modell), Konvergenz numerisch', neuheit: unklar, nutzen: 'Verbindet die zwei Kalküle.', nutzen_stufe: mittel}
  quellen: [{ref: justus_synthese_jul, stelle: 'Conjecture H'}, {ref: diese_arbeit}]
  experimente: [exp.lambert_zeta]
  versionen:
    - {datum: '2026-07', fassung: 'Juli-Synthese', aenderung: '„nach korrekter Umskalierung“ ohne Angabe der Skalierung.'}
    - {datum: '2026-10-08', fassung: 'Graph', aenderung: 'Skalierung = q-Digamma mit q = λ; Konvergenzordnung gemessen.'}
  kanten:
    - {typ: verwandt, ziel: kl.frage.stetig_eta}

