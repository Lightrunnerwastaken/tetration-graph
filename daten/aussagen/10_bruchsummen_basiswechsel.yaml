- id: kl.satz.moebius_qdigamma
  titel: Lambert-Bruchsummen sind q-Digamma-Funktionen
  art: satz
  ebene: C
  status: bewiesen
  niveau: forschung
  objekte: [regulaer_T, multiplikator, eta]
  bereich: 'Möbius-Modell $M$ mit Fixpunkten $a<A$ und Multiplikator $\lambda\in(0,1)$ bei $a$; Start $y_0=1<a$'
  aussage: |
    Für $(M(y)-a)/(M(y)-A)=\lambda\,(y-a)/(y-A)$ ist die Bruchsumme exakt
    $$S^M(x)=a\,x+\frac{A-a}{\ln\lambda}\Bigl[\psi_\lambda(x+1+s)-\psi_\lambda(1+s)\Bigr],\qquad \lambda^s=\frac{a-1}{A-1},$$
    mit der q-Digamma-Funktion $\psi_q(z)=-\ln(1-q)+\ln q\sum_{n\ge0}\frac{q^{n+z}}{1-q^{n+z}}$ (eine Lambert-Reihe). Nähert man $b^y$ nahe η
    durch $M$ an, gilt $(A-a)/\ln\lambda\to-2e$, $s\to Z_0=\frac{2e}{e-1}$, $\psi_\lambda\to\psi$, also
    $$S^M(x)\longrightarrow e\,x-2e\bigl[\psi(x+1+Z_0)-\psi(1+Z_0)\bigr].$$
    Das ist der Mechanismus „Lambert → Digamma“: die Nenner $1-\lambda^n$ der Lambert-Reihe sind die Nenner der q-Digamma-Funktion, und
    $q\to1$ ist ihr klassischer Grenzwert. Was das Modell nicht trifft, ist der Anteil aus $\tfrac13\log k$ und $C_T$.
  einfach: >-
    Unter η ist jede Bruchsumme eine Reihe mit Nennern 1 − λⁿ. Genau solche Reihen ergeben die „q-Digamma-Funktion“. Wenn λ gegen 1
    geht (b gegen η), wird daraus die gewöhnliche Digamma-Funktion — dieselbe, die bei η direkt auftaucht.
  beweis: {art: vollstaendig, text: '$r_k=(y_k-a)/(y_k-A)=r_0\lambda^k$, also $y_k-a=-(A-a)\,r_k/(1-r_k)$; mit $r_0=\lambda^s$ ist $\sum_{k\ge1}[g(k)-g(k+x)]$, $g(t)=\lambda^{t+s}/(1-\lambda^{t+s})$, nach Definition von $\psi_q$ gleich $[\psi_\lambda(1+s)-\psi_\lambda(1+s+x)]/\ln\lambda$. Grenzwerte: $A-a\approx2e(1-\lambda)$, $\ln r_0\approx(a-A)/(e-1)$; $\psi_q\to\psi$ ist klassisch.'}
  stuetzt_sich_auf: [kl.satz.koenigs_spektral, kl.satz.bruchsumme]
  experimente: [exp.lambert_zeta]
  pruefung:
    f1_folgt_unmittelbar: 'Ja, sobald man das Möbius-Modell nimmt (dort ist die Iteration explizit).'
    f2_benutzte_voraussetzungen: 'Nur Fixpunkte und Multiplikator; die echte Abbildung stimmt mit M bis zur zweiten Ordnung am Doppelfixpunkt überein.'
    f3_spezialfall: 'Ja: Bruchsumme einer Möbius-Iteration = q-Analogon der Harmonischen Zahlen.'
    f4_uebertragbar: 'Auf jeden Sattel-Knoten-Übergang (zwei verschmelzende Fixpunkte).'
    f5_neue_frage: 'Korrektur des Modells: welche q-Funktion trägt den Anteil (1/3) log k? (vermutlich eine q-Hurwitz-Zeta-Ableitung)'
  gegenbeispielsuche: 'exp.lambert_zeta: Formel gegen direkte Summe bei λ = 0.9 auf $8\cdot10^{-30}$; ψ_q → ψ linear in 1 − q; bei δ = 0.005: (A − a)/ln λ = −5.4321 (−2e = −5.4366), s = 3.1613 (Z₀ = 3.1640).'
  bewertung: {richtigkeit: vollständig, neuheit: neu_ungeprueft, nutzen: 'Macht die Vermutung „Lambert → Zeta“ der Juli-Synthese konkret: die Brücke ist die q-Digamma-Funktion.', nutzen_stufe: mittel}
  quellen: [{ref: diese_arbeit}]
  kanten:
    - {typ: stuetzt, ziel: kl.verm.lambert_zeta}
    - {typ: verwandt, ziel: kl.satz.eta_digamma}

- id: kl.beob.stetig_eta
  titel: T_b(1/2) geht bei η glatt von regulär zu Kneser über
  art: beobachtung
  ebene: C
  status: numerisch
  niveau: forschung
  objekte: [regulaer_T, kneser_T, eta]
  bereich: '$T_b(1/2)$: regulär für $b<\eta$ (unterer Fixpunkt), Kneser für $b>\eta$, $T_\eta$ über die Fatou-Koordinate'
  aussage: |
    $T_b(1/2)\to T_\eta(1/2)=1.257153075054\ldots$ von beiden Seiten, linear in $|b-\eta|$, und mit **derselben Steigung**:
    $\partial_bT_b(1/2)\approx0.438579$ (von unten, regulär) bzw. $0.438581$ (von oben, Kneser). Die beiden Familien setzen sich also
    numerisch $C^1$ über η hinweg fort. Auch die Bruchsumme $S_b(1/2)\to S_\eta(1/2)$, Ordnung 1 in $\eta-b$.
  einfach: >-
    Unter η und über η baut man die Tetration auf ganz verschiedene Arten. Trotzdem passen die Werte bei Höhe 1/2 an der Grenze
    nahtlos zusammen — sogar die Steigung stimmt auf sechs Stellen überein.
  experimente: [exp.lambert_zeta]
  pruefung:
    f1_folgt_unmittelbar: 'Nein; Stetigkeit von unten ist plausibel (keine parabolische Implosion bei reellem λ → 1), von oben nicht offensichtlich.'
    f2_benutzte_voraussetzungen: 'Sechs Basen unter η (δ = 1 − λ von 0.2 bis 0.005), drei über η (b − η = 10⁻¹, 10⁻², 10⁻³); Steigungen linear extrapoliert.'
    f3_spezialfall: —
    f4_uebertragbar: 'Auf andere Höhen x; Frage nach höheren Ableitungen in b (analytisch über η hinweg?).'
    f5_neue_frage: 'Ist T_b(x) bei η sogar unendlich oft differenzierbar in b — oder analytisch? → kl.frage.eta_analytisch'
  bewertung: {richtigkeit: numerisch, neuheit: neu_ungeprueft, recherche: 'Kouznetsov (TORI-Wiki) gibt eine vorläufige Taylor-Tabelle von tet_b(x) in b − η an, deren erster Koeffizient 0.61061 zu unserem T_η′(0) = 0.611095 passt, und hält η trotzdem für einen Verzweigungspunkt; im Forum (mike3, 2011) Argumente gegen Analytizität. Die gleiche Steigung von beiden Seiten (C¹) ist dort nicht gemessen.', nutzen: 'Beantwortet kl.frage.stetig_eta numerisch für x = 1/2 und geht darüber hinaus (gleiche Steigung).', nutzen_stufe: hoch}
  quellen: [{ref: diese_arbeit}, {ref: mizugadro_tetration, stelle: 'Abschnitt „Behavior at b ≈ exp(1/e), z ≈ 0“'}, {ref: forum_mike3_2011}]
  kanten:
    - {typ: stuetzt, ziel: kl.frage.stetig_eta}
    - {typ: motiviert, ziel: kl.frage.eta_analytisch}

- id: kl.frage.eta_analytisch
  titel: Ist die Tetration in der Basis bei η analytisch?
  art: frage
  ebene: C
  status: offen
  niveau: forschung
  objekte: [regulaer_T, kneser_T, eta]
  bereich: '$T_b(x)$ für festes $x>-2$ als Funktion der Basis $b$ nahe $\eta$'
  aussage: |
    Unter $\eta$ regulär, über $\eta$ nach Kneser: Numerisch passen Wert und erste Ableitung in $b$ bei $\eta$ zusammen (kl.beob.stetig_eta). Ist $b\mapsto T_b(x)$ bei $\eta$
    **analytisch** — oder ist $\eta$ ein Verzweigungspunkt, an dem die Funktion zwar glatt ($C^\infty$), aber nicht analytisch ist?
  naechste_frage: |
    Zweite und dritte Ableitung in $b$ von beiden Seiten messen; komplexe Basen auf einem kleinen Kreis um $\eta$ auswerten (Monodromie). Kandidat für einen
    nicht-analytischen Anteil: Glieder wie $\exp(-c/\sqrt{b-\eta})$ aus dem Engpass bei $e$ (bw.lem.randgesetz) — unendlich flach, also mit allen Ableitungen verträglich.
  quellen: [{ref: mizugadro_tetration, stelle: '„β appears as a branch point of tetration“'}, {ref: forum_mike3_2011}, {ref: diese_arbeit}]
  kanten:
    - {typ: verwandt, ziel: bw.lem.randgesetz, notiz: 'der Engpass liefert Glieder in (b − η)^(−1/2)'}
    - {typ: verwandt, ziel: br.frage.implosion}

- id: kl.satz.invariante_daempfung
  titel: Die Welle ist gedämpft, nicht verschwunden
  art: satz
  ebene: C
  status: skizze
  niveau: forschung
  objekte: [F_bd, phase, multiplikator, schroeder]
  bereich: 'Übergang zweier Abel-Koordinaten $A_b$, $A_d$, angepasst an einem Punkt (Fixpunkt oder ∞)'
  aussage: |
    Die Übergangsfunktion zweier Abel-Koordinaten ist eine Funktion der **kanonischen Invariante** des Anpassungspunkts:
    hyperbolischer Fixpunkt ($|\lambda|<1$): $\lambda^{A}$, Betrag $<1$ — geometrisch gedämpft, Pseudoperiode $2\pi/|\arg\lambda|$, Dämpfung
    $|\lambda|^{2\pi/|\arg\lambda|}$ pro Pseudoperiode; rational neutraler Fixpunkt: $e^{2\pi iA}$ — echte 1-Periodizität (Écalle–Voronin, Hornabbildung);
    irrational neutral: quasiperiodisch; wesentliche Singularität bei ∞ (Türme über η): $e^{2\pi iA}$ — die klassische 1-periodische
    Basiswechsel-Funktion. Diese ist also der **Grenzfall $|\lambda|\to1$** der gedämpften Schwingung am geteilten Fixpunkt.
  einfach: >-
    Am gemeinsamen Fixpunkt gibt es dieselbe Welle wie beim klassischen Basiswechsel — nur wird sie bei jedem Schritt kleiner.
    Je näher |λ| an 1 liegt, desto länger überlebt sie; bei |λ| = 1 wird sie zur ungedämpften, ewigen Welle.
  formen:
    - {tex: '|\lambda|=0.3,\,0.6,\,0.8,\,0.9,\,0.97\ (\arg\lambda=0.5):\ \text{Dämpfung pro Periode }2.7\cdot10^{-7},\,1.6\cdot10^{-3},\,0.061,\,0.27,\,0.68', notiz: 'Original §3.1'}
    - {tex: 'b=-\tfrac{19}{25}:\ 2\pi/|\arg\lambda_d|=21.908,\ |\lambda_d|^{21.908}=3.128\cdot10^{-4}', notiz: 'Musterpaar'}
  beweis:
    art: skizze
    text: 'Hyperbolischer Fall bewiesen (kl.satz.basiswechsel_gleiches_L: Korrektur ist Potenzreihe in λ_d^x). Rational neutral: Écalle–Voronin. Die übrigen Zeilen sind die Lesart des Originals.'
    luecken:
      - 'Dass die klassische periodische Phase (bw.satz.phasengesetz) als Grenzwert |λ| → 1 einer Familie gedämpfter Übergänge entsteht, ist eine Deutung, kein Grenzwertsatz.'
  stuetzt_sich_auf: [kl.satz.basiswechsel_gleiches_L]
  experimente: [exp.funde]
  pruefung:
    f1_folgt_unmittelbar: 'Hyperbolischer Fall ja; Gesamtbild nein.'
    f2_benutzte_voraussetzungen: 'Linearisierbarkeit am Anpassungspunkt.'
    f3_spezialfall: 'Verallgemeinert die Fourier-Struktur des Phasengesetzes (Moden ↔ Potenzen der Invariante).'
    f4_uebertragbar: 'Auf Zyklen (Rückkehrabbildung), auf die imaginäre Richtung (bw.satz.imaginaere_richtung).'
    f5_neue_frage: 'Lässt sich die Phase P_{b,d} über η als Grenzwert regulärer Übergänge an komplexen Basen mit |λ| ↑ 1 berechnen?'
  bewertung: {richtigkeit: 'teilweise bewiesen', neuheit: neu_ungeprueft, nutzen: 'Erklärt, warum der klassische Basiswechsel eine Welle trägt und der am geteilten Fixpunkt nicht.', nutzen_stufe: hoch}
  quellen: [{ref: justus_bc_geteilt, stelle: '§3'}]
  kanten:
    - {typ: verwandt, ziel: bw.satz.phasengesetz}
    - {typ: verwandt, ziel: kl.satz.qk_basiswechsel}
