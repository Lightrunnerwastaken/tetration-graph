- id: kn.frage.verzweigung_abstand
  titel: 'Wie schnell nähern sich Verzweigungsorte fester Tiefe einem Punkt, und wie gross ist der Abschluss der Nullstellenmenge der Nebenzweige?'
  art: frage
  ebene: C
  status: offen
  niveau: forschung
  objekte: [kneser_T, singularitaet_m2, exp_familie]
  aussage: |
    (1) Abstand $d_m(z)$ von $z$ zum nächsten Verzweigungsort der Tiefe $\le m$: vermutlich $d_m\asymp1/|F_m'(z)|$ (überexponentiell klein); eine Schranke von unten fehlt.
    (2) Hausdorff-Dimension des Abschlusses von $Z$: Er liegt in $\mathrm{sexp}^{-1}(A_0)$, und $A_0=\{c:\mathrm{Re}\,\exp^{[i]}(c)\ge E_i\ \forall i\}$ ist ein „Haarbündel“ der Exponentialabbildung.
    (3) Gibt es Punkte von $Z$ im Streifen $-2<\mathrm{Re}\,z\le-1$? (kn.satz.nebenblatt_nullstellen_rechts sagt dort nur $\mathrm{Re}\,\mathrm{sexp}\ge0$.)
    (4) Andere Basen: Für $b>\eta$ gilt die Dichte wie für $e$; für $1<b<\eta$ hat $\exp_b$ eine Fatou-Menge, und die Verzweigungsorte der regulären Tetration sind vielleicht nicht dicht.
  einfach: >-
    Wie nahe kommen Verzweigungen einer bestimmten Tiefe an einen Punkt heran, und wie „dick“ ist die Menge der Nullstellen auf den Nebenblättern?
  quellen: [{ref: diese_arbeit, stelle: 'forschung/runde_2026_10_25/06_riemannflaeche_sexp/BERICHT.md, Offene Fragen 1–4'}]
  kanten:
    - {typ: verwandt, ziel: kn.satz.verzweigung_dicht}
    - {typ: verwandt, ziel: kn.satz.nebenblatt_nullstellen_rechts}
    - {typ: verwandt, ziel: fp.satz.messbare_dynamik}
