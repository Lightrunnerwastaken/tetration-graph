kn.beob.einheitliche_raenge:
  worum: |
    Ob die höheren Rechenarten zur Basis 2 nach einer einzigen Methode gebaut werden können — und wie stark sich die Methoden unterscheiden.
  genau: |
    Reguläre und Kneser-artige Pentation unterscheiden sich um eine Welle der Grösse $5\cdot10^{-6}$, die Hexationen um $1$–$3\cdot10^{-5}$.
  warum: |
    Zwei Superfunktionen derselben Funktion mit gleichem Startwert unterscheiden sich um eine 1-periodische Verschiebung der Höhe; klein gemessen heisst: die Auswahlen liegen sehr nahe beieinander.
  beispiel: |
    Fixpunkt der Pentation zur Basis 2 (für Kneser-artige Hexation): $L_5=1.80768+1.59692i$.
  bilder: []
  einordnung: |
    Rangfortsetzung: [[kn.beob.halbrang_rangfortsetzung]]; Auswahlabhängigkeit der Grenzbasen: [[kn.satz.eta_auswahl]].