# Theorie-Blöcke für die Literatur-Aussagen des Gebiets bw (Strang L2, Literaturkarte, 12.10.2026)

bw.satz.paulsen_cowgill_hardy:
  worum: |
    Rechnet man die Kneser-Tetration zur Basis 2 in Höhen der Basis $e$ um, bleibt ein kleines Wackeln, das nie verschwindet. Paulsen und Cowgill haben die
    strenge Form davon bewiesen: Die beiden Funktionen lassen sich nicht in eine gemeinsame Grössenordnung einfügen.
  genau: |
    Für Basen $a\ne b$ über $\eta$ liegen $T_a$ und $T_b$ (die eindeutigen Tetrationen nach [[kn.satz.paulsen_cowgill]]) nicht in einem gemeinsamen
    Hardy-Körper; ebenso die von ihnen erzeugten gebrochenen Iterierten der Exponentialfunktionen.
  warum: |
    Den Beweis haben wir nicht gelesen (nur die zbMATH-Zusammenfassung). Zur Bedeutung:
    1. Ein Hardy-Körper ist ein Körper von Funktionen (Keime bei $+\infty$), abgeschlossen unter Ableitung; jede seiner Funktionen hat schliesslich ein festes Vorzeichen.
    2. Liegen $f$ und $g$ in einem gemeinsamen Hardy-Körper, so ist zum Beispiel $f-g$ schliesslich positiv, negativ oder null — man kann sie der Grösse nach vergleichen.
    3. Unverträglich heisst: irgendeine aus $f$, $g$ und ihren Ableitungen gebildete Funktion wechselt ihr Vorzeichen unendlich oft. Genau das erwartet man, wenn der
       Basiswechsel eine nichtkonstante periodische Welle trägt ([[bw.satz.phasengesetz]]).
  einordnung: |
    Begutachtete Stütze für die Welle des Basiswechsels (Fox 2007, Levenstein 2009/2018); möglicherweise die Antwort auf [[bw.frage.halbiter_vergleich]] für Kneser.
    Wachstumsklassen der halben Exponentialfunktion: [[kn.satz.halbe_exp_wachstum]].

bw.frage.nixon_eta_basiswechsel:
  worum: |
    Der Basiswechsel rechnet eine Tetration in Höhen einer anderen Basis um. Nixon wollte 2021 von der Basis η aus starten, weil dort die gebrochenen
    Iterierten besonders gut verstanden sind, und so Knesers Tetration zur Basis e neu gewinnen.
  genau: |
    Gesucht: φ mit e^{φ(z)} = φ(η^z), Fixpunkte L, L̄ von exp. Ansatz: φ = Ψ⁻¹(exp(L·slog_η + θ(slog_η))) mit 1-periodischem θ; offen: θ so, dass φ reell ist.
  warum: |
    Jede Lösung der Gleichung lässt sich so schreiben, weil zwei Abel-Funktionen sich um eine periodische Funktion unterscheiden. Die Realitätsbedingung legt θ nicht von
    selbst fest — bei Kneser leistet das die Riemann-Abbildung.
  einordnung: |
    Ein weiterer Zugang zum Basiswechsel neben Fox' Grenzwertformel und unserem Phasengesetz ([[bw.satz.phasengesetz]]); Kneser-Konstruktion: [[kn.konstr.kneser]].
