# Theorie-Blöcke zur Runde 18.10.2026, Bericht 08 „Lokale, reelle Kennzeichnung von Kneser“ (forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md).

br.satz.taylorradius_halbebene:
  worum: |
    Bohr–Mollerup kennzeichnet Γ durch eine Bedingung an jeder Stelle. Gesucht ist etwas Ähnliches für Kneser. Die passende lokale Grösse ist der
    Konvergenzradius $\rho_T(x)$ der Taylor-Reihe an $x$.
  genau: |
    $\rho_T(x)\le x+2$ immer; $\rho_T(x)=x+2$ für alle $x$ $\iff$ $T$ holomorph auf $\mathrm{Re}\,z>-2$ $\iff$ $(-1)^{k-1}k(x+2)^kT^{(k)}(x)/k!\to1$ an jeder Stelle.
  warum: |
    Jede Tetration hat bei $-2$ eine Singularität wie $\log(x+2)$, darum reicht keine Reihe weiter. Ist $T$ in der Halbebene holomorph, ist $\log(z+2)$ die nächste Singularität
    und bestimmt die hohen Koeffizienten. Umgekehrt zwingt ein festes Vorzeichenmuster nach Pringsheim die Singularität auf die reelle Achse, also nach $-2$.
  beispiel: |
    Kneser: der normierte Quotient ist $1.0000$ bei $k=99$ für $x\le0.15$; eine Sinus-Verbiegung mit $\varepsilon=0.03$ hat bei $x=0.3$ nur Radius $\approx0.8$.
  bilder: []
  einordnung: |
    Antwortet teilweise auf [[br.frage.bohr_mollerup]]; nichtlokales Gegenstück [[br.satz.reelle_kennzeichnung]]; offen bleibt [[br.frage.halbebene_eindeutigkeit]].

br.satz.ungerade_ableitungen_halbebene:
  worum: |
    mike3 vermutete: alle ungeraden Ableitungen von Kneser sind positiv. Was folgt aus so einer Bedingung?
  genau: |
    $T^{(2n+1)}\ge0$ für alle $n\ge n_0$ auf $(-2,\infty)$ ⇒ $T$ holomorph auf $\mathrm{Re}\,z>-2$.
  warum: |
    Eine Funktion, deren gerade Ableitungen alle $\ge0$ sind, ist nach Bernstein analytisch mit Radius bis zum Rand des Intervalls. Das wendet man auf eine hohe ungerade Ableitung von $T$ an.
  beispiel: |
    Kneser erfüllt die Bedingung bis Ordnung 99 numerisch ([[br.beob.kneser_ungerade_99]]).
  bilder: []
  einordnung: |
    Ordnet [[gr.verm.ungerade_ableitungen]] ein; zusammen mit [[br.satz.taylorradius_halbebene]] Grundlage für [[br.satz.lokal_genau_dann_halbebene]].

br.satz.lokal_genau_dann_halbebene:
  worum: |
    Gibt es eine lokale reelle Kennzeichnung von Kneser?
  genau: |
    Ja genau dann, wenn Q* gilt: jede reelle, auf $\mathrm{Re}\,z>-2$ holomorphe Tetration ist Kneser.
  warum: |
    Die Bedingung aus [[br.satz.taylorradius_halbebene]] beschreibt genau die Halbebenen-Holomorphie; sie kennzeichnet also genau dann, wenn diese Klasse nur Kneser enthält.
  beispiel: |
    Eine Möbius-Verbiegung ist auf jedem beschränkten Gebiet holomorph, verletzt die Bedingung aber für grosse $x$ — man braucht $x\to\infty$ wie bei Bohr–Mollerup.
  bilder: []
  einordnung: |
    Führt [[br.frage.bohr_mollerup]] auf [[br.frage.halbebene_eindeutigkeit]] zurück; Eindeutigkeit mit Grenzwert: [[kn.satz.paulsen_cowgill]].

br.frage.halbebene_eindeutigkeit:
  worum: |
    Reicht Holomorphie auf $\mathrm{Re}\,z>-2$ (ohne Grenzwert bei $i\infty$) für die Eindeutigkeit?
  genau: |
    Offen. Paulsen–Cowgill brauchen zusätzlich $T(z)\to L$ für $\mathrm{Im}\,z\to\infty$.
  warum: |
    Dann wäre $\theta_T$ oben periodisch holomorph bis auf harmlose Punkte; es fehlt, eine wesentliche Singularität bei $q=0$ auszuschliessen.
  beispiel: |
    Alle bisher geprüften Verbiegungen haben Verzweigungspunkte in der Halbebene.
  bilder: []
  einordnung: |
    Verwandt mit [[kn.verm.tk_c2]]; entscheidet [[br.satz.lokal_genau_dann_halbebene]].

br.satz.slog_nie_total_monoton:
  worum: |
    Zwei naheliegende Gamma-artige Bedingungen auf der slog-Seite: totale Monotonie und Log-Konkavität von $\mathrm{slog}'$.
  genau: |
    Beide sind für jede Tetration unmöglich.
  warum: |
    Totale Monotonie würde $\mathrm{slog}$ zu einer ganzen Funktion machen; dann gälte $\mathrm{slog}(e^w)=\mathrm{slog}(w)+1$ auch am Fixpunkt $L$, also $0=1$.
    Bei Log-Konvexität passen die Asymptotiken bei $+\infty$ und $-\infty$ nicht zusammen.
  beispiel: |
    Kneser: $T''<0$ nur auf $(-2,-0.5218)$.
  bilder: []
  einordnung: |
    Negativ für [[br.frage.bohr_mollerup]]; Randverhalten wie [[gr.kor.konvex_nach_oben]].

br.satz.endliche_vorzeichen_offen:
  worum: |
    Kann eine Liste endlich vieler Vorzeichenbedingungen Kneser auswählen?
  genau: |
    Nein: kleine Verbiegungen haben für $T',\dots,T^{(N)}$ dieselben Vorzeichenmuster wie Kneser; an den Rändern sind die Vorzeichen für alle Tetrationen gleich.
  warum: |
    Die Ableitungen hängen stetig von der Verbiegung ab, und einfache Nullstellen verschieben sich nur wenig.
  beispiel: |
    Sinus-Störung $10^{-4}$: erste Verletzung erst bei Ordnung 15; bei $10^{-6}$ im Messfenster gar keine.
  bilder: []
  einordnung: |
    Vorzeichen-Gegenstück zu [[br.satz.endlich_viele_reichen_nicht]].

br.beob.verbiegungen_singularitaeten:
  worum: |
    Wie verletzen echte Verbiegungen von Kneser die lokale Bedingung?
  genau: |
    Sie haben Verzweigungspunkte in $\mathrm{Re}\,z>-2$, in Höhe $\approx\ln(1/\varepsilon)/2\pi$; dadurch sinkt der Taylor-Radius und schon niedrige ungerade Ableitungen werden negativ.
  warum: |
    Wo $z+p(z)=-2$ wird, erbt $T=\mathrm{sexp}_K(z+p(z))$ die Log-Singularität von Kneser bei $-2$.
  beispiel: |
    $\varepsilon=10^{-3}$: $T^{(5)}(-0.6)=-0.408$ statt $+5.409$.
  bilder: []
  einordnung: |
    Belege für [[br.satz.taylorradius_halbebene]] und zu [[br.frage.halbebene_eindeutigkeit]].

br.beob.kneser_ungerade_99:
  worum: |
    Neue Messung zu mike3s Vermutung.
  genau: |
    Alle ungeraden Taylor-Koeffizienten bis Ordnung 99 sind auf $[-1.95,1.5]$ positiv.
  warum: |
    Rechnung mit 60 Stellen; für $x>0.5$ nur gewertet, wo zwei Rechenwege übereinstimmen.
  beispiel: |
    Kleinster normierter Wert 0.952 bei $k=1$, $x\approx-1.65$.
  bilder: []
  einordnung: |
    Stützt [[gr.verm.ungerade_ableitungen]]; Folgerung daraus: [[br.satz.ungerade_ableitungen_halbebene]].

br.beob.kneser_logkonvex:
  worum: |
    Ist $T'$ wie Γ log-konvex?
  genau: |
    Für Kneser ja, mit $\min(\log T')''=0.9196$; die lineare Tetration liegt mit $(\log T')''=0$ genau auf dem Rand.
  warum: |
    Rechts von 2 überträgt $(\log T')''(x+1)=(\log T')''(x)+T''(x)$ die Positivität; links gemessen.
  beispiel: |
    Minimum bei $x\approx-0.04$.
  bilder: []
  einordnung: |
    Offene Bedingung, kennzeichnet also nicht ([[br.satz.endliche_vorzeichen_offen]]); Vergleich mit [[br.frage.bohr_mollerup]].
