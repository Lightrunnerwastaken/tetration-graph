# Theorie-Blöcke zur Runde 18.10.2026, Bericht 03 (Basis-Ebene).

kn.beob.motor_komplex_regulaer:
  worum: |
    Welche Tetration liefert unser Rechenprogramm (fatou.gp-Fork) für komplexe Basen?
  genau: |
    Im Shell–Thron-Inneren die reguläre Tetration am anziehenden Fixpunkt (15 Stellen gegen eine eigene Koenigs-Rechnung), Kneser nur ausserhalb.
  warum: |
    Wo ein anziehender Fixpunkt existiert, findet das Verfahren ihn; Knesers Konstruktion braucht ein Fixpunktpaar ohne Anziehung.
  beispiel: |
    $b=1.4+0.1i$, $z=0.5+3i$: Motor und regulaer.py stimmen auf 15 Stellen überein.
  bilder: []
  einordnung: |
    Wichtig für Vergleiche mit [[kn.satz.paulsen_komplex]]; Gestalt des Kneser-Bereichs bei $\eta$: [[fp.satz.horn_eta]].

kn.beob.grosse_basis:
  worum: |
    Wie verhält sich Knesers Tetration für sehr grosse Basen?
  genau: |
    $T_b'(0)$: 0.889, 2.334, 2.786, 3.141 für $b=2,10^2,10^3,10^4$; Wendepunkt $x_w$: $-0.030$, $-1.182$, $-1.255$, $-1.297$.
  warum: |
    Nur gemessen (Motor, 30 Stellen); ein Gesetz für das Wachstum ist nicht gefunden. $x_w(2)$ trifft den zertifizierten Wert.
  bilder: []
  einordnung: |
    Ergänzt [[gr.beob.wendepunkte]] und [[gr.verm.ein_wendepunkt]].
