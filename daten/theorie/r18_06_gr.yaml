# Theorie-Blöcke: Runde 18.10.2026, Agent 06 (forschung/runde_2026_10_18/06_asymptotik/BERICHT.md).

gr.satz.slog_logstern_welle:
  worum: |
    Wie nahe ist Knesers Superlogarithmus am einfachen iterierten Logarithmus $\log^*$ (so oft logarithmieren, bis man unter 1 ist)?
  genau: |
    $\mathrm{slog}-\mathrm{slog}_{\mathrm{lin}}=P(\text{Bruchteil der Höhe})$ mit $P(u)=u+1-\mathrm{sexp}(u)$, $-0.0078653\le P\le0.0091705$; kein Grenzwert.
  warum: |
    Beide Funktionen wachsen bei jedem $e^x$ um genau 1; ihre Differenz wiederholt sich also mit Periode 1 in der Höhe. Auf einer Periode ist sie $P$, und $P$ ist nicht konstant.
  beispiel: |
    Mittelwert der Welle: $\tfrac12-\int_{-1}^0\mathrm{sexp}=0.00078182$.
  bilder: []
  einordnung: |
    Präzisiert [[gr.satz.logstern]]; Integral aus [[gr.beob.integrale_kneser]]; Anwendung [[kn.kor.halbexp_band]].
