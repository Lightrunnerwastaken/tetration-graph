# Theorie-Block zur Runde 25.10.2026, Bericht 14: die Normalform F(m) = m e^m (forschung/runde_2026_10_25/14_klammerungen/BERICHT.md).

it.verm.mexp_halbiterierte_divergent:
  worum: |
    Hat $me^m$ bei 0 eine halbe Iterierte als konvergente Potenzreihe?
  genau: |
    Vermutlich nicht: die formale Halbiterierte wächst wie $(k-2)!/(2\pi)^k$. Dann sind $a[4]2^{1/2}$ bei $a=1$ und $x[5']\tfrac12$ bei $x=1$ glatt, aber nicht analytisch.
  warum: |
    Eine analytische Halbiterierte müsste die eindeutige formale sein. Die Divergenz selbst ist nur numerisch belegt; ein Beweis ginge über die Hornabbildung.
  beispiel: |
    $g_8=-\tfrac{99}{7168}$, $g_{20}\approx-1.63$, $g_{30}\approx2.7\cdot10^{6}$, $g_{35}\approx-4.0\cdot10^{9}$.
  bilder: []
  einordnung: |
    Wie Bakers Satz für $e^z-1$ ([[it.satz.baker]]); Écalle–Voronin: [[it.satz.ecalle_voronin]]; derselbe Keim wie bei der Produkt-Tetration ([[br.beob.produkt_iteration_dreieck]]);
    ähnliches Phänomen in der Basis bei η: [[kl.verm.eta_glatt_nicht_analytisch]].
