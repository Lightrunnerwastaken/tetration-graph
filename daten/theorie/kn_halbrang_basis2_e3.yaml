kn.beob.halbrang_theta_grenze:
  worum: |
    Warum auch eine raffiniertere Summation beim halben Rang nicht mehr Stellen gibt.
  genau: |
    Die Mehrdeutigkeit der Summation ist genau eine 1-periodische Welle $a\sin2\pi x+b(1-\cos2\pi x)$, die an ganzen Höhen verschwindet.
  warum: |
    Solche Wellen ändern weder die Rekursion noch die ganzen Werte — das ist die Freiheit θ jeder gebrochenen Iteration. Eine Summationsregel legt sie fest, ohne zu sagen, welche richtig ist.
  beispiel: |
    Zwei Wege zu $H_{3.5}(2,0.5)$ geben $1.44302$ und $1.44246$–$1.44266$ — Unterschied etwa $5\cdot10^{-4}$, von der Grösse dieser Welle.
  bilder: []
  einordnung: |
    Grenze der Entwicklung: [[kn.beob.halbrang_divergenz]]; Grundfreiheit: [[fg.kor.nichteindeutigkeit]]; offene Frage: [[kn.frage.halber_rang]].