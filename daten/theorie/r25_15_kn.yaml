# Theorie-Block zur Runde 25.10.2026, Bericht 15: Folgerung für Knesers θ (forschung/runde_2026_10_25/15_erzeuger_monodromie/BERICHT.md).

kn.kor.theta_verzweigung_unendlich:
  worum: |
    Knesers Welle θ ist an jeder ganzen Zahl singulär (kn.satz.theta_singularitaet). Welcher Art ist diese Singularität, wenn man um sie herumläuft?
  genau: |
    Ein Verzweigungspunkt unendlicher Ordnung: kein Umlauf führt auf denselben Zweig zurück. Das Wachstum ist dabei extrem langsam, wie $h(\log z)$.
  warum: |
    Nahe $-1$ ist $\theta=h\circ\mathrm{sexp}_K-\mathrm{id}$, und $\mathrm{sexp}_K$ macht aus einem Umlauf um $-1$ einen Umlauf um 0. Der reguläre Erzeuger ändert bei jedem Umlauf um 0 sein Blatt,
    auf jedem Blatt (Zählwerk, erste Stelle), also auch $h$ und θ.
  beispiel: |
    $\mathrm{Re}(L\theta(iy))$ steigt von 1.098 bei $y=0.3$ nur auf 1.407 bei $y=0.004$.
  bilder: []
  einordnung: |
    Verfeinert [[kn.satz.theta_singularitaet]]; Grundlage: [[it.satz.erzeuger_kranzrekursion]]; Knesers Erzeuger: [[it.kor.kneser_erzeuger_sigma]]; andere Abbildungen: [[kn.satz.zoo_singulaerer_ort]].
