# Theorie-Blöcke zur Runde 25.10.2026, Bericht 16 (Haare von e^z und der Fixpunkt L).

fp.satz.kein_haar_bei_L:
  worum: |
    Die flüchtenden Punkte von $e^w$ liegen auf „Haaren“ (dynamischen Strahlen), die nach rechts ins Unendliche laufen. Kann ein Haar am Fixpunkt $L$ enden oder sich dort häufen?
  genau: |
    Nein — weder für $L$ noch für $\bar L$, und für keinen nichtreellen periodischen Punkt, dessen Bahn im Streifen $|\mathrm{Im}\,w|<\pi$ bleibt.
  warum: |
    Ein Haar, das die Geraden $\mathrm{Im}\,w=\pm\pi,\pm3\pi,\dots$ trifft, wird nach zwei Schritten reell, gehört dann also zur reellen Achse. Sonst bleibt jedes Bild des Haars in einem einzigen Streifen.
    Häuft es sich bei $L$, so häufen sich alle Bilder bei $L$, und $L$ liegt im mittleren Streifen — also wäre das Haar die reelle Achse. Die kommt aber nicht in die Nähe von $L$.
  bilder: []
  einordnung: |
    Folgerung für die Tetration: [[kn.kor.haar_urbilder_beschraenkt]]; Dynamik von $e^w$ allgemein: [[fp.satz.messbare_dynamik]], [[fp.satz.abstossend]].
