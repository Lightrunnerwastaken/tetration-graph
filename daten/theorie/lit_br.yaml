# Theorie-Blöcke für die Literatur-Aussagen der Brücken (Strang L3, Literaturkarte, 12.10.2026)

br.satz.halbexp_komplexitaet:
  worum: |
    Halbe Exponentialfunktionen — Funktionen, die zweimal hintereinander angewandt die Exponentialfunktion ergeben — tauchen nicht nur bei Kneser auf, sondern auch als
    Grenze dessen, was man über die Komplexität von Rechenproblemen beweisen kann.
  genau: |
    Für einige exponentielle Komplexitätsklassen gaben die bekannten Methoden ab 1999 nur halbexponentielle Untergrenzen für die Schaltkreisgrösse; 2023 wurden fast maximale
    Untergrenzen $2^n/n$ bewiesen.
  warum: |
    Das Argument von 1999 ist eine Fallunterscheidung: Entweder haben alle Sprachen einer Klasse kleine Schaltkreise — dann kollabiert eine Hierarchie bis zu einer Grösse $f$ —,
    oder nicht. Der Kollaps kostet eine Anwendung von $f$ zu viel; damit beide Fälle zusammenpassen, muss $f(f(n))$ unter $2^n$ bleiben. Das ist genau die Halbiterierte.
  beispiel: |
    Eine Funktion wie $2^{\sqrt n}$ ist zu gross: $2^{\sqrt{2^{\sqrt n}}}$ wächst schneller als $2^n$. Halbexponentielle Funktionen liegen zwischen allen
    Funktionen $2^{(\log n)^k}$ und allen $2^{n^\varepsilon}$.
  bilder: []
  einordnung: |
    Das Wachstum halber Exponentialfunktionen: [[kn.satz.halbe_exp_wachstum]]; in Hardy-Feldern: [[br.satz.boshernitzan]].
