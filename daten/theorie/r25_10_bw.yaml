# Theorie-Blöcke: Glattheit der Rang-5-Basiswechsel-Phase (Runde 25.10.2026, Bericht 10). Bezeichnungen H, U_n, P₄, Ĝ: bw.satz.phasengesetz_rang5, bw.satz.produktformel_rang5.

bw.lem.wackel:
  worum: |
    Wie misst man die Steigung des Rang-5-Konjugators $H$ auf einer bestimmten Skala? Das Lemma sagt, was der Differenzenquotient zwischen zwei Turm-Ebenen tut.
  genau: |
    Auf der Skala $h=s/U_n'$ ist $(H(y+h)-H(y))/h=\Pi_n(y)\,(1+W(U_n,s)+\varepsilon_n)$ mit $W(u,s)=(P_4(u+s)-P_4(u))/s$ und $\varepsilon_n=O(s/U_n)$.
  warum: |
    $H=\mathrm{slog}_b^{\circ n}\circ H\circ T_d^{\circ n}$ und $H(U)=U+\mu_4+P_4(U)+r(U)$; in der Koordinate $U_n$ ist ein Schritt der Länge $s$ also ein Schritt $s+\Delta P_4$, den die fast konstante Ableitung von $\mathrm{slog}_b^{\circ n}$ weiterreicht.
  beispiel: |
    $(e,2)$, $\theta=0.05$, Ebene 3: Wackel-Amplitude $8\cdot10^{-4}$, Rest nach der Vorhersage $1.3\cdot10^{-9}\approx0.7/U_3$.
  bilder: []
  einordnung: |
    Präzisiert [[bw.satz.produktformel_rang5]] und erklärt [[bw.beob.skalensprung]]; trägt [[bw.satz.hoelder_eins]] und [[bw.satz.kein_endlicher_ableitungswert]].

bw.satz.hoelder_eins:
  worum: |
    Ist die Rang-5-Welle im Hölder-Sinn rau (wie die Weierstrass-Funktion mit Exponent unter 1)?
  genau: |
    Nein: $H(y+h)-H(y)$ liegt zwischen $c\,h(1-\delta_-)^{n(h)}$ und $C\,h(1+\delta_+)^{n(h)}$ mit $n(h)=\mathrm{slog}(1/h)$, also überall Hölder-Exponent 1.
  warum: |
    Jede neu aufgelöste Ebene multipliziert die Steigung mit $1+P_4'\in[1-\delta_-,1+\delta_+]$, und auf der Skala $h$ sind nur $\mathrm{slog}(1/h)$ Ebenen aufgelöst.
  beispiel: |
    $(e,2)$: $\delta_\pm\approx9\cdot10^{-4}$; selbst bei $h=10^{-10^{100}}$ sind es nur etwa fünf Ebenen.
  bilder: []
  einordnung: |
    Folgt aus [[bw.lem.wackel]]; verträglich mit dem Modul aus [[bw.verm.rang5_nirgends_diffbar]]. Die Unglätte steckt in der Ableitung: [[bw.satz.rang5_singulaer]].

bw.satz.kein_endlicher_ableitungswert:
  worum: |
    Kann die Rang-5-Übersetzung irgendwo eine gewöhnliche Steigung haben?
  genau: |
    An keiner Stelle eine Ableitung in $(0,\infty)$: $H'(y)\in\{0,+\infty\}$ oder $H'(y)$ existiert nicht; jede der drei Mengen ist dicht.
  warum: |
    Hätte $H$ bei $y$ die Steigung $L>0$, müssten die Differenzenquotienten auf den Skalen $s/U_n'$ und $S/U_n'$ zusammenlaufen. Das Wackeln $W(U_n,s)$ ist aber auf jeder Ebene
    mindestens $c_0\ge\mathrm{Spannweite}(P_4)/4$ für ein $s\in[1,2]$, während $W(U_n,S)$ für grosses $S$ klein ist.
  beispiel: |
    $(e,2)$: $c_0=9.815\cdot10^{-5}$, Spannweite $2.873\cdot10^{-4}$.
  bilder: []
  einordnung: |
    Benutzt [[bw.lem.wackel]]; mit [[bw.kor.rang5_fast_ueberall_diffbar]] folgt [[bw.satz.rang5_singulaer]].

bw.kor.rang5_fast_ueberall_diffbar:
  worum: |
    Kann eine wachsende Funktion „nirgends differenzierbar“ sein?
  genau: |
    Nein: $\hat G=\lim(G(x+n)-n)$ ist monoton, also nach Lebesgue fast überall differenzierbar; damit auch $\Phi_5=\hat G-\mathrm{id}$.
  warum: |
    Die Weierstrass-Funktion ist eine Summe von Schwingungen mit beiden Vorzeichen. $\hat G$ entsteht dagegen multiplikativ aus positiven Faktoren und ist monoton —
    das additive Bild $\Phi_5'\approx\sum_jP_4'(U_j)$ übersieht das Glied $-\tfrac12P_4'^2$ in $\log(1+P_4')$, das nach etwa $1/\chi$ Ebenen überwiegt.
  beispiel: |
    Die Cantor-Funktion ist ebenfalls monoton, stetig und fast überall differenzierbar — mit Ableitung 0.
  bilder: []
  einordnung: |
    Widerlegt [[bw.verm.rang5_nirgends_diffbar]]; der Wert der Ableitung: [[bw.satz.rang5_singulaer]].

bw.satz.rang5_singulaer:
  worum: |
    Welche Art von Unglätte hat die Rang-5-Basiswechsel-Phase wirklich?
  genau: |
    $\hat G=\mathrm{id}+\Phi_5$ ist singulär: streng wachsend, $\hat G'=0$ fast überall, also $\Phi_5'=-1$ fast überall.
  warum: |
    Kurz: fast überall existiert die Ableitung (Lebesgue) und ist nie endlich positiv (Wackel-Argument), also 0. Quantitativ: unter dem Lebesgue-Mass sind die Ziffern $\{U_j\}$
    fast gleichverteilt, unter $dH$ nach $1+P_4'$ verteilt; die Hellinger-Affinität je Ebene ist $A<1$, und das Produkt über unendlich viele Ebenen geht gegen 0 (Kakutani).
  beispiel: |
    $(e,2)$: Hellinger-Abstand je Ebene $5.09\cdot10^{-8}$, Drift $\chi=2.04\cdot10^{-7}$.
  bilder: []
  einordnung: |
    Widerlegt [[bw.verm.rang5_nirgends_diffbar]]; Folgen: [[bw.kor.singulaer_mass]]; warum man es nicht sieht: [[bw.beob.singulaer_unsichtbar]]; Rang 4 zum Vergleich glatt: [[bw.satz.c1_produkt]].

bw.kor.singulaer_mass:
  worum: |
    Wo sitzt der Anstieg einer singulären Funktion?
  genau: |
    Auf einer Lebesgue-Nullmenge, auf der $H'=+\infty$ ist; das Mass $dH$ hat trotzdem überall die lokale Dimension 1.
  warum: |
    Allgemeine Masstheorie für den singulären Anteil (de la Vallée Poussin); die Dimension folgt aus den Hölder-Schranken mit $\mathrm{slog}(1/h)=o(\log(1/h))$.
  bilder: []
  einordnung: |
    Folgt aus [[bw.satz.rang5_singulaer]] und [[bw.satz.hoelder_eins]].

bw.beob.singulaer_unsichtbar:
  worum: |
    Warum hat die Runde 18 eine glatte Ableitung $\hat G'\approx1.0657$ gemessen, wenn $\hat G'=0$ fast überall ist?
  genau: |
    $\log\Pi_n$ ist eine Irrfahrt mit Drift $-\chi$, $\chi=-\int\log(1+P_4')\approx\mathrm{Var}(P_4')/2=2.04\cdot10^{-7}$ für $(e,2)$; die Drift wirkt erst nach $n^*\approx5\cdot10^6$ Ebenen.
  warum: |
    Jensen: $\int\log(1+P_4')<\log\int(1+P_4')=0$. Die Zahl ist winzig, weil $P_4'$ nur etwa $10^{-3}$ gross ist und quadratisch eingeht.
  beispiel: |
    $(e,2.7)$: $\chi=6.8\cdot10^{-11}$, $n^*=1.5\cdot10^{10}$ Ebenen.
  bilder: []
  einordnung: |
    Deutet [[bw.beob.skalensprung]] um; stützt [[bw.satz.rang5_singulaer]].

bw.verm.dichotomie_raenge:
  worum: |
    Gilt die Singularität auf allen höheren Rängen?
  genau: |
    Vermutet: glatt genau dann, wenn der Schälschritt eine konstante Phase hat (Rang 4), singulär für alle $r\ge5$.
  warum: |
    Die Singularität kommt aus der nicht gleichverteilten Ziffernverteilung des Schälschritts; ab Rang 6 ist der Schälschritt selbst singulär.
  bilder: []
  einordnung: |
    Rang 5: [[bw.satz.rang5_singulaer]]; Abschälen: [[bw.satz.abschaelen_rang]]; Rang 4: [[bw.satz.c1_produkt]].
