# Theorie-Blöcke zur Runde 18.10.2026, Bericht 03 (Basis-Ebene bei η).

fp.satz.horn_eta:
  worum: |
    Wie sieht der Rand des Shell–Thron-Gebiets genau an der Spitze $b=\eta$ aus?
  genau: |
    $b-\eta=\frac\eta e(\frac{t^2}2+\frac{it^3}6)+O(t^4)$ für $\lambda=e^{it}$; das Äussere ist ein Horn mit $|\mathrm{Im}\,b|\approx\frac{\sqrt2e^{1/2}}{3\sqrt\eta}(\mathrm{Re}\,b-\eta)^{3/2}$.
  warum: |
    Die Abbildung $\lambda\mapsto\exp(\lambda e^{-\lambda})$ hat bei $\lambda=1$ einen kritischen Punkt; der Einheitskreis wird dort zu einer Spitze gefaltet. Real- und Imaginärteil verhalten sich wie $t^2$ und $t^3$.
  beispiel: |
    Bei $\mathrm{Re}\,b-\eta=0.01$ ist das Horn nur $\pm6.5\cdot10^{-4}$ breit.
  bilder: []
  einordnung: |
    Folgt aus [[fp.satz.multiplikator_rezept]]; Gebiet: [[fp.satz.shell_thron]]; Bedeutung für die Basisabhängigkeit: [[kl.beob.kneser_fortsetzung_regulaer]].
