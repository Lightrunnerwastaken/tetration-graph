kn.beob.kneser_beschraenkte_summe:
  worum: |
    Welche der vielen möglichen Summen einer divergenten Reihe Knesers Tetration ist.
  genau: |
    Kneser minus Borel–Padé-Summe ist eine θ-Welle der Grösse $e^{-7.6/\varepsilon}$, die senkrecht wie $e^{2\pi|y|}$ wächst; Kneser selbst bleibt beschränkt.
  warum: |
    Zwei Summen derselben Reihe unterscheiden sich um eine periodische Welle; jede nichtkonstante solche Welle wächst in senkrechter Richtung exponentiell. Wer Beschränktheit verlangt, schliesst alle Wellen aus — das ist der Kern der Eindeutigkeit nach Paulsen–Cowgill.
  beispiel: |
    Bei $\varepsilon=0.36$ ist der Abstand $5\cdot10^{-10}$, bei $\varepsilon=1$ etwa $10^{-4}$.
  bilder: []
  einordnung: |
    Die Welle als Grenze: [[kn.beob.halbrang_theta_grenze]]; Eindeutigkeit: [[kn.satz.paulsen_cowgill]]; Ziel: [[kn.frage.halber_rang]].