# Theorie-Blöcke: Runde 18.10.2026, Agent 05 (forschung/runde_2026_10_18/05_kombinatorik/BERICHT.md).

it.satz.julia_variation_bernoulli:
  worum: |
    Wie ändert sich der Erzeuger (die Julia-Funktion) von $e^x-1$, wenn man die Abbildung um ein kleines $u$ verschiebt?
  genau: |
    $\partial_u\lambda_u|_{u=0}=\lambda_0\sum_kB_k^+(\lambda_0\,d/dx)^k(1/\lambda_0)/k!$.
  warum: |
    In der Fatou-Zeit wird die Variation zu $A(\tau+1)=\frac{e^D-1}{D}\Psi$; die Umkehrung von $(e^D-1)/D$ ist die erzeugende Funktion der Bernoulli-Zahlen.
  beispiel: |
    $\mu=1-x/2+x^2/6-x^3/18+\dots$
  bilder: []
  einordnung: |
    Erzeuger der Störungsreihe: [[kn.satz.stoerungsreihe_fluss]]; Julia-Gleichung: [[it.lem.julia]].

it.gescheitert.pentation_baeume:
  worum: |
    Zählt die nächste Rangstufe nach der Tetration „Bäume aus Bäumen“?
  genau: |
    Nein: $y\mapsto G(y;u)$ hat bei 0 den Multiplikator $u+\dots$, ist also hyperbolisch; es bleibt nur die Kettenformel $Z(st)=Z(s)\circ Z(t)$.
  warum: |
    Baum-Kombinatorik entsteht an parabolischen Punkten (Multiplikator 1); an einem anziehenden Punkt linearisiert Koenigs die Abbildung ohne neue Struktur.
  bilder: []
  einordnung: |
    Ausgangspunkt: [[kn.satz.stoerungsreihe_baeume]]; Linearisierung: [[it.satz.koenigs]].
