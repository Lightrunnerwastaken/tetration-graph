# Theorie-Blöcke: Runde 18.10.2026, Agent 05 (forschung/runde_2026_10_18/05_kombinatorik/BERICHT.md).

br.satz.produkt_iteration_ketten:
  worum: |
    Was zählt das ganzzahlige Dreieck der Iterierten von $xe^x$?
  genau: |
    $n![x^n](xe^x)^{\circ t}=\sum_jB'(n,j)\binom tj$, $B'(n,j)$ = Ketten der Länge $j$ punktierter Partitionen, die im einblockigen Maximum enden; $\mu(\hat0,M)=(-1)^{n-1}n^{n-2}$.
  warum: |
    $xe^x$ ist die Spezies „Menge mit einem Punkt“; ihre $t$-fache Komposition sind Multiketten punktierter Partitionen. Bei $t=-1$ gibt der Satz von Hall die Möbius-Zahl, und die Umkehrfunktion ist Lambert W.
  beispiel: |
    $n=4$: $4\binom t1+84\binom t2+144\binom t3$ (Diagonale $4!\cdot3!=144$).
  bilder: []
  einordnung: |
    Erklärt [[br.beob.produkt_iteration_dreieck]]; Gegenstück für $e^x-1$: [[it.satz.zeta_polynom_partitionen]].
