# Theorie-Blöcke: Runde 18.10.2026, Bericht 09 (Poincaré-Funktion von Polynomen).

it.satz.poincare_polynom_surjektiv:
  worum: |
    Die Poincaré-Funktion $\Psi$ an einem abstossenden Fixpunkt ($\Psi(\lambda u)=f(\Psi(u))$) ist ganz. Lässt sie Werte aus?
  genau: |
    Für $f=x^d+c$, $c\neq0$, nimmt $\Psi$ jeden Wert an. Bei $e^x$ fehlt dagegen der Wert 0.
  warum: |
    Ein ausgelassener Wert zieht alle seine Urbilder als ausgelassene Werte nach sich. Picard erlaubt höchstens einen; das geht nur, wenn jeder Schritt genau ein Urbild hat — bei $x^d+c$ nicht.
  beispiel: |
    $x^2+1$: der einzige Wert mit einem Urbild ist 1 (Urbild 0), aber 0 hat zwei Urbilder $\pm i$.
  bilder: []
  einordnung: |
    Zeigt, dass [[kn.satz.zoo_singulaerer_ort]] ohne ausgelassenen Wert auskommt; Grundlage: [[it.satz.koenigs]].
