# Theorie-Blöcke: Runde 25.10.2026, Bericht 07, Befund R7 (forschung/runde_2026_10_25/07_riemannflaeche_slog/BERICHT.md).

it.kor.poincare_exp_ableitung_produkt:
  worum: |
    Eine geschlossene Formel für die Ableitung der Umkehrung $\Psi$ der Schröder-Funktion von exp am Fixpunkt $L$.
  genau: |
    $\Psi'(\zeta)=\exp\sum_{k\ge1}(\Psi(\zeta L^{-k})-L)$; also $\Psi'\ne0$ überall, und $\Psi$ lässt 0 aus.
  warum: |
    Die Poincaré-Gleichung $\Psi(L\zeta)=e^{\Psi(\zeta)}$ abgeleitet und immer wieder in sich eingesetzt gibt ein unendliches Produkt von Faktoren $e^{\Psi(\zeta/L^k)-L}$, das wegen $|L|>1$ konvergiert.
  beispiel: |
    Bei $\zeta=0$ sind alle Summanden 0, also $\Psi'(0)=1$.
  bilder: []
  einordnung: |
    Zweiter Beweis von Teil (i) in [[kn.satz.theta_singularitaet]]; benutzt in [[it.satz.regulaerer_erzeuger_fortsetzung]].
