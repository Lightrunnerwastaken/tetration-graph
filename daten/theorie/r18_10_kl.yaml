# Theorie-Blöcke: Resonanzbasen unter η (Runde 18.10.2026, Bericht 10).

kl.satz.resonanzbasen:
  worum: |
    Für $1<b<\eta$ hat $b^x$ zwei reelle Fixpunkte $a<A$ und damit zwei reguläre Tetrationen. Sind sie verschieden?
  genau: |
    Ja, ausser höchstens an Resonanzbasen $b_k$ mit $\ln a\cdot(\ln A)^k=1$, $k\ge2$; $b_2=1.04480\ldots$, $b_3=1.00156\ldots$.
  warum: |
    Gleiche Iterationen hiessen ein gemeinsamer glatter Erzeuger an $a$ und $A$; das verlangt Resonanz. $m=\pm1$ scheidet aus, weil immer $\ln a\cdot\ln A<1$.
  beispiel: |
    $\sqrt2$: $\ln2\cdot\ln4=0.961<1$, keine Resonanz; die Differenz der beiden Iterationen ist $3.6\cdot10^{-25}$ — winzig, aber nicht null.
  bilder: []
  einordnung: |
    Folgt aus [[it.satz.erzeuger_resonanz]]; beweist [[kl.beob.zwei_abel]] fast überall; Lücke numerisch: [[kl.beob.resonanz_abweichung]].

kl.beob.resonanz_abweichung:
  worum: |
    Sind die beiden regulären Iterationen an den Resonanzbasen vielleicht doch gleich?
  genau: |
    Nein: erster Fourier-Koeffizient der Differenz $1.40\cdot10^{-4}$ bei $b_2$, $3.67\cdot10^{-3}$ bei $b_3$, glatt durch die Resonanz.
  warum: |
    Resonanz ist nur eine notwendige Bedingung für Gleichheit; die Rechnung zeigt, dass sie hier nicht hinreicht.
  bilder: []
  einordnung: |
    Ergänzt [[kl.satz.resonanzbasen]]; stützt [[kl.verm.streifenbreite]].
