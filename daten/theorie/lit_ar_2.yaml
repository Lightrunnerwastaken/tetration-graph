# Theorie-Block: exponentielle Fakultät über sexp (Forum tid 1828), 13.10.2026

ar.konstr.ef_sexp:
  worum: |
    Wie man $x!_2=x^{(x-1)!_2}$ zwischen den ganzen Zahlen festlegt, indem man sich weit draussen an der Tetration festhält — und was das für TPID 2 heisst.
  genau: |
    $D=\lim(\mathrm{slog}_e(n!_2)-n)=-1.0552140087$; $x!_2=\lim_k\log_{x+1}\cdots\log_{x+k}(\mathrm{sexp}_e(x+k+D))$; $\lim_{x\downarrow0}x!_2=0.573049\ldots$
  warum: |
    $n!_2$ ist ein Turm mit fallenden Basen $n,n-1,\dots,2$. Die oberen Basen ändern den Wert nur noch wenig — der Turm wächst bald wie ein Turm aus lauter
    gleichen Basen, also wie eine Tetration, um einen festen Betrag $D$ in der Höhe verschoben. Weit draussen ersetzt man den Turm durch
    $\mathrm{sexp}_e(x+k+D)$ und geht mit Logarithmen zu den Basen $x+k,\dots,x+1$ zurück; jeder Schritt macht den Fehler doppelt exponentiell kleiner.
    Bei $x\to0$ wird die letzte Basis $x+1$ zu 1 — der Logarithmus zu dieser Basis teilt durch $\ln(1+x)\approx x$, deshalb braucht man dort sehr
    lange Ketten (k = 7) und viele Stellen. Der Grenzwert $0.57305$ liegt nahe bei $\gamma$, ist aber stabil verschieden davon.
  beispiel: |
    $x=0.01$: $0.576448$; $x=0.001$: $0.573389$; $x=10^{-5}$: $0.573052$ (jeweils unabhängig von $k=6,7$ auf 12 Stellen).
  bilder: [exp.verwandte_funktionen]
  einordnung: |
    Die Vermutung dahinter: [[ar.frage.ef_fortsetzung]]; der Trick allgemein: [[br.satz.vergleichsfunktion]]; Arithmetik der Exponentialfakultät: [[ar.satz.ef_liouville]].
