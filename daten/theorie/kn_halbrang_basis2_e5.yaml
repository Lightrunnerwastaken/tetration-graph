kn.beob.halbrang_rangfortsetzung:
  worum: |
    Ein zweiter Weg zum halben Rang: statt um „plus 1“ zu entwickeln, die fertigen Rechenarten $H_3,\ldots,H_9$ zwischen den ganzen Rängen interpolieren.
  genau: |
    $H_{3.5}(2,0.5)\approx1.4428\pm3\cdot10^{-4}$ und $H_{3.5}(2,1.5)\approx2.7824\pm2\cdot10^{-4}$ aus beiden Wegen zusammen.
  warum: |
    An jeder festen Höhe ist $N\mapsto H_N(2,x)$ eine Zahlenfolge; eine Newtonreihe setzt sie auf $N=3.5$ fort. Weil jede Rechenart senkrecht beschränkt ist, ist es auch jede solche Mischung — die Beschränktheit kann darum keine Welle aussortieren.
  beispiel: |
    Bei $x=0.5$: Störungsrechnung $1.44302$, Rangfortsetzung $1.44246$.
  bilder: []
  einordnung: |
    Erster Weg: [[kn.beob.halbrang_basis2]]; Auswahlregel: [[kn.beob.kneser_beschraenkte_summe]]; offen: [[kn.frage.halber_rang]].