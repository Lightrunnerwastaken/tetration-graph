# Forschungsstränge: Untergruppen eines Gebiets mit einer Zeile, was dort passiert.
# Sichtbar auf der mittleren Zoomstufe der Karte („Verläufe“). Jede Aussage gehört höchstens einem Strang an.

# ---------------------------------------------------------------- Grundlagen (Einstieg)
- id: gr.werte
  gebiet: gr
  name: Werte und Grössen
  verlauf: Was a↑↑n ist, wie viele Stellen es hat, und warum x^x bei 1/e am kleinsten ist (dort steckt schon η).
  mitglieder: [gr.def.turm, gr.satz.stellen, gr.satz.selbstpotenz, gr.satz.gestalt, gr.satz.kehrwert_turmsumme, gr.satz.grenzfaelle]
- id: gr.ableitung
  gebiet: gr
  name: Ableitungen
  verlauf: Eine Kettenregel erzeugt alles — Produktformel über ganze Schritte, ein einziger freier Wert T′(0), Konvexität vererbt sich nach oben.
  mitglieder: [gr.satz.kettenregel, gr.kor.produktformel, gr.kor.ganze_stellen, gr.satz.vorzeichen, gr.satz.zweite_ableitung, gr.kor.konvex_nach_oben, gr.satz.abklingen]
- id: gr.kurve
  gebiet: gr
  name: Gestalt der Kurve
  verlauf: Kneser-Kurven haben genau einen Wendepunkt, reguläre unter η keinen; ungerade Ableitungen scheinen überall positiv, und T(y)·T(−y) < 1 hält bis zur Basis 10.22.
  mitglieder: [gr.beob.kneser_ableitung, gr.beob.wendepunkte, gr.verm.ein_wendepunkt, gr.verm.tpid7, gr.gegen.tpid7_kneser, gr.verm.ungerade_ableitungen]
- id: gr.integrale
  gebiet: gr
  name: Integrale
  verlauf: Fläche unter T plus Fläche neben slog ergibt ein Rechteck; daraus folgen viele gleichwertige Formen.
  mitglieder: [gr.satz.young, gr.kor.integral_formen, gr.satz.integral_unten, gr.satz.integral_produkt, gr.satz.integral_log, gr.beob.integrale_kneser, gr.frage.integral_form, gr.beob.integral_halb]
- id: gr.basis
  gebiet: gr
  name: Ableitung nach der Basis
  verlauf: Bei ganzer Höhe eine einfache Rekursion; am unendlichen Turm eine Quadratwurzel bei η — dieselbe wie im Randgesetz der Forschung.
  mitglieder: [gr.satz.basis_ganz, gr.satz.basis_gleichung, gr.satz.turm_pde, gr.beob.kneser_pde_wackeln, gr.satz.turm_ableitung, gr.satz.wurzel_eta]
- id: gr.turmintegrale
  gebiet: gr
  name: Turm-Integrale
  verlauf: Von ∫x^x (Bernoulli) zu ∫ⁿx — gerade und ungerade Höhen haben verschiedene Grenzwerte, die Lücke ist die Fläche zwischen den Ästen des 2-Zyklus.
  mitglieder: [gr.satz.sophomore, gr.satz.turmintegral_grenzen, gr.kor.turmintegral_formen, gr.verm.turmintegral_rate, gr.satz.turmintegral_periodisch]
- id: gr.slog
  gebiet: gr
  name: Superlogarithmus
  verlauf: slog zählt, wie oft man logarithmieren muss — stetig gemacht; seine Ableitung ist der Kehrwert von T′.
  mitglieder: [gr.satz.slog_grund, gr.satz.logstern, gr.satz.slog_ableitung, gr.satz.ln_aus_steigungen, gr.satz.slog_steigung_langsam]

- id: gr.umkehrungen
  gebiet: gr
  name: Umkehrungen — Superwurzeln
  verlauf: Welche Zahl hoch sich selbst gibt x? Lambert W antwortet geschlossen, für den Dreierturm zweimal W als Fixpunkt.
  mitglieder: [gr.satz.superwurzel, gr.satz.superwurzel_dritte]
- id: gr.identitaeten
  gebiet: gr
  name: Identitäten — was fest ist, was frei ist
  verlauf: Tauschregel, Taylor-Leiter und Stufenleiter gelten für jede Tetration; fest ist nur, was ganze Schritte verbindet — und slog zählt Exponentiale.
  mitglieder: [gr.satz.tauschregel, gr.satz.taylor_leiter, gr.satz.stufenleiter, gr.satz.frei_und_fest, gr.satz.exponentialitaet]

# ---------------------------------------------------------------- Funktionalgleichungen
- id: fg.begriffe
  gebiet: fg
  name: Gleichungen und Begriffe
  verlauf: Tetrations-, Abel- und Schröder-Gleichung; von Schröder führt der Logarithmus zu Abel.
  mitglieder: [fg.def.tetration, fg.def.abel, fg.def.schroeder, fg.def.iterationsgruppe, fg.satz.schroeder_abel]
- id: fg.freiheit
  gebiet: fg
  name: Nicht-Eindeutigkeit
  verlauf: Jede Lösung ist eine andere ∘ (id + periodisch); reell bleibt jeder Wert bei 1/2 möglich, erst komplexe Bedingungen wählen aus.
  mitglieder: [fg.satz.allgemeine_loesung, fg.kor.nichteindeutigkeit, fg.satz.kohomologisch, fg.lem.periodisch_liouville, fg.satz.tpid4]
- id: fg.rand
  gebiet: fg
  name: Rand der Gleichung
  verlauf: Ganzzahlige Werte sind erzwungen, bei −2 endet jede Lösung.
  mitglieder: [fg.lem.ganzzahlwerte, fg.kor.keine_ganze_tetration]

# ---------------------------------------------------------------- Lokale Iteration
- id: it.hyperbolisch
  gebiet: it
  name: Hyperbolische Fixpunkte
  verlauf: Koenigs linearisiert; die reguläre Iteration ist die einzige am Fixpunkt holomorphe.
  mitglieder: [it.satz.koenigs, it.satz.vertauschbar, it.lem.julia, it.satz.moebius_iteration, it.satz.elementare_superfunktionen]
- id: it.parabolisch
  gebiet: it
  name: Parabolische Fixpunkte
  verlauf: Fatou-Koordinaten existieren, aber formale Iterierte divergieren (Baker); Écalle–Voronin misst die Hindernisse.
  mitglieder: [it.satz.leau_fatou, it.satz.ecalle_voronin, it.satz.szekeres, it.satz.baker, it.satz.erdos_jabotinsky, it.satz.szekeres_monoton, it.satz.moebius_familie]

# ---------------------------------------------------------------- Fixpunkte
- id: fp.fixpunkte
  gebiet: fp
  name: Fixpunkte von b^z
  verlauf: Lambert W liefert alle Fixpunkte; die Schwelle η trennt anziehend, parabolisch und abstossend.
  mitglieder: [fp.def.eta, fp.satz.lambert, fp.satz.reelle_fixpunkte, fp.satz.abstossend, fp.satz.fixpunkt_summen]
- id: fp.turm
  gebiet: fp
  name: Unendlicher Turm
  verlauf: Konvergenz reell bis e^{1/e}, komplex im Shell–Thron-Gebiet; umgekehrt gibt y^{1/y} die Basis zum Grenzwert y; ⁿx = n zwingt x gegen η, mit Abstand 10.49/n² aus dem Engpass.
  mitglieder: [fp.satz.turm_reell, fp.satz.shell_thron, fp.verm.knospen, fp.satz.unendliche_superwurzel, fp.satz.tpid6, fp.beob.tpid6_rate, fp.satz.shell_thron_flaeche, fp.satz.turm_reihe_ln, fp.beob.i_turm, fp.satz.nachbar_turm, fp.frage.tpid12_13]
- id: fp.periode2
  gebiet: fp
  name: Unter der Eulerschen Schranke
  verlauf: Unter e^{−e} springt der Turm zwischen zwei Werten — die Region hat eine geschlossene Form, ist kein Kreis, an der Spitze gilt √6/e·n^{−1/2}, und die Phase wird zur Rechteckwelle.
  mitglieder: [fp.satz.p2_form, fp.satz.p2_kein_kreis, fp.satz.p2_raten, fp.satz.rechteckwelle]
- id: fp.parameterraum
  gebiet: fp
  name: Regionen der Basen-Ebene
  verlauf: Der Multiplikator ist die Koordinate; innen Ruhe, in den Knospen p/q drehen q-Zyklen, an rationalen Randpunkten parabolisch, an irrationalen Siegel-Scheiben.
  mitglieder: [fp.satz.multiplikator_rezept, fp.satz.parameter_konform, fp.satz.exp_normalform, fp.def.basenklassen, fp.beob.regionen, fp.verm.knospen_drehzahl, fp.satz.parabolisch_rand, fp.satz.neutral, fp.satz.gleiches_L, fp.beob.gleiches_L_kategorien, fp.beob.partner_keil, fp.beob.negative_achse]
- id: fp.spiralen_mittel
  gebiet: fp
  name: Spiralen und Mittelwerte
  verlauf: Türme spiralen mit λ; Kreismittel ganzer Höhen sind 1, für Höhe 1/2 nicht (Verzweigung w^t); Zeitmittel auf dem Siegel-Rand ist der Fixpunkt.
  mitglieder: [fp.satz.spirale, fp.satz.kreismittel, fp.kor.fourier_taylor, fp.verm.bruch_mittel, fp.gegen.bruch_mittel, fp.frage.holomorphe_familie, fp.verm.doppelmittel, fp.ann.siegel_rand, fp.satz.siegel_mittel]

# ---------------------------------------------------------------- Lösungsklassen
- id: kl.regulaer
  gebiet: kl
  name: Reguläre Tetration unter η
  verlauf: Koenigs am anziehenden Fixpunkt gibt die natürliche Lösung, am oberen eine ganze Superfunktion; Reshetnikovs q-Reihe rechnet sie aus den ganzen Werten zurück, und vermutlich ist ihre Ableitung vollständig monoton.
  mitglieder: [kl.satz.regulaer, kl.satz.vier_sqrt2, kl.satz.basis_unter_eins, kl.satz.obere_superexp, kl.beob.q_binomial, kl.verm.vollmonoton, kl.satz.folgen_vollmonoton, kl.satz.newton_reihe, kl.frage.tpid5, kl.satz.carlson]
- id: kl.zwei_abel
  gebiet: kl
  name: Zwei Fixpunkte, zwei Abel-Funktionen
  verlauf: Die Differenz ist periodisch und winzig; ihre Moden fallen wie k^{−5/4}·e^{−2π²k/|ln λ|} — neue, gemessene Vermutung.
  mitglieder: [kl.beob.zwei_abel, kl.verm.streifenbreite, kl.verm.faktor]
- id: kl.eta
  gebiet: kl
  name: Grenzfall η
  verlauf: Parabolische Tetration; exp_η ist an e konjugiert zu e^u − 1, also greift Bakers Satz; Stetigkeit in b offen.
  mitglieder: [kl.satz.parabolisch, kl.kor.eta_baker, kl.frage.stetig_eta, kl.satz.eta_koordinate, kl.satz.eta_digamma, kl.beob.eta_konstanten, kl.verm.lambert_zeta, kl.satz.moebius_qdigamma, kl.beob.stetig_eta, kl.frage.eta_analytisch, kl.satz.cheta]
- id: kl.bruch
  gebiet: kl
  name: Bruchschritte und Bruchsummen unter η
  verlauf: Weil der Turm gegen a läuft, wird ein halber Schritt dort eine Streckung um √λ; daraus Bruchsummen als Lambert-Reihen und eine Ableitungsformel, die nur die reguläre Lösung erfüllt.
  mitglieder: [kl.satz.grenzwertformel, kl.satz.bruchsumme, kl.satz.bruchprodukt, kl.satz.koenigs_spektral]
- id: kl.gleiches_L
  gebiet: kl
  name: Basiswechsel an Fixpunkten
  verlauf: Wertseitig ist der Basiswechsel eine Potenz, quasikonform eine Gitterabbildung; bei gemeinsamem Fixpunkt L wird der höhenseitige eine Gerade C₁ + C₂·x ohne Welle — mit verschiedenen L bleibt er stehen.
  mitglieder: [kl.satz.basiswechsel_gleiches_L, kl.satz.invariante_daempfung, kl.satz.wertseitiger_basiswechsel, kl.satz.qk_basiswechsel, kl.satz.koenigs_basiswechsel, kl.gescheitert.naiver_basiswechsel, kl.frage.basiswechsel_kneser, kl.frage.gleiches_L_kneser]

# ---------------------------------------------------------------- Kneser
- id: kn.konstruktion
  gebiet: kn
  name: Knesers Konstruktion
  verlauf: Regulär am komplexen Fixpunkt ist nicht reell; eine Riemann-Abbildung korrigiert das; hochpräzise Werte.
  mitglieder: [kn.gescheitert.regulaer_an_L, kn.konstr.kneser, kn.satz.kneser_eigenschaften, kn.satz.paulsen_komplex, kn.beob.referenzwerte, kn.konstr.cauchy]
- id: kn.eindeutigkeit
  gebiet: kn
  name: Eindeutigkeit
  verlauf: Vertikale Grenzwerte L, L̄ legen die Lösung fest (Paulsen–Cowgill, Trappmann–Kouznetsov).
  mitglieder: [kn.satz.paulsen_cowgill, kn.satz.trappmann_kouznetsov, kn.def.slog, kn.frage.beta_methode]
- id: kn.rand
  gebiet: kn
  name: Singularität bei −2
  verlauf: Jede Lösung verhält sich wie log_b(x+2); dafür reicht Differenzierbarkeit im Punkt −1.
  mitglieder: [kn.satz.singulaer_minus2, kn.kor.basisvergleich]
- id: kn.andere
  gebiet: kn
  name: Andere Konstruktionen
  verlauf: Linear, Walker, Hooshmand, Carleman — der Carleman-slog nähert Kneser nur algebraisch (≈ n^{−3.8}).
  mitglieder: [kn.konstr.linear, kn.satz.linear_glatt, kn.satz.hooshmand, kn.konstr.walker, kn.konstr.carleman, kn.verm.carleman_kneser, kn.beob.carleman_rate, kn.satz.abel_bruchsumme, kn.frage.abel_bruchsumme, kn.verm.carleman_eigenwerte, kn.konstr.zwei_sinh, kn.konstr.kontinuumssumme, kn.konstr.quadratisch, kn.satz.grenzwert_trick, kn.satz.intuitiver_log]
- id: kn.halbe_exp
  gebiet: kn
  name: Gebrochene Iterierte von exp
  verlauf: Knesers Ausgangsfrage f(f(x)) = eˣ, ihre Lösung über die Tetration, ihr Platz zwischen den Wachstumsklassen — und warum ein abgeschnittenes Polynom sie trifft.
  mitglieder: [kn.satz.halbe_exp, kn.satz.halbe_exp_wachstum, kn.verm.polynom_halbexp, kn.beob.slog_scheibe, kn.satz.halbexp_beschraenkt, kn.satz.polynom_halbexp_reduktion, kn.verm.polynom_halbexp_schranke, kn.satz.polynom_halbexp_endlich, kn.gescheitert.polynom_kantorovich, kn.satz.halbexp_singularitaet_L, kn.beob.polynom_halbexp_fehlergesetz, kn.beob.polynom_eckmode, kn.verm.polynom_halbexp_eckmoden, kn.satz.polynom_halbexp_hauptsatz, kn.satz.polynom_modelle, kn.beob.polynom_moebius_schwelle]
- id: kn.hoehere_stufen
  gebiet: kn
  name: Höhere Stufen — Pentation
  verlauf: Die Tetration hat bei −1.85 einen Fixpunkt; dort regulär iteriert entsteht die Pentation, eine Stufe höher die Hexation (bis η₅ regulär, darüber Kneser-artig — anders als Knesers Tetration in der oberen Halbebene verzweigt; Berührbasis η₆ = 1.7991). Über η und e liegen η₄, e₄ und η₅, e₅ — gehen sie gegen 2 und 4?
  mitglieder: [kn.konstr.pentation, kn.beob.pentation_werte, kn.beob.tetra_euler, kn.beob.stufe5, kn.verm.tpid10, kn.satz.hexation_struktur, kn.konstr.hexation_regulaer, kn.beob.unendliche_hexation, kn.satz.kein_kneser_anziehend, kn.beob.hexation_verzweigt, kn.satz.hexation_keine_halbebene, kn.satz.hexation_eindeutig_g0, kn.satz.hexation_gebiete, kn.satz.hexation_logpunkt, kn.verm.hexation_streifen, kn.frage.hexation_kneser, kn.beob.stufe6]

# ---------------------------------------------------------------- Basiswechsel
- id: bw.phasengesetz
  gebiet: bw
  name: Phasengesetz und Kanal
  verlauf: Von der Kanalannahme (Paper I) über die Stoppregel (III) zur unbedingten Fassung — diese ist erst skizziert.
  mitglieder: [bw.def.F_bd, bw.prop.gruppoid, bw.prop.ganzzahl, bw.ann.hyp22, bw.ann.hyp24, bw.lem.wachstumsluecke, bw.lem.stoppregel, bw.satz.schwanzkonvergenz, bw.satz.phasengesetz, bw.satz.phasengesetz_gestoppt, bw.lem.offset, bw.gegen.unverschoben, bw.beob.offset_zertifikat, bw.verm.adressen, bw.satz.imaginaere_richtung, bw.frage.halbiter_vergleich]
- id: bw.kreis
  gebiet: bw
  name: Kreisabbildung und Antisymmetrie
  verlauf: Phasen sind Kreishomöomorphismen (II); µ-Antisymmetrie braucht keine Glattheit — Spezialfall der Young-Identität.
  mitglieder: [bw.prop.kozykel, bw.prop.antisym_c1, bw.satz.homoeo, bw.satz.antisymmetrie, bw.satz.minimalregularitaet, bw.satz.c1_produkt]
- id: bw.moden
  gebiet: bw
  name: Moden und Singularitäten
  verlauf: Universeller Modenabfall gemessen; die „isolierte Singularität“ war ein Löserartefakt (Runde 20); Streifen oder Gevrey ist offen — im Tetration-Forum wird sogar „nirgends analytisch“ vermutet.
  mitglieder: [bw.satz.fourier_naht, bw.verm.streifen, bw.beob.modenabfall, bw.beob.singularitaet, bw.korr.r20, bw.verm.universell, bw.prop.saddle, bw.kor.modenzahl, bw.beob.positionsgesetz, bw.satz.ursache_kozykel, bw.beob.sigma_stern, bw.frage.streifen_gevrey, bw.verm.nirgends_analytisch]
- id: bw.antwort
  gebiet: bw
  name: Antwortkern und Hub
  verlauf: Erste Ordnung in der Basis statt Rang eins; eine Tabellenspalte m(b) trägt alle Mittel; Randgesetz bei η.
  mitglieder: [bw.verm.rang_eins, bw.beob.kernkleid, bw.ann.basis_diffbar, bw.satz.antwortkern, bw.prop.hub, bw.lem.randgesetz, bw.korr.konstante, bw.beob.hub_genauigkeit, bw.beob.m2]
- id: bw.rh
  gebiet: bw
  name: Basisableitung über Riemann–Hilbert
  verlauf: Auswahlprinzip, Eindeutigkeit, Existenz (Paper V) — nach drei gescheiterten Wegen.
  mitglieder: [bw.def.auswahlprinzip, bw.ann.K1K2, bw.satz.kern_eindeutig, bw.lem.geom_kozykel, bw.satz.kern_existenz, bw.gescheitert.orbitanker, bw.gescheitert.rh_v1, bw.gescheitert.vorhersage_r8, bw.gescheitert.cstep]
- id: bw.rekonstruktion
  gebiet: bw
  name: Rekonstruktion und Zertifikat
  verlauf: T_2 aus T_e allein (Paper VI), blind validiert; erstes Intervall-Segment zertifiziert, der ganze Marsch ist offen.
  mitglieder: [bw.satz.anker_rekonstruktion, bw.beob.blind, bw.zert.8r1_alt, bw.korr.tails, bw.zert.8r1, bw.frage.intervallmarsch]

# ---------------------------------------------------------------- Arithmetik
- id: ar.klassisch
  gebiet: ar
  name: Klassische Transzendenz
  verlauf: Hermite–Lindemann, Gelfond–Schneider, Schanuel; schon e^e ist offen.
  mitglieder: [ar.satz.hermite_lindemann, ar.satz.gelfond_schneider, ar.verm.schanuel, ar.frage.e_hoch_e, ar.satz.superwurzel_arith, ar.satz.rationale_tuerme, ar.frage.ganze_tuerme, ar.satz.ef_liouville, ar.frage.ef_fortsetzung]
- id: ar.gleichung
  gebiet: ar
  name: Was die Gleichung erzwingt
  verlauf: Von zwei Nachbarwerten ist einer transzendent; die reelle Gleichung allein trägt keine Arithmetik.
  mitglieder: [ar.satz.orbitschranke, ar.kor.benachbart, ar.satz.schanuel_orbit, ar.satz.algebraische_basen, ar.satz.keine_arith_info]
- id: ar.zaehlen
  gebiet: ar
  name: Zählen auf dem Graphen
  verlauf: Pila–Wilkie gibt H^ε, Massers Methode polylogarithmisch — Konstanten noch nicht ausgeführt.
  mitglieder: [ar.satz.bpw, ar.satz.pila, ar.lem.nullstellen, ar.satz.masser_typ]
- id: ar.ks
  gebiet: ar
  name: Kneser–Schanuel
  verlauf: Funktional trivial wahr, arithmetisch eine Vermutung; T_e(1/2) ist bis Nenner 10^983 nicht rational.
  mitglieder: [ar.satz.funktional_ks, ar.verm.ks, ar.beob.ausschluss]

# ---------------------------------------------------------------- Brücken
- id: br.logik
  gebiet: br
  name: Logik und Wachstum
  verlauf: Tetration sprengt ℝ_an,exp und die elementaren Funktionen; ob eine o-minimale Struktur sie fassen kann, ist offen.
  mitglieder: [br.satz.vdd_miller, br.satz.nicht_definierbar, br.satz.boshernitzan, br.frage.kneser_hardy, br.frage.transexp, br.satz.kalmar, br.def.hyperoperation, br.satz.ackermann, br.satz.ordinal_tetration, br.satz.hyperop_varianten]
- id: br.kreis
  gebiet: br
  name: Kreis und Fourier
  verlauf: Flächenidentität, konjugierte Funktionen, Gevrey-Kennzeichnung — Werkzeuge der Basiswechsel-Serie.
  mitglieder: [br.satz.young_kreis, br.gescheitert.rotationszahl, br.satz.privalov, br.satz.gevrey_fourier]
- id: br.engpass
  gebiet: br
  name: Engpass bei η
  verlauf: Sattel-Knoten-Durchgang erklärt das Randgesetz und die TPID-6-Rate; gestörte Fatou-Koordinaten (Lavaurs, Shishikura) könnten beides beweisen.
  mitglieder: [br.satz.sattel_knoten, br.frage.implosion, br.satz.shishikura]
- id: br.diskret
  gebiet: br
  name: Türme modulo m
  verlauf: Endziffern werden stabil; die Kongruenzgeschwindigkeit folgt p-adischen Bewertungen.
  mitglieder: [br.satz.turm_mod_m, br.satz.ripa]
- id: br.reell
  gebiet: br
  name: Reelle Kennzeichnung?
  verlauf: Gibt es ein Bohr–Mollerup für Tetration? Bisher wählen nur komplexe Bedingungen Kneser aus.
  mitglieder: [br.frage.bohr_mollerup]
