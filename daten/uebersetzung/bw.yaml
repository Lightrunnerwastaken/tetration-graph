- id: bw.beob.kernkleid
  quelle_hash: bf07254baee4
  theorie_hash: 3a0a51cf6e52
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: Is there a closed description of the $d$-dependence (kernel surface $C_k(d)$)?
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Engine; for d ∈ {2,10} the complex-step references are faulty (bw.gescheitert.cstep).
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      recherche: Paper I/IV.
      nutzen: Refutes the exact rank-one form.
      richtigkeit: numerical, doubly confirmed
    titel: Kernels carry a smooth d-dependence
    aussage: $|G_k(d)|/|G_1(d)|$ varies by 0.4 % ($k=2$) to 9 % ($k=8$) over $d\in\{2,e,3,5,10\}$; two independent routes (complex step, ε-stencils;
      for $d\in\{2,10\}$ the RH solver instead of the complex step) agree to 24+ digits.
    quellen:
    - stelle: Rem. 4.2
    - stelle: Rounds 3–5, 9
  en_theorie:
    einordnung: |
      Refutes [[bw.verm.rang_eins]]. Open: a closed description of the kernel surface $C_k(d)$.
    genau: |
      $|G_k(d)|/|G_1(d)|$ varies by $0.4\,\%$ ($k=2$) to $9\,\%$ ($k=8$) over $d\in\{2,e,3,5,10\}$; two independent routes (complex step, $\varepsilon$-stencils; for $d\in\{2,10\}$ the RH solver instead of the complex step) agree to 24+ digits.
    warum: |
      Measured, doubly confirmed. For $d\in\{2,10\}$ the references from the complex step were faulty ([[bw.gescheitert.cstep]]); the other routes agree nonetheless.
    worum: |
      The kernels $G_d$ — the shape of the wave to first order — look almost the same for different bases, but not quite: They carry a smooth, small dependence on $d$.
- id: bw.beob.m2
  quelle_hash: e20dd541c228
  theorie_hash: 1c4a18971a51
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: Extend the counterexample search to a closed form (constants of $L_e,L_2$, $\ln\lambda$).
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Engine values.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      recherche: 'The value has been known to four digits since 2009 (S. Levenstein on the tetration forum: 1.1282; likewise slog_3 − slog_e ≈
        −0.1926 and slog_10 − slog_e ≈ −1.1364, i.e., −m(3) and −m(10)). New here: 180 digits and the unsuccessful PSLQ search.'
      nutzen: Reference constant.
      richtigkeit: numerical
    titel: m(2) = µ_{e,2} to 180 digits, no closed form found
    aussage: $m(2)=-1.12840377662892400987921790203642626\ldots$; PSLQ against logarithm constants negative.
    versionen:
    - aenderung: Novelty changed to “known” (forum 2009, 4 digits).
    quellen:
    - stelle: Round 1
    - stelle: mu_hub.json, phi_modes.json
    - stelle: slog_2 − slog_e ≈ 1.1282 (2009)
  en_theorie:
    beispiel: |
      In words: $T_2(x)$ is for large $x$ approximately $T_e(x-1.1284)$ — the tower to base $2$ needs somewhat more than one additional level to reach the same value.
    einordnung: |
      To four digits the number has been known since 2009: S. Levenstein gave $\operatorname{slog}_2-\operatorname{slog}_e\approx1.1282$ on the tetration forum, likewise $\approx-0.1926$ for base $3$
      and $\approx-1.1364$ for base $10$ — the same values as our $-m(2)$, $-m(3)$, $-m(10)$. New here are 180 digits and the unsuccessful search for a
      closed form. Next step: extend the search to constants of $L_e$, $L_2$ and $\ln\lambda$.
    genau: |
      $m(2)=\mu_{e,2}=-1.12840377662892400987921790203642626\ldots$ (180 digits); a search for a closed form (PSLQ against logarithm constants) remained unsuccessful.
    warum: |
      Measured with the engine; independently confirmed by our own recomputation of the wave ([[bw.satz.phasengesetz]]).
    worum: |
      The most important number of the hub column: how far, on average, does the tower to base $2$ lag behind the one to base $e$? Just over one level.
- id: bw.beob.modenabfall
  quelle_hash: bed4d4941cbc
  theorie_hash: 306595f286ef
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: Decision run up to $k\approx5000$.
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Mode floor of the engine $\approx e^{-2.95\,n_{\lim}}$, usable $k\lesssim2.3n_{\lim}$.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      recherche: Paper IV.
      nutzen: Mode-count formulas for tables.
      richtigkeit: numerically robust over 14 pairs
    titel: Universal mode-decay curve
    aussage: $\sigma_{\mathrm{eff}}(k)\approx\sigma^*+1.090k^{-1/2}-1.512k^{-1}$ for all pairs with $b,d\in[1.5,10]$, $k\gtrsim5$; amplitude alone
      pair-dependent ($\pm2\,\%$). Basic model $\ln A_k=\ln C+\gamma\ln k-2\pi\sigma^*k-\sqrt{\pi c k}$.
    quellen:
    - stelle: Rem. 8.2
    - stelle: Obs. 5.1
  en_theorie:
    beispiel: |
      The normalized profiles $|a_k|/|a_1|$ of the pairs $(e,2)$ and $(e,3)$ differ for $k\le6$ in $\ln$ by at most $0.03$ ([[exp.moden]]).
    einordnung: |
      Supports [[bw.verm.streifen]]; the constant $\sigma^*$: [[bw.beob.sigma_stern]]. Same universality in the small: [[kl.verm.faktor]].
    genau: |
      $\sigma_{\mathrm{eff}}(k)\approx\sigma^*+1.090\,k^{-1/2}-1.512\,k^{-1}$ for all pairs with $b,d\in[1.5,10]$, $k\gtrsim5$; the amplitude is pair-dependent ($\pm2\,\%$).
      Basic model $\ln A_k=\ln C+\gamma\ln k-2\pi\sigma^*k-\sqrt{\pi ck}$.
    warum: |
      Measured over 14 pairs. Limit of the measurement: the engine has a mode floor at about $e^{-2.95\,n_{\lim}}$; usable is $k\lesssim2.3\,n_{\lim}$.
    worum: |
      If one measures the decay of the Fourier modes for many pairs of bases, one always sees the same curve — only the overall size depends on the pair.
- id: bw.beob.offset_zertifikat
  quelle_hash: 663fdecaf7bc
  theorie_hash: f644ad63b12d
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: Is there a general bound $\|P_{b,d}\|_\infty<\mathrm{frac}$ distance that proves the condition for all pairs?
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Mode amplitudes from the engine (fatou.gp fork).
      f1_folgt_unmittelbar: No (computation).
      f4_uebertragbar: For any new pair checkable a priori from the hub.
    bewertung:
      recherche: Paper III.
      nutzen: Remaining condition of the phase law per pair.
      richtigkeit: numerically certified
    titel: Offset condition certified for 45 pairs
    aussage: 'All 45 measured pairs satisfy $s+m_\star+1>0$ with a rigorous mode bound; narrowest margin $(e,1.46)$: 0.0563.'
    quellen:
    - stelle: Table 1
  en_theorie:
    beispiel: |
      $(10,2)$: margin $0.7346$; $(e,1.46)$: margin only $0.0563$, because $\mu$ lies just above an integer there.
    einordnung: |
      Remaining condition of [[bw.lem.offset]] per pair. Open: a general bound for $\|P\|_\infty$ that proves it for all pairs.
    genau: |
      All 45 pairs satisfy $s+m_\star+1>0$; the narrowest margin is $(e,1.46)$ with $0.0563$.
    warum: |
      Computation: $m_\star\ge\mu-\sum_k|a_k|$ with the mode amplitudes of the wave; the mode bound is rigorous, the amplitudes come from the engine.
    worum: |
      The offset condition must be checked for each pair of bases. For all 45 measured pairs it is satisfied — with a rigorous bound for the wave.
- id: bw.beob.positionsgesetz
  quelle_hash: 6439b6ddea96
  theorie_hash: f43280fbebe2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: Cause → bw.satz.ursache_kozykel
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: 500 modes of (e,2), phase fits.
      f1_folgt_unmittelbar: No; cocycle-compatible.
      f4_uebertragbar: All pairs via the hub.
    bewertung:
      recherche: Round 20.
      nutzen: Structural law instead of artifact.
      richtigkeit: numerical
    titel: Exact position law of the mode phases (Round 20)
    aussage: '$x_{\mathrm{eff}}(k)=u(k)+X_d$ with universal drift $u(k)$ and $X_d=X_e-\mu_{e,d}\pmod 1$ to within $5\cdot10^{-4}$: the singular
      structure sits at a universal point of the absolute height coordinate.'
    quellen:
    - stelle: Round 20 (2)
  en_theorie:
    einordnung: |
      Cause: [[bw.satz.ursache_kozykel]]. Replaces the singularity interpretation ([[bw.verm.universell]]).
    genau: |
      $x_{\mathrm{eff}}(k)=u(k)+X_d$ with universal drift $u(k)$ and $X_d=X_e-\mu_{e,d}\pmod1$, to within $5\cdot10^{-4}$ (Round 20).
    warum: |
      Measured on 500 modes of $(e,2)$ with phase fits. The shift by $-\mu_{e,d}$ is exactly what one expects if the structure is tied to a fixed height to
      base $e$ and is only converted into heights to base $d$ — compatible with the cocycle.
    worum: |
      Where does the singular structure of the wave really sit? The phases of the Fourier modes reveal it: at a fixed point of the absolute height scale, the same for all pairs.
- id: bw.beob.sigma_stern
  quelle_hash: 50d2994eeed0
  theorie_hash: 1ee0f92da6af
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: Is $\sigma^*_\infty>0$ at all? (Gevrey would mean 0.)
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Window extrapolation; mode floor from $k\approx510$.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      recherche: Rounds 3/19.
      nutzen: Decisive quantity.
      richtigkeit: numerical, model-dependent
    titel: Strip height σ* measured
    aussage: '$\sigma^*=0.058\pm0.006$ (n_lim 240, window extrapolation $\sigma^*(w)=\sigma^*_\infty+2.83/w$); normal-form fit [200,500]: 0.0709,
      extrapolated 0.058–0.062.'
    quellen:
    - stelle: Rounds 3, 19
  en_theorie:
    einordnung: |
      The decisive quantity for [[bw.frage.streifen_gevrey]]: Gevrey would mean $\sigma^*_\infty=0$. Supports [[bw.verm.streifen]] only if $\sigma^*_\infty>0$ persists.
    genau: |
      $\sigma^*=0.058\pm0.006$ (window extrapolation $\sigma^*(w)=\sigma^*_\infty+2.83/w$ with $n_{\lim}=240$); normal-form fit on $[200,500]$: $0.0709$, extrapolated $0.058$–$0.062$.
    warum: |
      Measured and model-dependent: from $k\approx510$ on one reaches the mode floor of the engine; the extrapolation in the window width $w$ determines the result.
    worum: |
      The height of the conjectured analyticity strip is a single number $\sigma^*$. Measured, it is small and still uncertain.
- id: bw.beob.singularitaet
  quelle_hash: 84da972454dc
  theorie_hash: 63473bd70cf0
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: See correction bw.korr.r20.
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: yscan solver with fixed topmost closing level.
      f1_folgt_unmittelbar: —
      f4_uebertragbar: —
    bewertung:
      nutzen: 'Object lesson: solver breakdown ≠ singularity.'
      richtigkeit: refuted (solver artifact)
    titel: Isolated essential singularity at z* (Paper IV, Obs. 6.1/6.2)
    aussage: The solver breaks down in a slanted sector per period, tip $z^*\approx x^*(b,d)+0.055i$; height pair-universal.
    quellen:
    - stelle: Obs. 6.1, 6.2
  en_theorie:
    einordnung: |
      Object lesson: the breakdown of a solver is not a singularity. Replaced by [[bw.beob.positionsgesetz]] and [[bw.satz.ursache_kozykel]].
    genau: |
      **Refuted.** Observed: breakdown of the solver in a slanted sector per period, tip at $z^*\approx x^*(b,d)+0.055i$, height the same for all pairs (Paper IV, Obs. 6.1/6.2).
    warum: |
      The tip lies exactly where the topmost level of the solver can no longer take its logarithm cleanly ([[bw.korr.r20]]). An exact
      computation runs smoothly through the zone.
    worum: |
      An observation that turned out to be an illusion: the solver for the complex continuation of the phase broke down in a slanted sector,
      and that looked like a genuine singularity.
