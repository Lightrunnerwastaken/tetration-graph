  en_theorie:
    einordnung: |
      Once this is written out, Papers I–II would be largely unconditional. [[bw.lem.offset]] builds on it.
    genau: |
      **Sketch.** For all $b,d>\eta$ with Kneser branches the phase law holds without Hyp. 2.2/2.4 if one uses the stopped tails $D_n^{\mathrm{stop}}$.
    warum: |
      Ingredients: stopping rule ([[bw.lem.stoppregel]]) and growth gap ([[bw.lem.wachstumsluecke]]) replace the assumptions; (R3) follows from the real
      analyticity of Kneser's super-logarithm. Open gaps: write out Lemmas 5.2–5.4 from Paper I for $j\ge J_0$ (1–2 pages); make (R3) explicit.
    worum: |
      The phase law should hold without the assumptions from Paper I if one stops the logarithm chain in time. Paper III says: The old
      estimates continue to hold verbatim. This has not yet been written out.
- id: bw.satz.schwanzkonvergenz
  quelle_hash: 70350cee5fb6
  theorie_hash: 660000eb76b0
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Damping products (Lemmas 5.2–5.4) summable ⇒ Cauchy in sup norm.
    pruefung:
      f5_neue_frage: Unconditional version → bw.satz.phasengesetz_gestoppt
      f3_spezialfall: Contraction argument for iterated logarithms (cf. convergence of $\log^{\circ n}$ on towers).
      f2_benutzte_voraussetzungen: (R2) only in the index range $j\ge J_0$ — secured there by the stopping rule.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: Every pair of increasing tetrations with $b,d>\eta$, provided $A_b$ is locally Lipschitz.
    bewertung:
      recherche: Paper I introduction.
      nutzen: Basis of the phase law.
      richtigkeit: conditionally proved
    voraussetzungen:
    - text: Hyp. 2.2
    - text: Hyp. 2.4
    titel: Convergence of the logarithmic tails (Paper I, Thm. 5.6)
    aussage: $D_n\to D_{b,d}$ uniformly on $[0,1]$.
    quellen:
    - stelle: Thm. 5.6
  en_theorie:
    beispiel: |
      $(e,2)$: The largest distance of $A_e(D_n(\theta))-\theta$ from the limit is $1.13$, $0.83$, $0.45$, $0.15$, $0.014$, $3\cdot10^{-7}$, $4\cdot10^{-24}$ for $n=0,\dots,6$.
      The jump between $n=5$ and $n=6$ is the factor $1/T_2(4)=1/65536$ — and then once more divided by the next level.
    einordnung: |
      From this the phase law follows ([[bw.satz.phasengesetz]]). The assumptions drop out in the stopped version ([[bw.satz.phasengesetz_gestoppt]]).
    genau: |
      Under Hyp. 2.2 and 2.4, $D_n\to D_{b,d}$ uniformly on $[0,1]$ (Paper I, Thm. 5.6).
    warum: |
      1. $D_{n+1}(\theta)=\log_b^{\circ n}\bigl(\alpha\,T_d(n+\theta)\bigr)$ and $D_n(\theta)=\log_b^{\circ n}\bigl(T_d(n+\theta)\bigr)$: both start at the top with almost the same number (factor $\alpha$).
      2. The first logarithm turns the factor into a summand $\log_b\alpha$. Each further logarithm divides a small difference by ($\ln b\cdot$ value) — these are the damping products.
      3. The products are summable because the tower values are huge; so $(D_n)$ is a Cauchy sequence in the supremum norm.
    worum: |
      The peeled tails $D_n(\theta)$ come to rest. The reason: A difference at the very top of the tower is divided by every logarithm —
      by the huge tower value there. After a few levels it is invisible.
- id: bw.satz.ursache_kozykel
  quelle_hash: 3439f242aaa9
  theorie_hash: 25954a85391d
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Period comparison of the two Koenigs coordinates; uniqueness by Paulsen–Cowgill.
      luecken:
      - Derivation is in the research log, not written out as a proof.
      - Connection with the measured position (position law) only numerical.
    pruefung:
      f5_neue_frage: Do the singularities lie close to the boundary (Gevrey) or at a fixed distance (strip)?
      f3_spezialfall: 'General principle: two Abel coordinates with different complex periods cannot be globally holomorphically conjugate.'
      f2_benutzte_voraussetzungen: Continuability of the Koenigs coordinates; periods exact.
      f1_folgt_unmittelbar: The part “$T_b\circ\tilde H$ is not Kneser” follows immediately from fg.satz.allgemeine_loesung + uniqueness, as soon
        as $P\not\equiv0$.
      f4_uebertragbar: Model case kl.verm.streifenbreite (there real periods, same mechanics).
    bewertung:
      recherche: Round 20.
      nutzen: Explains why Φ must be singular.
      richtigkeit: Sketch, plausible
    titel: Cause of the singularities — period mismatch in the Koenigs conjugator
    aussage: |
      With $P_a=2\pi i/\ln\lambda_a$ the conjugator $\kappa=K-\mathrm{id}$ of the Koenigs coordinates satisfies
      $\kappa(\xi+P_d)-\kappa(\xi)=P_b-P_d$; hence it is singular in every cell, with residue sum
      $1/\ln\lambda_d-1/\ln\lambda_b$. Equivalently: $D=T_b\circ\tilde H$ is a **non-Kneser** base-$b$ tetration
      (otherwise contradiction to uniqueness).
    quellen:
    - stelle: Round 20 (4)
  en_theorie:
    einordnung: |
      Same mechanics with real periods: [[kl.verm.streifenbreite]]. Open remains whether the singularities lie at a fixed distance (strip) or approach the axis
      (Gevrey): [[bw.frage.streifen_gevrey]].
    genau: |
      **Sketch.** With $P_a=2\pi i/\ln\lambda_a$ the conjugator $\kappa=K-\mathrm{id}$ of the Koenigs coordinates satisfies $\kappa(\xi+P_d)-\kappa(\xi)=P_b-P_d$. Hence it is
      singular in every cell, with residue sum $1/\ln\lambda_d-1/\ln\lambda_b$. Equivalently: $D=T_b\circ\tilde H$ is a **non-Kneser** tetration to base $b$.
    warum: |
      1. $D(\theta+1)=b^{D(\theta)}$ follows directly from the definition of the tails. Hence $D$ is a superfunction of $b^x$, and $D=T_b\circ(\mathrm{id}+\Phi)$.
      2. If $D$ were the Kneser solution, $\Phi$ would be constant ([[kn.satz.paulsen_cowgill]]). If $P\ne0$, $D$ is a different tetration — its deviation must show up in the complex domain as a
         singularity, otherwise it would have Kneser's vertical behavior.
      3. Period comparison: a holomorphic map compatible with the translations would have to send $P_d$ to $P_b$; the difference $P_b-P_d$ forces poles.
      Gaps: derived in the research log, not written out as a proof; the connection with the measured location is only numerical.
    worum: |
      Why must the wave have singularities at all? Because the two Koenigs coordinates at $L_b$ and $L_d$ have different complex periods.
      A map that translates one lattice into the other cannot be smooth everywhere.
- id: bw.verm.adressen
  quelle_hash: e4b9fdeb621d
  theorie_hash: 194ee1a3ff34
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: |
      Attempt 08.10.2026 (experimente/e26_adressen.py, stopped chain with Kneser/Paulsen values for complex bases): the real control
      b = 3, d = 2 agrees (μ = −1.3208260715, phase 1-periodic, independent of the stopping threshold to 10⁻¹⁶). For complex pairs
      (4 + 0.5i with 3 + 0.3i) the engine returns no values at the necessary points within 25 minutes — undecided. Side finding:
      most complex bases near the real axis do not escape at all (excursion and relapse, cf. fp.beob.negative_achse).
    pruefung:
      f5_neue_frage: 'First test pair: two complex bases with constant address $m\ne0$.'
      f3_spezialfall: Generalizes bw.satz.phasengesetz.
      f2_benutzte_voraussetzungen: —
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      nutzen: Would extend the phase law to complex bases.
      richtigkeit: open
    titel: Complex escaping bases — phase depends on the address
    aussage: |
      For complex bases whose orbit escapes, each logarithm step selects a strip $m_j$ (address $\mathbf s$). For bases with
      compatible addresses the stopped tails converge to a cocycle $\Phi_{b,d}(\theta,\mathbf s)$ over phase circle and
      address shift; eventually $q$-periodic addresses give a $q$-periodic height phase. The real case (address $0,0,\dots$)
      is the phase law.
    quellen:
    - stelle: §20.2, Conjecture I
  en_theorie:
    beispiel: |
      Attempt of 08.10.2026: the real control $(3,2)$ agrees ($\mu=-1.3208260715$, independent of the stopping threshold to $10^{-16}$). For the complex pair
      $4+0.5i$ with $3+0.3i$ the engine returned no values within 25 minutes — undecided. Incidentally: most complex bases near the real
      axis do not escape at all.
    einordnung: |
      Generalizes [[bw.satz.phasengesetz]]; needs a reliable engine for complex bases ([[kn.satz.paulsen_komplex]]).
    genau: |
      **Conjecture.** For complex bases whose orbit escapes, and compatible addresses $\mathbf s$, the stopped tails converge to a cocycle
      $\Phi_{b,d}(\theta,\mathbf s)$ over phase circle and address shift. Eventually $q$-periodic addresses give a $q$-periodic height phase. The real case
      (address $0,0,\dots$) is the phase law.
    warum: |
      Heuristic: the mechanism of tail convergence (damping by huge values) needs no reality, only escape to $\infty$. New is only that
      each logarithm may add $+2\pi im_j/\ln b$.
    worum: |
      For complex bases each logarithm must choose a branch — a strip $m_j$ of the complex plane. The sequence of these choices is an
      “address”. The conjecture: the phase law holds here too, only the wave additionally depends on the address.
- id: bw.verm.nirgends_analytisch
  quelle_hash: aca8af84a885
  theorie_hash: 1691edda59a5
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: |
      Forum (Levenstein 2011): The approximations after $n$ logarithm levels have singularities whose distance to the real axis goes to $0$ with $n$
      (nearest at radius $0.46$, after one further level $0.035$); Trappmann (2009) proves for $\log_a^{\circ n}\circ\exp_b^{\circ n}$ branch points at
      $\log_b^{\circ n}\{a,\dots,\exp_a^{\circ n-2}(1)\}$. Our own data: $\sigma_{\mathrm{eff}}(k)$ keeps decreasing up to $k\approx520$, Gevrey and strip model fit equally well
      (bw.frage.streifen_gevrey); the tower analysis from Round 20 speaks rather for Gevrey. Not decided.
    pruefung:
      f5_neue_frage: 'A proof would refute bw.verm.streifen and pin down the mode numbers (bw.kor.modenzahl) to the Gevrey rate. Approach: make
        the accumulation of the branch points at the real axis quantitative.'
      f3_spezialfall: Counterpart to Walker's limit dexp^−n ∘ exp^n (kn.konstr.walker), for which also only C^∞ is proved.
      f2_benutzte_voraussetzungen: —
      f1_folgt_unmittelbar: No. That the limit function is C^∞ is proved for Walker's variant; showing that it is analytic at no point is open.
      f4_uebertragbar: To all limits of iterated logarithms of a foreign superfunction (cheta base change, 2sinh method).
    bewertung:
      recherche: Conjecture of S. Levenstein in the Tetration Forum (2011, 2014) and on math.stackexchange; according to the forum unsolved.
      nutzen: Decides the strip question in the direction of Gevrey.
      richtigkeit: open (conjecture)
    titel: Base-change tetrations are nowhere analytic (forum conjecture)
    aussage: |
      The tetration obtained by base change, $D_{b,d}=T_b\circ(\mathrm{id}+\Phi_{b,d})$, is infinitely differentiable on the real axis,
      but **nowhere analytic**. Equivalently: the phase $\Phi_{b,d}$ is nowhere analytic — in particular holomorphic in no strip,
      so $\sigma^*=0$ in the mode decay.
    bereich: $b\ne d>\eta$, Kneser tetration $T_d$; $D_{b,d}(\theta)=\lim_n\log_b^{\circ n}T_d(n+\theta)$
    einfach: If you translate one smooth tetration into another base, the result is presumably infinitely smooth, but nowhere representable by
      a power series.
    quellen:
    - stelle: tid 578 (2011), tid 825 (2014)
    - stelle: Proposition on the branch points
    - stelle: Round 20 (tower analysis)
    - stelle: 'Levenstein 2014: derivatives grow too fast for analyticity; base change in the complex domain not defined'
  en_theorie:
    beispiel: |
      In the mode decay, “nowhere analytic” would be compatible with the Gevrey picture $\ln|a_k|\approx-c\sqrt k$. Our data up to $k\approx520$ do not distinguish strip and
      Gevrey; the tower analysis from Round 20 speaks rather for Gevrey.
    einordnung: |
      Contradicts [[bw.verm.streifen]]; decides [[bw.frage.streifen_gevrey]] if it is proved. Walker's $C^\infty$ solution has the same type of construction
      ([[kn.konstr.walker]]). That $D$ is in any case not a Kneser tetration is shown by [[bw.satz.ursache_kozykel]].
    genau: |
      **Conjecture** (S. Levenstein, Tetration Forum 2011). The base-change tetration $D_{b,d}=\lim_n\log_b^{\circ n}T_d(n+\theta)=T_b\circ(\mathrm{id}+\Phi_{b,d})$ is $C^\infty$ on the
      real axis, but nowhere analytic. Equivalently: the phase $\Phi_{b,d}$ is nowhere analytic, in particular holomorphic in no strip ($\sigma^*=0$).
    warum: |
      1. Equivalence: $T_b$ is analytic and locally invertible; so $D$ is analytic at a point if and only if $\Phi$ is.
      2. The $n$-th approximation $\log_b^{\circ n}\circ T_d(n+\cdot)$ becomes singular where a logarithm hits $0$; Trappmann (2009) shows for $\log_a^{\circ n}\circ\exp_b^{\circ n}$
         branch points at $\log_b^{\circ n}\{a,\dots,\exp_a^{\circ n-2}(1)\}$.
      3. Levenstein measures that the distance of the nearest singularity to the real axis tends to $0$ with $n$ (radius $0.46$, after one further level $0.035$),
         while the values on the axis converge superexponentially fast. Uniform convergence of all derivatives on the axis ensures $C^\infty$, but not analyticity.
      A proof is missing; it may be that the singularities cancel in the limit.
    worum: |
      The counter-position to the strip conjecture: If one translates a smooth tetration into another base, the result is infinitely often differentiable,
      but at no single point representable by a power series. The singularities of the approximations move closer to the real axis with every logarithm level.
- id: bw.verm.rang_eins
  quelle_hash: e32fc365f3d0
  theorie_hash: 09d991e97934
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'Kernels $G_d$ for $d\in\{2,e,3,5,10\}$ to 25–30 digits: normalized mode ratios $|G_k|/|G_1|$ vary smoothly with $d$ (0.4
      % at k=2 to 9 % at k=8).'
    pruefung:
      f5_neue_frage: 'Exact replacement: bw.satz.antwortkern'
      f3_spezialfall: Leading order of the perturbation expansion in $\varepsilon=\ln\ln d-\ln\ln b$.
      f2_benutzte_voraussetzungen: —
      f1_folgt_unmittelbar: —
      f4_uebertragbar: —
    bewertung:
      recherche: Paper I.
      nutzen: Motivated the perturbation theory.
      richtigkeit: refuted as an exact statement; correct as leading order
    titel: Rank-one law of the inner base (Paper I, Conjecture 4.1)
    aussage: 'For fixed inner base $d$, $\{P_{b,d}\}_b$ is (approximately) of rank one in $L^2(S^1)$: the shape depends only on $d$.'
    quellen:
    - stelle: Conjecture 4.1, Rem. 4.2
  en_theorie:
    beispiel: |
      The normalized mode ratios $|G_k|/|G_1|$ change over $d\in\{2,e,3,5,10\}$ by $0.4\,\%$ ($k=2$) to $9\,\%$ ($k=8$).
    einordnung: |
      Prompted the perturbation theory; exact replacement: [[bw.satz.antwortkern]].
    genau: |
      **Refuted** (as an exact statement). The conjecture was: For fixed $d$, $\{P_{b,d}\}_b$ is of rank one in $L^2(S^1)$, the shape depends only on $d$ (Paper I, 4.1).
    warum: |
      To first order it is correct: $\Phi_{b,d}\approx\varepsilon\,G_d$ ([[bw.satz.antwortkern]]). But the kernels $G_c$ change their shape with $c$ ([[bw.beob.kernkleid]]), and
      a wave between widely separated bases collects the kernels of all bases in between — its shape drifts along.
    worum: |
      An early hope: that for a fixed inner base $d$ the wave $P_{b,d}$ would always have the same shape, regardless of $b$ — only its size would change.
- id: bw.verm.streifen
  quelle_hash: ea78392edd76
  theorie_hash: 3bea313f3fd2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: |
      Mode measurement up to $k\approx520$: local rates $\sigma_{\mathrm{eff}}(k)$ keep decreasing (universal curve).
      Round 20: strip and Gevrey model fit equally well; not decidable from $k\le500$ — neither confirmed nor refuted.
    pruefung:
      f5_neue_frage: bw.frage.streifen_gevrey
      f3_spezialfall: Fourier characterization of analytic functions (br.satz.gevrey_fourier).
      f2_benutzte_voraussetzungen: —
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: 'Model case with explicit objects: kl.verm.streifenbreite.'
    bewertung:
      recherche: 'Paper I. Addendum 08.10.2026: S. Levenstein has conjectured since 2011 for base-change tetrations “C^∞, but nowhere analytic”;
        that would exclude every strip.'
      nutzen: Would guarantee fast convergence of the mode tables.
      richtigkeit: open and disputed — the opposite is conjectured in the Tetration Forum (bw.verm.nirgends_analytisch)
    titel: Strip analyticity of the phase (Paper I, Conjecture 8.1)
    aussage: $D_{b,d}$ continues holomorphically in $|\operatorname{Im}\theta|<\sigma_{b,d}$; $|\hat P_{b,d}(k)|\le C e^{-2\pi\sigma|k|}$.
    versionen:
    - aenderung: 'Marked as disputed: counter-conjecture from the tetration forum (2011).'
    quellen:
    - stelle: Conjecture 8.1, Rem. 8.2
    - stelle: Round 20
  en_theorie:
    beispiel: |
      $(e,2)$: $|a_1|=1.44\cdot10^{-4}$, $|a_{20}|=1.7\cdot10^{-23}$ — nineteen orders of magnitude over twenty modes.
    einordnung: |
      **Disputed.** In the Tetration Forum the opposite has been conjectured since 2011: that base-change tetrations are nowhere analytic ([[bw.verm.nirgends_analytisch]]).
      Then there would be no strip, and $\sigma^*$ would be $0$. Model case with known strip: [[kl.verm.streifenbreite]]. Where the singularities come from:
      [[bw.satz.ursache_kozykel]].
    genau: |
      **Conjecture** (Paper I, 8.1). $D_{b,d}$ continues holomorphically in $|\operatorname{Im}\theta|<\sigma_{b,d}$, and $|\hat P_{b,d}(k)|\le Ce^{-2\pi\sigma|k|}$.
    warum: |
      Supported and open at the same time: Up to $k\approx520$ the modes decay fast, but the local rate $\sigma_{\mathrm{eff}}(k)$ still keeps falling. A strip model and a
      Gevrey model (without fixed strip) fit equally well ([[bw.frage.streifen_gevrey]]).
    worum: |
      The wave $P$ is smooth. Is it even analytic, in a strip of fixed width around the real axis? Then its Fourier modes would
      decay exponentially.
