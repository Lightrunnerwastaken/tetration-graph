    - stelle: Conjecture 6.6
  en_theorie:
    einordnung: |
      Historical; successors [[bw.beob.positionsgesetz]], [[bw.frage.streifen_gevrey]].
    genau: |
      **Superseded.** $\Phi_{b,d}$ is supposed to be holomorphic in the punctured strip with an isolated essential singularity at $x^*(b,d)+i\sigma^*$, $\sigma^*$ pair-independent (Paper IV, 6.6).
    warum: |
      Its support ([[bw.beob.singularitaet]]) is a solver artifact ([[bw.korr.r20]]). What remains are the position law and the open question strip or Gevrey.
    worum: |
      The conjecture that arose from the false observation: a single essential singularity per period, at a fixed height for all pairs.
