    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Three lines via $A_d'(d^y)d^y\ln d=A_d'(y)$.
    pruefung:
      f5_neue_frage: Boundary data $u=\operatorname{Im}V_{\mathrm{geo}}\circ T_d$ → RH problem.
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Koenigs data differentiable in β (Lemma 6).
      f1_folgt_unmittelbar: Yes, computation.
      f4_uebertragbar: Every family $\exp_b$ with a Koenigs coordinate.
    bewertung:
      recherche: Paper V.
      nutzen: Key to existence.
      richtigkeit: complete
    titel: Exact cocycle of the geometric field (Paper V, Lemma 7)
    aussage: $G:=\partial_\beta\chi/\chi'$ satisfies $G(d^y)=(\ln d)\,d^y\,(G(y)-y)$; hence $A_d'G+h\circ A_d$ solves the cohomological equation
      for every periodic $h$.
    quellen:
    - stelle: Lemma 7
  en_theorie:
    einordnung: |
      Supplies the boundary data $u=\operatorname{Im}V_{\mathrm{geo}}\circ T_d$ for the boundary value problem in [[bw.satz.kern_existenz]].
    genau: |
      $G:=\partial_\beta\chi/\chi'$ satisfies $G(d^y)=(\ln d)\,d^y\,(G(y)-y)$; hence $A_d'G+h\circ A_d$ solves the cohomological equation for every periodic $h$ (Paper V, Lemma 7).
    warum: |
      Differentiate $\chi(d^y)=\chi(y)+1$ with respect to $\beta$: $(\partial_\beta\chi)(d^y)+\chi'(d^y)\,d^y\ln d\cdot y=\partial_\beta\chi(y)$. Divide by $\chi'(d^y)$ and use $\chi'(d^y)\,d^y\ln d=\chi'(y)$ — done.
    worum: |
      An auxiliary field from the Koenigs coordinate almost solves the equation of the base kernel — up to a periodic piece. This is the key to existence.
- id: bw.lem.offset
  quelle_hash: c4f0154a3368
  theorie_hash: 7c3907bb08bd
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Monotonicity of $T_b$ on $(-1,\infty)$ and shift equivariance.
    pruefung:
      f5_neue_frage: 'Margin: pairs with $\mu$ near an integer have thin margins (e, 1.46: 0.056).'
      f3_spezialfall: 'no'
      f2_benutzte_voraussetzungen: (P) — so the lemma is not independent of the phase law (no circularity, but mind the order).
      f1_folgt_unmittelbar: Yes, from monotonicity, as soon as (P) holds.
      f4_uebertragbar: All constructions with increasing $T_b$.
    bewertung:
      recherche: Paper III.
      nutzen: Repairs the false unshifted reading.
      richtigkeit: conditional, proof complete
    voraussetzungen:
    - text: Phase-law package (P) for (b,d)
    titel: Offset-aligned limit channel
    aussage: $E_j(\theta)=T_b(j+\tilde H(\theta))>0$ for all $j\ge s+1$; the entire structure of Papers I–II holds for the objects shifted by
      $s$.
    bereich: $m_\star=\inf\tilde H\ge\mu-\sum_k A_k$, $s=\max(0,\lceil-1-m_\star\rceil)$
    quellen:
    - stelle: Lemma 5
  en_theorie:
    beispiel: |
      $(10,2)$: $\mu=-2.26496$, so $m_\star\approx-2.265$ and $s=2$; margin $s+m_\star+1=0.7346$. $(e,1.5)$: $\mu=-9.776$, $s=9$.
    einordnung: |
      Presupposes the phase law (no circularity, but mind the order). Repairs [[bw.gegen.unverschoben]]; checked for 45 pairs:
      [[bw.beob.offset_zertifikat]].
    genau: |
      Let $m_\star=\inf\tilde H$ and $s=\max(0,\lceil-1-m_\star\rceil)$. Then $E_j(\theta)=T_b(j+\tilde H(\theta))>0$ for all $j\ge s+1$, and the whole structure of
      Papers I–II holds for the objects shifted by $s$.
    warum: |
      $T_b(x)>0$ if and only if $x>-1$, and $T_b$ is increasing. For $j\ge s+1$ one has $j+\tilde H(\theta)\ge s+1+m_\star>-1$. Everything else is compatible with the shift.
    worum: |
      The limit objects $T_b(j+\tilde H(\theta))$ are positive only if the argument lies above $-1$. For strongly negative $\mu$ this is false for small $j$.
      The repair: shift everything up by $s$ levels.
- id: bw.lem.randgesetz
  quelle_hash: 1bdcb9dbcb23
  theorie_hash: ee80c3940b58
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'Bottleneck $w\mapsto w+e^2\delta+w^2/(2e)$, continuum approximation: passage time $\pi\sqrt{2/(e\delta)}$.'
      luecken:
      - Continuum approximation instead of a rigorous passage time (Douady–Lavaurs theory).
      - Claimed correction $O(\ln(b-\eta))$ not derived.
    pruefung:
      f5_neue_frage: Rigorous version with constant and phase term via parabolic implosion → br.frage.implosion
      f3_spezialfall: Yes, of br.satz.sattel_knoten.
      f2_benutzte_voraussetzungen: Only the quadratic term at the bottleneck.
      f1_folgt_unmittelbar: '**Yes, as a special case** of the classical saddle-node passage time $\pi/\sqrt{a\varepsilon}$ (Pomeau–Manneville
        intermittency).'
      f4_uebertragbar: Any quantity comparing heights between $b$ near $\eta$ and a fixed base.
    bewertung:
      recherche: 'Correction 12.10.2026 (literature map L2, previously “folklore”): leading term with the same constant in S. Levenstein 2015
        (Forum tid 262, posts 40–41, as a conjecture with Mandelbrot analogy), bottleneck counting in W. Paulsen 2016 (Lemma 2) and as a rough
        computation in BenStandeven 2009 (tid 262). Paper IV did not know these passages.'
      nutzen: Explains the divergence of the hub column.
      richtigkeit: 'Leading term: pure iteration confirms $A$ to 6e-5; hub data only to 4–7 % (model-dependent), not 2.3 % as in Paper IV'
    titel: Parabolic boundary law m(b) as b ↓ η (Paper IV, Lemma 8.2)
    aussage: '$m(b)=\mu_{e,b}=-\pi\sqrt{2\eta/e}\,(b-\eta)^{-1/2}(1+o(1))$, $\pi\sqrt{2\eta/e}=3.2389305\ldots$ (Paper IV: 3.23907, see bw.korr.konstante),
      with a correction of order $\ln(b-\eta)$.'
    nachgeprueft:
    - ergebnis: Numerical value corrected; derivation and conclusion unaffected.
    quellen:
    - stelle: Lemma 8.2
    - stelle: 'S. Levenstein, posts 40–41 (11. and 15.06.2015): sexp_{η+1/n}[π√(2ηn/e) + slog_e(n/e−1) + C] − n → 0 — in modulus the same leading
        term π√(2η/e)(b−η)^{−1/2}, together with a log-like correction; BenStandeven, posts 22–27 (30.04.–01.05.2009): bottleneck slog_η(e−√ε)
        ≈ 2e/√ε'
    - stelle: 'Proof of Lemma 2, p. 102: bottleneck count π√2/√(η_a f''''(x_a))'
  en_theorie:
    beispiel: |
      Pure iteration: passage counts $25$, $316$, $3231$, $10234$ for $\delta=10^{-2},10^{-4},10^{-6},10^{-7}$; fitted constant $3.23872$ instead of $3.23893$.
      The table $m(b)$ hits the leading term only to 4–7 %, because it begins only at $b=1.5$.
    einordnung: |
      A special case of the saddle-node passage time ([[br.satz.sattel_knoten]]). Constant corrected: [[bw.korr.konstante]]. Rigorous via parabolic
      implosion: [[br.frage.implosion]]. At $\eta$ itself the tower creeps like $1/x$ ([[kl.satz.parabolisch]]).
    genau: |
      $m(b)=\mu_{e,b}=-\pi\sqrt{2\eta/e}\,(b-\eta)^{-1/2}\,(1+o(1))$ for $b\downarrow\eta$, with $\pi\sqrt{2\eta/e}=3.2389305\ldots$ and a correction of order $\ln(b-\eta)$ (sketch).
    warum: |
      1. For $b=\eta+\delta$ and $x=e+w$ one has $b^x\approx e+w+\frac{e^2\delta}\eta+\frac{w^2}{2e}$: a bottleneck through which each step advances only by $\varepsilon+aw^2$ ($\varepsilon=e^2\delta/\eta$, $a=1/(2e)$).
      2. In the continuum approximation $dw/dn=\varepsilon+aw^2$ the passage takes $\int_{-\infty}^\infty\frac{dw}{\varepsilon+aw^2}=\frac\pi{\sqrt{a\varepsilon}}=\pi\sqrt{\frac{2\eta}{e\,\delta}}$ steps.
      3. By that many levels the $b$-tower is delayed, so $m(b)\approx-\pi\sqrt{2\eta/e}\,\delta^{-1/2}$. Gaps: rigorous passage time and the $\ln$ correction.
    worum: |
      The closer the base lies to $\eta$, the longer its tower needs to squeeze through the narrow gap at $e$. It lags further and further behind the tower to base $e$
      — and $m(b)$ falls to $-\infty$, like one over the square root of the distance.
- id: bw.lem.stoppregel
  quelle_hash: b83ca2f0f7c9
  theorie_hash: fb6ca6890e05
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Downward induction; produces the channel positivity instead of assuming it.
    pruefung:
      f5_neue_frage: Does the stopped chain suffice for all limit statements? → bw.satz.phasengesetz_gestoppt
      f3_spezialfall: Error control of the evaluation ladder = induction invariant.
      f2_benutzte_voraussetzungen: Monotonicity of $T_d$ and $s_j\to\infty$; no Kneser specifics.
      f1_folgt_unmittelbar: No, but short (induction).
      f4_uebertragbar: Every increasing tetration $T_d$ with $d>\eta$ (class B).
    bewertung:
      recherche: Papers I–III; no precedent known.
      nutzen: Makes the evaluation unconditional.
      richtigkeit: complete
    voraussetzungen:
    - text: b, d > η
    - text: T_d increasing with T_d(0)=1 (for s_j)
    titel: Stopping rule — unconditional positivity of the stopped chain
    aussage: |
      For $n\ge J_0+1$ the chain values $W_k^{(n)}=\alpha T_d(n-k+\theta)(1+\sigma_k)$, $|\sigma_k|\le C_0/s_{n-k}\le\tfrac12$,
      are defined and positive for $0\le k\le n-J_0$: (R2) holds up to the stopping level $J_0$ without assumption.
    bereich: $b,d>\eta$, $J_0=\min\{j:s_j\ge2C_0\}$, $C_0=|\log_b\alpha|+\ln2/\ln b$
    quellen:
    - stelle: Lemma 2, Cor. 3
  en_theorie:
    beispiel: |
      $(e,2)$: $\alpha=\ln2$, $C_0=1.060$, $2C_0=2.119$. The tower values are $s_0=1$, $s_1=2$, $s_2=4$, so $J_0=2$: all the way down to level $2$ everything is secured.
    einordnung: |
      Uses [[bw.lem.wachstumsluecke]]. Makes the tail convergence unconditional ([[bw.satz.phasengesetz_gestoppt]]).
    genau: |
      Let $C_0=|\log_b\alpha|+\ln2/\ln b$ and $J_0=\min\{j:s_j\ge2C_0\}$. For $n\ge J_0+1$ and $0\le k\le n-J_0$ the chain values
      $$W_k^{(n)}=\alpha\,T_d(n-k+\theta)\,(1+\sigma_k),\qquad|\sigma_k|\le C_0/s_{n-k}\le\tfrac12,$$
      are defined and positive. (R2) thus holds up to the stopping level $J_0$ without assumption.
    warum: |
      1. The first logarithm is exact: $\log_b\bigl(T_d(m)\bigr)=\log_b\bigl(d^{T_d(m-1)}\bigr)=\alpha\,T_d(m-1)$.
      2. Each further one: $\log_b\bigl(\alpha T(1+\sigma)\bigr)=\alpha T'+\log_b\alpha+\log_b(1+\sigma)$, where $T'$ is the tower value one level lower. The additional terms are
         bounded by $C_0$; relative to a large tower value they are small.
      3. Downward induction: as long as $s\ge2C_0$, $|\sigma|\le\tfrac12$ remains, so the value is positive and the next logarithm is defined.
    worum: |
      Instead of assuming that the logarithm chain stays positive, one can prove it — as long as one stops in time. At the top of the tower the
      values are huge, each logarithm turns $d^{\text{large}}$ into something large again. Only at the bottom, where the values become small, does one stop.
- id: bw.lem.wachstumsluecke
  quelle_hash: 4495e3f4bcb1
  theorie_hash: 33e6309c53e5
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'Convexity (fp.satz.reelle_fixpunkte). Self-reinforcing growth: $s_{j+1}=d^{s_j}$.'
    pruefung:
      f5_neue_frage: —
      f3_spezialfall: Yes, of fp.satz.reelle_fixpunkte.
      f2_benutzte_voraussetzungen: Only $d>\eta$; for $s_j\to\infty$ every solution with $T_d(0)=1$, not just Kneser.
      f1_folgt_unmittelbar: Yes — literally the minimum computation from fp.satz.reelle_fixpunkte.
      f4_uebertragbar: Every tetration to base $d>\eta$ (layer A).
    bewertung:
      nutzen: Fully discharges Hyp. 2.4.
      richtigkeit: complete
    voraussetzungen:
    - text: d > η
    titel: Tower divergence with explicit gap
    aussage: $d^x-x\ge\delta_0(d)=\dfrac{1+\ln\ln d}{\ln d}>0$; hence $s_{j+1}\ge s_j+\delta_0$, $s_j\to\infty$, and Hyp. 2.4 holds.
    bereich: $d>\eta$, all $x\in\mathbb R$
    quellen:
    - stelle: Lemma 1
  en_theorie:
    beispiel: |
      $\delta_0(1.5)=0.240$, $\delta_0(2)=0.914$, $\delta_0(e)=1$, $\delta_0(10)=0.797$. At $\eta$ itself $\delta_0=0$ — there curve and diagonal touch.
    einordnung: |
      The same computation as in [[fp.satz.reelle_fixpunkte]]. Discharges [[bw.ann.hyp24]] and feeds the stopping rule ([[bw.lem.stoppregel]]).
    genau: |
      For $d>\eta$ and all real $x$ one has $d^x-x\ge\delta_0(d)=\dfrac{1+\ln\ln d}{\ln d}>0$. Hence $s_{j+1}\ge s_j+\delta_0$ and $s_j\to\infty$.
    warum: |
      1. $g(x)=d^x-x$ is convex; the minimum lies where $g'(x)=d^x\ln d-1=0$, i.e. $d^x=1/\ln d$ and $x=-\ln\ln d/\ln d$.
      2. Substituting: $g_{\min}=\frac1{\ln d}+\frac{\ln\ln d}{\ln d}$. This is positive if and only if $\ln\ln d>-1$, i.e. $d>e^{1/e}=\eta$.
      3. $s_{j+1}=d^{s_j}\ge s_j+\delta_0$, so $s_j\ge s_0+j\,\delta_0\to\infty$ (in truth much faster).
    worum: |
      Above $\eta$ the curve $y=d^x$ lies everywhere above the diagonal, with a fixed minimal distance. Therefore every tower grows by at least this distance per level.
