    titel: Phase law for the stopped chain (Paper III reading)
    aussage: The phase law holds without Hyp. 2.2/2.4 if one uses the stopped tails $D_n^{\mathrm{stop}}$.
    bereich: all $b,d>\eta$, Kneser branches
    quellen:
