      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Monotonicity, $d>\eta$, Lipschitz of $A_b$.
      f1_folgt_unmittelbar: 'Almost: content of Paper I + stopping rule; the work is bookkeeping.'
      f4_uebertragbar: 'Class B: every increasing real-analytic tetration.'
    bewertung:
