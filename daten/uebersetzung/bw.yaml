- id: bw.ann.K1K2
  quelle_hash: 82520bc8aaae
  theorie_hash: 9b8cd05459c9
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: Kneser branch geometry (K1)–(K2)
    aussage: '(K1) Strip geometry: $T_d$ holomorphic on $\mathbb H$, $T_d(z)\to L$ for $\operatorname{Im}z\to\infty$; (K2) theta structure: $p=A_d\circ
      T_{\mathrm{reg}}-\mathrm{id}$ 1-periodic, $p''\to0$.'
    quellen:
    - stelle: (K1)–(K2)
  en_theorie:
    einordnung: |
      Condition of [[bw.satz.kern_eindeutig]], [[bw.satz.kern_existenz]] and [[bw.satz.anker_rekonstruktion]].
    genau: |
      **Assumption.** (K1) Strip geometry: $T_d$ holomorphic on the upper half-plane, $T_d(z)\to L$ for $\operatorname{Im}z\to\infty$. (K2) Theta structure: $p=A_d\circ T_{\mathrm{reg}}-\mathrm{id}$
      is 1-periodic with $p'\to0$.
    warum: |
      (K1) corresponds to [[kn.satz.kneser_eigenschaften]]; (K2) is Kneser's correction $\theta_K$ read from the other side ([[kn.konstr.kneser]]). It remains an assumption because the exact
      form cannot be cited as a theorem.
    worum: |
      Two geometric properties of Kneser's solution that one expects classically but does not find as a citable theorem. Paper V/VI assume them.
- id: bw.ann.basis_diffbar
  quelle_hash: f38b9f49d71a
  theorie_hash: dd0b5d8239f2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: Assumption of base differentiability (Paper IV, Hyp. 7.1)
    aussage: $b\mapsto(T_b,A_b)$ is $C^1$ in $\beta=\ln\ln b$, and $\partial_\beta\Phi_{b,d}|_{b=d}=\lim_n V_d(T_d(n+\theta))$ uniformly.
    quellen:
    - stelle: Hyp. 7.1
  en_theorie:
    einordnung: |
      Condition of [[bw.satz.antwortkern]].
    genau: |
      **Assumption** (Paper IV, Hyp. 7.1): $b\mapsto(T_b,A_b)$ is $C^1$ in $\beta=\ln\ln b$, and $\partial_\beta\Phi_{b,d}|_{b=d}=\lim_nV_d(T_d(n+\theta))$ uniformly.
    warum: |
      The first part is covered by Paulsen's holomorphic dependence ([[kn.satz.paulsen_komplex]]); the second — uniform interchange — is the actual assumption.
    worum: |
      To differentiate with respect to the base, one must assume that tetration and super-logarithm depend smoothly on the base — and that one may interchange derivative and
      limit.
- id: bw.ann.hyp22
  quelle_hash: 1d4fb960dc1d
  theorie_hash: a31c4ba50945
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: Assumption “regular real logarithm channel” (Paper I, Hyp. 2.2)
    aussage: |
      (R1) $T_d$ positive, continuous, locally bounded away from 0; (R2) the logarithms $\log_b^{\circ k}(T_d(n+\theta))$
      stay in the real channel; (R3) $A_b$ locally Lipschitz on a neighborhood of the limit tails.
    nachgeprueft:
    - ergebnis: 'Paper III: for limit objects correct only in the offset version (bw.lem.offset).'
    quellen:
    - stelle: Hyp. 2.2
  en_theorie:
    einordnung: |
      Condition of the phase law in Paper I ([[bw.satz.phasengesetz]]); the unconditional version: [[bw.satz.phasengesetz_gestoppt]].
    genau: |
      **Assumption** (Paper I, Hyp. 2.2): (R1) $T_d$ positive, continuous, locally bounded away from $0$; (R2) the logarithms $\log_b^{\circ k}(T_d(n+\theta))$ stay in the real
      channel; (R3) $A_b$ is locally Lipschitz continuous on a neighborhood of the limit tails.
    warum: |
      An assumption, not a theorem. What became of it: (R2) is proved for the stopped chain ([[bw.lem.stoppregel]]); (R3) follows from the analyticity of
      Kneser's super-logarithm. For the limit objects (R2) is correct only in the shifted version ([[bw.lem.offset]]); unshifted it fails
      for some pairs ([[bw.gegen.unverschoben]]).
    worum: |
      In Paper I one had to assume that the chain of logarithms does not fall out of the positive numbers — otherwise $\log_b$ is not defined.
      This assumption is called “regular real logarithm channel”.
- id: bw.ann.hyp24
  quelle_hash: 32213735a68e
  theorie_hash: 73c3f77ac156
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: Assumption “uniform peeling growth” (Paper I, Hyp. 2.4)
    aussage: $\log_b^{\circ k}(T_d(n+\theta))\ge a\,T_d(n-k+\theta)-B$ and $s_j=\inf_\theta T_d(j+\theta)\to\infty$.
    quellen:
    - stelle: Hyp. 2.4
  en_theorie:
    einordnung: |
      Below $\eta$ it is false — there the towers are bounded, and the naive base change becomes constant ([[kl.gescheitert.naiver_basiswechsel]]).
    genau: |
      **Assumption** (Paper I, Hyp. 2.4): $\log_b^{\circ k}(T_d(n+\theta))\ge a\,T_d(n-k+\theta)-B$ and $s_j=\inf_\theta T_d(j+\theta)\to\infty$.
    warum: |
      By now fully discharged: The tower values grow with a fixed minimal gap ([[bw.lem.wachstumsluecke]]), the first inequality follows from the stopping rule.
    worum: |
      The second assumption from Paper I: When peeling, the values stay large enough, and the tower grows beyond all bounds.
- id: bw.beob.blind
