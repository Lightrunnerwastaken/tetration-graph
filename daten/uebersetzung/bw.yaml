- id: bw.frage.nixon_eta_basiswechsel
  quelle_hash: 632ec09e1486
  theorie_hash: fda4b2f3408b
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: 'Comparison with our phase language: is φ, up to θ, the base change F_{η,e} (bw.def.F_bd) with d = η?'
    titel: 'Nixon 2021: base change from η to e via a Mellin representation — can the correction be chosen real?'
    aussage: |
      J. D. Nixon proposed a different route to the base change on the forum in 2021: the starting point is the base η with its neutral fixed point e. He writes the fractional iterates
      η^{∘s} via an inverse Mellin transform and continues them holomorphically to ℂ without (−∞, −2]. One then seeks a map φ with
      e^{φ(z)} = φ(η^z), e.g. φ = Ψ⁻¹(exp(L·slog_η + θ(slog_η))) with the Poincaré function Ψ of exp at L and a 1-periodic correction θ.
      Open is how to choose θ so that φ becomes real — the same difficulty that Kneser solves with the Riemann mapping. There are no calculations.
    einfach: Instead of converting from the base e to other bases, Nixon wants to convert from the particularly well-behaved base η ≈ 1.4447 to
      e. The idea is sketched; the decisive correction that makes everything real is still missing.
    quellen:
    - stelle: Nixon, 17.03.2021
  en_theorie:
    einordnung: |
      Another approach to the base change besides Fox's limit formula and our phase law ([[bw.satz.phasengesetz]]); Kneser construction: [[kn.konstr.kneser]].
    genau: |
      Wanted: φ with e^{φ(z)} = φ(η^z), fixed points L, L̄ of exp. Ansatz: φ = Ψ⁻¹(exp(L·slog_η + θ(slog_η))) with 1-periodic θ; open: θ such that φ is real.
    warum: |
      Every solution of the equation can be written this way because two Abel functions differ by a periodic function. The reality condition does not fix θ by
      itself — for Kneser the Riemann mapping does that.
    worum: |
      The base change converts a tetration into heights of another base. In 2021 Nixon wanted to start from the base η, because there the fractional
      iterates are particularly well understood, and thus regain Kneser's tetration to base e.
- id: bw.frage.streifen_gevrey
  quelle_hash: 1f4284d26632
  theorie_hash: 8269bfce7f18
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: Mode campaign up to $k\approx5000$ ($n_{\lim}\approx2200$); beforehand test on the model case kl.verm.streifenbreite how well
      the method finds a known strip.
    titel: Strip or Gevrey?
    aussage: |
      Is $\Phi_{b,d}$ analytic in a strip of positive width ($\sigma^*>0$) or only Gevrey-smooth
      ($\ln A_k\sim -c\sqrt k$, $\sigma^*=0$)? Not decidable from $k\le500$; the tower analysis (landing bands,
      plateau identity) speaks for Gevrey with effective rate ≈ 0.06. On the tetration forum, “nowhere analytic” has even been
      conjectured since 2011 (bw.verm.nirgends_analytisch).
    quellen:
    - stelle: Rounds 19–20
    - stelle: Counter-conjecture
  en_theorie:
    einordnung: |
      Next step: mode campaign up to $k\approx5000$ ($n_{\lim}\approx2200$), beforehand test on the model case [[kl.verm.streifenbreite]] whether the method finds a known
      strip. Background: [[br.satz.gevrey_fourier]].
    genau: |
      Is $\Phi_{b,d}$ analytic in a strip of positive width ($\sigma^*>0$) or only Gevrey-smooth ($\ln A_k\sim-c\sqrt k$, $\sigma^*=0$)? Not decidable from $k\le500$; the
      tower analysis (landing bands, plateau identity) speaks for Gevrey with effective rate $\approx0.06$.
    warum: |
      Open. Both models predict almost the same for $k\le500$; only at much larger $k$ do they separate. Why this matters: it determines how many modes
      one needs for a table ([[bw.kor.modenzahl]]). On the tetration forum the sharpest form of the Gevrey side is conjectured: nowhere analytic
      ([[bw.verm.nirgends_analytisch]]).
    worum: |
      The open smoothness question: is the wave analytic in a strip of fixed width, or only “almost analytic” (Gevrey), with singularities
      that come arbitrarily close to the real axis?
- id: bw.gegen.unverschoben
  quelle_hash: ad86ebe3492c
  theorie_hash: 50354ba0f9d6
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: —
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Measured µ (engine); rigorous would require an interval bound for µ.
      f1_folgt_unmittelbar: Yes, from the measured µ.
      f4_uebertragbar: All pairs with strongly negative µ, e.g. all $(e,b)$ with $b$ near $\eta$.
    bewertung:
      recherche: Paper III.
      nutzen: Corrects a reading of Paper I.
      richtigkeit: numerically unambiguous (distance to −2 large)
    titel: Unshifted channel reading fails for (10,2) and (e,1.5)
    aussage: |
      For $(10,2)$: $\mu=-2.26496\ldots$, $\inf\tilde H<-2$ ⇒ $T_b(\tilde H)$ undefined on part of the period,
      $E_1$ partly negative. With $s=2$ everything is repaired (margin 0.7346). $(e,1.5)$: $\mu=-9.776$, $s=9$.
    bereich: Pairs with $\mu_{b,d}\le-2+\|P\|_\infty$
    quellen:
    - stelle: Example 6, Table 1
  en_theorie:
    beispiel: |
      $\mu_{10,2}=m(2)-m(10)=-1.12840-1.13656=-2.26496$ — directly from the hub column.
    einordnung: |
      Corrects the reading of [[bw.ann.hyp22]]; repaired by [[bw.lem.offset]]. Affected are all pairs with strongly negative $\mu$, e.g. $(e,b)$ with $b$ near $\eta$ ([[bw.lem.randgesetz]]).
    genau: |
      For $(10,2)$, $\mu=-2.26496\ldots$ and $\inf\tilde H<-2$: $T_b(\tilde H)$ is not defined at all on part of the period, $E_1$ partly negative. With $s=2$
      everything is repaired (margin $0.7346$). For $(e,1.5)$: $\mu=-9.776$, $s=9$.
    warum: |
      $T_b$ is defined only on $(-2,\infty)$ and positive only on $(-1,\infty)$. If $\tilde H=\theta+\mu+P$ lies below $-2$ or $-1$ respectively, the unshifted reading fails.
      Rigorously one would need an interval bound for $\mu$; but the distance to $-2$ is large.
    worum: |
      The literal reading of Paper I — “the channel stays positive from level 1 on” — is false for some pairs of bases. One sees this directly from the measured $\mu$.
