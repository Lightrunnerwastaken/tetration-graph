    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: Mixed-base height map, tails, phase
    aussage: |
      $F_{b,d}:=\operatorname{slog}_b\circ T_d$. Tails $D_n(\theta):=\log_b^{\circ n}\bigl(T_d(n+\theta)\bigr)$.
      If the limit exists: $\Phi_{b,d}(\theta)=A_b(D_{b,d}(\theta))-\theta$, mean $\mu_{b,d}=\int_0^1\Phi$,
      profile $P_{b,d}=\Phi-\mu$; lift $\tilde H_{b,d}=\mathrm{id}+\Phi_{b,d}$.
    bereich: regular (Kneser/Paulsen–Cowgill) branches $T_b,T_d$, $b,d>\eta$; $\alpha=\log_b d$
    quellen:
    - stelle: §2, §5
    - stelle: Base-change formula with constant μ_b(a), 2007
    - stelle: Branch points of log_a^n ∘ exp_b^n
  en_theorie:
    beispiel: |
      $b=e$, $d=2$, $\theta=0$: $D_1=\ln2=0.693$, $D_2=\ln\ln4=0.327$, $D_3=0.0196$, $D_4=-0.1301$, $D_5=-0.14626192$, $D_6=-0.14626229$ — the tail quickly comes to rest.
    einordnung: |
      First rules: [[bw.prop.gruppoid]], [[bw.prop.ganzzahl]]. That the tails converge: [[bw.satz.schwanzkonvergenz]]. The result: [[bw.satz.phasengesetz]].
    genau: |
      For $b,d>\eta$ with Kneser tetrations $T_b,T_d$ and $A_b=\operatorname{slog}_b$, $\alpha=\log_bd$:
      - Height map $F_{b,d}:=A_b\circ T_d$.
      - Tails $D_n(\theta):=\log_b^{\circ n}\bigl(T_d(n+\theta)\bigr)$: take the $d$-tower at height $n+\theta$ and strip off the logarithm to base $b$ $n$ times.
      - If $D_n\to D_{b,d}$: phase $\Phi_{b,d}(\theta)=A_b(D_{b,d}(\theta))-\theta$, mean $\mu_{b,d}=\int_0^1\Phi$, wave (profile) $P_{b,d}=\Phi-\mu$, lift $\tilde H_{b,d}=\mathrm{id}+\Phi_{b,d}$.
    warum: |
      A definition; the connection of the parts is one line: $A_b(\log_by)=A_b(y)-1$, hence
      $$A_b(T_d(n+\theta))-(n+\theta)=A_b(D_n(\theta))-\theta.$$
      The left side is the height shift, the right side lives on a fixed small interval. If the tails converge, the shift has a limit $\Phi(\theta)$.
    worum: |
      The basic question of the chapter: The tower to base $d$ has the value $T_d(x)$ at height $x$. At what height does the tower to base $b$
      reach the same value? This translation of heights is called the mixed-base height map. Everything else is names for its components.
- id: bw.def.auswahlprinzip
  quelle_hash: d65cf69ac6bf
  theorie_hash: 14e591d2522f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: Selection principle for the base kernel (Paper V, Def. 1)
    aussage: |
      (i) $V(d^y)-V(y)=-A_d'(d^y)\,y\ln d\,d^y$; (ii) real on $\mathbb R$; (iii) prescribed fixed-point singularity
      (pole $dL/d\beta=\ln d\,L^2/(1-\lambda)$, log coefficient $d\lambda/d\beta$, read radially); (iv) $V(1)=0$.
    quellen:
    - stelle: Def. 1
  en_theorie:
    einordnung: |
      Uniqueness: [[bw.satz.kern_eindeutig]]; existence: [[bw.satz.kern_existenz]].
    genau: |
      $V$ is called admissible if (i) $V(d^y)-V(y)=-A_d'(d^y)\,y\ln d\,d^y$; (ii) $V$ real on $\mathbb R$; (iii) at $L$ the prescribed singularity (pole with coefficient
      $dL/d\beta=\ln d\,L^2/(1-\lambda)$, logarithmic part with $d\lambda/d\beta$, read radially); (iv) $V(1)=0$ (Paper V, Def. 1).
    warum: |
      Each condition comes from a property of $A_b$: (i) is the Abel equation differentiated with respect to $\beta$; (ii) $A_b$ is real; (iii) $A_b$ has at $L(b)$ a
      logarithmic singularity that moves with $L$ — differentiating gives pole and logarithm ($dL/d\beta$ from $L=e^{e^\beta L}$); (iv) $A_b(1)=0$ for all $b$.
    worum: |
      The derivative of the super-logarithm with respect to the base — the “base kernel” $V$ — solves an equation that has many solutions. Four conditions select the right one.
- id: bw.frage.halbiter_vergleich
  quelle_hash: b0045ac3427c
  theorie_hash: f3240f146fca
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: Can a concrete counterexample sequence for Kneser be built from the measured wave?
      f3_spezialfall: Question about a “natural” growth scale between quasi-polynomial and quasi-exponential.
      f2_benutzte_voraussetzungen: Base-change wave (bw.satz.phasengesetz).
      f1_folgt_unmittelbar: No, open.
      f4_uebertragbar: All constructions of fractional iterates.
    bewertung:
      nutzen: Connects the base change with a natural growth question.
      richtigkeit: open
    titel: Are fractional exponential iterates for different bases ordered by growth? (Taranovsky, MO 2017)
    aussage: |
      For bases $a,b>\eta$ and heights $c<d$: does $\lim_{x\to\infty}\exp_a^{[c]}(x)/\exp_b^{[d]}(x)=0$ hold? For $c=1<d$ yes (for every tetration with increasing derivative). Levenstein conjectures
      (forum 2018): for Walker's solution it holds in general, for Kneser **not** — there then exist $c<d$ (even with $a<b$) and arbitrarily large $x$ with $\exp_a^{[c]}(x)>\exp_b^{[d]}(x)$.
      The reason would be the periodic wave of the base change: Kneser iterates of two bases are shifted into each other only up to a wobble.
      In 2018 Levenstein pointed to a forthcoming paper by W. Paulsen and S. Cowgill; it appeared in 2021 and shows that the Kneser tetrations and their fractional
      iterates to different bases do not lie in a common Hardy field (bw.satz.paulsen_cowgill_hardy). Whether this already
      answers the question for Kneser (sign change of exactly this quotient) cannot be decided without the text.
    einfach: If one applies the exponential function “half a time” or “three quarters of a time”, does the higher level then always grow faster
      — even for different bases? Presumably the answer depends on which continuation of tetration one takes.
    quellen:
    - {}
    - stelle: Hardy field incompatibility (zbMATH summary)
  en_theorie:
    beispiel: |
      For $c=1$, $d=1+\delta$ the order always holds eventually, even for $a<b$ — but only from very large $x$ on.
    einordnung: |
      Connects [[kn.satz.halbe_exp_wachstum]] with the base change.
    genau: |
      Does $\exp_a^{[c]}(x)/\exp_b^{[d]}(x)\to0$ hold for $c<d$ and all $a,b>\eta$? Conjecture: yes for Walker, no for Kneser.
    warum: |
      Between two bases the Kneser tetration is shifted only up to a small periodic wave ([[bw.satz.phasengesetz]]). If $c$ and $d$ are very close, the wave can reverse the
      order again and again — for arbitrarily large $x$.
    worum: |
      Do the fractional iterates of $\exp_b$ order the growth rates the way one expects — higher level, faster growth, regardless of the base?
