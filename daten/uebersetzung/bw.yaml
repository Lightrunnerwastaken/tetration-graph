      f3_spezialfall: —
      f2_benutzte_voraussetzungen: —
      f1_folgt_unmittelbar: 'Yes, in hindsight: pole coefficient $-(1+p''(\chi))\,dL/d\beta/\ln\lambda$.'
      f4_uebertragbar: Warning for every orbit method near $L$.
    bewertung:
      recherche: Paper V.
      nutzen: Saves a dead end.
      richtigkeit: numerically verified
    titel: Naive orbit summation along the backward spiral
    aussage: 'An anchor with the bare Schröder function along $w_{k+1}=\log_d w_k\to L$ diverges like $|\lambda|^n$: the theta derivative multiplies
      the pole ($|p''|\approx0.5$ for $d=e$).'
    quellen:
    - stelle: Rem. 3
  en_theorie:
    einordnung: |
      Led to the radial instead of orbital reading of condition (iii) in [[bw.def.auswahlprinzip]]. Warning for every orbit method near $L$.
    genau: |
      An anchor with the bare Schröder function along $w_{k+1}=\log_dw_k\to L$ diverges like $|\lambda|^n$: the theta derivative multiplies the pole ($|p'|\approx0.5$ for $d=e$).
    warum: |
      Understood in hindsight: the pole coefficient is $-(1+p'(\chi))\,dL/d\beta/\ln\lambda$. Along the spiral $p'$ does not become small, and every step amplifies by $|\lambda|$.
    worum: |
      An obvious route to the base kernel: sum up along the backward spiral into the fixed point $L$. It diverges.
