    - text: log_b^{∘n}(T_d(n)) defined
    titel: Exact peeling at integer heights
    aussage: $\operatorname{slog}_b(T_d(n))-n=A_b(C^n_{b,d})$ with $C^n_{b,d}=\log_b^{\circ n}(T_d(n))$. Integer heights see only phase 0.
    bereich: $n\in\mathbb N$, provided the iterated logarithms are defined
    quellen:
    - stelle: Prop. 3.2, Cor. 3.3
  en_theorie:
    beispiel: |
      $(e,2)$: $\operatorname{slog}_e(T_2(n))-n=0,\,-0.298,\,-0.679,\,-0.982,\,-1.115,\,-1.1283314$ for $n=0,\dots,5$, limit $\mu+P(0)=-1.1283317$. So the integer heights
      show only the one value $P(0)$ of the wave — not its shape.
    einordnung: |
      The case $\theta=0$ of the phase law ([[bw.satz.phasengesetz]]). For $\theta\ne0$ the wave $P(\theta)$ is added.
    genau: |
      $\operatorname{slog}_b(T_d(n))-n=A_b(C^n_{b,d})$ with $C^n_{b,d}=\log_b^{\circ n}(T_d(n))$, provided the logarithms are defined.
    warum: |
      The Abel equation $A_b(y)=A_b(\log_by)+1$, applied $n$ times.
    worum: |
      At integer heights one can “peel off” the translation exactly: $n$ logarithms strip off $n$ levels. But integer heights see only a
      single point of the wave — hence one wrongly expects a constant shift.
- id: bw.prop.gruppoid
  quelle_hash: 03ef6b42aa1b
  theorie_hash: 55ef0f34bd4f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: $A_b T_c A_c T_d=A_b T_d$.
    pruefung:
      f5_neue_frage: Content arises only asymptotically (phase law).
      f3_spezialfall: 'Yes: changes of coordinates between Abel coordinates always form a groupoid.'
      f2_benutzte_voraussetzungen: Only invertibility; no regularity, no Kneser.
      f1_folgt_unmittelbar: Yes, from $A_c\circ T_c=\mathrm{id}$.
      f4_uebertragbar: Every family of superfunctions of arbitrary maps.
    bewertung:
      nutzen: Organizing principle; no new mathematical content.
      richtigkeit: complete
    voraussetzungen:
    - text: T_b, T_c invertible (A_b = T_b^{-1}) on the images
    - text: regular Kneser branches
      notiz: valid for every choice of tetrations
    titel: Groupoid identities
    aussage: $F_{b,b}=\mathrm{id}$, $F_{b,d}^{-1}=F_{d,b}$, $F_{b,d}=F_{b,c}\circ F_{c,d}$.
    bereich: arbitrary solutions $T_b,T_c,T_d$ with inverses on the required images
    quellen:
    - stelle: Prop. 6.1
  en_theorie:
    beispiel: |
      $F_{e,2}(x)=\operatorname{slog}_e(T_2(x))$; back: $F_{2,e}(y)=\operatorname{slog}_2(T_e(y))$, and $F_{2,e}(F_{e,2}(x))=x$.
    einordnung: |
      An organizing principle without content of its own. It acquires content only in the limit: cocycle of the phases ([[bw.prop.kozykel]]) and the hub decomposition ([[bw.prop.hub]]).
    genau: |
      $F_{b,b}=\mathrm{id}$, $F_{b,d}^{-1}=F_{d,b}$, $F_{b,d}=F_{b,c}\circ F_{c,d}$.
    warum: |
      $F_{b,c}\circ F_{c,d}=A_bT_cA_cT_d=A_bT_d$, because $T_cA_c=\mathrm{id}$. There is no more to it — one needs only that the tetrations are invertible.
    worum: |
      Translating heights behaves like exchanging money: going from $d$ to $c$ and then to $b$ is the same as going directly from $d$ to $b$, and exchanging back cancels out.
- id: bw.prop.hub
  quelle_hash: 04d9de9227bb
  theorie_hash: 5aaea017e519
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Integrated cocycle + antisymmetry.
    pruefung:
      f5_neue_frage: One column $m(\cdot)$ determines all means up to small defects → table format of the base atlas.
      f3_spezialfall: 'Corrects the assumption of J. D. Fox (2007) that the constants are exactly additive: the defect Δ is a product of two waves
        (≈ 1e-9 for (3,2)).'
      f2_benutzte_voraussetzungen: Phase law for three pairs.
      f1_folgt_unmittelbar: Yes (integration of the cocycle).
      f4_uebertragbar: —
    bewertung:
      recherche: Paper IV. The additivity itself was put forward by J. D. Fox in 2007 in the Tetration Forum (as exact); new is the exact version
        with the defect Δ.
      nutzen: 'Practical: base change with one table column.'
      richtigkeit: conditional, complete
    titel: Exact hub decomposition of the means (Paper IV, Prop. 8.1)
    aussage: $\mu_{b,d}=m(d)-m(b)+\Delta_{b,c_*;d}$, $\Delta=\int_0^1P_{b,c_*}(\{\theta+\Phi_{c_*,d}(\theta)\})\,d\theta$; defects of second/third
      order confirmed to $10^{-15}$.
    versionen:
    - aenderung: 'Prior work Fox 2007 entered: there exact additivity assumed; here with defect Δ.'
    quellen:
    - stelle: Prop. 8.1
    - stelle: Additivity μ_a(c) = μ_a(b) + μ_b(c), assumed exact
  en_theorie:
    beispiel: |
      $m(2)-m(3)=-1.1284037766-0.1924222937=-1.3208260704$; directly measured $\mu_{3,2}=-1.3208260715$. The remainder is about $10^{-9}$ — waves of size $10^{-4}$, squared.
    einordnung: |
      Practical: base change with one table column. Prehistory: J. D. Fox put forward the rule $\mu_a(c)=\mu_a(b)+\mu_b(c)$ in 2007 in the Tetration Forum — as
      exact additivity of constant shifts. The hub shows what remains of it because of the wave: additivity up to the defect $\Delta$.
      How $m(b)$ diverges at $\eta$: [[bw.lem.randgesetz]]; accuracy of the column: [[bw.beob.hub_genauigkeit]].
    genau: |
      $$\mu_{b,d}=m(d)-m(b)+\Delta_{b,c_*;d},\qquad\Delta=\int_0^1P_{b,c_*}\bigl(\{\theta+\Phi_{c_*,d}(\theta)\}\bigr)\,d\theta$$
      (Paper IV, Prop. 8.1); defects of second and third order confirmed to $10^{-15}$.
    warum: |
      Integrate the cocycle ([[bw.prop.kozykel]]) over one period and use the antisymmetry. The remainder $\Delta$ is the integral of a wave with mean $0$, read off at
      slightly bent points — if the bending were zero, $\Delta$ would be zero as well. Hence $\Delta$ is a product of two small waves.
    worum: |
      Instead of tabulating a separate mean $\mu_{b,d}$ for every pair of bases, a single column $m(b)=\mu_{e,b}$ suffices: The means are almost differences.
      What is missing is a tiny remainder of second order.
- id: bw.prop.kozykel
  quelle_hash: 240031f31c3c
  theorie_hash: 90c95694fb1d
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Groupoid identity + uniform phase limits.
    pruefung:
      f5_neue_frage: Hub decomposition of the means → bw.prop.hub
      f3_spezialfall: Lifts form a groupoid in $\mathrm{Homeo}^+(S^1)$ — pure composition rule.
      f2_benutzte_voraussetzungen: Existence of the three phase limits, uniformly.
      f1_folgt_unmittelbar: 'Yes: groupoid + limit.'
      f4_uebertragbar: All constructions with phase law.
    bewertung:
      nutzen: Structural equation; content lies in the phase law.
      richtigkeit: conditional, proof trivial
    titel: Nonlinear phase cocycle
    aussage: $\Phi_{b,d}(\theta)=\Phi_{c,d}(\theta)+\Phi_{b,c}(\{\theta+\Phi_{c,d}(\theta)\})$; for inverse pairs $\Phi_{d,b}(\{\theta+\Phi_{b,d}(\theta)\})=-\Phi_{b,d}(\theta)$.
    quellen:
    - stelle: Prop. 6.4, Cor. 6.5
  en_theorie:
    beispiel: |
      Integrating over $\theta$ gives almost $\mu_{b,d}=\mu_{c,d}+\mu_{b,c}$ — up to a tiny remainder ([[bw.prop.hub]]).
    einordnung: |
      The lifts $\tilde H$ form a groupoid of circle maps ([[bw.satz.homoeo]]). The inverse equation yields the antisymmetry ([[bw.satz.antisymmetrie]]).
    genau: |
      $$\Phi_{b,d}(\theta)=\Phi_{c,d}(\theta)+\Phi_{b,c}\bigl(\{\theta+\Phi_{c,d}(\theta)\}\bigr),\qquad\Phi_{d,b}\bigl(\{\theta+\Phi_{b,d}(\theta)\}\bigr)=-\Phi_{b,d}(\theta).$$
    warum: |
      $F_{b,d}=F_{b,c}\circ F_{c,d}$ ([[bw.prop.gruppoid]]). With $y=F_{c,d}(x)=x+\Phi_{c,d}(\{x\})+o(1)$ one has $F_{b,d}(x)-x=(F_{b,c}(y)-y)+(y-x)$; in the limit the right-hand side
      reads $\Phi_{b,c}(\{y\})+\Phi_{c,d}(\{x\})$. For $b=d$ this gives the inverse equation.
    worum: |
      The exchange rule “from $d$ via $c$ to $b$” also holds for the limits — only one must read off the wave at the correct, already shifted point.
- id: bw.prop.saddle
  quelle_hash: 2a14b21966ea
  theorie_hash: 95cc00ea7256
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Saddle-point method (contour assumed shiftable at the boundary).
    pruefung:
      f5_neue_frage: Remains correct as a theorem; its application to $\Phi$ hinged on bw.beob.singularitaet.
      f3_spezialfall: Yes, Darboux/saddle point.
      f2_benutzte_voraussetzungen: Contour shift; form of the singularity.
      f1_folgt_unmittelbar: Standard saddle-point computation.
      f4_uebertragbar: —
    bewertung:
      nutzen: Interpretation of the √k term — application now open.
      richtigkeit: complete (under hypothesis)
    titel: Singularity ⇒ decay law (Paper IV, Prop. 6.3)
    aussage: $\ln\hat P(k)=\mathrm{const}+\gamma\ln k-2\pi\sigma^*k-\sqrt{\pi ck}+o(\sqrt k)$ with $8|v|\cos^2\Psi=c$.
    bereich: periodic $P$, holomorphic in the strip except for isolated singularities $P=h\exp(v/(\theta-\bar\theta^*))$; integration contour
      can be shifted up to the edge of the strip (assumed)
    quellen:
    - stelle: Prop. 6.3
  en_theorie:
    einordnung: |
      Correct as a theorem. Its application to $\Phi$ hinged on [[bw.beob.singularitaet]] and is now open; consequence: [[bw.kor.modenzahl]].
    genau: |
      If $P$ is holomorphic in the strip except for isolated singularities $P=h\exp(v/(\theta-\bar\theta^*))$, then
      $\ln\hat P(k)=\mathrm{const}+\gamma\ln k-2\pi\sigma^*k-\sqrt{\pi ck}+o(\sqrt k)$ with $8|v|\cos^2\Psi=c$ (Paper IV, Prop. 6.3).
    warum: |
      Saddle-point method: one shifts the integration contour of the Fourier integral up to the singularity; there the integrand has a saddle whose position
      moves with $\sqrt k$. It is assumed that the contour may be shifted in this way.
    worum: |
      A textbook theorem: if a periodic function has in the strip a singularity of the form $\exp(v/(\theta-\bar\theta^*))$, then its Fourier modes decay with an
      additional $\sqrt k$ term in the exponent — exactly the form of the measured mode decay.
- id: bw.satz.anker_rekonstruktion
  quelle_hash: fc7b756e53c1
  theorie_hash: 60c68d9c4630
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Ovsyannikov theorem in a fixed path space; RH selection of the response field.
    pruefung:
      f5_neue_frage: Complete interval march → bw.frage.intervallmarsch
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: (K1)–(K2) Hyp. 2.1/2.2 of Paper VI.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: 'Other anchors (Paper VI: re-anchoring).'
    bewertung:
      recherche: Paper VI.
      nutzen: Tetration of one base from another.
      richtigkeit: conditional; framework rigorous
    titel: Anchor-clean reconstruction (Paper VI, Thm. 8.5/8.6)
    aussage: '$T_\beta=Q_\beta\circ U_\beta$, $U_\beta=\mathrm{id}+p_\beta$: exact base derivative of the raw branch, cancellation of the nonperiodic
      tails in the hub equation, closed periodic evolution on a fixed weighted analytic path space.'
    quellen:
    - stelle: Thm. 8.2, 8.5, 8.6, 9.1
  en_theorie:
    einordnung: |
      Blind-tested: [[bw.beob.blind]]. So far one segment is certified ([[bw.zert.8r1]]); the whole march is open ([[bw.frage.intervallmarsch]]).
    genau: |
      Under (K1)–(K2): $T_\beta=Q_\beta\circ U_\beta$ with $U_\beta=\mathrm{id}+p_\beta$ gives an exact base derivative of the raw branch; the nonperiodic tails in the hub equation cancel,
      and the periodic evolution is closed on a fixed weighted analytic path space (Paper VI, Thm. 8.5/8.6).
    warum: |
      1. The base derivative is supplied by the base kernel ([[bw.satz.kern_existenz]]); it determines how the solution changes with $\beta$.
      2. This gives an evolution equation in $\beta$. An existence theorem of Ovsyannikov type (Cauchy–Kovalevskaya in a scale of Banach spaces) secures the solution
         for one step in $\beta$, as long as one stays in the fixed path space.
      3. March step by step from $e$ to $2$.
    worum: |
      Can one compute the tetration to base $2$ from the one to base $e$ alone, without the Kneser engine for base $2$? Yes: one lets the base slowly wander from $e$
      to $2$ and follows the solution like a differential equation in the base.
- id: bw.satz.antisymmetrie
  quelle_hash: add02a00d4eb
  theorie_hash: f99f1c99e48b
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Riemann–Stieltjes substitution.
    pruefung:
      f5_neue_frage: 'Measurable consequence: table residuals $\mu_{b,d}+\mu_{d,b}$ are pure rounding error — an accuracy test of the engine.'
      f3_spezialfall: Yes, of br.satz.young_kreis.
      f2_benutzte_voraussetzungen: Only homeomorphism + inverse.
      f1_folgt_unmittelbar: '**Yes** — from Thm. A and the area identity br.satz.young_kreis, which holds for every lift of a circle homeomorphism.
        Specific to tetration is only that $\tilde H_{d,b}$ is the inverse.'
      f4_uebertragbar: To every pair of inverse lifts.
    bewertung:
      nutzen: Explains the 10⁻⁹–10⁻¹¹ residuals in Paper I; mathematically a special case of a classical identity.
      richtigkeit: conditional, complete
    titel: Exact inverse antisymmetry without smoothness (Paper II, Thm. B)
    aussage: $\mu_{b,d}=-\mu_{d,b}$ exactly, as soon as the phase law holds for both orders.
    quellen:
    - stelle: Thm. B
  en_theorie:
    beispiel: |
      $\mu_{e,2}=-1.128403776628924$; mean of the inverse $+1.128403776629334$; sum $4\cdot10^{-13}$ — pure rounding error. For 200 random lifts the
      identity holds to $6\cdot10^{-10}$, even for a kinked lift.
    einordnung: |
      Replaces [[bw.prop.antisym_c1]]. Side effect: The residual errors $\mu_{b,d}+\mu_{d,b}$ in tables are an accuracy test for the engine.
    genau: |
      $\mu_{b,d}=-\mu_{d,b}$ exactly, as soon as the phase law holds for both orders (Paper II, Thm. B).
    warum: |
      1. $\tilde H_{d,b}=\tilde H_{b,d}^{-1}$ ([[bw.satz.homoeo]]).
      2. For every increasing lift $H$ with $H(x+1)=H(x)+1$ one has $\int_0^1(H(x)-x)\,dx=-\int_0^1(H^{-1}(y)-y)\,dy$: the areas between graph and diagonal
         are the same for $H$ and $H^{-1}$, only mirrored ([[br.satz.young_kreis]]).
      3. On the left is $\mu_{b,d}$, on the right $-\mu_{d,b}$. Smoothness is needed nowhere.
    worum: |
      If one translates from $d$ to $b$, the height shifts on average by $\mu_{b,d}$; back by exactly $-\mu_{b,d}$. That sounds self-evident, but it is
      not, because the wave stands in between. It follows from an area identity for circle maps.
- id: bw.satz.antwortkern
  quelle_hash: 63e52334e547
  theorie_hash: 3907f691fff0
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Telescope the cohomological equation $V_d(T_d(x+1))-V_d(T_d(x))=-T_d(x)/T_d'(x)$.
    pruefung:
      f5_neue_frage: Which solution of the cohomological equation is $V$? → bw.satz.kern_eindeutig
      f3_spezialfall: Linear response of an Abel coordinate to a change of parameter — general for families $f_\beta$.
      f2_benutzte_voraussetzungen: Interchange of limit and derivative (Hyp. 7.1).
      f1_folgt_unmittelbar: Yes, after differentiating the Abel equation (Lemma 7.2).
      f4_uebertragbar: 'Regular families $1<b<\eta$: there the kernel is explicit via Koenigs.'
    bewertung:
      recherche: Paper IV.
      nutzen: Explains the amplitude law $A_k\approx C_k|\ln\alpha|$.
      richtigkeit: conditional, complete
    titel: Response kernel and first-order phase (Paper IV, Thm. 7.3)
    aussage: |
      $G_d(\theta):=S_d(\theta)-V_d(T_d(\theta))$ with $S_d=\sum_{j\ge0}T_d(j+\theta)/T_d'(j+\theta)$ is exactly 1-periodic, and
      $\Phi_{b,d}=\varepsilon\,G_d+O(\varepsilon^2)$ uniformly, $\varepsilon=\ln\log_b d$.
    quellen:
    - stelle: Lemma 7.2, Thm. 7.3
  en_theorie:
    beispiel: |
      Amplitude law in numbers: $|a_1|/|\varepsilon|=1.437\cdot10^{-4}/0.3665=3.92\cdot10^{-4}$ for $(e,2)$ and $3.65\cdot10^{-5}/0.0940=3.88\cdot10^{-4}$ for $(e,3)$ — almost the same
      kernel, although the waves differ fourfold in size.
    einordnung: |
      Which solution of the cohomological equation $V$ is, is fixed by [[bw.satz.kern_eindeutig]]. Replaces [[bw.verm.rang_eins]].
    genau: |
      With $S_d(\theta)=\sum_{j\ge0}T_d(j+\theta)/T_d'(j+\theta)$ and $V_d=\partial_\beta A_b|_{b=d}$, $G_d(\theta):=S_d(\theta)-V_d(T_d(\theta))$ is exactly 1-periodic, and
      $$\Phi_{b,d}=\varepsilon\,G_d+O(\varepsilon^2),\qquad\varepsilon=\ln\log_bd$$
      uniformly (Paper IV, Thm. 7.3).
    warum: |
      1. Differentiating the Abel equation $A_b(b^y)=A_b(y)+1$ with respect to $\beta=\ln\ln b$ (with $b^y=\exp(e^\beta y)$) gives at $b=d$ the cohomological equation
         $V(T(x+1))-V(T(x))=-T(x)/T'(x)$ ([[fg.satz.kohomologisch]]).
      2. Telescoping along the tower: $V(T(n+\theta))=V(T(\theta))-\sum_{j<n}T(j+\theta)/T'(j+\theta)$; in the limit $S_d$ appears, and the difference $G_d$ is periodic.
      3. $\Phi_{b,d}$ is zero at $b=d$; its derivative with respect to $\beta$ is the limit from 2 (this is where Hyp. 7.1 enters).
    worum: |
      How does the wave react if one changes the base a tiny bit? To first order it is a fixed kernel $G_d$ times the base change $\varepsilon$.
      The kernel can be computed from the tetration to base $d$ alone.
- id: bw.satz.c1_produkt
  quelle_hash: 7285a199a245
  theorie_hash: fa57279070d3
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Exact product identity for $D_n'$; tower-sized factors cancel; summability from $s_{j+1}=d^{s_j}$.
    pruefung:
      f5_neue_frage: Higher derivatives ⇒ $C^\infty$? Analytic in a strip? → bw.verm.streifen
      f3_spezialfall: 'no'
      f2_benutzte_voraussetzungen: (S), (R′), Hyp. 2.2/2.4; (R′) for $j\ge J_0$ by the stopping rule.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: Smooth branches; explains endpoint identities.
    bewertung:
      recherche: Paper II.
      nutzen: Smoothness + explicit derivative.
      richtigkeit: conditional, complete
    titel: Analytic C¹ theorem with product representation (Paper II, Thm. D)
    aussage: |
      $D_n\to D$ in $C^1$, $D'>0$ and
      $\tilde H_{b,d}'(\theta)=\dfrac{\alpha T_d'(\theta)}{T_b'(\tilde H(\theta))}\prod_{j\ge1}\dfrac{\alpha T_d(j+\theta)}{T_b(j+\tilde H(\theta))}>0$.
    quellen:
    - stelle: Thm. D
  en_theorie:
    beispiel: |
      $(e,2)$ at $\theta=\tfrac12$: numerically $\tilde H'(\tfrac12)=0.9992171582$; the product formula with four factors gives the same value to all digits shown.
      Without the prefactor $\alpha$ one would get $1.44$ — it belongs there.
    einordnung: |
      Smoothness with explicit derivative. How smooth exactly — analytic in a strip? — is the open question [[bw.verm.streifen]].
    genau: |
      Under the conditions (S) and (R′) one has $D_n\to D$ in $C^1$, $D'>0$, and
      $$\tilde H_{b,d}'(\theta)=\frac{\alpha\,T_d'(\theta)}{T_b'(\tilde H(\theta))}\prod_{j\ge1}\frac{\alpha\,T_d(j+\theta)}{T_b(j+\tilde H(\theta))}>0$$
      (Paper II, Thm. D).
    warum: |
      1. Chain rule for $D_n$: each derivative of $T$ is a product over tower values ($T'(x+1)=\ln b\,T(x+1)T'(x)$), each logarithm divides by the value.
      2. The tower-sized factors stand in the numerator and in the denominator and cancel except for quotients $\alpha T_d(j+\theta)/T_b(j+\tilde H)$.
      3. These quotients tend to $1$ very fast, because by the phase law the two towers approach each other level by level; the product converges.
    worum: |
      The phase map is not only continuous but continuously differentiable, and its derivative can be written down as a product: tower values to
      base $d$ divided by tower values to base $b$, level by level.
- id: bw.satz.fourier_naht
  quelle_hash: a973c71deece
  theorie_hash: 0ba4a2130a54
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Integration by parts, Riemann–Lebesgue.
    pruefung:
      f5_neue_frage: Measured exponents 3.06/3.006 calibrate the measurement chain.
      f3_spezialfall: Yes (textbook theorem).
      f2_benutzte_voraussetzungen: Piecewise smoothness.
      f1_folgt_unmittelbar: Yes — classical Fourier analysis.
      f4_uebertragbar: To every construction with seams (linear, Walker approximations).
    bewertung:
      nutzen: Calibration tool for the mode measurement.
      richtigkeit: complete
    titel: Fourier asymptotics with seam jumps (Paper IV, Prop. 4.1)
    aussage: $\hat f(k)=(2\pi i k)^{-(m+2)}\sum_i J_i e^{-2\pi i k\tau_i}+o(k^{-(m+2)})$.
    bereich: $f\in C^m(S^1)$, piecewise $C^{m+2}$, jumps $J_i$ of $f^{(m+1)}$ at $\tau_i$
    quellen:
    - stelle: Prop. 4.1
    - {}
  en_theorie:
    beispiel: |
      Linear tetration to base $e$: $C^1$, the second derivative jumps ([[kn.satz.linear_glatt]]) — hence modes like $k^{-3}$. Measured exponents were $3.06$ and $3.006$; this calibrates the measurement chain.
    einordnung: |
      A textbook theorem as a calibration tool. For analytic functions the modes decay exponentially ([[br.satz.gevrey_fourier]], [[bw.verm.streifen]]).
    genau: |
      If $f\in C^m(S^1)$, piecewise $C^{m+2}$, and $f^{(m+1)}$ jumps by $J_i$ at $\tau_i$, then
      $$\hat f(k)=(2\pi ik)^{-(m+2)}\sum_iJ_ie^{-2\pi ik\tau_i}+o(k^{-(m+2)}).$$
    warum: |
      Integrate by parts $(m+2)$ times. Each jump yields a boundary term $J_ie^{-2\pi ik\tau_i}/(2\pi ik)^{m+2}$; the remainder is a Fourier coefficient of an integrable
      function and tends to $0$ by Riemann–Lebesgue.
    worum: |
      How fast the Fourier coefficients of a periodic function decay reveals how smooth it is. A jump in the $(m+1)$-th derivative gives coefficients
      of size $k^{-(m+2)}$.
- id: bw.satz.homoeo
  quelle_hash: e8038f65e0ae
  theorie_hash: 2378ca236a88
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Limit of strictly increasing maps + inverse equation ⇒ both sides injective.
    pruefung:
      f5_neue_frage: Antisymmetry → bw.satz.antisymmetrie
      f3_spezialfall: 'no'
      f2_benutzte_voraussetzungen: (P) for both orders; no smoothness.
      f1_folgt_unmittelbar: 'Almost: limits of monotone functions are monotone; strictness from the inverse.'
      f4_uebertragbar: All increasing constructions.
    bewertung:
      recherche: Paper II.
      nutzen: Topological core.
      richtigkeit: conditional, complete
    voraussetzungen:
    - text: Phase-law package (P) for (b,d) and (d,b)
    titel: Phase map is a circle homeomorphism (Paper II, Thm. A)
    aussage: $\tilde H_{b,d}$ is a strictly increasing homeomorphism commuting with $x\mapsto x+1$, with $\tilde H_{b,d}^{-1}=\tilde H_{d,b}$;
      the phase maps form a groupoid in $\mathrm{Homeo}^+(S^1)$.
    quellen:
    - stelle: Thm. A
  en_theorie:
    beispiel: |
      $(e,2)$: $\tilde H(\theta)=\theta-1.12840+P(\theta)$ with $|P|\le1.44\cdot10^{-4}$ — almost a rotation by $-1.1284$, with a tiny bending.
    einordnung: |
      Topological core; from it the antisymmetry follows without smoothness ([[bw.satz.antisymmetrie]]).
    genau: |
      Under the phase law for $(b,d)$ and $(d,b)$, $\tilde H_{b,d}$ is a strictly increasing homeomorphism with $\tilde H(x+1)=\tilde H(x)+1$ and $\tilde H_{b,d}^{-1}=\tilde H_{d,b}$
      (Paper II, Thm. A). The phase maps form a groupoid in $\mathrm{Homeo}^+(S^1)$.
    warum: |
      1. Before the limit, $\theta\mapsto A_b(D_n(\theta))$ is strictly increasing (everything in the chain is increasing).
      2. Limits of increasing functions are at least non-decreasing.
      3. The inverse equation ([[bw.prop.kozykel]]) says $\tilde H_{d,b}\circ\tilde H_{b,d}=\mathrm{id}$; hence $\tilde H_{b,d}$ is injective and therefore strictly increasing and continuous.
    worum: |
      The phase map $\tilde H_{b,d}$ is a clean circle map: strictly increasing, if the argument is shifted by $1$ the result is shifted by $1$,
      and the opposite direction $\tilde H_{d,b}$ is its inverse.
- id: bw.satz.imaginaere_richtung
  quelle_hash: 061bbe2f3515
  theorie_hash: 3d8cd598be93
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: '$\kappa_d(A_d^{-1}(w))=\lambda_d^w$ ⇒ $A_d^{-1}(w)=L_d+\lambda_d^w+O(\lambda_d^{2w})$; $A_b$ is holomorphic at $L_d$ ⇒ Taylor expansion
        in $\lambda_d^w$, $|\lambda_d^{iy}|=e^{-y\arg\lambda_d}\to0$. Kneser: $T_d(x+iy)\to L_d$ (Paulsen–Cowgill condition).'
    gegenbeispielsuche: 'Original: K₁ determined twice, 19 digits; approach up to y = 40. exp.funde: A_e(L_2), K₁ and A_2(L_e) independently with
      own Koenigs computation, deviation < 10⁻¹⁸ resp. 10⁻¹².'
    pruefung:
      f5_neue_frage: Which function of the two bases is A_b(L_d)? (Analytic in b, d up to the diagonal, log-singular there.)
      f3_spezialfall: Same dichotomy as kl.satz.basiswechsel_gleiches_L with roles swapped.
      f2_benutzte_voraussetzungen: 'Holomorphy of A_b at L_d (domain test: over 200 backward steps needed).'
      f1_folgt_unmittelbar: Yes, as soon as one takes the Paulsen–Cowgill condition.
      f4_uebertragbar: 'Complex bases with common upper fixed point: then the expression diverges like A_b(T_b(iy)) (kl.frage.gleiches_L_kneser).'
    bewertung:
      recherche: 'Literature map 12.10.2026: forum (tid 14, 236, 333, 578, 937, 1189, 1308), Paulsen–Cowgill 2017/2021, Paulsen 2016: the base
        change in the complex domain appears only as a branching problem (Trappmann–Levenstein 2009), as “undefined” (Levenstein 2014) or via
        Mellin (Nixon 2021); the limit A_b(L_d) in the imaginary direction was not found.'
      nutzen: New, convergent side of the base change above η.
      richtigkeit: complete
    voraussetzungen:
    - text: L_d ≠ L_b and A_b holomorphic at L_d
    - text: Kneser
      notiz: every tetration shifts the argument only by a 1-periodic function
    titel: In the imaginary direction the base change converges
    aussage: |
      $$A_b\bigl(T_d(iy)\bigr)\longrightarrow A_b(L_d)\quad(y\to+\infty),\qquad \Phi(w)=A_b(L_d)+\sum_{k\ge1}K_k\lambda_d^{kw},\quad K_1=A_b'(L_d).$$
      The approach is a damped rotation: decay rate $\arg\lambda_d$, rotation rate $\log|\lambda_d|$ (for real $d$: $\mathrm{Im}\,\lambda_d$ resp.
      $\log\log d+\mathrm{Re}\,\lambda_d$). For $b=e$, $d=2$: limit $0.326448651629+0.523513968910i$, $K_1=-0.0305475247-1.2919819448i$, period 30.63.
      For $d\to b$ one has growth $|A_b(L_d)|\sim|\log|L_d-L_b||/|\mathrm{Log}\lambda_b|$. Three directions: real → divergent with 1-periodic wave;
      imaginary upward → $A_b(L_d)$; downward → $A_b(\overline{L_d})$.
    bereich: $b\ne d>\eta$, Kneser tetration $T_d$, $\Phi(w)=A_b(A_d^{-1}(w))$; $L_d$ in the linearization domain of $E_b$ (backward orbit reaches
      $L_b$)
    einfach: If you let the height run not to the right but upward into the complex plane, the tetration runs into its fixed point instead of
      to infinity. There the other base is harmless, and the base change comes to rest — with a rotation that is damped so fast that you almost
      never see it.
  en_theorie:
    beispiel: |
      $b=e$, $d=2$: limit $A_e(L_2)=0.326448651629+0.523513968910\,i$, $K_1=-0.0305475247-1.2919819448\,i$. Rotation period $2\pi/\log|\lambda_2|=30.63$, damping
      $e^{-1.0865\,y}$ — over one rotation thus by a factor $3.5\cdot10^{-15}$. One almost never sees the rotation.
    einordnung: |
      Three directions: to the right divergent with 1-periodic wave ([[bw.satz.phasengesetz]]), upward toward $A_b(L_d)$, downward toward $A_b(\overline{L_d})$.
      The same dichotomy with roles swapped: [[kl.satz.basiswechsel_gleiches_L]]. Open for a common upper fixed point: [[kl.frage.gleiches_L_kneser]].
    genau: |
      For $b\ne d>\eta$ (with $L_d$ in the domain where $A_b$ is holomorphic):
      $$A_b\bigl(T_d(iy)\bigr)\to A_b(L_d)\quad(y\to+\infty),\qquad\Phi(w)=A_b(L_d)+\sum_{k\ge1}K_k\lambda_d^{kw},\quad K_1=A_b'(L_d).$$
      The approach is a damped rotation: decay rate $\arg\lambda_d$, rotation rate $\log|\lambda_d|$. Downward it goes toward $A_b(\overline{L_d})$.
    warum: |
      1. Near $L_d$, $T_d(w)=L_d+\lambda_d^w+O(\lambda_d^{2w})$ (Koenigs coordinate, suitably normalized).
      2. $A_b$ is holomorphic at $L_d$, hence Taylor in $\lambda_d^w$: this gives the series with $K_1=A_b'(L_d)$.
      3. $|\lambda_d^{iy}|=e^{-y\arg\lambda_d}\to0$ because $\arg\lambda_d>0$; the angle $y\log|\lambda_d|$ rotates. That Kneser runs toward $L_d$ at the top: [[kn.satz.kneser_eigenschaften]].
    worum: |
      To the right the tower grows to infinity, and the base change keeps its wave. But if one lets the height run **upward** into the complex plane,
      the tetration runs into its fixed point $L_d$ — and there the other base is harmless. The base change comes to rest.
- id: bw.satz.kern_eindeutig
  quelle_hash: c529e5dd80a5
  theorie_hash: 0d820a8674ce
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Difference $=h\circ A_d$; boundedness near $L$ kills modes $k<0$, near $\bar L$ modes $k>0$; reality + $V(1)=0$.
    pruefung:
      f5_neue_frage: —
      f3_spezialfall: Linearized version of the Kneser uniqueness.
      f2_benutzte_voraussetzungen: $\operatorname{Im}A_d\to\pm\infty$ radially near $L,\bar L$ — part of (K1).
      f1_folgt_unmittelbar: 'Yes: same mechanism as in Paulsen–Cowgill (mode argument).'
      f4_uebertragbar: Higher base derivatives (second order $H_d$).
    bewertung:
      recherche: Paper V.
      nutzen: Characterizes the kernel without an engine.
      richtigkeit: conditional, complete
    titel: Uniqueness of the base kernel (Paper V, Thm. 2)
    aussage: At most one function satisfies (i)–(iv).
    quellen:
    - stelle: Thm. 2
  en_theorie:
    einordnung: |
      Linearized version of [[kn.satz.paulsen_cowgill]]; tools [[fg.lem.periodisch_liouville]], [[fg.satz.kohomologisch]].
    genau: |
      Under (K1)–(K2) at most one function satisfies (i)–(iv) (Paper V, Thm. 2).
    warum: |
      1. The difference of two solutions solves the homogeneous equation, hence is $h\circ A_d$ with 1-periodic $h$.
      2. $h=\sum c_ke^{2\pi ikz}$. Near $L$, $\operatorname{Im}A_d\to+\infty$; boundedness there kills all modes with $k<0$. Near $\bar L$ correspondingly $k>0$.
      3. A constant remains; reality and $V(1)=0$ make it zero.
    worum: |
      At most one function satisfies the four selection conditions. The argument is the same as for the uniqueness of the Kneser solution, only one order deeper.
- id: bw.satz.kern_existenz
  quelle_hash: 2bbee1cceb04
  theorie_hash: cab52384e17a
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Privalov–Dini (Dini modulus $\delta\ln^2(1/\delta)$), Schwarz reflection, Riemann removability, pole expansion at $L$.
    pruefung:
      f5_neue_frage: 'Engine-free computation of the kernel: 17.8/20.0 digits reached.'
      f3_spezialfall: Classical scalar RH/conjugate-function problem on the circle.
      f2_benutzte_voraussetzungen: (K1)–(K2); (K3) only for the identification.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: Base-flow reconstruction (Paper VI).
    bewertung:
      recherche: Paper V.
      nutzen: Makes the base derivative constructive.
      richtigkeit: conditional, written out in full
    titel: Existence of the base kernel via an RH problem (Paper V, Thm. 13)
    aussage: $\tilde V\circ T_d:=V_{\mathrm{geo}}+g$ with $g=\tilde u-iu-\tilde u(0)$ satisfies (i)–(iv); with Thm. 2 exactly one solution; under
      (K3) (holomorphy in the base, kn.satz.paulsen_komplex) it is $\partial_\beta A_b|_{b=d}$.
    versionen:
    - aenderung: Solvability as a conjecture (weighted class, Fredholm route).
    - aenderung: Theorem in stronger form, no weighted class.
      grund: Collapse identity and Dini modulus.
    quellen:
    - stelle: Thm. 11, 13, Cor. 14
  en_theorie:
    beispiel: |
      Reached without the engine: 17.8 resp. 20.0 correct digits of the kernel.
    einordnung: |
      Uses [[bw.lem.geom_kozykel]] and [[br.satz.privalov]]. Basis of the reconstruction [[bw.satz.anker_rekonstruktion]]. Three wrong paths before it:
      [[bw.gescheitert.orbitanker]], [[bw.gescheitert.rh_v1]], [[bw.gescheitert.vorhersage_r8]].
    genau: |
      $\tilde V\circ T_d:=V_{\mathrm{geo}}+g$ with $g=\tilde u-iu-\tilde u(0)$ ($\tilde u$ the conjugate function of the boundary data $u$) satisfies (i)–(iv); with [[bw.satz.kern_eindeutig]] it is
      the only solution, and under (K3) (holomorphy in the base, [[kn.satz.paulsen_komplex]]) it is $\partial_\beta A_b|_{b=d}$ (Paper V, Thm. 13).
    warum: |
      1. $V_{\mathrm{geo}}$ satisfies (i) but is not real on the real axis; its imaginary part there is $u$.
      2. A periodic holomorphic function $g$ with $\operatorname{Im}g=-u$ on the axis is found with the periodic Hilbert transform (conjugate function).
      3. To make this work cleanly: Privalov–Dini for the boundary regularity (modulus $\delta\ln^2(1/\delta)$), Schwarz reflection, removable singularities, pole expansion at $L$.
    worum: |
      The base kernel really exists, and one can compute it without the engine: one takes the geometric field and corrects its imaginary part on
      the real axis by a periodic function. This is a classical boundary value problem (Riemann–Hilbert).
- id: bw.satz.minimalregularitaet
  quelle_hash: cd9cef224432
  theorie_hash: 79077ba9c6b8
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'Purely formal: $K\circ H=H\circ K=\mathrm{id}$ ⇒ $H''K''=1$.'
    pruefung:
      f5_neue_frage: —
      f3_spezialfall: Theorem on inverse functions on the circle.
      f2_benutzte_voraussetzungen: Both functions $C^1$.
      f1_folgt_unmittelbar: Yes (chain rule), as soon as both equations yield inverses.
      f4_uebertragbar: Arbitrary pairs of inverse lifts.
    bewertung:
      nutzen: Saves the positivity estimate.
      richtigkeit: complete
    titel: Minimal regularity principle (Paper II, Thm. C)
    aussage: $\mathrm{id}+\Phi$ and $\mathrm{id}+\Psi$ are mutually inverse $C^1$ diffeomorphisms with positive derivative. One-sided $C^1$ regularity
      is not enough.
    bereich: 1-periodic $\Phi,\Psi\in C^1$ with $\Psi(x+\Phi(x))=-\Phi(x)$, $\Phi(u+\Psi(u))=-\Psi(u)$
    quellen:
    - stelle: Thm. C, Ex. 5.1
  en_theorie:
    beispiel: |
      Why one-sided does not suffice: $H(x)=x-\frac{\sin2\pi x}{2\pi}$ is smooth and strictly increasing, but $H'(0)=0$; near $0$ one has $H(x)\approx\frac{(2\pi)^2}{6}x^3$, the inverse
      behaves like a cube root and is not differentiable at $0$.
    einordnung: |
      Saves the positivity estimate in [[bw.satz.c1_produkt]].
    genau: |
      If $\Phi,\Psi$ are 1-periodic, $C^1$, with $\Psi(x+\Phi(x))=-\Phi(x)$ and $\Phi(u+\Psi(u))=-\Psi(u)$, then $\mathrm{id}+\Phi$ and $\mathrm{id}+\Psi$ are mutually inverse
      $C^1$ diffeomorphisms with positive derivative (Paper II, Thm. C). One-sided $C^1$ regularity is not enough.
    warum: |
      The equations say $K\circ H=H\circ K=\mathrm{id}$ for $H=\mathrm{id}+\Phi$, $K=\mathrm{id}+\Psi$. Chain rule: $H'(K(u))\,K'(u)=1$, hence nowhere zero; increasing gives positive.
    worum: |
      When are two mutually inverse circle maps smooth with positive derivative? When both are $C^1$. One alone is not enough.
- id: bw.satz.paulsen_cowgill_hardy
  quelle_hash: 5c9b829b710e
  theorie_hash: 04a3eae8e1e2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Paulsen–Cowgill 2021, Indian J. Math. 63(1), 127–141. Content checked only via the zbMATH summary; proof route not read.
    pruefung:
      f5_neue_frage: Does the theorem answer Taranovsky's question (bw.frage.halbiter_vergleich) for Kneser, i.e., does exp_a^[c] − exp_b^[d]
        change sign infinitely often for suitable c < d? That requires the text.
      f3_spezialfall: 'Related to the phase law (bw.satz.phasengesetz): a nonconstant 1-periodic phase of the base change is exactly the kind
        of oscillation that disturbs a common Hardy ordering; whether the proof runs this way is unchecked.'
      f2_benutzte_voraussetzungen: Uniqueness of the tetration by Paulsen–Cowgill 2017 (kn.satz.paulsen_cowgill); further hypotheses not read.
      f1_folgt_unmittelbar: No (literature).
      f4_uebertragbar: 'Presumably not to Walker-type solutions: Levenstein conjectures compatibility there, but no analyticity (bw.frage.halbiter_vergleich).'
    bewertung:
      nutzen: Only peer-reviewed work on the comparison of tetrations to different bases; supports the wave of the base change.
      richtigkeit: Literature (text not read)
    titel: 'Paulsen–Cowgill 2021: Kneser tetrations to different bases fit into no common Hardy field'
    aussage: |
      Two Kneser tetrations $T_a$, $T_b$ with $a\ne b$ do not lie in a common Hardy field; likewise the fractional iterates
      $\exp_a^{[c]}$ and $\exp_b^{[d]}$ that they generate are compatible in no Hardy field.
      In a Hardy field every function eventually has a fixed sign as $x\to\infty$, so all functions are comparable in size.
      “Incompatible” therefore means: from the two functions one can form (with field operations and derivatives) one whose sign does not settle as $x\to\infty$.
    bereich: real bases $a\ne b$ above $\eta$; tetration = the analytic solution unique by Paulsen–Cowgill 2017 (Kneser) and the fractional iterates
      $\exp_a^{[c]}$ generated by it
    einfach: 'In a “Hardy field” all functions can be ordered by size: from some point on, each is larger than, equal to, or smaller than every
      other. Paulsen and Cowgill show that the Kneser tetrations to two different bases do not fit together into such an ordering — this is the
      rigorous form of the “wobble” one sees when converting between bases.'
    quellen:
    - stelle: zbMATH summary (Zbl 1470.39046)
    - stelle: 'Levenstein, post 4 (31.03.2018): announces the paper, wave picture slog_e(tet₂(x)) − x'
  en_theorie:
    einordnung: |
      Peer-reviewed support for the wave of the base change (Fox 2007, Levenstein 2009/2018); possibly the answer to [[bw.frage.halbiter_vergleich]] for Kneser.
      Growth classes of the half-exponential function: [[kn.satz.halbe_exp_wachstum]].
    genau: |
      For bases $a\ne b$ above $\eta$, $T_a$ and $T_b$ (the unique tetrations according to [[kn.satz.paulsen_cowgill]]) do not lie in a common
      Hardy field; likewise the fractional iterates of the exponential functions generated by them.
    warum: |
      We have not read the proof (only the zbMATH summary). On the meaning:
      1. A Hardy field is a field of functions (germs at $+\infty$), closed under differentiation; each of its functions eventually has a fixed sign.
      2. If $f$ and $g$ lie in a common Hardy field, then for example $f-g$ is eventually positive, negative or zero — they can be compared by size.
      3. Incompatible means: some function formed from $f$, $g$ and their derivatives changes its sign infinitely often. This is exactly what one expects if the
         base change carries a nonconstant periodic wave ([[bw.satz.phasengesetz]]).
    worum: |
      If one converts the Kneser tetration to base 2 into heights of base $e$, a small wobble remains that never disappears. Paulsen and Cowgill proved the
      rigorous form of this: the two functions cannot be fitted into a common order of magnitude.
- id: bw.satz.phasengesetz
  quelle_hash: 075e1583e5e1
  theorie_hash: b142e8602aba
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Thm. 5.6 + local Lipschitz continuity of $A_b$.
    pruefung:
      f5_neue_frage: Regularity of $P$ (strip? Gevrey?) and size of $\mu$.
      f3_spezialfall: 'General pattern: comparing two Abel coordinates ⇒ asymptotically periodic deviation (cf. kl.beob.zwei_abel for two fixed
        points).'
      f2_benutzte_voraussetzungen: Hyp. 2.2 (R3) for $A_b$; Hyp. 2.4 by now discharged.
      f1_folgt_unmittelbar: Yes, from Thm. 5.6.
      f4_uebertragbar: 'Not directly to $1<b,d<\eta$ (regular branches): there bounded towers, Hyp. 2.4 false.'
    bewertung:
      recherche: 'The phenomenon is known in the Tetration Forum: J. D. Fox (2007) wrote down the base-change formula with an additive constant
        μ, S. Levenstein (2009) measured slog_2 − slog_e ≈ 1.1282 etc. and noted that the change “wobbles a little”. Not found there as a theorem
        with proof (tail convergence, periodicity, mean plus wave) — that presumably remains new. Addendum 12.10.2026 (literature map L2): S.
        Levenstein plotted in 2018 (tid 1189) the 1-periodic limit function slog_e(tet₂(x)) − x for Kneser; W. Paulsen and S. Cowgill proved in
        2021 that Kneser tetrations of different bases do not fit into a common Hardy field (bw.satz.paulsen_cowgill_hardy) — peer-reviewed support
        for the wave, but not a phase law.'
      nutzen: Central result of the series; explains the observed non-scalarity.
      richtigkeit: conditionally proved
    titel: Mixed-base phase law (Paper I, Thm. 5.7)
    aussage: $\operatorname{slog}_b(T_d(x))-x=\mu_{b,d}+P_{b,d}(\{x\})+o(1)$ for $x\to+\infty$, $P$ 1-periodic with mean 0.
    versionen:
    - aenderung: Prior work from the tetration forum (2007, 2009) entered.
    quellen:
    - stelle: Thm. 5.7
    - stelle: Constant μ (assumed exact)
    - stelle: Values and “wobbles”
    - stelle: 'Levenstein 31.03.2018: picture of the 1-periodic limit function for Kneser 2 toward e'
    - stelle: Hardy field incompatibility (zbMATH)
  en_theorie:
    beispiel: |
      $(e,2)$: $\mu=-1.128403776628924\ldots$, the wave has amplitude $1.44\cdot10^{-4}$. $(e,3)$: $\mu=+0.192422293722\ldots$, amplitude $3.7\cdot10^{-5}$.
      Our own recomputation hits the stored Fourier table to $4\cdot10^{-24}$.
    einordnung: |
      Prehistory in the Tetration Forum: J. D. Fox wrote down in 2007 the base-change formula ${}^xa=\lim\log_a^{\circ n}\bigl({}^{n+x+\mu_b(a)}b\bigr)$ with a fixed constant
      $\mu$. S. Levenstein measured in 2009 $\operatorname{slog}_2-\operatorname{slog}_e\approx1.1282$ (our $-\mu_{e,2}$) and noted that the change “wobbles a little” —
      the wave $P$. The phase law turns these observations into a theorem with proof.

      Below $\eta$ there is no wave in Koenigs coordinates ([[kl.satz.koenigs_basiswechsel]]), and likewise none at the common fixed point
      ([[kl.satz.basiswechsel_gleiches_L]]). In the vertical direction the base change comes completely to rest ([[bw.satz.imaginaere_richtung]]). The pattern “two Abel coordinates differ periodically” on a small scale: [[kl.beob.zwei_abel]]. How smooth the wave is, is disputed:
      [[bw.verm.streifen]] versus [[bw.verm.nirgends_analytisch]].
    genau: |
      $$\operatorname{slog}_b(T_d(x))-x=\mu_{b,d}+P_{b,d}(\{x\})+o(1)\qquad(x\to+\infty),$$
      $P_{b,d}$ 1-periodic with mean $0$, $\{x\}$ the fractional part (Paper I, Thm. 5.7; conditional on Hyp. 2.2/2.4).
    warum: |
      1. By [[bw.def.F_bd]] the left side at $x=n+\theta$ equals $A_b(D_n(\theta))-\theta$.
      2. $D_n\to D$ uniformly ([[bw.satz.schwanzkonvergenz]]) and $A_b$ is Lipschitz continuous, so it converges to $\Phi(\theta)=A_b(D(\theta))-\theta$.
      3. Periodic: $D_n(1)=\log_b^{\circ n}T_d(n+1)$ and $D_{n+1}(0)=\log_bD_n(1)$, so $\Phi(1)=\Phi(0)$. Splitting into mean and remainder gives $\mu+P$.
      4. Why $P$ is not zero is a story of its own ([[bw.satz.ursache_kozykel]]).
    worum: |
      The central result: If one translates the height from the tower to base $d$ into heights to base $b$, one gets almost a fixed shift $\mu$ —
      plus a tiny wave $P$ that repeats with every integer height. It never goes away.
- id: bw.satz.phasengesetz_gestoppt
  quelle_hash: cd319296ab96
