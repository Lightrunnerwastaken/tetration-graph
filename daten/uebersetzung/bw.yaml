    titel: Correction Round 20 — the sector is a solver artifact
    aussage: |
      The tip lies exactly on the $\pi/2$ rotation curve $\operatorname{Re}T_d(m+z)=0$ of the topmost closing level of the solver,
      $y=(\pi/2)/(\ln d\cdot T_d'(m-1+x))$ (0.0595 at $x=1.001$); the “universal 0.058” is conjugation invariance of
      $\operatorname{Im}[\ln d\,T_d(m+z)]$. The exact finite residual $R(n+z)$ runs smoothly through the zone.
    quellen:
    - stelle: Round 20, R20_SINGULARITY_STRUCTURE.md
  en_theorie:
    einordnung: |
      Refutes [[bw.beob.singularitaet]] and replaces [[bw.verm.universell]]. Rule for every singularity search with solvers: check breakdowns against an exact ladder.
    genau: |
      The tip lies exactly on the $\pi/2$ rotation curve $\operatorname{Re}T_d(m+z)=0$ of the topmost level, $y=\dfrac{\pi/2}{\ln d\cdot T_d'(m-1+x)}$ ($0.0595$ at $x=1.001$).
      The “universal $0.058$” is a consequence of the fact that $\operatorname{Im}[\ln d\,T_d(m+z)]$ stays the same under conjugation. The exact finite residual $R(n+z)$
      runs smoothly through the zone.
    warum: |
      Cross-check against the exact logarithm ladder: below the zone the Fourier series agrees to $9\cdot10^{-43}$, in the zone the exact residual
      is smooth. Once the exponent $\ln d\cdot T_d(m+z)$ reaches imaginary part $\pi/2$, $d^{T}$ is purely imaginary and the next logarithm jumps — an artifact of the level.
    worum: |
      Round 20 exposed the “singular sector”: it sits exactly on a curve that only the solver knows — there its last step turns the value into the
      imaginary direction.
