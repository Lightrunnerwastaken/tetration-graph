    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f5_neue_frage: Internal predictors predict the blind error to within a factor ~1 — that is itself a checkable finding.
      f3_spezialfall: —
      f2_benutzte_voraussetzungen: Sealed target values; internal error predictors.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      recherche: Paper VI.
      nutzen: Validates the method.
      richtigkeit: numerical, blind
    titel: Blind validation of the reconstruction at base 2
    aussage: '65-node flow: pointwise $4.0\cdot10^{-21}$ at 48 points, hub 30.6 digits. Ten-segment march: $7.6\cdot10^{-11}$ to both references;
      failure and subdivision of the boundary segment as predicted by the Ovsyannikov criterion.'
    quellen:
    - stelle: Abstract, §12
    - stelle: Rounds 11–16
  en_theorie:
    einordnung: |
      Validates [[bw.satz.anker_rekonstruktion]].
    genau: |
      65-node flow: pointwise $4.0\cdot10^{-21}$ at 48 points, hub to $30.6$ digits. Ten-segment march: $7.6\cdot10^{-11}$ to both references. Failure and subdivision
      of the boundary segment exactly as predicted by the Ovsyannikov criterion.
    warum: |
      Measured. Remarkable: the internal error estimators predicted the blind error to within about a factor $1$ — that is itself a checkable finding.
    worum: |
      The reconstruction was tested blind: the target values for base $2$ were sealed until the computation was finished.
