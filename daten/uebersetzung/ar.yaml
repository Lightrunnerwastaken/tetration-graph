      For every increasing tetration to base $e$: Of two values at distance $1$, at least one is transcendental — everywhere except at $-1$ (there $T(-1)=0$, $T(0)=1$).
- id: ar.lem.nullstellen
  quelle_hash: 01e4c4aa87ac
  theorie_hash: 9d093d4adc03
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Jensen on $D(1,2.9)$; lower bound at $z=1$ via Mahler's transcendence measure for $e=T(1)$.
      luecken:
      - From $\log((d+1)H)$ a term $d^2\log^2(d+1)$ arises that does not appear explicitly in the bound (absorbable for $H\ge d$).
      - Constants not carried out; case $P(1,Y)\equiv0$ only sketched.
    pruefung:
      f4_uebertragbar: Every solution that is holomorphic on $\bar D(1,R)$, $R>1.2$.
      f5_neue_frage: Polylog counting bound → ar.satz.masser_typ
      f1_folgt_unmittelbar: No — combination of Jensen + transcendence measure.
      f2_benutzte_voraussetzungen: Holomorphy on $\bar D(1,2.9)$ (any radius > 1.2 around 1 would do, with other constants) and $T(1)=e$; Kneser
        only for the holomorphy.
      f3_spezialfall: Masser's method for ζ (transcendence measure of π at even points).
    bewertung:
      recherche: 'A1: no tetration-specific template known.'
      nutzen: Key to the polylog bound.
      richtigkeit: Sketch, bookkeeping of constants open
    voraussetzungen:
    - text: T holomorphic and bounded on the closed disk D̄(1, 2.9)
    - text: T(1) = e (holds for every solution with T(0)=1)
    - text: T = Kneser
      notiz: only holomorphy on D̄(1,2.9) is used
    titel: Zero bound for P(z, T_e(z)) (A1, Lemma 5.1)
    aussage: $F(z)=P(z,T(z))$ has at most $c_1d^2\log(d+1)\log(H+2)+c_2d$ zeros in $D(1,1.2)$.
    bereich: $P\in\mathbb Z[X,Y]$, degrees $\le d$, height $\le H$, disk $D(1,1.2)$
    quellen:
    - stelle: Lemma 5.1
  en_theorie:
    einordnung: |
      Needs only holomorphy on $\bar D(1,2.9)$ ([[kn.satz.kneser_eigenschaften]]). Key for [[ar.satz.masser_typ]].
    genau: |
      **Sketch.** For $P\in\mathbb Z[X,Y]$ with degrees $\le d$ and height $\le H$, $F(z)=P(z,T(z))$ has at most $c_1d^2\log(d+1)\log(H+2)+c_2d$ zeros in the disk $D(1,1.2)$ (A1, Lemma 5.1).
    warum: |
      1. Jensen's formula on the larger disk $D(1,2.9)$: many zeros force $|F(1)|$ to be small, because $|F|$ is bounded on the boundary.
      2. Lower bound: $F(1)=P(1,e)$, and Mahler's transcendence measure for $e$ says how small an integer polynomial in $e$ can be at most.
      3. Together these bound the number of zeros. Gaps: constants not carried out; a term $d^2\log^2(d+1)$ is missing in the bound (absorbable for $H\ge d$); the case $P(1,Y)\equiv0$ is only sketched.
    worum: |
      An auxiliary lemma for the sharper counting bound: A polynomial in $z$ and $T(z)$ cannot have too many zeros in a disk — otherwise it would be too small to have, at the point $z=1$
      (where $T(1)=e$), the value that $e$, as a transcendental number, forces.
- id: ar.satz.algebraische_basen
  quelle_hash: 9e38e437a74a
  theorie_hash: ae9749136b67
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Gelfond–Schneider.
    pruefung:
      f4_uebertragbar: All solutions.
      f5_neue_frage: Base $e$ is stricter than algebraic bases.
      f1_folgt_unmittelbar: Yes.
      f2_benutzte_voraussetzungen: Only the equation at one point.
      f3_spezialfall: Yes.
    bewertung:
      nutzen: Comparison of the bases.
      richtigkeit: complete
    titel: Algebraic bases
    aussage: (i) $T_b(x)$ algebraic irrational ⇒ $T_b(x+1)$ transcendental; (ii) $T_b(x)\in\mathbb Q$ ⇒ $T_b(x+1)=b^{p/q}$ algebraic.
    bereich: algebraic $b>1$
    quellen:
    - stelle: Thm. 3
  en_theorie:
    beispiel: |
      Base $2$: Where $T_2(x)=\tfrac12$, we have $T_2(x+1)=\sqrt2$ (algebraic) and $T_2(x+2)=2^{\sqrt2}$ (transcendental).
    einordnung: |
      Unlike for base $e$, two neighbors may both be algebraic here — rational values are the back door. Comparison: [[ar.satz.orbitschranke]].
    genau: |
      For algebraic $b>1$: (i) If $T_b(x)$ is algebraic and irrational, then $T_b(x+1)$ is transcendental. (ii) If $T_b(x)=p/q$ is rational, then $T_b(x+1)=b^{p/q}$ is algebraic.
    warum: |
      (i) is Gelfond–Schneider with $a=b$, $c=T_b(x)$. (ii) is direct: a rational power of an algebraic number is algebraic.
    worum: |
      For algebraic bases such as $2$ or $\sqrt2$, Gelfond–Schneider helps one step: An algebraic, irrational tower value makes the next one transcendental.
