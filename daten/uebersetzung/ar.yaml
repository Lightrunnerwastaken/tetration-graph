  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f4_uebertragbar: Same procedure for $T_2(1/2)$.
      f5_neue_frage: An interval certificate of the digits would make the exclusions rigorous.
      f1_folgt_unmittelbar: No; LLL certificate via Gram–Schmidt minimum.
      f2_benutzte_voraussetzungen: Correctness of the 1973 digits (error-vector method, not interval-certified).
      f3_spezialfall: —
    bewertung:
      recherche: A1.
      nutzen: Strongest evidence against low algebraic structure.
      richtigkeit: rigorous relative to the digits
    titel: T_e(1/2) is not rational with denominator ≤ 10^983
    aussage: |
      From 1973 digits: no rational value with denominator $\le10^{983}$ (1936 partial quotients), not algebraic of degree
      $d$ under heights $10^{949}$ ($d=1$) … $10^{5}$ ($d=200$); no relation to $e,\pi,\ln p,\gamma,\zeta(3),\Omega,L,\ldots$;
      continued fraction statistics generic (Khinchin 2.650, Lévy 1.171).
    quellen:
    - stelle: Part A
  en_theorie:
    beispiel: |
      For a “typical” real number the geometric mean of the partial quotients is Khinchin's constant $2.685$; measured $2.650$ — unremarkable.
    einordnung: |
      Supports [[ar.verm.ks]]. The digits: [[kn.beob.referenzwerte]]. An interval certificate of the digits would make the exclusions rigorous.
    genau: |
      From 1973 digits of $T_e(\tfrac12)$: no rational value with denominator $\le10^{983}$ (1936 partial quotients); not algebraic of degree $d$ below heights $10^{949}$ ($d=1$) to $10^5$ ($d=200$); no relation
      to $e,\pi,\ln p,\gamma,\zeta(3),\Omega,L,\dots$; continued fraction statistics generic (Khinchin mean $2.650$, Lévy constant $1.171$).
    warum: |
      1. A fraction $p/q$ with $|T-p/q|<1/(2q^2)$ shows up as a continued fraction approximation; the continued fraction expansion from 1973 digits contains none with small $q$.
      2. For algebraic numbers of higher degree the LLL algorithm searches for short integer relations; the Gram–Schmidt minimum certifies that none exists below the height bound.
      3. Rigorous relative to the digits — which themselves are not interval-certified.
    worum: |
      Is $T_e(\tfrac12)$ perhaps a simple fraction or a simple algebraic number? With almost 2000 digits one can rule this out for huge denominators and heights.
- id: ar.beob.keine_relationen
  quelle_hash: 130fc995dca3
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'No formula with π, e, γ, ζ(3), Γ(¼) …: 50 tetration constants checked to 160 digits'
    aussage: |
      Checked to 160 reliable digits (levels dps 120/160/200): Kneser values for the bases $e$ and 2 ($T_e(\tfrac12)=1.6463542337511945809\ldots$, $T(-\tfrac12)$,
      $\mathrm{slog}$ values), the Taylor coefficients $a_1\ldots a_{15}$ of $\mathrm{sexp}_e$ at 0, $\mathrm{slog}'(0)$, $\mathrm{slog}''(0)$,
      $\int_0^1T_e=1.7145219588906204882\ldots$, $\int_{-1}^0T_e$, the constants $D$ and $0!_2$ of the exponential factorial, $\mathrm{prodtet}_e(\tfrac12)$,
      Fatou constants and the θ coefficients. Against 23 classical constants (π, e, $e^e$, γ, ln 2, ln 3, ln π, ζ(3), Catalan, Γ(¼), Γ(⅓), Ω, $L$, …)
      there is **no integer relation with coefficient norm below about $4\cdot10^5$**; against small bases of five constants such as $\{1,\pi,e,\gamma,\ln2\}$ none below
      $10^{22}$; no product of powers below $10^{9}$; no algebraic number of degree $\le6$ with height below $10^{19}$.
      Near-hits vanish at full precision: $\mathrm{slog}'(0)=0.915946$ versus Catalan $0.915966$, $T_e(\tfrac12)$ versus $\tfrac{19}8\ln2$,
      $0!_2$ versus γ. The method rediscovers three built-in control formulas.
    einfach: We computed 50 numbers from tetration to exactly 160 digits and had the computer search for formulas with π, e, Euler's constant
      and many others. There are none — at least none with reasonably small numbers in them. A few numbers look familiar in their first digits,
      but that is coincidence.
    pruefung:
      f1_folgt_unmittelbar: No (lattice reduction); the bounds are rigorous for the respective LLL lattice.
      f2_benutzte_voraussetzungen: Kneser values from the fatou.gp fork, accuracy secured over three levels; hits count only if they hold 15 further
        digits.
      f3_spezialfall: 'no'
      f4_uebertragbar: To every new constant (base η, pentation, half rank).
      f5_neue_frage: Are there constants that belong to Kneser alone (Fourier decay of θ, kn.frage.theta_exponent)?
    bewertung:
      nutzen: Rules out simple formulas for the known Kneser numbers and answers gr.frage.integral_form negatively for small coefficients.
      richtigkeit: numerical, rigorous lattice bounds
    quellen:
    - stelle: forschung/identitaeten_2026_10_14/BERICHT_ETAPPE1.md, Table 2; a_relationen.py, daten/relationen.json
- id: ar.frage.e_hoch_e
  quelle_hash: 4853cefd39bb
  theorie_hash: 4f9db302b632
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: None — classical open problem.
    titel: Is e^e = T_e(2) transcendental?
    aussage: Open (follows from Schanuel). The question for $T_e(1/2)$ lies beyond that.
    quellen:
    - stelle: Schanuel's conjecture; e^e as a consequence
    - stelle: Remark after Corollary 1
  en_theorie:
    beispiel: |
      $e^e=15.15426224\ldots$ It is not even proved that this number is irrational. Equally open are $\pi^e$, $e^{\pi^2}$ and $\pi^\pi$ — whereas $e^\pi$, as $(-1)^{-i}$, is transcendental by Gelfond–Schneider.
    einordnung: |
      Classical open problem. Unconditionally only [[ar.satz.orbitschranke]] works; conditionally [[ar.satz.schanuel_orbit]].
    genau: |
      Is $e^e=T_e(2)$ transcendental? Open; it follows from Schanuel's conjecture. The question for $T_e(\tfrac12)$ lies even further beyond.
    warum: |
      Hermite–Lindemann needs an algebraic exponent; $e$ is transcendental. Gelfond–Schneider needs an algebraic base. Both are missing for $e^e$.
    worum: |
      The limit of what can be proved today already lies at the second level: Nobody knows whether $e^e$ is transcendental — indeed not even whether it is irrational.
- id: ar.frage.ef_fortsetzung
  quelle_hash: 65bddeda5003
  theorie_hash: 1d9a3014d4f7
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    pruefung:
      f4_uebertragbar: To other “factorials” of hyperoperations.
      f5_neue_frage: Where should γ come from?
      f1_folgt_unmittelbar: No, open.
      f2_benutzte_voraussetzungen: Total monotonicity as uniqueness condition.
      f3_spezialfall: Analogous to Gamma (Bohr–Mollerup) and tetration.
    bewertung:
      nutzen: Shows the same uniqueness problem for a neighboring object.
      richtigkeit: open
    titel: 'TPID 2: Is there a natural smooth exponential factorial — and is EF(0) = γ then?'
    aussage: |
      $\mathrm{EF}(x)=x^{\mathrm{EF}(x-1)}$ for real $x$ requires, like tetration, an additional condition. Conjecture in the forum (TPID 2): Under total monotonicity
      (like Szekeres' characterization, it.satz.szekeres_monoton) there is exactly one solution, and for it $\mathrm{EF}(0)$ would be the Euler–Mascheroni constant $\gamma=0.5772\ldots$
    einfach: 'As with tetration, one asks how the exponential factorial continues between the integers. A forum conjecture says: With a natural
      smoothness condition there is exactly one answer, and at 0 Euler''s constant would come out.'
  en_theorie:
    beispiel: |
      Integer values: $\mathrm{EF}(1)=1$, $\mathrm{EF}(2)=2$, $\mathrm{EF}(3)=9$, $\mathrm{EF}(4)=262144$.
    einordnung: |
      Counterpart to [[br.frage.bohr_mollerup]].
    genau: |
      Conjecture (forum, TPID 2): Under total monotonicity there is exactly one continuation, and then $\mathrm{EF}(0)=\gamma=0.5772156649\ldots$
    warum: |
      The hope comes from the model of the gamma function, which becomes unique through logarithmic convexity (Bohr–Mollerup). There is no evidence.
    worum: |
      The same problem as for tetration, on a neighboring object: How does one continue $\mathrm{EF}(x)=x^{\mathrm{EF}(x-1)}$ smoothly?
- id: ar.frage.ganze_tuerme
  quelle_hash: d261a201631a
  theorie_hash: be0e5f52ae2a
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: All the questions follow from Schanuel; without Schanuel even $e^e$ is open (ar.frage.e_hoch_e).
    titel: 'Open number questions: is ⁴π or ⁵e an integer? Is ⁿq ever rational?'
    aussage: |
      Open are (Wikipedia, section “Open questions”): Is ${}^4\pi$ or ${}^5e$ an integer? Is ${}^nq$ for rational, non-integer $q$ and $n\ge4$ ever rational?
      Is the positive solution of ${}^nx=2$ for $n\ge4$ rational? Known: for $n=2$ transcendental, for $n=3$ irrational (ar.satz.superwurzel_arith); ${}^2q$ irrational,
      ${}^3q$ transcendental (ar.satz.rationale_tuerme).
    quellen:
    - stelle: Open questions
  en_theorie:
    einordnung: |
      All these questions would follow from the Schanuel conjecture ([[ar.verm.schanuel]]); without it even $e^e$ is open ([[ar.frage.e_hoch_e]]).
    genau: |
      Open (Wikipedia, “Open questions”):
      - Is ${}^4\pi$ or ${}^5e$ an integer?
      - Is ${}^nq$ for rational, non-integer $q$ and $n\ge4$ ever rational?
      - Is the positive solution of ${}^nx=2$ for $n\ge4$ rational?

      Known: ${}^2q$ irrational, ${}^3q$ transcendental ([[ar.satz.rationale_tuerme]]); solution of ${}^2x=2$ transcendental, of ${}^3x=2$ irrational ([[ar.satz.superwurzel_arith]]).
    warum: |
      ${}^4\pi=\pi^{\pi^{\pi^\pi}}$ is about $10^{6.7\cdot10^{17}}$, so has around $6.7\cdot10^{17}$ digits before the decimal point — one cannot even determine the last of them. And the
      transcendence theorems (Gelfond–Schneider) only reach exponents that are themselves algebraic.
    worum: |
      Remarkably little is known about the numbers in towers. Even such simple questions as “Is ${}^4\pi$ an integer?” are open — not because they sound hard,
      but because one cannot even compute ${}^4\pi$ precisely enough to check.
- id: ar.konstr.ef_profinit
  quelle_hash: b906f2c50afa
  theorie_hash: 3ec91e548bf8
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: 'Profinite exponential factorial: Ê(0) = 0, Ê(−1) = Ê(1) = 1'
    aussage: |-
      $\hat E(x)\bmod m:=EF(n)\bmod m$ for $n\equiv x\pmod{\tilde\Lambda(m)}$, $n\ge N(m)$, defines a continuous map $\hat E:\hat{\mathbb Z}\to\hat{\mathbb Z}$ with $\hat E(x)=x\star\hat E(x-1)$ and
      $$\hat E(0)=0,\quad\hat E(1)=1,\quad\hat E(-1)=1,\quad\hat E(2)=(0;2,2,2,\dots)\ (\text{2-adisch }0,\text{ sonst }2),\quad\hat E_2(x)=[x\text{ ungerade}].$$
      In the sense of TPID 2, "$EF(0)$" is therefore profinitely 0, not $\gamma$: the profinite extension does not answer the real question, but shows $\hat E(-1)=\hat E(1)$.
    bereich: $\hat{\mathbb Z}=\varprojlim\mathbb Z/m$; $\tilde\Lambda(m)$ and $N(m)$ as in ar.satz.ef_periode
    einfach: One can also define the exponential factorial for "numbers" that live in all residue classes at the same time. There, 0 gives the
      number 0 and −1 gives the number 1.
    beweis:
      text: |-
        Compatible, since $\tilde\Lambda(m)\mid\tilde\Lambda(m')$ for $m\mid m'$. $\hat E(0)=0$, because $m\mid n$. $\hat E(-1)=1$: $n$ odd, $EF(n-1)$ even, $n\equiv-1\bmod p^k$, so $(-1)^{\rm gerade}=1$.
        $\hat E(2)$: exponent $\equiv\hat E(1)=1\bmod\lambda(p^k)$, so 2 in $\mathbb Z_p$ ($p$ odd), 0 in $\mathbb Z_2$.
    gegenbeispielsuche: Table for $2^{20},3^{12},5^8,7^6,10^6$ (E4c).
    pruefung:
      f1_folgt_unmittelbar: Yes, as soon as the period is known.
      f2_benutzte_voraussetzungen: ar.satz.ef_periode (compatibility of the periods).
      f3_spezialfall: Analogous to the profinite tower limit α̂ (ar.satz.pentation_block_konstant).
      f4_uebertragbar: To every sequence that is eventually periodic modulo every m with compatible periods.
      f5_neue_frage: Does Ê have further "nice" values, for instance at −2 or 1/2 ∈ ℤ̂ (for odd moduli)?
    bewertung:
      nutzen: Profinite answer to "EF(0)"; separates the arithmetic from the analytic extension.
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_18/04_arithmetik/BERICHT.md, B16; e4c_vorperiode2.py
    - {}
  en_theorie:
    einordnung: Arithmetic answer next to the analytic question [[ar.frage.ef_fortsetzung]] and [[ar.satz.ef_null_ableitung]].
    genau: $\hat E:\hat{\mathbb Z}\to\hat{\mathbb Z}$ continuous, $\hat E(0)=0$, $\hat E(\pm1)=1$.
    warum: The periods $\tilde\Lambda(m)$ are compatible, so the residues for $n\equiv x$ define a value in every $\mathbb Z/m$.
    worum: Can $EF$ be extended to profinite numbers — and what is "$EF(0)$" then?
- id: ar.konstr.ef_sexp
  quelle_hash: 5ee278549c55
  theorie_hash: 6a9ac9144b13
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: Exponential factorial continued via tetration — and what it gives at 0 (TPID 2)
    aussage: |
      The sequence $n!_2$ ($1,2,9,262144,5^{262144},\dots$) grows like tetration: $D=\lim_n(\mathrm{slog}_e(n!_2)-n)$ exists, and one continues by
      $$x!_2=\lim_{k\to\infty}\log_{x+1}\Bigl(\log_{x+2}\bigl(\cdots\log_{x+k}(\mathrm{sexp}_e(x+k+D))\bigr)\Bigr).$$
      Computed with Kneser ($\mathrm{slog}_e(1)=0$): $D=-1.0552140087127$ (stable to 13 digits from $n=6$ on). The formula gives $1!_2=1$ and $2!_2=2$ to
      $10^{-12}$ and converges doubly exponentially in $k$: $0.5!_2=0.7575097219$, $1.5!_2=1.3595364027$.
      The forum value $D\approx-0.0613312423$ does not fit this normalization (with it the formula would give $1!_2\approx3.5$); where it comes from is unclear.
      **As $x\downarrow0$** the continuation has the limit $0.573049\ldots$ — astonishingly close to the Euler–Mascheroni constant $\gamma=0.577216$
      from the conjecture TPID 2 (ar.frage.ef_fortsetzung), but off by $0.004$. So this continuation is, if TPID 2 is correct, not the
      totally monotone one.
    bereich: $x!_2=x^{(x-1)!_2}$, $1!_2=1$; Kneser $\mathrm{sexp}_e$ with $\mathrm{sexp}_e(0)=1$; real $x>0$
    einfach: 'The exponential factorial (4 to the power 3 to the power 2 to the power 1 and so on) grows almost exactly like a tetration. So far
      out one can use tetration and compute back with logarithms — this gives values between the integers. At 0 about 0.573 comes out: close to
      the famous number 0.5772 from an old conjecture, but not equal.'
    formen:
    - notiz: Kneser, $\mathrm{slog}_e(1)=0$
    - notiz: for this continuation
    pruefung:
      f1_folgt_unmittelbar: No; the convergence is measured, not proved (the forum explicitly gives no proofs).
      f2_benutzte_voraussetzungen: Kneser sexp and slog from gp-tetration; logarithms of the huge values moved forward symbolically by one level;
        40–60 digits.
      f3_spezialfall: 'Yes: a case of the limit trick with a comparison function (br.satz.vergleichsfunktion).'
      f4_uebertragbar: To every tower sequence with alternating bases; with another comparison function (say tetration to base 2) one gets a perhaps
        different continuation.
      f5_neue_frage: Does the limit at 0 depend on the comparison function? Is there a comparison function that gives $\gamma$ — or is TPID 2
        false?
    bewertung:
      nutzen: First precise numbers for this continuation and a concrete test of TPID 2.
      richtigkeit: numerical; integer check to 10⁻¹²
    quellen:
    - {}
    - stelle: D in Kneser normalization, integer check, limit at 0 (13.10.2026)
  en_theorie:
    beispiel: |
      $x=0.01$: $0.576448$; $x=0.001$: $0.573389$; $x=10^{-5}$: $0.573052$ (each independent of $k=6,7$ to 12 digits).
    einordnung: |
      The conjecture behind it: [[ar.frage.ef_fortsetzung]]; the trick in general: [[br.satz.vergleichsfunktion]]; arithmetic of the exponential factorial: [[ar.satz.ef_liouville]].
    genau: |
      $D=\lim(\mathrm{slog}_e(n!_2)-n)=-1.0552140087$; $x!_2=\lim_k\log_{x+1}\cdots\log_{x+k}(\mathrm{sexp}_e(x+k+D))$; $\lim_{x\downarrow0}x!_2=0.573049\ldots$
    warum: |
      $n!_2$ is a tower with falling bases $n,n-1,\dots,2$. The upper bases change the value only little — soon the tower grows like a tower of all
      equal bases, i.e. like a tetration, shifted in height by a fixed amount $D$. Far out one replaces the tower by
      $\mathrm{sexp}_e(x+k+D)$ and goes back with logarithms to the bases $x+k,\dots,x+1$; each step makes the error doubly exponentially smaller.
      As $x\to0$ the last base $x+1$ becomes 1 — the logarithm to this base divides by $\ln(1+x)\approx x$, which is why very
      long chains (k = 7) and many digits are needed there. The limit $0.57305$ is close to $\gamma$, but stably different from it.
    worum: |
      How to fix $x!_2=x^{(x-1)!_2}$ between the integers by holding on to tetration far out — and what this means for TPID 2.
- id: ar.kor.benachbart
  quelle_hash: 947e7df0c273
  theorie_hash: 45532a827333
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: ar.satz.orbitschranke with $T(x)\ne0$.
    pruefung:
      f4_uebertragbar: 'Class B: all strictly increasing solutions (also linear, regular).'
      f5_neue_frage: —
      f1_folgt_unmittelbar: Yes.
      f2_benutzte_voraussetzungen: Only the location of the zero; A1 is formulated for Kneser — unnecessarily narrow.
      f3_spezialfall: Yes.
    bewertung:
      nutzen: Low.
      richtigkeit: complete
    voraussetzungen:
    - text: T(y) = 0 only for y = −1
    - text: T = Kneser (A1, Corollary 1)
      notiz: every strictly increasing solution suffices
    titel: For every increasing tetration, one of T(x), T(x+1) is transcendental
    aussage: For $x>-2$, $x\ne-1$ at least one of the values $T(x)$, $T(x+1)$ is transcendental.
    bereich: real solutions to base $e$ whose only zero is at $-1$ (e.g. strictly increasing)
    versionen:
    - aenderung: for Kneser's tetration
    - aenderung: extended to all solutions with sole zero −1
      grund: Check question 2
    quellen:
    - stelle: Corollary 1
  en_theorie:
    beispiel: |
      Kneser: $T_e(\tfrac12)=1.6463542\ldots$ or $T_e(\tfrac32)=e^{1.6463542\ldots}=5.1880\ldots$ — at least one of the two numbers is transcendental. Which one is not known.
    einordnung: |
      Formulated in A1 for Kneser, but holds for every strictly increasing solution — also linear and regular.
    genau: |
      For real solutions to base $e$ whose only zero is at $-1$ (e.g. strictly increasing) and $x>-2$, $x\ne-1$, at least one of the values $T(x)$, $T(x+1)$ is transcendental.
    warum: |
      For $x\ne-1$ we have $T(x)\ne0$; then [[ar.satz.orbitschranke]].
    worum: |
      For every increasing tetration to base $e$: Of two values at distance $1$, at least one is transcendental — everywhere except at $-1$ (there $T(-1)=0$, $T(0)=1$).
- id: ar.kor.padisch_hoehere_raenge
  quelle_hash: 40d8a9edc80e
  theorie_hash: f3df6ea0d131
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: All hyperoperations of rank 4 and above have the same p-adic limit — 3↑↑↑3 has exactly 7 625 597 484 986 finished final digits
    aussage: |-
      Every $H_r(a,n)$ with $r\ge4$ is a tower $a\uparrow\uparrow M_r(a,n)$ with $M_r(a,n)\to\infty$ (pentation: $M=a\uparrow\uparrow\uparrow(n-1)$). Hence all ranks $r\ge4$ have
      the same limit $\alpha_p(a)$, and $v_p(H_r(a,n)-\alpha_p(a))=V_p(a)(M-t_p(a))$. Decimal: $D=\min$ of the 2-adic and 5-adic formula. Examples:
      $D(3\uparrow\uparrow\uparrow3)=7\,625\,597\,484\,986$, $D(2\uparrow\uparrow\uparrow4)=65\,534$. Each pentation step adds $V(a)\,(a\uparrow\uparrow\uparrow n-a\uparrow\uparrow\uparrow(n-1))$ digits —
      the congruence speed of pentation grows tetrationally.
    bereich: hyperoperations $H_r(a,n)$, $r\ge4$, $n\ge1$; $D(\cdot)$ = number of final decimal digits
    einfach: Pentation, hexation and all higher levels are in the end only towers of enormous height. That is why they all end at the same p-adic
      limit, and one can say exactly how many last digits are already finished — for 3↑↑↑3 it is 7 625 597 484 986.
    beweis:
      text: |-
        $H_r(a,n)=H_{r-1}(a,H_r(a,n-1))$; by induction every $H_r(a,n)$ is a tower $a\uparrow\uparrow M$. Then ar.satz.padisch_bewertung with $H=M$. Example: $3\uparrow\uparrow\uparrow3=3\uparrow\uparrow M$, $M=7625597484987$;
        $v_2=1+2M$, $v_5=M-t_5(3)=M-1$ ($\mathrm{ord}_53=4$, $V_5(3)=1$, tower mod 4 stable from height 1), so $D=M-1$.
    gegenbeispielsuche: 'Decimal $a<60$, $M<40$: no deviation (E3c).'
    pruefung:
      f1_folgt_unmittelbar: Yes, from ar.satz.padisch_bewertung.
      f2_benutzte_voraussetzungen: Only that higher hyperoperations are towers of unbounded height.
      f3_spezialfall: 'Yes: ar.satz.padisch_bewertung at enormous height.'
      f4_uebertragbar: To every base and every modulus m (minimum over the prime divisors).
      f5_neue_frage: Which digits follow after the finished ones? → ar.satz.padisch_koenigs, ar.satz.pentation_block_konstant
    bewertung:
      nutzen: Exact number of final digits for pentation and higher.
      recherche: Core known (Ripà); formulation for higher ranks not found, elementary.
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_18/04_arithmetik/BERICHT.md, B3, B4; e3_hoehere_raenge.py
  en_theorie:
    beispiel: '$3\uparrow\uparrow\uparrow3=3\uparrow\uparrow7625597484987$: 5-adically $M-1$, 2-adically $2M+1$ finished digits, decimally the
      minimum $M-1$.'
    einordnung: 'Follows from [[ar.satz.padisch_bewertung]]; digits after that: [[ar.satz.pentation_block_konstant]].'
    genau: All ranks $r\ge4$ have the same limit $\alpha_p(a)$; $D(3\uparrow\uparrow\uparrow3)=7\,625\,597\,484\,986$.
    warum: Every higher hyperoperation is a tower $a\uparrow\uparrow M$ with a huge $M$; one puts $H=M$ into [[ar.satz.padisch_bewertung]].
    worum: What does the exact valuation say about pentation and higher?
