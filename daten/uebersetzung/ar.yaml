    bewertung:
      nutzen: The only unconditional tool for base e.
      richtigkeit: established
    titel: Hermite–Lindemann
    aussage: If $\alpha\neq0$ is algebraic, then $e^\alpha$ is transcendental.
  en_theorie:
    beispiel: |
      $e$, $e^{\sqrt2}$ and $e^{i}$ are transcendental. Read in reverse: $\ln2$ is transcendental, since otherwise $e^{\ln2}=2$ would be transcendental. And $\pi$: if $i\pi$ were algebraic, $e^{i\pi}=-1$ would be transcendental.
    einordnung: |
      For towers it reaches exactly one step ([[ar.satz.orbitschranke]]); already $e^e$ is out of reach ([[ar.frage.e_hoch_e]]).
    genau: |
      If $\alpha\ne0$ is algebraic, then $e^\alpha$ is transcendental (Lindemann 1882).
    warum: |
      Theorem from the literature; the proof (Hermite for $e$, Lindemann in general) builds auxiliary polynomials whose values would be simultaneously integer and very small — a contradiction.
      A special case of the Lindemann–Weierstrass theorem.
    worum: |
      The most important classical theorem on the exponential function and numbers: If one plugs an algebraic number (other than $0$) into $e^x$, an algebraic number never comes out.
      For towers to base $e$ this is almost the only tool that works without conjectures.
- id: ar.satz.keine_arith_info
  quelle_hash: a636cbecfc11
  theorie_hash: d15730f6f102
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: $\tilde T=T\circ(\mathrm{id}+\theta)$.
    pruefung:
      f4_uebertragbar: Every base.
      f5_neue_frage: Any proof about $T_e^{\mathrm K}(1/2)$ must use the complex Kneser condition.
      f1_folgt_unmittelbar: Yes — special case $b=e$ of fg.kor.nichteindeutigkeit.
      f2_benutzte_voraussetzungen: Existence of a real-analytic solution.
      f3_spezialfall: Yes, of fg.kor.nichteindeutigkeit.
    bewertung:
      nutzen: Important methodological limitation.
      richtigkeit: complete
    titel: The real equation carries no arithmetic information (A1, Theorem 4)
    aussage: For every $r\in(1,e)$ there exists a real-analytic strictly increasing tetration to base $e$ with $\tilde T(1/2)=r$.
    quellen:
    - stelle: Thm. 4
  en_theorie:
    beispiel: |
      There is a real-analytic, increasing tetration to base $e$ with $\tilde T(\tfrac12)=\tfrac32$ exactly. For base $\sqrt2$, two such solutions have been computed ([[exp.nichteindeutigkeit]]).
    einordnung: |
      Consequence: Every proof about $T_e^{\mathrm K}(\tfrac12)$ must use Kneser's complex conditions ([[kn.satz.paulsen_cowgill]]). In general: [[fg.kor.nichteindeutigkeit]].
    genau: |
      For every $r\in(1,e)$ there is a real-analytic, strictly increasing tetration to base $e$ with $\tilde T(\tfrac12)=r$ (A1, Theorem 4).
    warum: |
      One takes Kneser's $T$ and shifts the height periodically: $\tilde T=T\circ(\mathrm{id}+\theta)$ with 1-periodic, analytic $\theta$, $\theta(0)=0$, $\theta(\tfrac12)=\operatorname{slog}_e(r)-\tfrac12$ and $1+\theta'>0$.
      This still solves the equation ([[fg.satz.allgemeine_loesung]]) and remains increasing.
    worum: |
      An important warning: The real equation alone says nothing about the kind of number its values are. One can build a smooth, increasing tetration that takes any
      desired value between $1$ and $e$ at $\tfrac12$ — even a rational one.
- id: ar.satz.keine_padische_interpolation
  quelle_hash: 3fcd6a371aad
  theorie_hash: 2dd12eefd85e
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: From rank 4 on there is no p-adically continuous extension in the height
    aussage: |-
      For $r\ge4$, $n\mapsto H_r(a,n)$ cannot be extended p-adically continuously on **any** arithmetic progression. Ranks 1–3, by contrast, interpolate: $a+n$, $a\cdot n$ always, $a^n$ for $a\equiv1\bmod p$
      (even analytically), otherwise class by class mod $p-1$. In particular there is no p-adic tetration with heights in $\mathbb Z_p$; the Schröder route also fails, because $\lambda^s=p^{Vs}u^s$ is not defined for $s\notin\mathbb Z$.
    bereich: hyperoperations $H_r(a,n)$; extension $F$ to the p-adic closure of a progression $n_0+d\mathbb N$
    einfach: Addition, multiplication and exponentiation can be extended p-adically to "in-between heights". From tetration on this never works
      — precisely because the towers settle down p-adically.
    beweis:
      text: We have $n_0+dp^k\to n_0$ p-adically and $\to\infty$ in the reals, so $F(n_0)=\lim H_r(a,n_0+dp^k)=\alpha$; likewise $F(n_0+d)=\alpha$
        — a contradiction to $H_r(a,n_0)<H_r(a,n_0+d)$, which are different as integers.
    pruefung:
      f1_folgt_unmittelbar: Yes (two lines) from the p-adic convergence.
      f2_benutzte_voraussetzungen: Only that H_r(a, n) converges p-adically to α and differs for different n.
      f3_spezialfall: 'no'
      f4_uebertragbar: To every sequence that converges p-adically and is not eventually constant.
      f5_neue_frage: Is there a p-adic counterpart of the Kneser question with heights in another ring, for instance with p-adic dependence on
        the base?
    bewertung:
      nutzen: Answers the question of a p-adic tetration for heights in ℤ_p in the negative.
      recherche: Dichotomy formulation not found; content elementary.
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_18/04_arithmetik/BERICHT.md, B11
  en_theorie:
    einordnung: Answers the question from [[ar.satz.padische_tuerme]] and [[br.satz.ripa]] (f5) in the negative.
    genau: No, for no rank $\ge4$ and on no progression; ranks 1–3 interpolate.
    warum: $n_0+dp^k$ is p-adically close to $n_0$ but huge in the reals; the tower there is p-adically almost $\alpha$. A continuous extension
      would have the same value $\alpha$ at $n_0$ and $n_0+d$ — a contradiction.
    worum: Is there a p-adic tetration $a\uparrow\uparrow s$ for $s\in\mathbb Z_p$?
- id: ar.satz.liouville_tuerme
  quelle_hash: 792e573dfc20
  theorie_hash: 781a3535e056
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: Marques–Oliveira–Trojovský (arXiv 2310.06780).
    pruefung:
      f4_uebertragbar: Higher levels?
      f5_neue_frage: Does it hold for all Liouville numbers?
      f1_folgt_unmittelbar: No; construction of the set plus Baker theory.
      f2_benutzte_voraussetzungen: Baker's bounds for linear forms in logarithms.
      f3_spezialfall: —
    bewertung:
      nutzen: One of the few unconditional transcendence theorems for third levels.
      richtigkeit: Literature (preprint), checked via abstract
    titel: Three-level towers of many Liouville numbers are transcendental
    aussage: |
      There is a $G_\delta$-dense set of Liouville numbers for each element of which the three-level tower ${}^3\xi$ is transcendental (Marques–Oliveira–Trojovský, using Baker's
      bounds for linear forms in logarithms).
    bereich: Liouville numbers $\xi$; ${}^3\xi=\xi^{\xi^\xi}$
    einfach: For a very large family of numbers that are particularly “well approximable”, it is proved that already the third level of their
      tower is transcendental — for algebraic numbers this is still open.
    quellen:
    - stelle: Abstract
  en_theorie:
    beispiel: |
      “$G_\delta$-dense” means roughly: in every interval, however small, there are such numbers, and indeed “almost all” in the sense of Baire category.
    einordnung: |
      An unconditional partial success toward [[ar.verm.gelfond_turm]] — but for other bases.
    genau: |
      There is a $G_\delta$-dense set of Liouville numbers $\xi$ with transcendental ${}^3\xi$.
    warum: |
      Liouville numbers can be approximated extremely well by fractions. One builds the set so that an algebraic value of ${}^3\xi$ would contradict a bound of Baker for linear forms in
      logarithms.
    worum: |
      For algebraic numbers nothing is known about the third level of a tower. For certain Liouville numbers, however, it is.
- id: ar.satz.masser_typ
  quelle_hash: 0e382b9a0562
