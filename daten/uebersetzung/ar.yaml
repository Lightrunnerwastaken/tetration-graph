  en:
    beweis:
      text: Gelfond–Schneider.
    pruefung:
      f4_uebertragbar: All solutions.
      f5_neue_frage: Base $e$ is stricter than algebraic bases.
      f1_folgt_unmittelbar: Yes.
      f2_benutzte_voraussetzungen: Only the equation at one point.
      f3_spezialfall: Yes.
    bewertung:
      nutzen: Comparison of the bases.
      richtigkeit: complete
    titel: Algebraic bases
    aussage: (i) $T_b(x)$ algebraic irrational ⇒ $T_b(x+1)$ transcendental; (ii) $T_b(x)\in\mathbb Q$ ⇒ $T_b(x+1)=b^{p/q}$ algebraic.
    bereich: algebraic $b>1$
    quellen:
    - stelle: Thm. 3
  en_theorie:
    beispiel: |
      Base $2$: Where $T_2(x)=\tfrac12$, we have $T_2(x+1)=\sqrt2$ (algebraic) and $T_2(x+2)=2^{\sqrt2}$ (transcendental).
    einordnung: |
      Unlike for base $e$, two neighbors may both be algebraic here — rational values are the back door. Comparison: [[ar.satz.orbitschranke]].
    genau: |
      For algebraic $b>1$: (i) If $T_b(x)$ is algebraic and irrational, then $T_b(x+1)$ is transcendental. (ii) If $T_b(x)=p/q$ is rational, then $T_b(x+1)=b^{p/q}$ is algebraic.
    warum: |
      (i) is Gelfond–Schneider with $a=b$, $c=T_b(x)$. (ii) is direct: a rational power of an algebraic number is algebraic.
    worum: |
      For algebraic bases such as $2$ or $\sqrt2$, Gelfond–Schneider helps one step: An algebraic, irrational tower value makes the next one transcendental.
