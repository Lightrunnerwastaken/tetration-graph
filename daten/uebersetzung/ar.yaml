    titel: Schanuel's conjecture
    aussage: If $x_1,\dots,x_n\in\mathbb C$ are linearly independent over $\mathbb Q$, then $\operatorname{trdeg}_{\mathbb Q}\mathbb Q(x_1,\dots,x_n,e^{x_1},\dots,e^{x_n})\ge
      n$.
  en_theorie:
    beispiel: |
      With $x_1=1$, $x_2=i\pi$ (linearly independent): Among $1,i\pi,e,-1$ two would be algebraically independent — that is, $e$ and $\pi$. This is unproved to this day.
    einordnung: |
      What it yields for towers: [[ar.satz.schanuel_orbit]]; in particular $e^e$ transcendental ([[ar.frage.e_hoch_e]]). The counterpart for Kneser values: [[ar.verm.ks]].
    genau: |
      **Conjecture** (Schanuel). If $x_1,\dots,x_n\in\mathbb C$ are linearly independent over $\mathbb Q$, then the field $\mathbb Q(x_1,\dots,x_n,e^{x_1},\dots,e^{x_n})$ has transcendence degree at least $n$ — among the $2n$ numbers at least $n$ are algebraically independent.
    warum: |
      Open since the 1960s; no counterexamples. It contains Lindemann–Weierstrass (all $x_i$ algebraic) as a proved special case.
    worum: |
      The great conjecture of transcendence theory. It would answer almost all open questions about $e$, $\pi$ and their combinations — including those about towers.
