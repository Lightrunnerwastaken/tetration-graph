    titel: Bombieri–Pila–Wilkie on the tetration graph
    aussage: $N_d(H)\le c(d,\varepsilon)H^{\varepsilon}$ for every $\varepsilon>0$.
    bereich: $\Gamma=\{(x,T(x)):x\in[0,1]\}$, $N_d(H)$ = points with degree $\le d$ and height $\le H$
    quellen:
    - stelle: Thm. 5
    - {}
    - {}
  en_theorie:
    beispiel: |
      The line $y=x$ has about $H^2$ rational points up to height $H$, the parabola $y=x^2$ and the unit circle about $H$. For large $H$ the tetration graph has fewer than $H^{0.01}$, fewer than $H^{0.001}$, …
    einordnung: |
      Holds for every real-analytic solution, including the exotic ones from [[ar.satz.keine_arith_info]]. Sharper with knowledge about tetration: [[ar.satz.masser_typ]].
    genau: |
      For $\Gamma=\{(x,T(x)):x\in[0,1]\}$ and $N_d(H)$ = number of points of $\Gamma$ with coordinates of degree $\le d$ and height $\le H$, we have $N_d(H)\le c(d,\varepsilon)H^\varepsilon$ for every $\varepsilon>0$.
    warum: |
      $\Gamma$ is a piece of a real-analytic graph over a compact interval, hence definable in the structure $\mathbb R_{\mathrm{an}}$. It contains no algebraic curve piece, because $T$ is not an
      algebraic function (it grows too fast). Then Pila–Wilkie applies ([[ar.satz.pila]]).
    worum: |
      On the graph of a tetration lie only very few points with simple coordinates. If one counts rational points with numerator and denominator up to $H$, their number grows
      more slowly than any power of $H$, however small.
- id: ar.satz.ef_liouville
  quelle_hash: e63f6cc41618
  theorie_hash: 155093f1eb80
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: |
        Partial sum $p_N/q_N$ with $q_N\mid\mathrm{EF}(1)\cdots\mathrm{EF}(N)\le\mathrm{EF}(N)^N$. The remainder is $<2/\mathrm{EF}(N+1)=2/(N+1)^{\mathrm{EF}(N)}$, and this is smaller than $q_N^{-k}$ for every
        fixed $k$ once $N$ is large ($\mathrm{EF}(N)\gg kN\log\mathrm{EF}(N)$). Liouville: Such numbers are transcendental.
    pruefung:
      f4_uebertragbar: Every sum 1/a_n with a_{n+1} ≥ a_n^{f(n)}, f → ∞.
      f5_neue_frage: 'no'
      f1_folgt_unmittelbar: Yes, Liouville criterion.
      f2_benutzte_voraussetzungen: Only the growth of EF.
      f3_spezialfall: 'Yes: Σ 1/(b↑↑n) is a Liouville number for the same reason.'
    bewertung:
      nutzen: A secure transcendence result from the tower world.
      richtigkeit: complete
    titel: The sum of the reciprocals of the exponential factorial is a Liouville number
    aussage: |
      The exponential factorial $\mathrm{EF}(n)=n^{\mathrm{EF}(n-1)}$, $\mathrm{EF}(1)=1$, is a tower of descending numbers: $1,\,2,\,9,\,262144,\,5^{262144},\dots$ The sum
      $$\sum_{n\ge1}\frac1{\mathrm{EF}(n)}=1.6111149258083767361111\ldots$$
      is a Liouville number, hence transcendental: The partial sum up to $n=4$ (denominator $q=4718592$) approximates it up to $5^{-262144}\approx q^{-27455}$.
    einfach: Instead of always stacking the same number, one stacks n, n−1, …, 2, 1. The reciprocals become small so fast that their sum is approximated
      by fractions unnaturally well — and by Liouville, such numbers are never algebraic.
  en_theorie:
    beispiel: |
      After four terms the error is $5^{-262144}$, the denominator $4718592$: That is (denominator)$^{-27455}$.
    einordnung: |
      An easy transcendence proof next to the hard theorems in Chapter 8 ([[ar.satz.hermite_lindemann]]).
    genau: |
      $$\sum_{n\ge1}\frac1{\mathrm{EF}(n)}=1+\frac12+\frac19+\frac1{262144}+\frac1{5^{262144}}+\dots=1.6111149258083767361111\ldots$$
      is a Liouville number, hence transcendental.
    warum: |
      1. The partial sums are fractions with denominator at most $\mathrm{EF}(N)^N$.
      2. The remainder is about $1/\mathrm{EF}(N+1)=(N+1)^{-\mathrm{EF}(N)}$ — smaller than any fixed power of the denominator.
      3. Liouville: A number that is approximated this well by fractions is not algebraic.
    worum: |
      A tower of descending numbers — $n^{(n-1)^{\cdots^{2^1}}}$ — grows so fast that the sum of its reciprocals is certainly transcendental.
- id: ar.satz.ef_null_ableitung
  quelle_hash: 78e3df305a8e
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: '0!₂ is a derivative: lim x!₂ (x → 0) = F′(1) = 0.5730489722129730653…'
    aussage: |
      For every differentiable continuation, $\lim_{x\downarrow0}F(x)=F'(1)$. For the continuation via Kneser (ar.konstr.ef_sexp) this is
      $$0!_2=F'(1)=0.5730489722129730653505964537816700999925\ldots$$
      (160 digits), and $D=\mathrm{slog}_e(262144\ln5+\ln\ln6)-4=-1.0552140087126523890449559784636570718988\ldots$ (error of this formula about $10^{-180000}$).
      Thus TPID 2 becomes a question about a slope: it conjectures $F'(1)=\gamma$ for the totally monotone continuation. The Kneser continuation has $0.57305$, i.e. $\gamma-0.00417$.
    bereich: every differentiable continuation $F(x)=x!_2$ with $F(x+1)=(x+1)^{F(x)}$, $F(1)=1$
    einfach: What the exponential factorial is "at 0" depends only on how steep it is at 1. The old conjecture that Euler's constant 0.5772 comes
      out there is therefore a statement about this slope. Our continuation has the slope 0.57305 — just off.
    beweis:
      text: $F(x+1)=(x+1)^{F(x)}$ gives $F(x)=\ln F(x+1)/\ln(1+x)$. With $F(1)=1$, $\ln F(1+x)=F'(1)\,x+O(x^2)$ and $\ln(1+x)=x+O(x^2)$, hence
        $F(x)\to F'(1)$.
    pruefung:
      f1_folgt_unmittelbar: Yes (L'Hôpital).
      f2_benutzte_voraussetzungen: Differentiability at 1.
      f3_spezialfall: 'no'
      f4_uebertragbar: To every tower sequence $a_{n}=b_n^{a_{n-1}}$ with $b_1=1$.
      f5_neue_frage: Which continuation has $F'(1)=\gamma$ — and is it totally monotone?
    bewertung:
      nutzen: Makes TPID 2 concretely testable and gives the exact Kneser value.
      richtigkeit: complete; value to 160 digits
    quellen:
    - stelle: forschung/identitaeten_2026_10_14/BERICHT_ETAPPE1.md, K7; a_konstanten.py
    - {}
- id: ar.satz.ef_periode
  quelle_hash: 8746e06810f5
  theorie_hash: f63c7d8acf4a
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: The exponential factorial modulo m has smallest period Λ̃(m) — the Carmichael chain with the factor of two capped
    aussage: |-
      $EF(n)\bmod m$ is eventually periodic with smallest period
      $$P(m)=\tilde\Lambda(m)=\mathrm{kgV}_{j\ge0}\,\widetilde{\lambda^{j}(m)},\qquad\text{equivalently}\quad P(m)=\mathrm{kgV}\bigl(\tilde m,P(\lambda(m))\bigr).$$
      In particular $EF(n)\bmod2^k=[n\text{ ungerade}]$ for large $n$ (period 2). Examples: $P(5)=10$, $P(23)=2530$, $P(16)=2$, $P(100)=50$.
      Preperiod: $EF(n)\bmod m$ is periodic from $N(m)\le6$ on for all $m<400$; $N(2^k)=6$ for $k\ge21$ (proved up to $\approx EF(5)$), so $N$ is unbounded, but grows like an inverse of $EF$.
    bereich: $EF(n)=n^{EF(n-1)}$, $EF(1)=1$; $\lambda$ the Carmichael function; $\tilde x$ = $x$ with its power of two capped at $2^1$
    einfach: 'The exponential factorial 1, 2, 9, 262144, … becomes unimaginably large. Its residues modulo m, however, eventually repeat, and
      we know the exact length of this repetition: one computes m, then λ(m), λ(λ(m)), … and takes the least common multiple — with powers of
      two capped.'
    beweis:
      text: |-
        Upper bound: CRT; $p=2$: for even $n$, $EF(n)\equiv0$; for odd $n$, $\lambda(2^k)$ divides the exponent, so $\equiv1$, i.e. $P(2^k)=2$. $p$ odd: $EF(n)\bmod p^k$ depends only on $n\bmod p^k$
        and $EF(n-1)\bmod\lambda(p^k)$. Lower bound: (ii) $p^k\mid P(p^k)$, because $D=\mathrm{kgV}(p^{k-1},P(\lambda(p^k)))$ is not a period (for $k=1$ zero pattern, for $k\ge2$ with $n\equiv2\bmod p$:
        $v_p((1+D/n)^e-1)=k-1<k$); (i) $P(\lambda(p^k))\mid P(p^k)$ by choosing $n$ with $q^j\mid\mathrm{ord}_pn$ and CRT. Unwinding gives $\tilde\Lambda(m)$.
    gegenbeispielsuche: 'All 218 $m<260$ and 632 $m\in[260,1500)$ with $\tilde\Lambda\le3\cdot10^4$: no deviation.'
    pruefung:
      f1_folgt_unmittelbar: Upper bound yes (Carmichael); the equality needs the lower bound with a CRT argument.
      f2_benutzte_voraussetzungen: Carmichael function, CRT, LTE.
      f3_spezialfall: Counterpart of the period of n↑↑∞ mod m (OEIS A127699), there without capping the factor of two.
      f4_uebertragbar: To other descending towers b_n^{b_{n−1}^{⋯}} with b_n = f(n).
      f5_neue_frage: Exact formula for the preperiod N(m) (jumps at N(2^k) for k = 3, 19, 21).
    bewertung:
      nutzen: First exact arithmetic of the exponential factorial modulo m.
      recherche: Not found in OEIS; A127699 (counterpart for towers) has no capping.
      richtigkeit: complete; 850 moduli
    quellen:
    - stelle: forschung/runde_2026_10_18/04_arithmetik/BERICHT.md, B13, B14, B15; e4_expfakultaet.py, e4b_perioden.py, e4c_vorperiode2.py
    - {}
  en_theorie:
    beispiel: '$P(5)=10$: $EF(n)\bmod5$ repeats from $n\le6$ on with period 10.'
    einordnung: Counterpart of [[ar.satz.selbstpotenz_kongruenz]]; profinite extension [[ar.konstr.ef_profinit]].
    genau: Smallest period $\tilde\Lambda(m)=\mathrm{kgV}_j\widetilde{\lambda^j(m)}$, factors of two capped at 2; e.g. $P(100)=50$.
    warum: Modulo $p^k$, $EF(n)$ depends on $n\bmod p^k$ and on the exponent modulo $\lambda(p^k)$ — hence the chain. Modulo $2^k$, $EF(n)$ for
      large $n$ is only $[n\text{ ungerade}]$, hence the capping.
    worum: How do the residues of the exponential factorial $EF(n)=n^{EF(n-1)}$ repeat?
- id: ar.satz.funktional_ks
  quelle_hash: 2330ea5d457c
  theorie_hash: 130b8ba7b00c
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'For $c<c''$: $T(x+c'')\gg T(x+c)^N$, because $T(y+\delta)-T(y)\to\infty$; dominant monomial. Directly for every continuous strictly
        increasing solution: $m(\delta)=\min_{[0,1]}(T(y+\delta)-T(y))>0$ and $T(y+1+\delta)-T(y+1)\ge e^{T(y)}(e^{m}-1)$.'
    pruefung:
      f4_uebertragbar: All continuous increasing solutions (class B).
      f5_neue_frage: Arithmetic specialization → ar.verm.ks
      f1_folgt_unmittelbar: Yes, growth comparison.
      f2_benutzte_voraussetzungen: Only monotonicity and continuity; A1 is formulated for Kneser — unnecessarily narrow.
      f3_spezialfall: Analogous to Ax's functional Schanuel.
    bewertung:
      nutzen: Locates (KS) as a specialization problem.
      richtigkeit: complete
    voraussetzungen:
    - text: T continuous, strictly increasing (any such solution)
    - text: T = Kneser (A1, Theorem 6)
      notiz: growth argument needs only monotonicity
    titel: Functional Kneser–Schanuel statement
    aussage: $T(x+c_1),\dots,T(x+c_n)$ are algebraically independent over $\mathbb C(x)$ (as germs at $+\infty$).
    bereich: continuous strictly increasing real solutions to base $e$, pairwise distinct $c_i\in\mathbb R$
    versionen:
    - aenderung: for Kneser
    - aenderung: extended to all continuous strictly increasing solutions
    quellen:
    - stelle: Thm. 6
  en_theorie:
    einordnung: |
      Analogous to Ax's functional Schanuel. The arithmetic specialization (values at individual points) is the conjecture [[ar.verm.ks]].
    genau: |
      For every continuous, strictly increasing real solution to base $e$ and pairwise distinct $c_i$, the functions $T(x+c_1),\dots,T(x+c_n)$ are algebraically independent over $\mathbb C(x)$ (as germs at $+\infty$).
    warum: |
      1. For $c<c'$ we have $T(x+c')\gg T(x+c)^N$ for every $N$: With $m=\min_{[0,1]}(T(y+\delta)-T(y))>0$ one has $T(y+1+\delta)-T(y+1)\ge e^{T(y)}(e^m-1)$, so the gap grows tower-like.
      2. In a polynomial $P(x,T(x+c_1),\dots)$ there is then a monomial that dominates all others; $P$ cannot vanish identically.
    worum: |
      Considered as functions, shifted tetrations $T(x+c_1),T(x+c_2),\dots$ are completely independent: No polynomial equation connects them. The reason is simply growth —
      each shift to the right grows incomparably faster.
- id: ar.satz.gelfond_schneider
  quelle_hash: 6ed874261f79
  theorie_hash: df37983010c9
  herkunft:
    modell: sonnet
