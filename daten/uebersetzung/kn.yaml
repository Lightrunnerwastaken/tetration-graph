- id: kn.beob.tetra_euler
  quelle_hash: cf35024179ea
  theorie_hash: 0856b93d40b5
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'exp.tetra_euler: fixed points counted for b = 1.5, 1.6, 1.7, 2, e; sign of the minimum at η₄ ± 10⁻⁴; self-tetra-root
      at four points; pentation iterated at 1.6 and 1.7.'
    pruefung:
      f2_benutzte_voraussetzungen: Kneser tetration as the choice of continuation — with a different tetration other numbers result (matrix method
        200×200 gave 3.08855… in 2009).
      f5_neue_frage: Does the same bottleneck law hold near $\eta_4$ as near $\eta$ (passage time $\propto(b-\eta_4)^{-1/2}$, constant from $T^{\prime\prime}(e_4)/2=0.29348\ldots$)?
      f3_spezialfall: Level 4 of the sequence $(e,\eta)$, $(e_4,\eta_4)$, … (TPID 10 asks for the limit of these sequences).
      f1_folgt_unmittelbar: The equivalence of the three characterizations follows if $T_b(x)$ is continuous and increasing in $b$ and $T_b(x)-x$
        has at most two zeros on $x>1$ (see theory); both are only measured here.
      f4_uebertragbar: To level 5 (pentation touches y = x) with the pentation from kn.konstr.pentation.
    bewertung:
      nutzen: Shows that η and e are terms of a sequence — one of the most beautiful structures of the higher levels.
      richtigkeit: numerical (32 digits, two independent computations)
    titel: 'η₄ = 1.63532… and e₄ = 3.08853…: η and e one level higher'
    aussage: |
      There is exactly one base $\eta_4$ at which $T_b$ **touches** the line $y=x$:
      $$\eta_4=1.6353244967152763993453446183\ldots,\qquad e_4=3.0885322718067176544821807826\ldots,\qquad T_{\eta_4}(e_4)=e_4,\ T_{\eta_4}'(e_4)=1.$$
      Three equivalent characterizations (like $\eta$ and $e$ one level lower):
      1. **Number of fixed points:** for $\eta<b<\eta_4$, $T_b$ has three real fixed points (e.g. $b=1.6$: at about $-1.6$, $2.264$ and $4.6$), for $b>\eta_4$ only the negative one.
      2. **Self-tetra-root:** the base $b(y)$ with ${}^yb=y$ is largest at $y=e_4$, with value $\eta_4$ (like $y^{1/y}$ at $e$ with value $\eta$).
      3. **Infinite pentation:** $b\uparrow\uparrow\uparrow n$ converges for $b\le\eta_4$ (e.g. $1.6\uparrow\uparrow\uparrow\infty=2.2643844034811596\ldots$), for $b>\eta_4$ it grows beyond all bounds.
      At $\eta_4$ the negative fixed point lies at $-1.6408725757165933\ldots$ (multiplier $4.8060057543017517\ldots$). Below $\eta$ (regular) likewise: $\sqrt2\uparrow\uparrow\uparrow\infty=1.5492173298429939\ldots$
    bereich: real $b>\eta$, Kneser's tetration $T_b$; fixed points of $x\mapsto T_b(x)={}^xb$
    einfach: 'The infinite tower b^b^b^… has a value exactly up to the base η ≈ 1.4447. One level higher there is the same threshold: the infinite
      pentation (tetration applied to itself again and again) has a value exactly up to η₄ ≈ 1.6353. There the curve of the tetration touches
      the line y = x, at e₄ ≈ 3.0885.'
    quellen:
    - stelle: 'S. Levenstein, post 28 (pid 5327, 31.10.2010): 32 digits with kneser.gp; nuninho1980, post 29: recomputation'
    - stelle: 'Characterization 3 (infinite pentation): Robbins and nuninho, April 2009'
    - stelle: 'Characterization 2 (maximum of the self tetra-root): mike3, July 2010'
    - stelle: three characterizations with attribution
    - stelle: Characterizations 2 and 3 recomputed
  en_theorie:
    beispiel: |
      - $b=1.6$: fixed points at about $-1.6$, $2.264$ and $4.6$. The sequence $1,\ 1.6,\ \dots$ runs toward $1.6\uparrow\uparrow\uparrow\infty=2.2643844034811596\ldots$
        (there $T'=0.553<1$, the fixed point attracts).
      - $b=1.5$: the two positive fixed points lie at about $1.9$ and only at about $11$ — just above $\eta$ the curve sticks at $e$ for a long time.
      - $b=1.7$: $1,\ 1.7,\ \dots,\ 2.66,\ 3.18,\ 4.06,\ 7.50,\ \dots$ — no stop.
      - Self-tetra-root: $b(2.6)=1.62558$, $b(2.9)=1.63414$, $b(3.3)=1.63415$, $b(3.6)=1.62953$ — all below $\eta_4=1.63532$.
      - Below $\eta$ (regular tetration): $\sqrt2\uparrow\uparrow\uparrow\infty=1.5492173298429939\ldots$
    einordnung: |
      The value was first mentioned roughly in 2009 in the forum (bo198214, i.e. H. Trappmann: $b\le1.6353244967$) and computed to 32 digits in 2010 by S. Levenstein
      (“Nuninho's constant”); this computation confirms all 32 digits. The numbers depend on the choice of tetration — with a
      matrix approximation, 2009 gave $3.08855\ldots$ instead of $3.08853\ldots$. One level lower: [[fp.def.eta]], [[fp.satz.turm_reell]].
    genau: |
      With the Kneser tetration $T_b(x)={}^xb$:
      $$\eta_4=1.6353244967152763993453446183\ldots,\qquad e_4=3.0885322718067176544821807826\ldots$$
      One has $T_{\eta_4}(e_4)=e_4$ and $T_{\eta_4}'(e_4)=1$ (tangency), and $T_{\eta_4}''(e_4)>0$ (the curve otherwise lies above the line). Equivalent:
      1. **Fixed points:** For $\eta<b<\eta_4$, $T_b$ intersects the line three times, for $b>\eta_4$ only once (at the negative fixed point from [[kn.konstr.pentation]]).
      2. **Self-tetra-root:** For every $y$ there is a base $b(y)$ with ${}^yb=y$. It is largest at $y=e_4$, with $b(e_4)=\eta_4$.
      3. **Infinite pentation:** $b\uparrow\uparrow\uparrow n$ has a limit as $n\to\infty$ if and only if $b\le\eta_4$.
    warum: |
      **How it was computed.** For a base $b$ one takes the Taylor series of $T_b$ about $3.0885$, looks for the point $x^*$ with $T_b'(x^*)=1$ — there
      $T_b(x)-x$ is smallest — and checks whether this minimum $g(b)$ is positive or negative. $\eta_4$ is the base with $g=0$ (secant method in $b$, a few steps).

      **Why the three characterizations say the same thing** (under two assumptions that are only measured here: $T_b(x)$ increases with $b$, and $T_b(x)-x$ has for $x>1$
      a single valley):
      1. If $b<\eta_4$, the valley floor is negative: two positive intersections, plus the negative one — three. If $b>\eta_4$, the valley lies above zero: no positive intersection.
      2. At $\eta_4$ the curve lies above the line everywhere except at $e_4$. So for $y\ne e_4$, ${}^y\eta_4>y$, and to reach ${}^yb=y$
         one has to decrease the base: $b(y)<\eta_4$.
      3. The sequence $1,\ T_b(1)=b,\ T_b(b),\dots$ increases. If there is a positive fixed point $x_1$, it stays below it ($x<x_1\Rightarrow T_b(x)<x_1$) and
         runs toward $x_1$. If there is none, it can come to rest nowhere and grows beyond all bounds.

      One level lower it is exactly the same computation with $b^x$ instead of $T_b(x)$: $b(y)=y^{1/y}$, maximum $\eta$ at $e$ ([[fp.satz.unendliche_superwurzel]]).
    worum: |
      One level lower there are two famous numbers: The infinite tower $b^{b^{b^{\cdots}}}$ has a value exactly up to the base $\eta=e^{1/e}$, and at
      this threshold the value is $e$. There the curve $b^x$ touches the line $y=x$. The same happens one level higher: The curve of tetration
      $x\mapsto{}^xb$ touches the line $y=x$ at exactly one base $\eta_4\approx1.6353$, at the point $e_4\approx3.0885$. And exactly up to $\eta_4$
      the infinite pentation has a value.
- id: kn.beob.tpid10_gesetz
  quelle_hash: f2e8832b4a5d
  theorie_hash: 1c743a9ec77a
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: The continuations of each level (Kneser's tetration, regular pentation, Kneser-like hexation); the law is a
        fit, not a derivation.
      f5_neue_frage: Where does the exponent 1.47 come from? And what is e₇ really — 3.54 (extrapolation) or closer to 3.7?
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: No (measurement at four terms).
      f4_uebertragbar: 'To the Eulers: there the exponents increase, a pure power law fits worse.'
    bewertung:
      recherche: 'Tetration forum (tid 162, 262, 269, 446, 468, 668, 675, 1177, 1518, 1532, 1594), hyperops wiki “Euler number”, OEIS (digit search),
        MathOverflow/Math.SE (web search), 12.10.2026: only values and bounds, no distance law.'
      nutzen: Makes TPID 10 quantitative and testable.
      richtigkeit: numerical (fit to four terms, one independent check value)
    titel: Distance law 2 − ηₙ ≈ 2.8·n^(−1.47) — the extrapolation hits Levenstein's η₇ ≈ 1.839
    aussage: |
      $d_n=2-\eta_n$: $0.55533$, $0.36468$, $0.26264$, $0.20088$ ($n=3,\ldots,6$). The local power exponents $\ln(d_n/d_{n+1})/\ln\frac{n+1}{n}$ are
      $1.4619$, $1.4708$, $1.4705$ — almost equal —, whereas the quotients $d_{n+1}/d_n$ increase ($0.657$, $0.720$, $0.765$): not a geometric but a
      power decay, $d_n\approx2.8\,n^{-1.47}$. Extrapolation: $\eta_7\approx1.8399$ — S. Levenstein (2017) gave $1.839$ (kn.beob.hoehere_etas).
      $D_n=4-e_n$: $1.2817$, $0.9115$, $0.6986$, $0.5578$, local exponents $1.185$, $1.192$, $1.235$ — increasing; extrapolation $e_7\approx3.54$.
      Levenstein saw at base 1.84 a near-touching of heptation “near 3.7” (read off from a picture) — this does not fit well and is unresolved.
    bereich: Terms $n=3,\ldots,6$ of the sequences from kn.verm.tpid10 (30 digits)
    einfach: The distances of the “etas” from 2 shrink very regularly, roughly like 1 over n to the power 1.47. If one extrapolates one level
      further with this, one lands at 1.8399 — and exactly there (1.839) Levenstein had seen the next bound in 2017.
    quellen:
    - stelle: exp.tpid10_abstaende
    - stelle: Check value η₇ ≈ 1.839 (Levenstein, post 5)
  en_theorie:
    beispiel: |
      $d_6=0.20088$, $d_7=d_6\cdot(6/7)^{1.4705}=0.16013$.
    einordnung: |
      Quantitative version of [[kn.verm.tpid10]]; check value from [[kn.beob.hoehere_etas]]; the coupling of both sequences in [[kn.verm.tpid11]].
    genau: |
      $2-\eta_n\approx2.8\,n^{-1.47}$ for $n=3,\ldots,6$ (local exponents $1.462$, $1.471$, $1.470$). Extrapolation $\eta_7\approx1.8399$, Levenstein 2017: $1.839$.
      $4-e_n$: exponents $1.185$, $1.192$, $1.235$, extrapolation $e_7\approx3.54$.
    warum: |
      1. A power law $d_n=An^{-p}$ has constant local exponents $\ln(d_n/d_{n+1})/\ln\frac{n+1}{n}=p$; a geometric law would have constant quotients $d_{n+1}/d_n$.
      2. Measured, the exponents are almost equal, the quotients increase ($0.657$, $0.720$, $0.765$) — hence power, not geometric.
      3. With $p=1.4705$ and $A$ from $d_6$ it follows that $d_7=0.1601$, $\eta_7=1.8399$.
    worum: |
      Four exact terms are not enough for a limit, but for a law: How fast do the etas approach 2? If the law is right, it predicts the
      next term — and this can be compared with Levenstein's figure.
- id: kn.beob.unendliche_hexation
