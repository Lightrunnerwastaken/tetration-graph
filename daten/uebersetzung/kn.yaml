    titel: 'η₅ = 1.7373559251… and e₅ = 3.3014072785…: the pentation touches y = x'
    aussage: |
      The pentation $P_b(x)=b\uparrow\uparrow\uparrow x$ touches the line $y=x$ exactly at
      $$\eta_5=1.737355925151687573101390\ldots,\qquad e_5=3.301407278523367493377305\ldots,\qquad P_{\eta_5}(e_5)=e_5,\ P_{\eta_5}'(e_5)=1.$$
      For $b<\eta_5$, $P_b$ intersects the line twice (e.g. $b=1.70$: at about $2.44$ and $5.69$), for $b>\eta_5$ never — for $x\le0$, $P_b$ always lies above $y=x$.
      At $\eta_5$: negative fixed point of tetration $L=-1.6750852109\ldots$, multiplier $4.8735610\ldots$
    bereich: pentation $P_b$ from kn.konstr.pentation (regular at the negative fixed point of Kneser's tetration), $b$ near $1.74$
    einfach: 'One level above η₄ and e₄ it continues: The pentation (tetration applied again and again) touches the line y = x at the base 1.7374,
      at the point 3.3014.'
    quellen:
    - {}
    - stelle: 'Levenstein, post 5 (03.09.2017): ≈ 1.738'
  en_theorie:
    beispiel: |
      At $\eta_5$ the negative fixed point of the tetration lies at $-1.67509$ with multiplier $4.8736$ — there the pentation is anchored. The curvature at the point of tangency is
      $P''(e_5)/2=0.37699$ (for tetration: $T''(e_4)/2=0.29348$).
    einordnung: |
      The third term of the sequences asked about by [[kn.verm.tpid10]]. Like all numbers of the higher levels it depends on the chosen continuation — here Kneser for the
      tetration and regular iteration for the pentation.
    genau: |
      $$\eta_5=1.737355925151687573101390\ldots,\qquad e_5=3.301407278523367493377305\ldots$$
      with $P_{\eta_5}(e_5)=e_5$, $P_{\eta_5}'(e_5)=1$ and $P_{\eta_5}''(e_5)>0$.
      - For $b<\eta_5$ the pentation intersects the line twice (for $b=1.70$ at about $2.44$ and $5.69$).
      - For $b>\eta_5$ it never intersects: to the left of 0 the pentation always lies above the line, because for $x\to-\infty$ it runs toward the fixed point $L_b\approx-1.67$.
    warum: |
      Computed, not proved, with the same method as [[kn.beob.tetra_euler]]:
      1. For a base $b$ the pentation is evaluated on a small circle about $x_0\approx3.3$ (complex heights, via the Kneser tetration at complex points).
      2. From this the Taylor series, from that the point $x^*$ with $P_b'(x^*)=1$ and the value $g(b)=P_b(x^*)-x^*$.
      3. $\eta_5$ is the base with $g=0$ (secant method in $b$, eight steps down to $10^{-29}$).
      Check: with 10 instead of 8 forward steps in the pentation nothing changes up to the 30th digit.
    worum: |
      After $(e,\eta)$ one level lower and $(e_4,\eta_4)$ for tetration comes the next pair: At which base does the **pentation** $b\uparrow\uparrow\uparrow x$
      touch the line $y=x$? With the pentation from [[kn.konstr.pentation]] this can be computed in exactly the same way as $\eta_4$.
