      nutzen: Fourth characterization of η₅.
      richtigkeit: numerical, with a simple argument
    titel: The infinite hexation converges exactly up to η₅
    aussage: |
      $b\uparrow\uparrow\uparrow\uparrow n$ converges for $b\le\eta_5=1.7373559\ldots$ (to the lower fixed point $p_1$ of the pentation) and grows beyond all bounds for $b>\eta_5$.
      Thus $\eta_5$ is for the hexation what $\eta_4$ is for the pentation and $\eta$ for the tetration. Examples: $1.7\uparrow\uparrow\uparrow\uparrow\infty=2.38763728170$;
      for $1.74$ and $2$, $P_b(x)$ lies above $x$ everywhere.
    bereich: $b>\eta$, $b\uparrow\uparrow\uparrow\uparrow n=P_b^{\circ n}(1)$
    einfach: The tower of pentations has a limit exactly up to the base 1.7374 — one level higher the same threshold as for the ordinary tower
      (up to η ≈ 1.4447).
    quellen:
    - {}
    - stelle: Levenstein, post 5; Nixon, post 8
  en_theorie:
    beispiel: |
      $b=1.7$: $1,\ 1.7,\ 2.0692,\ 2.2432,\ 2.3225,\ 2.3583,\ 2.3745,\ 2.3817,\dots\to2.3876372817$ (each step reduces the distance by about the factor $\mu=0.45$).
      $b=1.74$: $P_b(x)-x$ is everywhere at least $0.043$ on $[-3,4]$ — the sequence grows without a stop.
    einordnung: |
      The chain: [[fp.satz.turm_reell]] (level 4, bound $\eta$) → [[kn.beob.tetra_euler]] (level 5, bound $\eta_4$) → here (level 6, bound $\eta_5$).
    genau: |
      The sequence $1,\ P_b(1),\ P_b(P_b(1)),\dots$ (this is $b\uparrow\uparrow\uparrow\uparrow n$) converges for $b\le\eta_5=1.7373559\ldots$ to the lower fixed point of the pentation and
      grows beyond all bounds for $b>\eta_5$.
    warum: |
      The sequence increases because $P_b(1)=b>1$ and $P_b$ is increasing. If there is a fixed point $p_1>1$, it stays below it and runs there. If there is none, it can stop nowhere.
      Whether there is one is decided by the tangency at $\eta_5$ ([[kn.beob.stufe5]]): below it the pentation intersects $y=x$, above it not.
    worum: |
      The infinite tower $b^{b^{\cdots}}$ has a value up to $\eta$, the infinite pentation up to $\eta_4$ — and the infinite hexation $b\uparrow\uparrow\uparrow\uparrow\infty$ exactly up to $\eta_5$.
      Each level has its own limiting base, and every time it is the number at which the level below touches the line $y=x$.
- id: kn.beob.zwischenwerte_basis2
  quelle_hash: ce3c7b19539e
  theorie_hash: c9a16aae8c5a
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: 'Base 2 between the integer heights: H_r(2, 1/2) increases, H_r(2, 3/2) decreases with the rank'
    aussage: |
      At base 2, $H_r(2,1)=2$, $H_r(2,2)=4$ remain for every rank. In between (chosen continuation chain):
      $H_r(2,\tfrac12)$: $1.41421,\ 1.45878,\ 1.47488,\ 1.48275,\ 1.48727,\ 1.49026,\ 1.49281$ and $H_r(2,\tfrac32)$: $2.82843,\ 2.74876,\ 2.70289,\ 2.67289,\ 2.65162,\ 2.63586,\ 2.62453$ ($r=3\ldots9$).
      The values 1.5 and 2.5 are close, but are not proved limits — and there is no limit graph (kn.satz.basis2_hoehe3).
    einfach: Between 2 and 4 the curves of the higher hyperoperations become straighter and straighter — the values at half a height approach
      1.5 and 2.5.
    pruefung:
      f1_folgt_unmittelbar: No (measured).
      f2_benutzte_voraussetzungen: Chosen continuation chain; octation via the experimental two-arc selection.
      f3_spezialfall: 'no'
      f4_uebertragbar: Fits kn.beob.kritische_profile (approach to x+1 on short stretches).
      f5_neue_frage: Does H_r(2,x) converge on [1,2] to the line 2x, and how fast?
    bewertung:
      nutzen: Intuitive picture of the hierarchy.
      richtigkeit: numerical (up to about 22–30 digits internally)
    quellen:
    - stelle: forschung/eta_hyperoperationen/BERICHT.md §6
  en_theorie:
    beispiel: |
      Nonation: $H_9(2,0.5)=1.49281$, $H_9(2,1.5)=2.62453$.
    einordnung: |
      No limit graph: [[kn.satz.basis2_hoehe3]].
    genau: |
      At half height the value increases ($1.414\to1.493$), at height 1.5 it decreases ($2.828\to2.625$) — the curves become straighter and straighter between 2 and 4.
    warum: |
      The endpoints 2 and 4 are fixed for all levels; the curvature in between decreases with the rank.
    worum: |
      What do the higher hyperoperations at base 2 look like between heights 1 and 2?
- id: kn.def.slog
  quelle_hash: 78731c114abb
  theorie_hash: 80ebf4b26068
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Super-logarithm
    aussage: |
      For a strictly increasing tetration $T_b$, $\operatorname{slog}_b:=T_b^{-1}:\mathbb R\to(-2,\infty)$; it satisfies
      $\operatorname{slog}_b(b^x)=\operatorname{slog}_b(x)+1$ and $\operatorname{slog}_b(1)=0$.
  en_theorie:
    beispiel: |
      Kneser, base $e$: $\operatorname{slog}_e(0)=-1$, $\operatorname{slog}_e(1)=0$, $\operatorname{slog}_e(2)=0.70155$, $\operatorname{slog}_e(e)=1$, $\operatorname{slog}_e(1000)=2.666$.
    einordnung: |
      In general such a function is called an Abel function ([[fg.def.abel]]); rules of calculation and derivative in the fundamentals ([[gr.satz.slog_grund]],
      [[gr.satz.slog_ableitung]]). Fractional sums of the super-logarithm: [[kn.satz.abel_bruchsumme]].
    genau: |
      For a strictly increasing tetration $T_b$ with $b>\eta$, $\operatorname{slog}_b:=T_b^{-1}:\mathbb R\to(-2,\infty)$. It satisfies
      $$\operatorname{slog}_b(b^y)=\operatorname{slog}_b(y)+1,\qquad\operatorname{slog}_b(1)=0.$$
    warum: |
      1. $T_b$ is continuous and strictly increasing, goes to $-\infty$ at $-2$ and to $+\infty$ for $x\to\infty$ (tower growth above $\eta$). So $T_b$ is a
         bijection from $(-2,\infty)$ onto $\mathbb R$ and has an inverse.
      2. Substituting $x=\operatorname{slog}_b(y)$ into $T(x+1)=b^{T(x)}$ gives $T(\operatorname{slog}_b(y)+1)=b^y$, hence $\operatorname{slog}_b(b^y)=\operatorname{slog}_b(y)+1$.
      3. $T(0)=1$ gives $\operatorname{slog}_b(1)=0$. For $1<b<\eta$, $T_b$ is bounded; then $\operatorname{slog}_b$ is defined only on $(-\infty,a)$.
    worum: |
      The super-logarithm answers the reverse question: How many levels does the tower need to reach the value $y$? It counts
      levels, just as the logarithm counts factors.
- id: kn.frage.abel_bruchsumme
  quelle_hash: 25a2df671512
  theorie_hash: d2f0f560d634
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: 'Base change of the fractional sum: transport $\mathcal S[A_b]$ along $T_d$ and compare against μ_{b,d} and the phase P.'
    titel: Fractional sum of the Abel function above η
    aussage: |
      For $b>\eta$, $A_b=\operatorname{slog}_b$ grows without bound, but $A_b(N+x)-A_b(N)\to0$. The compensated sum
      $\mathcal S[A_b](x)=\lim_N\bigl[xA_b(N)+\sum_{k\le N}(A_b(k)-A_b(k+x))\bigr]$ formally satisfies $\mathcal S(x+1)-\mathcal S(x)=A_b(x+1)$.
      Convergence is settled (kn.satz.abel_bruchsumme: yes, because $A''=O(y^{-2})$). What remains open: Does its value or $\gamma_A$ connect with $\mu_{b,d}$,
      the response kernel or the logarithmic tails?
    quellen:
    - stelle: §14
  en_theorie:
    beispiel: |
      Base $e$: $\mathcal S(\tfrac12)=-0.11510$, $\gamma_A=0.49517$; alongside $\mu_{e,2}=-1.12840$. A connection is not known.
    einordnung: |
      Next step: transport the fractional sum along $T_d$ and compare with $\mu_{b,d}$ and the wave $P$. Related: [[kl.satz.bruchsumme]].
    genau: |
      Open: Do $\mathcal S[A_b](x)$ or $\gamma_A$ connect with the mean translation $\mu_{b,d}$ of the base change, with the response kernel or with the
      logarithmic tails? (Convergence is settled: [[kn.satz.abel_bruchsumme]].)
    warum: |
      Why one might suspect this: $\mu_{b,d}$ too arises from a limit of $A_b$ along a tower ([[bw.satz.phasengesetz]]), and
      fractional sums have already proved to be the language of the base change below $\eta$ ([[kl.satz.wertseitiger_basiswechsel]]).
    worum: |
      The fractional sum of the super-logarithm exists. But does its value have a meaning — say for the base change in Chapter 7?
- id: kn.frage.andere_etas
  quelle_hash: 6e5383b99fc0
  theorie_hash: 69976b5f8f0c
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: Etas and Eulers of other families — and is e₄ rational? (forum 2022)
    aussage: |
      In 2022 counterparts of the sequences from TPID 10 for other families were asked about in the forum: for “weak” hyperoperations (Catullus: weak pentation
      bounded up to about $1.584$, limit value there about $2.439$, without computation path and without definition in the post), for the 2sinh method (H. Trappmann: the “η” of the
      function 2sinh is $e^{1/2}$; the largest base with convergent 2sinh pentation remained open), and whether $e_4$ is rational, algebraic or transcendent
      (no answer). MphLee suggested defining the sequences generally as a function of the level; the hyperops wiki so far lists only levels 3 and 4.
    einfach: The “etas” and “Eulers” depend on how one builds the higher levels. In the forum it was asked which numbers other constructions give
      — and whether the number e₄ ≈ 3.0885 might be a fraction. Both are open.
    quellen:
    - stelle: Catullus, 17.06.2022
    - stelle: Catullus, Trappmann (July 2022)
    - stelle: Rationality of e₄
    - stelle: 'MphLee, 15.06.2022: general definition'
    - {}
  en_theorie:
    einordnung: |
      Side questions to [[kn.verm.tpid10]]; 2sinh method: [[kn.konstr.zwei_sinh]].
    genau: |
      Open: Etas/Eulers for “weak” hyperoperations (reported: $\approx1.584$, $\approx2.439$), for the 2sinh method, a general definition per level,
      and the rationality or transcendence of $e_4$.
    warum: |
      Without a fixed continuation of each level, $\eta_n$ is not defined; the matrix slog already gives a different value for $e_4$ ([[kn.beob.eta4_matrix]]).
    worum: |
      The etas and Eulers are not fixed natural constants, but depend on how one builds the higher levels. In 2022 it was asked in the forum which values
      other constructions give, and whether $e_4$ is a special number.
- id: kn.frage.beta_methode
  quelle_hash: c40f9fad9194
  theorie_hash: 46cb159bd7db
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: Compare the β method with Kneser at high accuracy (distance at x = 1/2) and check for singularities near the real axis.
    titel: Are there holomorphic tetrations without Kneser's vertical limit condition? (β method)
    aussage: |
      Paulsen–Cowgill (kn.satz.paulsen_cowgill) characterize Kneser by holomorphy on $\mathbb C\setminus(-\infty,-2]$ **and** the limit $T(x+iy)\to L$ as $y\to\infty$.
      Is the second condition necessary? J. D. Nixon built a tetration in 2021 with the β method ($\beta_\lambda(s+1)=e^{\beta_\lambda(s)}/(e^{-\lambda s}+1)$), which at first he
      thought to be holomorphic and different from Kneser (different values on the real axis, no limit $L$ upward). Later he himself wrote that the work had
      wrongly assumed holomorphy; with β functions Kneser can only be approximated. So it remains open whether there is a holomorphic, real tetration that is not Kneser.
    quellen:
    - {}
    - {}
    - stelle: 'Nixon, post 21 (23.08.2021): is there a solution with all properties of Paulsen–Cowgill, but limit ∞ instead of L at i∞? (question
        A), and is it then equally unique? (question B)'
  en_theorie:
    einordnung: |
      Complements the uniqueness theorems [[kn.satz.paulsen_cowgill]] and [[kn.satz.trappmann_kouznetsov]] from the other side: Which condition is really necessary?
      Related to the search for a real characterization ([[br.frage.bohr_mollerup]]).
    genau: |
      The β method starts with $\beta_\lambda(s+1)=e^{\beta_\lambda(s)}/(e^{-\lambda s}+1)$ — functions that for $s\to\infty$ almost satisfy the tetration equation — and
      corrects them to a solution. Nixon at first took the result to be holomorphic and different from Kneser. Later he wrote that he had wrongly
      assumed holomorphy, and that with β functions Kneser can only be approximated.

      **Open question:** Is there a holomorphic tetration, real on $\mathbb R$, that is **not** Kneser?
    warum: |
      What is known: Without an additional condition the solution is never unique — one can form $T(x+\theta(x))$ with a 1-periodic function $\theta$. But such
      perturbations create singularities in the complex plane. The question is whether there is a perturbation that avoids this and still does not run toward $L$.
    worum: |
      Kneser is unique if one demands two things: holomorphic in the slit plane **and** a particular behavior far up and down (limit $L$).
      Is the second condition really needed? J. D. Nixon tried in 2021 with his β method to show that without it there is another holomorphic tetration.
- id: kn.frage.halber_rang
  quelle_hash: dd873a38f117
  theorie_hash: 216061644d89
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: Is there a hyperoperation between power and tetration — and what limit base η₃.₅ would it have?
    aussage: |
      We look for a semigroup $T_b^s$ of the rank step $T_b(f)=S$ ($S(0)=1$, $S(x+1)=f(S(x))$) with $T_b^{1/2}\circ T_b^{1/2}=T_b$ and $H_{3+s}(b,\cdot)=T_b^s(b^x)$ — a fractional iteration
      of an **operator on functions**, not of the height. An injective fixed point of $T_b$ would have to satisfy $f(x+1)=f(f(x))$, which forces $f=x+1$ and $b=2$; a simple fixed-point argument
      as for tetration is therefore missing. Known: the linear (kn.satz.halbrang_linear) and the quadratic step (kn.satz.halbrang_quadratisch) for test perturbations. Extrapolation:
      $\eta_{3.5}^{\rm fit}=1.55682$ — meaningless as long as there is no $H_{3.5}$.
    naechste_frage: Generalize Q₁/₂ to gamma mode pairs, control the series for bˣ, fix a selection class with variable growth weights (the half-plane
      class contains no tetration for b > e^(1/e)).
    quellen:
    - stelle: forschung/eta_hyperoperationen/rang_gamma, halb_rang_quadratisch, halb_rang_analytisch
  en_theorie:
    beispiel: |
      First building blocks: [[kn.satz.halbrang_linear]], [[kn.satz.halbrang_quadratisch]].
    einordnung: |
      Related to the intermediate levels of Bennett and Nixon: [[br.satz.hyperop_varianten]].
    genau: |
      We look for a semigroup $T_b^s$ of the rank step, $T_b^{1/2}\circ T_b^{1/2}=T_b$, with $H_{3+s}=T_b^s(b^x)$.
    warum: |
      Fractional height means: iterating a function by half. Fractional rank means: performing the step “function → its superfunction” by half — an iteration in the space of functions.
    worum: |
      Whether there is a hyperoperation “3.5” between power and tetration — and its limit base.
- id: kn.frage.hexation_kneser
  quelle_hash: fc334e0726aa
  theorie_hash: 9d3e9b600d1b
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: Prove the strip conjecture (kn.verm.hexation_streifen); transition at η₅.
    titel: Kneser-type hexation above η₅ — and η₆
    aussage: |
      For $b>\eta_5$ (e.g. $b=2$) the pentation has no real fixed point; a real analytic hexation must be built, as Kneser did, at the repelling complex fixed point $q$:
      $H(z)=F_q(z+\theta(z))$ with the regular superfunction $F_q$ and a periodic correction $\theta$ that brings the real axis onto the curve on which $F_q$ is real.
      **Prior work:** S. Levenstein already built it this way in 2017 (forum tid 1177): Abel function on a circle between the conjugate fixed points of the pentation,
      $\theta$ map, about 30 digits for real bases; he does not mention branchings in the upper half-plane.
      **Values (09.10.2026):** The engine knhexinit in the gp-tetration fork solves the construction as a fitting problem (Taylor series of the Abel function about $\operatorname{Re}q$
      plus $\theta$ coefficients near $q$, two arcs as error bound): $2\uparrow\uparrow\uparrow\uparrow1.5=2.67289395934261948919079647\ldots$ ($32.6$ digits;
      S. Levenstein 2020: $\approx2.6729$), $2\uparrow\uparrow\uparrow\uparrow0.5=1.48275118371174155405957\ldots$; hence $\eta_6$ in kn.beob.stufe6.
      **Status (09.10.2026):** (1) The curve has a corner at $w=P(L_T)=-0.7715464478$: $F_q$ is branched there in a power-like way with exponent $\alpha=\ln\lambda_T/\ln2=2.3707$
      (kn.beob.hexation_verzweigt), $\theta$ behaves like $(x-x_c)^{0.4218}$ — therefore Theodorsen and Fornberg do not converge. (2) The sheet problem is solved:
      the pentation can be continued at complex heights along paths (sheet tracking, checked against the principal branch and with closed paths).
      (3) In doing so it turned out: $H$ is branched in the upper half-plane (at $z_m\approx-0.7408+m+2.7458\,i$) — Kouznetsov's Cauchy method in the rectangle is thereby
      ruled out in principle, not merely numerically difficult. The fork method circumvents both: it computes the Abel function near $q$ and at the axis via the functional equation,
      never with $\theta$ on the real axis.
      **Uniqueness:** The half-plane characterization of tetration is empty for the hexation (kn.satz.hexation_keine_halbebene). With a fixed fundamental domain $G_0$
      between $\bar q$ and $q$ the Kneser-type hexation is uniquely determined (kn.satz.hexation_eindeutig_g0); the domain-independent version is conjectured
      (kn.verm.hexation_streifen). **Open:** this version and the continuity at $\eta_5$ (transition to the regular hexation).
      **Clarified (09.10.2026):** The limit of about 26 digits at base $e$ does not come from the corners (they lie below the arc in $W$) and not from the data
      (pentation there accurate to 48–55 digits), but from functional equations whose image point lies up to $1.22$ arc radii far outside: If one omits those with image beyond
      $1.05$ arc radii, the accuracy at dps 45 rises from $25.7$ to $34.1$ digits (omitting up to $1.0$ drops to $18$ — too few equations). Passed on to the fork method.
    quellen:
    - stelle: 'Levenstein, post 5 (03.09.2017): Kneser-like hexation via circle and θ'
    - {}
    - {}
  en_theorie:
    einordnung: |
      The counterpart to Kneser's tetration ([[kn.konstr.kneser]]), two levels higher. With the exact hexation, $\eta_6$ has been computed ([[kn.beob.stufe6]]) — the fourth term
      of [[kn.verm.tpid10]]. Why not at the attracting fixed point: [[kn.satz.kein_kneser_anziehend]]; why no rectangle method: [[kn.beob.hexation_verzweigt]].
    genau: |
      Building blocks: the repelling fixed point $q$ of the pentation, the regular superfunction $F_q(\zeta)=\Psi_q(\mu_q^\zeta)$ (only forward steps needed) and a periodic correction $\theta$:
      $$H(z)=F_q\bigl(z+\theta(z)\bigr),$$
      where $z\mapsto z+\theta(z)$ places the real axis onto the curve on which $F_q$ is real.

      Values: The engine knhexinit (gp-tetration fork) computes the Abel function $\alpha=H^{-1}$ as a Taylor series about $\operatorname{Re}q$; near $q$ it must be
      $\alpha_q+\theta(\alpha_q)$, near the axis it must satisfy the functional equation $\alpha(P(w))=\alpha(w)+1$ — all in one fitting problem, solved twice on
      different arcs. Result: $2\uparrow\uparrow\uparrow\uparrow1.5=2.67289395934261948919079647\ldots$ ($32.6$ digits), S. Levenstein 2020: $\approx2.6729$.
      Our own first attempt via $\theta$ on the real axis gave $2.676$ — the corners of the curve (point 1 below) slowed it down.
    warum: |
      What it hinges on — three things:
      1. **A corner:** The curve on which $F_q$ is real has, at the point belonging to height $s_b+2$ (value exactly $P(L_T)$, two levels above the singularity from
         [[kn.satz.hexation_struktur]]), a branch point of $F_q$ with exponent $\alpha=\ln\lambda_T/\ln2=2.37$ — the curve bends there with the angle $\pi/\alpha\approx76^\circ$.
         The hexation itself stays smooth on the real axis, but the auxiliary function $\theta$ acquires a singularity like $(x-x_c)^{0.42}$. Fourier methods (Theodorsen, Fornberg)
         then do not converge: 32, 64 and 128 sample points gave $2.6760$, $2.6821$, $2.6736$.
      2. **The wrong sheet — solved:** The pentation at complex heights is computed as a chain of Kneser tetrations. If a member of the chain crosses the cut $(-\infty,-2]$ of the
         tetration, the principal branch returns a value on another sheet. Sheet tracking continues each tetration of the chain along the path (logarithm branches by
         continuity, huge intermediate values via their exact logarithm $\ln b\cdot T(x-1)$); checked against the principal branch and with closed paths.
      3. **Branching in the upper half-plane:** With sheet tracking it turned out that $H$ itself has branch points above the real axis
         ([[kn.beob.hexation_verzweigt]]). A Cauchy formula over a rectangle reaching up to $q$ therefore does not hold; instead the fork method computes the Abel function near $q$ and at the axis via the functional equation, never with $\theta$ on the real axis.
    worum: |
      Above $\eta_5$ — for example at base 2 — the pentation no longer has a real fixed point. A smooth hexation must then be built, like Kneser's, at a complex fixed point.
      This is possible but numerically difficult; here it is stated how far things have got.
- id: kn.frage.pentation_untergrenze
  quelle_hash: 23079fc7fd69
  theorie_hash: f52abbb1e0cf
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: For which bases below 1 is there a real, monotone tetration at all (cf. kl.satz.basis_unter_eins)?
    titel: Does the domain of convergence of the infinite pentation have a lower bound? (andydude 2010)
    aussage: |
      The infinite tower $b\uparrow\uparrow m$ converges exactly for $e^{-e}\le b\le\eta$ (Euler). For the infinite pentation $b\uparrow\uparrow\uparrow m$ the upper corner
      $(\eta_4,e_4)=(1.6353\ldots,3.0885\ldots)$ is known; A. Robbins (andydude) wrote in 2010 that it is open whether there is a **lower** bound.
      Difficulty: already $b\uparrow\uparrow\uparrow2={}^{b}b$ needs tetration at a non-integer height, and for $0<b<1$ regular iteration has
      a negative multiplier at the fixed point — a real, natural tetration is missing there. The question thus hinges on the choice of continuation below 1.
    einfach: The ordinary infinite tower has a value for bases between about 0.066 and 1.4447. For the next level one knows the upper bound 1.6353
      — but whether there is also a lower one, nobody knows, because for small bases one has no good tetration at all.
    quellen:
    - stelle: andydude, 07.05.2010
  en_theorie:
    einordnung: |
      Posed by Robbins in 2010; counterpart to [[fp.satz.turm_reell]]; bases below 1: [[kl.satz.basis_unter_eins]].
    genau: |
      Open: Is there a $b_0>0$ such that $b\uparrow\uparrow\uparrow m$ does not converge for $b<b_0$ (analogous to $e^{-e}$)?
    warum: |
      1. Already $b\uparrow\uparrow\uparrow2={}^{b}b$ needs tetration at height $b$, for $b<1$ thus at a fractional height.
      2. For $0<b<1$, $b^x$ has a negative derivative at the fixed point; regular iteration there is not real.
      3. Hence the question hinges on a choice of tetration below 1 that does not yet exist.
    worum: |
      The ordinary infinite tower has a value exactly between $e^{-e}$ and $\eta$. For the next level one knows the upper bound $\eta_4$ — but not whether there is a lower one.
- id: kn.frage.stoerungsreihe
  quelle_hash: 9a365d227f18
  theorie_hash: 6ad8508abdd8
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: Which tetration does the perturbation series sum to?
    aussage: |
      The series $\sum_n g_n(y)u^n$ from kn.konstr.stoerungsreihe diverges, and its best truncation lies $2\cdot10^{-7}$ away from Kneser. Is it the
      asymptotic expansion (as $u\to0$) of a genuine family of superfunctions of $e^z-1+u$, and does their value at $u=1$ — for instance via a
      Borel sum — give exactly Kneser's tetration? Or does the polynomial continuation pick a different solution that differs by a small θ-wave?
      For $u>0$, $e^z-1+u$ no longer has a real fixed point (the parabolic point splits into two complex ones) — exactly the situation in which Kneser's construction
      works; this speaks for Kneser but does not prove it.
    einfach: The series never stops getting better and then worse again. Can one nevertheless "add it up" in a meaningful way, and does exactly
      Kneser's tetration come out? That it comes within six digits of Kneser is a hint, but not a proof.
  en_theorie:
    beispiel: |
      A first test: the best truncation lies $2\cdot10^{-7}$ from Kneser — a θ-wave of this size would not be ruled out.
    einordnung: |
      Related open question: [[kn.frage.halber_rang]]; tool: [[it.satz.ecalle_voronin]].
    genau: |
      Is $\sum g_n(y)u^n$ the asymptotic expansion of a family of superfunctions $G_u$ of $e^z-1+u$, and is $G_1(x+1)=\mathrm{sexp}_e(x)$ (Kneser)?
    warum: |
      For $u>0$, $e^z-1+u$ no longer has a real fixed point; the parabolic point splits into a complex pair — exactly the situation in which Kneser's
      construction works. If the family $G_u$ is the Kneser-type solution for every $u$ and runs analytically in $u$ away from 0, the series would be its
      expansion, and a Borel sum could recover it. None of this is proved.
    worum: |
      A divergent series with a surprisingly good truncation — is it exactly Kneser behind it?
- id: kn.frage.tpid14
  quelle_hash: dc59427c43f7
  theorie_hash: 956651bc3a58
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: Compare the Carleman slog (kn.konstr.carleman) about 0 and about x₀ = 1/2 with growing n; according to kn.verm.tpid3_bedingung
      a circle-of-convergence condition is to be expected.
    titel: 'TPID 14: Does Robbins'' matrix slog depend on the expansion point?'
    aussage: |
      tommy1729 (TPID 14, 01.06.2011) conjectures: If in Robbins' formula for the slog one replaces the expansion point $x_0$ by 0, one obtains the same super-logarithm,
      as long as both points lie within the radius of convergence of the respective other. Related to TPID 1 and 3 (there the same question for eigenvalues). Unanswered.
    einfach: The matrix slog is computed about a chosen point. Does the same function always come out, no matter which point one chooses? Conjectured
      yes — nobody has checked it.
    quellen:
    - stelle: TPID 14 (tommy1729, 01.06.2011, post 16)
  en_theorie:
    einordnung: |
      Related to [[kn.konstr.carleman]] and the eigenvalue questions [[kn.verm.carleman_eigenwerte]], [[kn.verm.tpid3]].
    genau: |
      Question (TPID 14): Does the matrix slog about $x_0$ and about 0 give the same function if both points lie in the radius of convergence of the respective other?
    warum: |
      If the matrix slog is Kneser's slog ([[kn.verm.carleman_kneser]]), then yes — the question is thus a touchstone for the equality of the methods.
    worum: |
      Robbins' matrix slog is developed about a point. Is the result independent of the point?
- id: kn.frage.tpid16
  quelle_hash: 02f3429d982d
  theorie_hash: ee072ac37e22
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: 'TPID 16: Entire real functions with a conjugate pair of fixed points — are there Kneser-like solutions with positive derivatives?'
    aussage: |
      tommy1729 (TPID 16, 07.06.2014) considers real, non-polynomial entire functions with a conjugate pair of primary fixed points and asks whether there are solutions
      whose iterates satisfy additional positivity conditions on the derivatives; he conjectures yes. The question generalizes Kneser's situation (exp with L, L̄) to other entire functions.
    einfach: Kneser's trick works for eˣ, which has two mirror-image complex fixed points. Does it work for every such function — and do all derivatives
      remain positive in the process?
    quellen:
    - stelle: TPID 16 (tommy1729, 07.06.2014, post 18); conditions stated only briefly in the post
  en_theorie:
    einordnung: |
      Generalizes [[kn.konstr.kneser]]; at attracting complex fixed points the route fails ([[kn.satz.kein_kneser_anziehend]]).
    genau: |
      For real, non-polynomial entire $f$ with a conjugate primary pair of fixed points: are there real superfunctions or fractional iterates with positivity of the derivatives?
    warum: |
      The steps (Schröder function at the fixed point, Riemann map, reflection) need no property that only exp has; open is the positivity of the derivatives.
    worum: |
      Kneser's construction needs only little from exp: an entire function, real on the axis, with a pair of complex fixed points. TPID 16 asks how far this carries.
- id: kn.frage.tpid17
  quelle_hash: 6eb10530a8be
  theorie_hash: e7edcc4201b4
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    titel: 'TPID 17: Error bound O(n ln(n+1)) for the method S9 of the “fake function theory”'
    aussage: |
      tommy1729 (TPID 17, 28.03.2015) claims for the method S9 of his “fake function theory” (entire functions with positive Taylor coefficients that mimic a given
      growing function, forum tid 863) an error bound $O(n\ln(n+1))$ and asks for a proof. Application, among others, to an entire approximation of the half-exponential function.
    einfach: One can mimic fast-growing functions by power series with all positive coefficients. How well does that succeed? tommy1729 estimates
      the error, without proof.
    quellen:
    - stelle: TPID 17 (tommy1729, 28.03.2015, post 19), refers to tid 863
  en_theorie:
    einordnung: |
      A route to entire approximations of the half-exponential function ([[kn.satz.halbe_exp]]).
    genau: |
      Claimed: error of method S9 of order $O(n\ln(n+1))$; sought: a proof.
    warum: |
      No proof known; the bound is estimated from computations in the forum.
    worum: |
      “Fake functions” are entire functions with positive coefficients that mimic a given growing function. TPID 17 asks about the quality of a method for this.
- id: kn.gescheitert.mischkurve
  quelle_hash: 87a4d141de07
  theorie_hash: d4d3ef174d4a
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: The mixture (1−θ)bˣ + θ·T_b is not a hyperoperation “3.5”
    aussage: |
      The curve $F_{1/2}=\tfrac12b^x+\tfrac12T_b(x)$ has a touching at $b=1.5425485299\ldots$, $x=3.0321922722\ldots$ — close to the extrapolation $\eta_{3.5}^{\rm fit}=1.55682$ from the
      distance law. It is nevertheless not a rank $3.5$: the next levels of the mixture violate the rank recursion (at $b=2$, $x=0.5$ by $-4.6\cdot10^{-4}$, at $b=e$ by $-2.3\cdot10^{-2}$),
      whereas the integer ranks pass the same test to $10^{-37}$.
    einfach: One can simply lay a mixed curve between two hyperoperations — it even has a plausible limit base. But it does not behave like a
      real hyperoperation, so a matching numerical value proves nothing.
    pruefung:
      f1_folgt_unmittelbar: —
      f2_benutzte_voraussetzungen: —
      f3_spezialfall: —
      f4_uebertragbar: 'Rule: An intermediate hyperoperation must satisfy the rank recursion, not merely have a plausible limit base.'
      f5_neue_frage: —
    bewertung:
      nutzen: Rules out the obvious shortcut.
      richtigkeit: Test of the rank recursion numerical to 28 digits
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_quadratisch_2026_10_12/BERICHT.md, section Fitvorhersage
  en_theorie:
    beispiel: |
      Error of the rank recursion at $b=e$, $x=0.5$: $-0.023$.
    einordnung: |
      Correct framework: [[kn.frage.halber_rang]].
    genau: |
      $\tfrac12b^x+\tfrac12T_b(x)$ has a limit base $1.54255$ close to the extrapolation $1.55682$, but violates the rank recursion.
    warum: |
      A hyperoperation is determined by the recursion to the next level; an average of two levels does not satisfy this structure.
    worum: |
      The shortcut “just average between power and tetration”.
- id: kn.gescheitert.polynom_ecke_wege
  quelle_hash: b50e1d80dfb5
  theorie_hash: e753a2cee2a5
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: A tool that sees the coherence of two factors that cancel each other.
      f3_spezialfall: —
      f1_folgt_unmittelbar: —
      f4_uebertragbar: The same obstacles for every base b > η.
    bewertung:
      recherche: own work
      nutzen: Spares later attempts the known dead ends.
      richtigkeit: every point of failure documented numerically or by a short proof
    titel: Eight approaches at the corner that do not carry — and why
    aussage: |
      (1) **Reserve in the conformal coordinate:** the uniform stability contains the corner statement for smooth data, hence needs the same polynomial accuracy.
      (2) **Classical finite-section theory:** local invertibility is not sufficient — the composition channel transports parts through the whole phase space.
      (3) **Cotlar–Stein:** asymptotically no better than the triangle inequality. (4) **Liouville on the Abel torus:** the heads are homogeneous only in complementary sectors.
      (5) **Comparison principle:** there is no superharmonic comparison function with the singularity of the heads (total mass). (6) **Dyson contraction of the CD formula:** spectral radius $>1$ from $n\approx58$ on.
      (7) **Integrable corner kernel:** the corner is scale-invariant, $f(s)-s$ and the kernel are homogeneous of degree 0 — no small parameter. (8) **Explicit parametrix or truncation remainder:**
      outside $D$ the outer growth solution dominates; the remainder grows by $0.252$ per degree.
    bereich: Attempts from phase 3 (strands K and V) to prove the open core
    einfach: 'Eight different tools were tried at the corner at L. Each fails at the same place: Two quantities cancel exactly there, and no estimate
      that treats them individually has any room.'
    quellen:
    - stelle: phase3/KERNPROBLEM.md §2–§4, phase3/REFLEXION.md, phase3/k_kern/BERICHT §6–§8, §15–§16, §33, §37–§38, §41–§42
  en_theorie:
    beispiel: |
      The Dyson map of the Christoffel–Darboux formula has spectral radius $0.61$ at $n=10$, but $1.20$ at $n=100$; its growing vector sits not at the corner but at the low degrees.
    einordnung: |
      Supplements [[kn.gescheitert.polynom_kantorovich]]; the remaining core is in [[kn.verm.polynom_halbexp_kern]].
    genau: |
      Eight approaches (reserve, classical finite-section theory, Cotlar–Stein, Liouville, comparison principle, Dyson contraction, integrable corner kernel, explicit parametrix), each with one documented point of failure.
    warum: |
      All approaches fail at the same structure: At the corner and at the bridge a growing and a falling factor cancel exactly, and the corner is scale-invariant — there is no
      small parameter. Tools that work with moduli or local models do not see the coherence of the two factors.
    worum: |
      Which obvious tools are not enough for the corner at $L$ — and what does that teach?
- id: kn.gescheitert.polynom_kantorovich
  quelle_hash: 43576022e1e7
  theorie_hash: 2fd897b4f952
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: Weighted ℓ¹ norms; other weights (s = 0.3, ρ = 1.2) show the same (β grows even faster).
      f5_neue_frage: Settled by the coherent architecture of the main theorem; only (H) is open.
      f3_spezialfall: 'Typical of ill-posed problems (analytic continuation): regularization by truncation, stability only in selected directions.'
      f1_folgt_unmittelbar: Yes, from the measured quantities; the solution itself exists (kn.satz.polynom_halbexp_endlich).
      f4_uebertragbar: Same difficulty for the intuitive super-logarithm and for the matrix root.
    bewertung:
      recherche: 'Forum mirror (all 1265 threads) searched for f(f(x)) = exp(x) with polynomial/coefficients/truncation: only related methods
        (tid 228 hump trick, tid 842 matrix root), not this one.'
      nutzen: Shows what kind of argument is needed for all N.
      richtigkeit: numerical (the quantities β, η, h); unambiguous as an obstacle
    titel: Newton–Kantorovich around Kneser's truncated series does not suffice for the bound
    aussage: |
      Obvious approach: $p_N$ as a solution near $q_N$ with the Newton–Kantorovich theorem ($h_N=\beta_N\gamma\eta_N\le\tfrac12$ with $\beta_N=\|J^{-1}\|$, $\eta_N=\|J^{-1}F(q_N)\|$, $\gamma$ Lipschitz constant).
      This fails although the solution exists:

      (i) $\eta_N$ predicts the true distance $\|p_N-q_N\|_X$ to 1 % and falls ($1.3\cdot10^{-5}$ at $N=10$, $8\cdot10^{-10}$ at $N=60$).

      (ii) $\beta_N$, however, grows by about a factor of $2.6$ per degree ($10^4$ at $N=10$, $3\cdot10^{24}$ at $N=60$); $h_N$ rises from $0.5$ to $10^{16}$.

      (iii) **Correction (research team):** The ladder of almost singular directions ($1.5\cdot10^{-12}$, each $\times3.4$, vector at $\pm\arg L$) arises only through the **unequal weights**
      $1.3$ and $0.5$; with equal weights $|L|^k$ it does not exist. What remains correct is the failure: Ball-Kantorovich fails in every norm, because the corner mode at $L$ (kn.beob.polynom_eckmode)
      grows exponentially and random directions are amplified by $\gtrsim1.17^N$. A proof must use coherent directions (kn.satz.polynom_halbexp_hauptsatz).
    bereich: $p_N$ as in kn.verm.polynom_halbexp, $q_N$ Kneser's Taylor polynomial of degree $N$; norms $\|\delta\|_X=\sum|\delta_k|1.3^k$, $\|r\|_Y=\sum|r_k|0.5^k$
    einfach: 'The standard route would be: Kneser''s series is almost a solution, so a genuine solution lies nearby. For that, the equation would
      have to be “well-posed”. It is not: In some directions — exactly those in which other half-exponential functions differ from Kneser''s —
      the equation hardly reacts at all. That the solution nevertheless does not drift off in that direction is due to a cancellation that cannot
      be captured with size estimates.'
  en_theorie:
    beispiel: |
      Smallest singular vector at $N=30$, as a polynomial on $|x|=1.3$: largest at $\arg x\approx\pm77°$, i.e. exactly in the direction of $L$ and $\bar L$ ($\arg L=76.6°$).
    einordnung: |
      For a proof for all $N$ one needs a **structured** estimate: the parts of the remainder along the perturbation directions individually. This is the same hurdle as for the intuitive
      super-logarithm ([[kn.satz.intuitiver_log]]). The uniqueness, by contrast, is settled ([[kn.satz.halbexp_beschraenkt]]).
    genau: |
      Around Kneser's Taylor polynomial $q_N$: $\eta_N=\|J^{-1}F(q_N)\|$ falls like the true distance, but $\beta_N=\|J^{-1}\|$ grows by $\approx2.6$ per degree, and $h_N=\beta_N\gamma\eta_N$ (would have to be $\le\tfrac12$)
      reaches $10^{16}$ at $N=60$.

      | $N$ | $\|F(q_N)\|_Y$ | $\beta_N$ | $\eta_N$ | $h_N$ |
      |---|---|---|---|---|
      | 10 | $4.3\cdot10^{-7}$ | $1.1\cdot10^{4}$ | $1.3\cdot10^{-5}$ | $0.49$ |
      | 30 | $4.6\cdot10^{-13}$ | $1.8\cdot10^{12}$ | $5.4\cdot10^{-8}$ | $3.3\cdot10^{5}$ |
      | 60 | $6.2\cdot10^{-19}$ | $3.2\cdot10^{24}$ | $8.0\cdot10^{-10}$ | $9.0\cdot10^{15}$ |
    warum: |
      1. The equation $f\circ f=\exp$ has infinitely many solutions; their differences from Kneser are perturbations that become large only at $L$ and $\bar L$.
      2. Truncated to degree $N$, these perturbations are almost solutions of the linearized equation — the linearization therefore has very small singular values, a whole ladder of them.
      3. Kantorovich computes with the worst case: It assumes the remainder could point exactly in these directions. In fact it hardly points there — Kneser's series has only a
         weak singularity at $L$ —, and that is why the solution stays close to Kneser.
      4. **Correction:** The ladder of small singular values came from the unequal weights $1.3$ and $0.5$. With equal weights a real obstacle remains: the corner mode at $L$
         ([[kn.beob.polynom_eckmode]]), which grows exponentially. Even then ball arguments fail; the main theorem ([[kn.satz.polynom_halbexp_hauptsatz]]) circumvents them.
    worum: |
      The standard route for “the approximation is almost a solution, so a solution lies nearby” is the Newton–Kantorovich theorem. Why does it not work here?
- id: kn.gescheitert.polynom_rekonstruktion
  quelle_hash: a7d6eec9f416
  theorie_hash: a2b4ce04d2a7
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: Finite polynomial reconstruction of the half rank drifts between the integer heights
    aussage: |
      In the finite model (height values $1\ldots K$, degree-$K$ polynomial) the quadratic half step is algebraically exact ($T_{1/2}^K\circ T_{1/2}^K=T_1^K+O(\|d\|^3)$), and at integer heights
      it converges. Between the integer heights it drifts: at $x=0.5$ $+0.0070,\ -0.0077,\ -0.0188,\ -0.0281,\ -0.0362$ ($K=16\ldots80$), roughly $a-0.0087\sqrt K$.
      Cause: the norm of the bilinear half-step operator grows like $2^K/K^4$. The intrinsic Newton series (kn.satz.halbrang_quadratisch) gives $0.03694$ there.
    einfach: A first computation of the half step looked good at whole numbers but wandered off in between. The error lay in how the curve was
      put back together from whole values.
    pruefung:
      f1_folgt_unmittelbar: —
      f2_benutzte_voraussetzungen: —
      f3_spezialfall: —
      f4_uebertragbar: 'Rule: always check constructions for fractional ranks also between the integer heights, not only at integer points.'
      f5_neue_frage: —
    bewertung:
      nutzen: Prevents a model artifact from passing as a half rank.
      richtigkeit: Drift stable to 250 digits (not a rounding artifact)
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_quadratisch_2026_10_12/BERICHT.md
  en_theorie:
    beispiel: |
      $K=16$: $+0.0070$; $K=80$: $-0.0362$; the correct continuation gives $0.0369$.
    einordnung: |
      Done correctly in [[kn.satz.halbrang_quadratisch]].
    genau: |
      At $x=0.5$ the values drift with the model size $K$ (roughly $a-0.0087\sqrt K$), while they converge at integer heights.
    warum: |
      The degree-$K$ polynomial through the integer values has derivatives that grow exponentially with $K$; the bilinear half-step operator is therefore not uniformly bounded.
    worum: |
      A first computation of the half rank step that runs away between the integer heights.
- id: kn.gescheitert.regulaer_an_L
  quelle_hash: dbefad41c164
  theorie_hash: 1c9955ade707
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: For $|\lambda|>1$, $\lambda^{x}\to0$ as $x\to-\infty$, hence $F(x)=\sigma^{-1}(\lambda^x c)\to L\notin\mathbb R$. A function that
        is real on all of $\mathbb R$ cannot tend to $L$.
    pruefung:
      f2_benutzte_voraussetzungen: $\ln\lambda\notin\mathbb R$, i.e. $L$ not real — exactly the case $b>\eta$.
      f5_neue_frage: Correction by a 1-periodic function that restores reality → kn.konstr.kneser
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: Yes.
      f4_uebertragbar: Holds at every non-real fixed point.
    bewertung:
      nutzen: Explains why Kneser needs a Riemann map.
      richtigkeit: complete
    titel: Regular iteration at the complex fixed point L is not real
    aussage: |
      Obvious approach: Koenigs function at $L$ (for $\log_b$, attracting) and $T:=\sigma^{-1}(\lambda^{x}c)$.
      This gives a holomorphic superfunction that is **not real** on the real axis: $L$ and $\bar L$ are
      on an equal footing, the choice of $L$ breaks the symmetry $T(\bar z)=\overline{T(z)}$.
    bereich: $b>\eta$, primary fixed point $L$ with $|\lambda|>1$
  en_theorie:
    beispiel: |
      Base $e$: $L=0.31813+1.33724\,i$, $\lambda=L$. Normalizing so that $F(0)=2$, one gets $F(-1)=\ln2$ and $F(-2)=\ln\ln2=-0.3665$ — real. In between
      not: $F(-\tfrac12)=1.0980+0.0972\,i$, whereas Kneser gives $1.2329$ at the same height. One step further back comes $F(-3)=-1.0037+\pi i$,
      afterwards the curve spirals into $L$.
    einordnung: |
      Below $\eta$ exactly this construction works, because the fixed point is real ([[kl.satz.regulaer]]). Kneser corrects the error with a
      periodic function ([[kn.konstr.kneser]]); that every other solution differs by such a function is stated by [[fg.satz.allgemeine_loesung]].
    genau: |
      Let $b>\eta$, $L$ the fixed point of $b^z$ with $\operatorname{Im}L>0$ and $\lambda=L\ln b$ (one has $|\lambda|>1$). With the Poincaré function $\Psi$
      ($\Psi(\lambda w)=b^{\Psi(w)}$, $\Psi(0)=L$, $\Psi'(0)=1$), every $F(x)=\Psi(\lambda^xc)$ is a holomorphic superfunction of $b^z$. None of them is
      real on the whole real axis. The choice of $L$ instead of $\bar L$ breaks the mirror symmetry $T(\bar z)=\overline{T(z)}$.
    warum: |
      1. Equation: $F(x+1)=\Psi(\lambda\cdot\lambda^xc)=b^{\Psi(\lambda^xc)}=b^{F(x)}$.
      2. Because $|\lambda|>1$, $\lambda^xc\to0$ as $x\to-\infty$, hence $F(x)\to\Psi(0)=L$. A real function cannot tend to a non-real number.
      3. If one mirrors everything, one obtains the same construction at $\bar L$. Both fixed points are on an equal footing; whoever selects one loses the symmetry.
      4. Incidentally: $\Psi$ never takes the value $0$ (every value is $b^{\text{something}}$). A regular solution at $L$ with $F(0)=1$ would therefore have $F(-1)=2\pi ik/\ln b$
         with $k\ne0$ — it cannot hit the value $T(-1)=0$ of any genuine tetration at all.
    worum: |
      Below $\eta$ one builds the tetration at the real fixed point. Above $\eta$ only the complex pair $L,\bar L$ remains. The first thought:
      just make the same construction at $L$. This does indeed give a solution of the equation — only it is
      not real on the real axis. This failure shows what Kneser had to repair.
- id: kn.konstr.carleman
  quelle_hash: e8120527076a
  theorie_hash: 278e637d65e2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    beweis:
      text: Construction; solvability for every n observed numerically, not proved in general.
    pruefung:
      f2_benutzte_voraussetzungen: Expansion about 0; $e^{kx}$ as a power series.
      f5_neue_frage: Does $\operatorname{slog}_n$ converge, and to Kneser? → kn.verm.carleman_kneser
      f3_spezialfall: Galerkin method for the Abel equation.
      f1_folgt_unmittelbar: Yes (definition).
      f4_uebertragbar: Other bases, other functions with a fixed point outside the expansion point.
    bewertung:
      nutzen: Purely algebraic construction without complex geometry.
      richtigkeit: complete as a definition
    titel: Intuitive slog via truncated Carleman systems
    aussage: |
      Comparing coefficients in $\operatorname{slog}(e^x)-\operatorname{slog}(x)=1$ up to degree $n-1$ gives the linear system
      $\sum_{k=1}^{n}a_k\,k^j/j!-a_j=\delta_{j0}$ $(0\le j\le n-1)$. Its solution (unique for all $n$ tested) defines $\operatorname{slog}_n$
      (Walker 1991, Robbins 2005 “natural slog”).
    bereich: $b=e$; ansatz $\operatorname{slog}_n(x)=-1+\sum_{k=1}^{n}a_k x^k$
    quellen:
    - {}
    - stelle: 'according to Trappmann–Kouznetsov 2011, p. 4: numerical method for the power series coefficients of a 4-logarithm about 0, without
        convergence proof — before Robbins'
    - stelle: p. 4
    - {}
    - stelle: 'Robbins'' method, discussion 2007; Trappmann: approach already in Walker around 1990'
  en_theorie:
    beispiel: |
      With $n=16$, $\operatorname{slog}_n$ lies $1.7\cdot10^{-5}$ off Kneser's value at interior points, with $n=128$ $9.2\cdot10^{-9}$ off.
    einordnung: |
      Does it converge to Kneser? [[kn.verm.carleman_kneser]]; how fast: [[kn.beob.carleman_rate]]. The method is named after Carleman matrices,
      which manage power series of iterates (cf. [[it.satz.erdos_jabotinsky]]).
    genau: |
      Ansatz for base $e$: $\operatorname{slog}_n(x)=-1+\sum_{k=1}^{n}a_kx^k$. One requires $\operatorname{slog}_n(e^x)-\operatorname{slog}_n(x)=1$ up to order $x^{n-1}$.
      This gives $n$ linear equations for $a_1,\dots,a_n$:
      $$\sum_{k=1}^na_k=1,\qquad\sum_{k=1}^na_k\frac{k^j}{j!}=a_j\quad(1\le j\le n-1).$$
    warum: |
      $\operatorname{slog}_n(e^x)=-1+\sum_ka_ke^{kx}=-1+\sum_ka_k\sum_j\frac{k^jx^j}{j!}$. The coefficient of $x^0$ is $-1+\sum_ka_k$, that of $\operatorname{slog}_n(x)$ is $-1$; the
      difference is to be $1$. For $x^j$ with $j\ge1$ the difference is to be $0$: $\sum_ka_kk^j/j!-a_j=0$. Whether the system is solvable for every $n$ has only been observed; for all $n$ tested the solution is unique.
    worum: |
      A way entirely without complex geometry: One takes the super-logarithm as a polynomial ansatz and demands the Abel equation coefficient by
      coefficient. What comes out is a linear system of equations.
- id: kn.konstr.cauchy
  quelle_hash: 6c1afb2f3bf6
  theorie_hash: cc2b7c20568e
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Kouznetsov 2009 (Math. Comp.), numerical; identity with Kneser via the uniqueness of Paulsen–Cowgill (2017).
    pruefung:
      f2_benutzte_voraussetzungen: Holomorphy in the rectangle, limits L, L̄ above and below.
      f5_neue_frage: Proof of the convergence of the Cauchy iteration?
      f3_spezialfall: 'Yes: boundary value method for functional equations (Kouznetsov–Trappmann).'
      f1_folgt_unmittelbar: No; the convergence of the iteration is only numerically supported.
      f4_uebertragbar: Other superfunctions, as long as they are holomorphic in the rectangle; not to the hexation.
    bewertung:
      nutzen: First practical method for complex heights; shows the role of the limits L.
      richtigkeit: Literature (numerical)
    titel: 'Kouznetsov''s Cauchy integral: tetration as the fixed point of an integral equation'
    aussage: |
      In the strip $|\operatorname{Re}z|<1$ the tetration is determined by its boundary values (Cauchy formula), and via the functional equation the boundary values depend on
      the values on the center line: $F(1+iy)=b^{F(iy)}$, $F(-1+iy)=\log_bF(iy)$. This gives an integral equation for $F(iy)$,
      $$F(iy)=\frac1{2\pi}\int_{-A}^{A}\Bigl(\frac{b^{F(it)}}{1+it-iy}-\frac{\log_bF(it)}{-1+it-iy}\Bigr)dt+\text{(contributions of the boundaries }\pm iA\text{, there }F\approx L,\bar L),$$
      which Kouznetsov solves by iteration. The limit is Kneser's tetration (same uniqueness class: holomorphic in the strip, limits $L,\bar L$,
      kn.satz.paulsen_cowgill). The method presupposes that $F$ is holomorphic in the whole rectangle — for the hexation it fails exactly there (kn.beob.hexation_verzweigt).
    bereich: '$b>\eta$ (Kouznetsov 2009: $b=e$); strip $|\operatorname{Re}z|\le1$, height $|\operatorname{Im}z|\le A$'
    einfach: Instead of building the tetration piece by piece, one guesses its values on a vertical line, uses the tower equation to compute from
      them the values to the left and right of it, and averages back onto the line with the Cauchy formula. If one repeats this, Kneser's tetration
      emerges.
    quellen:
    - stelle: Tetration and slog to base e approximated by elementary functions (zbMATH short version, Russian)
    - {}
    - {}
    - {}
  en_theorie:
    beispiel: |
      For the hexation to base 2 exactly this method failed in our own attempts: The hexation has branch points in the rectangle
      ([[kn.beob.hexation_verzweigt]]), the Cauchy formula does not hold there.
    einordnung: |
      Second route to Kneser's tetration besides the Riemann mapping ([[kn.konstr.kneser]]).
    genau: |
      In the strip $|\operatorname{Re}z|<1$ the Cauchy formula gives $F(iy)$ from the boundary values. On the right $F(1+iy)=b^{F(iy)}$, on the left $F(-1+iy)=\log_bF(iy)$, at the top and bottom
      $F\approx L,\bar L$. This yields an equation for the values on the center line only, which one solves by repetition. The result is Kneser's tetration.
    warum: |
      1. Cauchy formula for a rectangle: The integral over the boundary, divided by $2\pi i(t-z)$.
      2. Functional equation: moves the center line onto the two vertical boundaries.
      3. Uniqueness: Holomorphic in the strip with the limits $L$ and $\bar L$ — that is Kneser's solution ([[kn.satz.paulsen_cowgill]]).
    worum: |
      In 2009 Kouznetsov for the first time computed the tetration for complex heights in practice — with a trick from function theory: Values in the interior of a
      strip follow from the values on the boundary.
- id: kn.konstr.hexation_regulaer
  quelle_hash: 41388a1c68a1
  theorie_hash: 647d4e244817
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: 'Koenigs (it.satz.koenigs) at $p_1$ gives $\Psi$ near 0; $\sigma(1)=\lim\mu^{-n}\Psi^{-1}(P_b^{\circ n}(1))$, because $P_b^{\circ
        n}(1)\to p_1$ (monotonically). For small $x$: $H_b(x)=P_b^{-1}(H_b(x+1))$ with the real inverse of the pentation. Equation as in kl.satz.regulaer.'
    pruefung:
      f2_benutzte_voraussetzungen: Fixed point and multiplier measured; the choice of pentation (regular at the negative fixed point of Kneser's
        tetration).
      f5_neue_frage: Does $H_b$ pass continuously into a Kneser-type hexation as $b\uparrow\eta_5$ (like tetration at η)?
      f3_spezialfall: 'Yes: regular superfunction at the attracting fixed point.'
      f1_folgt_unmittelbar: Yes, as soon as $p_1$ and $\mu<1$ are known — two levels higher the same construction as kl.satz.regulaer.
      f4_uebertragbar: For $b>\eta_5$ the real fixed point is missing → kn.frage.hexation_kneser.
    bewertung:
      recherche: 'Forum: Levenstein describes in 2017 (tid 1177) the hexation in general as Kneser-type at the conjugate fixed points of the pentation
        (computed for e and 1.84) and computes in 2020 for base 2 (tid 1263); a regular hexation at the attracting real fixed point of the pentation
        below η₅ with values not found (search 08.10. and 12.10.2026).'
      nutzen: First values of the hexation for small bases.
      richtigkeit: Construction complete, values numerical (≈ 25 digits)
    voraussetzungen:
    - text: P_b has a real fixed point p₁ > 1 with 0 < μ < 1 (measured for 1.5, 1.6, 1.7)
    titel: Regular hexation below η₅ — at the attracting fixed point of the pentation
    aussage: |
      With the Poincaré function $\Psi$ of $P_b$ at $p_1$,
      $$b\uparrow\uparrow\uparrow\uparrow x=H_b(x)=\Psi\bigl(\mu^x\,\sigma(1)\bigr)$$
      is the regular hexation: $H_b(x+1)=P_b(H_b(x))$, $H_b(0)=1$, strictly increasing, bounded, $H_b(x)\to p_1$ as $x\to\infty$.
      Values: $1.5\uparrow\uparrow\uparrow\uparrow\tfrac12=1.32331315362$, $1.6\uparrow\uparrow\uparrow\uparrow\tfrac12=1.36258513424$, $1.7\uparrow\uparrow\uparrow\uparrow\tfrac12=1.39744726135$;
      limits $p_1=1.63659373391$, $1.88635097523$, $2.38763728170$ (multipliers $0.1485$, $0.2377$, $0.4495$).
    bereich: $\eta<b<\eta_5$; $p_1$ lower real fixed point of the pentation $P_b$, $0<\mu=P_b^{\prime}(p_1)<1$
    einfach: 'One level above the pentation: hexation is pentation applied again and again. For bases up to 1.737 the pentation has an attracting
      fixed point, and there the hexation can be built exactly like the tetration below η — it rises from 1 and settles beneath this fixed point.'
  en_theorie:
    beispiel: |
      | Base | $b\uparrow\uparrow\uparrow\uparrow\tfrac12$ | $b\uparrow\uparrow\uparrow\uparrow1\tfrac12$ | $b\uparrow\uparrow\uparrow\uparrow\infty=p_1$ | $\mu$ |
      |---|---|---|---|---|
      | 1.5 | $1.3233131536$ | $1.5810095080$ | $1.6365937339$ | $0.1485$ |
      | 1.6 | $1.3625851342$ | $1.7376889627$ | $1.8863509752$ | $0.2377$ |
      | 1.7 | $1.3974472613$ | $1.9176638520$ | $2.3876372817$ | $0.4495$ |

      Check: $1.7\uparrow\uparrow\uparrow\uparrow2=P_{1.7}(1.7)=2.0692201589$, and $P_{1.7}(H(\tfrac12))=H(1\tfrac12)$ to 29 digits.
    einordnung: |
      The same construction as the regular tetration [[kl.satz.regulaer]], two levels higher. The structure at the left boundary: [[kn.satz.hexation_struktur]]. Above $\eta_5$ the real
      fixed point is missing — then a Kneser-type construction is needed ([[kn.frage.hexation_kneser]]).
    genau: |
      Let $\eta<b<\eta_5$, $p_1$ the lower fixed point of the pentation ($P_b(p_1)=p_1$) and $\mu=P_b'(p_1)$ with $0<\mu<1$. With the Poincaré function $\Psi$ at $p_1$,
      $$b\uparrow\uparrow\uparrow\uparrow x=\Psi\bigl(\mu^x\,\sigma(1)\bigr),$$
      where $\sigma(1)$ is chosen such that the value at $x=0$ is exactly 1. The hexation increases strictly, stays below $p_1$ and runs toward $p_1$ as $x\to\infty$.
    warum: |
      1. **Fixed point:** The sequence $1,\ P_b(1),\ P_b(P_b(1)),\dots$ increases and stays below $p_1$, hence runs there. There the slope is $\mu<1$ — the fixed point attracts.
      2. **Linearizing:** At the attracting fixed point the Koenigs function turns the step $P_b$ into a multiplication by $\mu$ ([[it.satz.koenigs]]).
      3. **Back to small heights:** For small $x$, $\mu^x\sigma(1)$ is too large for the series; then one computes at $x+k$ and goes $k$ steps back with the inverse of the pentation.
         This inverse is unique and real for real values above $L_T$.
    worum: |
      Hexation is pentation applied again and again: $b\uparrow\uparrow\uparrow\uparrow3=P_b(P_b(b))$. For half heights one again needs a fixed point. For bases up to
      $\eta_5\approx1.737$ the pentation has an attracting real fixed point $p_1$ — and there everything works exactly as for tetration below $\eta$ (Chapter 5).
- id: kn.konstr.kneser
  quelle_hash: bd625f037c96
  theorie_hash: 901dff051b0f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: 'Kneser 1950; numerical: Kouznetsov 2009 (Cauchy integral), Levenstein fatou.gp (theta iteration).'
    pruefung:
      f2_benutzte_voraussetzungen: Pair of fixed points $L,\bar L$ non-real, repelling.
      f5_neue_frage: How does $\theta_K$ depend on the base? → bw.def.auswahlprinzip (Paper V)
      f3_spezialfall: Method for Abel functions at complex fixed-point pairs in general (Trappmann–Kouznetsov).
      f1_folgt_unmittelbar: No; the Riemann map is the essential step.
      f4_uebertragbar: To complex bases (Paulsen 2019) and to other functions with a non-real fixed-point pair.
    bewertung:
      nutzen: The standard solution for b > η.
      richtigkeit: established (literature)
    voraussetzungen:
    - text: b > η real
    titel: Kneser's construction
    aussage: |
      From the Abel coordinate $\chi=\log\sigma/\log\lambda$ at the fixed point $L$, a Riemann map yields
      a 1-periodic correction $\theta_K$ (holomorphic in the upper half-plane, $\theta_K\to$ const for $\operatorname{Im}\to+\infty$),
      so that $\operatorname{slog}=\chi+\theta_K(\chi)$ is real on the real axis. Result: a real-analytic,
      strictly increasing solution of $\varphi(\varphi(x))=e^x$ or, respectively, a real-analytic tetration.
    bereich: originally $b=e$ (half-iterate of $e^x$), in general $b>\eta$
    quellen:
    - {}
    - stelle: Trappmann's account of the proof strategy (Schröder function at c, Riemann map, induced Möbius map parabolic, reflection); problem
        discussed in Jena in 1941
    - {}
    - {}
  en_theorie:
    beispiel: |
      $T_e(\tfrac12)=1.64635423375119458097\ldots$, $T_2(\tfrac12)=1.45878181603642170068\ldots$, $\operatorname{slog}_e(2)=0.7015456018\ldots$
      The linear tetration, by contrast, gives $e^{1/2}=1.64872$ for base $e$ — similar, but not equal.
    einordnung: |
      Uniqueness: [[kn.satz.paulsen_cowgill]]; properties in the complex plane: [[kn.satz.kneser_eigenschaften]]; complex bases:
      [[kn.satz.paulsen_komplex]]; numbers: [[kn.beob.referenzwerte]]. How the correction $\theta_K$ depends on the base is the question behind
      the whole base-change chapter ([[kl.frage.basiswechsel_kneser]]).
    genau: |
      Let $\chi=\log\sigma/\log\lambda$ be the Abel coordinate at the fixed point $L$ (with the Schröder function $\sigma$ of $\log_b$, attracting there). There is a
      1-periodic function $\theta_K$, holomorphic in the upper half-plane, with $\theta_K\to$ const for $\operatorname{Im}\to+\infty$, such that
      $$\operatorname{slog}=\chi+\theta_K(\chi)$$
      is real on the real axis. The inverse function is a real-analytic, strictly increasing tetration to base $b>\eta$; for $b=e$
      this also yields a real-analytic half-iterate of $e^x$.
    warum: |
      Idea of the proof, without the technical estimates:
      1. $\chi$ satisfies the Abel equation $\chi(b^z)=\chi(z)+1$, but is complex on the real axis ([[kn.gescheitert.regulaer_an_L]]).
      2. The image of the real axis under $\chi$ is a curve $\gamma$ which, because of the Abel equation, repeats under translation by $1$ — a
         1-periodic “wavy line” in the $\chi$-plane. Above $\gamma$ lies the domain that belongs to $L$ ($\operatorname{Im}\chi\to+\infty$).
      3. The domain above $\gamma$, rolled up with period $1$, is simply connected. The Riemann mapping theorem maps it conformally onto the
         upper half-plane (likewise rolled up), such that $\gamma$ falls onto the real axis and the upper end stays at the top. This map has the
         form $\mathrm{id}+\theta_K$ with 1-periodic $\theta_K$.
      4. Because $\theta_K$ is periodic, $\chi+\theta_K(\chi)$ still satisfies the Abel equation; by construction it is
         real on the real axis. Below one mirrors (fixed point $\bar L$). Inverting and fixing $T(0)=1$ gives the tetration.
      For computation: Kouznetsov (2009) with Cauchy integrals, Levenstein (fatou.gp) with an iteration for $\theta$; used here via gp-tetration.
    worum: |
      Kneser's idea (1950): one takes the complex Abel function at the fixed point $L$ — it is almost right, only “skewed” — and bends it straight with a
      periodic correction until it becomes real on the real axis. That this correction exists is supplied by the Riemann mapping theorem.
- id: kn.konstr.kontinuumssumme
  quelle_hash: 51ca2294226d
  theorie_hash: fc5e32c92d0f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: 'Ansus (forum tid 273/353), Trappmann (tid 343), mike3 (tid 437, 516): numerical, without a convergence proof above η.'
    pruefung:
      f2_benutzte_voraussetzungen: A continuum sum that respects periodicity or exponential series, respectively.
      f5_neue_frage: Is the Fourier continuum sum above η provably Kneser?
      f3_spezialfall: 'Yes: fractional sums (Müller–Schleicher), see kl.satz.bruchsumme.'
      f1_folgt_unmittelbar: The sum formula yes; the continuation to fractional limits no.
      f4_uebertragbar: Other superfunctions with a product formula; bases 0 < b < e^{−e} (mike3).
    bewertung:
      nutzen: Third way to Kneser that starts without a fixed point.
      richtigkeit: numerical (5–6 digits, forum)
    titel: 'Continuum sums: tetration from Ansus’ formula log_b(T′(z)/(T′(0)(ln b)^z)) = Σ_{n=0}^{z−1} T(n)'
    aussage: |
      The product formula $T'(n)=T'(0)(\ln b)^n\prod_{k=1}^nT(k)$ (gr.kor.produktformel) becomes a sum formula,
      $$\log_b\frac{T'(z)}{T'(0)(\ln b)^z}=\sum_{n=0}^{z-1}T(n),$$
      and if one defines the sum for fractional limits (“continuum sum”), this becomes an integral fixed-point equation for $T$ (Ansus 2009). Faulhaber's formula applied to
      power series (Trappmann 2009) does not converge reliably; mike3's Fourier continuum sum over periodic approximations (2010) gives
      $^{1/2}\sqrt2\approx1.24362$ (regular tetration) and $^{1/2}e\approx1.64635\ldots1.64636$ (Kneser), with the limits $L,\bar L$ at the top and bottom.
      For $1<b<\eta$ the continuum sum is proved unique and gives the regular tetration (kl.satz.bruchprodukt).
    einfach: 'The slope of the tetration is a product over all previous tower values. If one can sum “over fractionally many values”, one obtains
      from this an equation that determines the tetration. In the forum this was tried out numerically in 2009–2010: It hits the known solutions
      to about six digits.'
  en_theorie:
    beispiel: |
      mike3 (2010): On the imaginary axis the solution looks exactly like Kouznetsov's Cauchy solution and tends at the top and bottom to $0.318\pm1.337i$.
    einordnung: |
      Related to the fractional sums ([[kl.satz.bruchsumme]]) and the product formula ([[gr.kor.produktformel]]); above $\eta$ a proof is missing.
    genau: |
      $$\log_b\frac{T'(z)}{T'(0)(\ln b)^z}=\sum_{n=0}^{z-1}T(n)\qquad\text{(Ansus’ formula).}$$
      The right side needs a sum with a fractional upper limit. Two attempts from the forum: Faulhaber's formula applied to power series (unstable) and mike3's
      Fourier continuum sum over periodic approximations. The latter hits $\sqrt2$ (regular, $1.24362$) and $e$ (Kneser, $1.64635$–$1.64636$) to about six digits.
    warum: |
      1. From the product formula $T'(n)=T'(0)(\ln b)^n\prod_{k=1}^nT(k)$ one obtains a sum by taking logarithms, and $\ln T(k)=\ln b\cdot T(k-1)$.
      2. For exponential series $\sum a_nb^{nz}$ the continuum sum is unique: $\sum_{n=0}^{z-1}b^{kn}=(b^{kz}-1)/(b^k-1)$.
      3. Below $\eta$ the regular tetration is such a series — that is why the method hits it exactly ([[kl.satz.bruchprodukt]]).
    worum: |
      The slope of the tetration is a product over all tower values below it. Anyone who can sum “fractionally many” terms obtains from this an equation for the
      tetration — without a fixed point, without a Riemann mapping.
- id: kn.konstr.linear
  quelle_hash: c5ca0ba44080
  theorie_hash: 4085ccc99840
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: 'Continuation by $T(x+1)=b^{T(x)}$ and $T(x-1)=\log_b T(x)$; continuity at 0: $T(0^+)=b^{T(-1^+)}=b^0=1$.'
    pruefung:
      f2_benutzte_voraussetzungen: None.
      f5_neue_frage: Smoothness at the seams → kn.satz.linear_glatt
      f3_spezialfall: Any choice of a continuous starting function on one period with matching boundary values gives a solution.
      f1_folgt_unmittelbar: Yes.
      f4_uebertragbar: —
    bewertung:
      nutzen: Simplest comparison solution.
      richtigkeit: complete
    titel: Linear tetration
    aussage: $T(x)=x+1$ on $(-1,0]$, otherwise continued by the equation. Continuous, strictly increasing solution.
    bereich: $b>1$
    einfach: 'The simplest tetration: a straight line between −1 and 0, the rest follows from the equation. It has kinks at the integer arguments.'
    quellen:
    - {}
    - stelle: generalized exp/log of level-index arithmetic, two versions (zbMATH review; whether one of them is the linear tetration, not checked)
    - {}
  en_theorie:
    beispiel: |
      Base $e$: $T(\tfrac12)=e^{1/2}=1.64872$, Kneser $1.64635$ — difference $0.0024$. Base $2$: $T(\tfrac12)=\sqrt2=1.41421$, Kneser $1.45878$.
    einordnung: |
      How smooth it is: [[kn.satz.linear_glatt]]. A uniqueness statement that selects it: [[kn.satz.hooshmand]]. Its kinks determine
      the decay of its Fourier modes ([[bw.satz.fourier_naht]]).
    genau: |
      $T(x)=x+1$ on $(-1,0]$, continued with $T(x+1)=b^{T(x)}$ to the right and $T(x-1)=\log_bT(x)$ to the left. For $b>1$ this is a continuous, strictly increasing solution.
    warum: |
      1. To the right of $0$: $T(x)=b^{x}$ on $(0,1]$, $T(x)=b^{b^{x-1}}$ on $(1,2]$, and so on; to the left: $T(x)=\log_b(x+2)$ on $(-2,-1]$.
      2. Continuity at the seams: $T(0^+)=b^{T(-1^+)}=b^0=1=T(0)$, and so on for every integer argument.
      3. Monotonicity: $b^x$ and $\log_b$ are increasing, so the monotonicity of the line carries over to every piece.
    worum: |
      The simplest conceivable tetration: Between $-1$ and $0$ one draws a straight line from $0$ to $1$, the rest follows from the equation. It is
      continuous and increasing — but at the integer arguments it has kinks.
- id: kn.konstr.paulsen_cowgill_iteration
  quelle_hash: 3e69e4a19201
  theorie_hash: 00e97da7f062
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: no computation of our own with the method (text not accessible).
    pruefung:
      f2_benutzte_voraussetzungen: Only the abstract read; structure of the method unknown.
      f5_neue_frage: Comparison with gp-tetration (digits per second) at the same bases.
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: No (method).
      f4_uebertragbar: According to the authors, to other Abel equations.
    bewertung:
      nutzen: Independent high-precision method for cross-checking our reference values.
      richtigkeit: Literature (abstract)
    titel: 'Paulsen–Cowgill 2017: an iteration method for Kneser with 180 nodes and more than 50 digits'
    aussage: |
      Paulsen and Cowgill give a new iteration method for Kneser's tetration: with 180 nodes it reaches for most bases an accuracy
      better than $10^{-50}$, each iteration brings one to two digits; they consider it transferable to other problems with the Abel equation.
      Besides Kouznetsov's Cauchy integral (kn.konstr.cauchy, $\approx10^{-14}$ in double precision) and Levenstein's θ-iteration (fatou.gp) the third published high-precision method.
    bereich: real bases $b>\eta$, Kneser's tetration
    einfach: A computation method that delivers Kneser's tetration to over 50 decimal places — each round it becomes one to two digits more accurate.
    quellen:
    - stelle: Abstract
  en_theorie:
    einordnung: |
      Third high-precision method besides [[kn.konstr.cauchy]] and Levenstein's fatou.gp; a comparison with [[kn.beob.referenzwerte]] would be an independent check.
    genau: |
      180 nodes, accuracy better than $10^{-50}$ for most bases above $\eta$, one to two digits per iteration (according to the abstract).
    warum: |
      Details are not accessible to us; the abstract names only number of nodes, accuracy and speed of convergence.
    worum: |
      Besides the uniqueness theorem, the work of Paulsen and Cowgill contains a fast computation method for Kneser's tetration.
- id: kn.konstr.paulsen_stoerung
  quelle_hash: 19a3fd635481
  theorie_hash: a78bfd27c330
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'Paulsen 2016, Korean J. Math. 24, 81–106: Lemma 2 (p. 102), Proposition 2 (pp. 103–105), Corollary 1 and conclusion (p. 105).'
    pruefung:
      f2_benutzte_voraussetzungen: A real fixed point of the perturbed function; uniform estimates in the bottleneck (Lemma 1, 2).
      f5_neue_frage: Is Paulsen’s solution analytic, and how far is it from Kneser in his metric?
      f3_spezialfall: Counterpart to Walker’s limit (kn.konstr.walker), which likewise starts from a function with a fixed point (eˣ − 1).
      f1_folgt_unmittelbar: No (own construction with passage to the limit).
      f4_uebertragbar: To every base a > η (carried out in the article).
    bewertung:
      nutzen: An approach to the half exp via perturbation; incidentally yields the bottleneck count near η (cf. bw.lem.randgesetz).
      richtigkeit: Literature (parts read)
    titel: 'Paulsen 2016: a half-exponential function via a perturbed exponential function with a real fixed point'
    aussage: |
      W. Paulsen solves the Abel equation $\alpha(e^x)=\alpha(x)+1$ first for a **perturbed** exponential function that has a real fixed point — there the
      holomorphic solution is unique (Schröder/Koenigs) —, and obtains from it by a passage to the limit a solution for $\exp$. Because the result depends on the perturbation,
      he introduces a metric between solutions of the Abel equation and chooses a solution that lies “between” the other proposed ones and is easy
      to compute. He transfers it to $a^x$ and proves: for $a\downarrow\eta$ it passes uniformly on compact intervals without $e$ into the solution for base
      $\eta$ (Corollary 1, “continuity requirement”). In the proof of Lemma 2 he counts the steps through the bottleneck of a near-touching:
      $\approx\pi\sqrt2/\sqrt{\eta_a f''(x_a)}$. The behavior in the complex domain (and hence the relation to Kneser) he left open.
    bereich: $\exp$ and $a^x$ for $a>\eta$ near $\eta$; Abel functions on the real axis
    einfach: Because eˣ has no real fixed point, Paulsen “bends” the function a little until it has one. There the solution is unique. Then he
      takes the bending back step by step and obtains a half-exponential function — a new one, lying between the known ones.
    quellen:
    - stelle: Abstract; Lemma 2 (p. 102); Prop. 2, Cor. 1 and §7 (pp. 103–105)
  en_theorie:
    einordnung: |
      A further approach besides Kneser ([[kn.konstr.kneser]]) and Walker ([[kn.konstr.walker]]); the bottleneck count is the same law as [[bw.lem.randgesetz]].
    genau: |
      Abel equation first for a perturbed function with a real fixed point (unique holomorphic solution by Schröder/Koenigs), then passage to the limit to $\exp$;
      a metric between solutions chooses a solution “between” the others; transfer to $a^x$; for $a\downarrow\eta$ continuous toward the solution for base $\eta$.
    warum: |
      1. At a real fixed point $x_0$ with $0<g'(x_0)\ne1$ there is exactly one analytic Schröder function with $\sigma'(x_0)=1$, hence an Abel function $\ln\sigma/\ln s$.
      2. For the perturbed function near $\exp$ the image near the fixed point is unique; the dependence on the perturbation Paulsen removes by a selection in his metric.
      3. Near $\eta$ the orbits must pass through a bottleneck; in the proof he counts the steps there as a Riemann sum, $\approx\pi\sqrt2/\sqrt{\eta_af''(x_a)}$.
    worum: |
      The exponential function has no real fixed point — hence there is no unique “regular” half-iterate for it. Paulsen bends it a little,
      until it has one, solves uniquely there and takes the bending back.
- id: kn.konstr.pentation
  quelle_hash: c23008966278
  theorie_hash: 4871443348bc
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'Fixed point: $T_b(-1)=0>-1$ and $T_b(x)\to-\infty$ as $x\downarrow-2$, hence a zero of $T_b(x)-x$ (intermediate value theorem). Koenigs
        (it.satz.koenigs) at the repelling fixed point gives $\Psi$ near 0; $\Psi(w)=T_b^{\circ n}(\Psi(w/\lambda_b^n))$ continues it along the
        real axis. $c$: the slog chain $1\to0\to-1\to\dots\to L_b$ converges (attracting for slog), hence $c=\lim\lambda_b^n\Psi^{-1}(\operatorname{slog}^{\circ
        n}1)$. Equation and period as in kl.satz.obere_superexp.'
    pruefung:
      f2_benutzte_voraussetzungen: λ_b > 1 is only measured (no formula); that L_b is the only fixed point in (−2, −1) likewise (concavity of
        T_b there).
      f5_neue_frage: As with tetration, the choice is not unique (other fixed points, periodic perturbations). Is there a Kneser-type pentation
        that tends to a complex fixed point of T_b in the upper half-plane?
      f3_spezialfall: 'Yes: regular superfunction at a repelling fixed point (like kl.satz.obere_superexp, where b^x takes the place of T_b).'
      f1_folgt_unmittelbar: 'Yes, if λ_b > 1 is known: the same construction as regular tetration, one level higher.'
      f4_uebertragbar: 'To hexation etc.: fixed point of P_b, regular there again (Levenstein 2020: 2↑↑↑↑1.5 ≈ 2.6729). For η < b ≤ η₄ there are
        additionally positive fixed points (kn.beob.tetra_euler).'
    bewertung:
      nutzen: First higher level with actual numbers; shows that the method of regular iteration repeats.
      richtigkeit: Construction complete under the assumption λ_b > 1 (measured)
    voraussetzungen:
    - text: 'T_b holomorphic near L_b (holds: L_b > −2)'
    - text: 'L_b repelling: λ_b = T_b′(L_b) > 1 (measured: e 6.4607, 2 5.1718)'
    titel: Pentation — regular superfunction of tetration at its real fixed point
    aussage: |
      $T_b$ has a fixed point $L_b$ on $(-2,-1)$. With the Poincaré function $\Psi$ of $T_b$ at $L_b$ ($\Psi(\lambda_bw)=T_b(\Psi(w))$, $\Psi(0)=L_b$, $\Psi'(0)=1$) the function
      $$b\uparrow\uparrow\uparrow z=P_b(z)=\Psi\bigl(c\,\lambda_b^{\,z}\bigr),\qquad c=\sigma(1),$$
      with the Schröder function $\sigma=\Psi^{-1}$ (continued along the slog chain), is a solution of $P_b(z+1)=T_b(P_b(z))$ with $P_b(0)=1$, $P_b(-1)=0$, $P_b(-2)=-1$, $P_b(1)=b$, $P_b(2)=T_b(b)={}^bb$; it is real, strictly increasing, tends to $L_b$ as
      $x\to-\infty$ and has the imaginary period $2\pi i/\ln\lambda_b$.
    bereich: real $b>\eta$, Kneser's tetration $T_b$; fixed point $L_b\in(-2,-1)$ with $\lambda_b=T_b^{\prime}(L_b)>1$
    einfach: 'Pentation is the next step after tetration: b↑↑↑3 = T_b(T_b(b)), i.e. “tetration repeated that many times”. For half heights one
      uses the same trick as one level lower: tetration has a fixed point (about −1.85 for base e), and there one can iterate it regularly.'
    quellen:
    - {}
    - stelle: first journal paper on holomorphic (“natural”) pentation to base e, periodic with period from the derivative of tetration at the
        fixed point (according to abstract and forum tid 949)
    - stelle: 'Kouznetsov 11.01.2015; MphLee: fixed point −1.850354529 already in Rubtsov–Romerio (2006); Levenstein: first complex singularity
        ≈ −2.315 ± 1.684 i'
    - {}
    - stelle: Computation with Kneser values
    bedingungen_text: 'λ_b = T_b′(L_b) > 1 and L_b the only fixed point of T_b in (−2, −1): measured (e 6.4607, 2 5.1718), proved only λ_b ≥ 1
      at the smallest fixed point; equivalent to the log-concavity of T_b on (−1, 0), which fails for b > b₇ (gr.gegen.tpid7_kneser)'
  en_theorie:
    beispiel: |
      Base $e$: $\lambda_e=6.46067\ldots$, $c=66.3201585987\ldots$, $\Psi(w)=L+w-0.6263\,w^2+0.4828\,w^3-0.4120\,w^4+\dots$
      For $z=\tfrac12$: $c\,\lambda^{1/2-8}=66.32\cdot6.46^{-7.5}\approx5.6\cdot10^{-5}$, so $\Psi\approx L+0.000056$; applying $T_e$ eight times gives
      $e\uparrow\uparrow\uparrow\tfrac12=1.6323247404\ldots$ — slightly smaller than the half tetration ${}^{1/2}e=1.6463542\ldots$
    einordnung: |
      The same construction as the upper superexponential function ([[kl.satz.obere_superexp]]), only with $T_b$ in place of $b^x$ — and that needs
      Kneser itself ([[kn.konstr.kneser]]). The numbers and their check are in [[kn.beob.pentation_werte]]; where the infinite pentation
      converges is stated by [[kn.beob.tetra_euler]]. As with tetration, this choice is not the only possible one.
    genau: |
      Let $b>\eta$ and $T_b$ the Kneser tetration.
      - $T_b$ has a fixed point $L_b$ between $-2$ and $-1$: $T_b(L_b)=L_b$. For base $e$, $L_e=-1.85035\ldots$
      - There $T_b$ is steep: $\lambda_b=T_b'(L_b)>1$ — **measured, not proved** ($6.4607$ for $e$, $5.1718$ for $2$; only $\lambda_b\ge1$ is proved, at the smallest fixed point). So the fixed point repels — for the inverse slog it attracts. Everything that follows holds under this assumption.
      - The Poincaré function $\Psi$ at $L_b$ satisfies $\Psi(\lambda_bw)=T_b(\Psi(w))$. With it,
        $$P_b(z)=\Psi\bigl(c\,\lambda_b^{\,z}\bigr)$$
        is a pentation: $P_b(z+1)=T_b(P_b(z))$, and with the right constant $c$ one has $P_b(0)=1$.
      - Integer heights: $P_b(1)=b$, $P_b(2)={}^bb$, $P_b(-1)=0$, $P_b(-2)=-1$; as $x\to-\infty$, $P_b(x)$ tends to $L_b$.
    warum: |
      1. **Fixed point.** $T_b(-1)=0$ lies above the line $y=x$ (since $0>-1$), and as $x\to-2$, $T_b$ plunges to $-\infty$, hence lies below it.
         In between the curve crosses the line.
      2. **Negative integer heights.** From $P(x+1)=T_b(P(x))$ it follows that $P(x)=\operatorname{slog}_b(P(x+1))$: $P(-1)=\operatorname{slog}(1)=0$,
         $P(-2)=\operatorname{slog}(0)=-1$, $P(-3)=\operatorname{slog}(-1)$, … Since the fixed point attracts for slog, this chain runs toward $L_b$,
         and the distance shrinks by the factor $1/\lambda_b$ per step.
      3. **Linearizing.** At the repelling fixed point, Koenigs ([[it.satz.koenigs]]) supplies the series $\Psi$; it turns the step $T_b$ into a
         multiplication by $\lambda_b$. A multiplication can be carried out arbitrarily often — also $z$ times for fractional $z$: $\lambda_b^z$.
      4. **Constant.** $c$ measures how far $1$ is from the fixed point “in Schröder coordinates”: one runs the slog chain $n$ steps to near $L_b$,
         inverts $\Psi$ there and multiplies by $\lambda_b^n$.
      5. **Larger heights.** For large $z$ one simply applies $T_b$ forward: $P_b(z)=T_b^{\circ n}(P_b(z-n))$.
    worum: |
      Addition repeated gives multiplication, multiplication repeated gives power, power repeated gives tetration — and tetration repeated
      gives **pentation**: $b\uparrow\uparrow\uparrow3=T_b(T_b(b))$. For integer heights it is easy to write down, but the numbers explode:
      $e\uparrow\uparrow\uparrow2=T_e(e)\approx2076$, and $e\uparrow\uparrow\uparrow3=T_e(2076)$ has more digits than one could ever write down.
      More exciting is the other direction and everything in between. The key is the same as one level lower: a fixed point.
- id: kn.konstr.quadratisch
  quelle_hash: 6631245a3fbe
  theorie_hash: 6f59cbcca538
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
  en:
    beweis:
      text: |
        $T(-1)=1-\frac{2\ln a+1-\ln a}{1+\ln a}=0$. Slopes: $T'(0^-)=\frac{2\ln a}{1+\ln a}$, $T'(-1^+)=\frac{2\ln a+2(1-\ln a)}{1+\ln a}=\frac2{1+\ln a}$, and to the right of 0
        $T'(0^+)=\ln a\cdot T(0)T'(-1^+)=\frac{2\ln a}{1+\ln a}$. Second derivative: on the left $-2\frac{1-\ln a}{1+\ln a}$, on the right $\ln a\,(\ln a\,T'(-1)^2+T''(-1))$ — different for all $a$.
    pruefung:
      f2_benutzte_voraussetzungen: 'Ansatz: polynomial of second degree with T(−1) = 0, T(0) = 1 and matching slope.'
      f5_neue_frage: Do the polynomial approximations go to Kneser with increasing degree? (cf. kn.verm.carleman_kneser)
      f3_spezialfall: 'Yes: polynomial approximations of n-th degree give C^{n−1} (forum).'
      f1_folgt_unmittelbar: Yes, by recomputation.
      f4_uebertragbar: 'Higher degrees: C^{n−1} with a polynomial of degree n.'
    bewertung:
      nutzen: Simple approximation, smooth for every base, for computing by hand.
      richtigkeit: complete
    titel: 'The quadratic approximation: C¹ for every base, but never C²'
    aussage: |
      On $(-1,0]$ one sets $T(x)=1+\dfrac{2\ln a}{1+\ln a}\,x-\dfrac{1-\ln a}{1+\ln a}\,x^2$ and continues it everywhere else via $T(x+1)=a^{T(x)}$. Then $T(-1)=0$,
      $T(0)=1$ and $T$ is continuously differentiable for **every** base (the linear approximation only for $b=e$), but the second derivative jumps at the integer arguments
      (base 2 at 0: $-0.362$ on the left, $0.419$ on the right). Values: $^{1/2}2\approx1.45933$ versus Kneser $1.45878$.
    einfach: Instead of a straight line, one takes a parabola between −1 and 0, chosen so that the slopes match at the seams. The curve then has
      no more kinks, but the curvature still jumps.
  en_theorie:
    beispiel: |
      Base 2: $^{1/2}2\approx1.45933$ (Kneser $1.45878$). The second derivative at 0 is $-0.362$ on the left, $0.419$ on the right.
    einordnung: |
      The next step after the linear approximation ([[kn.konstr.linear]]).
    genau: |
      $$T(x)=1+\frac{2\ln a}{1+\ln a}\,x-\frac{1-\ln a}{1+\ln a}\,x^2\quad(-1<x\le0),$$
      continued with $T(x+1)=a^{T(x)}$. Continuously differentiable for every base, but not twice.
    warum: |
      1. $T(-1)=0$ and $T(0)=1$ match the integer values.
      2. The slope to the left of 0 is $\frac{2\ln a}{1+\ln a}$, to the right of 0, by the chain rule, $\ln a\cdot T'(-1)=\ln a\cdot\frac2{1+\ln a}$ — equal.
      3. For the curvature the freedom does not suffice: It jumps.
    worum: |
      An approximation for computing by hand: Between $-1$ and $0$ a parabola instead of a straight line — then for every base the curve has no more kinks.
- id: kn.konstr.stoerungsreihe
  quelle_hash: d60ca0af2ce6
  theorie_hash: ed7c8665429d
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'Tetration as a perturbation of eˣ − 1: polynomials in the height, order by order'
    aussage: |
      Embed tetration in the family $f_u(z)=e^z-1+u$ and look for $G(y)$ with
      $$G(y)=e^{G(y-1)}-1+u,\qquad G(0)=0.$$
      For $u=1$ this is $G(y)=e^{G(y-1)}$, i.e. $G(y)=\mathrm{sexp}_e(y-1)$; for $u=0$ it is $G\equiv0$ (the parabolic fixed point of $e^z-1$).
      With the ansatz $G=\sum_{n\ge1}g_n(y)\,u^n$ one gets $g_1(y)=y$, and for $n\ge2$
      $$g_n(y)-g_n(y-1)=[u^n]\bigl(e^{G(y-1)}-1-G(y-1)\bigr),$$
      where only $g_1,\dots,g_{n-1}$ occur on the right. Hence each $g_n$ is a **polynomial of degree $2n-1$** in $y$ (Faulhaber's summation formula), and
      $P_N(x)=\sum_{n\le N}g_n(x+1)$ is an approximation to $\mathrm{sexp}_e(x)$ that is defined at every real height.
      $N=8$ gives exactly the degree-15 polynomial from the forum ($a_0=1$, $a_1=87159883/79833600$); there the recursion appears with $f_n=n!\,g_n$ and Bell polynomials,
      which are nothing but the coefficients of $e^{G}$.
    bereich: Base $e$; formal power series in an auxiliary parameter $u$, evaluated at $u=1$
    einfach: Instead of attacking tetration directly, one bends a simpler map, eˣ − 1, step by step into eˣ. For the simple map nothing happens
      at all (everything stays at 0). Each small bending step adds a polynomial in the height, and polynomials can be evaluated at any height,
      also at 1/2. Adding up eight such steps gives a polynomial that matches Kneser's tetration to about six digits.
    formen:
    - notiz: embedding; $u=1$ is tetration
    - notiz: the first two orders
    - notiz: truncated perturbation series
    beweis:
      text: |
        Compare coefficients in $u$: $[u^1]$ gives $g_1(y)=g_1(y-1)+1$, hence $g_1=y$. For $n\ge2$, $[u^n]e^{G}$ is a sum of products of at least two
        $g_k$ with $k<n$ plus $g_n$ itself; the $g_n$ cancels against the left side. If the right side is a polynomial $q_n(y-1)$ of degree $2n-2$ (induction:
        products of $g_k$ with degree sum $\le\sum(2k-1)\le2n-2$), then $g_n(y)=\sum_{t=0}^{y-1}q_n(t)$ is a polynomial of degree $2n-1$ with $g_n(0)=0$.
        Checked exactly up to $n=14$ (exp.stoerungsreihe).
    pruefung:
      f1_folgt_unmittelbar: Yes, once one sees the embedding $e^z-1+u$; the forum gives only the recursion, not the derivation.
      f2_benutzte_voraussetzungen: Only computation with formal power series; nothing is claimed about convergence in $u$.
      f3_spezialfall: 'Yes: expansion of a superfunction in a family parameter, as for the half rank (kn.satz.rangjets_exppoly) with $x+1+\varepsilon(2^x-x-1)$.'
      f4_uebertragbar: To every base via $f_u(z)=b^z-1+u$ (then $u=1$ gives $b^{G}$) and to $xe^x$ (product tetration, br.satz.produkt_parabolisch).
      f5_neue_frage: Which tetration does a summation of the divergent series in $u$ give (kn.frage.stoerungsreihe)?
    bewertung:
      nutzen: Explains an approximation without Carleman matrices in one line and connects it to the half rank.
      richtigkeit: complete; forum polynomial reproduced exactly
    quellen:
    - {}
    - stelle: Derivation of the forum recursion as a perturbation series (13.10.2026)
  en_theorie:
    beispiel: |
      $g_1=y$, $g_2=\tfrac{y(y-1)(2y-1)}{12}$. At $x=-\tfrac12$ (i.e. $y=\tfrac12$): $g_1=\tfrac12$, $g_2=0$, $g_3=-\tfrac1{768}$, $g_4=-\tfrac1{6144}$, …
      $P_8(-\tfrac12)$ is off by about $4\cdot10^{-7}$ from $\mathrm{sexp}_e(-\tfrac12)=0.4985\ldots$
    einordnung: |
      Error and divergence: [[kn.beob.stoerungsreihe_fehler]]; open question about the sum: [[kn.frage.stoerungsreihe]]; counterpart at the half rank:
      [[kn.satz.rangjets_exppoly]]; background on parabolic points: [[it.satz.leau_fatou]].
    genau: |
      $G(y)=e^{G(y-1)}-1+u$, $G(0)=0$; $G=\sum g_n(y)u^n$ with polynomials $g_n$ of degree $2n-1$; $\mathrm{sexp}_e(x)\approx\sum_{n\le N}g_n(x+1)$.
    warum: |
      **How one arrives at this.** At $u=0$, $e^z-1$ is "almost the identity" at the point 0 (a parabolic fixed point): the orbit of 0 stays at 0, everything is trivial.
      Turn $u$ up a little, and each step pushes on by about $u$ — to first order $G\approx uy$, a polynomial in the height. In every
      higher order an equation $g_n(y)-g_n(y-1)=$ (polynomial in the earlier $g_k$) arises, and such a **difference equation with a polynomial on the right
      always has a polynomial solution** (like $\sum_{t<y}t^2=\tfrac{y(y-1)(2y-1)}6$). Polynomials can be evaluated at any height — so the continuation
      comes out all by itself. Only at the end does one set $u=1$ and hope that the series is still usable. It is, up to about the eighth order.
      The same idea lies behind our half rank: there $x+1$ is bent to $x+1+\varepsilon(2^x-x-1)$, and the coefficients are exponential polynomials.
    worum: |
      Where does a polynomial come from that matches Kneser's tetration to six digits, without Carleman matrices and without fixed-point computations? From a perturbation series.
- id: kn.konstr.walker
  quelle_hash: 83e1a70596c7
  theorie_hash: 3aee657664be
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Walker 1991; DLMF §4.12 cites Walker for C^∞, Kneser for analytic. Form of the limit after Trappmann in the tetration forum (2009).
    pruefung:
      f2_benutzte_voraussetzungen: To be checked against the original.
      f5_neue_frage: Is Walker's solution = Kneser? Presumably not even analytic (bw.verm.nirgends_analytisch).
      f3_spezialfall: 'Same construction type as the base change between two bases (bw.def.F_bd): iterate logarithms of a foreign superfunction.'
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      nutzen: Intermediate stage between linear and analytic; model case for base-change limits.
      richtigkeit: established (literature), details unchecked
    titel: Walker's C^∞ solutions
    aussage: |
      Walker constructs infinitely differentiable solutions (generalized exponential and logarithm functions) as the limit
      $\operatorname{dexp}^{-n}\circ\exp^{n}$ with $\operatorname{dexp}(x)=e^x-1$ — a base-change-type limit from the parabolic iteration of
      $e^x-1$ to $\exp$. $C^\infty$ on the real axis is proved; analyticity is not proved and is doubted in the tetration forum.
    bereich: generalized logarithms/exponentials
    versionen:
    - aenderung: Form of the limit and forum conjecture entered.
    quellen:
    - stelle: 'zbMATH review (Zbl 0742.39005): C^∞ solutions G of G(eˣ) = G(x) + 1 via h with h(eˣ) = e^{h(x)} − 1, see kn.satz.walker_konjugation'
    - stelle: Walker's limit dexp^−n ∘ exp^n, only real C^∞
    - stelle: 'Conjecture: nowhere analytic'
  en_theorie:
    einordnung: |
      Walker's limit is of the same construction type as the base change between two bases ([[bw.def.F_bd]]): iterate logarithms of a foreign superfunction.
      In the forum it is conjectured for all such limits that they are nowhere analytic ([[bw.verm.nirgends_analytisch]]) — then Walker's solution would not be Kneser.
      The intuitive super-logarithm also comes from Walker ([[kn.konstr.carleman]]).
    genau: |
      Walker constructs infinitely differentiable generalized exponential and logarithm functions, i.e. $C^\infty$ tetrations, as the limit
      $$\operatorname{dexp}^{-n}\circ\exp^{n},\qquad\operatorname{dexp}(x)=e^x-1:$$
      first $n$ times $e^x$, then $n$ times the inverse of $e^x-1$, whose fractional iterate is known at the parabolic fixed point $0$. $C^\infty$ is proved on the
      real axis; analyticity is not.
    warum: |
      Theorem from the literature (Walker 1991), the form of the limit after Trappmann in the tetration forum. Why only $C^\infty$: Walker shows the convergence uniformly on
      real intervals. For holomorphy one would need it on complex neighborhoods — and there, during the convergence, singularities can crowd toward the
      real axis. The DLMF (§4.12) names Walker for $C^\infty$ and Kneser for analytic.
    worum: |
      Between “linear with kinks” and “analytic” lies one level: infinitely differentiable. Walker built such solutions in 1991.
- id: kn.konstr.zwei_sinh
  quelle_hash: fe23daf14a9e
  theorie_hash: 1a59fdc2f878
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: |
        Convergence: $\ln(2\sinh y)=y+\ln(1-e^{-2y})$, the error per level is $e^{-2y}$ and shrinks further on taking logarithms back. Functional equation:
        $\ln^{[n]}s^{[n+x+1]}=\ln^{[n]}(s(s^{[n+x]}))\approx\ln^{[n-1]}s^{[n+x]}$ and in the limit $F(x+1)=e^{F(x)}$. Infinitely differentiable: as for the base change
        (bw.satz.schwanzkonvergenz), with uniform convergence of the derivatives.
      luecken:
      - C^∞ only carried over by analogy, not written out.
      - Nowhere analytic is a conjecture (forum).
    pruefung:
      f2_benutzte_voraussetzungen: Repelling fixed point of 2sinh, closeness to exp for large values.
      f5_neue_frage: Is the wobble range 2.07·10⁻⁴ the base-change wave between 2sinh and exp?
      f3_spezialfall: 'Yes: base change from a function with entire superfunction to exp (like Walker: e^x − 1).'
      f1_folgt_unmittelbar: No; construction from the forum.
      f4_uebertragbar: Other bases (b^x − b^{−x}); tommy's variants e^x − e^{−(e−1)x} (tid 1746).
    bewertung:
      nutzen: Simplest explicit smooth tetration besides Kneser's — and a counterexample to “smooth suffices for uniqueness”.
      richtigkeit: numerical (functional equation to 10⁻⁵⁰)
    titel: 'The 2sinh tetration: T = lim ln^[n] ∘ 2sinh^[n+x] — smooth, but not Kneser'
    aussage: |
      $s=2\sinh$ has a repelling fixed point at 0 with multiplier 2, hence an entire regular superfunction $s^{[t]}(y)=\Psi(2^t\sigma(y))$. Because $s(y)=e^y(1-e^{-2y})$
      is almost $e^y$ for large $y$, there exists
      $$F(x)=\lim_{n\to\infty}\ln^{[n]}\bigl(s^{[n+x]}(1)\bigr),\qquad F(x+1)=e^{F(x)},$$
      and $T(x)=F(x+k)$ with $F(k)=1$ is a real, infinitely differentiable tetration (tommy1729, from 2010). The limits are already fixed to
      40 digits after three steps. It is **not** Kneser's tetration: $T(\tfrac12)=1.64665073030\ldots$ versus Kneser $1.64635423375\ldots$, $T(-\tfrac12)=0.49874336453\ldots$
      (confirmed by Levenstein 2017); the height shift $\operatorname{slog}_{\mathrm K}(T(x))-x$ wobbles with a range of $2.07\cdot10^{-4}$. Conjectured (Levenstein): nowhere analytic,
      like every base-change limit.
    bereich: Base $e$; $s(y)=2\sinh y=e^y-e^{-y}$ with repelling fixed point 0, $s'(0)=2$
    einfach: One replaces eˣ by the similar function 2·sinh(x), whose iteration is easy to write down, iterates far upward and takes logarithms
      back down again. This gives a smooth tetration — but a different one from Kneser's, off by about three ten-thousandths.
  en_theorie:
    beispiel: |
      $n=3$ already gives 40 digits. The height shift against Kneser, $\operatorname{slog}_{\mathrm K}(T(x))-x$, ranges between $-9.6\cdot10^{-6}$ and $1.98\cdot10^{-4}$.
    einordnung: |
      A base-change limit like Walker's solution ([[kn.konstr.walker]]) — and as there, it is conjectured to be nowhere analytic ([[bw.verm.nirgends_analytisch]]).
      It shows: “smooth and real” does not determine the tetration.
    genau: |
      $$T(x)=\lim_{n\to\infty}\ln^{[n]}\bigl(2\sinh^{[n+x+k]}(1)\bigr),\qquad T(x+1)=e^{T(x)},\ T(0)=1.$$
      The fractional iterates $2\sinh^{[t]}$ come from the Koenigs function at the fixed point 0 (multiplier 2), which is entire. Values: $T(\frac12)=1.64665073030\ldots$
      (Kneser $1.64635423375\ldots$), $T(-\frac12)=0.49874336453\ldots$
    warum: |
      1. For large $y$, $2\sinh y=e^y(1-e^{-2y})$, hence $\ln(2\sinh y)=y-e^{-2y}+\dots$ — almost exactly $y$.
      2. If one iterates $2\sinh$ far up and takes logarithms back down, the difference from $\exp$ vanishes superexponentially fast.
      3. In the limit $F$ satisfies the tower equation, because one step of $2\sinh$ at the top corresponds to one step of $\exp$ at the bottom.
    worum: |
      A smooth tetration that can almost be built with a pocket calculator: One replaces $e^x$ by $2\sinh x$, whose iteration is simple, and returns at the end with
      logarithms. It is very close to Kneser's — but not equal.
- id: kn.kor.basisvergleich
  quelle_hash: eb7fcb2301b8
  theorie_hash: 862add95454b
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Divide by $\ln\varepsilon$.
    pruefung:
      f2_benutzte_voraussetzungen: Only the leading term; the constants cancel.
      f5_neue_frage: No new one — pure consequence.
      f3_spezialfall: Yes, of kn.satz.singulaer_minus2.
      f1_folgt_unmittelbar: Yes.
      f4_uebertragbar: All constructions.
    bewertung:
      nutzen: Low; independent content is lacking.
      richtigkeit: complete
    voraussetzungen:
    - text: T_b, T_c satisfy the hypotheses of kn.satz.singulaer_minus2
    titel: Base comparison at the singularity
    aussage: $\displaystyle\lim_{\varepsilon\to0^+}\frac{T_b(-2+\varepsilon)}{T_c(-2+\varepsilon)}=\frac{\ln c}{\ln b}$.
    bereich: two bases $b,c>0$, $\ne1$
    quellen:
    - stelle: Prop. 7.3
  en_theorie:
    beispiel: |
      $b=e$, $c=\sqrt2$: limit $\ln\sqrt2=0.3466$. The approach is slow — the error falls only like $1/|\ln\varepsilon|$, so at $\varepsilon=10^{-12}$ by about the factor $1/28$.
    einordnung: |
      A pure consequence without content of its own; it shows that at the left boundary only the base counts, not the construction.
    genau: |
      $$\lim_{\varepsilon\to0^+}\frac{T_b(-2+\varepsilon)}{T_c(-2+\varepsilon)}=\frac{\ln c}{\ln b}.$$
    warum: |
      Numerator and denominator are both $\ln\varepsilon/\ln(\text{base})+$ bounded ([[kn.satz.singulaer_minus2]]). Divide by $\ln\varepsilon$: the constants vanish.
    worum: |
      Near $-2$ all tetrations fall like a logarithm, but with different steepness. The ratio of two bases tends to the ratio of their logarithms.
- id: kn.satz.abel_bruchsumme
  quelle_hash: 672d65ad3f07
  theorie_hash: af411b9142b6
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: 'Differentiating $A(y)=1+A(\log_by)$ gives the formulas above. On the base interval $A'',A''''$ are bounded; for $y\ge1$, $\log_by$
        is smaller, hence by induction over the reduction level $|A''(y)|\le M_1$ and $|A''''(y)|\le C/y^2$. Taylor: term $=O(\sup|A''''|)=O(k^{-2})$,
        absolutely summable. Telescoping for the difference equation; Müller–Schleicher axiom (continuity for $f(N+x)-f(N)\to0$) for the uniqueness.'
    gegenbeispielsuche: |
      exp.abel_bruchsumme (base e): interpolant versus Kneser slog at free points $2\cdot10^{-30}$; $y^2|A''(y)|$ = 0.67, 0.20, 0.095, 0.057 for y = 10…10⁴;
      S(1/2) with N = 1000 and 4000 equal to $3\cdot10^{-12}$; S(3/2) − S(1/2) = A(3/2) to $3\cdot10^{-13}$; S'' = −Σ A'' confirmed.
    pruefung:
      f2_benutzte_voraussetzungen: b > η and analyticity on the base interval; not Kneser.
      f5_neue_frage: kn.frage.abel_bruchsumme (relation to μ and to the response kernel)
      f3_spezialfall: 'Yes: Müller–Schleicher sum for “locally constant” summands (like $\sum\log k$ → log Γ).'
      f1_folgt_unmittelbar: 'Almost: the bound for A'''' is an induction over the log reduction.'
      f4_uebertragbar: 'To $\log$ itself: there the same construction gives log Γ and γ — $\gamma_A$ is the analogue.'
    bewertung:
      nutzen: Closes the fractional-sum calculus above η for the Abel function.
      richtigkeit: complete
    voraussetzungen:
    - text: b > η (the log_b reduction ends in a fixed base interval)
    - text: A real-analytic on a neighborhood of the base interval
    - text: A = Kneser
      notiz: every real-analytic increasing Abel function
    titel: Fractional sum of the super-logarithm
    aussage: |
      $|A''(y)|\le C/y^2$ for $y\ge1$; therefore the compensated fractional sum converges absolutely:
      $$\mathcal S[A](x)=\sum_{k\ge1}\Bigl[x\bigl(A(k+1)-A(k)\bigr)-\bigl(A(k+x)-A(k)\bigr)\Bigr],$$
      with $\mathcal S(x+1)-\mathcal S(x)=A(x+1)$, $\mathcal S(n)=\sum_{k\le n}A(k)$, $\mathcal S''(x)=-\sum_{k\ge1}A''(k+x)$, and it is the
      fractional sum in the sense of Müller–Schleicher. The terms are $\tfrac{x-x^2}2A''(k)+\tfrac{x-x^3}6A'''(k)+\dots$
      Likewise $\gamma_A:=\lim_N\bigl[\sum_{k\le N}A'(k)-A(N)\bigr]$ exists (counterpart of the Euler constant for $\log$).
    bereich: real $b>\eta$, $A=\operatorname{slog}_b$ real-analytic and increasing (e.g. Kneser), $x\ge0$
    einfach: The super-logarithm grows so slowly that one can add “1.5 summands” of it, if one compensates cleverly at the end. The sum converges
      because its curvature vanishes faster than 1/y².
    formen:
    - notiz: base e, Kneser
    - notiz: the two lines following the bound
    quellen:
    - stelle: §14
    - {}
    - {}
  en_theorie:
    beispiel: |
      Kneser, base $e$: $\mathcal S(\tfrac12)=-0.1150976090828\ldots$, $\gamma_A=0.4951728249\ldots$ Check: $\mathcal S(\tfrac32)-\mathcal S(\tfrac12)=A(\tfrac32)$ to $3\cdot10^{-13}$. The bound:
      $y^2|A''(y)|=0.67$, $0.20$, $0.095$, $0.057$ at $y=10,10^2,10^3,10^4$.
    einordnung: |
      Counterpart below $\eta$: [[kl.satz.bruchsumme]]. For $\log$ instead of $\operatorname{slog}$ the same construction yields $\log\Gamma$ and $\gamma$. What the value means:
      [[kn.frage.abel_bruchsumme]].
    genau: |
      Let $b>\eta$, $A=\operatorname{slog}_b$ real-analytic and increasing. Then $|A''(y)|\le C/y^2$ for $y\ge1$, and the compensated sum
      $$\mathcal S[A](x)=\sum_{k\ge1}\Bigl[x\bigl(A(k+1)-A(k)\bigr)-\bigl(A(k+x)-A(k)\bigr)\Bigr]$$
      converges absolutely. It satisfies $\mathcal S(x+1)-\mathcal S(x)=A(x+1)$, $\mathcal S(n)=\sum_{k\le n}A(k)$, and is the fractional sum in the sense of Müller–Schleicher.
      Likewise $\gamma_A=\lim_N\bigl[\sum_{k\le N}A'(k)-A(N)\bigr]$ exists, the counterpart of the Euler constant.
    warum: |
      1. Differentiating $A(y)=1+A(\log_by)$ gives $A'(y)=\dfrac{A'(\log_by)}{y\ln b}$ and a similar formula for $A''$ with $y^2$ in the denominator.
      2. Since $\log_by<y$, every $y$ is reduced in finitely many steps to a fixed base interval on which $A',A''$ are bounded. Induction over the steps gives $|A''(y)|\le C/y^2$.
      3. Taylor: the $k$-th term is $\tfrac{x-x^2}2A''(k)+\dots=O(k^{-2})$ — absolutely summable.
      4. Telescoping: in $\mathcal S(x+1)-\mathcal S(x)$ only $A(1+x)-A(1)=A(x+1)$ remains, because $A(N+1)-A(N+1+x)\to0$.
      5. Unique by the axiom of Müller–Schleicher: summands that are nearly constant far out may be summed there like constants.
    worum: |
      Below $\eta$ one could sum up “one and a half tower levels”. Above $\eta$ the levels grow to the gigantic — but the super-logarithm grows so
      slowly that one can form fractional sums of **it**, similar to how $\log\Gamma$ continues the sum of the logarithms.
- id: kn.satz.basis2_hoehe3
  quelle_hash: fabfb20eff3a
  theorie_hash: b8cdbaae8d8a
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: At base 2, H_r(2,3) ≥ 2^r grows — no limit graph of the hierarchy
    aussage: |
      For all ranks $H_r(2,1)=2$, $H_r(2,2)=4$, and for integer $k\ge1$: $H_r(2,k)\ge2k$ as well as
      $$H_{r+1}(2,3)=H_r(2,4)\ge2H_r(2,3),\qquad H_r(2,3)\ge2^r.$$
      So the values at height 3 diverge with the rank — independently of how the levels are continued between the integer heights. A finite limit graph
      $\lim_rH_r(2,\cdot)$ does not exist, even though the values at height 1.5 decrease with the rank (kn.beob.zwischenwerte_basis2).
    einfach: 2 to the power 2, 2 tetrated to 2, … always give 4. But already at three levels, the value at least doubles with every higher hyperoperation.
    beweis:
      text: 'Induction over $r$ at integer heights: $H_{r+1}(2,k)\ge2^k\ge2k$; $H_{r+1}(2,3)=H_r(2,H_{r+1}(2,2))=H_r(2,4)=H_{r-1}(2,H_r(2,3))\ge2H_r(2,3)$;
        start $H_4(2,3)=16$.'
    pruefung:
      f1_folgt_unmittelbar: Yes, induction over integer heights.
      f2_benutzte_voraussetzungen: Only the integer recursion.
      f3_spezialfall: 'Yes: $2\uparrow^n2=4$ (br.def.hyperoperation).'
      f4_uebertragbar: Every base $b\ge2$.
      f5_neue_frage: 'no'
    bewertung:
      nutzen: Rules out an obvious fallacy (limit profile at base 2).
      richtigkeit: complete
    quellen:
    - stelle: forschung/eta_hyperoperationen/MATHEMATIK.md §3, Zusatz M2a
  en_theorie:
    beispiel: |
      $H_3(2,3)=8$, $H_4(2,3)=16$, $H_5(2,3)=2\uparrow\uparrow4=65536$.
    einordnung: |
      Between heights 1 and 2: [[kn.beob.zwischenwerte_basis2]].
    genau: |
      $H_r(2,3)\ge2^r$; there is no limit graph $\lim_rH_r(2,\cdot)$.
    warum: |
      $H_{r+1}(2,3)=H_r(2,4)$, and $H_r(2,4)$ is an iteration that starts at $H_r(2,3)$ and at least doubles.
    worum: |
      At base 2 the values at heights 1 and 2 are the same for all ranks — but not at height 3.
- id: kn.satz.eta_auswahl
  quelle_hash: 813ee016fe3f
  theorie_hash: c4412a7ee9c4
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: The limit bases depend on the choice of continuation
    aussage: |
      If $S$ satisfies the recursion $S(x+1)=F(S(x))$, $S(0)=1$, then so does $\tilde S_\varepsilon(x)=S(x+\varepsilon\sin2\pi x)$ ($|\varepsilon|<1/2\pi$, real-analytic, monotone), with the same
      values at all integer heights. If the level $H_r$ is changed in this way, its touching base shifts (assuming fold nondegeneracy) by
      $$\frac{d\eta_r}{d\varepsilon}\Big|_0=-\frac{\sin(2\pi e_r)}{\partial_bH_r(\eta_r,e_r)};\qquad\text{for }H_4:\ \partial_bH_4=9.87526\ldots,\ \eta_4'(0)=-0.05347\ldots$$
      So the η sequence is a sequence of numbers only for a **fixed chosen** continuation (Kneser, regular, …); the recursion and the integer values alone do not determine it.
    einfach: How to fill in a hyperoperation between the integers is a choice — and this choice shifts the limit bases. The sequence 1.44, 1.64,
      1.74, … therefore belongs to one particular choice of continuation.
    beweis:
      text: '$\psi(x)=x+\varepsilon\sin2\pi x$ satisfies $\psi(x+1)=\psi(x)+1$, $\psi(k)=k$, $\psi''>0$. Differentiating the touching equation
        $H_r(\eta,e)=e$ with respect to $\varepsilon$: the term with $e''$ drops out because $\partial_xH_r=1$, leaving $\alpha\eta''+\sin(2\pi
        e)=0$.'
    pruefung:
      f1_folgt_unmittelbar: Yes, from non-uniqueness (fg.kor.nichteindeutigkeit) and the implicit function theorem.
      f2_benutzte_voraussetzungen: Fold nondegeneracy α ≠ 0, ∂²ₓH ≠ 0; the value of η₄′ is numerical.
      f3_spezialfall: 'Yes: periodic perturbation of the height, as for any tetration.'
      f4_uebertragbar: To any limit quantity that depends on values between the integer heights (η_r, e_r, integrals).
      f5_neue_frage: Which selection rule makes η_r canonical — Kneser-type conditions on every level?
    bewertung:
      nutzen: Shows that TPID 10 is a statement about a particular continuation chain.
      recherche: In TPID 10 and the forum threads (literature map 12.10.2026), the selection is not treated as a variable of the η sequence.
      richtigkeit: complete; the numerical value is numerical
    quellen:
    - stelle: forschung/eta_hyperoperationen/MATHEMATIK.md §6 (Satz M4)
  en_theorie:
    beispiel: |
      For tetration ($r=4$): $\eta_4'(0)=-0.0535$; already $\varepsilon=0.01$ shifts $\eta_4$ in the fourth digit.
    einordnung: |
      Reason: [[fg.kor.nichteindeutigkeit]]. Consequence for TPID 10: [[kn.verm.tpid10]] holds for a particular continuation chain.
    genau: |
      A periodic reparametrization of the height shifts $\eta_r$ by $-\varepsilon\sin(2\pi e_r)/\partial_bH_r$.
    warum: |
      $S(x+\varepsilon\sin2\pi x)$ has the same integer values and satisfies the same recursion; only values between the integer heights change — and exactly there lies the touching point $e_r$.
    worum: |
      The limit bases are not a property of the recursion alone, but of the chosen continuation.
- id: kn.satz.eta_kriterium
  quelle_hash: 8228bcb7d088
  theorie_hash: 784ebfe85131
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: A sufficient criterion for ηₙ → 2 (and one for eₙ → 4)
    aussage: |
      With $F_N(x)=H_N(\eta_N,x)$ (the level **at its own limit base**):
      $$F_N(q)\to q+1\ \text{for every }0<q<1\quad\Longrightarrow\quad\eta_N\to2.$$
      And: if $\eta_N\to2$ and $(2-\eta_N)\sup_{\eta_N\le b\le2}|\partial_bH_N(b,2)|\to0$, then $H_N(\eta_N,2)\to4$ and hence $e_N\to4$.
      The three families $H_N(2,\cdot)$, $H_N(b,\cdot)$ at fixed $b<2$, and $H_N(\eta_N,\cdot)$ must not be interchanged.
    einfach: If the hyperoperations at their limit bases look more and more like “plus 1”, the limit bases must tend to 2. This shifts the problem
      to an estimate that can be checked on concrete values.
    beweis:
      text: '$F_N(q)\le F_N(1)=\eta_N$ (monotonicity), hence $\liminf\eta_N\ge q+1$ for every $q<1$; with $\limsup\le2$ it follows that $\eta_N\to2$.
        For $e_N$: $|H_N(2,2)-H_N(\eta_N,2)|\le(2-\eta_N)\sup|\partial_bH_N|$, $H_N(2,2)=4$ and $e_N\ge H_N(\eta_N,2)$.'
    pruefung:
      f1_folgt_unmittelbar: Yes, from monotonicity.
      f2_benutzte_voraussetzungen: Monotonicity and the upper bound; the approach F_N(q) → q+1 itself is open (only measured, kn.beob.kritische_profile).
      f3_spezialfall: 'no'
      f4_uebertragbar: Same scheme for other hyperoperation families (kn.frage.andere_etas).
      f5_neue_frage: Does $A_N(\eta_N,q)=o((N-2)^{1-q})$ hold for the deviation from the successor? That would be a proof of η_N → 2.
    bewertung:
      nutzen: Turns TPID 10 into a checkable estimate at the critical bases.
      richtigkeit: complete (conditional implication)
    voraussetzungen:
    - text: limsup η_N ≤ 2 (e.g. from kn.satz.schwellen_monoton) and F_N = H_N(η_N,·) monotone
    - text: 'for e_N → 4 additionally: η_N → 2, 2 ≤ e_N ≤ 4'
    quellen:
    - stelle: forschung/eta_hyperoperationen/rang_gamma/BERICHT.md §2, MATHEMATIK.md
  en_theorie:
    beispiel: |
      Measured at $q=0.5$: $1.335,\ 1.396,\ 1.428,\ 1.448,\ 1.460$ for $N=4\ldots8$ ([[kn.beob.kritische_profile]]).
    einordnung: |
      Upper limit from [[kn.satz.schwellen_monoton]]; goal [[kn.verm.tpid10]].
    genau: |
      If $H_N(\eta_N,q)\to q+1$ for every $0<q<1$, then $\eta_N\to2$. For $e_N\to4$ additionally a bound on the base derivative at height 2.
    warum: |
      $H_N(\eta_N,q)\le H_N(\eta_N,1)=\eta_N$ by monotonicity; if the left side approaches $q+1$, then $\eta_N$ must become at least $q+1$.
    worum: |
      A way to prove $\eta_N\to2$ without computing the limit bases.
- id: kn.satz.grenzwert_trick
  quelle_hash: 028bfd201931
  theorie_hash: 7b78c8a84b5b
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: |
        $F_{n+1}(s)-F_n(s)=\log^{[n]}\bigl(\log G(s+n+1)\bigr)-\log^{[n]}G(s+n)$, and $\log G(s+n+1)-G(s+n)=\log(1+\delta(s+n))$. The derivative of $\log^{[n]}$ at the point $y$ is
        $\prod_{k<n}1/\log^{[k]}y$ — tiny on the real axis. Summing, $F_n$ converges if $\sum_n|\delta(s+n)|\prod_k1/|\log^{[k]}G(s+n)|<\infty$. Functional equation in the limit.
      luecken:
      - The exact conditions on δ (in particular away from the real axis) are written out only for the base change (Paper I).
    pruefung:
      f2_benutzte_voraussetzungen: Rapidly decaying error δ; chain of logarithms without branching problems.
      f5_neue_frage: Which growth condition on δ in the half-plane makes F analytic — and when is F = Kneser?
      f3_spezialfall: 'Yes: tail convergence (bw.satz.schwanzkonvergenz).'
      f1_folgt_unmittelbar: Yes for each method individually; the common form is the idea from the forum (MphLee, Nixon 2021).
      f4_uebertragbar: 'Every level: superfunctions of T instead of exp.'
    bewertung:
      nutzen: Subsumes the many proposals of the forum under one principle.
      richtigkeit: Sketch
    titel: 'The limit trick: an almost-superfunction G yields F = lim log^[n] ∘ G(· + n)'
    aussage: |
      If $G$ is a function with $G(s+1)=e^{G(s)}\,(1+\delta(s))$ and the error $\delta$ decays fast enough for $\operatorname{Re}s\to\infty$, then
      $$F(s)=\lim_{n\to\infty}\log^{[n]}G(s+n),\qquad F(s+1)=e^{F(s)}.$$
      exists. Almost all “other” tetrations in the forum are this trick with different $G$: the base change ($G=$ tetration of another base, bw.satz.schwanzkonvergenz),
      Walker's solution ($G$ = superfunction of $e^x-1$), the 2sinh method ($G$ = superfunction of $2\sinh$), Nixon's β-method ($\beta(s+1)=e^{\beta(s)}/(1+e^{-\lambda s})$) and
      tommy's Gauss method. Whether the result is analytic and whether it is Kneser depends solely on the growth of $\delta$ in the complex plane.
    einfach: One takes a function that satisfies the tower equation “almost”, goes far to the right where the error is tiny, and takes logarithms
      back. In doing so the error becomes even smaller. Most proposals in the forum are variants of this one trick.
  en_theorie:
    beispiel: |
      2sinh method ([[kn.konstr.zwei_sinh]]): $G$ is the superfunction of $2\sinh$, the error $e^{-2G}$ — three steps give 40 digits.
    einordnung: |
      Common core of [[kn.konstr.walker]], [[kn.konstr.zwei_sinh]], [[kn.frage.beta_methode]] and the base change ([[bw.satz.schwanzkonvergenz]]).
    genau: |
      $$F(s)=\lim_{n\to\infty}\log^{[n]}G(s+n)$$
      is a tetration if $G(s+1)\approx e^{G(s)}$ with rapidly decaying error. Examples: base change, Walker, 2sinh, β-method, Gauss method.
    warum: |
      1. One step of $\log$ reduces errors by the factor $1/G$ — hence enormously for huge $G$.
      2. That is why the sequence converges, and in the limit the tower equation holds exactly.
      3. Whether $F$ is analytic depends on how the error behaves away from the real axis — there $G$ can become small.
    worum: |
      In the forum there are many “new” tetrations. Almost all follow one pattern: One takes a function that satisfies the tower equation only approximately, and
      takes logarithms back from far to the right.
- id: kn.satz.halbe_exp
  quelle_hash: 9ccbf60a706e
  theorie_hash: 5c1251e12749
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: |
        $f(f(x))=T(A(T(A(x)+\frac12))+\frac12)=T(A(x)+1)=e^{T(A(x))}=e^x$ with $A\circ T=\mathrm{id}$ and $T(y+1)=e^{T(y)}$. Values: $f(1)=T(A(1)+\frac12)=T(\frac12)$,
        $f(0)=T(A(0)+\frac12)=T(-\frac12)$ because $A(0)=-1$. Zero: $f(x)=0\iff A(x)+\frac12=-1$. Singularity: $T$ is singular at $-2$, hence $f$ at
        $A(x)=-\frac52$. Non-uniqueness as in fg.satz.allgemeine_loesung. The behavior at $L$: Levenstein (forum tid 1043), numerically.
    pruefung:
      f2_benutzte_voraussetzungen: Kneser's tetration and its slog; for (ii) the singularity at −2.
      f5_neue_frage: Is there a real additional condition that makes f unique (convexity, minimal arc length — tommy1729, tid 842)?
      f3_spezialfall: 'Yes: fractional iterates exp^[c] as an iteration group (fg.def.iterationsgruppe).'
      f1_folgt_unmittelbar: 'Yes, from the tetration; historically the other way around: the tetration was Kneser''s tool for this equation.'
      f4_uebertragbar: Every base b > η; for b ≤ η via regular iteration (there the half-iterate is unique among those holomorphic at the fixed
        point).
    bewertung:
      nutzen: The starting question of the whole theory; shows what tetration is needed for.
      richtigkeit: 'Existence: literature (Kneser 1950), values recomputed to 30 digits'
    titel: The half-exponential function f(f(x)) = eˣ — Kneser's original question
    aussage: |
      Kneser (1950) built the tetration to solve this equation: $f=\exp^{[1/2]}=T\bigl(A(x)+\tfrac12\bigr)$ is real-analytic, increasing and satisfies
      $f(f(x))=e^x$; in general $\exp^{[c]}=T(A(x)+c)$ is an iteration group. Values (Kneser): $f(0)=T(-\tfrac12)=0.49856328794111\ldots$,
      $f(1)=T(\tfrac12)=1.64635423375119\ldots$, only real zero at $x=T(-\tfrac32)=-0.69602474088608\ldots$
      Properties: (i) **not unique** — $T(A(x)+c+p(A(x)))$ with 1-periodic $p$ solves the same equation; (ii) **not entire** — above the axis there is a
      singularity at $T(-\tfrac52)=\ln|T(-\tfrac32)|+i\pi=-0.36237007\ldots+i\pi$, and the fixed points $L_k$ of $\exp$ are branch points; at the nearest one, $L=0.3181+1.3372i$,
      $f$ is continuous with $f(L)=L$ and (numerically, Levenstein 2015) $f'(L)=\sqrt L$ — like the formal half-iteration at the fixed point.
    bereich: $f:\mathbb R\to\mathbb R$ real-analytic and increasing with $f(f(x))=e^x$; $T=T_e$ Kneser's tetration, $A=\operatorname{slog}_e$
    einfach: 'Wanted is a function that gives the exponential function when applied twice in a row. With tetration this is easy: With the super-logarithm
      one goes down one level, half a level further, and back with the tetration. This is exactly what Kneser built his solution for in 1950.'
  en_theorie:
    beispiel: |
      $f(f(0))=f(0.49856\ldots)=1=e^0$; $f(f(1))=f(1.64635\ldots)=e$. In the experiment $f(f(x))=e^x$ holds at seven points to $10^{-28}$.
    einordnung: |
      The application for which Kneser ([[kn.konstr.kneser]]) built the tetration. Growth: [[kn.satz.halbe_exp_wachstum]]. For $e^x-1$ there is no convergent
      formal half-iteration ([[it.satz.baker]]) — the fixed point makes the difference.
    genau: |
      $$f=\exp^{[1/2]}=T\bigl(\operatorname{slog}(x)+\tfrac12\bigr),\qquad f(f(x))=e^x.$$
      In general $\exp^{[c]}(x)=T(\operatorname{slog}(x)+c)$, and $\exp^{[c]}\circ\exp^{[d]}=\exp^{[c+d]}$. With Kneser's tetration:
      - $f(0)=0.49856328794111\ldots$, $f(1)=1.64635423375119\ldots$;
      - only real zero at $x=T(-\tfrac32)=-0.69602474\ldots$;
      - not unique, not entire: singularity at $-0.36237+i\pi$, branching at the fixed points $L_k$ of $\exp$; at $L$ itself $f$ is still continuous, $f(L)=L$,
        and the slope there is (numerically) $\sqrt L$.
    warum: |
      1. **The equation:** $f(f(x))=T(\operatorname{slog}(T(\operatorname{slog}x+\frac12))+\frac12)=T(\operatorname{slog}x+1)=e^{T(\operatorname{slog}x)}=e^x$.
      2. **Values:** $\operatorname{slog}1=0$ and $\operatorname{slog}0=-1$, hence $f(1)=T(\frac12)$ and $f(0)=T(-\frac12)$. And $f(0)=\ln f(1)$, because $f(e^0)=e^{f(0)}$.
      3. **Zero:** $f(x)=0$ means $\operatorname{slog}x+\frac12=-1$.
      4. **Not unique:** Every periodic perturbation of the tetration gives a different half-exponential function.
    worum: |
      Is there a function $f$ with $f(f(x))=e^x$? With this question the modern theory of tetration began in 1950: Kneser built his solution to obtain a smooth
      “half-exponential function”.
- id: kn.satz.halbe_exp_wachstum
  quelle_hash: f269e4876cc0
  theorie_hash: c30f6355bae2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: |
        (i) If $f(x)\le x^n$ for all large $x$, then $e^x=f(f(x))\le f(x)^n\le x^{n^2}$ — contradiction. If $f(x)\ge e^{x^\varepsilon}$ for all large $x$, then
        $e^x=f(f(x))\ge\exp\bigl(f(x)^\varepsilon\bigr)\ge\exp(e^{\varepsilon x^\varepsilon})$ — contradiction. In a Hardy field the comparisons are eventually decided, so
        the inequalities hold from some point on. Along $x_k=T(k)$: $f(x_k)=T(k+\frac12)$, $\ln f=T(k-\frac12)$, $\ln x_k=T(k-1)$.
        (ii) Hardy (1910) for exp-log functions, van der Hoeven (2006) for transseries: every such element is comparable to $\exp^{[m]}$ of a function of finite order,
        with integer $m$; from $f\circ f=\exp$ it follows that $2m=1$.
    pruefung:
      f2_benutzte_voraussetzungen: Monotonicity of f; for the eventual inequalities the Hardy field property.
      f5_neue_frage: Does Kneser's f lie in a Hardy field? (br.frage.kneser_hardy)
      f3_spezialfall: 'Yes: growth orders of iteration roots (Hardy, Boshernitzan).'
      f1_folgt_unmittelbar: (i) yes, with two lines; (ii) literature.
      f4_uebertragbar: 'To exp^[c] with 0 < c < 1: exponential degree c.'
    bewertung:
      nutzen: Places the half-exponential function between the elementary growth classes.
      richtigkeit: (i) complete, (ii) literature
    titel: A half-exponential function grows faster than any polynomial and more slowly than any exp(x^ε)
    aussage: |
      (i) For every $n$ and every $\varepsilon>0$ we have $\limsup f(x)/x^n=\infty$ and $\liminf f(x)/e^{x^\varepsilon}=0$; if $f$ lies in a Hardy field (all
      comparisons hold eventually), then even $x^n\prec f(x)\prec e^{x^\varepsilon}$. Along $x_k=T_e(k)$ one has $\ln f(x)/\ln x=T(k-\frac12)/T(k-1)$:
      $1.909$, $11.82$, $1.6\cdot10^{71}$ for $k=2,3,4$.
      (ii) No function built from $\exp$, $\log$ and the basic arithmetic operations (and no transseries) is a half-exponential function — such expressions have an
      integer “exponential degree”, a half-exponential function would have degree $\tfrac12$.
      (iii) Application: In complexity theory, bounds of size $f(n)$ with $f\circ f\approx2^n$ are called “half-exponential”; Miltersen, Vinodchandran and
      Watanabe (1999) show circuit lower bounds of exactly this size.
    bereich: $f$ increasing with $f(f(x))=e^x$
    einfach: A function that gives eˣ when applied twice must lie somewhere between polynomials and the exponential function — and so far in between
      that it cannot be written down with any formula built from e-to-the-power-of and the logarithm.
  en_theorie:
    beispiel: |
      Along $x=T(k)$, $\ln f(x)/\ln x=T(k-\frac12)/T(k-1)$: $1.909$, $11.82$, $1.6\cdot10^{71}$ for $k=2,3,4$ — faster than every $x^n$.
    einordnung: |
      Connects the tetration with the theory of growth orders ([[br.satz.boshernitzan]], [[br.frage.kneser_hardy]]). The lower bounds of Miltersen,
      Vinodchandran and Watanabe (1999) for circuits have exactly this size.
    genau: |
      For increasing $f$ with $f\circ f=\exp$:
      - $f(x)/x^n$ is unbounded, $f(x)/e^{x^\varepsilon}$ comes arbitrarily close to 0; in a Hardy field eventually $x^n\prec f\prec e^{x^\varepsilon}$.
      - No exp-log expression and no transseries is such an $f$.
      - In complexity theory such sizes are called “half-exponential”.
    warum: |
      1. If $f(x)\le x^n$ for all large $x$, then $e^x=f(f(x))\le f(x)^n\le x^{n^2}$ — false.
      2. If $f(x)\ge e^{x^\varepsilon}$ for all large $x$, then $e^x\ge\exp(f(x)^\varepsilon)\ge\exp(e^{\varepsilon x^\varepsilon})$ — false.
      3. Exp-log functions (Hardy) and transseries (van der Hoeven) have an integer exponential degree; $f\circ f=\exp$ demands degree $\frac12$.
    worum: |
      How fast does a half-exponential function grow? Faster than every polynomial, more slowly than every $e^{x^\varepsilon}$ — and in a way that cannot be written down with
      any formula in $\exp$ and $\log$.
- id: kn.satz.halbexp_beschraenkt
  quelle_hash: 86700b914075
  theorie_hash: c1d629a044a2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: |
        1. **Real:** $f(e^z)=f(f(f(z)))=e^{f(z)}$ continues $f$ along $\mathbb R$; $f$ is injective, hence monotone, and decreasing is impossible (otherwise there would be a real fixed point $c$ with $e^c=c$).
           Hence $g=A\circ f\circ T=\mathrm{id}+\tfrac12+\theta$ on $\mathbb R$ with 1-periodic, real-analytic $\theta$ and $g\circ g=\mathrm{id}+1$.

        2. **Continuation across the corridor:** For $z\in V_0$, $z$ and $f(z)$ lie in $D$, so $\Theta(z)=A(f(z))-A(z)-\tfrac12$ is holomorphic on $V_0$, and on $V_0\cap\mathbb R$ we have $\Theta=\theta\circ A$.
           With $B=\Omega\cap(\Omega-\tfrac12)$, $\theta_B=\Theta\circ T$ is holomorphic on $B$ and equal to $\theta$ on $B\cap\mathbb R=(-1.7545,\,-0.1878)$ — a segment of length $1.57>1$.

        3. **Periodic on all of ℂ:** $B$ is horizontally convex and wider than 1 at every height (G2). Therefore $B\cap(B-1)$ is connected and contains real points; there
           $\theta_B(w+1)=\theta_B(w)$ (identity theorem). $\tilde\theta(w):=\theta_B(w+m)$ for an $m\in\mathbb Z$ with $w+m\in B$ is well defined, entire and 1-periodic.

        4. **One-sided bound:** For $w\in B$, $w+\tfrac12+\tilde\theta(w)=A(f(T(w)))\in\Omega$, hence by (G1), (G3) $\operatorname{Re}\tilde\theta(w)\le c_R-\operatorname{Re}w-\tfrac12\le c_R+2+0.24\,|\operatorname{Im}w|$;
           by periodicity this holds for all $w\in\mathbb C$.

        5. **Bôcher:** For $\operatorname{Im}w>0$, $u=c_R+3+0.24\operatorname{Im}w-\operatorname{Re}\tilde\theta$ is positive, harmonic and 1-periodic, hence a positive harmonic function of $q=e^{2\pi iw}$ on
           $0<|q|<1$. By Bôcher's theorem $u=-\alpha\log|q|+h(q)$ with $h$ harmonic on $|q|<1$. With $\tilde\theta(w)=F(q)$ and $h=\operatorname{Re}H$ it follows that
           $\operatorname{Re}(F+H)=c+\beta\log|q|$; because $F+H$ is single-valued and $\log q$ is not, $\beta=0$, so $F+H$ is constant and $F$ is holomorphic at $q=0$:
           $\tilde\theta$ has no Fourier components $e^{2\pi inw}$ with $n<0$. For $\operatorname{Im}w<0$ likewise with $q'=e^{-2\pi iw}$: none with $n>0$.

        6. Hence $\tilde\theta\equiv c$, and $g\circ g=\mathrm{id}+1+2c=\mathrm{id}+1$ gives $c=0$: $g=\mathrm{id}+\tfrac12$, i.e. $f=T(A+\tfrac12)=f_K$ on $\mathbb R$ and thus on $D$.
    pruefung:
      f2_benutzte_voraussetzungen: Corridor condition (only on V₀, not on all of D); geometry (G1)–(G3); reality only in steps 1 and 6. Boundedness
        of f on D is not needed.
      f5_neue_frage: Does the corridor condition already follow from boundedness on D? (Then Kneser's would be the only bounded half-exponential
        function.)
      f3_spezialfall: Analogous to kn.satz.paulsen_cowgill; Bôcher's theorem replaces the limits at ±i∞ there.
      f1_folgt_unmittelbar: No; the core is a Bôcher/Liouville argument for the periodic perturbation, as in Paulsen–Cowgill, but with a one-sided
        linear bound instead of limits.
      f4_uebertragbar: To $\exp^{[c]}$ for every $c\in(0,1)$ (corridor $\Omega\cap(\Omega-c)$) and to bases $b>\eta$.
    bewertung:
      recherche: 'Forum mirror and Paulsen–Cowgill: uniqueness there only for the tetration via limits; for the half-iterate via a corridor not
        found.'
      nutzen: Characterizes Kneser's half-exponential function by a condition on a disk around 0 — exactly what a truncation method can deliver.
      richtigkeit: complete, except for the numerically checked shape of slog(D)
    voraussetzungen:
    - text: f holomorphic on D, real on D ∩ ℝ, f(f(z)) = e^z near 0
    - text: 'Corridor condition: f(V₀) ⊂ D'
      notiz: replaces the earlier requirement “f bounded on D”
    - text: Shape of Ω = slog(D) (kn.beob.slog_scheibe)
    titel: 'Uniqueness via a corridor: Kneser''s half-exponential function is the only one that maps the corridor V₀ into the disk |z| < |L|'
    aussage: |
      If $f$ is holomorphic on $D$, real on $D\cap\mathbb R$, $f(f(z))=e^z$ near 0, and $f(V_0)\subset D$ holds, then $f=f_K=T(A+\tfrac12)$. Equivalently: If $|f|\le|L|$ on $V_0$, then $f=f_K$ (a non-constant holomorphic function maps the open set $V_0$ into the open disk).
      $f_K$ itself satisfies the corridor condition by the definition of $V_0$. Every other real half-exponential function violates it — its perturbation term grows on approaching $L$ like $|z-L|^{-4.447n}$.
    bereich: $D=\{|z|<|L|\}$; $T$, $A$ Kneser's tetration and slog to base $e$, $\Omega=A(D)$; corridor $V_0=T\bigl(\Omega\cap(\Omega-\tfrac12)\bigr)=\{z\in
      D:f_K(z)\in D\}$
    einfach: 'There are infinitely many smooth functions that give eˣ when applied twice. If one only requires that f maps a certain strip of
      the disk — where Kneser''s solution also stays in the disk — back into the disk, exactly one remains: Kneser''s.'
    quellen:
    - {}
    - stelle: Prop. 2, same pattern
  en_theorie:
    beispiel: |
      Counterexample check: With $\varphi(w)=w+0.01\sin2\pi w$, $f=T(\varphi^{-1}(\varphi(A)+\tfrac12))$ is likewise a real half-exponential function. Its perturbation term $0.01\sin(2\pi A(z))$ is already $1.4\cdot10^3$, $4.6\cdot10^7$, $1.3\cdot10^{12}$ at
      $z=0.9L,\ 0.99L,\ 0.999L$ — $f$ leaves the corridor immediately. Kneser's $f_K$ lies there $0.16$, $0.016$, $0.0016$ away from $L$.
    einordnung: |
      The counterpart to Paulsen–Cowgill ([[kn.satz.paulsen_cowgill]]) for the half-iterate. Instead of limits at $\pm i\infty$, a condition on a disk around 0 suffices — exactly
      what a truncation method can deliver ([[kn.satz.polynom_halbexp_reduktion]]). It remains open whether boundedness on all of $D$ already suffices.
    genau: |
      $f$ holomorphic on $D=\{|z|<|L|\}$, real on the axis, $f(f(z))=e^z$ near 0, and $f(V_0)\subset D$ with $V_0=\{z\in D:f_K(z)\in D\}$ $\Rightarrow$ $f=f_K$.
      Proved except for the numerically checked shape of $\operatorname{slog}(D)$ ([[kn.beob.slog_scheibe]]).
    warum: |
      1. In Kneser coordinates every real half-exponential function is $w\mapsto w+\tfrac12+\theta(w)$ with periodic $\theta$.
      2. On the corridor $\theta=\operatorname{slog}\circ f\circ T-\mathrm{id}-\tfrac12$ is a holomorphic function; because the corridor is wider than 1 at every height, periodicity continues $\theta$ to
         the whole plane.
      3. Because $\operatorname{slog}(f(z))$ lies in the band $\Omega$ and $\Omega$ is bounded on the right, $\operatorname{Re}\theta$ grows at most linearly in the height.
      4. A periodic function with this one-sided bound has no oscillations exploding upward (or downward) — that is Bôcher's theorem on positive harmonic
         functions on a punctured disk. So $\theta$ is constant, and $g\circ g=\mathrm{id}+1$ makes the constant zero.
    worum: |
      Which of the many half-exponential functions is “the right one”? Answer: the only one that maps a certain strip of the disk up to $L$ back into the disk — the strip
      on which Kneser's solution also stays in the disk.
- id: kn.satz.halbexp_singularitaet_L
  quelle_hash: f0b4cffc86b0
  theorie_hash: e40369b8cf4a
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: |
        Kneser's structure (kn.konstr.kneser): $A=u+\vartheta(u)$ with $u=\log\Psi/L$ and $\vartheta=\sum_{m\ge0}\kappa_me^{2\pi imu}$ (only nonnegative modes). Substituting into
        $f_K=T(A+\tfrac12)$ with $T(w)=\varphi(e^{L(w+\vartheta'(w))})$ and $e^{2\pi iu}=\Psi^{\gamma}$ gives the formula; $\varepsilon$ is the difference $\vartheta(A+\tfrac12)-\vartheta(A)$ as a series in $q$.
        The Darboux formula follows from the singularity analysis (Flajolet–Odlyzko) of the leading term. The constants are numerical (Kneser engine, formula checked to $5\cdot10^{-37}$).
    pruefung:
      f2_benutzte_voraussetzungen: Kneser structure with only nonnegative modes of ϑ (limit L for Im → +∞).
      f5_neue_frage: Is κ₁ (and with it d₁) a known constant?
      f3_spezialfall: 'Yes: structure of Abel functions at repelling fixed points (Écalle-type expansion).'
      f1_folgt_unmittelbar: Yes, from Kneser's structure theorem; new is the explicit form and the number of constants.
      f4_uebertragbar: To every base b > η and every fractional iterate exp^{[c]} (exponents 1 + nγ_b + j).
    bewertung:
      recherche: 'Forum mirror and Paulsen–Cowgill: singularity exponents of the half-exponential function at L not found.'
      nutzen: Explains the coefficient decay k^{−6.45} and supplies the constants for the error law of the polynomial roots.
      richtigkeit: Derivation from Kneser's structure; constants numerical, Darboux series hits a_k to 1e-18 at k = 300
    titel: 'Kneser''s half-exponential function at the fixed point L: f_K = φ(√L·Ψ·e^{Lε(Ψ^γ)}) — exponents 1 + nγ + j, no logarithms'
    aussage: |
      $$f_K=\varphi\bigl(\sqrt L\,\Psi\,e^{L\varepsilon(q)}\bigr),\qquad q=\Psi^{\gamma},\quad\varepsilon=2\kappa_1q+4\pi i\kappa_1^2q^2+\dots$$
      with the Fourier coefficients $\kappa_m$ of Kneser's θ map ($\kappa_1=-8.35216\cdot10^{-6}-2.75680\cdot10^{-4}i$). Hence
      $f_K-L=\sqrt L\,t\,(1+\sum c_mt^m)+\sum_{n\ge1}d_n\,t^{1+n\gamma}(1+\sum_je_{n,j}t^j)$: the analytic part is the regular (Schröder) half-iterate at $L$, the singularities have
      the exponents $1+n\gamma+j$, logarithms do not occur. Leading term $d_1=2L^{3/2}\kappa_1=8.1712\cdot10^{-4}+3.5008\cdot10^{-4}i$, in the form $D_1(1-z/L)^{1+\gamma}$:
      $D_1=-0.0320033-0.0112441i$. From this the Taylor coefficients about 0:
      $$a_k=2\operatorname{Re}\Bigl[D_1L^{-k}\frac{\Gamma(k-1-\gamma)}{\Gamma(-1-\gamma)\,k!}\Bigr](1+O(1/k)),\qquad|a_k|\lesssim71.57\,k^{-6.447}|L|^{-k}.$$
    bereich: $L=0.3181+1.3372i$, $\Psi$ Schröder function of exp at $L$ ($\Psi(e^z)=L\Psi(z)$), $\varphi=\Psi^{-1}$, $\gamma=2\pi i/L=4.44695+1.05794i$,
      $t=z-L$
    einfach: At the complex fixed point L, Kneser's half-exponential function looks almost like the “regular” half-iteration at this point — plus
      very weak additional terms with complex exponents. These additional terms determine how fast the Taylor coefficients decay.
    quellen:
    - stelle: Strand A (a_moden/BERICHT.md §4), strand B Lemma 8.2
    - {}
  en_theorie:
    beispiel: |
      Envelope $71.57\,k^{-6.447}|L|^{-k}$; the Darboux series with the first corrections hits $a_k$ to $10^{-12}$ ($k=100$) and $1.5\cdot10^{-18}$ ($k=300$). The pure leading term lies within
      $12/k$ of the amplitude (check file, $k=100$ to $600$).
    einordnung: |
      Basis for Kneser's properties in the proof ([[kn.satz.polynom_halbexp_hauptsatz]]) and for the error law ([[kn.beob.polynom_halbexp_fehlergesetz]]).
    genau: |
      $f_K=\varphi(\sqrt L\,\Psi\,e^{L\varepsilon(\Psi^\gamma)})$ with the Schröder function $\Psi$ at $L$ and $\gamma=2\pi i/L$. Singular exponents $1+n\gamma+j$; leading term $D_1(1-z/L)^{1+\gamma}$,
      $D_1=-0.0320033-0.0112441i$; $a_k\approx2\operatorname{Re}[D_1L^{-k}\Gamma(k-1-\gamma)/(\Gamma(-1-\gamma)k!)]$.
    warum: |
      1. Kneser's super-logarithm near $L$ is “regular super-logarithm plus periodic correction”, $A=u+\vartheta(u)$, and the correction has only oscillations $e^{2\pi imu}$ with $m\ge0$.
      2. In the Schröder coordinate $e^{2\pi iu}=\Psi^{\gamma}$ — hence the complex exponents $\gamma$.
      3. A half step shifts $u$ by $\tfrac12$; the correction changes by $\varepsilon$, a series in $\Psi^\gamma$.
      4. The weakest singularity $(1-z/L)^{1+\gamma}$ determines, by Darboux, the decay of the Taylor coefficients: $k^{-2-\operatorname{Re}\gamma}=k^{-6.447}$ times $|L|^{-k}$.
    worum: |
      How does Kneser's half-exponential function behave at the complex fixed point $L$? Described exactly — and from this follows how fast its Taylor coefficients about 0 decay.
- id: kn.satz.halbrang_linear
  quelle_hash: 42312ad9e64d
  theorie_hash: a31468126003
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: 'Half rank step in the linear model: L_s B_ν = B_{ν+s}'
    aussage: |
      To first order, the rank step turns the deviation $v$ into the solution $w$ of $w(x+1)-w(x)=v(x+1)$, $w(0)=0$. For $B_\nu(x)=\dfrac{\Gamma(x+\nu)}{\Gamma(x)\Gamma(\nu+1)}$ we have
      exactly $B_{\nu+1}(x+1)-B_{\nu+1}(x)=B_\nu(x+1)$; with the gamma continuation in $\nu$ a semigroup arises
      $$\mathcal L_sB_\nu=B_{\nu+s},\qquad\mathcal L_s\mathcal L_t=\mathcal L_{s+t}\quad(s,t\ge0),$$
      which at integer heights is a fractional summation with kernel $(s)_k/k!$. Two half rank steps give exactly one whole step (checked exactly on a 16×16 height matrix).
      **Only the linear model** — no $H_{3.5}$; already the second order contains the term $w(x)v'(x+1)$.
    bereich: Rank step $T_b(f)=S$ with $S(0)=1$, $S(x+1)=f(S(x))$; deviation from the successor $f=x+1+\varepsilon v$, first order in $\varepsilon$
    einfach: 'Taking a “half step” between power and tetration is hard. If one only considers small deviations from “plus 1”, it works: there
      the step to the next hyperoperation can be cleanly halved.'
    beweis:
      text: The recursion $B_{\nu+1}(x+1)-B_{\nu+1}(x)=B_\nu(x+1)$ is Pascal's rule in gamma form; the group property follows from the $\Gamma$
        shift and the $(s)_k(t)_j$ convolution (Vandermonde).
    pruefung:
      f1_folgt_unmittelbar: Yes (binomial calculus).
      f2_benutzte_voraussetzungen: First order, polynomial class with normalization w(0) = 0; on general holomorphic functions there are periodic
        additional solutions.
      f3_spezialfall: 'Yes: fractional differences/sums.'
      f4_uebertragbar: 'Second order: kn.satz.halbrang_quadratisch.'
      f5_neue_frage: Is there a semigroup $T_b^s$ on functions, $T_b^{1/2}\circ T_b^{1/2}=T_b$, with a selection rule?
    bewertung:
      nutzen: First exact building block for fractional ranks.
      richtigkeit: complete
    quellen:
    - stelle: forschung/eta_hyperoperationen/rang_gamma/BERICHT.md §§5–6, MATHEMATIK.md
  en_theorie:
    beispiel: |
      $\mathcal L_{1/2}\mathcal L_{1/2}=\mathcal L_1$: two half summations are one whole one (kernel $(1/2)_k/k!$).
    einordnung: |
      Second order: [[kn.satz.halbrang_quadratisch]]; goal [[kn.frage.halber_rang]].
    genau: |
      To first order the rank step is the summation $\Delta w=v(x+1)$; on the functions $B_\nu$ it shifts $\nu\mapsto\nu+1$, and $\mathcal L_s:B_\nu\mapsto B_{\nu+s}$ is a semigroup.
    warum: |
      $B_\nu(x)=\Gamma(x+\nu)/(\Gamma(x)\Gamma(\nu+1))$ satisfies Pascal's rule $B_{\nu+1}(x+1)-B_{\nu+1}(x)=B_\nu(x+1)$; this can be continued continuously in $\nu$.
    worum: |
      An exact half step from one hyperoperation to the next — but only for small deviations from “plus 1”.
- id: kn.satz.halbrang_quadratisch
  quelle_hash: d09af48bb81e
  theorie_hash: 16b91519b1fb
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: 'Second order: the quadratic half-rank jet is holomorphic on Re x > −1'
    aussage: |
      The canonical quadratic rank continuation for the rank increment $\tfrac12$ is a Newton series
      $$q_{1/2}(x)=\sum_{j\ge3}\alpha_j\binom xj,\qquad|\alpha_j|\le\frac{1500(1+\log j)}j,$$
      which converges absolutely and locally uniformly on $\operatorname{Re}x>-1$, hence is holomorphic; $q_{1/2}(0)=q_{1/2}(1)=q_{1/2}(2)=0$. Thus
      $x+1+\varepsilon\,2(B_{5/2}-B_{3/2})+\varepsilon^2q_{1/2}$ is an analytic half-rank jet. One value exactly: $Q_{1/2}(v,v)(3)=\tfrac{341}{12}-35\ln2=4.1565153470685808\ldots$;
      partial sums (512 terms): $q_{1/2}(0.5)\approx0.0369429$, $q_{1/2}(1.5)\approx-0.1204979$, $q_{1/2}(2.5)\approx1.0605429$.
      For $b>e^{1/e}$ the half-plane class used contains no complete tetration — a full rank flow from $b^x$ to tetration has to leave this class.
    bereich: Test perturbation $v(x)=x(x-1)$, $f_\varepsilon=x+1+\varepsilon v$; full rank step $S_\varepsilon=x+1+\varepsilon w+\varepsilon^2z+\ldots$
      with $\Delta w=v(x+1)$, $\Delta z=w(x)\,v'(x+1)$
    einfach: Even in the next order of accuracy the half step can be computed, and it yields a nice smooth function. For the real hyperoperation
      “three and a half”, however, all higher orders and the way to the true exponential function are still missing.
    beweis:
      text: Coefficient bound from gamma reflection and Abel–Plana summation (constants $C_W<21$, $C_h<14$, convolution at $k=m/2$); $|\binom
        xj|\le Cj^{-\operatorname{Re}x-1}$ on compact sets. Two exact algorithms agree in 129 coefficients.
    pruefung:
      f1_folgt_unmittelbar: No (bounds on gamma quotients).
      f2_benutzte_voraussetzungen: Only the polynomial test perturbation v = x(x−1); no statement for bˣ itself.
      f3_spezialfall: 'no'
      f4_uebertragbar: To gamma mode pairs and the true exponential family (linear correction explicit there) — open.
      f5_neue_frage: Do all orders converge, and with which selection rule? → kn.frage.halber_rang
    bewertung:
      nutzen: Shows that a half rank exists as a function in second order; the earlier drift was due to the reconstruction.
      richtigkeit: complete; partial sums not tightly certified
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_analytisch_2026_10_12/MATHEMATIK.md §6; halb_rang_quadratisch_2026_10_12
    - stelle: §2, Abel–Plana formula
  en_theorie:
    beispiel: |
      Exact at height 3: $\tfrac{341}{12}-35\ln2=4.15651534706858\ldots$
    einordnung: |
      Replaces the drifting reconstruction [[kn.gescheitert.polynom_rekonstruktion]]; [[kn.frage.halber_rang]] remains open.
    genau: |
      $q_{1/2}(x)=\sum_{j\ge3}\alpha_j\binom xj$ with $|\alpha_j|\le1500(1+\log j)/j$ is holomorphic on $\operatorname{Re}x>-1$.
    warum: |
      The coefficients can be computed exactly from gamma quotients and roughly estimated; $\binom xj$ decays like $j^{-\operatorname{Re}x-1}$, which suffices for convergence.
    worum: |
      The half rank step in the next order of accuracy — as a genuine holomorphic function.
- id: kn.satz.hexation_eindeutig_g0
  quelle_hash: 92b006bf5751
  theorie_hash: 38476269b9fb
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        (i) Let $\alpha_1,\alpha_2$ be two such functions, $\Sigma_2=\alpha_2(G_0)$. By injectivity and the functional equation, $\Sigma_2$ is the strip between the analytic
        curve $\Gamma_2=\alpha_2(\gamma_0)$ and $\Gamma_2+1$; both ends run to $\infty$ (there $\alpha_2-\alpha_q$ is bounded and $\alpha_q\to\infty$), the translates
        $\Sigma_2+n$ tile $\mathbb C$. $\varphi=\alpha_1\circ\alpha_2^{-1}-\mathrm{id}$ is holomorphic on $\Sigma_2$, and for $z\in\Gamma_2$ we have
        $\varphi(z+1)=\alpha_1(P(\alpha_2^{-1}(z)))-z-1=\varphi(z)$. Hence $\varphi$ continues to an entire, 1-periodic function (Morera on the gluing curves).
        Near the ends $\varphi=(\alpha_1-\alpha_q)-(\alpha_2-\alpha_q)$ is bounded, in between it is continuous on a compact set — $\varphi$ is bounded, constant by Liouville,
        and real; the normalization makes it 0.
        (ii) $\alpha_K$ on $\gamma_0$: below via the pentation up to the arc of the fork method (ihex), above via the θ representation $W+\sum c_ne^{2\pi i s(n-1)W}$,
        $W=\alpha_q$; both agree in the overlap to $10^{-14}$–$10^{-18}$. That $H_K$ is holomorphic to the left of $\operatorname{Re}z=-0.741$ follows from kn.beob.hexation_verzweigt
        and the maps of the real set (the only condition).
    pruefung:
      f2_benutzte_voraussetzungen: Injectivity of α₂ on G₀, functional equation on γ₀, boundedness of α − α_q at q and q̄; for (ii) the holomorphy
        of H_K to the left of −0.741.
      f5_neue_frage: 'Domain independence: Is every solution whose Abel function is injective on ANY such domain the Kneser-type one? → kn.verm.hexation_streifen'
      f3_spezialfall: 'Yes: fundamental-domain criterion as in Trappmann–Kouznetsov for exp, here with a fixed, solution-independent domain.'
      f1_folgt_unmittelbar: Part (i) is the mechanism of Trappmann–Kouznetsov (fg.lem.periodisch_liouville) with a fixed domain; part (ii) is
        computation.
      f4_uebertragbar: To every base b > η₅ and every domain G that lies between q̄ and q and is bounded by a curve γ and P(γ) — only (ii) has
        to be checked each time.
    bewertung:
      recherche: 'Literature map 12.10.2026: forum (tid 1177: Levenstein 2017 builds the Kneser-type hexation via a circle and θ, without branchings
        or a uniqueness proof; tid 1263, 949), Kouznetsov 2014 (pentation only), arXiv/zbMATH (pentation, hyperoperation), MathOverflow: not found.
        Levenstein claims there only that the solution between the two fixed points is “demonstrably unique”, without argument.'
      nutzen: Makes “the” Kneser-type hexation well defined despite the empty Paulsen–Cowgill class.
      richtigkeit: (i) proved, (ii) numerical with a large margin (−2.994 versus −1.741)
    voraussetzungen:
    - text: α holomorphic on a neighborhood of G₀ ∪ γ₀ without q, q̄, injective on G₀
    - text: α(P(w)) = α(w) + 1 for w ∈ γ₀
    - text: α − α_q bounded for w → q in G₀, α − α_q̄ bounded for w → q̄
    - text: α real on G₀ ∩ ℝ; normalization via H(0) = 1
      notiz: fixes only the additive constant
    titel: Uniqueness of the Kneser-type hexation over a fixed fundamental domain G₀
    aussage: |
      (i) **Uniqueness (proved):** There is at most one Abel function $\alpha$ of $P$ with these properties, up to an additive constant.
      (ii) **Existence (numerically checked):** The Abel function $\alpha_K$ of the Kneser-type hexation has them: $\gamma_0$ and $P(\gamma_0)$ meet only in $q,\bar q$
      ($P(\gamma_0)$ runs through $P(\operatorname{Re}q)=-0.99415$), and $\Gamma_0=\alpha_K(\gamma_0)$ has $\operatorname{Re}\le-2.9939$ everywhere — the image strip between $\Gamma_0$
      and $\Gamma_0+1$ thus lies to the left of $-1.99$, far inside the branch-point-free domain $\operatorname{Re}z<-0.741$; by the argument principle $H_K$ maps it biholomorphically onto $G_0$.
      Together: **The Kneser-type hexation is the only real hexation with $H(0)=1$ whose inverse function is holomorphic and injective on $G_0$ and behaves at $q,\bar q$
      like the regular Abel function.** $G_0$ depends only on $P$ and $q$, not on a solution.
    bereich: $b=2$; $q$ repelling fixed point of the pentation $P$, $\gamma_0=\{\operatorname{Re}q+it:|t|\le\operatorname{Im}q\}$, $G_0$ the Jordan
      domain between $\gamma_0$ and $P(\gamma_0)$; $\alpha_q$ regular Abel function at $q$
    einfach: Instead of “smooth on an entire half-plane” (which is not possible for the hexation) one takes a fixed domain between the two complex
      fixed points of the pentation. Anything that is invertibly smooth there and behaves properly at the fixed points is already determined —
      and the Kneser-type hexation satisfies this.
    quellen:
    - {}
    - stelle: Model for the mechanism
    - stelle: 'knhexinit (exp-081): ihex and θ coefficients kncc'
  en_theorie:
    beispiel: |
      $P(\operatorname{Re}q)=P(-1.99295)=-0.99415$ — the crescent $G_0$ extends on the axis from $-1.993$ to $-0.994$ and upward only to $\operatorname{Im}q=1.445$; the
      singular point $w_b=-1.979+1.912\,i$ of the pentation does not lie in $G_0$. $\alpha_K(-1.99295)=-2.99393$.
    einordnung: |
      The hexation version of [[kn.satz.trappmann_kouznetsov]], with a solution-independent domain. Replaces [[kn.satz.paulsen_cowgill]], which does not apply here.
      Whether every other domain singles out the same solution: [[kn.verm.hexation_streifen]].
    genau: |
      $\gamma_0$ is the vertical segment from $\bar q$ to $q$ through $\operatorname{Re}q=-1.99295$, and $G_0$ the domain between $\gamma_0$ and its image $P(\gamma_0)$
      (a crescent around the real segment $[-1.993,\,-0.994]$). An Abel function $\alpha$ ($\alpha(P(w))=\alpha(w)+1$ on $\gamma_0$) that is holomorphic and injective on $G_0$,
      real on the axis, and behaves at $q$ and $\bar q$ like the regular Abel function up to a bounded term, is unique up to a constant. The inverse function
      of the Kneser-type hexation is such a function.
    warum: |
      1. **Uniqueness.** Take two such functions $\alpha_1,\alpha_2$. The image $\alpha_2(G_0)$ is a strip between a curve $\Gamma$ and $\Gamma+1$. The function
         $\varphi=\alpha_1\circ\alpha_2^{-1}-\mathrm{id}$ is holomorphic on it and has the same values on the two boundaries (functional equation). Thus it continues
         1-periodically to all of $\mathbb C$. At the ends it is bounded, because both Abel functions behave like $\alpha_q$ at $q$ — so it is constant.
         The difference from the strip problem: Both functions live on the **same** domain, the question “is $\alpha_1$ defined there at all?” does not arise.
      2. **Existence.** For the Kneser-type hexation $\Gamma_0=\alpha_K(\gamma_0)$ was computed (below via the pentation up to the computation arc, above via the
         θ representation; equal in the overlap to $10^{-14}$ to $10^{-18}$). The strip between $\Gamma_0$ and $\Gamma_0+1$ begins on the axis at $[-2.994,\,-1.994]$ and
         runs to the upper left — far away from the first branch points at $\operatorname{Re}z=-0.741$. There $H_K$ is holomorphic, and because the boundary
         $\gamma_0\cup P(\gamma_0)$ is a simple closed curve, $H_K$ maps the strip invertibly onto $G_0$.
    worum: |
      What determines “the” Kneser-type hexation if the half-plane characterization of the tetration is empty here ([[kn.satz.hexation_keine_halbebene]])? A fixed domain
      between the two complex fixed points $q$ and $\bar q$ of the pentation: Anything that has a smooth, invertible Abel function there is unique — and the Kneser-type
      hexation has one.
- id: kn.satz.hexation_gebiete
  quelle_hash: 45b608ff3d23
  theorie_hash: d9d761a48315
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: |
        (i) On the real segment $H_K\circ\alpha_K=\mathrm{id}$. The continuation remains valid as long as $\alpha_K(w)$ is not a branch point of $H_K$; there, however, $H_K$ takes
        only real values or $\infty$, and real $w\in G$ have real $\alpha_K(w)$. Hence $H_K\circ\alpha_K=\mathrm{id}$ on $G$, $\alpha_K$ is injective. The Abel equation
        holds on the axis and continues along $\gamma$. Near $q$, $\alpha_K=\alpha_q+\theta_K(\alpha_q)$ with bounded $\theta_K$ (exponentially constant above), on each branch
        of $\alpha_q$ up to a constant $k\Pi$. Thus the proof of kn.satz.hexation_eindeutig_g0 applies verbatim.
        (ii) If $\alpha_K$ were holomorphic on the competitor's domain, (i) would hold. Fixed point $p\in G$ and injectivity on $S\cup(S+1)$ contradict each other: $H(z)=p$ gives $H(z+1)=P(p)=p$.
        (iii) $\alpha_K$ on $\gamma_c$ below via the pentation up to the computation arc (ihex), above via the θ representation — both equal at the crossover point; what is checked is that
        the strip between $\Gamma_c=\alpha_K(\gamma_c)$ and $\Gamma_c+1$ contains no branch point $z_{m,k}$ of $H_K$ and that $\gamma_c\cup P(\gamma_c)$ is a Jordan boundary.
    pruefung:
      f2_benutzte_voraussetzungen: Holomorphic continuability of α_K to G; for (ii) in addition injectivity on two strips, to exclude fixed points.
      f5_neue_frage: Is there any admissible domain at all that contains a singular point of α_K (p, p̄, preimages of them, the points w_b, P⁻¹(w_b),
        … beyond the cut)? → kn.verm.hexation_streifen
      f3_spezialfall: Yes, of the fundamental-domain criterion of Trappmann–Kouznetsov, with the Abel function of the known solution as a touchstone.
      f1_folgt_unmittelbar: (i) from kn.satz.hexation_eindeutig_g0 plus the continuation of H_K∘α_K = id; (ii) as a contrapositive.
      f4_uebertragbar: To every base b > η₅; the family G_c would have to be recomputed there.
    bewertung:
      recherche: 'Literature map 12.10.2026: forum (tid 1177: Levenstein 2017 builds the Kneser-type hexation via a circle and θ, without branchings
        or a uniqueness proof; tid 1263, 949), Kouznetsov 2014 (pentation only), arXiv/zbMATH (pentation, hyperoperation), MathOverflow: not found.'
      nutzen: Pushes the open question onto domains that include a singular point of α_K.
      richtigkeit: (i), (ii) proved (conditional like kn.satz.hexation_eindeutig_g0); (iii) numerical on ten domains
    voraussetzungen:
    - text: α_K can be continued holomorphically from the real segment [c, P(c)] to all of G (including the boundary without q, q̄)
    - text: 'α admissible on G: holomorphic and injective, Abel equation on γ, α − α_q bounded at q and α − α_q̄ bounded at q̄, real on the axis'
    titel: Independent of the domain, as far as the Abel function of the Kneser-type hexation reaches
    aussage: |
      (i) **Proved:** Under this hypothesis $\alpha_K$ itself is admissible on $G$, and every admissible Abel function on $G$ is $\alpha_K+\text{const}$ — the theorem for
      $G_0$ (kn.satz.hexation_eindeutig_g0) holds for every such domain.
      (ii) **Consequence:** A competing solution needs a fundamental domain that contains a singular point of $\alpha_K$. Certainly singular are the attracting fixed points
      $p=1.79373+1.57363\,i$, $\bar p$ of the pentation ($\alpha_K(P^nw)=\alpha_K(w)+n\to\infty$ along orbits toward $p$). If the competitor is injective on two adjacent strips,
      its fundamental domain contains no fixed point of $P$.
      (iii) **Numerical:** For the domains $G_c$ with $\gamma_c$ = circular arc from $\bar q$ via $c$ to $q$ the hypothesis holds for
      $c\in\{-2.5,\,\operatorname{Re}q,\,-1.6,\,-1.2,\,-0.9,\,-0.6,\,-0.3,\,0,\,0.4,\,1\}$ — there the Kneser-type hexation is the only solution. From $c\approx2$ on, $P(\gamma_c)$ intersects
      the arc (12 and 8 intersections, respectively, for $c=2,3$), and $G_c$ is then not a fundamental domain.
    bereich: '$b=2$; fundamental domain $G$: Jordan domain with boundary $\gamma\cup P(\gamma)$, $\gamma$ from $\bar q$ via a real point $c$ to
      $q$; $\alpha_K$ Abel function of the Kneser-type hexation'
    einfach: The choice of domain does not matter as long as the inverse function of the Kneser-type hexation stays smooth on the whole domain
      — this was checked by calculation in a whole family of domains. Another solution would have to use a domain in which this inverse function
      has a singularity, such as the attracting fixed point.
    quellen:
    - {}
    - stelle: 'knhexinit (exp-081): ihex and θ coefficients kncc'
  en_theorie:
    beispiel: |
      The circular-arc family: $\alpha_K(c)$ is $-3.357$ ($c=-2.5$), $-2.994$ ($c=\operatorname{Re}q$), $-1.897$ ($c=-0.9$), $-1.000$ ($c=0$, check: $H(-1)=0$), $-0.607$ ($c=0.4$),
      $0.000$ ($c=1$, check: $H(0)=1$). For $c=-0.3$ to $1$ the image strip on the axis already extends to the right beyond $-0.741$, but turns to the upper left and misses the
      first branch point $-0.741+2.746\,i$. For $c=2$ and $3$, $P(\gamma_c)$ intersects the arc — there $G_c$ is no longer a fundamental domain.
    einordnung: |
      Generalizes [[kn.satz.hexation_eindeutig_g0]]. What remains open is in [[kn.verm.hexation_streifen]]: domains that include a singular point of $\alpha_K$.
    genau: |
      A fundamental domain $G$ is a domain between a curve $\gamma$ from $\bar q$ via a real point $c$ to $q$ and its image $P(\gamma)$ (the two meet
      only in $q,\bar q$). If the Abel function $\alpha_K$ of the Kneser-type hexation can be continued holomorphically from the real segment $[c,P(c)]$ to all of $G$, then
      - $\alpha_K$ is injective on $G$ and satisfies all conditions of [[kn.satz.hexation_eindeutig_g0]],
      - and every other admissible Abel function on $G$ is $\alpha_K$ plus a constant.
      For the circular-arc domains $G_c$ ($\gamma_c$ from $\bar q$ via $c$ to $q$) this is the case for all checked $c$ from $-2.5$ to $1$.
    warum: |
      1. **The continuation remains an inverse.** On the real segment $H_K(\alpha_K(w))=w$. This equation remains true under continuation as long as $\alpha_K(w)$ does not meet a
         branch point of $H_K$ — and there $H_K$ has only real values (or $\infty$). So $\alpha_K$ takes no value twice on $G$.
      2. **At $q$, $\alpha_K$ behaves like $\alpha_q$**, up to a bounded term: This holds on every branch on which one reaches $q$.
      3. **Then the proof with a fixed domain applies** — just with $G$ instead of $G_0$.
      4. **What a competitor would need:** a domain on which $\alpha_K$ becomes singular somewhere. Certainly singular is $\alpha_K$ at the attracting fixed point $p$ of the pentation: On orbits
         that run toward $p$, $\alpha_K$ grows by 1 at each step. If $p$ lies in the domain of a solution, then this solution takes the value $p$ at two neighboring places
         ($H(z)=p$, $H(z+1)=P(p)=p$) — so anything injective on two strips cannot include $p$.
    worum: |
      [[kn.satz.hexation_eindeutig_g0]] determines the Kneser-type hexation over a fixed domain $G_0$. Does the choice of domain matter? As long as the inverse function
      of the known solution stays smooth on the domain: no. Another solution would need a domain in which this inverse function becomes singular.
- id: kn.satz.hexation_keine_halbebene
  quelle_hash: 0d00de9b61df
  theorie_hash: 9a847a5d8aac
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        1. Near $q$ there is the Abel function $\alpha_q$ with $\alpha_q(P(w))=\alpha_q(w)+1$. For $\operatorname{Im}z>y_1$, $\theta(z):=\alpha_q(H(z))-z$ is defined, holomorphic and
           1-periodic; with the limit, $\theta(z)=c+\sum_{n\ge1}c_ne^{2\pi inz}$, hence $|\theta(z)-c|\le M e^{-2\pi\operatorname{Im}z}$.
        2. Near $i\infty$, $H=F_q\circ(\mathrm{id}+\theta)$; by the identity theorem this holds on the whole of $\{\operatorname{Im}z>y_1\}$ without the isolated singularities of the right-hand side.
        3. $F_q$ is exactly $\Pi$-periodic and has, at $\zeta_c-2+k\Pi$ — approached from above — a logarithmic branching (condition kn.beob.hexation_verzweigt).
        4. For large $k$, $\theta$ is constant there up to $Me^{-2\pi\cdot2.94k}$; by Rouché, $z+\theta(z)=\zeta_c-2+k\Pi$ has exactly one solution $z_k$ near $\zeta_c-2+k\Pi-c$.
           The vertical path from above to $z_k$ is mapped by $\mathrm{id}+\theta$ onto a path that is arbitrarily close to the circuit path from kn.beob.hexation_verzweigt.
        5. A circuit around $z_k$ changes $F_q\circ(\mathrm{id}+\theta)$ by $2\pi i/\ln2$ — $H$ cannot be holomorphic there. Since $z_k$ lies, for large $k$, in every upper and every right
           half-plane, this contradicts the hypothesis.
    pruefung:
      f2_benutzte_voraussetzungen: Holomorphy on a half-plane that contains the diagonal k·Π; limit q uniform on strips; the numerically supported
        log branching (the only condition).
      f5_neue_frage: Which characterization takes its place? → kn.verm.hexation_streifen
      f3_spezialfall: 'Yes, of a general mechanism: If the level function is not entire, its singularities reappear in the periodic superfunction.'
      f1_folgt_unmittelbar: 'Almost: from the periodicity of F_q, the log branching at ζ_c − 2 and the θ representation of every solution with
        limit q (as in Paulsen–Cowgill).'
      f4_uebertragbar: To all bases b > η₅ with the same structure (log point of F_q from the singularity −2 of the tetration); not to the tetration
        (exp entire).
    bewertung:
      recherche: 'Literature map 12.10.2026: forum (tid 1177: Levenstein 2017 builds the Kneser-type hexation via a circle and θ, without branchings
        or a uniqueness proof; tid 1263, 949), Kouznetsov 2014 (pentation only), arXiv/zbMATH (pentation, hyperoperation), MathOverflow: not found.'
      nutzen: Shows that the uniqueness question for the hexation must be posed differently than for the tetration.
      richtigkeit: conditionally proved (condition numerical to 6 digits)
    voraussetzungen:
    - text: H holomorphic on an upper half-plane {Im z > y₀} or on a right half-plane {Re z > x₀}
    - text: H(z+1) = P(H(z)) there
    - text: H(x+iy) → q for y → +∞, uniformly for x in strips of width 1
    - text: H real on the axis or H(0) = 1
      notiz: the contradiction already arises without normalization
    titel: No hexation to base 2 is holomorphic in a half-plane and tends to q upward
    aussage: |
      There is no such solution. More precisely: Every solution with limit $q$ has the form $H=F_q\circ(\mathrm{id}+\theta)$ with 1-periodic $\theta$ tending to a constant $c$ upward,
      and it is branched at points $z_k\approx\zeta_c-2+k\Pi-c$ ($k\ge k_0$) (circuit $2\pi i/\ln2$). These points run diagonally to the upper right
      ($\operatorname{Re}z_k\approx3.009k$, $\operatorname{Im}z_k\approx2.941k$) and lie in every upper and every right half-plane.
      The characterization of Kneser's tetration by Paulsen–Cowgill (holomorphic on a half-plane, vertical limits $L$, $\bar L$) therefore has **no**
      candidate for the hexation; “the” Kneser-type hexation must be determined differently.
    bereich: $b=2$; $P$ the pentation (kn.konstr.pentation), $q$ its repelling fixed point, $\mu_q=P^\prime(q)$, $\Pi=2\pi i/\ln\mu_q=3.00911+2.94132\,i$;
      $H$ solution of $H(z+1)=P(H(z))$
    einfach: 'For tetration the solution is determined by two requirements: smooth on an entire half-plane and tending to the fixed point upward.
      For the hexation these two requirements cannot be met together at all — the singularities of the pentation reappear periodically in every
      solution, ever farther to the upper right.'
    quellen:
    - {}
    - stelle: Prop. 2 (model for the argument)
  en_theorie:
    beispiel: |
      For the Kneser-type hexation to base 2 the branch points lie at $z\approx-0.741+m+2.746\,i+(k-1)\Pi$, $m\ge0$, $k\ge1$:
      $-0.741+2.746\,i$, $0.259+2.746\,i$, …, then $2.268+5.687\,i$, …, $5.277+8.628\,i$, … — each row shifted by $\Pi$ to the upper right.
    einordnung: |
      The counterpart to [[kn.satz.paulsen_cowgill]]: There the characterization can be satisfied and determines the solution, here it is empty. What can take its place:
      [[kn.verm.hexation_streifen]].
    genau: |
      If $H$ is a solution of $H(z+1)=P(H(z))$, holomorphic on an upper half-plane $\{\operatorname{Im}z>y_0\}$ or a right half-plane $\{\operatorname{Re}z>x_0\}$, with
      $H(x+iy)\to q$ for $y\to+\infty$ (uniformly on strips of width 1), then this leads to a contradiction. Every solution with limit $q$ is branched at points
      $z_k\approx z_0+k\Pi$, $\Pi=2\pi i/\ln P^\prime(q)=3.009+2.941\,i$, and these points run diagonally into every such half-plane.
    warum: |
      1. **Every solution has the Kneser form.** Near $q$ there is the Abel function $\alpha_q$. Because $H$ tends to $q$ at the top, $\theta(z)=\alpha_q(H(z))-z$ is defined there and
         1-periodic, hence a Fourier series $c+\sum_{n\ge1}c_ne^{2\pi inz}$ that tends to $c$ exponentially upward. Thus $H=F_q\circ(\mathrm{id}+\theta)$.
      2. **$F_q$ has periodically recurring log points** at $\zeta_c-2+k\Pi$ ([[kn.beob.hexation_verzweigt]]).
      3. **High up, $\theta$ is practically constant.** Therefore $z+\theta(z)$ hits each of these points at a $z_k$ near $\zeta_c-2+k\Pi-c$ (Rouché's theorem).
      4. **$H$ is branched there**: A circuit around $z_k$ changes the value by $2\pi i/\ln2$. For large $k$, $z_k$ lies in every upper and every right half-plane — contradiction.
      The only ingredient that is secured only numerically is the log branching of $F_q$ (measured: circuit $9.06472\,i$, exactly $2\pi i/\ln2$).
    worum: |
      For the tetration two requirements determine the solution ([[kn.satz.paulsen_cowgill]]): holomorphic on a half-plane and tending vertically upward to the fixed point $L$.
      For the hexation to base 2 these two requirements cannot be met together — there is no single solution that does so.
- id: kn.satz.hexation_logpunkt
  quelle_hash: bde53c9496f9
  theorie_hash: 0dd2c5475268
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        (i) With θ continuous up to the axis, $\zeta(x)=x+\theta(x)$ tends to a finite point $Z$, and $F_q(\zeta(x))=H(x)\to-\infty$. Because $F_q(\zeta)=P(F_q(\zeta-1))$,
        $F_q(\zeta(x)-1)$ tends to a point where $P$ goes to $-\infty$: a log point $w_b+j\Pi_T$ of the pentation (there $P(w-1)=-2$, and the tetration
        is log₂-singular at $-2$). Nested types drop out: $\log_2(\log_2\varepsilon+c)$ goes to $-\infty$ only for $\log_2\varepsilon+c\to0^+$, hence not for $\varepsilon\to0$.
        (ii) Near $Z$, $F_q=\log_2\varepsilon+h(\varepsilon)$. With $\varepsilon=re^{i\varphi}$ ($\varphi$ unbounded on the log surface), $\operatorname{Im}F_q=0$ means:
        $\varphi/\ln2+\operatorname{Im}h(re^{i\varphi})=0$. The left side increases strictly in $\varphi$ (derivative $1/\ln2+O(r)$), so for every small $r$ there is exactly one $\varphi$:
        a single real ray, on it $F_q=\log_2r+\operatorname{Re}h\to-\infty$. Because θ is 1-periodic, $\zeta(x+1)=\zeta(x)+1$, and $H(s+1)=P(-\infty)=L_T$ — the
        curve runs on the ray from $Z$ to $Z+1$. Conversely: If the ray arrives at $Z+1$, $F_q(\zeta+1)=P(F_q(\zeta))$ maps the arc onto the next one; the domain above
        the curve is a cylinder with one end at the top, and the conformal map of the upper half-plane (mod 1) onto it with $\theta\to$ const at the top is unique up to a real
        translation (as for Kneser); $H(-1)=0$ determines the translation.
        (iii) from (i), (ii). (iv) Continuing θ means lifting $H$ through $F_q$; this works as long as $H$ does not meet a singular value of $F_q$. On the sheet reached from above,
        the values at the branch points lie on the axis ($P^m(L_T)$, $-\infty$).
        (v) $F_q$ as the main chain $\mathrm{pent}^n(q+\Psi(\mu_q^{\zeta-n}))$ of the fork; in the region of the tracked map it agrees with the sheet tracking to $10^{-14}$.
        Newton from a grid ($19\times8$ starting points) for $F_q(\zeta^*)=w_b+j\Pi_T$, then $Z=\zeta^*+1$; ray by Newton continuation $F_q(\zeta)=t$ from $t\approx-10$ to
        $L_T-10^{-4}$ (steps at most 0.06).
      luecken:
      - That θ is continuous up to the axis (Carathéodory) is assumed and not derived from the strip condition.
      - That F_q tends to ∞ only at log points of the form log₂ε + h(ε) or nested is inferred from the construction of P (P → −∞ only at w_b +
        jΠ_T), not completely proved.
      - 'Part (iv): Other singular values of F_q off the axis, besides p, are not ruled out.'
    pruefung:
      f2_benutzte_voraussetzungen: θ continuous up to the axis (otherwise no starting point), log₂ form at the log points, periodicity of θ, normalization
        H(−1) = 0.
      f5_neue_frage: Further to the right (Re Z > 7) or for other zeros of the tetration, is there a log point with a closing ray? And can the
        solutions with p in the image (part iv) also be excluded under injectivity on only one strip?
      f3_spezialfall: 'Counterpart to the tetration: There exp has no log points, the curve begins at −∞, and the Kneser curve is the only translation-invariant
        real curve.'
      f1_folgt_unmittelbar: Part (ii) follows from the log₂ form and the Riemann mapping theorem on the cylinder as for Kneser; what is new is
        counting the solutions by their starting point.
      f4_uebertragbar: To all bases b > η₅ (recompute w_b and Π_T).
    bewertung:
      recherche: 'Literature map 12.10.2026: forum (tid 1177: Levenstein 2017 builds the Kneser-type hexation via a circle and θ, without branchings
        or a uniqueness proof; tid 1263, 949), Kouznetsov 2014 (pentation only), arXiv/zbMATH (pentation, hyperoperation), MathOverflow: not found.'
      nutzen: 'Turns the open uniqueness question into a countable check: log points and their real rays.'
      richtigkeit: (i)–(iv) proved under the hypotheses (log₂ form measured), sketch; (v) numerical, grid not exhaustive
    voraussetzungen:
    - text: θ = α_q∘H − id can be continued from above (near q) over the whole upper half of the strip and is continuous up to the axis (“θ-class”)
      notiz: 'what happens otherwise: part (iv)'
    - text: F_q tends to ∞ only at log points, namely like log₂ε + h(ε) with holomorphic h or nested (log₂∘log₂ …)
      notiz: measured at the point ζ_c − 2 (winding 2πi/ln 2, kn.beob.hexation_verzweigt) and at two further log points (values on circles)
    titel: Every Kneser-type solution begins at a log point of F_q — and every log point carries at most one
    aussage: |
      (i) **Starting point.** For $x\downarrow s$ the curve point $x+\theta(x)$ runs into a log point $Z$ of $F_q$; there $F_q(Z-1)=w_b+j\,\Pi_T$ for an integer $j$.
      (ii) **A single ray.** From every log point exactly one path emanates on which $F_q$ is real (increasing from $-\infty$). The solution exists if and only if this
      ray arrives at $Z+1$ (value $L_T$). Then the curve $C_H=\{x+\theta(x)\}$ is this arc together with its integer translations, and $C_H$ determines $\theta$ and, with $H(-1)=0$,
      the solution.
      (iii) **Consequence.** The solutions of the θ-class correspond one-to-one (up to $Z\mapsto Z+k\Pi$) to the log points with a closing ray. The Kneser-type hexation
      belongs to $Z_0=\zeta_c-2=-1.59693219-1.70988020\,i$ (exactly: $F_q(Z_0-1)=w_b$ to $10^{-12}$; this improves $\zeta_c$ to $0.40306781-1.70988020\,i$).
      (iv) **Outside the θ-class.** If the continuation of θ breaks off, then $H$ meets on the upper half of the strip a singular value of $F_q$ off the axis.
      Known is the attracting fixed point $p$: there $\alpha_q$ cannot be chosen continuously on any circle (jumps $\approx\pm\Pi_p$, $\Pi_p=2\pi i/\ln P'(p)$). Such solutions are
      excluded by kn.satz.hexation_gebiete (ii) if they are injective on two neighboring strips.
      (v) **Numerical: no competitor nearby.** In the band between $C$ and $C+\Pi$ ($\operatorname{Re}Z$ from $-2$ to $7$, $j=-1,\dots,2$) $F_q$ has exactly four log points:
      $Z_0$, $Z_0+\Pi$ and two more, $2.68744+0.99506\,i$ ($j=-1$) and $3.63707+0.95142\,i$ ($j=0$). The ray from $Z_0$ arrives at $Z_0+1$ (check). The other two
      reach $L_T$ elsewhere: at the corner $Z_0+\Pi+1$ and, respectively, already after $0.065$ at an ordinary point. Neither gives a second solution.
    bereich: $b=2$; solutions $H$ of $H(z+1)=P(H(z))$, real and increasing on $(s,\infty)$, $H(-1)=0$, holomorphic and injective on a strip $S=\{a\le\operatorname{Re}z\le
      a+1\}$, $H\to q$ upward; $F_q$, $\Pi$ as in kn.beob.hexation_verzweigt; $w_b=-1.978596+1.911851\,i$ the log point of the pentation ($P(w_b-1)=-2$),
      $\Pi_T=2\pi i/\ln\lambda_T=3.823702\,i$ its period
    einfach: Every real hexation of this kind falls to −∞ at the left end of its real domain. In the auxiliary function F_q a special point belongs
      to this, a log point. From every log point exactly one real trace leads away. Only if this trace arrives again exactly one level further
      does a solution arise. The question “Is there a second one?” thereby becomes “Is there a second log point whose trace closes?”. Nearby there
      are two further log points, but their traces do not close.
    quellen:
    - {}
    - stelle: 'knhexinit (exp-081): q, ksig, pent; F_q formed at run time'
  en_theorie:
    beispiel: |
      Check on the Kneser curve: The ray from $Z_0=-1.59693-1.70988\,i$ arrives at $t=L_T-10^{-4}$ at distance $0.010$ from $Z_0+1$ (as expected for a corner with
      exponent $\alpha=2.37$: distance $\sim(10^{-4})^{1/\alpha}$). Incidentally: $F_q(Z_0-1)=w_b$ to $10^{-12}$ improves the corner to $\zeta_c=0.40306781-1.70988020\,i$.
      Around the new log point $3.63707+0.95142\,i$, $F_q$ changes by $1.13\,i=(\pi/4)/\ln2$ per eighth of a circle — exactly the log₂ form.
    einordnung: |
      Turns [[kn.verm.hexation_streifen]] into a countable check. Builds on [[kn.beob.hexation_verzweigt]] (log₂ form) and the Kneser construction [[kn.konstr.kneser]];
      part (iv) connects to [[kn.satz.hexation_gebiete]].
    genau: |
      A solution $H=F_q\circ(\mathrm{id}+\theta)$ is real on the real axis. The points $x+\theta(x)$ form the curve $C_H$, on which $F_q$ takes the values $H(x)$.
      At the left end of the real domain $H$ falls to $-\infty$ — and there the curve must begin at a point $Z$ at which $F_q$ goes logarithmically to $-\infty$
      (a **log point**, with $F_q(Z-1)=w_b+j\cdot3.8237\,i$, $w_b$ the log point of the pentation). From such a point exactly **one** real ray emanates. If it arrives at
      $Z+1$, there is exactly one solution for $Z$; otherwise none. The Kneser-type hexation belongs to $Z_0=-1.59693-1.70988\,i$.
      If a solution falls outside this type, it meets a special value of $F_q$ in the strip — known is the attracting fixed point $p$.
    warum: |
      1. **Where the curve begins.** $H(x)\to-\infty$ for $x\downarrow s$, so $F_q\to-\infty$ at the start $Z$ of the curve. Because $F_q(\zeta)=P(F_q(\zeta-1))$, $F_q(Z-1)$ must be a point
         at which the pentation goes to $-\infty$ — these are the log points $w_b+j\Pi_T$ (there $P(w-1)=-2$, and the tetration has its log₂ singularity at $-2$).
      2. **Only one ray.** Near $Z$, $F_q=\log_2\varepsilon+h(\varepsilon)$. Real means: the angle of $\varepsilon$ divided by $\ln2$ plus $\operatorname{Im}h$ equals 0. On the
         infinitely-sheeted log surface the angle is unbounded, but the left side grows strictly with the angle — hence exactly one solution.
      3. **Closing.** Because θ is 1-periodic, $Z+1$ also lies on the curve along with $Z$, and there $F_q=P(-\infty)=L_T$. So the ray must arrive at $Z+1$. If it does,
         the curve is determined, and as for Kneser the conformal map onto the domain above it supplies θ — unique up to a translation, which $H(-1)=0$ fixes.
      4. **The computation.** In the band between $C$ and $C+\Pi$ up to $\operatorname{Re}Z=7$ there are four log points (for $j=-1,\dots,2$). Two are the known ones ($Z_0$, $Z_0+\Pi$). The
         other two do not close: One ray ends at a corner of $C+\Pi$, the other already after $0.065$ at an ordinary point with value $L_T$.
    worum: |
      How many Kneser-type hexations can there be? This theorem counts them via a single point: the start of their real curve. Each begins at a log point of the
      auxiliary function $F_q$, and each log point can carry at most one solution.
- id: kn.satz.hexation_struktur
  quelle_hash: af222c527991
  theorie_hash: 54138240d50d
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: '$P_b$ is strictly increasing, $P_b(x)>L_T$ and $P_b(x)\to L_T$ for $x\to-\infty$ (unbounded above for $b>\eta_4$, otherwise bounded),
        with $P_b(-2)=-1$, $P_b(-1)=0$, $P_b(0)=1$; every value in $(L_T,1]$ is attained exactly once. Hence $H(x-1)=P_b^{-1}(H(x))$ as long as
        $L_T<H(x)\le1$: $H(-1)=P_b^{-1}(1)=0$, $H(-2)=P_b^{-1}(0)=-1$, $H(-3)=P_b^{-1}(-1)=-2$. Because $H(-3)=-2<L_T<-1=H(-2)$ there is an $x_c$
        with $H(x_c)=L_T$ (intermediate value theorem); for $x\downarrow x_c$, $H(x-1)=P_b^{-1}(H(x))\to-\infty$, since $P_b(y)\to L_T$ only for
        $y\to-\infty$.'
    pruefung:
      f2_benutzte_voraussetzungen: Only continuity, monotonicity and $H(0)=1$ — holds for every increasing hexation, regular or Kneser-type.
      f5_neue_frage: Is the singularity at $s_b$ exactly logarithmic, $H(x)\approx\log_\lambda(x-s_b)$, so that $H$ stays analytic at $s_b+1$
        (like tetration at −1)?
      f3_spezialfall: Analogous to fg.kor.keine_ganze_tetration (tetration breaks off at −2 because $b^x>0$).
      f1_folgt_unmittelbar: Yes, from the range of the pentation.
      f4_uebertragbar: 'Pattern: level $n+1$ has a real singularity if and only if level $n$ is bounded below — exp (>0) → tetration singular;
        tetration (all values) → pentation smooth; pentation (>L_T) → hexation singular; hexation (all values) → heptation smooth.'
    bewertung:
      recherche: 'Correction 12.10.2026 (literature map L2): known in the forum — S. Levenstein 07.08.2017 (tid 1177, post 1): hex(−3) = −2 and
        a singularity near −3.86 for base e, because the hexation reaches the fixed point −1.85 of tetration at ≈ −2.86 (the same argument as
        here); J. D. Nixon (post 2): every analytic hyperoperation of level n satisfies f(−k) = 1−k for 0 ≤ k ≤ n−1, proof attributed to H. Trappmann;
        Levenstein (post 5): tetration and hexation have a logarithmic singularity, pentation and heptation run toward a fixed point. New here:
        the proof for every increasing hexation and the measured values s_b.'
      nutzen: Shows the switch between smooth and singular across the levels.
      richtigkeit: complete
    titel: 'Every hexation: H(−3) = −2 and a singularity between −4 and −3'
    aussage: |
      It holds that $H(-1)=0$, $H(-2)=-1$, $H(-3)=-2$. Since $P_b$ on $\mathbb R$ takes only values above $L_T$ ($L_T\in(-2,-1)$ the negative fixed point of tetration),
      there is an $x_c\in(-3,-2)$ with $H(x_c)=L_T$, and $H(x)\to-\infty$ as $x\downarrow s_b=x_c-1\in(-4,-3)$; below $s_b$ there is no real continuation.
      Measured (regular hexation): $s_{1.5}=-3.62649$, $s_{1.6}=-3.66301$, $s_{1.7}=-3.69422$.
    bereich: pentation $P_b$ from kn.konstr.pentation ($b>\eta$); $H$ a continuous, strictly increasing real solution of $H(x+1)=P_b(H(x))$, $H(0)=1$
    einfach: 'Tetration breaks off at −2, the pentation nowhere — and the hexation again, somewhere between −4 and −3. The reason is the same
      every time: whether the level below is bounded below.'
    quellen:
    - {}
    - stelle: Levenstein, posts 1 and 5 (07.08./03.09.2017); Nixon, post 2 (21.08.2017)
  en_theorie:
    beispiel: |
      Regular hexation: $s_{1.5}=-3.62649$, $s_{1.6}=-3.66301$, $s_{1.7}=-3.69422$; very close to it, at $s_b+10^{-6}$, $H$ is already about $-10.7$.
      For base 1.7: $L_T=-1.66314$, the hexation hits this value at $x_c=s_b+1=-2.69422$.
    einordnung: |
      The counterpart one level lower is [[fg.kor.keine_ganze_tetration]] (breakoff at $-2$) with the logarithm behavior from [[kn.satz.singulaer_minus2]].
      The pentation itself: [[kn.konstr.pentation]].
    genau: |
      Let $P_b$ be the pentation and $H$ an increasing hexation ($H(x+1)=P_b(H(x))$, $H(0)=1$). Then:
      - $H(-1)=0$, $H(-2)=-1$, $H(-3)=-2$.
      - There is exactly one $x_c\in(-3,-2)$ with $H(x_c)=L_T$ (the negative fixed point of tetration, about $-1.6$).
      - For $x\downarrow s_b=x_c-1$, $H(x)\to-\infty$; below $s_b$ there is no real continuation.
    warum: |
      1. **Computing backward:** From $H(x)=P_b(H(x-1))$ it follows that $H(x-1)=P_b^{-1}(H(x))$. Since $P_b(-1)=0$, $P_b(-2)=-1$ and $P_b(0)=1$, this gives $H(-1)=0$, $H(-2)=-1$, $H(-3)=-2$.
      2. **Lower bound:** For $x\to-\infty$ the pentation runs toward $L_T$ and always stays above it. It has no values below $L_T$ — so one can apply $P_b^{-1}$ only to values above $L_T$.
      3. **Intermediate value:** $H(-3)=-2$ lies below $L_T$, $H(-2)=-1$ above. In between, $H$ hits the value $L_T$ at $x_c$.
      4. **Plunge:** If $H(x)$ approaches $L_T$ from above, $P_b^{-1}(H(x))$ must go to $-\infty$, because only there does the pentation come arbitrarily close to $L_T$. Hence $H(x_c-1)=-\infty$.

      **The pattern across the levels:** $e^x>0$ is bounded below → the tetration breaks off. The tetration takes all real values on $(-2,\infty)$ → the pentation is defined
      everywhere. The pentation is bounded below (by $L_T$) → the hexation breaks off. The hexation again takes all values → a heptation would be defined everywhere.
    worum: |
      The tetration breaks off at $-2$: there it goes to $-\infty$. The pentation, by contrast, is defined on the whole real axis. And the hexation? It breaks off again —
      somewhere between $-4$ and $-3$. The reason can be said in one sentence: A level breaks off if and only if the level below is bounded below.
- id: kn.satz.hooshmand
  quelle_hash: 6acfc083f57c
  theorie_hash: 10d3a91860c8
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'Hooshmand 2006; wording after Wikipedia (en). Core: the conditions force f to be a straight line on [−1, 0].'
    pruefung:
      f2_benutzte_voraussetzungen: Monotonicity of f′ on an interval and a seam condition; no smoothness at the integer arguments.
      f5_neue_frage: Shows that real uniqueness conditions can select a non-analytic solution → br.frage.bohr_mollerup
      f3_spezialfall: Real uniqueness criterion of convexity type, like Bohr–Mollerup for Γ.
      f1_folgt_unmittelbar: 'Almost: monotone f′ on (−1,0) plus seam condition allows only a constant slope; the original has not been read.'
      f4_uebertragbar: 'Consequence for smooth solutions: Kneser for base e has its inflection point at −0.5218, i.e. in (−1, 0) (gr.beob.wendepunkte)
        — as predicted.'
    bewertung:
      nutzen: Example of a real criterion; explains why smooth solutions have an inflection point in (−1,0).
      richtigkeit: Literature; wording via secondary source (Wikipedia), original not read
    voraussetzungen:
    - text: f(x) = a^{f(x−1)} for x > −1 and f(0) = 1
    - text: f differentiable on (−1, 0), f′ monotone there
    - text: Seam condition f′(0⁺) = ln(a)·f′(0⁻) or f′(−1⁺) = f′(0⁻)
    titel: Hooshmand's uniqueness theorem for the ultra-exponential function
    aussage: |
      **First theorem.** Under these conditions $f$ is unique, namely the linear tetration $f(x)=\exp_a^{\lfloor x\rfloor+1}(\{x\})$.
      **Second theorem** (base $e$): If $f(x)=e^{f(x-1)}$, $f(0)=1$, $f$ is convex on $(-1,0)$ and $f'(0^-)\le f'(0^+)$, then $f$ is the linear tetration.
      Consequence: The linear tetration is the only solution that is convex on $(-1,\infty)$; every other sufficiently smooth solution has an **inflection point in $(-1,0)$**.
    bereich: base $0<a\ne1$, $f$ continuous on $(-2,\infty)$; second theorem for $a=e$
    versionen:
    - aenderung: Wording of the two theorems from Wikipedia entered (previously “unchecked”); inflection-point consequence added.
    quellen:
    - {}
    - stelle: Section “Linear approximation for real heights”
    - stelle: Thread “Hooshmand's extension of tetration”
  en_theorie:
    beispiel: |
      Kneser's tetration for base $e$ is smooth and not linear, so it must have an inflection point in $(-1,0)$ — it lies at $-0.5218$ ([[gr.beob.wendepunkte]]).
    einordnung: |
      Counterpart to [[kn.satz.paulsen_cowgill]], which selects Kneser with complex conditions. Lesson: A real convexity condition (as with Bohr–Mollerup
      for $\Gamma$) selects here the solution with kinks. The open question of a real condition for Kneser: [[br.frage.bohr_mollerup]].
    genau: |
      Hooshmand (2006), wording after Wikipedia (the original has not been read):
      - **First theorem.** Let $0<a\ne1$ and $f$ continuous on $(-2,\infty)$ with $f(x)=a^{f(x-1)}$ for $x>-1$, $f(0)=1$, $f$ differentiable on $(-1,0)$ with monotone $f'$ there,
        and $f'(0^+)=\ln a\cdot f'(0^-)$ (or $f'(-1^+)=f'(0^-)$). Then $f$ is the linear tetration $f(x)=\exp_a^{\lfloor x\rfloor+1}(\{x\})$.
      - **Second theorem** (base $e$). If $f(x)=e^{f(x-1)}$, $f(0)=1$, $f$ is convex on $(-1,0)$ and $f'(0^-)\le f'(0^+)$, then $f$ is the linear tetration.
      - **Consequence.** The linear tetration is the only solution convex on $(-1,\infty)$; every other sufficiently smooth solution has an inflection point in $(-1,0)$.
    warum: |
      Idea of the first theorem: On $(0,1)$, $f(x)=a^{f(x-1)}$, hence $f'(x)=\ln a\cdot f(x)\,f'(x-1)$. For $x\to0^+$ this gives $f'(0^+)=\ln a\cdot f'(-1^+)$. With the seam condition
      it follows that $f'(-1^+)=f'(0^-)$: the slope is equal at the left and at the right end of $(-1,0)$. A monotone $f'$ with equal boundary values is constant —
      $f$ is a straight line on $[-1,0]$, and the equation determines the rest.
    worum: |
      There is a theorem that, under additional conditions, selects exactly the linear tetration. It shows: Real conditions can declare a solution with
      kinks to be “the right one”.
- id: kn.satz.intuitiver_log
  quelle_hash: b717dc0a60a2
  theorie_hash: 47ad55f1cc47
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
  en:
    beweis:
      text: Trappmann, “The Intuitive Logarithm” (arXiv:1008.1409, 2010/2011).
    pruefung:
      f2_benutzte_voraussetzungen: Linear f.
      f5_neue_frage: Can the proof be transferred to b^x?
      f3_spezialfall: Yes, of the intuitive method (kn.verm.carleman_kneser) for the simplest f.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: Open for exp (kn.verm.carleman_kneser).
    bewertung:
      nutzen: The only proved case of the intuitive method; supports the Carleman conjecture.
      richtigkeit: Literature
    titel: 'TPID 9: The intuitive Abel function of x ↦ bx is exactly log_b (Trappmann 2010)'
    aussage: |
      The intuitive method (truncated Carleman systems, kn.konstr.carleman) converges for $f(x)=bx$, and the limit is the logarithm to base $b$ — independent of the
      expansion point. Equivalently (TPID 9): The sequence $a'_1=1$, $a'_n=\frac1{1-b^n}\sum_{m<n}a'_m\binom nm(1-b)^{n-m}b^m$ tends to $(b-1)/\ln b$ — slowly and fluctuating
      (base 2: distance $2\cdot10^{-4}$ at $n=10$, $2\cdot10^{-5}$ at $n=120$). This is the only case in which the convergence of the intuitive method is proved.
    einfach: 'The matrix method used to compute the super-logarithm approximately is proved correct in the simplest case — multiplication instead
      of exponentiation: It yields exactly the ordinary logarithm.'
  en_theorie:
    beispiel: |
      Base 2: $(b-1)/\ln b=1.442695\ldots$; $a'_{120}$ is off by $1.9\cdot10^{-5}$.
    einordnung: |
      Only proved case of the method from [[kn.konstr.carleman]]; supports [[kn.verm.carleman_kneser]].
    genau: |
      For $f(x)=bx$ the intuitive Abel function converges to $\log_b$ (Trappmann 2010). In numbers (TPID 9): $a'_n\to(b-1)/\ln b$.
    warum: |
      The Abel function of $bx$ is $\log_bx$ (since $\log_b(bx)=\log_bx+1$). The only question was whether the matrix method also finds it. Trappmann computed the coefficients
      of the truncated systems explicitly and showed the convergence.
    worum: |
      The intuitive (matrix) method yields approximations for the super-logarithm, but whether it converges is open for $\exp$. For the simplest function
      $x\mapsto bx$ it is proved: Exactly the logarithm comes out.
- id: kn.satz.kein_kneser_anziehend
  quelle_hash: e86880194d9a
  theorie_hash: a5c7cbdf48df
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: For every value $w=\Psi_p(s)$ (continued along a path $\gamma$) we have $f^{\circ n}(w)=\Psi_p(\mu^ns)$ along $\mu^n\gamma$; this
        path lies for large $n$ in the circle of convergence, hence $f^{\circ n}(w)\to\Psi_p(0)=p$. Every value lies in the basin of attraction
        of $p$. A real number has a real orbit and cannot run toward $p\notin\mathbb R$.
    pruefung:
      f2_benutzte_voraussetzungen: $f$ real on $\mathbb R$ and single-valued; $p$ not real, $|\mu|<1$.
      f5_neue_frage: For the pentation, is the repelling fixed point $q$ the “right” one (in the sense of a Paulsen–Cowgill uniqueness)?
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: Yes (two lines).
      f4_uebertragbar: 'Holds for every level: whoever seeks a Kneser-type hyperoperation must take repelling fixed points.'
    bewertung:
      nutzen: 'Saves a false trail (here: first prototype with jumps).'
      richtigkeit: complete
    titel: At an attracting complex fixed point there is no real Kneser construction
    aussage: |
      $\Psi_p$ (and every analytic continuation) never takes real values. Hence there is no real superfunction of the form $H(z)=F_p(z+\theta(z))$ with periodic $\theta$:
      Kneser's construction needs a **repelling** fixed point. Example: The pentation to base 2 has the attracting fixed point $p=1.79373+1.57363i$
      ($\mu=-0.02631+0.60814i$) and the repelling one $q=-1.99295+1.44513i$ ($\mu=1.36893+2.48814i$) — the hexation must be built at $q$.
      (The two fixed points were computed via the principal branch of Kneser's tetration; there the pentation is locally analytic — Taylor series and Newton converge cleanly.)
    bereich: $f$ holomorphic, real on $\mathbb R$; $p\notin\mathbb R$ attracting fixed point, $0<|\mu|<1$; $F_p(\zeta)=\Psi_p(\mu^\zeta)$ regular
      superfunction
    einfach: 'For tetration, Kneser builds the solution at a fixed point that repels. One level higher, the pentation also has an attracting complex
      fixed point — but that does not work there: everything built there stays inside the basin of attraction of this point, and no real number
      lies in it.'
  en_theorie:
    beispiel: |
      Pentation to base 2: $p=1.7937303432+1.5736302435\,i$ with $\mu=-0.0263+0.6081\,i$ ($|\mu|=0.61$, attracting) and $q=-1.9929484359+1.4451284966\,i$ with
      $\mu=1.3689+2.4881\,i$ ($|\mu|=2.84$, repelling). A first attempt at $p$ produced jumping values — the theorem explains why; at $q$ everything is smooth.
    einordnung: |
      For the tetration the Kneser fixed point $L$ is repelling ([[fp.satz.abstossend]]), so the condition never stood out there. How things continue at $q$: [[kn.frage.hexation_kneser]].
    genau: |
      If $f$ is real on $\mathbb R$ and $p$ is a non-real attracting fixed point ($|f'(p)|<1$), then the regular superfunction $F_p(\zeta)=\Psi_p(\mu^\zeta)$ — and each of its
      continuations — never takes a real value. A real solution $H=F_p\circ(\mathrm{id}+\theta)$ therefore does not exist.
    warum: |
      1. Take a value $w=\Psi_p(s)$. Applying $f$ $n$ times turns it into $\Psi_p(\mu^ns)$ — and since $|\mu|<1$, $\mu^ns\to0$, hence $f^{\circ n}(w)\to\Psi_p(0)=p$.
      2. So every value of $\Psi_p$ lies in the basin of attraction of $p$.
      3. A real number stays real under $f$; its orbit cannot run toward the non-real point $p$. So no value of $\Psi_p$ is real.
    worum: |
      Kneser's trick for the tetration: build a superfunction at a complex fixed point and then bend it so that it becomes real on the real axis. For the pentation
      to base 2 there is a complex fixed point near the real axis — but it **attracts**. And at an attracting fixed point the trick never works.
- id: kn.satz.kneser_e_zertifiziert
  quelle_hash: 69570b2eac73
  theorie_hash: e59e9cdb51c8
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        1. Data from our own Cousin–Newton method (start from the Kneser engine), residuals $2\cdot10^{-31}\to5\cdot10^{-169}$.
        2. Defects of band and seam enclosed with Taylor models and the maximum principle ($\le6.5\cdot10^{-173}$); from them a smooth function $F_0$ that satisfies the functional equation exactly.
        3. A quasiconformal smoothing (Beltrami coefficient $\le1.3\cdot10^{-171}$; Ahlfors–Bers, Stoilow) leads to an exact solution; identification with Kneser via Paulsen–Cowgill.
        4. Coefficients from 4096 Krawczyk evaluations and DFT with an aliasing bound; the remainder bound by six-fold integration by parts on $|z|=\rho$ with enclosed $\partial_\theta^6f_K$.
      luecken:
      - Three formal gaps with no effect on the numbers (error budget in check B, a Lipschitz bound, branch fidelity of the DFT nodes), named
        in phase3/v_pruefstand/BERICHT §1.1.
    pruefung:
      f2_benutzte_voraussetzungen: Ahlfors–Bers, Stoilow, an L⁴ bound for the Beurling transform, Paulsen–Cowgill (uniqueness).
      f5_neue_frage: Enclosures for other bases and for fractional iterates in general.
      f3_spezialfall: Scheme “approximate solution + defect bound + quasiconformal correction”.
      f1_folgt_unmittelbar: No; computer-assisted existence and enclosure proof with smoothing.
      f4_uebertragbar: To other bases b > η with the same program chain.
    bewertung:
      recherche: So far only numerical values (Paulsen–Cowgill, forum, Kouznetsov); no enclosure with a guarantee found.
      nutzen: Makes the starting condition and all Kneser inputs of the polynomial main theorem rigorous.
      richtigkeit: proved with computer assistance (strand P), steps cross-read by strand V; remainder bound (K2) built by V and cross-read by
        K
    titel: 'Kneser''s tetration to base e certified by computer assistance: values to 1e-168, half-exponential function with coefficients and
      remainder bound'
    aussage: |
      (i) **Values:** $\operatorname{sexp}_K=\tilde T\pm1.3\cdot10^{-168}$ for $|\operatorname{Im}z|\le0.45$ ($\tilde T$ a real polynomial of degree 519) and $\operatorname{sexp}_K=\tilde U\pm1.3\cdot10^{-168}$
      for $\operatorname{Im}z\ge0.35$ ($\tilde U=P(L^{z+\tilde\theta})$ with 241 Fourier modes); above $\operatorname{Im}z=0.36$ Kneser's structure function $\theta_K$ is also enclosed to $4.4\cdot10^{-167}$.

      (ii) **Half-e function:** $a_0,\dots,a_{640}$ with error$\cdot\rho^k\le2.9\cdot10^{-127}$; for **all** $k$ we have $|a_k|\rho^k\le461.36\,k^{-6}$; moreover $f_K(L)=L$ and $f_K'(L)=\sqrt L$.
    bereich: Kneser sexp to base $e$ on the strip $-\tfrac12\le\operatorname{Re}z\le\tfrac12$; $f_K=T_e(\operatorname{slog}x+\tfrac12)$ with Taylor
      coefficients $a_k$ about 0, $\rho=|L|$
    einfach: Kneser's solution to base e is no longer merely “computed very accurately”, but known with a guaranteed error bound — to 168 digits.
      For the half-exponential function the first 641 coefficients are available with a guarantee, together with a proved bound for all the others.
    quellen:
    - stelle: ARCHITEKTUR.md §9.8–§9.9 (Theorem P-V, p26–p32a); phase3/v_pruefstand/BERICHT §1.1, §2.2 (K2)
    - {}
  en_theorie:
    beispiel: |
      From the 641 coefficients: $\sum a_k=f_K(1)=T_e(\tfrac12)=1.646354233751194580971924031\ldots$ The largest of the quantities $|a_k|\rho^kk^6$ for $k\le640$ is $55.5$ (at $k=9$),
      far below the proved bound $461.36$.
    einordnung: |
      Supplies the Kneser inputs for [[kn.satz.polynom_zweig_400]] and [[kn.satz.polynom_hauptsatz_kr0]]. The structure at $L$ comes from [[kn.satz.halbexp_singularitaet_L]].
    genau: |
      Values of $\operatorname{sexp}_K$ to base $e$ to within $1.3\cdot10^{-168}$, the coefficients $a_0,\dots,a_{640}$ of the half-exponential function with guarantee, a bound $|a_k|\rho^k\le461.36\,k^{-6}$
      for all $k$, and $f_K(L)=L$, $f_K'(L)=\sqrt L$.
    warum: |
      1. A very accurate approximate solution is built such that its errors in the functional equation (in a band and at a seam) are provably tiny.
      2. From these errors one makes a smooth but non-holomorphic function that satisfies the equation exactly.
      3. A quasiconformal map bends it into a genuine holomorphic solution; its distance from the approximation is as small as the Beltrami coefficient, hence $\approx10^{-171}$.
      4. Since by Paulsen–Cowgill there is only one solution of this kind, it is Kneser's.
    worum: |
      Until now Kneser's tetration was known only as “computed very accurately”. For a proof one needs more: values with a guaranteed error bound.
- id: kn.satz.kneser_eigenschaften
  quelle_hash: 311176b4f18f
  theorie_hash: 28ea59034b39
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Kouznetsov 2009, Paulsen–Cowgill 2017.
    pruefung:
      f2_benutzte_voraussetzungen: The exact origin of each partial statement not checked against the original.
      f5_neue_frage: These properties characterize the solution → kn.satz.paulsen_cowgill
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: Complex bases with adapted branch cut (Paulsen 2019).
    bewertung:
      nutzen: Supplies the uniqueness conditions.
      richtigkeit: established (literature), detailed attribution unchecked
    voraussetzungen:
    - text: T = Kneser solution for base b > η
    titel: Complex properties of Kneser's tetration
    aussage: |
      $T_b^{\mathrm K}$ is holomorphic on $\mathbb C\setminus(-\infty,-2]$, satisfies $T(\bar z)=\overline{T(z)}$ and
      $T(x+iy)\to L$ as $y\to+\infty$, $\to\bar L$ as $y\to-\infty$ (for every fixed $x>-2$).
    bereich: $b>\eta$
    quellen:
    - {}
    - stelle: 'zbMATH review: analytic except for singularities at the integers < −1 and a branch cut left of −2; F(iy) → L along the imaginary
        axis'
  en_theorie:
    beispiel: |
      Base $e$, height $\tfrac12+iy$: the distance $|T_e(\tfrac12+iy)-L|$ is $1.30$, $0.79$, $0.23$, $0.016$ for $y=\tfrac12,1,2,4$. It shrinks like $e^{-y\arg\lambda}$
      with $\arg\lambda=1.337$: from $y=2$ to $y=4$ by the factor $0.069$.
    einordnung: |
      Exactly these properties make the solution unique ([[kn.satz.paulsen_cowgill]]). The base change in the vertical direction uses them
      ([[bw.satz.imaginaere_richtung]]); in Paper V/VI they appear as assumption [[bw.ann.K1K2]].
    genau: |
      $T_b^{\mathrm K}$ is holomorphic on $\mathbb C\setminus(-\infty,-2]$, satisfies $T(\bar z)=\overline{T(z)}$, and for every fixed $x>-2$ one has
      $T(x+iy)\to L$ for $y\to+\infty$ and $T(x+iy)\to\bar L$ for $y\to-\infty$.
    warum: |
      Theorem from the literature (Kouznetsov 2009, Paulsen–Cowgill 2017); the parts are explained by the construction:
      1. Holomorphic: $\operatorname{slog}=\chi+\theta_K(\chi)$ is holomorphic and invertible; the inverse can be continued to the right with $T(z+1)=b^{T(z)}$.
      2. Branch cut: The logarithmic singularity sits at $-2$ ([[kn.satz.singulaer_minus2]]); further left it repeats, which is why the half-line $(-\infty,-2]$ is missing.
      3. Reflection: $T$ is real on the real axis; by the reflection principle $T(\bar z)=\overline{T(z)}$ follows.
      4. Limits: Above, $\theta_K$ is almost constant, so $T$ behaves there like the regular solution at $L$, and that runs into $L$ for $\operatorname{Im}\to+\infty$.
    worum: |
      Kneser's tetration does not live only on the real axis. If one allows complex heights, it is holomorphic almost everywhere, mirror-symmetric,
      and runs into the fixed point $L$ upward, into $\bar L$ downward.
- id: kn.satz.kritische_rate
  quelle_hash: 3537cde20853
  theorie_hash: 097217f35cf4
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: At the limit base the next level creeps toward e_r like 1/(β k)
    aussage: |
      $$k\,\bigl(e_r-H_{r+1}(\eta_r,k)\bigr)\to\frac1{\beta_r},\qquad \beta_r=\tfrac12\,\partial_x^2H_r(\eta_r,e_r).$$
      Numerically $\beta_7\approx0.4961476452$, $\beta_8\approx0.5368242374$. Just above $\eta_r$ the next level therefore needs very many steps before it runs away;
      finite iterations separate the threshold poorly. Locally: below $\eta_r$ there are two fixed points at distance $\approx\sqrt{\alpha(\eta_r-b)/\beta}$ from $e_r$ ($\alpha=\partial_bH_r$).
    einfach: Exactly at the limit base, the next hyperoperation approaches the touching point only very slowly — the distance shrinks like 1 divided
      by the number of steps.
    beweis:
      text: '$t_k=e_r-y_k$: $t_{k+1}=t_k-\beta t_k^2+O(t_k^3)$, hence $1/t_{k+1}-1/t_k\to\beta$; telescoping and Cesàro give $1/(kt_k)\to\beta$.'
    pruefung:
      f1_folgt_unmittelbar: Yes (parabolic fixed point, standard computation).
      f2_benutzte_voraussetzungen: Convergence from below and nondegeneracy β > 0; the values β₇, β₈ are numerical.
      f3_spezialfall: 'Yes: Leau–Fatou rate at a parabolic fixed point (it.satz.parabolische_rate), as for the η tower.'
      f4_uebertragbar: Bottleneck time just above η_r ≈ π/√(αβ(b−η_r)) — only as a heuristic.
      f5_neue_frage: Does the boundary law (bw.lem.randgesetz) hold with a constant for every level?
    bewertung:
      nutzen: Explains why thresholds from finite iterations are inaccurate.
      richtigkeit: complete under the hypotheses; β numerical
    voraussetzungen:
    - text: F = H_r(η_r,·) is C³ at e_r with F(e_r) = e_r, F′(e_r) = 1, β = F″(e_r)/2 > 0
    - text: H_{r+1}(η_r,k) converges to e_r from below
    quellen:
    - stelle: forschung/eta_hyperoperationen/MATHEMATIK.md §5 (Satz M3)
  en_theorie:
    beispiel: |
      $r=3$: the tower $\eta\uparrow\uparrow k$ approaches $e$ like $2e/k$ ($\beta=1/(2e)$).
    einordnung: |
      General version: [[it.satz.parabolische_rate]].
    genau: |
      $e_r-H_{r+1}(\eta_r,k)\sim1/(\beta_rk)$ with $\beta_r=\tfrac12\partial_x^2H_r(\eta_r,e_r)$.
    warum: |
      At the touching point the multiplier is 1; the distance $t$ shrinks per step only by $\beta t^2$, as at any parabolic fixed point.
    worum: |
      Exactly at the limit base the next level runs very slowly toward the touching point.
- id: kn.satz.linear_glatt
  quelle_hash: 36345b80f757
  theorie_hash: 310fb5258cec
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: On $(0,1]$, $T(x)=b^{x}$, hence $T'(0^+)=\ln b$, $T''(0^+)=\ln^2 b$.
    pruefung:
      f2_benutzte_voraussetzungen: Only the definition.
      f5_neue_frage: How does the seam show up in the base-change phases? (bw.satz.fourier_naht)
      f3_spezialfall: 'Paper IV Prop. 4.1: $C^m$ seams ⇒ Fourier decay $k^{-(m+2)}$ — the linear tetration is the test object with $m=0$ (respectively
        1 for $b=e$).'
      f1_folgt_unmittelbar: Yes.
      f4_uebertragbar: 'Analogously: every piecewise defined construction has finite smoothness, as long as the seam conditions are not satisfied
        to all orders (Walker: all orders).'
    bewertung:
      recherche: 'Literature map 12.10.2026: Wikipedia (Tetration, section linear approximation): continuously differentiable for x > −2 exactly
        for base e, not twice differentiable there.'
      nutzen: 'Counterexample: monotonicity + C¹ do not suffice for uniqueness or smoothness.'
      richtigkeit: complete
    titel: Linear tetration is continuously differentiable exactly for b = e, never C²
    aussage: |
      $T'(0^-)=1$, $T'(0^+)=\ln b$: $C^1$ exactly for $b=e$. For $b=e$, $T''(0^-)=0\ne1=T''(0^+)$, hence never $C^2$.
    bereich: linear tetration, $b>1$
    quellen:
    - {}
    - stelle: Section “Linear approximation for real heights”
  en_theorie:
    beispiel: |
      Base $2$: slope $1$ on the left, $0.693$ on the right — a visible kink. Base $e$: smooth at first glance, only the curvature jumps from $0$ to $1$.
    einordnung: |
      So monotonicity and $C^1$ suffice neither for smoothness nor for uniqueness. Consequence for the Fourier modes: [[bw.satz.fourier_naht]]. Smooth in all
      orders: [[kn.konstr.walker]].
    genau: |
      $T'(0^-)=1$ and $T'(0^+)=\ln b$: continuously differentiable exactly for $b=e$. For $b=e$, $T''(0^-)=0\ne1=T''(0^+)$, hence never $C^2$.
    warum: |
      To the left of $0$, $T$ is the line $x+1$: slope $1$, curvature $0$. To the right, $T(x)=b^x$: slope $\ln b$, curvature $\ln^2b$. Equal slope means
      $\ln b=1$, i.e. $b=e$; then the curvature is $1$ on the right, $0$ on the left.
    worum: |
      The kinks of the linear tetration can be removed only for base $e$, and even there only in the first derivative. The second always jumps.
- id: kn.satz.paulsen_cowgill
  quelle_hash: f36c8ec7c7d2
  theorie_hash: be2856b8f060
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'Paulsen–Cowgill 2017, Prop. 2. Mechanism: $F_2=F_1\circ(\mathrm{id}+\theta)$, θ periodic, and the limits force θ to be bounded in
        both half-planes.'
    pruefung:
      f2_benutzte_voraussetzungen: Both limits; holomorphy only on the half-plane, not on the slit plane.
      f5_neue_frage: Is there a real characterization? → br.frage.bohr_mollerup
      f3_spezialfall: Related to Trappmann–Kouznetsov (Abel functions at pairs of fixed points).
      f1_folgt_unmittelbar: Core yes (fg.lem.periodisch_liouville); technically one has to show that $F_1^{-1}\circ F_2$ is defined on a strip.
      f4_uebertragbar: To complex bases (Paulsen 2019); used in Paper V/VI as an identification tool (bw.satz.zertifikat_kette).
    bewertung:
      nutzen: Makes “the” Kneser tetration well defined.
      richtigkeit: established (literature)
    voraussetzungen:
    - text: F_1, F_2 holomorphic on Re z > −2
    - text: F_j(z+1) = b^{F_j(z)} and F_j(0) = 1
    - text: 'for every x > −2: F_j(x+iy) → L as y → +∞ and → L̄ as y → −∞'
      notiz: both vertical limits are a hypothesis; conjugation symmetry does not replace the lower one
    titel: Uniqueness (Paulsen–Cowgill, Prop. 2)
    aussage: Then $F_1=F_2$ on $H_{-2}$. Kneser's solution satisfies the conditions, hence is the only such one.
    bereich: $b>\eta$, $H_{-2}=\{\operatorname{Re}z>-2\}$
    quellen:
    - stelle: 'Prop. 2; Abstract (repository arch.astate.edu): natural conditions force Kneser''s solution, “answers a conjecture of Trappmann
        and Kouznetsov” (cf. kn.verm.tk_c2)'
    - stelle: Thm. 11.11 (restatement)
    - stelle: 'Nixon, post 21 (23.08.2021): restated as holomorphic on ℂ minus (−∞, −2], F(0) = 1, real-symmetric, F(x+iy) → L for y → +∞ — a
        different version from Paper VI (half-plane, both limits)'
  en_theorie:
    beispiel: |
      Without the vertical conditions there are many solutions. For base $\sqrt2$, [[exp.nichteindeutigkeit]] shows, besides the regular one ($T(\tfrac12)=1.24362$),
      two further real-analytic, increasing solutions with $T(\tfrac12)=1.15$ and $1.30$. They arise with $\theta(x)=c\sin(2\pi x)$ — and
      $\theta(x+iy)$ grows like $e^{2\pi|y|}$.
    einordnung: |
      A second justification: [[kn.satz.trappmann_kouznetsov]]. The same mode argument carries the uniqueness of the base kernel
      ([[bw.satz.kern_eindeutig]]) and the conclusion in [[bw.satz.ursache_kozykel]]. A purely real characterization is sought ([[br.frage.bohr_mollerup]]).
    genau: |
      Let $b>\eta$. If $F_1,F_2$ are holomorphic on $\{\operatorname{Re}z>-2\}$, satisfy $F_j(z+1)=b^{F_j(z)}$, $F_j(0)=1$, and for every $x>-2$ one has
      $F_j(x+iy)\to L$ ($y\to+\infty$) and $F_j(x+iy)\to\bar L$ ($y\to-\infty$), then $F_1=F_2$.
    warum: |
      1. Two solutions differ by a translation: $F_2=F_1\circ(\mathrm{id}+\theta)$ with 1-periodic $\theta$ ([[fg.satz.allgemeine_loesung]];
         the technical part is that $F_1^{-1}\circ F_2$ is defined on a whole strip).
      2. A periodic holomorphic $\theta$ is a Fourier series $\sum a_ke^{2\pi ikz}$. A term with $k<0$ grows upward like $e^{2\pi|k|y}$, one with $k>0$ downward.
      3. If $\theta$ grew upward, $z+\theta(z)$ would run away and $F_2$ could not settle down at $L$. So $\theta$ is bounded above and below.
      4. A bounded periodic entire $\theta$ is constant ([[fg.lem.periodisch_liouville]]); $F(0)=1$ gives $\theta=0$.
    worum: |
      Why does one speak of “the” Kneser tetration? Because it is the only holomorphic solution that settles down in the vertical direction:
      upward at $L$, downward at $\bar L$. Every other solution oscillates ever more strongly in one of the two directions.
- id: kn.satz.paulsen_komplex
  quelle_hash: 3b3800b4bb39
  theorie_hash: bf97970e6538
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Paulsen 2019.
    pruefung:
      f2_benutzte_voraussetzungen: To be checked against the original (which bases exactly, and whether holomorphy in b is shown).
      f5_neue_frage: Base derivative $\partial_\beta\operatorname{slog}_b$ is well defined → bw.satz.antwortkern
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      nutzen: Supports the perturbation theory in the base — provided holomorphy in b is confirmed.
      richtigkeit: Continuation and uniqueness for complex bases established (abstract); holomorphy in b not substantiated; scope unchecked
    voraussetzungen:
    - text: Base in the domain of validity of Paulsen 2019 (not checked against the original)
    titel: Tetration for complex bases (Paulsen 2019) — holomorphy in the base not substantiated
    aussage: |
      Paulsen (2019) transfers the uniqueness conditions of Paulsen–Cowgill to complex bases and gives iteration methods for bases inside and
      outside the Shell–Thron region (abstract). **Not substantiated:** that the solution depends holomorphically on $b$ — the abstract does not mention it, the full text was
      not accessible (check of 12.10.2026). Paper V uses holomorphy in $b$ as (K3) for the identification $V=\partial_\beta A_b$; this support is therefore open.
    bereich: complex bases outside an exceptional region
    quellen:
    - stelle: 'Abstract (publisher page, via search hit): uniqueness conditions for complex bases, iteration methods inside and outside Shell–Thron'
  en_theorie:
    beispiel: |
      The derivative with respect to the base, $\partial_bT_b(x)$, would thereby be defined; in the base change it is called the “response” and is computed in Chapter 7.
    einordnung: |
      Supports the perturbation theory in the base ([[bw.ann.basis_diffbar]], [[bw.satz.antwortkern]]) and the identification in Paper V
      ([[bw.satz.kern_existenz]]). Complex bases with their addresses: [[bw.verm.adressen]].
    genau: |
      For complex bases outside an exceptional region, Kneser's construction can be continued. That $T_b(z)$ depends holomorphically on $b$ is not stated in the abstract;
      the full text was not accessible. (Which bases exactly are excluded is still to be checked against the original.)
    warum: |
      Theorem from the literature (Paulsen 2019). Why one expects holomorphy in $b$: All ingredients — the fixed point $L(b)$, its multiplier $\lambda(b)$, the Schröder function and the
      Riemann map — depend analytically on $b$, as long as $L$ stays repelling and separated from $\bar L$. A proof is not available here.
    worum: |
      Kneser's construction does not need a real base. Paulsen has shown that it also works for complex bases. Whether the solution
      even depends holomorphically on the base is not established by this; that would allow differentiating with respect to the base.
- id: kn.satz.polynom_approximation_ecke
  quelle_hash: d57d03e2f1fc
  theorie_hash: e0973b5cab11
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        Theorem 2 of Andrievskii–Pritsker–Varga (approximation on quasidisks, $|f-p_n|\le c\,\rho_{1/n}^{r}\,\omega(\rho_{1/n})$) with $r=5$; $f_K\in C^{5,0.417}(E)$ from the structure at $L$
        (exponent $5.447$, loss $0.030$ due to the sheet rotation); at the spiral corner $\rho_{1/N}(L)\asymp N^{-\alpha_E}$.
      luecken:
      - That E is a quasidisk (Jordan domain, three-point condition, opening) is checked only numerically on a grid (cubic and f_K).
    pruefung:
      f2_benutzte_voraussetzungen: Andrievskii–Pritsker–Varga Theorem 2; structure of f_K at L.
      f5_neue_frage: Rigorous proof of the quasidisk geometry.
      f3_spezialfall: Dzyadyk-type theorems of constructive function theory.
      f1_folgt_unmittelbar: 'Almost: application of a known theorem; the work lies in smoothness and geometry.'
      f4_uebertragbar: Other bases, other corner openings (exponent 5.417·α_E).
    bewertung:
      nutzen: Data side of the conditional main theorem.
      richtigkeit: Theorem read in the original (strand K); geometry numerical; synthetic test 3.37/3.97/5.02 against 3.36/3.96/5.02; measured
        3.9–4.1
    titel: 'How well polynomials approximate Kneser''s half-exponential function up to the corner: rate N^{−3.96}'
    aussage: |
      $\operatorname{dist}_E(f_K,\mathcal P_N)\le C_E\,N^{-5.417\,\alpha_E}$, for the standard window thus $N^{-3.96}$.
    bereich: $E\supset\bar D\setminus U_{r_0}(L,\bar L)$ a compact set with a spiral corner at $L$ (exterior opening $\Theta=131.7^\circ$, $\alpha_E=\Theta/\pi$);
      $\mathcal P_N$ polynomials of degree $\le N$
    einfach: 'Kneser''s half-exponential function can be approximated very well by polynomials on the domain that the proof needs: the error falls
      like N to the power minus four.'
    quellen:
    - stelle: Thm. 2
    - stelle: phase3/k_kern/BERICHT §35–§36; phase3/v_pruefstand/BERICHT §3.19, §3.23
  en_theorie:
    beispiel: |
      Prediction for three corner openings $3.36$, $3.96$, $5.02$; measured on a test function $3.37$, $3.97$, $5.02$; on $f_K$ itself $3.9$–$4.1$.
    einordnung: |
      The data side of [[kn.satz.polynom_hauptsatz_kr0]]: The faster this rate, the more room remains for the core.
    genau: |
      The error falls like $N^{-5.417\alpha_E}$, for the standard domain like $N^{-3.96}$.
    warum: |
      1. A theorem of Andrievskii–Pritsker–Varga says: On a quasidisk the error is as small as the smoothness of the function, measured at the distance of the level curve $1+1/N$ of the Green's function.
      2. $f_K$ is five times continuously differentiable at the boundary with Hölder remainder $0.417$ (because of the exponent $5.447$ at $L$).
      3. At the corner with opening $\Theta$ the level curve lies at distance $N^{-\Theta/\pi}$; together $N^{-5.417\Theta/\pi}$.
    worum: |
      One part of the proof asks only: How well can a polynomial of degree $N$ approximate Kneser's half-exponential function on the relevant domain?
- id: kn.satz.polynom_cd_identitaet
  quelle_hash: 8de541d33e21
  theorie_hash: 1970ebb28953
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: |
        The first-order shift of the composition channel: $JS-SJ=T_nM_{f-x}C_f-(T_nf^{n+1})e_n^{\mathsf T}$. For $X=J_n^{-1}$ it follows that $SX-XS=X(JS-SJ)X$; evaluated between the generating functions
        $e(z)$ and $\hat e(t)$, the second term gives the head pair, the boundary term $\nu_n$, and the composition part the Dyson term as a contour integral.
    pruefung:
      f2_benutzte_voraussetzungen: Holomorphy of f and m about 0; for f_K the contour form holds only on circles |s| < ρ.
      f5_neue_frage: Estimate of the Dyson term; a contraction for it fails (spectral radius > 1 from n ≈ 58 on).
      f3_spezialfall: Christoffel–Darboux / Gohberg–Semencul for Toeplitz inverses (case f(s) = s).
      f1_folgt_unmittelbar: 'Almost: it is the commutator formula for inverses, evaluated with the explicit composition commutator.'
      f4_uebertragbar: Every weighted composition.
    bewertung:
      recherche: CD formulas for composition operators not found.
      nutzen: Exact representation of the whole kernel by a few objects.
      richtigkeit: proved; confirmed with two independent programs to 1e-176 and 2e-89, respectively (cubic and Kneser)
    titel: Christoffel–Darboux formula for the truncated equations with composition
    aussage: |
      $$(z-t)\,K_n(z,t)=q_{n+1}(z)\,\lambda_n(t)-t\,\nu_n(z)+\Xi_n(z,t),\qquad \Xi_n(z,t)=\frac1{2\pi i}\oint K_n(z,s)\,(f(s)-s)\,K_n(f(s),t)\,\frac{ds}{s}.$$
      Without composition ($f(s)=s$) the classical Christoffel–Darboux formula for Toeplitz inverses remains. The Dyson term $\Xi_n$ vanishes at the fixed points. At the bridge the product
      $m\,q_{n+1}\lambda_n/t$ is independent of $n$ (e.g. $1.03968$ at $180^\circ$).
    bereich: $J_n=T_nJ_\infty|_{P_n}$ with $J_\infty u=u\circ f+m\,u$ ($f$ holomorphic about 0, $f(0)\ne0$); $K_n(z,t)$ the kernel of $J_n^{-1}$,
      $q_{n+1}$ primal head, $\lambda_n$ adjoint head, $\nu_n=J_n^{-1}\mathbf 1$
    einfach: 'For the inverse of the equation matrix there is an exact formula like the one for orthogonal polynomials: it consists of a single
      pair of building blocks, a smooth part and an additional term that comes from the composition p(p(x)).'
    quellen:
    - stelle: phase3/k_kern/BERICHT §39–§41; phase3/v_pruefstand/BERICHT §1.13
  en_theorie:
    beispiel: |
      Without composition ($f(s)=s$) $\Xi_n$ vanishes, and the known formula for Toeplitz inverses remains. With composition the formula is verified to $10^{-176}$; at the bridge
      $m\,q_{n+1}\lambda_n/t=1.03968$ at $180^\circ$, independent of the degree.
    einordnung: |
      Exact, but no tool for bounds: a contraction of the Dyson term fails ([[kn.gescheitert.polynom_ecke_wege]], approach 6).
    genau: |
      $(z-t)K_n(z,t)=q_{n+1}(z)\lambda_n(t)-t\nu_n(z)+\Xi_n(z,t)$ with the Dyson term $\Xi_n=\frac1{2\pi i}\oint K_n(z,s)(f(s)-s)K_n(f(s),t)\,ds/s$.
    warum: |
      1. For the inverse $X$ of a matrix $J$ we have $SX-XS=X(JS-SJ)X$ — one line of algebra.
      2. For composition the commutator $JS-SJ$ can be computed: a boundary term plus the multiplication by $f(x)-x$.
      3. Inserting this into the generating functions, the boundary term becomes the head pair and the rest the Dyson integral.
    worum: |
      For orthogonal polynomials there is the famous Christoffel–Darboux formula: The whole sum over all polynomials can be expressed by the last two. Is there something like that here?
- id: kn.satz.polynom_eckprofil
  quelle_hash: 969582394bd5
  theorie_hash: fb7fb7f0be87
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        Mellin transform makes the limit problem diagonal; the factor $1+\mu^{s-2}$ splits via the reflection formula into gamma functions (Malyuzhinets factor $\Gamma(\tfrac12+i\alpha(s-2))$);
        existence by inverse transformation, uniqueness via Liouville under the Mellin boundary condition; the integral representation by interchanging series and integral.
      luecken:
      - Lemma K12 (translation of the Mellin boundary condition into sector conditions) only sketched.
      - That the true heads converge to the limit solution is measured, not proved; likewise the formula for C (fit to the outer solution).
    pruefung:
      f2_benutzte_voraussetzungen: Only the local form of f at L (L, μ = √L).
      f5_neue_frage: Matching to the global solution with error bounds (the open core).
      f3_spezialfall: Malyuzhinets factor of wedge diffraction; Stokes structure of a turning point.
      f1_folgt_unmittelbar: No; Mellin–Wiener–Hopf with explicit factor.
      f4_uebertragbar: 'Every base: α = log μ/(2π) with the respective multiplier.'
    bewertung:
      recherche: Malyuzhinets functions are known from diffraction theory; their role for sections of composition operators not found.
      nutzen: Explicit local parametrix for every proof route at the corner.
      richtigkeit: Limit problem proved up to Lemma K12 (cross-read by V); convergence of the true heads numerical
    titel: 'The corner at L in closed form: limit profiles as gamma series with the exponent L/(4π)'
    aussage: |
      With $F_\beta(u)=\sum_{k\ge0}\Gamma(\beta-i\alpha k)(-u)^k/(k!\,\Gamma(\beta))=\Gamma(\beta)^{-1}\int_0^\infty t^{\beta-1}e^{-t-u\,t^{-i\alpha}}dt$:
      (i) **proved up to Lemma K12:** the limit problem at the corner (Mellin–Wiener–Hopf with the factor $1+\mu^{s-2}$, $\mu=\sqrt L$) has the solutions $F_{\beta_A}$, $\beta_A=\tfrac12-2i\alpha$ (adjoint), and
      $F_{\beta_P}$, $\beta_P=\tfrac12+i\alpha$ (primal), with $\lambda_P=-\mu^{-1/2}\lambda_A$; under a Mellin boundary condition they are unique.
      (ii) **measured:** the true heads converge like $n^{-0.894}$ to these profiles (G's corner profile matched to $2.5\cdot10^{-7}$ with one parameter); the corner product follows
      $K_n(L,L)\approx C\,L/d_n$ with $C=-\tilde\lambda_P\Gamma(\tfrac12+i\alpha)/((\mu+\mu^{-1})\Gamma(\tfrac12+2i\alpha))=-0.010118-0.598298i$ (measured $-0.01012-0.59830i$).
    bereich: Rank-1 building blocks (“heads”) of the inverse $J_n^{-1}$ near $L$ on the scale $d_n=\rho n^{-a}$, $a=1/\kappa_1=1-L/(4\pi i)=0.89359+0.02532i$;
      $\alpha=L/(4\pi)$
    einfach: 'The behavior of the equations very close to the fixed point L can be written down in formulas: they are series of gamma functions
      in which only the number L/(4π) occurs — a consequence of log L = L. The computations match these formulas to seven digits.'
    formen:
    - notiz: because log L = L, log μ = L/2
    quellen:
    - stelle: phase3/k_kern/BERICHT §18–§19, §24–§25, §27.3; phase3/v_pruefstand/BERICHT §1.9–1.10, §1.12, §3.17
  en_theorie:
    beispiel: |
      The corner profile measured at GPT is matched to $2.5\cdot10^{-7}$ with a single scale parameter $\lambda=-0.203297-1.406007i$; the constant of the corner product
      $C=-0.010118-0.598298i$ (formula) against $-0.01012-0.59830i$ (measured).
    einordnung: |
      The exponents fit Kneser's singularity at $L$ ([[kn.satz.halbexp_singularitaet_L]]). Only the corner is explicit; the connection to the rest is the open core [[kn.verm.polynom_halbexp_kern]].
    genau: |
      Limit profiles $F_\beta(u)=\sum\Gamma(\beta-i\alpha k)(-u)^k/(k!\Gamma(\beta))$ with $\alpha=L/(4\pi)$, $\beta_A=\tfrac12-2i\alpha$ and $\beta_P=\tfrac12+i\alpha$; scale $n^{-a}$ with
      $a=1-L/(4\pi i)$.
    warum: |
      1. Near $L$, $f$ is almost a scaling by $\mu=\sqrt L$. The equations then become diagonal in the Mellin variable: the problem turns into a factor $1+\mu^{s-2}$.
      2. This factor splits via the reflection formula into gamma functions; because $\log L=L$ we have $\log\mu=L/2$, hence the $\alpha=L/(4\pi)$.
      3. Transformed back, the series $F_\beta$ result; with a boundary condition in the Mellin image the solution is unique.
    worum: |
      What exactly happens in the equations very close to the fixed point $L$? One can compute it — in formulas made of gamma functions.
- id: kn.satz.polynom_halbexp_endlich
  quelle_hash: 536e2e05ef25
  theorie_hash: 32c5e88445be
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: |
        Computer-assisted with ball arithmetic (arb, 600 bit). Krawczyk test: With $C\approx J(\tilde a)^{-1}$ and the box $X$,
        $K(X)=\tilde a-CF(\tilde a)+(I-CJ(X))(X-\tilde a)$; if $K(X)$ lies in the interior of $X$, then $F$ has exactly one zero in $X$. The test succeeds for every $N=1,\dots,120$.

        The bound follows from $|p_N(x)|\le\sum|a_k||x|^k$ with the upper limits of the balls. For $N=1,2,3,5,40,120$: $1.875$, $2.200$, $2.233$, $2.2393$, $2.24047$, $2.24047$.
    pruefung:
      f2_benutzte_voraussetzungen: Only the polynomial equations; no Kneser values.
      f5_neue_frage: An argument that covers all N > N₀ at once (kn.gescheitert.polynom_kantorovich shows why this is not simple).
      f3_spezialfall: Standard method of computer-assisted proofs (interval Newton).
      f1_folgt_unmittelbar: Yes, from the Krawczyk criterion; the effort lies in the computation.
      f4_uebertragbar: To each $N$ individually, as long as the working precision grows with the condition number (factor ≈ 1.9 per degree); not
        to all $N$ at once.
    bewertung:
      recherche: 'Forum mirror (all 1265 threads) searched for f(f(x)) = exp(x) with polynomial/coefficients/truncation: only related methods
        (tid 228 hump trick, tid 842 matrix root), not this one.'
      nutzen: Secures the numbers and shows that the bound lies at 2.2405.
      richtigkeit: rigorous (ball arithmetic), for N ≤ 120
    titel: 'For all degrees N ≤ 120, rigorously: the polynomial root exists, is unique in its box and stays below 2.2405 on |x| ≤ |L|'
    aussage: |
      For every $N\le120$ there is in the box $\{a:|a_k-\tilde a_k|\le2^{-250}|L|^{-k}\}$ around the computed approximation $\tilde a$ exactly one solution of $p(p(x))=e^x+O(x^{N+1})$, and for it
      $$\max_{|x|\le|L|}|p_N(x)|\le\sum_{k\le N}|a_k|\,|L|^k\le2.2405.$$
      holds. The bound is thus proved for all degrees computed so far — the conjecture kn.verm.polynom_halbexp_schranke now concerns only $N>120$.
    bereich: $1\le N\le120$; $p_N$ as in kn.verm.polynom_halbexp
    einfach: 'For every single degree up to 120 the computer has verified with interval arithmetic (every number with guaranteed error bounds):
      The solution really exists, it is the only one there, and the polynomial stays below 2.2405 on the whole disk up to the fixed point L.'
  en_theorie:
    beispiel: |
      $\sum|a_k||L|^k$: $1.875$ ($N=1$), $2.200$ ($N=2$), $2.2333$ ($N=3$), $2.24041$ ($N=10$), $2.240471$ ($N=40$), $2.2404714$ ($N=120$) — the value practically stands still. The actual maximum
      on $|x|=|L|$ is $2.2327$ (at the point $x=|L|$).
    einordnung: |
      First step of a computer-assisted proof. For all $N$ at once an argument is missing ([[kn.gescheitert.polynom_kantorovich]]); the conjecture is in [[kn.verm.polynom_halbexp_schranke]].
    genau: |
      For $N\le120$: unique solution in the box $|a_k-\tilde a_k|\le2^{-250}|L|^{-k}$, and $\max_{|x|\le|L|}|p_N|\le\sum|a_k||L|^k\le2.2405$.
    warum: |
      1. **Interval arithmetic:** Every number is computed as a ball (center and guaranteed radius); rounding errors are contained in the radius.
      2. **Krawczyk test:** One takes a small box around the approximation and forms $K(X)=\tilde a-CF(\tilde a)+(I-CJ(X))(X-\tilde a)$. If $K(X)$ lies in the interior of the box, there is exactly one
         zero there (Brouwer fixed-point theorem and contraction).
      3. **Bound:** $|p_N(x)|\le\sum|a_k||x|^k$, evaluated with the upper limits of the balls.
    worum: |
      Before proving something for all degrees one should be sure the numbers are right. Here it is rigorously proved for every degree up to 120 that the polynomial root exists
      and stays below $2.2405$ on the disk up to $L$.
- id: kn.satz.polynom_halbexp_hauptsatz
  quelle_hash: 1c5623ecb875
  theorie_hash: 9fda2eca04bb
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        1. (K) ⇒ (F): $f_K$ is holomorphic around $\bar W$ except for two slits at $L,\bar L$, the jump there is $O(|\zeta-L|^{5.447})$ (from kn.satz.halbexp_singularitaet_L; inclusions with arb).
        2. Linear statement: $\Pi_Nf_K-f_K$ as a Cauchy integral over slits and level line; the pole response is rational in $\zeta$ with poles only at $0$ and $a_0$, so Bernstein–Walsh
           and Poisson–Jensen apply; with (H) this gives $\sup_{\bar D}|\Pi_Nf_K-f_K|=O(N^{\kappa-4.69})$.
        3. Nonlinear (Theorem H1): Every solution in $B_N$ satisfies $P-f=\lambda(\Pi^P_Nf-f)$ (secant identity) — a priori bound strictly in the interior; implicit functions + covering over
           $\lambda\in[0,1]$ with exactly one sheet (at $\lambda=0$ only $Q=0$) give existence and uniqueness, without an operator norm of $J_N^{-1}$.
        4. Branch (Theorem H2): σ-homotopy from $\mathrm{pad}(p_N)$ to $p_{N+1}$ stays in $B_{N+1}$; induction from $N_0$ on.
      luecken:
      - Assumption (H) is open (kn.verm.polynom_halbexp_eckmoden).
      - 'Phase 3: (H) in the form up to L is presumably false for astronomically large N (kn.beob.polynom_rand_plateau); viable version: kn.satz.polynom_hauptsatz_kr0.'
      - The individual proofs are in forschung/polynom_halbexp/ARCHITEKTUR.md §4 and the strand reports; the lead has not checked them line by
        line.
      - One check (f_K(e^z) ∉ (−∞,0] on the left arc) is only numerical.
    pruefung:
      f2_benutzte_voraussetzungen: (K), (H), (A); neither uniform stability nor the corridor condition nor the shape of slog(D).
      f5_neue_frage: Proof of (H) — or of the core of the version without neighborhoods of L (kn.verm.polynom_halbexp_kern).
      f3_spezialfall: Scheme “consistency + coherent stability” as in Galerkin methods, here with stability only along coherent directions.
      f1_folgt_unmittelbar: No; the core consists of pole responses (rational in ζ), Bernstein–Walsh/Poisson–Jensen and a covering argument instead
        of norm estimates.
      f4_uebertragbar: To other bases and fractional iterates (same architecture, different exponents); in the Möbius model carried through except
        for (H*)_M.
    bewertung:
      recherche: For no truncation method that is supposed to run toward Kneser is convergence proved (Walker 1991 §4, Paulsen 2016, forum TPID
        18; only f(x) = bx in Trappmann 2010).
      nutzen: Reduces the conjecture to a single, precise linear statement.
      richtigkeit: conditional; proof architecture of five research strands, not independently rechecked; numerically supported up to N = 1500
    voraussetzungen:
    - text: Kneser's structure theorem (K) — slog = u + ϑ(u) with ϑ periodic, bounded for Im → +∞
      notiz: kn.konstr.kneser
    - text: Assumption (H) about the corner modes
      notiz: kn.verm.polynom_halbexp_eckmoden
    - text: 'Starting condition (A): the branch lies in the ball B_{N₀} at some N₀'
      notiz: finite computation; checked up to N = 300, N ≤ 120 rigorously (Krawczyk)
    titel: 'Main theorem: from assumption (H) it follows that the polynomial roots converge to Kneser''s half-exponential function'
    aussage: |
      For all $N\ge N_0$ the truncated system has in the ball $B_N=\{p:\sup_{\bar D}|p-f_K|\le R_N\}$, $R_N=K_0C'N^{\kappa-4.69}$, **exactly one** solution $p^*_N$, and
      $\sup_{\bar D}|p^*_N-f_K|\le C'N^{\kappa-4.69}$. With (A) the continuously continued branch is $p_N=p^*_N$ for all $N\ge N_0$. Hence $p_N\to f_K$ **uniformly on $\bar D$** —
      measured with $\kappa\approx0$: at the boundary like $N^{-4.8}$, in the interior like $N^{-7.9}$.
    bereich: $p_N$ as in kn.verm.polynom_halbexp, $D=\{|z|<|L|\}$
    einfach: The research team has built the proof so far that only one single linear statement about the weak spot of the equations at L is missing.
      If it holds, then the polynomials converge to Kneser's half-exponential function as the degree grows — exactly as in the polynomial-root
      conjecture.
    quellen:
    - stelle: ARCHITEKTUR.md §0, §4
    - stelle: '§4: no proof of convergence is known'
    - {}
    - {}
  en_theorie:
    beispiel: |
      What is no longer needed: uniform stability (false), corridor condition and shape of $\operatorname{slog}(D)$ (side route only), a quadratic control of its own.
    einordnung: |
      Older reduction: [[kn.satz.polynom_halbexp_reduktion]]. Open assumption: [[kn.verm.polynom_halbexp_eckmoden]]. Full architecture: forschung/polynom_halbexp/ARCHITEKTUR.md.
    genau: |
      (K) + (H) + (A) ⇒ for all $N\ge N_0$ exactly one solution in $B_N$, equal to the continued branch, and $\sup_{\bar D}|p_N-f_K|\le C'N^{\kappa-4.69}$.
    warum: |
      1. **Kneser properties:** From Kneser's structure theorem it follows that $f_K$ is holomorphic around the domain of convergence except for two slits at $L,\bar L$ with a very weak jump.
      2. **Linear:** The error of the linear projection is a Cauchy integral over these slits; the pole responses are rational, Bernstein–Walsh and Poisson–Jensen transfer boundary bounds to
         the outside. With (H) the error becomes $O(N^{\kappa-4.69})$.
      3. **Nonlinear:** Every solution near $f_K$ is its own secant projection — this gives an a priori bound strictly in the interior of the ball. A continuation over a parameter
         $\lambda\in[0,1]$ has exactly one sheet; from this existence and uniqueness, without the (false) uniform stability.
      4. **Branch:** The step from $N$ to $N+1$ is a homotopy that stays in the ball.
    worum: |
      The status of the proof of the polynomial-root conjecture after the work of a research team of five strands: everything stands, except for one linear assumption.
- id: kn.satz.polynom_halbexp_reduktion
  quelle_hash: f7c6c5c082ea
  theorie_hash: daf21caca076
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: |
        1. **Compactness:** By Montel every subsequence has a subsequence that converges locally uniformly on $D$ to a holomorphic $f$ with $|f|\le B$; $f$ is real on $\mathbb R$.

        2. **The limit solves the equation:** By Cauchy, $|p_N'(x)|\le B/(|L|-|x|)$; hence there is $s>0$ with $|p_N(x)|\le\rho<|L|$ for $|x|\le s$ and all $N$. There
           $h_N=p_N\circ p_N-\exp$ is holomorphic, $|h_N|\le B+e^s$, with a zero of order $N+1$ at 0; the maximum principle for $h_N(x)/x^{N+1}$ gives
           $|h_N(x)|\le(B+e^s)(|x|/s)^{N+1}\to0$. With the uniform convergence, $f(f(x))=e^x$ follows for $|x|<s$; in particular $f$ is not constant.

        3. **Corridor:** On every compact subset $K\subset V_0$ we have $|f|\le|L|$, hence $f(V_0)\subset\bar D$; as an open map, $f$ maps the open set $V_0$ into the interior: $f(V_0)\subset D$.

        4. **Uniqueness:** By kn.satz.halbexp_beschraenkt, $f=f_K$. All subsequence limits are equal, hence the whole sequence converges; the coefficients converge with it (Cauchy formula).
    pruefung:
      f2_benutzte_voraussetzungen: All four; the bound on D only for the compactness.
      f5_neue_frage: 'Side route: the main theorem (kn.satz.polynom_halbexp_hauptsatz) needs neither the bound nor the corridor as an assumption.'
      f3_spezialfall: 'Standard pattern: a priori bound + compactness + uniqueness of the limit.'
      f1_folgt_unmittelbar: Yes, from Montel, the maximum principle, the open mapping theorem and the uniqueness.
      f4_uebertragbar: To any truncation method with the same bounds (e.g. matrix root), provided the truncation errors vanish at 0.
    bewertung:
      recherche: 'Forum mirror (all 1265 threads) searched for f(f(x)) = exp(x) with polynomial/coefficients/truncation: only related methods
        (tid 228 hump trick, tid 842 matrix root), not this one.'
      nutzen: 'Shows what is still missing for a proof: only a bound.'
      richtigkeit: complete under the conditions
    voraussetzungen:
    - text: 'Bound: |p_N(x)| ≤ B for all N and all x ∈ D'
      notiz: kn.verm.polynom_halbexp_schranke
    - text: 'Corridor: for every compact subset K ⊂ V₀, |p_N| ≤ |L| on K for all large N'
      notiz: kn.verm.polynom_halbexp_schranke
    - text: a₀^(N) = p_N(0) ≤ ρ₀ < |L| for all N
      notiz: measured a₀ → 0.49856
    - text: Uniqueness via the corridor
      notiz: kn.satz.halbexp_beschraenkt
    titel: If the polynomials stay bounded and, in the corridor, in the disk, then they converge to Kneser's half-exponential function
    aussage: |
      Under these hypotheses $p_N\to f_K$ locally uniformly on $D$; in particular $a_k^{(N)}\to a_k$ for every $k$ and $p_N(1)\to T_e(\tfrac12)$. The conjecture kn.verm.polynom_halbexp is thus
      reduced to a pure bound statement about the polynomials (kn.verm.polynom_halbexp_schranke) — the uniqueness is proved, except for the numerically checked shape of slog(D).
    bereich: $p_N$ as in kn.verm.polynom_halbexp, $D=\{|x|<|L|\}$, corridor $V_0$ as in kn.satz.halbexp_beschraenkt
    einfach: If the polynomials do not run away and, where Kneser's solution stays in the disk, also stay in it, then they have limits, every
      limit is a genuine half-exponential function with the same property — and there is only one of those, Kneser's.
  en_theorie:
    beispiel: |
      Measured: $p_N(0)\to0.4985632879\ldots=T_e(-\tfrac12)$; maximum on $|x|=|L|$ always $2.2327$; in the corridor $\max|p_N|/|L|=0.9999012$ — all hypotheses look satisfied.
    einordnung: |
      The usual pattern “bound + compactness + uniqueness”. The bound is open in [[kn.verm.polynom_halbexp_schranke]].
    genau: |
      If $|p_N|\le B$ on $|x|<|L|$, $|p_N|\le|L|$ on every compact subset of the corridor $V_0$ (for large $N$) and $p_N(0)\le\rho_0<|L|$, then $p_N\to f_K$ locally uniformly.
    warum: |
      1. Bounded holomorphic functions form a compact family (Montel): There are convergent subsequences.
      2. $p_N(p_N(x))-e^x$ vanishes at 0 to order $N+1$ and is bounded — hence for small $|x|$ at most $C(|x|/s)^{N+1}$. In the limit: $f(f(x))=e^x$.
      3. The limit maps the corridor into the closed disk, as an open map even into the open one — so it is Kneser's $f_K$ ([[kn.satz.halbexp_beschraenkt]]).
    worum: |
      What is still missing for the proof of the polynomial-root conjecture? According to this theorem only a bound for the polynomials — the uniqueness of the limit is proved.
- id: kn.satz.polynom_hauptsatz_kr0
  quelle_hash: 4547764ab39b
  theorie_hash: 1a1ea43df9d1
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        1. **Data side (K19):** $\Pi_Nf-q_N=J_N^{-1}T_NJ(f-q_N)$ for every polynomial $q_N$; with the head expansion on a fixed contour the error is bounded by $\operatorname{dist}_E(f_K,\mathcal P_N)$
           (kn.satz.polynom_approximation_ecke) times a sum over the heads — no truncated poles, no rotation problem.
        2. **Heads:** via the rank-1 decomposition $\Delta K_n=\delta_n\Lambda_n/\ell_{nn}$ the head sum splits into the three statements of the core.
        3. **Nonlinear:** Theorems H1/H2 (secant identity, superposition, σ-homotopy) with balls in $\sup_{K_{r_0}}$; start at $N_0=400$ from kn.satz.polynom_zweig_400.
      luecken:
      - The three statements of the kernel (kn.verm.polynom_halbexp_kern).
      - The rearrangement of H1/H2 to K_{r₀} and K19 have been proofread by strand V, not by the lead line by line.
    pruefung:
      f2_benutzte_voraussetzungen: Core, certified Kneser values, branch up to 400, approximation rate.
      f5_neue_frage: Proof of the core.
      f3_spezialfall: Galerkin-like “consistency + stability” with stability only on K_{r₀}.
      f1_folgt_unmittelbar: No; new data side (K19) and head decomposition instead of the pole assumption (H).
      f4_uebertragbar: Other bases b > η.
    bewertung:
      recherche: as kn.satz.polynom_halbexp_hauptsatz.
      nutzen: State of the proof after three working phases.
      richtigkeit: conditional; building blocks cross-read by strand V; supported numerically up to N = 2000
    titel: 'Main theorem, version without neighborhoods of L: the open core implies convergence to Kneser''s half-exponential function'
    aussage: |
      If the core (kn.verm.polynom_halbexp_kern) holds, then $\sup_{K_{r_0}}|\Pi_Nf_K-f_K|\le C\,N^{\gamma-3.96}$ with measured $\gamma\approx0$, and the branch continued from $p_1$ is from
      $N_0=400$ on the only solution in the ball around $f_K$; hence $p_N\to f_K$ **uniformly on $K_{r_0}$**, in particular $a_k^{(N)}\to a_k$ and $p_N(1)\to T_e(\tfrac12)$.
    bereich: $p_N$ as in kn.verm.polynom_halbexp; $K_{r_0}=\bar D\setminus U_{r_0}(L,\bar L)$ with $r_0>r_*$ (for Kneser $r_*\sim10^{-6}$)
    einfach: 'This is the state of the proof: Everything is proved or certified by computer, except for the few statements of the core. If they
      hold, then the polynomial-root conjecture is proved — in the version that covers everything it is about: coefficients and p_N(1).'
    quellen:
    - stelle: phase3/HAUPTSATZ_KR0.md (version 3)
  en_theorie:
    beispiel: |
      With the measured exponents the error falls like $N^{-3.96}$; at $N=400$ the starting condition demands only a distance $\lesssim10^{-4}$, and $1.75\cdot10^{-12}$ is available.
    einordnung: |
      Successor of [[kn.satz.polynom_halbexp_hauptsatz]]; the reasons for the new version in [[kn.beob.polynom_rand_plateau]].
    genau: |
      Under the core [[kn.verm.polynom_halbexp_kern]]: $p_N\to f_K$ uniformly on $\bar D$ without small neighborhoods of $L,\bar L$; in particular the coefficients converge and $p_N(1)\to T_e(\tfrac12)$.
    warum: |
      1. **Data side:** The error of the linear projection is exactly the inverse applied to the error of an arbitrary polynomial approximation — so it becomes a question of approximation theory
         ([[kn.satz.polynom_approximation_ecke]]).
      2. **Heads:** The inverse splits into rank-1 building blocks; what is needed about them is exactly the core.
      3. **Nonlinear:** as in the older main theorem (secant identity, superposition, homotopy from degree to degree), now with balls in the norm on $K_{r_0}$.
      4. **Start:** [[kn.satz.polynom_zweig_400]].
    worum: |
      The state of the proof after three working phases, in the version that covers everything the conjecture is about.
- id: kn.satz.polynom_modelle
  quelle_hash: 490c3f1b8e04
  theorie_hash: 59682bfff6b8
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: |
        (i) Compactness of the composition on the disk ⇒ uniform stability ⇒ Kantorovich; K′ with ball arithmetic for all N (induction with explicit contraction constant).
        (ii) The translation preserves polynomials of degree ≤ N, so the truncation is superfluous and $u_N=(I+e^{sD})^{-1}T_Nh$; the Taylor coefficients of $\varphi_s$ grow like $(s/\pi)^n$
        (poles at $i\pi(2m+1)/s$), whence convergence, divergence and the tail law $-\sum_{n>N}c_nn!h_n\sim N^{-\sigma}$.
        (iii) Residue calculus in the Cayley picture, in which $f$ becomes the linear map $w\mapsto\lambda w$.
    pruefung:
      f2_benutzte_voraussetzungen: (i) attracting position — exp does not have it; (ii) linear model.
      f5_neue_frage: Prove the Möbius version of (H) (there without a corner mode, but likewise pseudospectral).
      f3_spezialfall: (i) Standard Galerkin theory; (ii) Miller algorithm/minimal solutions.
      f1_folgt_unmittelbar: (ii) yes from the exact formula; (i) with a computer-assisted core; (iii) computation.
      f4_uebertragbar: The mechanism of (ii) and the pole representation of (iii) carry over verbatim to exp (in Abel coordinates f is a translation);
        the uniform stability of (i) does not.
    bewertung:
      recherche: Trappmann 2010 proves a truncation method only for f(x) = bx; these models not found.
      nutzen: Touchstones and models for the exp proof.
      richtigkeit: complete (K′ computer-assisted)
    titel: 'Model problems: where the truncation method provably converges, and why'
    aussage: |
      (i) **Contractive case (Theorem K, K′):** If the solution has an attracting position (it maps a disk strictly into itself), then $J_N^{-1}$ is uniformly bounded and $p_N\to f$ geometrically.
      Explicitly, computer-assisted with arb: for $g=(3-x)/(8-3x)$ the branch from $p_1=\tfrac13+\tfrac x8$ exists for all $N$, and $\|p_N-T_Nf\|_1\le7.71\cdot6^{-N-1}$ with $f=1/(3-x)$.

      (ii) **Translation model (Theorem T):** For $u(x+s)+u(x)=h$ the truncated solution is exactly $u_N=\varphi_s(D)T_Nh$, $\varphi_s(z)=1/(1+e^{sz})$; it converges if and only if $h$ has
      exponential type $<\pi/s$, and indeed to the only solution of smallest type. If solution and kernel have the same type but different singularity strength, the error falls like
      $N^{1-\text{gap}}$ — exactly the form $N^{1-2\bar\gamma}$ of the exp law including the factor $N$.

      (iii) **Möbius rotation:** For the rotation $g$ of the projective line, $\Pi_Nf_M-f_M$ is exactly a single pole response at the pole $\zeta_p$ of the Möbius root; $\zeta_p$ lies in the
      domain of convergence $\bar W$ if and only if the rotation angle is $c>\pi/3$, and the Green's function is explicit.
    bereich: 'Truncation method for $f\circ f=g$: polynomial $p$ of degree $N$ with $[x^k]p\circ p=[x^k]g$, $k\le N$'
    einfach: 'For simpler equations the method can be worked through completely. There one sees the mechanism in pure form: The truncation selects
      the “calmest” among all solutions — and it fails as soon as the desired solution is itself less calm than the competition.'
    quellen:
    - stelle: Strand E (e_modelle/BERICHT.md §3–5, Rounds 2–3)
  en_theorie:
    beispiel: |
      Translation model with $s=\tfrac12$: threshold $|\lambda|=2\pi$ for $h=e^{\lambda x}$; at $N=160$: error $4\cdot10^{-52}$ ($\lambda=3$), $0.038$ ($\lambda=6.2$), $6.1$ ($\lambda=6.4$).
    einordnung: |
      Models for [[kn.satz.polynom_halbexp_hauptsatz]]; the cautionary example is in [[kn.beob.polynom_moebius_schwelle]].
    genau: |
      (i) Contractive case: geometric convergence, computer-assisted for $g=(3-x)/(8-3x)$. (ii) Translation model: exact formula, selection of the solution of smallest type, error $N^{1-\text{gap}}$.
      (iii) Möbius rotation: error = one pole response at the pole of the root, threshold $c=\pi/3$ ⇔ pole in the domain of convergence.
    warum: |
      1. Where the solution maps a disk into itself, the composition is compact and everything is well-posed — for $e^x$ this is missing.
      2. In the translation model the translation preserves the polynomials; the truncation is exactly a function of the derivative, $\varphi_s(D)$, and its coefficients reveal selection and error.
      3. For Möbius everything becomes linear in the Cayley picture, and the error is a single residue computation.
    worum: |
      Can the truncation method be proved anywhere at all? Yes — for simpler equations, and there one sees the mechanism that also acts for $e^x$.
- id: kn.satz.polynom_zweig_400
  quelle_hash: 181157d6a7bc
  theorie_hash: f8bee0378927
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        Krawczyk test for each transition $N\to N+1$ with starting box $2^{-(N+150)}$ (strand X, in parallel on the server); the chain (box of $N$ lies in the starting domain of $N+1$) checked separately (strand V,
        own code). The distance to $f_K$ via the certified Kneser coefficients (kn.satz.kneser_e_zertifiziert) and the remainder bound.
    pruefung:
      f2_benutzte_voraussetzungen: Only interval arithmetic and the certified Kneser values.
      f5_neue_frage: How far does this carry before the amplification ≈ 1.17^N blows the precision?
      f3_spezialfall: Continuation of kn.satz.polynom_halbexp_endlich (there N ≤ 120).
      f1_folgt_unmittelbar: No; finite but large computer-assisted check.
      f4_uebertragbar: With more computing time to higher degrees (N ≈ 1000 needs ≈ 2320 bits).
    bewertung:
      recherche: Continuation of our own work (kn.satz.polynom_halbexp_endlich).
      nutzen: Satisfies the starting condition (A) of the conditional main theorem with a large reserve.
      richtigkeit: proved with computer assistance, chain checked independently
    titel: The polynomial branch is rigorously certified up to degree 400 and lies there 1e-12 close to Kneser's half-exponential function
    aussage: |
      For every $N\le400$ the branch continued continuously from $p_1=x+\tfrac12$ exists and is enclosed in an explicit box (Krawczyk, chain $193\to400$ checked individually).
      For $N_0\in[318,400]$ we have $\sup_{\bar D}|p_{N_0}-f_K|\le3.6\cdot10^{-12}$, at $N=400$ even $1.75\cdot10^{-12}$ — about $10^8$ times smaller than the ball radius that the conditional main theorem needs.
    bereich: $p_N$ as in kn.verm.polynom_halbexp
    einfach: Up to degree 400 it is proved by computer that the computed polynomials really are the right ones and hit Kneser's function to within
      12 digits.
    quellen:
    - stelle: x_alternativen/zert/, phase3/v_pruefstand/BERICHT §2.1
  en_theorie:
    beispiel: |
      207 transitions from 193 to 400, computed in parallel on a server (about 2.5 hours), all passed.
    einordnung: |
      Extends [[kn.satz.polynom_halbexp_endlich]] (there up to 120). Starting condition for [[kn.satz.polynom_hauptsatz_kr0]].
    genau: |
      The branch is certified for every $N\le400$, and $\sup_{\bar D}|p_N-f_K|\le3.6\cdot10^{-12}$ for $N\in[318,400]$.
    warum: |
      1. For each transition $N\to N+1$ the Krawczyk test checks that exactly one solution lies in a small box.
      2. A separate check shows that each box lies in the starting domain of the next — the chain does not break.
      3. The distance to $f_K$ follows from the certified Kneser coefficients plus the remainder bound.
    worum: |
      A proof for “all degrees from $N_0$ on” needs a secured start: At $N_0$ the computed solution must really be the right one and lie close enough to Kneser.
- id: kn.satz.rangjets_exppoly
  quelle_hash: 1075e8bc1eed
  theorie_hash: 92067f852139
  herkunft:
    modell: opus
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: All integer ranks above 2^x are exponential polynomials in every order — and unique
    bereich: '$f_\varepsilon=x+1+\varepsilon(2^x-x-1)$; height class $\mathcal A$: holomorphic on $\operatorname{Re}x>-\rho$ with $|h(x+iy)|\le
      Ce^{a\max(x,0)}(1+|x|+|y|)^p$'
    aussage: |
      For every rank $n\ge0$ and every order $j\ge1$, the formal jet of $T^n(f_\varepsilon)$ has exactly one version with coefficients in $\mathcal A$ (normalized by $e(0)=0$ at every stage), and every coefficient is an exponential polynomial
      $$c_n^{(j)}(x)=\sum_{m=0}^{j}2^{mx}P_{n,j,m}(x).$$
      Basis: $\Delta e=G$ has at most one solution in $\mathcal A$ with $e(0)=0$ (Lemma A); for exponential polynomials it exists and is again one (Lemma B: Bernoulli polynomials for $m=0$, for $m\ge1$ the polynomial solution of $2^mq(x+1)-q(x)=P(x)$).
    einfach: If one writes the power 2^x as “plus 1 with a deviation”, all higher hyperoperations are built level by level from simple building
      blocks (powers of two times polynomials) — and the building blocks are unique once wild growth is excluded.
    beweis:
      text: 'Lemma A: the difference of two solutions is 1-periodic and entire with polynomial vertical growth, hence constant (Fourier coefficients).
        Lemma B by substitution. Theorem: induction on $n$ and $j$; exponents add in products, so $m\le j$.'
    pruefung:
      f1_folgt_unmittelbar: Yes, induction with Lemma A/B.
      f2_benutzte_voraussetzungen: The height class $\mathcal A$ — it excludes the periodic freedom θ in every order (a choice).
      f3_spezialfall: 'Yes: for $n=1$, $j=1$ the summation formula $\Delta w=v(x+1)$ from kn.satz.halbrang_linear.'
      f4_uebertragbar: To every base $b$ with $b^{mx}$ instead of $2^{mx}$ (diagonal $b^m-1\ne0$).
      f5_neue_frage: How do the coefficients grow in $n$ and $j$? → kn.beob.halbrang_divergenz
    bewertung:
      richtigkeit: complete; exponential polynomials computed with ball arithmetic (1000–3200 bits)
      nutzen: Makes the integer ranks exactly computable and the height selection unique.
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/MATHEMATIK.md (Lemma A, B, Theorem C)
  en_theorie:
    worum: |
      At base 2, all integer hyperoperations can be written down exactly as “plus 1 with corrections”.
    genau: |
      Every coefficient of the expansion of $T^n(f_\varepsilon)$ is an exponential polynomial $\sum_{m\le j}2^{mx}P(x)$ and unique in the class $\mathcal A$.
    warum: |
      Every order leads to a difference equation $\Delta e=G$. In $\mathcal A$ it has at most one solution (a periodic difference would have to be constant), and for exponential polynomials it exists explicitly.
    beispiel: |
      For $m=0$ the summation formula with Bernoulli polynomials helps: $\Delta e=x$ gives $e=x(x-1)/2$.
    einordnung: |
      First order: [[kn.satz.halbrang_linear]]; the values of the half step: [[kn.beob.halbrang_basis2]].
- id: kn.satz.schwellen_monoton
  quelle_hash: 7ebc1daceaf6
  theorie_hash: 72b99ded83d1
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: Bounded ⇔ fixed point; under monotonicity the thresholds increase and stay below 2
    aussage: |
      **(M1)** If $F:[1,\infty)\to[1,\infty)$ is continuous, monotone nondecreasing, $F(1)=b>1$, then $y_0=1$, $y_{k+1}=F(y_k)$ is bounded if and only if $F$ has a fixed point $a\ge1$;
      the limit is the smallest such fixed point. With $F=H_r(b,\cdot)$: $H_{r+1}(b,k)$ stays bounded if and only if $H_r(b,\cdot)$ has a fixed point $\ge1$.
      **(M2)** If all levels are continuous and monotone in $x$ and monotone in $b$, then the sets $\mathcal E_r=\{b>1:H_r(b,\cdot)\text{ has a fixed point}\ge1\}$ are initial intervals with
      $\mathcal E_{r-1}\subseteq\mathcal E_r\subset(1,2)$. Their upper limits $\eta_r$ therefore increase to a limit $L$ with $e^{1/e}\le L\le2$. **$L=2$ does not follow.**
    einfach: The next hyperoperation stays bounded exactly when the current one has a fixed point. Under a natural monotonicity assumption it
      follows that the limit bases increase and never reach 2 — that they come all the way up to 2 does not yet follow.
    beweis:
      text: |
        (M1) $y_k$ increases; a fixed point $a$ bounds it inductively ($y_k\le a\Rightarrow F(y_k)\le a$); a bounded monotone sequence converges to a fixed point. (M2) If $H_{r-1}(b,\cdot)$
        has a fixed point $a$, then $H_r(b,k)\le a$ for integer $k$, by monotonicity $H_r(b,x)\le a$ for $x\ge1$; with $H_r(b,1)>1$ the intermediate value theorem gives a fixed point.
        At $b=2$ we have $H_r(2,k)\ge k+1$ for integer $k$ (induction), so $H_r(2,\cdot)$ has no fixed point; monotonicity in $b$ excludes $b\ge2$.
    pruefung:
      f1_folgt_unmittelbar: Yes, elementary monotonicity and intermediate-value arguments.
      f2_benutzte_voraussetzungen: Monotonicity in x and b — clear for bˣ and tetration, not proved for the higher levels built.
      f3_spezialfall: 'Yes: Euler''s bound for towers ($r=3$).'
      f4_uebertragbar: Proves part (i) of kn.verm.beschraenkt_unter_2 under the stated hypotheses.
      f5_neue_frage: Does every base $1<b<2$ have a fixed point from some rank on? That would be $L=2$.
    bewertung:
      nutzen: Makes the threshold interpretation of η_r precise and shows what is missing for L = 2.
      richtigkeit: complete under the stated hypotheses
    voraussetzungen:
    - text: H_r(b,·) continuous and monotone in x on [1,∞), H_r(b,1) = b
    - text: H_r monotone nondecreasing in b (for the upper limit and the interval form)
    - text: This monotonicity holds for all higher levels built
    quellen:
    - stelle: forschung/eta_hyperoperationen/MATHEMATIK.md §§2–3 (Sätze M1, M2)
  en_theorie:
    beispiel: |
      $r=3$: $b^x$ has a fixed point exactly for $b\le e^{1/e}$ — Euler's bound for the infinite tower.
    einordnung: |
      Makes Nixon's claim [[kn.verm.beschraenkt_unter_2]] precise; the missing step to $L=2$ is a criterion like [[kn.satz.eta_kriterium]].
    genau: |
      The next level is bounded if and only if the current one has a fixed point $\ge1$ (M1). Under monotonicity in $x$ and $b$ the fixed-point sets increase and lie in $(1,2)$ (M2).
    warum: |
      The integer-height next level is the iteration $y_{k+1}=H_r(b,y_k)$ from $y_0=1$; a monotone iteration is bounded if and only if it gets stuck at a fixed point.
      At $b=2$ every integer-height iteration grows by at least 1 per step, so there is no fixed point there.
    worum: |
      Why the touching base is a limit at all — and what is still needed for $\eta_r\to2$.
- id: kn.satz.singulaer_minus2
  quelle_hash: a6a16b672fd9
  theorie_hash: 9a5649d00d28
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: $T(-1+\varepsilon)=T'(-1)\varepsilon+o(\varepsilon)$ and $b^{T(-2+\varepsilon)}=T(-1+\varepsilon)$; take logarithms.
    pruefung:
      f2_benutzte_voraussetzungen: Only differentiability **at the point** −1 and $T'(-1)\ne0$; Paper I requires a neighborhood — unnecessary.
        The sign $T'(-1)>0$ follows automatically.
      f5_neue_frage: 'Higher terms (Corollary 7.2 in Paper I needs $T''''(-1)$); complex version: branching at −2 → branch cut $(-\infty,-2]$.'
      f3_spezialfall: 'Yes: for every superfunction $F$ of $f$ with $F(x_0)=$ boundary value of $f$, $f^{-1}$ gives the singularity ($\log_b$
        at 0).'
      f1_folgt_unmittelbar: 'Yes: functional equation + first-order Taylor.'
      f4_uebertragbar: 'To all constructions (Kneser, regular, Walker); linear: $T''(-1)=1$ ⇒ $T(-2+\varepsilon)=\log_b\varepsilon$ exactly.'
    bewertung:
      recherche: 'Literature map 12.10.2026: the argument (f(−2) = log_b 0) is in Trappmann–Kouznetsov 2011, p. 4, the cut in Kouznetsov 2009;
        only the weakening to differentiability at the point −1 is our own.'
      nutzen: Describes the boundary of every tetration.
      richtigkeit: complete
    voraussetzungen:
    - text: T real solution with T(0)=1 on (−2,0]
    - text: T differentiable at −1 (only at the point)
    - text: T′(−1) ≠ 0
      notiz: implies T′(−1) > 0, because T(−1+ε) = b^{T(−2+ε)} > 0
    - text: T differentiable in a neighborhood of −1 (Paper I)
    titel: Logarithmic singularity at −2
    aussage: |
      $$T(-2+\varepsilon)=\frac{\ln\varepsilon}{\ln b}+\frac{\ln T'(-1)}{\ln b}+o(1),\qquad \varepsilon\to0^+ .$$
    bereich: real solutions on $(-2,-1]$, $b>0$, $b\ne1$
    einfach: Just before −2, every smooth tetration looks like a logarithm and drops to minus infinity.
    versionen:
    - aenderung: 'Hypothesis: differentiable in a neighborhood of −1.'
    - aenderung: Weakened to differentiability at the point; sign as a consequence.
      grund: Check question 2
    quellen:
    - stelle: Prop. 7.1
    - stelle: 'p. 4: f(−1) = 0 implies f(−2) = log_b 0, hence singularity or branching at −2 and the integers below it'
    - stelle: Branch cut left of −2 (zbMATH review)
  en_theorie:
    beispiel: |
      Regular tetration to base $\sqrt2$: $T'(-1)=1.69974$, the constant is $\ln T'(-1)/\ln\sqrt2=1.53063$; the remainder at $\varepsilon=10^{-12}$ is only $-2\cdot10^{-12}$
      and falls like $\varepsilon$. Linear tetration: $T'(-1)=1$, and $T(-2+\varepsilon)=\log_b\varepsilon$ holds exactly.
    einordnung: |
      In the complex plane this becomes the branch cut $(-\infty,-2]$ ([[kn.satz.kneser_eigenschaften]]). Consequence for two bases: [[kn.kor.basisvergleich]].
      The integer-argument values $T(-1)=0$, $T(-2)=-\infty$: [[fg.lem.ganzzahlwerte]].
    genau: |
      If $T$ is a real solution with $T(0)=1$ on $(-2,0]$, differentiable at the point $-1$ and $T'(-1)\ne0$, then
      $$T(-2+\varepsilon)=\frac{\ln\varepsilon}{\ln b}+\frac{\ln T'(-1)}{\ln b}+o(1)\qquad(\varepsilon\to0^+).$$
    warum: |
      1. $T(-1)=\log_bT(0)=0$, hence $T(-1+\varepsilon)=T'(-1)\,\varepsilon+o(\varepsilon)$.
      2. The equation says $b^{T(-2+\varepsilon)}=T(-1+\varepsilon)$. Taking logarithms gives $T(-2+\varepsilon)=\log_b\bigl(T'(-1)\varepsilon(1+o(1))\bigr)$ — that is the formula.
      3. The sign comes for free: $T(-1+\varepsilon)=b^{(\dots)}>0$ and $T(-1)=0$, hence $T'(-1)\ge0$, with the hypothesis even $>0$.
         Only differentiability **at the point** $-1$ is needed, not in a neighborhood.
    worum: |
      To the left of $-1$ every tetration quickly becomes very negative: Just before $-2$ it looks like a logarithm and falls to $-\infty$. This holds for
      every smooth solution — Kneser, regular, linear.
- id: kn.satz.tk_kriterien
  quelle_hash: 6c3823c4f35a
  theorie_hash: 4c66507fee37
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: Trappmann–Kouznetsov 2011, Criteria 2 and 3 with proof (pp. 8–9), Lemma 3 (Jordan curves, pp. 7–8), Lemma 4 and Section 4 (p. 9 ff.).
    pruefung:
      f2_benutzte_voraussetzungen: Two distinct fixed points of F as endpoints of the initial curve; rectifiability for Criterion 2.
      f5_neue_frage: Which initial curve fits the Kneser-like hexation, whose image in the upper half-plane is branched (kn.beob.hexation_verzweigt)?
      f3_spezialfall: Sufficient conditions for Criterion 1 (kn.satz.trappmann_kouznetsov).
      f1_folgt_unmittelbar: Criterion 3 ⇒ 2 is short (injectivity, ζ+1 does not intersect ζ); 2 ⇒ 1 needs a theorem on univalent functions and
        Jordan curves.
      f4_uebertragbar: To every holomorphic function with a pair of fixed points — e.g. pentation at its complex fixed points (Kneser-like hexation,
        kn.satz.hexation_eindeutig_g0).
    bewertung:
      nutzen: 'Makes the uniqueness criterion checkable: only imaginary parts along a segment.'
      richtigkeit: Literature, original read (pp. 3–9)
    titel: 'Trappmann–Kouznetsov 2011: simple sufficient conditions for their uniqueness criterion; initial domain for b > η'
    aussage: |
      **Criterion 2:** If $\gamma$ is rectifiable, $\zeta=\alpha\circ\gamma$ injective, $\zeta\cap(\zeta+1)=\emptyset$ and $\operatorname{Im}\zeta(t)\to\pm\infty$ for $t\to\pm1$,
      then Criterion 1 holds ($\alpha$ injective on $H$ and $\bigcup_k(\alpha(H)+k)=\mathbb C$), hence uniqueness (kn.satz.trappmann_kouznetsov).
      **Criterion 3:** It already suffices that $t\mapsto\operatorname{Im}\alpha(\gamma(t))$ increases strictly and tends to $\pm\infty$.
      **Lemma 4:** For $b>\eta$ the segment $\ell(t)=\operatorname{Re}L+i\operatorname{Im}L\cdot t$ between $\bar L$ and $L$ (fixed points of $\log_b$) is an initial curve of $\exp_b$;
      initial domain $H=\{z:\operatorname{Re}z\ge\operatorname{Re}L,\ |z|\le|L|\}\setminus\{L,\bar L\}$. Thus Kneser's Abel function satisfies the criterion (Section 4).
    bereich: $F$ holomorphic; initial curve $\gamma:(-1,1)\to\mathbb C$ ($\gamma$, $F\circ\gamma$ injective and disjoint, endpoints $\gamma(\pm1)$
      two fixed points of $F$), initial domain $H$; $\alpha$ holomorphic Abel function on $H$ with $\alpha(d)=0$
    einfach: 'For a “level function” (Abel function) to be unique, it suffices to look at a piece of the plane between the two complex fixed points:
      If its value there goes up and down beyond all bounds, there is only one. Kneser''s solution passes this test.'
    quellen:
    - stelle: arXiv:1006.3981, Criteria 2–3, Lemma 3–4, Section 4
  en_theorie:
    einordnung: |
      Second step in the history of uniqueness: numerical ([[kn.beob.kouznetsov_numerik]]), criterion (here), theorem ([[kn.satz.paulsen_cowgill]]).
    genau: |
      Initial curve $\gamma$ between the fixed points, Abel function $\alpha$ with $\alpha(d)=0$. If $t\mapsto\operatorname{Im}\alpha(\gamma(t))$ increases strictly and tends to $\pm\infty$,
      then $\alpha$ is on the initial domain the only such Abel function. For $b>\eta$ the vertical segment from $\bar L$ to $L$ is an initial curve of $\exp_b$.
    warum: |
      1. If $\operatorname{Im}\zeta$ increases strictly, $\zeta=\alpha\circ\gamma$ takes no value twice, and $\zeta+1$ does not intersect $\zeta$ (Criterion 3 ⇒ 2).
      2. An injective curve with $\operatorname{Im}\to\pm\infty$ divides the plane into a left and a right part (Lemma 3). The image $\alpha(H)$ is the strip
         between $\zeta$ and $\zeta+1$; its integer translations cover everything (Criterion 2 ⇒ 1).
      3. Criterion 1 gives uniqueness via entire functions with entire inverse, which can only be linear ([[kn.satz.trappmann_kouznetsov]]).
    worum: |
      The uniqueness criterion of Trappmann and Kouznetsov requires that the translated images of a domain cover the whole plane. That is hard to check
      directly. Their Criteria 2 and 3 translate it into a simple condition: imaginary parts along a single curve.
- id: kn.satz.trappmann_kouznetsov
  quelle_hash: 3e68f041b663
  theorie_hash: ec2c2fd01773
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: 'Trappmann–Kouznetsov 2011, Theorems 1 and 2 with proof (pp. 5–6): q = α₂∘α₁⁻¹ satisfies q(z+1) = q(z)+1, extends to an entire function
        with entire inverse, hence is linear and, because q(0) = 0, the identity.'
    pruefung:
      f2_benutzte_voraussetzungen: Injectivity on H and the covering of the plane by the translates of α(H); holomorphy only on H (respectively
        D).
      f5_neue_frage: Relation of the two criteria (PC vs. TK) — equivalent?
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: To other functions with a pair of fixed points (according to the abstract).
    bewertung:
      nutzen: Second independent justification of uniqueness.
      richtigkeit: established (literature, original read)
    voraussetzungen:
    - text: Initial curve γ of F between two fixed points (γ and F∘γ injective and disjoint), initial domain H
    titel: Uniqueness of holomorphic Abel functions at a pair of fixed points
    aussage: |
      **Theorem 1 (Trappmann–Kouznetsov 2011):** Let $\gamma$ be an initial curve of $F$ with initial domain $H$ and $d\in H$. There is at most one function $\alpha$ with
      **Criterion 1:** $\alpha$ is a holomorphic and injective Abel function of $F$ on $H$, $\alpha(d)=0$ and $\bigcup_{k\in\mathbb Z}(\alpha(H)+k)=\mathbb C$.
      **Theorem 2:** On a connected $D\ni d$ there is at most one holomorphic Abel function with $\alpha^{\prime}(d)\ne0$ that satisfies Criterion 1 on an initial domain $H\subset D$.
      Kneser's Abel function for $\exp_b$, $b>\eta$, satisfies the criterion (Section 4; simple sufficient conditions: kn.satz.tk_kriterien).
    bereich: functions with a pair of non-real fixed points, in particular $\exp_b$, $b>\eta$
    quellen:
    - stelle: arXiv:1006.3981, Definition 3, Thm. 1, Criterion 1, Thm. 2 (pp. 5–6)
  en_theorie:
    einordnung: |
      Whether the two criteria are equivalent is open. Comparison: [[kn.satz.paulsen_cowgill]].
    genau: |
      For holomorphic Abel functions at a pair of non-real fixed points there is a uniqueness criterion (Trappmann–Kouznetsov 2011). Kneser's
      Abel function for $e^z$ satisfies it, as does the one for $b^z$ with $b>\eta$. The exact wording is still to be checked against the original.
    warum: |
      Theorem from the literature. The mechanism is the same as for Paulsen–Cowgill: two Abel functions differ by a periodic function,
      and the behavior at $L$ and $\bar L$ forces it to be bounded and hence constant ([[fg.lem.periodisch_liouville]]).
    worum: |
      A second, independent uniqueness statement — this time for the Abel function (the super-logarithm) instead of the tetration itself.
- id: kn.satz.walker_konjugation
  quelle_hash: 8a3e781fcc2b
  theorie_hash: 04ac60f6f8d9
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Walker 1991, Math. Comp. 57, 723–733 (according to the zbMATH review by J. Matkowski).
    pruefung:
      f2_benutzte_voraussetzungen: Real arguments only; analyticity not claimed.
      f5_neue_frage: Is h nowhere analytic (Levenstein 2011, bw.verm.nirgends_analytisch)?
      f3_spezialfall: A base change (bw.def.F_bd) between exp and the parabolic dexp.
      f1_folgt_unmittelbar: No (limit construction, h = lim dexp^{−n}∘expⁿ according to Trappmann in the forum).
      f4_uebertragbar: To every base above η (conjugation of b^x to a map with a parabolic fixed point, e.g. e^x − 1).
    bewertung:
      nutzen: The core of Walker's construction and an early example of the base change.
      richtigkeit: Literature (review)
    titel: 'Walker 1991: a C^∞ function h with h(eˣ) = e^{h(x)} − 1 — exp is smoothly conjugate to eˣ − 1'
    aussage: |
      P. L. Walker constructs by a natural iteration method an infinitely differentiable real function $h$ with
      $$h(e^x)=e^{h(x)}-1\qquad(x\in\mathbb R),$$
      i.e., a smooth conjugation between $\exp$ and $\operatorname{dexp}(x)=e^x-1$. Together with Abel functions of $\operatorname{dexp}$ (from Walker 1988 and 1991, J. Math. Anal. Appl.)
      he obtains $C^\infty$ solutions $G$ of $G(e^x)=G(x)+1$, the “generalized logarithms” (kn.konstr.walker).
    bereich: real axis
    einfach: eˣ − 1 has a fixed point at 0, eˣ does not. Walker builds a smooth conversion between the two. With it he can transfer the known
      half-iterates of eˣ − 1 to eˣ.
    quellen:
    - stelle: zbMATH review (Zbl 0742.39005)
    - stelle: Prior work (Abel functions of entire functions)
    - stelle: Prior work
  en_theorie:
    einordnung: |
      Core of [[kn.konstr.walker]]; the same limit type as the base change ([[bw.def.F_bd]]); analyticity open ([[bw.verm.nirgends_analytisch]]).
    genau: |
      There is $h\in C^\infty(\mathbb R)$ with $h(e^x)=e^{h(x)}-1$. With an Abel function $A$ of $e^x-1$, $G=A\circ h$ is then a $C^\infty$ solution of $G(e^x)=G(x)+1$.
    warum: |
      1. $G(e^x)=A(h(e^x))=A(e^{h(x)}-1)=A(h(x))+1=G(x)+1$.
      2. $h$ arises as the limit $\operatorname{dexp}^{-n}\circ\exp^n$: far out, $e^x$ and $e^x-1$ differ relatively little, the backward steps with $\log(1+x)$ damp the error.
      3. The smoothness of all derivatives is the technical part of the work.
    worum: |
      $e^x-1$ has a fixed point at 0 and can be iterated well there; $e^x$ has no real one. Walker connects the two by a smooth function $h$.
- id: kn.verm.beschraenkt_unter_2
  quelle_hash: 710af4f8b1fe
  theorie_hash: a8d97b989f71
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: '(i): n = 3 classical (fp.satz.turm_reell), n = 4 measured (kn.beob.tetra_euler, characterization 3), n = 5 measured (kn.beob.unendliche_hexation);
      (ii): ηₙ increases for n = 3 … 6 (exp.tpid10_abstaende), Levenstein''s η₇ ≈ 1.839 fits; at b = 1.84 > η₇ the octation is, according to Levenstein,
      still unbounded (oct(45) ≈ 4.05) — no contradiction.'
    naechste_frage: (i) prove for all n as soon as H_n(b, x) increases in b and has at most two fixed points above 1; (ii) hinges on TPID 10.
    pruefung:
      f2_benutzte_voraussetzungen: H_n(b, x) increasing in x and b; number of fixed points above 1 at most two (measured up to n = 6).
      f5_neue_frage: Is there a limit function lim H_n(b, x) for b < 2 (Nixon’s “infinite operator”)?
      f3_spezialfall: 'n = 3: the infinite power converges exactly up to η (Euler).'
      f1_folgt_unmittelbar: '(i) yes, from monotonicity: the sequence 1, b, H_n(b, b), … increases and is bounded if and only if H_n(b,·) has
        a fixed point above 1; open is only that this is the case exactly for b ≤ ηₙ. (ii) follows from (i) and TPID 10.'
      f4_uebertragbar: To other families of hyperoperations (kn.frage.andere_etas).
    bewertung:
      nutzen: Explains what TPID 10 means for individual bases.
      richtigkeit: Conjecture; (i) elementary except for the number of fixed points
    titel: 'Nixon 2017: b > ηₙ if and only if the next level grows unboundedly — every base below 2 remains bounded at high levels'
    aussage: |
      **(i)** $H_{n+1}(b,m)$ remains bounded for $m\to\infty$ if and only if $b\le\eta_n$. **(ii)** With TPID 10 ($\eta_n\uparrow2$) it follows: for every base $b<2$ there is an $N$
      from which on all levels $H_n(b,m)$ are bounded in $m$; for base 2, however, every level is unbounded ($2\uparrow^n3$ grows), although $2\uparrow^n2=4$ for all $n$.
      J. D. Nixon formulated (i) and (ii) in 2017 in the forum (without proof, “from vague memories”) and emphasized that the constants depend on the chosen continuation;
      S. Levenstein asked in the same thread whether the sequence is bounded for all bases below 2. Already in 2011 Nixon had proposed an “infinite operator”
      $\triangle_\infty=\lim\triangle_n$ with $2\triangle_\infty2=4$, which presupposes the limits 2 and 4.
    bereich: Hyperoperations $H_n(b,\cdot)$ as in kn.verm.tpid10, real $1<b<2$
    einfach: A level is “tame” if its infinite tower has a value. For bases just below 2 the lower levels are still wild, but — so the conjecture
      — from a certain level on all become tame, because the limit bases ηₙ move ever closer to 2.
    quellen:
    - stelle: Nixon, posts 6 and 8 (pid 8760, 8762, 03./04.09.2017); Levenstein, post 5
    - stelle: 'Nixon, 09.07.2011: infinite operator'
    - stelle: bounded analytic hyperoperations of all levels for 1 < α < η (Abstract)
  en_theorie:
    einordnung: |
      Heuristic by Nixon (forum 2011/2017) on [[kn.verm.tpid10]]; special cases: [[fp.satz.turm_reell]] ($n=3$), [[kn.beob.tetra_euler]] ($n=4$), [[kn.beob.unendliche_hexation]] ($n=5$).
    genau: |
      (i) $H_{n+1}(b,m)$ is bounded in $m$ $\iff b\le\eta_n$. (ii) From (i) and TPID 10: for every $b<2$ there is $N$ with boundedness for all $n\ge N$.
    warum: |
      1. (i): The sequence $1,b,H_n(b,b),\dots$ increases; it is bounded if and only if $H_n(b,\cdot)$ has a fixed point above 1. Open is only that this holds exactly up to $\eta_n$
         — for that one needs that $H_n(b,x)$ increases in $b$ and has at most two fixed points above 1 (measured up to $n=6$).
      2. (ii): If $\eta_n$ is increasing with limit 2, then $b<\eta_N$ for some $N$, hence also $b<\eta_n$ for all $n\ge N$.
      3. Base 2: $2\uparrow^n2=4$, but $2\uparrow^n3=2\uparrow^{n-1}4$ — the sequence grows beyond all bounds at every level.
    worum: |
      What does “$\eta_n\to2$” mean for a single base, say 1.9? Nixon's answer: from a certain level on, all hyperoperations to base 1.9 are tame —
      their infinite towers have a value. To base 2, however, never.
- id: kn.verm.carleman_eigenwerte
  quelle_hash: 5ef4a03e8ca6
  theorie_hash: 2d7ca9f8630f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'exp.vermutungen: two bases, N = 8 … 32, four eigenvalues.'
    naechste_frage: Proof; rate as a function of λ (the measurement suggests geometric convergence in N).
    pruefung:
      f2_benutzte_voraussetzungen: Attracting fixed point ($b<\eta$); the matrix is expanded about 0, not about the fixed point.
      f5_neue_frage: Do the eigenvectors also converge to the coefficients of the Schröder function?
      f3_spezialfall: 'Counterpart to the Carleman slog (kn.konstr.carleman): there solutions of linear systems, here eigenvalues.'
      f1_folgt_unmittelbar: No. The eigenvalue 1 is exact (first row of $B_N$).
      f4_uebertragbar: 'TPID 3: the same for $(x+s)^p-s$ with limits $p^k$.'
    bewertung:
      nutzen: Bridge matrix method ↔ Koenigs.
      richtigkeit: Conjecture, clearly numerically supported
    titel: 'TPID 1: eigenvalues of truncated Carleman matrices tend to λ^k'
    aussage: |
      **Conjecture (bo198214, TPID 1, 2008):** The eigenvalues of $B_N$ can be numbered such that they tend to $(\ln a)^k=\lambda^k$ as $N\to\infty$
      ($\lambda=a\ln b$ the multiplier at the lower fixed point).
      **Measured:** largest distance of the first four eigenvalues from $1,\lambda,\lambda^2,\lambda^3$ — base 1.3: $6.5\cdot10^{-3}$ ($N=8$), $1.5\cdot10^{-6}$ (16),
      $3.2\cdot10^{-11}$ (24), $3.0\cdot10^{-16}$ (32); base $\sqrt2$: $0.18$, $0.029$, $0.0020$, $5.4\cdot10^{-5}$ — slower the closer $\lambda$ is to 1.
    bereich: $1<b<\eta$; $B_N$ = $N\times N$ section of the Carleman matrix of $b^x$ (about 0), $(B_N)_{jk}=(j\ln b)^k/k!$; $a$ lower fixed point
    einfach: A table of the power series of b^x, b^{2x}, b^{3x}, … has — truncated — eigenvalues. The larger the table, the more accurately they
      hit the powers of the slope at the fixed point. This connects the matrix methods with regular iteration.
    quellen:
    - stelle: TPID 1 (bo198214, 17.05.2008)
  en_theorie:
    beispiel: |
      Largest distance of the first four eigenvalues from $1,\lambda,\lambda^2,\lambda^3$:

      | $N$ | Base 1.3 ($\lambda=0.3859$) | Base $\sqrt2$ ($\lambda=0.6931$) |
      |---|---|---|
      | 8 | $6.5\cdot10^{-3}$ | $0.18$ |
      | 16 | $1.5\cdot10^{-6}$ | $0.029$ |
      | 24 | $3.2\cdot10^{-11}$ | $0.0020$ |
      | 32 | $3.0\cdot10^{-16}$ | $5.4\cdot10^{-5}$ |

      The closer $\lambda$ is to 1 (that is, $b$ to $\eta$), the slower.
    einordnung: |
      Matrix methods ([[kn.konstr.carleman]]) and regular iteration ([[it.satz.koenigs]]) are two routes to the same solution; these eigenvalues are a direct witness of this.
    genau: |
      For $1<b<\eta$ let $B_N$ be the $N\times N$ matrix with entries $(B_N)_{jk}=(j\ln b)^k/k!$ ($j,k=0,\dots,N-1$) — the section of the Carleman matrix of $b^x$ about 0.
      **Conjecture (TPID 1):** Its eigenvalues tend, as $N\to\infty$, to $1,\lambda,\lambda^2,\dots$ with $\lambda=\ln a=a\ln b$ ($a$ the lower fixed point).
    warum: |
      A proof is missing. The idea: At the fixed point $b^x$ is conjugate to $w\mapsto\lambda w$, and the Carleman matrix of $\lambda w$ is diagonal with $\lambda^k$.
      Eigenvalues do not change under conjugation — for infinite matrices this is not automatically correct, though, and the truncation interferes.
    worum: |
      The Carleman matrix writes a function as an infinite table: Row $j$ contains the power series of $f(x)^j$. Iterating then becomes matrix multiplication.
      If one truncates the table, the matrix has eigenvalues. H. Trappmann conjectured in 2008 that for $b^x$ these tend to the powers of the slope at the fixed point —
      exactly the numbers from which regular iteration is built.
- id: kn.verm.carleman_kneser
  quelle_hash: 8a5f868b749c
  theorie_hash: 47e20419d1b4
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: |
      exp.carleman: systems $n=4\dots128$ (up to 720 digits), comparison at 5 points with Kneser reference values (gp-tetration, 80 digits).
      The error decreases without stagnation from $1.7\cdot10^{-5}$ ($n=16$) to $9\cdot10^{-9}$ ($n=128$) — but only **algebraically** ($\approx n^{-3.8}$).
      No counterexample; the 10 digits expected beforehand at $n=128$ were not reached.
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: 'If yes: a purely real-algebraic characterization of the Kneser solution (br.frage.bohr_mollerup).'
      f3_spezialfall: 'Counterpart on the sexp side: TPID 18 — does the “polynomial tetration” from truncated Carleman matrices converge to Kneser?
        (Helms: 5–10 digits at 64 × 64)'
      f1_folgt_unmittelbar: No — open since 1991.
      f4_uebertragbar: 'Same question for $1<b<\eta$: does the intuitive slog converge to the regular or another Abel function?'
    bewertung:
      nutzen: Would yield an algebraic characterization.
      richtigkeit: Conjecture, numerically supported
    titel: Intuitive slog converges to Kneser's slog
    aussage: $\operatorname{slog}_n(x)\to\operatorname{slog}^{\mathrm K}_e(x)$ for $n\to\infty$.
    bereich: $b=e$, $|x|<|L_e|\approx1.3746$
    quellen:
    - stelle: 'Helms: 5–10+ digits; Walker poses the question'
    - {}
    - stelle: 'TPID 18 (Helms 2022): the same question for the sexp side'
    - stelle: 'Trappmann 2009, “Grand Unity Conjecture”: matrix-power tetration (Helms) = intuitive tetration = regular below η, = Cauchy/Kneser
        above η'
  en_theorie:
    beispiel: |
      Systems $n=4\dots128$ computed with up to 720 digits, compared at five points: the error decreases without standstill from $1.7\cdot10^{-5}$ to $9.2\cdot10^{-9}$.
      No counterexample — but the 10 digits expected beforehand at $n=128$ were not reached.
    einordnung: |
      If true, one would have a purely real-algebraic characterization of the Kneser solution ([[br.frage.bohr_mollerup]]). Rate: [[kn.beob.carleman_rate]].
      The same question on the side of tetration itself stands in the tetration forum as TPID 18 (Helms 2022): Does the “polynomial tetration” from truncated
      Carleman matrices converge to Kneser? Helms reaches 5–10 digits with $64\times64$ matrices.
    genau: |
      **Conjecture.** For $|x|<|L_e|\approx1.3746$ one has $\operatorname{slog}_n(x)\to\operatorname{slog}^{\mathrm K}_e(x)$ for $n\to\infty$.
    warum: |
      Supported, not proved (open since Walker 1991). The radius $|L_e|$ is the distance to the nearest singularity: Kneser's super-logarithm has at $L$ and
      $\bar L$ logarithmic singularities, its power series about $0$ cannot converge beyond them.
    worum: |
      The intuitive super-logarithm gets better and better with growing $n$ — but toward which limit? The conjecture: exactly toward Kneser's super-logarithm.
- id: kn.verm.hexation_streifen
  quelle_hash: 4b721ccfc362
  theorie_hash: 5d58d364037a
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'Searched for other translation-invariant real curves of F_q: map from above (Re ζ ∈ [−2.6, 1.4], Im ζ ∈ [−2.6, 1.6])
      and from the left (Im ζ ∈ [−4.6, −1.8]) — only C and C ± Π. Log points in the band between C and C + Π with Re Z ∈ [−2, 7] (F_q(Z − 1) =
      w_b + jΠ_T, j = −1 … 2): apart from ζ_c − 2 and ζ_c − 2 + Π only 2.68744 + 0.99506i and 3.63707 + 0.95142i, whose rays do not close (kn.satz.hexation_logpunkt).
      Not searched: Re Z > 7, zeros of the tetration other than −1, the band Im ζ ∈ [−2.6, −2.0].'
    naechste_frage: 'With a fixed domain the gap is closed (kn.satz.hexation_eindeutig_g0), and likewise for every domain onto which α_K continues
      holomorphically (kn.satz.hexation_gebiete). Since kn.satz.hexation_logpunkt the remainder splits into two questions: (a) Is there, apart
      from ζ_c − 2 + kΠ, a log point Z of F_q whose single real ray arrives at Z + 1? (b) Can a solution whose strip image contains the attracting
      fixed point p be excluded even under injectivity on only one strip?'
    pruefung:
      f2_benutzte_voraussetzungen: Injectivity on the strip (otherwise α_{H₁} is not uniquely invertible); both vertical limits; reality on the
        axis.
      f5_neue_frage: Is the strip width Re Π (up to the first branching) itself a characterization?
      f3_spezialfall: Strip variant of the Trappmann–Kouznetsov criterion (Abel function injective on a fundamental domain between the fixed points).
      f1_folgt_unmittelbar: No; the half-plane proof does not carry over verbatim.
      f4_uebertragbar: To all bases b > η₅ (strip width ≈ Re Π) and to higher levels whose level function is not entire.
    bewertung:
      recherche: 'Literature map 12.10.2026: forum (tid 1177: Levenstein 2017 builds the Kneser-type hexation via a circle and θ, without branchings
        or a uniqueness proof; tid 1263, 949), Kouznetsov 2014 (pentation only), arXiv/zbMATH (pentation, hyperoperation), MathOverflow: not found.'
      nutzen: Gives the uniqueness question for the hexation a checkable form.
      richtigkeit: Conjecture; evidence numerical (boundary images, two maps of the real set)
    titel: 'Replacement for Paulsen–Cowgill: the Kneser-type hexation is determined by a strip'
    aussage: |
      **Conjecture:** There is exactly one solution $H$ that is holomorphic and injective on a vertical strip $S=\{a\le\operatorname{Re}z\le a+1\}$ and satisfies there
      $H(x+iy)\to q$ for $y\to+\infty$, $\to\bar q$ for $y\to-\infty$ — the Kneser-type hexation.
      **Evidence:** (1) The Kneser-type hexation is holomorphic on the whole strip $s_b<\operatorname{Re}z<-0.741$ (width $3.03\approx\operatorname{Re}\Pi$); only to the right of it
      do the branch points begin (kn.beob.hexation_verzweigt). For $S=[-1.8,-0.8]$ the boundary images $H(-1.8+iy)$ and $H(-0.8+iy)$ are simple, disjoint curves from the
      axis to $q$ — by the argument principle $H$ is injective on $S$; the singular point $w_b$ of the pentation lies in the image.
      (2) In the class “$\theta=\alpha_q\circ H-\mathrm{id}$ holomorphic on the upper half-plane” $H$ is determined by its real curve $C=\alpha_q(\mathbb R)$
      (Riemann mapping theorem on the cylinder); other solutions would correspond to other branches of $\alpha_q$ along $\mathbb R$, hence to other translation-invariant curves on
      which $F_q$ is real. In the strips of height $\operatorname{Im}\Pi$ above and below $C$, $F_q$ has no such curve except $C$ (maps with sheet tracking).
      The half-plane characterization of tetration, by contrast, is empty (kn.satz.hexation_keine_halbebene) — the strip is the appropriate weakening.
    bereich: $b=2$; solutions $H$ of $H(z+1)=P(H(z))$, real and increasing on $(s,\infty)$, $H(0)=1$; $q$ repelling fixed point of the pentation
    einfach: 'For tetration, “smooth on an entire half-plane” determines the solution. For the hexation this does not work, but presumably a strip
      of width 1 suffices: there the Kneser-type hexation is smooth and takes no value twice — and presumably it is the only solution with this
      property.'
    quellen:
    - {}
    - stelle: 'Model: Abel function injective on a fundamental domain'
  en_theorie:
    beispiel: |
      Boundary images for $S=[-1.8,-0.8]$: $H(-1.8)=-0.803$, $H(-0.8)=0.207$; both curves run to $q=-1.993+1.445\,i$, the right one in a wide arc up to
      $\operatorname{Im}w\approx4.8$. The point $w_b\approx-1.979+1.912\,i$ lies between them (winding number in absolute value $\approx1$, measured $-0.95$, because the boundary at $q$ is not quite closed) — $H$ takes the value $w_b$ in the strip
      (at $z\approx-1.741+2.746\,i$) without being singular there; only one step further to the right does it become singular.
    einordnung: |
      The strip version of [[kn.satz.trappmann_kouznetsov]]; it takes the place of [[kn.satz.paulsen_cowgill]], whose half-plane version is empty here.
      Belongs to [[kn.frage.hexation_kneser]].
    genau: |
      **Conjecture.** If $H$ is real and increasing on $(s,\infty)$, $H(0)=1$, $H(z+1)=P(H(z))$, and there is a strip $S=\{a\le\operatorname{Re}z\le a+1\}$ on which $H$ is
      holomorphic and injective, with $H(x+iy)\to q$ for $y\to+\infty$ and $\to\bar q$ for $y\to-\infty$, then $H$ is the Kneser-type hexation.
    warum: |
      What speaks for it:
      1. **The Kneser-type hexation satisfies it.** Its branch points begin at $\operatorname{Re}z=-0.741$; to the left of that, up to the singularity $s_b=-3.767$ on the
         axis, it is smooth everywhere — a strip of width $3.03$, almost exactly $\operatorname{Re}\Pi=3.009$. On $S=[-1.8,-0.8]$ the two boundaries were computed:
         Their images are simple curves from the axis to $q$ that do not intersect. Then $H$ takes each value on $S$ only once (argument principle).
      2. **Other candidates would be rare.** Every solution whose Abel deviation $\theta=\alpha_q\circ H-\mathrm{id}$ is holomorphic in the upper half-plane is determined by its
         curve $C=\alpha_q(\mathbb R)$ (Riemann mapping theorem). A second solution would need a second curve on which $F_q$ is real and which continues under
         $\zeta\mapsto\zeta+1$. Two maps of the real set of $F_q$ (followed from above and from the left) show no such curve in the strips above and below $C$.
      3. **The route of proof** would be that of Paulsen–Cowgill and Trappmann–Kouznetsov: $\alpha_{H_1}\circ H_2-\mathrm{id}$ is periodic and bounded, hence constant. The gap:
         $\alpha_{H_1}$ must be defined on the whole image $H_2(S_2)$. For the tetration the half-plane takes care of this; here the image contains the point $w_b$, at which the
         pentation itself is singular.
      4. **With a fixed domain the gap is closed:** If one requires injectivity of the inverse function on a fixed domain $G_0$ (instead of on some strip), both
         Abel functions are defined on the same domain, and the proof goes through ([[kn.satz.hexation_eindeutig_g0]]). Open is only whether the choice of domain plays a
         role.
      5. **Made countable:** Every solution of this type begins at a log point of $F_q$, and every log point carries at most one ([[kn.satz.hexation_logpunkt]]). Nearby
         there are two further log points, but their real rays do not close. Open: log points further to the right and solutions whose strip image contains $p$.
    worum: |
      If “holomorphic in a half-plane” does not work for the hexation ([[kn.satz.hexation_keine_halbebene]]) — what then determines the Kneser-type hexation? Presumably a
      strip: On a vertical strip of width 1 it is smooth and takes no value twice, and only it manages that.
- id: kn.verm.polynom_halbexp
  quelle_hash: ea87e6949e3f
  theorie_hash: d2f27465c3d8
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'Branch followed up to N = 194 with 210 digits (arb): no jump, no stalling of the distance; coefficients k = 0, 1, 5,
      10, 20 checked individually, boundary value p_N(L) in addition. The sign change at N ≈ 51 is a transition between two decay rates, not a
      deviation from the limit.'
    pruefung:
      f2_benutzte_voraussetzungen: Choice of the branch (continuously from $p_1$); real coefficients.
      f5_neue_frage: Prove the core (kn.verm.polynom_halbexp_kern) — the conjecture without small neighborhoods of L then follows (kn.satz.polynom_hauptsatz_kr0).
      f3_spezialfall: Related to the intuitive super-logarithm (truncated Carleman matrix) and Gottfried Helms’ matrix root (forum tid 842) —
        both likewise numerically Kneser, unproved.
      f1_folgt_unmittelbar: No. The equation $f\circ f=\exp$ has infinitely many analytic solutions; the truncation selects one.
      f4_uebertragbar: To $f^{\circ m}=\exp$ (thirds etc.) and other bases; to the iteration roots of every entire function without a real fixed
        point.
    bewertung:
      recherche: 'Forum mirror (all 1265 threads) searched for f(f(x)) = exp(x) with polynomial/coefficients/truncation: only related methods
        (tid 228 hump trick, tid 842 matrix root), not this one.'
      nutzen: Computes Kneser's half-exponential function from a purely local condition; would characterize Kneser without complex analysis.
      richtigkeit: numerical up to N = 1500 (error law, blind test); conditionally proved (version without neighborhoods of L) under the core
        kn.verm.polynom_halbexp_kern
    titel: 'Polynomial root of exp: polynomials p of degree N with p(p(x)) = eˣ + O(x^{N+1}) lead to Kneser''s half-exponential function'
    aussage: |
      For every $N$ the $N+1$ equations “coefficient of $x^k$ in $p_N(p_N(x))$ is $1/k!$” ($k=0,\dots,N$) determine the $N+1$ coefficients of $p_N$ if one follows the branch of
      $p_1=x+\tfrac12$ continuously onward. **Conjecture:** $a_k^{(N)}\to a_k$, the Taylor coefficients of Kneser's half-exponential function $f_K$ about 0, and $p_N\to f_K$ on $|x|<|L|$;
      in particular $p_N(1)\to T_e(\tfrac12)=1.6463542337511945809\ldots$
      Measured: $p_N(1)-T_e(\tfrac12)=-8.6\cdot10^{-3}$ ($N=2$), $1.1\cdot10^{-7}$ ($N=5$), $-3.3\cdot10^{-11}$ ($N=15$), $-1.0\cdot10^{-16}$ ($N=100$), $-2\cdot10^{-19}$ ($N=194$); from $N\approx50$ on
      the distance shrinks by about a factor of $0.93$ per degree. Each coefficient approaches the Kneser value individually, and at the boundary point $L$ we have $p_N(L)\to L=f_K(L)$.

      **Status 10.10.2026 (research team):** confirmed up to $N=1500$, with a precise error law (kn.beob.polynom_halbexp_fehlergesetz); conditionally proved — only the
      linear assumption (H) about the corner modes at $L$ is missing (kn.satz.polynom_halbexp_hauptsatz). For no comparable truncation method has convergence to Kneser been proved so far.

      **Status 12.10.2026 (phases 2–3):** Kneser for base $e$ and the branch up to $N=400$ are rigorously certified (kn.satz.kneser_e_zertifiziert, kn.satz.polynom_zweig_400).
      The version “uniformly up to the boundary” is, according to model computations, presumably false for astronomically large $N$ (kn.beob.polynom_rand_plateau). The viable version — uniformly without
      small neighborhoods of $L,\bar L$, with coefficients and $p_N(1)$ — is conditionally proved (kn.satz.polynom_hauptsatz_kr0); the core kn.verm.polynom_halbexp_kern is open.
    bereich: $p_N(x)=\sum_{k\le N}a_k^{(N)}x^k$ real with $p_N(p_N(x))=e^x+O(x^{N+1})$, branch continued continuously from $p_1(x)=x+\tfrac12$;
      $f_K(x)=T_e(\operatorname{slog}_e x+\tfrac12)$
    einfach: 'One looks for a polynomial that, applied twice in a row, gives eˣ as exactly as possible — but only the first N terms of the series
      have to match. Without putting in tetration, super-logarithm or Kneser, one ends up at Kneser''s half-exponential function: at degree 100
      to 16 digits. Why the truncation selects exactly this solution is not proved.'
    formen:
    - notiz: the system of equations
    - notiz: 'equivalent: at the point a₀, p_N agrees with exp ∘ p_N⁻¹'
    quellen:
    - {}
    - stelle: Recomputation up to N = 194, coefficients, boundary value
    - stelle: Matrix root (Helms), related
  en_theorie:
    beispiel: |
      Degree 3: $p_3(x)=0.498574+0.876383x+0.247391x^2+0.024117x^3$, $p_3(1)=1.646465$ — already correct to four digits. Kneser: $f_K(x)=0.4985633+0.8763361x+0.2475522x^2+0.0245718x^3+\dots$
      At degree 100, $a_0$ agrees to 16, $a_5$ to 11 and $a_{20}$ to 5 digits.
    einordnung: |
      The same pattern as for the intuitive super-logarithm ([[kn.satz.intuitiver_log]]) and Gottfried Helms’ matrix root: a truncated method that numerically hits Kneser,
      without anyone knowing why. A proof would characterize Kneser's solution by a purely local condition — it is not quite a real answer to [[br.frage.bohr_mollerup]],
      because boundedness on a complex disk is needed.
    genau: |
      $p_N$ with $[x^k]\,p_N(p_N(x))=1/k!$ for $k\le N$, branch starting from $p_1=x+\tfrac12$. Conjectured: $p_N\to f_K=T_e(\operatorname{slog}_e+\tfrac12)$ on $|x|<|L|$, in particular $p_N(1)\to T_e(\tfrac12)$.

      | $N$ | $p_N(1)$ | Distance to $T_e(\tfrac12)$ |
      |---|---|---|
      | 1 | $1.5$ | $-1.5\cdot10^{-1}$ |
      | 2 | $1.637802440995$ | $-8.6\cdot10^{-3}$ |
      | 5 | $1.646354339729$ | $1.1\cdot10^{-7}$ |
      | 15 | $1.646354233718$ | $-3.3\cdot10^{-11}$ |
      | 50 | $1.6463542337511980$ | $3.5\cdot10^{-15}$ |
      | 100 | $1.64635423375119448$ | $-1.0\cdot10^{-16}$ |
      | 194 | — | $-2\cdot10^{-19}$ |
    warum: |
      Only conditionally proved. What one sees and understands:
      1. The equation $f\circ f=\exp$ has infinitely many analytic solutions $f_\theta$ (one for each suitable periodic perturbation $\theta$). The truncated system has, for each $N$, only individual
         solutions — so it must select one.
      2. Kneser's solution is bounded on the disk $|x|<|L|$, its Taylor coefficients fall like $k^{-6.45}|L|^{-k}$. Every other real solution explodes near $L$ or $\bar L$;
         proved is: Kneser's is the only one that maps the corridor $\{z\in D:f_K(z)\in D\}$ into the disk ([[kn.satz.halbexp_beschraenkt]]). A polynomial can best imitate the “calmest” solution.
      3. More precisely: If the polynomials stayed bounded on $|x|\le|L|$ and, in the corridor, in the disk, the conjecture would be proved ([[kn.satz.polynom_halbexp_reduktion]]). This bound was at first the open core
         ([[kn.verm.polynom_halbexp_schranke]]); today the viable version is conditionally proved, and what is open is [[kn.verm.polynom_halbexp_kern]].
    worum: |
      Can one compute Kneser's half-exponential function without putting in tetration, super-logarithm or complex analysis — only from the equation $f(f(x))=e^x$ itself?
      The author's attempt: a polynomial of degree $N$ whose self-composition hits the first $N+1$ terms of $e^x$. The numbers hit Kneser astonishingly exactly.
- id: kn.verm.polynom_halbexp_eckmoden
  quelle_hash: b3f6eafb34a9
  theorie_hash: dccd84bda23a
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'Stronger versions are numerically FALSE and therefore not assumed: uniform stability sup|J_N⁻¹| < ∞ (corner mode) and
      the global polynomial pole bound (H*) (from N ≈ 420–650 on). The local version (H) holds in all measurements up to N = 1200 with reserve.
      Phase 3: (H) requires control right up to L; by kn.beob.polynom_rand_plateau this is presumably false for N ≳ 10¹⁰. For the version without
      neighborhoods of L, kn.verm.polynom_halbexp_kern takes its place.'
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: Proof via a boundary-layer description of the corner mode at the truncation edge (WKB) or a parametrix “Toeplitz inside +
        Mellin at L, L̄ + corner part”.
      f3_spezialfall: Pseudospectral version of the stability of finite sections; in the Möbius model the same question without a corner mode,
        also open there.
      f1_folgt_unmittelbar: No — a stability statement for a strongly non-normal truncated operator.
      f4_uebertragbar: Same form for other bases.
    bewertung:
      recherche: 'Forum mirror and literature on finite sections (strand C): not found.'
      nutzen: The only open assumption of the main theorem.
      richtigkeit: numerical, with reserve
    titel: 'Assumption (H): poles near L excite the corner modes only weakly — the only open spot of the proof'
    aussage: |
      For all large $N$ and all near-solutions $P$ in the ball around $f_K$: (H-i) the linearizations are invertible; (H-ii) for $z\in\bar D$ and poles $\zeta$ on the slits at
      $L,\bar L$ and on a fixed level line $\{g=d\}$ we have $|E^P_N(\zeta,z)|\le C\,N^{\kappa}e^{-\varepsilon Ng(\zeta)}/\operatorname{dist}(\zeta,\bar W)$ with $\kappa<4.69$; (H-iii) the response to $x^N$ is stable.

      For $P=f_K$, (H-ii) splits into two linear statements: **(a′)** after splitting off the corner modes, $\sigma_{r+1}((I+K_N)^{-1})\le1+o(1)$ ($K\delta=(\delta\circ f)/(f'\circ f)$), and **(E_L)** the
      boundary profile of the adjoint corner modes falls off toward the corner faster than $|\tau|^{1.13}$: $\sigma_i|\tilde V_i(\arg L+\tau)|\le CN^\kappa e^{\lambda(\tau)N}$, $\lambda\le A|\tau|^p$, $p>1/\alpha=1.13$.

      Measured: (a′) $1.0001$–$1.0002$ ($N\le400$); (E_L) $p\approx1.44$–$1.52$, mean $\int\lambda\,d\nu=0.086$ (limit 1, reserve ≈ 11; $N\le1200$); pole responses up to $N=1000$.
    bereich: '$\Pi^P_N$ secant projection at a near-solution $P$ (for $P=f_K$: $\Pi_N=J_N^{-1}T_NJ_\infty$); $E^P_N(\zeta,z)=\Pi^P_Nk_\zeta(z)-k_\zeta(z)$,
      $k_\zeta=1/(\zeta-z)$; $g$ Green''s function of $\mathbb C\setminus\bar W$'
    einfach: 'Everything else in the proof stands. Only a statement about a single spot is open: How strongly is the exponentially growing weak
      spot of the equations at L excited by a “kick” very near L? The computations say: much more weakly than necessary. A proof is missing.'
    quellen:
    - stelle: ARCHITEKTUR.md §5; strand D §10–11, strand C §13
  en_theorie:
    beispiel: |
      Mean $\int\lambda\,d\nu=0.086$ (limit 1) up to $N=1200$; remainder contraction $1.0001$–$1.0002$ up to $N=400$.
    einordnung: |
      Replaces the stronger, numerically refuted assumptions (uniform stability; global polynomial pole bound). Were the proof to succeed, [[kn.verm.polynom_halbexp]] would be proved
      ([[kn.satz.polynom_halbexp_hauptsatz]]).
    genau: |
      (H): local pole bound $|E^P_N(\zeta,z)|\le CN^\kappa e^{-\varepsilon Ng(\zeta)}/\operatorname{dist}$ on the slits at $L,\bar L$ and a level line, for all near-solutions $P$.
      For $P=f_K$: (a′) remainder contraction and (E_L) boundary profile of the adjoint corner modes with exponent $p>1.13$.
    warum: |
      1. Pole responses are rational in the pole $\zeta$ with poles only at $0$ and $a_0$ — everything in the exterior follows from values on the boundary (Bernstein–Walsh, Poisson–Jensen).
      2. Far from the corner, exponential growth with rate below $0.068$ does not disturb; the measured one is $0.012$.
      3. Near the corner the excitation rate must tend to zero, faster than $|\tau|^{1.13}$; measured is $|\tau|^{1.44}$ to $|\tau|^{1.52}$.
    worum: |
      The only place where the proof still depends on an assumption: How strongly is the weak spot at $L$ excited by a “kick” (a pole) very near $L$?
- id: kn.verm.polynom_halbexp_kern
  quelle_hash: f46717bd399c
  theorie_hash: 446794399d41
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'Stronger versions are measured to be false: family representative without weight on a thick lens (grows like e^{0.0137N}),
      primal reserve at the n-th-root level (H_P ≡ 0, Lemma K20), uniform convergence up to L (kn.beob.polynom_rand_plateau). The named versions
      hold up to N = 2000 and 3000, respectively.'
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: A Riemann–Hilbert framework with shift that contains both channels (composition and multiplication) at L.
      f3_spezialfall: Strong asymptotics with connection formula at a turning point; nonlocal welding problem.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: Same form for every base b > η.
    bewertung:
      recherche: 'Phases 1–3 and GPT strand: no suitable theory found (problem sheet OPEN_PROBLEM_2_en.md).'
      nutzen: The only remaining gap to the proof of the polynomial-root conjecture in the K_{r₀} version.
      richtigkeit: numerical, with reserve; measured independently by two strands
    titel: 'The open core after phase 3: corner-pole response, far rates and family coherence'
    aussage: |
      For the conditional main theorem (kn.satz.polynom_hauptsatz_kr0) three statements are missing, all satisfied numerically with reserve:
      **(G-P)** the increments of the corner-pole response are polynomially small on $K_{r_0}$: $\sup_{K_{r_0}}|\Delta u_n|\le Cn^{\kappa_G}$ (measured $\kappa_G\approx-3.1$);
      **(FA)** the adjoint heads decay far from $L$ at the level of $n$-th roots with strict reserve (lens $-0.013$, $\Gamma_{\rm out}$ arc $-0.037$ per degree);
      **(Fam-koh)** for the near-solutions there are germ representatives whose distance to $f_K$ on the contour, weighted with $|\Lambda_N/\Lambda_N(L)|$, remains polynomial
      (measured $\sim N^{-4.7}$, $3\cdot10^{-16}$ at $N=2000$, for every lens).
      All three are coherence statements at places where a growing and a decaying factor balance exactly; every estimate that bounds the factors individually has no reserve there.
    bereich: $K_{r_0}=\bar D\setminus U_{r_0}(L,\bar L)$; $u_n=\Pi_ns$ the response to the pole at $L$; heads as in kn.satz.polynom_eckprofil
    einfach: After three working phases the problem has shrunk to a few, precisely named statements. All of them are clearly satisfied in the
      computations. Proving them requires a tool that shows how two exactly canceling quantities oscillate together — such a tool is so far missing.
    quellen:
    - stelle: phase3/HAUPTSATZ_KR0.md §2, phase3/KERNPROBLEM.md, phase3/OFFENES_PROBLEM_2.md
  en_theorie:
    beispiel: |
      Measured up to $N=2000$: increments of the corner-pole response fall like $n^{-3.1}$; far adjoint rates $-0.013$ and $-0.037$ per degree, respectively; weighted family distance $3\cdot10^{-16}$.
    einordnung: |
      Replaces the older assumption [[kn.verm.polynom_halbexp_eckmoden]] for the new target version; failed proof routes in [[kn.gescheitert.polynom_ecke_wege]]; problem sheet for specialists:
      forschung/polynom_halbexp/phase3/OPEN_PROBLEM_2_en.md.
    genau: |
      Three coherence statements — (G-P) the response to the pole at $L$, (FA) the far rates of the adjoint heads, (Fam-koh) the closeness of the near-solutions in weighted form.
    warum: |
      1. The inverse of the equations splits exactly into rank-1 building blocks (“heads”).
      2. Each head is a product of a growing and a falling factor. At the critical places the two rates cancel exactly.
      3. Therefore every estimate that bounds the factors individually has no room; only the joint oscillation of the factors keeps the sum small — and exactly this cannot be proved so far.
    worum: |
      After three working phases: What exactly is still missing for the proof of the polynomial-root conjecture?
- id: kn.verm.polynom_halbexp_schranke
  quelle_hash: 71a7987f1c0a
  theorie_hash: 33635c94e549
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    gegenbeispielsuche: Maximum on |x| = 0.9|L| and |x| = |L| for N = 10 … 194 determined on 4096 points (always 2.0066 and 2.2327, respectively);
      corridor on 117 grid points for N = 20 … 100; values at x = tL for t → 1.
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: 'A structured estimate of the remainder parts along the almost singular directions at L and L̄ (kn.gescheitert.polynom_kantorovich):
        pure norm estimates do not suffice.'
      f3_spezialfall: 'Same difficulty as for the intuitive super-logarithm: there too a bound for the truncated solutions is missing.'
      f1_folgt_unmittelbar: No — an a priori bound for a nonlinear, truncated system of equations.
      f4_uebertragbar: To other truncation methods.
    bewertung:
      recherche: 'Forum mirror (all 1265 threads) searched for f(f(x)) = exp(x) with polynomial/coefficients/truncation: only related methods
        (tid 228 hump trick, tid 842 matrix root), not this one.'
      nutzen: Together with kn.satz.polynom_halbexp_reduktion would prove the conjecture.
      richtigkeit: numerical up to N = 194 (disk) and N = 100 (corridor), respectively
    titel: The polynomial roots stay bounded on the disk |x| ≤ |L| and, in the corridor, in the disk
    aussage: |
      (i) There is a $B$ with $|p_N(x)|\le B$ for all $N$ and $|x|\le|L|=1.3746$. (ii) On every compact subset $K\subset V_0$ we have $|p_N|\le|L|$ for all large $N$.
      For $N\le120$, (i) is rigorously proved with $B=2.2405$ (kn.satz.polynom_halbexp_endlich); open is the inference to all $N$.
      Up to $N=1500$ numerically: $\max_D|\Pi_Nf_K|=2.232651$, genuine $p_N$ lie quadratically close to it. The main theorem (kn.satz.polynom_halbexp_hauptsatz) supplies the bound under (H) as well — it is no longer the bottleneck.

      Measured: The maximum on $|x|=|L|$ is $2.2327$ for all $N=10,\dots,194$ (at the real point $x=|L|$); on 117 grid points of the corridor (up to $\operatorname{Im}w=6$)
      $\max|p_N|/|L|=0.9999012$ for $N=20,40,60,100$, and $\max|p_N-f_K|$ falls there from $1.5\cdot10^{-6}$ ($N=20$) to $5.5\cdot10^{-10}$ ($N=100$). At the boundary point $L$ itself
      $|p_N(L)-L|=1.5\cdot10^{-6}$, $1.6\cdot10^{-9}$, $2.2\cdot10^{-11}$ for $N=20,80,194$ — roughly like $N^{-4.8}$.
    bereich: $p_N$ as in kn.verm.polynom_halbexp, corridor $V_0$ as in kn.satz.halbexp_beschraenkt
    einfach: 'This is the last missing piece: One would have to show that the polynomials do not run away up to the fixed point L and stay in
      the disk in the corridor. In the computations they do both; a proof is missing.'
  en_theorie:
    beispiel: |
      $|p_N(L)-L|$: $1.5\cdot10^{-6}$ ($N=20$), $4.5\cdot10^{-8}$ ($40$), $1.6\cdot10^{-9}$ ($80$), $5.5\cdot10^{-10}$ ($100$), $2.2\cdot10^{-11}$ ($194$).
    einordnung: |
      With [[kn.satz.polynom_halbexp_reduktion]] this would prove [[kn.verm.polynom_halbexp]]. For the intuitive super-logarithm ([[kn.satz.intuitiver_log]]) the same kind of bound is missing.
    genau: |
      Conjecture: $\sup_N\max_{|x|\le|L|}|p_N(x)|<\infty$, and on every compact subset $K$ of the corridor $V_0$, $|p_N|\le|L|$ for large $N$.
    warum: |
      Measured: The maximum on $|x|=|L|$ is $2.2327$ for every $N$ up to 194; in the corridor $\max|p_N|/|L|=0.9999012$ for $N=20$ to $100$; at the boundary point $L$, $p_N(L)$ converges to $L$,
      roughly like $N^{-4.8}$. A proof would need an estimate for a nonlinear system of equations whose linearization is almost singular (the perturbation directions of other solutions are
      only weakly suppressed) — the condition number grows by about a factor of $1.9$ per degree.
    worum: |
      The last missing piece for a proof: Do the polynomials $p_N$ stay bounded up to the boundary $|x|=|L|$, and do they stay in the disk in the corridor, no matter how large $N$ becomes?
- id: kn.verm.szekeres_wachstum
  quelle_hash: 3d9dca934d7a
  theorie_hash: ca021033ef5f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'According to the review: numerical examples in the article; no check of our own.'
    pruefung:
      f2_benutzte_voraussetzungen: Fixed point 0 with F'(0) ≥ 1 (thus e^x − 1, not e^x itself).
      f5_neue_frage: Does Kneser's half exp satisfy Szekeres' criterion?
      f3_spezialfall: Selection principle alongside Kneser (holomorphy), Walker (smoothness) and Paulsen 2016 (metric).
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: To exp via Walker's conjugation (kn.satz.walker_konjugation).
    bewertung:
      nutzen: A selection principle that does not go through complex analysis.
      richtigkeit: Conjecture (literature)
    titel: 'Szekeres 1998: “regular growth” as a selection principle for the best Abel solution'
    aussage: |
      The Abel equation $A(F(x))=A(x)+1$ has many solutions. G. Szekeres wants to single out the “best” one via a notion of **regular growth** and for this builds, with three
      auxiliary functions, a particular solution $\varphi$ of $\varphi(F(x))=\varphi(x)$. **Conjecture:** a weakened complete monotonicity of the sequence of Fourier coefficients
      of $\varphi\circ A^{-1}$ decides whether regular growth is present; supported by computer examples. Follow-up to an attempt by P. Lévy (1928).
    bereich: $F$ analytic on $[0,\infty)$, $F(0)=0$, $F^{\prime}(0)=c\ge1$, $F^{\prime}>0$ (e.g. $e^x-1$)
    einfach: Among the many possible “half-iterates”, Szekeres looks for the most natural one — the one whose growth is the most uniform. His
      criterion is a conjecture that he supports with computations.
    quellen:
    - stelle: zbMATH review (Zbl 0918.39006)
    - stelle: Prior work
  en_theorie:
    einordnung: |
      Selection principle alongside Kneser (holomorphy, [[kn.konstr.kneser]]), Walker (smoothness, [[kn.satz.walker_konjugation]]) and Paulsen (metric, [[kn.konstr.paulsen_stoerung]]).
    genau: |
      For $F$ with fixed point 0, $F^{\prime}(0)\ge1$: a weakened complete monotonicity of the Fourier coefficients of $\varphi\circ A^{-1}$ ($\varphi$ a special
      solution of $\varphi\circ F=\varphi$) is supposed to characterize regular growth.
    warum: |
      Any Abel solution differs from another by a periodic function. Its Fourier coefficients measure how strongly it “wobbles”; a monotonicity law
      for these coefficients would be a criterion without complex analysis. It is supported only numerically.
    worum: |
      Which half-iterate of $e^x-1$ is “the right one”? Szekeres proposes: the one with the most regular growth, and tries to make that measurable.
- id: kn.verm.tk_c2
  quelle_hash: 7c1b50ca58f5
  theorie_hash: 7484d18e848f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: Not computed by ourselves. Obvious candidates F(z + θ(z)) with entire, real, 1-periodic θ produce values on the cut and
      thereby singularities — no simple counterexample known; the β-method (Nixon 2021) would be a candidate with different behavior at i∞, its
      holomorphy on C₋₂ is not settled.
    pruefung:
      f2_benutzte_voraussetzungen: Only holomorphy on C₋₂ and mirror symmetry.
      f5_neue_frage: Does the limit L at i∞ already follow from holomorphy on C₋₂ and reality?
      f3_spezialfall: Stronger version of kn.satz.paulsen_cowgill (without limit condition).
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: For hexation the half-plane version is empty (kn.satz.hexation_keine_halbebene).
    bewertung:
      nutzen: Shows which condition in the uniqueness theorem is really needed.
      richtigkeit: open (state of the full text of Paulsen–Cowgill unchecked)
    titel: 'Trappmann–Kouznetsov conjecture (2010): holomorphic on ℂ without (−∞, −2] and real-symmetric suffices for uniqueness'
    aussage: |
      **Conjecture (Trappmann–Kouznetsov, arXiv 2010, p. 4):** Holomorphy on $C_{-2}=\mathbb C\setminus(-\infty,-2]$ together with $f(\bar z)=\overline{f(z)}$ determines the 4-exponential uniquely.
      Reason for the cut: from $f(-1)=0$ it follows that $f(-2)=\log_b0$, hence a singularity or a branch point at $-2$ (and at the integers below).
      **Current state:** Paulsen–Cowgill (2017) write in the abstract that they “answer a conjecture of Trappmann and Kouznetsov”. Their uniqueness theorem requires
      (according to Nixon 2021) additionally the limit $f(x+iy)\to L$ for $y\to+\infty$ (kn.satz.paulsen_cowgill). Whether the version without the limit is thereby proved or
      refuted cannot be said without the full text. Nixon was just asking in the forum in 2021 whether there is a solution with limit $\infty$ instead of $L$ (kn.frage.beta_methode).
    bereich: '4-exponential $f$ to base $b>\eta$: $f(0)=1$, $f(z+1)=\exp_b(f(z))$'
    einfach: 'Trappmann and Kouznetsov conjectured in 2010: If a tetration is smooth everywhere in the complex plane (except on the ray to the
      left of −2) and real on the real axis, then it is Kneser''s. Whether one must additionally require where it tends to upward is the real
      question.'
    quellen:
    - stelle: p. 4, after Eq. (6)
    - stelle: Abstract (repository arch.astate.edu)
    - stelle: 'Nixon, post 21 (23.08.2021): conditions of Paulsen–Cowgill and questions A/B'
  en_theorie:
    einordnung: |
      Paulsen–Cowgill prove uniqueness with an additional limit at $i\infty$ ([[kn.satz.paulsen_cowgill]]); Nixon's β-method asks for solutions without it ([[kn.frage.beta_methode]]).
    genau: |
      Conjecture: If $f$ is holomorphic on $\mathbb C\setminus(-\infty,-2]$, $f(\bar z)=\overline{f(z)}$, $f(0)=1$, $f(z+1)=b^{f(z)}$, then $f$ is Kneser's tetration.
    warum: |
      Only a reason for the cut: from $f(-1)=0$ it follows that $f(-2)=\log_b0$. Every other solution is $f(z+\theta(z))$ with 1-periodic $\theta$; it would remain holomorphic on the
      slit plane only if $z+\theta(z)$ never meets the cut — that this works only for constant $\theta$ is the open core.
    worum: |
      Which conditions are really needed for “the” tetration to be unique? Trappmann and Kouznetsov conjectured in 2010: smoothness in the whole plane
      (except for a cut) and mirror symmetry suffice.
- id: kn.verm.tpid10
  quelle_hash: bee2d26920f7
  theorie_hash: 9303015199eb
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'exp.stufe5, exp.hexation_kneser: four terms; distances to 4: 1.282, 0.911, 0.699, 0.558; to 2: 0.555, 0.365, 0.263, 0.201
      — the ratios increase (not geometric), nearly straight on a double-logarithmic scale.'
    naechste_frage: 'Can the exponent 1.47 of 2 − η_n be explained? An accurate fifth term (η₇, e₇: regular heptation via the Kneser-type hexation)
      would test it; Levenstein''s η₇ ≈ 1.839 already fits.'
    pruefung:
      f2_benutzte_voraussetzungen: Depends on the chosen continuation at each level (Kneser, then regular at the fixed point) — bo198214 2009
        and Nixon 2017 stress this; the matrix slog already gives a different value for e₄ (kn.beob.eta4_matrix).
      f5_neue_frage: Is there a limit function toward which the hyperoperations at bases near 2 tend?
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: 'Also for level 2 and 1? (Multiplication: b·x = x never touches; the sequence begins sensibly at the power.)'
    bewertung:
      nutzen: Structure across all levels.
      richtigkeit: Conjecture; four accurate terms and a rough fifth support it
    titel: 'TPID 10: the “Eulers” tend to 4, the “Etas” to 2'
    aussage: |
      **Conjecture (dantheman163, TPID 10, 31.10.2010):** $e_n\to4$ and $\eta_n\to2$. Additional conjecture by tommy1729 (TPID 11): kn.verm.tpid11.
      **Values:** $e=2.71828$, $e_4=3.08853$, $e_5=3.30141$, $e_6=3.44223$ and $\eta=1.44467$, $\eta_4=1.63532$, $\eta_5=1.73736$, $\eta_6=1.79912$; in addition $\eta_7\approx1.839$
      (Levenstein 2017). Both sequences increase; $2-\eta_n$ falls like $2.8\,n^{-1.47}$, $4-e_n$ somewhat more slowly (kn.beob.tpid10_gesetz) — compatible with 2 and 4, but slow.
      **Approaches that were found (map: KARTE_kn.md §5):**
      (a) *Continuation-free:* interpolation of the self-super-root from integer arguments (Robbins 2009, mike3 2010) hits $\eta_4$, $e_4$ to 7–8 digits (kn.beob.eta4_interpolation).
      (b) *Matrix slog:* nuninho 2009 with Robbins' matrix, 200 dimensions: $e_4\ge3.08855$, $2\cdot10^{-5}$ above Kneser (kn.beob.eta4_matrix).
      (c) *Kneser:* Levenstein 2010, 32 digits for $\eta_4$, $e_4$ (kn.beob.tetra_euler); higher levels alternately regular/Kneser-type: Levenstein 2017 with three digits up to
      $\eta_7$ (kn.beob.hoehere_etas), here 30 digits for $\eta_5,e_5,\eta_6,e_6$ (kn.beob.stufe5, kn.beob.stufe6).
      (d) *Heuristic:* Nixon 2011/2017 — “infinite operator” with $2\triangle_\infty2=4$, and $b>\eta_n$ if and only if the next level is unbounded, hence bases below 2
      remain bounded at high levels (kn.verm.beschraenkt_unter_2). Simplest argument: $2\uparrow^n2=4$ for all $n$ — at base 2 every level passes through the point $(2,4)$.
      (e) *Open side questions:* lower bound of the infinite pentation (kn.frage.pentation_untergrenze), etas of other families and rationality of $e_4$ (kn.frage.andere_etas).
      No proof, no upper or lower estimate of $\eta_n$, no OEIS entry and no treatment on MathOverflow/Math.SE found (search 12.10.2026).
    bereich: sequences $e_n$ (point of tangency) and $\eta_n$ (tangency base) of the $n$-th hyperoperation, $n\ge3$
    einfach: The numbers e ≈ 2.718 and η ≈ 1.445 have “bigger siblings” on every higher level of operation. The conjecture is that these siblings
      come closer and closer to the numbers 4 and 2 — because 2 + 2, 2 · 2, 2², 2↑↑2, … all give 4.
    quellen:
    - stelle: TPID 10 (dantheman163, 31.10.2010, post 11, refers to tid 262 pid 5327)
    - stelle: Values for η₄, e₄ (Levenstein, 31.10.2010)
    - stelle: 'Levenstein 2017: η₅ ≈ 1.738, η₆ ≈ 1.799, η₇ ≈ 1.839; Nixon 2017: limits 2 and 4 as a boundedness statement'
    - stelle: 'Nixon 2011: infinite operator'
    - {}
  en_theorie:
    beispiel: |
      The point $(2,4)$: $2+2=4$, $2\cdot2=4$, $2^2=4$, ${}^22=2^2=4$, $2\uparrow\uparrow\uparrow2={}^22=4$ — at every level.
    einordnung: |
      The terms come from [[kn.beob.tetra_euler]], [[kn.beob.stufe5]] and [[kn.beob.stufe6]]. For the fourth one needed a hexation near base 1.8 — there the
      pentation no longer has a real fixed point, hence the Kneser-type hexation from [[kn.frage.hexation_kneser]].
    genau: |
      **Conjecture (TPID 10):** $e_n\to4$ and $\eta_n\to2$ for $n\to\infty$.
      **Addendum (TPID 11, tommy1729):** $\eta_n^2<e_{n-1}$.

      | Level | $e_n$ | $\eta_n$ |
      |---|---|---|
      | 3 (power) | $2.71828$ | $1.44467$ |
      | 4 (tetration) | $3.08853$ | $1.63532$ |
      | 5 (pentation) | $3.30141$ | $1.73736$ |
      | 6 (hexation) | $3.44223$ | $1.79912$ |
    warum: |
      Why 4 and 2 are plausible: For base 2 every level passes through the same point, $2\uparrow^n2=4$. The points of tangency with $y=x$ therefore presumably migrate to
      the point where the curves for base 2 “converge”.

      What the four terms show: both sequences increase. The distances to 4 are $1.282$, $0.911$, $0.699$, $0.558$, to 2 they are $0.555$, $0.365$, $0.263$, $0.201$.
      The ratios of successive distances increase (for 2: $0.66$, $0.72$, $0.76$) — the approach is not geometric. Double-logarithmically, however, the distances lie
      almost on a straight line: $2-\eta_n\approx2.8\,n^{-1.47}$, the local exponents are $1.462$, $1.471$, $1.471$. Such a power law tends to 0 — it fits
      the limit 2, even if four terms prove nothing. For $4-e_n$ the exponents are $1.19$, $1.19$, $1.23$.
      TPID 11 holds: $\eta_4^2=2.6743<e=2.7183$, $\eta_5^2=3.0184<e_4=3.0885$ and $\eta_6^2=3.2368<e_5=3.3014$.
    worum: |
      $e$ and $\eta$ have on every higher level of operation a “sibling pair”: $(e_4,\eta_4)$ for tetration, $(e_5,\eta_5)$ for pentation, and so on.
      In 2010 a forum member (dantheman163) conjectured that these sequences tend to 4 and 2. The reason is pretty: $2+2=2\cdot2=2^2=2\uparrow\uparrow2=\dots=4$.
- id: kn.verm.tpid11
  quelle_hash: a84b23d3d927
  theorie_hash: bb34a7757531
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'exp.tpid10_abstaende: (1) for n = 4, 5, 6 with 30-digit values; r_n and the quotients from (2) computed; no counterexample.'
    naechste_frage: A fifth term (η₇, e₇) would show whether r_n keeps falling; Levenstein's rough figures (η₇ ≈ 1.839, near-touching near 3.7)
      are not sufficient for that.
    pruefung:
      f2_benutzte_voraussetzungen: The choice of continuation at each level (as kn.verm.tpid10).
      f5_neue_frage: Does r_n stay below 1 if 4 − eₙ falls more slowly than 2 − ηₙ? The exponents would have to converge.
      f3_spezialfall: Side condition to kn.verm.tpid10.
      f1_folgt_unmittelbar: No; (2) follows from TPID 10 if both distances fall like powers (then quotients of consecutive terms tend to 1).
      f4_uebertragbar: 'To the level below: η₃² = 2.087 < e₂? (e₂ is not defined — multiplication does not touch y = x).'
    bewertung:
      nutzen: Couples the two sequences from TPID 10.
      richtigkeit: Conjecture; (1) confirmed at three terms
    titel: 'TPID 11: ηₙ² < e_{n−1} — etas squared stay below the Eulers of the previous level'
    aussage: |
      **Conjecture (tommy1729, TPID 11, 01.12.2010):** (1) $\eta_n^2<e_{n-1}$; (2) $\dfrac{\eta_n^2-e_{n-1}}{\eta_{n-1}^2-e_{n-2}}\to1$.
      **Measured:** $\eta_4^2-e=-0.04400$, $\eta_5^2-e_4=-0.07013$, $\eta_6^2-e_5=-0.06457$ — (1) holds for $n=4,5,6$. The quotients in (2) are $1.594$ and $0.921$;
      with two values (2) cannot be decided.
      **Rewriting:** With $d_n=2-\eta_n$, $D_n=4-e_n$ we have $\eta_n^2-e_{n-1}=D_{n-1}-(4d_n-d_n^2)$; (1) thus says $r_n=D_{n-1}/(4d_n-d_n^2)<1$.
      Measured $r_4=0.967$, $r_5=0.929$, $r_6=0.915$ — decreasing. If TPID 10 holds and both distances fall like powers of $n$, then (2) follows, and (1) requires
      that $D_n$ eventually falls at least as fast as $d_n$ (local exponents so far $1.18$–$1.23$ versus $1.47$, but increasing; kn.beob.tpid10_gesetz).
    bereich: Sequences $\eta_n$, $e_n$ as in kn.verm.tpid10, $n\ge4$
    einfach: 'An additional conjecture to TPID 10: If one squares the “eta” of a level, one stays just below the “Euler” number of the level before.
      For the three levels checked this holds, in each case by about 2 %.'
    quellen:
    - stelle: TPID 11 (tommy1729, 01.12.2010), post 13
  en_theorie:
    beispiel: |
      $\eta_5^2=3.01836$, $e_4=3.08853$: difference $-0.070$, i.e. about 2 % below $e_4$.
    einordnung: |
      Side conjecture to [[kn.verm.tpid10]]; the distances are in [[kn.beob.tpid10_gesetz]].
    genau: |
      (1) $\eta_n^2<e_{n-1}$; (2) $(\eta_n^2-e_{n-1})/(\eta_{n-1}^2-e_{n-2})\to1$. With $d_n=2-\eta_n$, $D_n=4-e_n$, (1) is equivalent to
      $r_n=D_{n-1}/(4d_n-d_n^2)<1$.
    warum: |
      1. Rewriting: $\eta_n^2-e_{n-1}=(2-d_n)^2-(4-D_{n-1})=D_{n-1}-4d_n+d_n^2$.
      2. Measured: $r_4=0.967$, $r_5=0.929$, $r_6=0.915$ — below 1 and falling; (1) holds for $n=4,5,6$.
      3. If $d_n$ and $D_n$ fall like powers of $n$, then quotients of consecutive terms tend to 1 — that is (2). For (1), $D_n$ must eventually fall at least
         as fast as $d_n$; so far it falls more slowly (exponent 1.2 versus 1.47), but its exponent increases.
    worum: |
      tommy1729 added to TPID 10 an inequality that couples the two sequences: The square of an “eta” stays below the “Euler” number of the level before.
- id: kn.verm.tpid3
  quelle_hash: b04042b74e4a
  theorie_hash: f8bcafcf9a6f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'exp.tpid3: five cases, N = 8 … 32 (mpmath, 60 digits); two cases confirm, three contradict up to N = 32.'
    pruefung:
      f2_benutzte_voraussetzungen: Expansion about 0; the series of f has radius s (branching at −s), for natural p f is entire.
      f5_neue_frage: Which fixed point determines the limit spectrum when several come into question? (Trappmann likewise conjectured problems
        in 2008 for x² + x − 1/16.)
      f3_spezialfall: Counterpart to TPID 1 (kn.verm.carleman_eigenwerte) for a function with a branch point.
      f1_folgt_unmittelbar: No. Trivial for s = 1 (triangular matrix).
      f4_uebertragbar: 'To TPID 1: there the lower fixed point a of b^x for 1 < b < η always lies in the (infinite) circle of convergence.'
    bewertung:
      nutzen: Tests whether matrix methods depend on the expansion point.
      richtigkeit: in the generality posed numerically doubtful (three cases up to N = 32 without approach)
    titel: 'TPID 3: eigenvalues of truncated Carleman matrices of (x+s)^p − s tend to 1, p, p², …'
    aussage: |
      **Conjecture (bo198214, TPID 3, 29.06.2008):** For all $s,p>0$ the eigenvalues can be numbered such that $v_{N,k}\to p^k$.
      Motivation: Is the matrix method independent of the expansion point? For $s=1$, 0 itself is a fixed point and the matrix is triangular, then it holds exactly.
      **Measured (exp.tpid3):** $s=3/4$: distance of the first four eigenvalues to $1,p,p^2,p^3$ at $N=32$: $6\cdot10^{-11}$ ($p=2/3$), $3\cdot10^{-4}$ ($p=3/2$, slower).
      But $s=1/2$, $p=1/2$ (fixed point on the boundary $|x|=s$ of the circle of convergence): distance stays at $0.23$; $s=3/10$, $p=1/2$ (fixed point outside): no approach;
      $s=3/10$, $p=2$ (polynomial): no eigenvalue near 2, the spectrum approaches $\{1,0,0,\dots\}$ — that of the superattracting fixed point $-s$.
      In the generality posed, TPID 3 is thereby numerically doubtful; see kn.verm.tpid3_bedingung.
    bereich: $f(x)=(x+s)^p-s$, $s,p>0$; Carleman matrix about 0, truncated to $N\times N$; fixed point $x_0=1-s$ with $f^{\prime}(x_0)=p$, branch
      point $-s$ (for $p\notin\mathbb N$)
    einfach: 'A conjecture about tables that describe a function and its powers: their eigenvalues are supposed to hit the powers of the slope
      at the fixed point. That works — but only if the fixed point is close enough to the expansion point.'
    quellen:
    - stelle: TPID 3 (bo198214, 29.06.2008, post 4)
    - stelle: 'Trappmann 2008: Carleman eigenvalues at two fixed points (x² + x − 1/16)'
  en_theorie:
    beispiel: |
      $s=3/4$, $p=2/3$: distance $6\cdot10^{-11}$ at $N=32$. $s=3/10$, $p=1/2$: distance fluctuates between $0.14$ and $0.92$.
    einordnung: |
      Counterpart to TPID 1 ([[kn.verm.carleman_eigenwerte]]); refinement [[kn.verm.tpid3_bedingung]].
    genau: |
      $f(x)=(x+s)^p-s$ has the fixed point $1-s$ with multiplier $p$. Conjectured: eigenvalues of the $N\times N$ matrix about 0 tend to $1,p,p^2,\dots$
    warum: |
      If the infinite Carleman matrix were conjugate to triangular form, as at the fixed point, it would have the spectrum $\{p^k\}$; the question is whether the sections about 0 inherit that.
      Measured: yes, if $1-s$ lies in the circle of convergence $|x|<s$; no in the three other cases (fixed point on the boundary, outside, and the polynomial $p=2$).
    worum: |
      Truncated Carleman matrices are a computation route to fractional iterates without choosing a fixed point. TPID 3 asks whether their eigenvalues nevertheless hit the right
      fixed-point data, here for the simple function $(x+s)^p-s$.
- id: kn.verm.tpid3_bedingung
  quelle_hash: 9a5c43bbca69
  theorie_hash: 274f49fa9a96
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'exp.tpid3: s = 3/4 (inside) converges for p = 2/3 and 3/2; s = 1/2 (boundary) and s = 3/10 (outside) with p = 1/2 no
      approach up to N = 32; p = 2, s = 3/10: spectrum of the nearer fixed point. Not checked: s just above 1/2, larger N.'
    pruefung:
      f2_benutzte_voraussetzungen: Radius of convergence s of the expansion about 0.
      f5_neue_frage: How does the convergence rate depend on the ratio |1 − s|/s, and what exactly happens on the boundary s = 1/2?
      f3_spezialfall: Refinement of kn.verm.tpid3.
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: 'To every Carleman computation: the matrix about x₀ sees the fixed point only inside the circle of convergence — an explanation
        why the Carleman slog about 0 works for b^x.'
    bewertung:
      recherche: 'Forum: TPID 3 without answer (tid 162), threads 170 and 240 (spectrum of the Carleman matrix) — Trappmann sensed problems with
        two fixed points in 2008, a condition on the circle of convergence I did not find (12.10.2026).'
      nutzen: Sharpens an open forum conjecture.
      richtigkeit: Conjecture, five cases
    titel: TPID 3 holds if the fixed point 1 − s lies in the circle of convergence of the expansion (s > 1/2) — otherwise not
    aussage: |
      **Conjecture (here):** The eigenvalues of the truncated Carleman matrix of $(x+s)^p-s$ about 0 tend to $\{p^k\}$ if and only if the fixed point $x_0=1-s$
      lies in the circle of convergence $|x|<s$ of the expansion, i.e., for $s>1/2$ (for $p\notin\mathbb N$). If it lies outside, the matrix does not see it; for integer $p$
      (entire function) the fixed point closer to the expansion point determines the limit spectrum ($s=3/10$, $p=2$: superattracting at $-s$, spectrum toward $\{1,0,\dots\}$).
    bereich: as kn.verm.tpid3
    einfach: The table is built about the point 0 and “sees” only as far as its series converges. If the fixed point lies farther away, its eigenvalues
      do not hit its slope.
    quellen:
    - stelle: exp.tpid3
    - {}
  en_theorie:
    einordnung: |
      Sharpens [[kn.verm.tpid3]]; to be expected also for TPID 14 ([[kn.frage.tpid14]]).
    genau: |
      Conjecture: eigenvalues $\to\{p^k\}$ exactly for $|1-s|<s$, i.e. $s>1/2$ (for $p\notin\mathbb N$); for integer $p$ the nearer fixed point determines the limit spectrum.
    warum: |
      The Carleman matrix about 0 contains only the Taylor coefficients there; outside the circle of convergence they no longer determine the function in a natural way.
      A fixed point there therefore leaves no trace in the spectrum of the sections. Supported only by five cases.
    worum: |
      The measurements on TPID 3 show a simple pattern: The matrix about 0 “sees” a fixed point only if it lies in the circle of convergence of its series.
