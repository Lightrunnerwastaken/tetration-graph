- id: kn.beob.slog_scheibe
  quelle_hash: 4540504ab15a
  theorie_hash: 550f429d00a9
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: Kneser's slog holomorphic on D (Kneser 1950; numerically evaluated on the whole boundary).
      f5_neue_frage: Rigorous verification with interval arithmetic (boundary of Ω on a grid with error bounds, asymptotics with explicit remainder
        bound).
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: Asymptotically yes (from the logarithm form of slog at L); in the middle range only numerically.
      f4_uebertragbar: 'Other bases $b>\eta$: width $\pi/\operatorname{Im}(\log L_b)\cdot$…, same computation.'
    bewertung:
      nutzen: Only numerical ingredient in the uniqueness theorem for the half-exponential function.
      richtigkeit: numerical, boundary curve up to height 13.6, asymptotics analytic
    titel: 'Shape of slog(D): a horizontally convex band toward L and L̄, everywhere wider than 2'
    aussage: |
      $A$ is holomorphic on $D$ with $T\circ A=\mathrm{id}$, and $\Omega=A(D)$ has this shape:

      (G1) $\operatorname{Re}w\le c_R=A(|L|)=0.3121795528$ on $\Omega$ (maximum of the harmonic $\operatorname{Re}A$ on the boundary, at $z=|L|$).

      (G2) Every horizontal line meets $\Omega$ in **one** segment; its length is at least $2.067$ (on the real axis, $\Omega\cap\mathbb R=(-1.7545,\,0.3122)$) and tends upward to
      $\pi/\operatorname{Im}L=2.3495$. Hence the corridor $\Omega\cap(\Omega-\tfrac12)$ is also wider than $1.5$ at every height.

      (G3) The left boundary satisfies $x\ge-2-0.24\,|y|$; its slope tends to $-\operatorname{Re}L/\operatorname{Im}L=-0.2379$.

      Below ($y<0$) mirror-symmetrically, direction $\bar L$. Measured up to height $13.6$ (there $|z-L|\approx10^{-8}$); above that the asymptotics $A(z)=\log(z-L)/L+c+o(1)$ holds, which gives two parallel
      boundary lines at horizontal distance $\pi/\operatorname{Im}L$.
    bereich: $D=\{|z|<|L|\}$, $L=0.3181+1.3372i$; $A=\operatorname{slog}_e$ (Kneser), $\Omega=A(D)$
    einfach: The super-logarithm bends the disk up to the fixed point L into a slanted band that runs toward L at the top and toward L̄ at the
      bottom. The band is more than two units wide everywhere and never reaches farther to the right than 0.31. Exactly these three properties
      are what the uniqueness proof needs.
  en_theorie:
    beispiel: |
      $\Omega\cap\mathbb R=(-1.7545,\,0.3122)$, width $2.067$; at height $1.43$ about $(-2.14,\,0.16)$; at height $13.2$ about $(-4.95,\,-2.60)$, width $2.349$.
    einordnung: |
      Needed in [[kn.satz.halbexp_beschraenkt]]. A rigorous verification would need interval arithmetic on the boundary and a remainder bound for the asymptotics.
    genau: |
      $\Omega=\operatorname{slog}_e(D)$, $D=\{|z|<|L|\}$:
      - (G1) $\operatorname{Re}w\le0.3121795528=\operatorname{slog}_e(|L|)$;
      - (G2) every horizontal line meets $\Omega$ in a segment of length $\ge2.067$ (at the top $\to\pi/\operatorname{Im}L=2.3495$);
      - (G3) left boundary $x\ge-2-0.24|y|$, slope $\to-\operatorname{Re}L/\operatorname{Im}L=-0.2379$.
    warum: |
      1. Near $L$, $\operatorname{slog}(z)=\log(z-L)/L+c+o(1)$. The disk is there almost a half-plane; $\log$ turns it into a horizontal half-strip of height $\pi$, and the division
         by $L$ rotates it into the direction $-1/L$ — a slanted band of horizontal width $\pi/\operatorname{Im}L$.
      2. $\operatorname{Re}\operatorname{slog}$ is harmonic; its maximum on $D$ lies on the boundary, and there at $z=|L|$ (measured on the whole boundary).
      3. The middle part (between the real axis and height 13.6) was computed: The right boundary arc rises, the left one falls, so every height meets each arc exactly once.
    worum: |
      What does the disk up to the fixed point $L$ look like when mapped with Kneser's super-logarithm? Like a slanted band upward and downward. Its shape is the only
      numerical ingredient in the uniqueness proof for the half-exponential function.
- id: kn.beob.stoerungsreihe_fehler
  quelle_hash: d0fad681edaa
  theorie_hash: 4d351ed62bd1
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'The perturbation series diverges: best order around N = 6–8, error 2·10⁻⁷, and the seams are C¹ automatically'
    aussage: |
      $\int_{-1}^0|\mathrm{sexp}_e-P_N|$ falls from $5.6\cdot10^{-3}$ ($N=1$) to $2.2\cdot10^{-7}$ ($N=6,7$) and then rises again
      ($2.4\cdot10^{-7}$ at $N=8$, $5.4\cdot10^{-7}$ at $N=10$, $2.8\cdot10^{-5}$ at $N=14$): **the series in $u$ diverges**, and one stops at the smallest
      order. For $N=8$ we measure $2.4\cdot10^{-7}$ (two quadratures), the forum states $5.52\cdot10^{-7}$; the largest error is $4.6\cdot10^{-7}$.
      Every $P_N$ satisfies $P_N(-1)=0$, $P_N(0)=1$ and $P_N'(0)=P_N'(-1)$ exactly: if one continues it to all of $\mathbb R$ with $T(x+1)=e^{T(x)}$, the curve
      is automatically once continuously differentiable at the seams (the second derivative jumps).
    bereich: Base $e$, $P_N$ as in kn.konstr.stoerungsreihe, comparison with Kneser on $[-1,0]$
    einfach: 'More steps do not always make the approximation better: up to about six to eight steps it gets more accurate, then worse again.
      This is typical of series that do not converge — one does best to stop at the right point. The nice thing is that the approximation fits
      together at the seams without a kink.'
    pruefung:
      f1_folgt_unmittelbar: The C¹ seam yes ($g_n'(1)-g_n'(0)$ is the derivative of a product of at least two factors that vanish at 0); the errors
        are measured.
      f2_benutzte_voraussetzungen: Kneser values from gp-tetration (40 digits), Gauss–Legendre with 40 nodes and trapezoid rule with 2001 points.
      f3_spezialfall: 'Yes: the same pattern as the Gevrey divergence at the half rank (kn.beob.halbrang_divergenz).'
      f4_uebertragbar: To other bases; there the best order is a function of the base.
      f5_neue_frage: Does $g_n(1/2)$ grow like $n!\,A^{-n}$ (Gevrey-1), and where is the nearest singularity of the Borel transform?
    bewertung:
      nutzen: Shows the strength and the limit of the method and corrects the error figure from the forum downward.
      richtigkeit: numerical, two quadratures agree
    quellen:
    - stelle: Error figure 5.52·10⁻⁷
    - {}
  en_theorie:
    beispiel: |
      Largest error of $P_8$ on $[-1,0]$: $4.6\cdot10^{-7}$; jump of the second derivative at the seam: $8.7\cdot10^{-6}$.
    einordnung: |
      Construction: [[kn.konstr.stoerungsreihe]]; same divergence at the half rank: [[kn.beob.halbrang_divergenz]].
    genau: |
      $\int_{-1}^0|\mathrm{sexp}_e-P_N|$: $5.6\cdot10^{-3}$, $8.5\cdot10^{-4}$, …, $2.2\cdot10^{-7}$ ($N=6,7$), $2.4\cdot10^{-7}$ ($N=8$), $2.8\cdot10^{-5}$ ($N=14$).
    warum: |
      Eventually the coefficients $g_n$ grow roughly like $n!$ — typical of perturbation series at parabolic points (the same Gevrey divergence as at the
      half rank). Such series first get better and then worse; the best accuracy is reached at the smallest term.
      That the seams are $C^1$ follows from the construction: the right side of the difference equation is a product of at least two factors that vanish at 0.
    worum: |
      How good is the perturbation series really, and why does one stop at order 8?
