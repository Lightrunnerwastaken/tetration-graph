      nutzen: Fourth term of the sequences from TPID 10.
      richtigkeit: numerical (30 digits; engine 31.6 digits at η₆)
    titel: 'η₆ = 1.7991212361… and e₆ = 3.4422346477…: the hexation touches y = x'
    aussage: |
      The hexation $H_b(x)=b\uparrow\uparrow\uparrow\uparrow x$ touches the line $y=x$ exactly at
      $$\eta_6=1.7991212361288126867235670070\ldots,\qquad e_6=3.44223464771689323\ldots,\qquad H_{\eta_6}(e_6)=e_6,\ H_{\eta_6}'(e_6)=1.$$
      For $b<\eta_6$, $H_b$ has real fixed points (for $b=1.78$ the minimum of $H_b(x)-x$ lies at $x=4.467$ with $-0.699$), for $b>\eta_6$ none
      (for $b=1.80$: minimum $+0.0219$ at $x=3.407$). Curvature at the point of tangency $H''(e_6)/2=0.44293$. Since $\eta_6>\eta_5$, this level requires the Kneser-type hexation.
    bereich: 'hexation $H_b$ for $b>\eta_5$: Kneser-type at the repelling complex fixed point of the pentation (engine knhexinit in the gp-tetration
      fork), $b$ near $1.8$'
    einfach: 'One level above η₅ and e₅ it continues: The hexation touches the line y = x at the base 1.7991, at the point 3.4422. This is the
      fourth term of the sequence that begins with e ≈ 2.718 and η ≈ 1.445.'
    quellen:
    - {}
    - stelle: knhexinit in the fork fatou_fork.gp (exp-079, 09.10.2026, local)
    - stelle: 'Levenstein, post 5 (03.09.2017): 1.799'
  en_theorie:
    beispiel: |
      The location of the minimum moves quickly: at $b=1.78$ it lies at $4.47$, at $1.795$ at $3.62$, at $1.80$ at $3.41$ — the hexation reacts very strongly
      to the base in this range. The curvature at the point of tangency grows from level to level: $0.293$ (tetration), $0.377$ (pentation), $0.443$ (hexation).
    einordnung: |
      The fourth term of the sequences from [[kn.verm.tpid10]]. It depends on the chosen continuation of each level: Kneser for the tetration, regular for the pentation,
      Kneser-type for the hexation.
    genau: |
      $$\eta_6=1.7991212361288126867235670070\ldots,\qquad e_6=3.44223464771689323\ldots$$
      with $H_{\eta_6}(e_6)=e_6$, $H_{\eta_6}'(e_6)=1$ and $H_{\eta_6}''(e_6)/2=0.44293>0$.
      - For $b<\eta_6$ the hexation intersects the line (for $b=1.78$ it lies below it between about $2.7$ and $5.1$, lowest at $x=4.47$ with $-0.70$).
