    pruefung:
      f2_benutzte_voraussetzungen: 'The choice of hexation: Kneser-type at the repelling fixed point q of the pentation (the pentation regular
        at the negative fixed point of Kneser''s tetration).'
      f5_neue_frage: 'Law of the distances: 2 − η_n falls in the four terms very uniformly like n^(−1.47) → kn.verm.tpid10.'
      f3_spezialfall: Level 6 of the sequence (e, η), (e₄, η₄), (e₅, η₅), (e₆, η₆).
      f1_folgt_unmittelbar: No (measured, same method as for η₅).
      f4_uebertragbar: Level 7 would need a Kneser-type heptation above η₆.
    bewertung:
      recherche: 'Correction 12.10.2026 (literature map L2): S. Levenstein gave in 2017 (forum tid 1177, post 5) with the same chain — Kneser-type
        hexation at the conjugate fixed points of the pentation — the bound 1.799 up to which the heptation is bounded: η₆ to three digits. New
