# übersetzten deutschen Texte. Nicht von Hand ändern, ausser Fehler in einzelnen Texten – dann `geprueft` anpassen.
- id: kn.beob.carleman_rate
  quelle_hash: 018358c37bba
  theorie_hash: f9e7a42380f2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: Kneser reference to 80 digits; solving with $80+5n$ digits.
      f5_neue_frage: 'Why algebraic? Conjecture: the logarithmic singularities of slog at $L,\bar L$ limit the Galerkin approximation. Acceleration
        by subtracting the singularity part?'
      f3_spezialfall: —
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: Same measurement for $b=\sqrt2$ against the regular solution (everything explicit there).
    bewertung:
      recherche: Forum mentions only “5–10+ digits”, no rate.
      nutzen: Quantifies how far the Carleman method carries.
      richtigkeit: numerical
    titel: Intuitive slog converges only algebraically
    aussage: 'Maximum error at interior points $\approx C\,n^{-3.8}$ ($16\le n\le128$); a geometric ansatz $e^{-cn}$ fits ten times worse. At
      $n=128$: 8 digits.'
  en_theorie:
    beispiel: |
      $1.7\cdot10^{-5}$ ($n=16$), $1.6\cdot10^{-6}$ ($32$), $1.1\cdot10^{-7}$ ($64$), $9.2\cdot10^{-9}$ ($128$); fitted exponent $-3.81$.
    einordnung: |
      Supports [[kn.verm.carleman_kneser]], but also shows how far the method carries. A control test would be base $\sqrt2$, where the regular solution is explicit.
    genau: |
      Maximum error at interior points $\approx C\,n^{-3.8}$ for $16\le n\le128$; a geometric ansatz $e^{-cn}$ fits ten times worse. At $n=128$: 8 digits.
    warum: |
      Measured. Presumed reason: the logarithmic singularities at $L,\bar L$ slow the method down. One way out would be to subtract the singularity part beforehand.
    worum: |
      The intuitive super-logarithm gets better, but only slowly: If one doubles $n$, the error becomes about ten to fifteen times smaller — not, as
      one would hope, by a fixed number of digits per step.
- id: kn.beob.decation_reell
  quelle_hash: c6e2f45ad188
  theorie_hash: 3879aa11cdbe
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: Real decation at base 1.83 via backward Koenigs
    aussage: |
      With $f=H_9(1.83,\cdot)$, attracting fixed point $a=2.3628$ and $\lambda=f'(a)=0.18261$ we have for $0<t<1$
      $$z_k(t)=f^{-k}\bigl(a+\lambda^t(f^k(1)-a)\bigr)=H_{10}(1.83,t)+C(t)\lambda^k+O(\lambda^{2k})$$
      (real inverse branch). From $k=5,7,9$ with a Richardson step: $H_{10}(1.83,0.5)\approx1.4567116$, $H_{10}(1.83,1.5)\approx2.0842796$ (deviation $\le3\cdot10^{-9}$).
      The full complex Cauchy sampling of the nested nonation did not reach the goal in the same time.
    einfach: 'For the tenth hyperoperation there is a cheap way to compute: backward from an attracting fixed point, without complex numbers.'
    pruefung:
      f1_folgt_unmittelbar: No (computation; convergence statement under the Koenigs hypotheses).
      f2_benutzte_voraussetzungen: Real inverse branch, κ′ ≠ 0; real heights only, no negative continuation.
      f3_spezialfall: Koenigs method as for regular tetration (it.satz.koenigs).
      f4_uebertragbar: Every bounded level below its limit base.
      f5_neue_frage: Is this enough for η₉ and the bounded levels up to H₁₁?
    bewertung:
      nutzen: Cheap route to higher bounded levels.
      richtigkeit: numerical, 7–8 digits
    quellen:
    - stelle: forschung/eta_hyperoperationen/BERICHT.md §5, MATHEMATIK.md §9
  en_theorie:
    beispiel: |
      $H_{10}(1.83,0.5)\approx1.4567116$.
    einordnung: |
      The same principle as regular tetration: [[it.satz.koenigs]].
    genau: |
      Backward iteration from an attracting fixed point: $z_k(t)=f^{-k}(a+\lambda^t(f^k(1)-a))\to H_{10}(1.83,t)$ with error $O(\lambda^k)$.
    warum: |
      Near the fixed point $f$ is almost the scaling by $\lambda$; there the fractional step $\lambda^t$ is clear, and $f^{-k}$ carries it back (Koenigs).
    worum: |
      A cheap way to compute the tenth hyperoperation below its limit base.
- id: kn.beob.einheitliche_raenge
  quelle_hash: 7a42a0ddebeb
  theorie_hash: 6e64d37bb538
  herkunft:
    modell: opus
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: 'All ranks the Kneser way: regular and Kneser-type pentation differ by a wave of 10⁻⁵'
    bereich: Base 2; superfunction S with S(0)=1, S(x+1)=f(S(x)), holomorphic on a strip, with limits towards the fixed-point pair of f as Im
      x → ±∞ (generalized Cauchy solver)
    aussage: |
      With a solver for arbitrary lower functions, $H_4,H_5,H_6$ to base 2 can be computed uniformly in the Kneser way ($H_4$ matches Kneser to $10^{-12}$, also at complex heights; functional equation for $H_5,H_6$ to $4\cdot10^{-10}$).
      Fixed-point pairs: $L_4=1.46982+1.66434i$, $L_5=1.80768+1.59692i$, $L_6=2.00815+1.51564i$.
      The regular pentation used so far (at the real fixed point $-1.744$) differs from the Kneser-type one by a pure θ wave $a\sin2\pi x+b(1-\cos2\pi x)$, $a=-4.40\cdot10^{-6}$, $b=3.46\cdot10^{-6}$; for $H_6$ the difference is $1$–$3\cdot10^{-5}$ and θ-like.
      Rank 7 still fails (the inverse of the non-injective $H_6$ changes branch at the boundary). For the half rank, the uniform selection at ranks 3–6 changes only $10^{-6}$–$10^{-5}$ — **the limiting factor is the number of ranks, not the selection.** The θ-independent rank descent $R(S)(y)=S(S^{-1}(y)+1)$ is numerically unstable.
      $H_{3.5}(2,0.5)\approx1.4428\pm3\cdot10^{-4}$ remains; no functional equation for the half rank alone was found (the condition is an operator equation).
    einfach: The higher hyperoperations can now all be built with the same method as Kneser's tetration, up to the sixth. The older method for
      pentation differs from it only by a tiny wave. For more digits of the half step, however, even higher hyperoperations would be needed.
    pruefung:
      f1_folgt_unmittelbar: No (calculation); proved is only that the rank descent is θ-independent.
      f2_benutzte_voraussetzungen: Cauchy solver with limits towards the fixed-point pair; fits of the wave form.
      f3_spezialfall: 'Yes: for rank 4 the Kneser tetration (kn.konstr.kneser).'
      f4_uebertragbar: Rank ≥ 7 with a tabulated, branch-faithful Abel function (estimated 1–2 days of development, then 10–30 min per rank).
      f5_neue_frage: Does the wave between the regular and the Kneser-type selection grow with the rank (conjectured ~10⁻³ at ranks 8–9)?
    bewertung:
      richtigkeit: numerical
      nutzen: First uniform Kneser-type pentation and hexation to base 2; shows that the previous selections differ only by small waves.
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/BERICHT_ETAPPE6.md
  en_theorie:
    worum: |
      Whether the higher hyperoperations to base 2 can be built with one single method — and how much the methods differ.
    genau: |
      Regular and Kneser-type pentation differ by a wave of size $5\cdot10^{-6}$, the hexations by $1$–$3\cdot10^{-5}$.
    warum: |
      Two superfunctions of the same function with the same initial value differ by a 1-periodic shift of the height; measured small means: the selections lie very close to each other.
    beispiel: |
      Fixed point of the pentation to base 2 (for the Kneser-type hexation): $L_5=1.80768+1.59692i$.
    einordnung: |
      Rank continuation: [[kn.beob.halbrang_rangfortsetzung]]; selection dependence of the critical bases: [[kn.satz.eta_auswahl]].
- id: kn.beob.eta4_interpolation
  quelle_hash: 53a864a366f3
  theorie_hash: 0b5534751ec3
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'exp.tpid10_abstaende: s(2) and s(3) recomputed to 12 digits; s(3) lies 2.5·10⁻⁴ below η₄, so the maximum lies just to
      the right of 3.'
    pruefung:
      f2_benutzte_voraussetzungen: Only the super-roots at integer arguments and the assumption that the interpolation polynomials converge to
        a smooth function.
      f5_neue_frage: If the interpolation converges, it fixes η₄ without a continuation. Why does it hit the Kneser value and not the matrix value
        (kn.beob.eta4_matrix)?
      f3_spezialfall: Characterization 2 from kn.beob.tetra_euler (maximum of the self-tetra-root), here without a chosen tetration.
      f1_folgt_unmittelbar: No. That the interpolation converges and agrees with the Kneser continuation is not proved (related to TPID 12/13,
        fp.frage.tpid12_13).
      f4_uebertragbar: 'One level higher: a self-penta-root from integer arguments would give η₅, e₅ without a Kneser-like hexation — not attempted.'
    bewertung:
      nutzen: An approach to η₄ that does not have to choose a continuation of tetration.
      richtigkeit: numerical (forum; 7–8 digits agreement with Kneser)
    titel: 'Without choosing a continuation: η₄ and e₄ from the interpolation of the self-super-root (Robbins 2009, mike3 2010)'
    aussage: |
      At integer arguments $s(n)$ is unique, because ${}^{n}a$ increases in $a$: $s(1)=1$, $s(2)=\ln2/W(\ln2)=1.559610469462\ldots$, $s(3)=1.635078474636\ldots$
      A. Robbins (2009) computed $s(n)$ accurately at several hundred integer arguments and passed a Lagrange polynomial through them; mike3 (2010) used
      a Newton series at $a=1$. Both curves have a maximum: Robbins at $x\approx3.0885325$ with value $\approx1.6353245$, mike3 at $x\approx3.089$
      with $\approx1.635$. The Kneser computation (kn.beob.tetra_euler) gives $e_4=3.08853227\ldots$, $\eta_4=1.63532450\ldots$ — Robbins' values agree to
      about seven and eight digits, respectively. The value of the maximum is the largest base whose infinite pentation converges (characterizations 2 and 3 in kn.beob.tetra_euler).
    bereich: Self-super-root $s(x)$ with ${}^{x}s(x)=x$; unique at integer $x\ge1$, without any continuation of tetration
    einfach: 'The super-root answers the question: Which base gives exactly n for n levels? For integer n one needs no half towers for this. If
      one draws a smooth curve through these points, its peak lies exactly where the much more laborious Kneser computation finds η₄ and e₄.'
    quellen:
    - stelle: 'Robbins, post 1 (11.04.2009; coordinates corrected in posts 4–5), post 9: exact points'
    - stelle: mike3, posts 1 and 3 (03. and 11.07.2010)
    - stelle: Characterization 2 (attribution to Mike)
  en_theorie:
    beispiel: |
      $s(2)=\ln2/W(\ln2)=1.559610\ldots$ (since $a^a=2$), $s(3)=1.635078\ldots$ (since $a^{a^a}=3$). Already $s(3)$ lies only $2.5\cdot10^{-4}$ below $\eta_4$ —
      the peak of the curve lies just to the right of 3.
    einordnung: |
      One of several approaches to TPID 10 ([[kn.verm.tpid10]]); besides it the matrix slog ([[kn.beob.eta4_matrix]]) and Kneser ([[kn.beob.tetra_euler]]).
    genau: |
      The self-super-root $s(x)$ is the base with ${}^{x}s(x)=x$. For integer $n$ it is unique, because ${}^{n}a$ strictly increases in $a$.
      Robbins (2009) laid an interpolation polynomial through several hundred values $s(n)$, mike3 (2010) a Newton series. The maximum of the
      interpolated curve lies at $x\approx3.0885325$ with value $\approx1.6353245$ — Kneser gives $e_4=3.08853227\ldots$, $\eta_4=1.63532450\ldots$
    warum: |
      1. If $T_b$ is any increasing tetration, then $s(x)$ is the solution of $T_{s}(x)=x$; the maximum of $s$ is the largest base for which $T_b$ has a
         fixed point above 1 — that is $\eta_4$, and the location is $e_4$ (characterization 2 in [[kn.beob.tetra_euler]]).
      2. At integer arguments $s(n)$ depends on no choice. If the interpolation converges to “the right” function, it determines the maximum without a choice.
      3. That it does so is not proved — TPID 12 ([[fp.frage.tpid12_13]]) poses the same question. The agreement to seven digits with Kneser is an indication.
    worum: |
      To compute $\eta_4$ and $e_4$ one normally needs a tetration for fractional heights — and with it a choice of which one.
      But there is a detour that gets by without this choice: the super-root at integer arguments.
- id: kn.beob.eta4_matrix
  quelle_hash: dc2f39dc8a93
  theorie_hash: f953316b2f4e
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'Sign argument checked: Kneser computations just below η₄ (nuninho, tid 262 post 29) lie below or very close to e₄, none
      above 3.0885330. Own matrix computation at η₄ not yet done.'
    pruefung:
      f2_benutzte_voraussetzungen: That the matrix tetration at this base is increasing and has the fixed-point structure as for Kneser (two fixed
        points near e₄).
      f5_neue_frage: 'Recompute the matrix slog at η₄ with growing dimension: does the matrix e₄ tend to 3.0885322718 (then truncation error,
        supported by kn.beob.carleman_rate) or does a gap remain?'
      f3_spezialfall: Counterpart at level 4 to kn.verm.carleman_kneser (does the matrix slog tend to Kneser?).
      f1_folgt_unmittelbar: The inequality “limit < e₄ of the tetration used” follows from monotonicity (as kn.beob.unendliche_hexation f1); the
        numerical value is measured.
      f4_uebertragbar: Every key figure that hinges on a touching amplifies differences between continuations (square-root law near the touching).
    bewertung:
      nutzen: Shows how sensitively η₄/e₄ react to the chosen continuation; touchstone for the matrix slog.
      richtigkeit: numerical (forum, one computation)
    titel: 'Matrix slog instead of Kneser: 1.6353244967↑↑↑∞ ≈ 3.0885549 (nuninho 2009) — 2.3·10⁻⁵ above Kneser''s e₄'
    aussage: |
      nuninho1980 computed in April 2009 with Robbins' matrix slog (200 dimensions, 410 digits of working precision) the infinite pentation
      $1.6353244967\uparrow\uparrow\uparrow\infty\approx3.0885549441$. Kneser's value (Levenstein 2010) is $e_4=3.0885322718\ldots$; the matrix value lies
      $2.3\cdot10^{-5}$ **above** it. Truncation of the base does not explain this: for $b<\eta_4$, $b\uparrow\uparrow\uparrow m$ increases monotonically toward the
      lower of the two fixed points near $e_4$, so the limit lies below the $e_4$ of the tetration used. The matrix slog with 200 dimensions thus
      has an $e_4\ge3.08855$. bo198214 had already emphasized at the time that $\eta_4$ and $e_4$ may depend on the chosen continuation.
    bereich: Tetration from Robbins' truncated matrix slog (30 and 200 dimensions), base $1.6353244967$ (just below $\eta_4$)
    einfach: With a different computation method for half towers (a large table instead of Kneser's construction), almost the same number came
      out in 2009 — but different in the fifth decimal place. Whether this is due to the truncation of the table or whether the methods really
      give different tetrations is open.
    quellen:
    - stelle: nuninho1980, posts 2, 11, 14 (01.–07.04.2009); bo198214, post 13 (06.04.2009)
  en_theorie:
    einordnung: |
      Touchstone for the question whether the matrix slog tends to Kneser ([[kn.verm.carleman_kneser]], [[kn.beob.carleman_rate]]); approach (b) in [[kn.verm.tpid10]].
    genau: |
      Matrix slog after Robbins with 200 dimensions: $1.6353244967\uparrow\uparrow\uparrow\infty\approx3.0885549441$. Kneser: $e_4=3.0885322718\ldots$ Difference $+2.3\cdot10^{-5}$.
    warum: |
      1. For $b<\eta_4$, $T_b$ has two fixed points near $e_4$; the sequence $1,b,T_b(b),\dots$ increases monotonically and stays below the lower one.
      2. Hence the limit is smaller than the touching point of the tetration used. Truncating the base pushes the value down, not up.
      3. A value above Kneser's $e_4$ therefore means: the matrix tetration with 200 dimensions has a larger $e_4$ — through truncation or because it is a different tetration.
    worum: |
      The same number $e_4$, computed by another method, comes out different in the fifth decimal place in 2009. This shows how strongly
      the numbers from TPID 10 depend on the chosen continuation — or how slowly some methods converge.
- id: kn.beob.eta7_eta8
  quelle_hash: b89e20b5791b
  theorie_hash: e83718ebfdcb
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: 'η₇ = 1.83975866… and η₈ = 1.86814658…: heptation and octation touch y = x'
    aussage: |
      Heptation $H_7$ and octation $H_8$ touch the diagonal ($H_r(\eta_r,e_r)=e_r$, $\partial_xH_r(\eta_r,e_r)=1$) at
      $$\eta_7=1.8397586607233305769\ldots,\ e_7=3.5434897855274943\ldots;\qquad \eta_8=1.8681465773573\ldots,\ e_8=3.62060089762\ldots$$
      Secured by two independent runs: $\eta_7$ to about 25 digits, $e_7$ to 23; $\eta_8$ to 13, $e_8$ to 11. The sequence continues:
      $1.44467\to1.63532\to1.73736\to1.79912\to1.83976\to1.86815$, and $e_r$: $2.71828\to\dots\to3.44223\to3.54349\to3.62060$.
      The distance law from the terms $r=3\ldots6$ (kn.beob.tpid10_gesetz) predicted $\eta_7\approx1.83971$, $\eta_8\approx1.86822$ — errors $-5\cdot10^{-5}$ and $+8\cdot10^{-5}$.
      The local exponents $\ln\frac{2-\eta_{r-1}}{2-\eta_r}/\ln\frac r{r-1}$ are $1.4619,\ 1.4708,\ 1.4705,\ 1.4662,\ 1.4603$ ($r=4\ldots8$) — they decrease at the end; $1.467$ is therefore not a secured asymptotic.
      TPID 11 ($\eta_r^2<e_{r-1}$) continues to hold: $\eta_7^2=3.3847<e_6$, $\eta_8^2=3.4900<e_7$.
    bereich: 'Continuation chain: odd levels regular at the negative real repelling fixed point of the level below, even levels below the touching
      base at the positive attracting fixed point, above it Kneser-like (two-arc Abel selection, experimental for H₈)'
    einfach: For every higher hyperoperation there is a limit base up to which the next hyperoperation stays bounded. We knew these up to hexation;
      now two more terms have been computed accurately. They keep approaching 2 — whether they really tend to 2 is not proved.
    pruefung:
      f1_folgt_unmittelbar: 'No (computation: Newton on $\partial_xH_r-1$ with Cauchy derivatives, secant for the minimum value).'
      f2_benutzte_voraussetzungen: The chosen continuation chain; local fold structure ($\partial_x^2H_r>0$). That the touching is the global
        threshold requires kn.satz.schwellen_monoton and is not proved for the levels built.
      f3_spezialfall: Continuation of kn.beob.stufe6.
      f4_uebertragbar: η₉ (nonation) would be the next touching base — not computed; nonation at b = 2 and 1.83 has been built.
      f5_neue_frage: Why does the local exponent decrease? Is $2-\eta_r\sim C\,r^{-3/2}$ with a log correction?
    bewertung:
      nutzen: Two new terms for TPID 10 and a genuine test of the distance law.
      recherche: Levenstein 2017 (tid 1177) gave ≈ 1.839 for the octation limit (3 digits); η₈ and exact values not found (literature map 12.10.2026).
      richtigkeit: numerical, two independent precisions; no interval certificates
    quellen:
    - stelle: forschung/eta_hyperoperationen/BERICHT.md §§2–3, 7; eta_values.csv
    - stelle: 'Levenstein 2017: octation bounded up to ≈ 1.839'
  en_theorie:
    beispiel: |
      The distance law $2-\eta_r\approx2.785\,r^{-1.467}$ from the four old terms predicted $\eta_7=1.83971$ — measured $1.83976$.
    einordnung: |
      Previously known: [[kn.beob.stufe6]], Levenstein's three digits [[kn.beob.hoehere_etas]]. Conjecture: [[kn.verm.tpid10]]. What the threshold means: [[kn.satz.schwellen_monoton]].
    genau: |
      $\eta_7=1.83975866072333\ldots$ (25 digits secured), $\eta_8=1.86814657735734\ldots$ (13 digits); also $e_7=3.54348978552749\ldots$, $e_8=3.62060089762\ldots$
    warum: |
      One looks for the minimum of $H_r(b,x)-x$; Newton on $\partial_xH_r=1$ with derivatives from complex Cauchy samplings, an outer secant sets the minimum to zero.
      Two runs with different precision, contour, and number of points secure the digits.
    worum: |
      For every hyperoperation $H_r$ there is a limit base $\eta_r$: there $H_r(\eta_r,\cdot)$ touches the diagonal, and up to it the next hyperoperation stays bounded.
- id: kn.beob.halbrang_basis2
  quelle_hash: fe58489aa07b
  theorie_hash: c63655b6d7ac
  herkunft:
    modell: opus
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: 'H₃.₅(2, x): a half hyperoperation between 2^x and tetration, to about 4 digits'
    bereich: 'Selection: height class $\mathcal A$ (kn.satz.rangjets_exppoly), Newton series in the rank (Levin-accelerated), sum in $\varepsilon$
      up to the smallest term (order $\le7$)'
    aussage: |
      The half-rank jet $H_{3.5}(2,x)\approx x+1+\sum_{j\le7}u_j(x)$ for the actual deviation $2^x-x-1$ gives (uncertainty about $\pm10^{-4}$):
      $H_{3.5}(2,0.25)=1.21246$, $H_{3.5}(2,0.5)=1.44302$, $H_{3.5}(2,0.75)=1.70164$, $H_{3.5}(2,1.5)=2.78231$, $H_{3.5}(2,-0.5)=0.58923$, $H_{3.5}(2,0.5+0.5i)\approx1.3884+0.4720i$.
      For comparison at $x=0.5$: $2^{0.5}=1.414214$, tetration (Kneser) $1.458782$, $H_{4.5}(2,0.5)=1.46827$. The ladder is monotone in the rank: increasing left of 1, decreasing to the right.
      $H_{3.5}(2,1)=2$, $H_{3.5}(2,2)=4$ hold exactly — but they are built into every linear rank continuation and do not test the selection. The first term agrees with the closed formula to 34 digits.
    einfach: 'For the first time there are numbers for a hyperoperation “three and a half” at base 2: they lie neatly between the power and tetration.
      But they are accurate only to about four digits, because the calculation breaks down after that.'
    pruefung:
      f1_folgt_unmittelbar: No (calculation).
      f2_benutzte_voraussetzungen: The chosen selection (height class, Newton series in the rank, optimal truncation); rank continuation not certified
        (Levin, error ≤ 2e-6 per order).
      f3_spezialfall: 'no'
      f4_uebertragbar: Control values (±1e-4) for every future construction of H₃.₅.
      f5_neue_frage: More digits via Borel summation? → kn.beob.halbrang_divergenz
    bewertung:
      richtigkeit: numerical, about 4 digits
      nutzen: First concrete values of a half hyperoperation with rank structure.
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/BERICHT.md, tables stage 1
  en_theorie:
    worum: |
      First numbers for a hyperoperation between power and tetration at base 2.
    genau: |
      $H_{3.5}(2,0.5)=1.44302\pm10^{-4}$, between $2^{0.5}=1.41421$ and $2\uparrow\uparrow0.5=1.45878$.
    warum: |
      Every order of the expansion is known exactly for integer ranks; it is continued in the rank by a Newton series and evaluated at $n=\tfrac12$; the sum is taken up to the smallest term.
    beispiel: |
      The ladder at $x=0.5$: $1.41421$ (power), $1.44302$ (rank 3.5), $1.45878$ (tetration), $1.46827$ (rank 4.5).
    einordnung: |
      Test against Kneser: [[kn.beob.halbrang_kneser_test]]; limit of the method: [[kn.beob.halbrang_divergenz]].
- id: kn.beob.halbrang_divergenz
  quelle_hash: 39e1a888f8f4
  theorie_hash: 36ff1da48572
  herkunft:
    modell: opus
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: 'Limit of the expansion around x+1: the series diverges, and from order 8 on the rank continuation is missing'
    aussage: |
      (a) The $\varepsilon$ series diverges: at rank 1 the terms fall to about $3\cdot10^{-5}$ ($j\approx6\ldots10$) and then grow factorially (up to $10^{18}$ at $j=52$), consistent with Gevrey-1; Borel–Padé does not stabilize.
      (b) From order 8 on, the integer rank jets grow exponentially in the rank, $c_n^{(j)}\sim\rho_j^n$ with height-independent rates $|\rho_j|\approx7.6,\ 28,\ 117,\ 470,\ 2667$ ($j=8\ldots12$, partly negative).
      Then the Newton continuation in $n$ diverges ($|\rho-1|>1$), and for $|\log|\rho||\ge\pi$ the growth type no longer determines the continuation (both proved elementarily) — the half-rank jet is not defined from order 8 on with this selection.
      Underlying reason: as $\varepsilon\to0$ the fixed points of $f_\varepsilon$ move to $\infty$ (for $\varepsilon<0$, $f_\varepsilon$ has two real fixed points) — the expansion around the successor is degenerate.
    einfach: The calculation “plus 1 and then small corrections” works only to about four digits. After that the corrections grow again, and for
      the finer corrections a half step is no longer determined at all.
    pruefung:
      f1_folgt_unmittelbar: No (measured; the divergence criteria are proved elementarily).
      f2_benutzte_voraussetzungen: Rates from ranks up to n = 40; Gevrey order only by fit (A ≈ 7–9, imprecise).
      f3_spezialfall: 'no'
      f4_uebertragbar: Every expansion around a degenerate reference point.
      f5_neue_frage: Rank continuation in Borel space instead of term by term; explanation of the rates ρ_j; expansion around a non-degenerate
        reference point.
    bewertung:
      richtigkeit: numerical; criteria proved
      nutzen: Names the actual obstacle on the way to H₃.₅.
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/BERICHT.md, section “Was offen ist”
  en_theorie:
    worum: |
      Why the calculation stops at about four digits.
    genau: |
      The series in $\varepsilon$ diverges (Gevrey-1-like), and from order 8 on the rank coefficients grow like $\rho^n$ with large $|\rho|$ — then the continuation in the rank is no longer determined.
    warum: |
      The successor $x+1$ has no fixed point; the fixed points of $x+1+\varepsilon d(x)$ run to infinity as $\varepsilon\to0$. An expansion around such a degenerate point typically diverges.
    beispiel: |
      Rank 1: smallest term $\approx3\cdot10^{-5}$ at orders 6–10, at order 52 already $10^{18}$.
    einordnung: |
      Similar lesson: [[kn.gescheitert.polynom_rekonstruktion]]; open question: [[kn.frage.halber_rang]].
- id: kn.beob.halbrang_kneser_test
  quelle_hash: ae53e8825cc7
  theorie_hash: c9434b4c2d6e
  herkunft:
    modell: opus
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: Two half steps give tetration — consistent with Kneser up to 10⁻⁴
    aussage: |
      In the construction of kn.beob.halbrang_basis2, two half steps give the perturbative tetration (rank-1 jet, 52 orders, optimal truncation). Its distance to the Kneser tetration $2\uparrow\uparrow x$:
      $7.7\cdot10^{-5}$ ($x=0.25$), $2.3\cdot10^{-4}$ ($0.5$), $1.3\cdot10^{-4}$ ($0.75$), $1.5\cdot10^{-4}$ ($1.25$), $2.3\cdot10^{-4}$ ($1.5$), $3.1\cdot10^{-4}$ ($1.75$), $7.8\cdot10^{-4}$ ($0.5+0.5i$);
      Kneser lies inside the band of partial sums at all real points. The rank recursion $H_{4.5}(x+1)=H_{3.5}(H_{4.5}(x))$ holds order by order to $10^{-34}$ (order 1) up to $\le2\cdot10^{-6}$.
      **Consistent with Kneser, but no proof:** a tetration differing from Kneser by a 1-periodic θ below about $10^{-4}$ would be equally consistent. The linear approximation (distance $0.045$) is excluded.
    einfach: 'The most important test: if you take the half step twice, the real tetration must come out. That works to about four digits, and
      it fits Kneser''s solution — this calculation cannot test more precisely.'
    pruefung:
      f1_folgt_unmittelbar: No (calculation).
      f2_benutzte_voraussetzungen: Kneser values from the fatou.gp fork (40 digits); truncation of the divergent series at the smallest term.
      f3_spezialfall: 'no'
      f4_uebertragbar: The same test decides every better summation.
      f5_neue_frage: Does a Borel summation in ε single out exactly Kneser?
    bewertung:
      richtigkeit: numerical, resolution about 1e-4
      nutzen: First indication that the half rank at base 2 fits the Kneser tetration.
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/BERICHT.md, stage 2
  en_theorie:
    worum: |
      Whether the half step really is a half step: applied twice, tetration must come out.
    genau: |
      Distance to the Kneser tetration $0.8$ to $3\cdot10^{-4}$ at the real test points; Kneser lies inside the band of partial sums.
    warum: |
      A selection that hits a “wrong” half step would produce a different tetration; the linear approximation, for example, is off by $0.045$.
    beispiel: |
      $x=0.25$: sum $1.224284$, Kneser $1.224361$.
    einordnung: |
      The values: [[kn.beob.halbrang_basis2]]; Kneser: [[kn.konstr.kneser]].
- id: kn.beob.halbrang_rangfortsetzung
  quelle_hash: 5fc87613513e
  theorie_hash: 5ae8156826e7
  herkunft:
    modell: opus
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: 'Second route to H₃.₅(2, x): the full hyperoperations continued in the rank — same limit, and boundedness selects nothing here'
    aussage: |
      The full hyperoperations $H_N(2,x+iy)$, $N=3\ldots9$ (for $|\operatorname{Im}x|\ge1$ only $N\le5$), continued in the rank to $N=3.5$ by a Newton series, give
      $H_{3.5}(2,0.5)=1.44246$, $H_{3.5}(2,1.5)=2.78254$ (last correction about $2\cdot10^{-4}$ each); distance to the perturbative calculation (kn.beob.halbrang_basis2) $0.9$–$12\cdot10^{-4}$, worse at $x=-0.5$ ($5\cdot10^{-3}$).
      The rank recursion $H_{4.5}(x+1)=H_{3.5}(H_{4.5}(x))$ holds to $3\cdot10^{-6}$–$1.2\cdot10^{-4}$ (real). Best control values from both routes: $H_{3.5}(2,0.5)\approx1.4428\pm3\cdot10^{-4}$, $H_{3.5}(2,1.5)\approx2.7824\pm2\cdot10^{-4}$.
      **The boundedness rule (kn.beob.kneser_beschraenkte_summe) selects nothing here** (proved elementarily): every rank continuation $\sum_kw_k(s)H_{3+k}(z)$ with height-independent weights is vertically bounded, because every $H_N$ is. The θ freedom is fixed only through a functional equation.
      “Two half steps = Kneser” is no test on this route (the interpolation returns $H_4$ by construction). The ranks come from different selections (Kneser, regular, two-arc); at complex heights the rank sequence has kinks, which limits the accuracy.
    einfach: A second, independent route gives the same values for the hyperoperation “three and a half” to about three to four digits. It cannot
      get more accurate this way, because the higher hyperoperations are built with different methods and because the rule “stay bounded” makes
      no decision here.
    pruefung:
      f1_folgt_unmittelbar: No (measured); proved is only the boundedness of every rank continuation with height-independent weights.
      f2_benutzte_voraussetzungen: Hyperoperations from the continuation chain of the main round; the engine's hexation fails for |Im x| ≥ 1.
      f3_spezialfall: 'no'
      f4_uebertragbar: Compute all ranks with the same Kneser-type selection (Cauchy solver from stage 4 generalized), then solve U = H₃.₅ and
        V = Kneser superfunction of U as a coupled problem.
      f5_neue_frage: Is there a functional equation for the half rank U alone?
    bewertung:
      richtigkeit: numerical, about 3–4 digits; one partial statement proved
      nutzen: Independent confirmation of the H₃.₅ values and a precise statement of what is missing next.
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/BERICHT_ETAPPE5.md
  en_theorie:
    worum: |
      A second route to the half rank: instead of expanding around “plus 1”, interpolate the finished hyperoperations $H_3,\ldots,H_9$ between the integer ranks.
    genau: |
      $H_{3.5}(2,0.5)\approx1.4428\pm3\cdot10^{-4}$ and $H_{3.5}(2,1.5)\approx2.7824\pm2\cdot10^{-4}$ from both routes together.
    warum: |
      At each fixed height, $N\mapsto H_N(2,x)$ is a sequence of numbers; a Newton series continues it to $N=3.5$. Because every hyperoperation is vertically bounded, so is every such mixture — boundedness therefore cannot sort out any wave.
    beispiel: |
      At $x=0.5$: perturbative $1.44302$, rank continuation $1.44246$.
    einordnung: |
      First route: [[kn.beob.halbrang_basis2]]; selection rule: [[kn.beob.kneser_beschraenkte_summe]]; open: [[kn.frage.halber_rang]].
- id: kn.beob.halbrang_theta_grenze
  quelle_hash: 66b86b32c6b5
  theorie_hash: f8a273c92e41
  herkunft:
    modell: opus
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: The 10⁻⁴ limit of the half rank is the θ freedom itself
    aussage: |
      The growing parts of the expansion around $x+1$ (late $\varepsilon$ terms, high orders at growing rank) have the height form $a\sin2\pi x+b(1-\cos2\pi x)$ — 1-periodic, zero at integer heights:
      exactly the θ modes that every tetration leaves free (a one-parameter fit hits at $j=12$, $x=0.5+i$: $134.37-212.77i$ versus measured $134.28-212.79i$).
      The Borel singularities in $\varepsilon$ are absent at rank 0, lie at $|t|\approx8$ at rank 1 and at $|t|\approx0.7$–$1.1$ at rank 2; their approach produces the rates $\rho_j^n$.
      Lateral Laplace sums differ precisely by θ modes: **choosing a summation rule means choosing θ.** Hence the rank continuation in Borel space gives no more digits, and Kneser versus a θ variant can only be decided by a non-perturbative condition.
      Cross-check via the full rank chain $H_3,\ldots,H_9$ continued in the rank: $H_{3.5}(2,0.5)\in[1.44246,1.44266]$ (perturbative $1.44302$), $H_{3.5}(2,1.5)\in[2.78245,2.78254]$ ($2.78231$) — agreement to $\le6\cdot10^{-4}$.
    einfach: 'The calculation stops at about four digits because that is exactly where the freedom begins that every fractional hyperoperation
      has: one can add a small wave without changing the integer values. Which wave is the right one is not decided by any summation rule — that
      needs a condition like Kneser''s.'
    pruefung:
      f1_folgt_unmittelbar: 'No (measured); proved are only: no Borel singularity at rank 0, no further injective fixed point of T, θ modes lie
        outside the class 𝒜.'
      f2_benutzte_voraussetzungen: Borel–Padé location of the singularities numerical; fit of the mode form with one free parameter.
      f3_spezialfall: 'Yes: the non-uniqueness of fractional iteration (fg.kor.nichteindeutigkeit), here in the rank.'
      f4_uebertragbar: Every perturbative construction of fractional ranks and heights around a degenerate point.
      f5_neue_frage: Which θ does Kneser have relative to the perturbative tetration (rank 1)? Can this rule be transferred to the half rank?
    bewertung:
      richtigkeit: numerical; three partial statements proved
      nutzen: Explains why H₃.₅ needs a selection condition like Kneser's, not only better numerics.
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/BERICHT_ETAPPE3.md
  en_theorie:
    worum: |
      Why even a more refined summation gives no more digits for the half rank.
    genau: |
      The ambiguity of the summation is exactly a 1-periodic wave $a\sin2\pi x+b(1-\cos2\pi x)$ that vanishes at integer heights.
    warum: |
      Such waves change neither the recursion nor the integer values — this is the freedom θ of every fractional iteration. A summation rule fixes it without saying which one is right.
    beispiel: |
      Two routes to $H_{3.5}(2,0.5)$ give $1.44302$ and $1.44246$–$1.44266$ — a difference of about $5\cdot10^{-4}$, the size of this wave.
    einordnung: |
      Limit of the expansion: [[kn.beob.halbrang_divergenz]]; basic freedom: [[fg.kor.nichteindeutigkeit]]; open question: [[kn.frage.halber_rang]].
- id: kn.beob.hexation_verzweigt
  quelle_hash: 9c512691b9e1
  theorie_hash: 206fbff0a23b
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: 'Numerical: circuits with sheet tracking (experimente/prototypen_hexation/monodromie.py, exponent.py), two
        control circuits give exactly 0. For the position in z the θ constant c₀ = −5.16210 − 1.42703i from the fork (exp.hexation_kneser); the
        coarse θ (K = 64) gave the same to within 0.003.'
      f5_neue_frage: 'Which uniqueness replaces “holomorphic in the upper half-plane”? Computationally: θ with a singular additional basis (1
        − e^{2πi(z − x_c)})^{k/α} instead of a pure Fourier series.'
      f3_spezialfall: 'By analogy at every level from the hexation on: If the level function is not entire, its singularities reappear in the
        periodic superfunction.'
      f1_folgt_unmittelbar: 'No, but from three known ingredients: periodicity of F_q; the pentation inherits the log singularity of the tetration
        at −2 at the point w_b ≈ −1.979 + 1.912i (there P(w_b − 1) = −2); and P(w) − L_T ~ c·λ_T^w for Re w → −∞.'
      f4_uebertragbar: To all bases b > η₅ (same derivation, α = ln λ_T/ln b); not to the tetration, because exp is entire.
    bewertung:
      recherche: 'Literature map 12.10.2026: forum (tid 1177: Levenstein 2017 builds the Kneser-type hexation via a circle and θ, without branchings
        or a uniqueness proof; tid 1263, 949), Kouznetsov 2014 (pentation only), arXiv/zbMATH (pentation, hyperoperation), MathOverflow: not found.'
      nutzen: Explains why the Cauchy and Fourier methods failed, and shows the way to the θ method with a corner basis.
      richtigkeit: numerical (log circuit to 6 digits, exponent to 4·10⁻⁵), derivation sketched
    titel: The Kneser-type hexation to base 2 is branched in the upper half-plane
    aussage: |
      $F_q$ is exactly periodic with $\Pi=2\pi i/\ln\mu_q=3.00911+2.94132\,i$ and branched at the points $\zeta_c-2+m+k\Pi$ ($m\ge0$, $k\in\mathbb Z$), where $\zeta_c=0.40306781-1.70988020\,i$ (from $F_q(\zeta_c-3)=w_b$, kn.satz.hexation_logpunkt; earlier estimate via $F_q'=0$: $0.40313-1.70979\,i$)
      is the corner of the curve on which $F_q$ is real ($F_q(\zeta_c)=P(L_T)$). For $m=0$ the branching is logarithmic (one circuit changes $F_q$ by exactly $2\pi i/\ln2=9.06472\,i$),
      for $m\ge1$ power-like, $F_q-w_0\sim c\,(\zeta-\zeta_0)^\alpha$ with $\alpha=\ln\lambda_T/\ln2=2.370666$ (measured circuit factor: $\alpha\equiv0.37070$).
      The copies with $k=1$ lie in the image of the upper half-plane; the hexation therefore has branch points at $z_m\approx-0.7408+m+2.7458\,i$ ($m\ge0$; position from the exact $\theta$ constant of the fork method), two of them in the strip $0<\operatorname{Re}z<2$.
      Consequences: At the corners the curve has the angle $\pi/\alpha\approx76^\circ$ (not a right angle), $\theta$ behaves there like $(x-x_c)^{1/\alpha}$ with $1/\alpha=0.4218$;
      and $H$ is **not** holomorphic in the upper half-plane — Kouznetsov's Cauchy method in the rectangle $[0,2]\times[-A,A]$ is invalid for $A>2.75$.
    bereich: $b=2$; $P$ the pentation (regular at the fixed point $L_T=-1.74391$ of Kneser's tetration, multiplier $\lambda_T=5.17176$); $F_q(\zeta)=\Psi_q(\mu_q^\zeta)$
      its regular superfunction at the repelling fixed point $q$; $H(z)=F_q(x^*+z+\theta(x^*+z))$ the Kneser-type hexation
    einfach: For tetration the exponential function is smooth everywhere, so Kneser's solution is smooth everywhere above the real axis. The pentation,
      by contrast, has singularities of its own. The auxiliary function $F_q$ repeats periodically; the point where the hexation on the real axis
      falls to $-\infty$ ($s_b\approx-3.77$) therefore returns at height 2.75 — this time not smoothed out.
  en_theorie:
    beispiel: |
      Measured with sheet tracking, circuit of radius 0.2 around the predicted points (path from above, where the principal branch is correct):
      $m=0$: change $9.06472\,i$ ($2\pi i/\ln2=9.06472\,i$); $m=1$ and $m=2$: change $0.49-2.44\,i$ and $1.28-3.13\,i$, respectively; two control points in between: exactly $0$.
      Small circuit (radius 0.02) around $m=1$ and $m=2$: factor $(F-w_0)$ after/before $=-0.68784+0.72606\,i$, hence $\alpha\equiv0.37070$; predicted $0.370666$.
    einordnung: |
      For the tetration ([[kn.konstr.kneser]]) the level function exp is entire — there is nothing there that could recur. Here the level function is the pentation, and the
      singularity from [[kn.satz.hexation_struktur]] recurs periodically. What this means for the computation: [[kn.frage.hexation_kneser]].
    genau: |
      $F_q(\zeta)=\Psi_q(\mu_q^\zeta)$ is exactly periodic with $\Pi=2\pi i/\ln\mu_q=3.00911+2.94132\,i$. It branches at $\zeta_c-2+m+k\Pi$ ($m\ge0$): for $m=0$ logarithmically
      (circuit $+2\pi i/\ln2$), for $m\ge1$ like $(\zeta-\zeta_0)^\alpha$ with $\alpha=\ln\lambda_T/\ln2=2.370666$. For $k=0$ these are the corners of the real curve, for $k=1$ they lie
      in the image of the upper half-plane: $H$ branches at $z_m\approx-0.7408+m+2.7458\,i$.
    warum: |
      1. **Period:** $\mu_q^{\zeta+\Pi}=\mu_q^\zeta e^{2\pi i}=\mu_q^\zeta$, hence $F_q(\zeta+\Pi)=F_q(\zeta)$.
      2. **A singularity of the pentation:** The tetration has a log singularity at $-2$. The pentation inherits it at the point $w_b\approx-1.979+1.912\,i$, where $P(w_b-1)=-2$:
         $P(w)\approx\log_2(w-w_b)+c$. (From $w_b$ the cut of the principal-branch pentation runs to the right, along $\operatorname{Im}w=\pi/\ln\lambda_T$.)
      3. **Log point of $F_q$:** $F_q$ takes the value $w_b$; one step further, $F_q(\zeta)=P(F_q(\zeta-1))\approx\log_2(\zeta-\zeta_0)$ — one circuit adds $2\pi i/\ln2$.
      4. **Power points:** For $\operatorname{Re}w\to-\infty$, $P(w)-L_T\approx c\,\lambda_T^{\,w}$. With $w\approx\log_2\delta$ this becomes $c\,\delta^{\ln\lambda_T/\ln2}$. Since $P$ is smooth and invertible at $L_T$,
         $P(L_T),\dots$, all further steps carry the same exponent.
      5. **On the real axis** $\theta$ heals this: there $H$ behaves like $\log(x-s_b)/\ln\lambda_T$ (coefficient $1/\ln\lambda_T$ instead of $1/\ln2$), and $\theta$ has a
         singularity $(x-x_c)^{1/\alpha}$ for this. At height $2.75$, by contrast, $\theta$ is smooth (almost constant) — the branching of $F_q$ passes unchanged to $H$.
    worum: |
      Kneser's tetration is smooth everywhere above the real axis. For the hexation to base 2, built Kneser-type at the fixed point $q$ of the pentation, this is not true: It has branch points at
      height 2.75. The reason is that already the pentation — unlike the exponential function — has singularities of its own.
- id: kn.beob.hoehere_etas
  quelle_hash: 21bd726a8a97
  theorie_hash: 25c7fc0b5b8c
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'exp.tpid10_abstaende: comparison with the 30-digit values η₅, η₆ (deviation −6.4·10⁻⁴, +1.2·10⁻⁴) and with the extrapolation
      η₇ ≈ 1.8399.'
    pruefung:
      f2_benutzte_voraussetzungen: Levenstein's choice of continuations (the same as ours for pentation and for hexation above η₅); computation
        path of the bounds not described in the post.
      f5_neue_frage: η₇ and e₇ to many digits (regular heptation over our Kneser-like hexation) — tests the distance law kn.beob.tpid10_gesetz.
      f3_spezialfall: Terms 4–7 of the sequence from kn.verm.tpid10.
      f1_folgt_unmittelbar: The identification “boundary of boundedness = ηₙ” follows from monotonicity (kn.beob.unendliche_hexation f1); the
        numbers are measured.
      f4_uebertragbar: 'Octation: Kneser-like at a complex pair of heptation (announced by Levenstein, not computed).'
    bewertung:
      nutzen: Oldest source for η₅, η₆ and the only one for η₇.
      richtigkeit: numerical (forum, three digits)
    titel: 'Levenstein 2017: Bounded up to 1.738, 1.799, 1.839 — η₅, η₆ and a first value for η₇'
    aussage: |
      S. Levenstein built the hyperoperations in 2017 alternately regular (at a real fixed point) and Kneser-like (at a complex pair):
      pentation and heptation regular, hexation via a circle between the conjugate fixed points of pentation with a $\theta$-map
      (functions to 25–30 digits). He states up to which base the respective next level remains bounded: pentation up to $\approx1.635$ (according to nuninho),
      hexation up to $\approx1.738$, heptation up to $1.799$, octation up to $1.839$. Because $H_{n+1}(b,m)$ is bounded if and only if $H_n(b,\cdot)$ has a fixed point above 1,
      these are $\eta_4,\eta_5,\eta_6,\eta_7$. Our values $\eta_5=1.737356$, $\eta_6=1.799121$ (kn.beob.stufe5, kn.beob.stufe6) lie $6\cdot10^{-4}$ below and
      $1\cdot10^{-4}$ above his figures, respectively. For $\eta_7\approx1.839$ this is the only figure found; Levenstein asked whether all bases below 2 remain bounded at high levels,
      and why the Eulers should tend to 4 (at base 1.84 he saw a near-touching of heptation near 3.7).
    bereich: 'Chain regular/Kneser-like: pentation regular at the left real fixed point of Kneser''s tetration, hexation Kneser-like at the conjugate
      fixed points of pentation, heptation regular at the left real fixed point of hexation'
    einfach: 'As early as 2017 Sheldon Levenstein built the higher levels up to heptation and read off the limit bases to three digits: 1.738,
      1.799 and 1.839. Our exact values confirm the first two; the third is so far the only value for the fifth term of the sequence.'
    quellen:
    - stelle: Levenstein, post 5 (pid 8759, 03.09.2017) and post 7 (pid 8761, 04.09.2017)
  en_theorie:
    beispiel: |
      Our exact values: $\eta_5=1.737356$ (Levenstein $\approx1.738$), $\eta_6=1.799121$ (Levenstein $1.799$).
    einordnung: |
      Older source for [[kn.beob.stufe5]] and [[kn.beob.stufe6]]; only value for $\eta_7$; check value for [[kn.beob.tpid10_gesetz]].
    genau: |
      Pentation regular at the left real fixed point of tetration, hexation Kneser-like at the conjugate fixed points of pentation, heptation regular at the left
      real fixed point of hexation. Bounded up to $\approx1.635$ (pentation), $\approx1.738$ (hexation), $1.799$ (heptation), $1.839$ (octation), thus
      $\eta_4,\eta_5,\eta_6,\eta_7$ to three digits.
    warum: |
      1. $H_{n+1}(b,m)$ arises from 1 by repeated application of $H_n(b,\cdot)$; the sequence increases.
      2. It remains bounded if and only if $H_n(b,\cdot)$ has a fixed point above 1 — and that is, according to the conjecture [[kn.verm.beschraenkt_unter_2]], exactly the case up to the touching base $\eta_n$.
      3. The boundary of boundedness of level $n+1$ is therefore $\eta_n$.
    worum: |
      The sequence $\eta,\eta_4,\eta_5,\dots$ requires a new hyperoperation for each term. Sheldon Levenstein was in 2017 the first to build the chain up to heptation
      and read off the limit bases.
- id: kn.beob.kneser_beschraenkte_summe
  quelle_hash: 7d52c49c81cb
  theorie_hash: df2a50b800aa
  herkunft:
    modell: opus
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: Kneser is the vertically bounded sum of the perturbation series around x+1
    bereich: $f_\varepsilon=x+1+\varepsilon(2^x-x-1)$, $0.36\le\varepsilon\le0.6$ and $\varepsilon=1$; Kneser-type superfunction for each $\varepsilon$
      via a Cauchy integral with limits $L_\varepsilon,\bar L_\varepsilon$
    aussage: |
      For every $\varepsilon$ there is a Kneser-type superfunction of $f_\varepsilon$ (at $\varepsilon=1$ equal to the Kneser tetration to base 2 within $2.9\cdot10^{-11}$). Its distance to the Borel–Padé sum of the perturbation series is
      $$D_0(x)\approx C(x)\,e^{-B/\varepsilon},\qquad B\approx7.6\ (7.0\text{–}8.0\text{ je nach Höhe}),$$
      about $5\cdot10^{-10}$ at $\varepsilon=0.36$, extrapolated to $\varepsilon=1$ about $10^{-4}$–$8\cdot10^{-4}$ (consistent with kn.beob.halbrang_kneser_test). $D_0$ is exactly a θ mode $a\sin2\pi x+b(1-\cos2\pi x)$ and grows vertically like $e^{2\pi|y|}$; Kneser itself stays bounded.
      **So among all sums of the series, Kneser is the one bounded on vertical lines** (the Paulsen–Cowgill mechanism). Kneser is not the Borel–Padé sum along the real axis; whether it is the median sum remains open (Borel singularity at about $7.6\pm0.35i$).
      Proposal for the half rank: $H_{3.5}(2,\cdot)$ as the vertically bounded sum — consistent with ranks 0 and 1, excludes all θ modes; that two such half steps give Kneser is not shown, and there are no new values yet.
    einfach: 'Which wave does Kneser carry? Measured: exactly none that grows upward and downward — Kneser''s tetration is the sum of the series
      that stays bounded in the complex plane. This rule could also select the right half step.'
    pruefung:
      f1_folgt_unmittelbar: No (measured); proved is only the adopted theorem that periodic functions with polynomial growth are constant.
      f2_benutzte_voraussetzungen: Own Kneser-type superfunction for each ε (Cauchy integral); Borel–Padé does not resolve the singularity near
        the axis.
      f3_spezialfall: 'Yes: uniqueness via boundedness (kn.satz.paulsen_cowgill), here as a selection among resummations.'
      f4_uebertragbar: As a selection rule for the half rank — requires a non-perturbative half rank at complex heights.
      f5_neue_frage: Is Kneser the median sum? Can H_N(2, x+iy) be continued in the rank and boundedness then be applied?
    bewertung:
      richtigkeit: numerical
      nutzen: Shows which selection rule Kneser satisfies in the language of the perturbation series, and gives a candidate for H₃.₅.
    quellen:
    - stelle: forschung/eta_hyperoperationen/halb_rang_basis2_2026_10_13/BERICHT_ETAPPE4.md
    - stelle: uniqueness via boundedness
  en_theorie:
    worum: |
      Which of the many possible sums of a divergent series Kneser's tetration is.
    genau: |
      Kneser minus the Borel–Padé sum is a θ wave of size $e^{-7.6/\varepsilon}$ that grows vertically like $e^{2\pi|y|}$; Kneser itself stays bounded.
    warum: |
      Two sums of the same series differ by a periodic wave; every non-constant such wave grows exponentially in the vertical direction. Requiring boundedness excludes all waves — this is the core of the uniqueness after Paulsen–Cowgill.
    beispiel: |
      At $\varepsilon=0.36$ the distance is $5\cdot10^{-10}$, at $\varepsilon=1$ about $10^{-4}$.
    einordnung: |
      The wave as a limit: [[kn.beob.halbrang_theta_grenze]]; uniqueness: [[kn.satz.paulsen_cowgill]]; goal: [[kn.frage.halber_rang]].
- id: kn.beob.kouznetsov_numerik
  quelle_hash: 0192fb4781f4
  theorie_hash: a96c2c898e89
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: Truncation of the integration at |Im| = A with F ≈ L there; double precision.
      f5_neue_frage: Convergence proof of the iteration method (named as a research goal by Trappmann–Kouznetsov 2011).
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: No (numerical evidence).
      f4_uebertragbar: For hexation the method fails at branchings (kn.beob.hexation_verzweigt).
    bewertung:
      nutzen: First approach to uniqueness, before criterion and theorem.
      richtigkeit: numerical (literature)
    titel: 'Kouznetsov 2009: robust convergence of the integral equation as a numerical argument for uniqueness'
    aussage: |
      Kouznetsov iterates the integral equation for $F(iy)$: it converges in a few tens of passes, the residual reaches about $10^{-14}$ in double precision;
      the solution remains bounded along the imaginary axis and tends to $L$ and $\bar L$, respectively. From this he concludes — numerically, not as a proof — that there is exactly one
      such tetration: increasing on the real axis, tending to $L$ along the imaginary axis, analytic except for singularities at the integers $<-1$ and a cut to the left of $-2$.
      Uniqueness was subsequently cast as a criterion (Trappmann–Kouznetsov 2011) and as a theorem (Paulsen–Cowgill 2017).
    bereich: Base $e$; values on the imaginary axis from the Cauchy integral equation (kn.konstr.cauchy)
    einfach: In 2009 Kouznetsov computed Kneser's tetration in the whole complex plane for the first time. Because his computation always ran
      to the same result, he conjectured that there is only this one — this was proved only in 2017.
    quellen:
    - stelle: zbMATH review (Zbl 1202.30002)
    - stelle: 'pp. 3–4: convergence proof as an open goal'
  en_theorie:
    einordnung: |
      First step before [[kn.satz.tk_kriterien]] and [[kn.satz.paulsen_cowgill]]; the method itself is [[kn.konstr.cauchy]].
    genau: |
      The integral equation for $F(iy)$ converges in a few tens of passes, residual $\approx10^{-14}$; $F$ is bounded along the imaginary axis and tends to $L$, $\bar L$.
    warum: |
      An iteration that runs to the same result from different starting values points to exactly one fixed point of the iteration — hence to exactly one solution in the
      class considered. This is not a proof: convergence and class are not formally secured.
    worum: |
      Before uniqueness was proved, there was a numerical argument: Kouznetsov's computation always ran to the same solution.
- id: kn.beob.kritische_profile
  quelle_hash: e1831407a0e3
  theorie_hash: 9fed4936dc8e
  herkunft:
    modell: sonnet
    datum: '2026-10-13'
  geprueft: nein
  en:
    titel: At the limit base, H_N looks more and more like x+1 on the left
    aussage: |
      $F_N=H_N(\eta_N,\cdot)$ at $x=-0.5$ (target of the successor $0.5$), $x=0.5$ (target $1.5$) and $x=2$:
      $N=4$: $0.5872,\ 1.3348,\ 2.2352$; $N=5$: $0.5326,\ 1.3959,\ 2.3465$; $N=6$: $0.5158,\ 1.4285,\ 2.4272$; $N=7$: $0.5089,\ 1.4477,\ 2.4877$; $N=8$: $0.5056,\ 1.4601,\ 2.5346$.
      On the left and at $0.5$ the values approach $x+1$; at $x=2$ they are still far from $4$. The secant lower bound $(4-F_N(2))/(2-\eta_N)$ for the base sensitivity grows
      roughly linearly ($4.84,\ 6.30,\ 7.83,\ 9.44,\ 11.11$) — so the criterion for $e_N\to4$ in kn.satz.eta_kriterium is not supported.
    einfach: The measured values fit “the hyperoperations become plus 1 at their limit bases” — but only at small heights; at height 2 little
      of this is visible yet.
    pruefung:
      f1_folgt_unmittelbar: No (measured).
      f2_benutzte_voraussetzungen: Chosen continuation chain, N = 8 with experimental two-arc selection; residuals ≤ 1e-19, no interval certificates.
      f3_spezialfall: 'no'
      f4_uebertragbar: The same measurement at q near 1 is decisive for the criterion.
      f5_neue_frage: How fast does F_N(q) − q − 1 tend to 0, and uniformly up to q → 1?
    bewertung:
      nutzen: First data on the criterion for TPID 10.
      richtigkeit: numerical (N = 7 twice, relative 2e-30)
    quellen:
    - stelle: forschung/eta_hyperoperationen/rang_gamma/BERICHT.md §3; critical_profile_r*.json
  en_theorie:
    beispiel: |
      $N=8$: $F_8(-0.5)=0.50564$, $F_8(0.5)=1.46013$.
    einordnung: |
      Data for [[kn.satz.eta_kriterium]].
    genau: |
      $H_N(\eta_N,-0.5)\to0.5$ and $H_N(\eta_N,0.5)\to1.5$ are emerging; at height 2, $H_N(\eta_N,2)$ with $2.53$ ($N=8$) is still far from 4.
    warum: |
      The higher the level, the closer $\eta_N$ lies to 2, and at base 2 every level is exactly $x+1$-like at heights 1 and 2 (values 2 and 4).
    worum: |
      Measured values of the hyperoperations at their own limit bases, to the left of height 1.
- id: kn.beob.naeherungsleiter
  quelle_hash: fb0a79d0aa8a
  theorie_hash: 46e4649868c1
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'Computing tetration yourself: a ladder of approximations for Desmos and pocket calculators'
    aussage: |
      Recipe: place a polynomial $p$ on the stretch $[-1,0]$ and continue by $T(x)=e^{T(x-1)}$ to the right and $T(x)=\ln T(x+1)$ to the left
      (in Desmos with a piecewise or recursive definition). Largest distance from Kneser on $[-1,0]$:

      | Approximation | Degree | largest error | kink at 0 |
      |---|---|---|---|
      | linear $1+x$ | 1 | $9.2\cdot10^{-3}$ | 0 (but $T''$ jumps) |
      | perturbation series $P_2$ | 3 | $1.5\cdot10^{-3}$ | 0 |
      | perturbation series $P_4$ | 7 | $3.0\cdot10^{-5}$ | 0 |
      | perturbation series $P_8$ (forum) | 15 | $4.6\cdot10^{-7}$ | 0 |
      | interpolated at Kneser | 5 | $2.5\cdot10^{-5}$ | $2\cdot10^{-4}$ |
      | interpolated at Kneser | 8 | $1.2\cdot10^{-7}$ | $3\cdot10^{-7}$ |
      | interpolated at Kneser | 12 | $7\cdot10^{-11}$ | $2\cdot10^{-10}$ |

      The polynomial of degree 8 (interpolation at Kneser in Chebyshev nodes, with $p(-1)=0$, $p(0)=1$):
      $p(x)=1+1.09176696734x+0.271445352811x^2+0.211828229004x^3+0.0655654131297x^4+0.0318550888273x^5-0.00617922488113x^6-0.0102665360889x^7-0.00564779198127x^8$.
      The perturbation series needs no Kneser values and is exactly $C^1$ at the seams; at the same degree the interpolation is more accurate, but needs Kneser as input.
    bereich: Base $e$; polynomial $p$ on $[-1,0]$ with $p(-1)=0$, $p(0)=1$, continued by $T(x)=e^{T(x-1)}$ and $T(x)=\ln T(x+1)$
    einfach: 'Anyone who wants to draw tetration in Desmos only needs a good piece of curve between −1 and 0 — the rest follows by "e to the power"
      and "ln". The table shows how good different pieces are: a straight line is off by about one percent, a polynomial of degree 8 by only one
      ten-millionth.'
    formen:
    - notiz: Continuation to $(-2,\infty)$
    pruefung:
      f1_folgt_unmittelbar: The recipe yes (functional equation); the errors are measured.
      f2_benutzte_voraussetzungen: Kneser values from gp-tetration; errors on 2001 points.
      f3_spezialfall: The linear stage is kn.konstr.linear; the quadratic approximation (kn.konstr.quadratisch) coincides with the linear one
        for $b=e$.
      f4_uebertragbar: To every base via $b^x$ and $\log_b$; the polynomials have to be determined anew.
      f5_neue_frage: How much accuracy does the continuation to the right lose (each $e$-step enlarges the error by the factor $T'$)?
    bewertung:
      nutzen: 'Practical: a formula that can be used immediately, with known error.'
      richtigkeit: numerical
  en_theorie:
    beispiel: |
      With the polynomial of degree 8: $T(\tfrac12)=e^{p(-\tfrac12)}$, $p(-\tfrac12)=0.49856\ldots$, hence $T(\tfrac12)\approx1.64635$ (Kneser: $1.646354\ldots$).
    einordnung: |
      The simplest stage: [[kn.konstr.linear]]; smoothness at the seams: [[kn.konstr.quadratisch]]; polynomial without Kneser values: [[kn.konstr.stoerungsreihe]].
    genau: |
      Polynomial $p$ on $[-1,0]$ with $p(-1)=0$, $p(0)=1$; to the right $T(x)=e^{T(x-1)}$, to the left $T(x)=\ln T(x+1)$. Error table from linear ($10^{-2}$) to degree 12 ($10^{-10}$).
    warum: |
      The equation $T(x+1)=e^{T(x)}$ determines everything as soon as one knows a piece of length 1. A polynomial on this piece is easy to enter;
      the error is enlarged by the factor $T'$ with each $e$-step to the right and reduced to the left.
      In Desmos the continuation works, for example, with a list of pieces: $T_0(x)=p(x)$ on $[-1,0]$, $T_1(x)=e^{p(x-1)}$ on $[0,1]$, $T_2(x)=e^{e^{p(x-2)}}$ on $[1,2]$.
    worum: |
      Tetration to draw yourself: what one can enter in Desmos or on a pocket calculator, and how accurate it is.
- id: kn.beob.pentation_werte
  quelle_hash: 06cb2fab84ad
  theorie_hash: a027fdb976e5
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    gegenbeispielsuche: 'exp.pentation: depth M = 8 versus 10, equation P(x+1) = T(P(x)) at two points, integer heights −10 … 2 versus Fox, base
      2 versus Levenstein.'
    pruefung:
      f2_benutzte_voraussetzungen: Kneser values of the fatou.gp fork to 40 digits; result depth-independent to 2·10⁻²³.
      f5_neue_frage: Does $e\uparrow\uparrow\uparrow x$, like $T_e$, have exactly one inflection point on the real axis?
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: Yes, from the construction (kn.konstr.pentation) with Kneser values.
      f4_uebertragbar: Fox computed with a different method (matrix slog after Robbins); the agreement to 22 digits is an indication that this
        slog construction is Kneser (cf. kn.verm.carleman_kneser).
    bewertung:
      nutzen: Reference values with independent confirmation.
      richtigkeit: numerical (≈ 22 digits secured)
    titel: 'Values of the pentation: e↑↑↑(1/2) = 1.6323247404…'
    aussage: |
      Base $e$: $L_e=-1.8503545290271814184834459503\ldots$, $\lambda_e=T_e'(L_e)=6.4606712956818393902088283398\ldots$
      $$e\uparrow\uparrow\uparrow\tfrac12=1.6323247404360631\ldots,\quad e\uparrow\uparrow\uparrow(-\tfrac12)=0.4910543386356482\ldots,\quad e\uparrow\uparrow\uparrow1.5=6.4857360642393348\ldots$$
      integer heights: $e\uparrow\uparrow\uparrow2=2075.9683350580658335744\ldots$, $e\uparrow\uparrow\uparrow(-3)=-1.6363583542860289796\ldots$, $e\uparrow\uparrow\uparrow(-4)=-1.8131704830986356400\ldots$
      The values of J. D. Fox (2007, matrix slog with 1200 terms) agree to 22 digits. Base 2: $L_2=-1.7439091761327370\ldots$, $\lambda_2=5.1717972635455210\ldots$,
      $2\uparrow\uparrow\uparrow1.5=2.7028905714601531\ldots$ (Levenstein 2020: $\approx2.7029$).
    bereich: base $e$ and $2$, Kneser's tetration with 40 digits
    einfach: 'The “half pentation” of e is about 1.632 — for comparison: the half tetration of e is 1.646. At negative heights the pentation creeps
      toward the fixed point −1.85, each step reduces the distance by about a factor of 6.46.'
  en_theorie:
    beispiel: |
      How quickly the negative heights run toward the fixed point: distances to $L_e$ at $-3,-4,-5,-6,-7$:
      $0.2140,\ 0.03718,\ 0.005870,\ 0.0009114,\ 0.0001411$. The ratios $5.76,\ 6.33,\ 6.44,\ 6.46$ approach $\lambda_e=6.4607$.
    einordnung: |
      Fox's method is Robbins' matrix method (related to Carleman, [[kn.konstr.carleman]]); the agreement to 22 digits supports the
      conjecture that such matrix solutions converge to Kneser ([[kn.verm.carleman_kneser]]). Kneser reference values one level lower:
      [[kn.beob.referenzwerte]].
    genau: |
      Base $e$:
      - Fixed point $L_e=-1.8503545290271814184834459503\ldots$, multiplier $\lambda_e=6.4606712956818393902088283398\ldots$
      - $e\uparrow\uparrow\uparrow\tfrac12=1.6323247404360631\ldots$, $e\uparrow\uparrow\uparrow(-\tfrac12)=0.4910543386356482\ldots$, $e\uparrow\uparrow\uparrow1.5=6.4857360642393348\ldots$
      - $e\uparrow\uparrow\uparrow2=2075.9683350580658335744\ldots$, $e\uparrow\uparrow\uparrow(-3)=-1.6363583542860289796\ldots$, $e\uparrow\uparrow\uparrow(-4)=-1.8131704830986356400\ldots$

      Base $2$: $L_2=-1.7439091761327370\ldots$, $\lambda_2=5.1717972635455210\ldots$, $2\uparrow\uparrow\uparrow1.5=2.7028905714601531\ldots$
    warum: |
      The values are computed, not proved. They were checked as follows:
      1. The fixed point satisfies $T_e(L)=L$ to 30 digits.
      2. The pentation satisfies $P(x+1)=T_e(P(x))$ at points that did not enter the construction ($x=-\tfrac12$, $\tfrac12$).
      3. Computed with 8 or 10 forward steps, the results differ only at the 23rd digit.
      4. Fox's values (different method, 2007): distance $8\cdot10^{-24}$ for the fixed point, $5\cdot10^{-22}$ for the multiplier, relatively $10^{-22}$ for $e\uparrow\uparrow\uparrow2$.
      5. S. Levenstein (2020, with his own program) gives $2\uparrow\uparrow\uparrow1.5\approx2.7029$ — matched.
    worum: |
      With the construction from [[kn.konstr.pentation]] and Kneser values to 40 digits, pentation values can be computed accurately. J. D. Fox computed
      the same quantities in 2007 in the tetration forum with a completely different method (a huge matrix for the slog). Both computations
      agree to 22 digits — a strong sign that they describe the same function.
- id: kn.beob.polynom_eckmode
  quelle_hash: 9c2c411e2391
  theorie_hash: 85f4d16a9f10
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'Whether the corner mode tips the convergence at large N was checked up to N = 1500 (strand A): no. An earlier extrapolation
      “problems from N ≈ 5000 on” was withdrawn.'
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: Closed-form derivation of the rate 0.012 and of the boundary profile of the adjoint corner mode.
      f3_spezialfall: Finite sections of Toeplitz operators with piecewise continuous symbol (Gohberg–Feldman, Böttcher–Silbermann) — here, however,
        with composition on Γout, the standard theory does not apply.
      f1_folgt_unmittelbar: No; (i) is a numerically supported argument, (iii) is supported via models.
      f4_uebertragbar: Every base b > η (rotating repelling fixed point).
    bewertung:
      recherche: 'Literature on truncation methods (strand C): no analysis of the inverse found.'
      nutzen: Explains why norm estimates fail and what structure a proof needs.
      richtigkeit: numerical up to N = 1000 (corner mode) and 1500 (convergence), respectively
    titel: 'Corner mode of the truncated linearization: grows like e^{0.012N}, but does not disturb the convergence'
    aussage: |
      (i) $J_N^{-1}$ converges entrywise to a limit operator $G$; in the interior $|L|^{k-j}G_{kj}$ is a Toeplitz matrix with the **jump symbol**
      $\sigma=f'(x)e^{-x}\cdot\mathbf 1[|f(x)|<|L|]$ on $|x|=|L|$ (jump exactly at $\arg L$).

      (ii) $J_N^{-1}$ is **not** uniformly bounded: in $\ell^1$ the norm grows logarithmically, in weighted $\ell^2$ 1–3 **corner modes** set in, $\sigma_1\approx C\,N^{-0.82}e^{0.0120N}$
      (up to $N=1000$), all remaining singular values stay $\|\sigma\|_\infty=1.3663$.

      (iii) The cause is the **repelling, rotating** boundary fixed point $L$: A real cubic polynomial with fixed points $L,\bar L$ and multiplier $\sqrt L$ reproduces the corner mode to 3–5 %;
      without repulsion (Möbius rotation, $|f'|=1$) or without rotation there is none.

      (iv) The corner mode is hardly excited by **coherent** inputs: its share in $\Pi_Nf_K$ falls from $8\cdot10^{-7}$ to $8\cdot10^{-9}$ ($N=200\to1000$), in pole responses it grows only like
      $N^{0.7}$. Random perturbations, by contrast, are amplified by $\gtrsim1.17^N$ — proofs must use coherent directions.
    bereich: $J_N$ Jacobian matrix of the truncated system at $f_K$ and $p_N$, respectively; weights $|L|^k$
    einfach: The equations have a weak spot near the fixed point L that grows exponentially with the degree. Kneser's solution practically does
      not “hit” this weak spot, however — only random errors would amplify it. That is why the method works, and why proofs that work only with
      size estimates fail.
    quellen:
    - stelle: Strand D (d05, d06, d18–d29), strand A (R2), strand B (b45, b46)
  en_theorie:
    beispiel: |
      $\sigma_1=1.84,\,8.90,\,68.4,\,592,\,5400$ at $N=200,\,400,\,600,\,800,\,1000$ — and still $\max_D|\Pi_Nf_K|=2.232651$ for all these $N$.
    einordnung: |
      Corrects the interpretation in [[kn.gescheitert.polynom_kantorovich]]. The proof ([[kn.satz.polynom_halbexp_hauptsatz]]) therefore works only with coherent directions; exactly the excitation
      of the corner modes by poles near $L$ is open ([[kn.verm.polynom_halbexp_eckmoden]]).
    genau: |
      $\sigma_1(J_N^{-1})\approx CN^{-0.82}e^{0.012N}$ (1–3 corner modes), rest $=\|\sigma\|_\infty=1.3663$; share in $\Pi_Nf_K$ falls from $8\cdot10^{-7}$ to $8\cdot10^{-9}$; random perturbations grow $\gtrsim1.17^N$.
    warum: |
      1. The inverses approach a Toeplitz matrix whose symbol jumps at $\arg L$: to the left of it $f$ maps the boundary of the disk inward, to the right outward.
      2. At the corner $L$ a repelling, rotating fixed point acts; there a boundary layer arises at the truncation edge — the corner mode. A cubic polynomial with the same fixed points shows it too.
      3. Coherent inputs (Kneser's solution, pole responses) have almost no share in this direction, which is why the error stays small.
    worum: |
      Why do proofs with norm estimates fail? Because the equations have a weak spot at $L$ that grows exponentially with the degree — and which nevertheless does not disturb Kneser's solution.
- id: kn.beob.polynom_halbexp_fehlergesetz
  quelle_hash: 296484c53de3
  theorie_hash: 03f99f9f2083
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: Computed up to N = 1500 (linear projection and genuine solutions), sign change predicted as a blind test; exponential
      components (corner mode) searched for specifically (rate < 1e-4 per degree). On the crescent outside D divergence was found — there the
      conjecture claims nothing.
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: Derivation of the constant K∞ and of the factor N from the inner problem at L.
      f3_spezialfall: 'Like the error of the Miller algorithm for minimal solutions: selection via the ratio of the coefficient growths.'
      f1_folgt_unmittelbar: No; explained in part by Theorem T in the model (tail sum) and by the singularity formula at L.
      f4_uebertragbar: Other bases and third iterates (confirmed).
    bewertung:
      recherche: 'Forum mirror (all 1265 threads) and literature (Walker 1991, Paulsen 2016): no such error analysis for truncation methods found.'
      nutzen: 'Shows what a proof must achieve: polynomial, not geometric convergence, carried by one mode.'
      richtigkeit: numerical up to N = 1500, blind test passed
    titel: 'Error law of the polynomial roots: a single perturbation mode with amplitude ~ N^{1−2γ̄}, confirmed up to N = 1500'
    aussage: |
      (i) **One mode:** In the interior of $D$, $p_N-f_K=c_N\delta_{-1}+\bar c_N\delta_{+1}$ — up to $O(c_N^2)$, $p_N$ is itself an exact half-exponential function “Kneser plus a perturbation”; the remaining
      modes are relatively small, $10^{-14}$ to $10^{-20}$.

      (ii) **Amplitude:** $c_N\approx K\cdot N\cdot u_N/(\delta_{-1})_N\sim N^{1-2\bar\gamma}$, hence $|c_N|\sim N^{-7.894}$; free fit $N^{-7.888-2.107i}$ versus $1-2\gamma=-7.894-2.116i$,
      $K_\infty\approx0.0017-0.0533i$. **Blind test:** A sign change of $p_N(1)-T_e(\tfrac12)$ between $N=216$ and $218$ was predicted; computed, the sign oscillates at $215$–$218$
      and is positive from $219$ on.

      (iii) **Boundary:** $|p_N(L)-L|\sim N^{-4.84}$; predicted from the corner of the domain of convergence $W=D\cup D(a_0,|L-a_0|)$ at $L$ (exterior angle $0.883\pi$): $N^{-\alpha(1+\operatorname{Re}\gamma)}=N^{-4.81}$.

      (iv) **Up to N = 1500:** The linear projection $\Pi_Nf_K$ stays below $2.232651$ on $D$, genuine $p_N$ exist (Newton, quadratically), no exponential component shows up
      (rate below $10^{-4}$ per degree).

      (v) **Other cases:** For $b^x$ with $b=1.5,\,2,\,10$ and for $f\circ f\circ f=\exp$ the method likewise converges to Kneser, with exponent $1-2\operatorname{Re}\gamma_b$ (measured $\approx-27$ at
      $b=1.5$, predicted $-27.5$; $\approx-11$ at $b=2$, predicted $-10.2$). On the outer crescent of $W$, $p_N$ converges only transiently (up to $N\approx600$–$900$).
    bereich: $p_N$ as in kn.verm.polynom_halbexp; $\delta_{\mp1}=T'(A+\tfrac12)\,e^{\mp2\pi iA}$ the tangents of the competing solutions; $\gamma=2\pi
      i/L$
    einfach: The deviation of the polynomials from Kneser's solution is not an arbitrary cloud of errors but exactly one single “perturbation
      oscillation” — the same one by which the other half-exponential functions differ from Kneser's. Its size falls like N to the power −7.9,
      and the law even predicts at which degree the error changes sign.
    quellen:
    - stelle: Strands A (k3b, k9, R2), B (b09–b10), C, E
  en_theorie:
    beispiel: |
      Predicted before the computation: $p_N(1)-T_e(\tfrac12)$ changes sign between $N=216$ and $218$. Computed: $+3.8\cdot10^{-22}$, $-3.7\cdot10^{-21}$, $+5.6\cdot10^{-21}$, $+1.0\cdot10^{-22}$
      ($N=215$–$218$), positive from $219$ on. In the check file: interior error on $|z|=1$ falls like $N^{-7.908}$ (target $-7.894$), boundary error like $N^{-4.846}$.
    einordnung: |
      Supports [[kn.verm.polynom_halbexp]] up to $N=1500$. Explained by [[kn.satz.polynom_modelle]] (Theorem T) and [[kn.satz.halbexp_singularitaet_L]].
    genau: |
      $p_N-f_K=c_N\delta_{-1}+\bar c_N\delta_{+1}$ in the interior, $|c_N|\sim N^{-7.894}$, phase like $N^{-2.116i}$; at the boundary $N^{-4.84}$. Confirmed up to $N=1500$, blind test at $N\approx216$.
    warum: |
      1. The other half-exponential functions differ from Kneser by periodic perturbations in Kneser coordinates; their tangents $\delta_{\mp1}$ grow strongly at $L$ and $\bar L$, respectively
         (coefficients $\sim k^{2.45}|L|^{-k}$), Kneser's own only weakly ($k^{-6.45}|L|^{-k}$).
      2. Truncation can distinguish these directions only via the topmost coefficients — as in the translation model (Theorem T) this gives the error $N^{1-\text{gap}}$ with gap $2\operatorname{Re}\gamma$.
      3. At the boundary the corner of the domain of convergence at $L$ (exterior angle $0.883\pi$) determines the rate.
    worum: |
      How exactly do the polynomial roots deviate from Kneser's solution? Astonishingly orderly: through a single perturbation oscillation with a precise law.
- id: kn.beob.polynom_konforme_stabilitaet
  quelle_hash: ed52d7fc63e7
  theorie_hash: ad4aef7edb40
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: 'Searched deliberately: thinner lenses, notches in the profile, wedges, the true p_N instead of f_K, degrees up to 2000.
      It becomes unstable if and only if the lens lies somewhere below Λ or touches L tangentially — both predicted.'
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: Proof of the uniform stability; it contains the open corner statement (kn.verm.polynom_halbexp_kern).
      f3_spezialfall: Stability of the finite-section method (Böttcher–Silbermann) — here, however, with composition transport; the classical
        theory does not apply directly.
      f1_folgt_unmittelbar: No; numerical finding, confirmed independently by two strands with their own code.
      f4_uebertragbar: Every base b > η; every cubic model with the same μ.
    bewertung:
      recherche: No analysis of these sections found in the literature (phases 1–3).
      nutzen: Shows that the corner mode is not an obstacle of the matter but of the representation.
      richtigkeit: numerical up to N = 2000, two independent programs
    titel: 'In the right coordinate the corner mode disappears: the truncated equations remain uniformly stable up to N = 2000'
    aussage: |
      (i) With lens $S=0.0166$ we have $\|\hat J_N^{-1}\|=1.251155$ for **every** measured $N=100\dots2000$ (cubic model with the same corner), $1.250337$ with Kneser's coefficients
      and likewise at the true $p_N$ up to $N=2000$ — whereas in the usual coordinate $\|\tilde J_N^{-1}\|=1.852,\ 9.10,\ 70.7$ ($N=200,400,600$) grows exponentially.

      (ii) The lens must lie everywhere above the growth profile $\Lambda(\tau)$ of the corner mode (threshold $S^*\approx0.0118$, notch test predicted blind and confirmed).
      Because of the complex exponent $\kappa_1$ the corner pattern rotates by $1.45^\circ\cdot\ln N$: a **tangential** lens loses from $N\approx1000$ on, a lens with a **corner** at $L$ remains stable
      (factorized Schur norm constant $1.332$ up to $N=2000$).
    bereich: '$\hat J_N=T_N^wC_kJ_N$: the Jacobian matrix in the conformal coordinate $w$ of $\bar D\cup$ lens over $\Gamma_{\rm in}$ ($k:\mathbb
      D\to$ interior, $k(0)=0$); lens height $S$'
    einfach: The exponentially growing weak point of the equations is to a large extent a consequence of the coordinates in which one computes.
      If one writes the equations in a coordinate adapted to the corner, everything remains uniformly well solvable — measured up to degree 2000.
    quellen:
    - stelle: phase3/k_kern/BERICHT §3–§5, phase3/v_pruefstand/BERICHT §3.1–3.2, §3.12–3.13
  en_theorie:
    beispiel: |
      Without lens: $1.366$ ($N=100$), $1.852$ ($N=200$), $9.10$ ($N=400$), $70.7$ ($N=600$). With lens: always $1.251155$. A deliberate notch in the lens profile makes the growth return exactly there and
      with the predicted rate.
    einordnung: |
      Equivalent to the open corner statement for smooth data — hence no proof, but the clearest indication that the convergence is not a coincidence. Core: [[kn.verm.polynom_halbexp_kern]].
    genau: |
      In the conformal coordinate of $\bar D\cup$ lens, $\|\hat J_N^{-1}\|=1.251155$ remains for $N=100\dots2000$; without lens the same quantity grows exponentially.
    warum: |
      1. One writes the equations not in powers of $x$ but in powers of a coordinate $w$ that maps a somewhat larger domain (circle plus a thin lens) onto the unit disk.
      2. The corner mode grows like $e^{cN}$ with $c\approx0.012$; the lens damps exactly the directions in which it lives, by $e^{-SN}$. If $S>c$ everywhere, the damping wins.
      3. Because the corner pattern rotates slowly ($1.45^\circ\cdot\ln N$), the lens must have a corner at $L$ — a tangentially attached lens eventually loses.
    worum: |
      The truncated equations seemed to have an exponentially growing weak point at $L$ ([[kn.beob.polynom_eckmode]]). Is this a property of the matter — or of the coordinates?
- id: kn.beob.polynom_moebius_schwelle
  quelle_hash: 2718f01908c2
  theorie_hash: 691a5a7b612b
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: Prove the negative direction (convergence on D forces convergence on W).
      f3_spezialfall: Like the forum's cautionary example “intuitive = regular” at base √2 (tid 153), which looked the same up to matrix size
        100.
      f1_folgt_unmittelbar: Threshold ⇔ pole in W proved (Theorem M2), behavior numerical.
      f4_uebertragbar: For exp there is no pole of f_K in the domain W — only L, L̄ on the boundary; therefore only the polynomial part remains.
    bewertung:
      recherche: 'Literature on truncation methods (strand C) and forum mirror: only the related √2 cautionary example (tid 153).'
      nutzen: Touchstone for every proof framework and a reminder to be cautious with numbers.
      richtigkeit: numerical, threshold proved
    titel: 'Cautionary example Möbius rotation: just above the threshold the method looks convergent up to N ≈ 100 and then tips over'
    aussage: |
      Below the threshold ($c<\pi/3$ in the symmetric case) $p_N$ converges geometrically to the Möbius root, with rate $e^{-g(\zeta_p)}$ (Green's function at the pole of the root) and
      constant prefactor; above it the branch runs away — **just above the threshold only after apparent convergence up to $N\approx100$**. In the hyperbolic case ($c=2$) the branch jumps
      already at $N=1$ onto a wrong family of solutions. With the fixed points $L,\bar L$ (“Möbius-exp”, almost Kneser's geometry, but without a corner mode) the linear pole bound holds with constant $1.01$.
    bereich: Rotation $g$ of the projective line about non-real fixed points (no real fixed points, like exp), rotation angle $c$; canonical root
      = rotation by $c/2$
    einfach: 'A model without real fixed points shows how deceptive numbers can be: Up to degree 100 everything looks like convergence, and then
      it tips over. That is why good numbers alone are not enough for eˣ either — and why computations there went up to degree 1500.'
    quellen:
    - stelle: Strand E (m1*–m8*, r2_*, r3_*)
  en_theorie:
    beispiel: |
      At Kneser's fixed points $L,\bar L$ (“Möbius-exp”) the linear pole bound holds with constant $1.01$ up to $N=160$ — there only the corner mode is missing, which $e^x$ additionally has.
    einordnung: |
      Reminder concerning [[kn.verm.polynom_halbexp]]; that is why computations went up to $N=1500$ there ([[kn.beob.polynom_halbexp_fehlergesetz]]).
    genau: |
      Möbius rotation: below the threshold geometric convergence with rate $e^{-g(\zeta_p)}$; just above, apparent convergence up to $N\approx100$, then divergence.
    warum: |
      Above the threshold the pole of the desired root lies in the domain of convergence of the polynomials; the polynomials cannot represent it. For small $N$, however, the good
      part still dominates — only later does the growing one overtake it.
    worum: |
      How deceptive can good numbers be? A model shows: very.
- id: kn.beob.polynom_rand_plateau
  quelle_hash: 5db1fa4c696f
  theorie_hash: 47b67ddbae39
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    gegenbeispielsuche: Prediction written down before the computation (strand V), then checked in three clean quintic models; the unsuitable
      model (|μ| = 2, nearly singular sections) discarded.
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: Proof or refutation of the uniform convergence on D̄ for Kneser itself.
      f3_spezialfall: —
      f1_folgt_unmittelbar: No; model finding plus chain of inference via the explicit corner profile.
      f4_uebertragbar: Every base with a rotating boundary fixed point; the zone becomes tiny with smaller |μ|.
    bewertung:
      recherche: No prior work known.
      nutzen: 'Fixes the right target version: uniformly without small neighborhoods of L, L̄.'
      richtigkeit: numerical on models (N ≤ 3200); for Kneser only extrapolation
    titel: 'The method presumably does not converge uniformly up to the boundary: in models with fast rotation the error stalls near L'
    aussage: |
      In a model with $|\mu|=2.6$ the error $\Pi_NU-U$ stops falling in a **fixed** zone near $L$ on the $\Gamma_{\rm out}$ side ($|x-L|\approx0.13$–$0.15$) from $N\approx1000$ on:
      plateau $1.2$–$2.3\cdot10^{-6}$ up to $N=3200$; at $L$ itself, on the $\Gamma_{\rm in}$ side and in the interior it continues to converge. For $|\mu|=2$ it falls everywhere up to $N=2400$.
      The cause is the rotation of the corner pattern: the primal corner head rotates on the $\Gamma_{\rm out}$ side into its growth sector.
      **Consequence (chain, not recomputed):** For Kneser's $|\mu|=1.172$ the same effect would occur only from $N\gtrsim10^{10}$ at distance $r_*\sim10^{-6}$ from $L$.
    bereich: Truncation method for models with boundary fixed point $L$ and multiplier $\mu$; $\Pi_NU-U$ for a known exact solution $U$
    einfach: 'The sharpest version of the conjecture — “uniformly up to the boundary” — is probably false for astronomically large degrees: In
      models in which the corner rotates faster, the error stays put in a small zone next to L. Coefficients and p_N(1) are far away from it and
      are not affected.'
    quellen:
    - stelle: phase3/v_pruefstand/BERICHT §3.14 (Test T1), phase3/k_kern/BERICHT §22–§23
  en_theorie:
    beispiel: |
      Model with $|\mu|=2.6$: error in the zone $1.2$–$2.3\cdot10^{-6}$ from $N=1000$ to $3200$, while it continues to fall at $L$ itself and in the interior.
    einordnung: |
      That is why the main theorem aims at $\bar D$ without small neighborhoods of $L,\bar L$: [[kn.satz.polynom_hauptsatz_kr0]]. The older assumption [[kn.verm.polynom_halbexp_eckmoden]] demanded control up to $L$.
    genau: |
      In models with fast rotation the error stays put in a fixed zone next to $L$ from $N\approx1000$ on; for Kneser this would occur only at $N\gtrsim10^{10}$ at distance $\sim10^{-6}$ from $L$.
    warum: |
      1. Near $L$ the solution consists of corner profiles that rotate slowly with $N$ ([[kn.satz.polynom_eckprofil]]).
      2. If the primal part on the $\Gamma_{\rm out}$ side rotates into a sector in which it grows, the error there can no longer fall.
      3. For a large multiplier $|\mu|$ this happens already at reachable degrees; for Kneser's $|\mu|=1.17$ the rotation is so slow that it happens only at astronomical degrees.
    worum: |
      Does the conjecture hold in the sharpest version “uniformly up to the boundary $|x|=|L|$”? The computations up to degree 1500 say yes — but the behavior at the corner speaks against it, at some point.
