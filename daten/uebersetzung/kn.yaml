    warum: |
      Computed, not proved, with the same idea as in [[kn.beob.stufe5]]:
      1. For a base $b$ the engine knhexinit builds the Kneser-type hexation (at the repelling fixed point of the pentation, about 31 digits).
      2. On a grid $x\in[2,6]$ the minimum of $H_b(x)-x$, then Newton on $H_b'(x)=1$; this gives $m(b)=H_b(x^*)-x^*$.
      3. $\eta_6$ is the base with $m=0$ (secant method, seven steps down to $|m|<10^{-33}$).
      Check: the same computation with 45 instead of 30 digits agrees to 32 digits.
    worum: |
      The next pair after $(e_5,\eta_5)$: At which base does the **hexation** $b\uparrow\uparrow\uparrow\uparrow x$ touch the line $y=x$? The answer lies at $b\approx1.8$,
