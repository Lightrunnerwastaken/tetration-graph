- id: br.beob.ausgewogene_raenge_entartung
  quelle_hash: f751b92f7084
  theorie_hash: 0b5c3b5044a1
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Balanced ranks degenerate at 1: the balanced pentation has a triple fixed point there'
    aussage: |-
      From $\ln P(e^\ell)=F^{[s]}(\ell)$ with $s=\ell/\ln2$ and $F^{[s]}(\ell)=\ell+s\ell^2+(s^2-\tfrac s2)\ell^3+\dots$ it follows formally that
      $$\ln P(e^\ell)=\ell+\frac{\ell^3}{\ln2}-\frac{\ell^4}{2\ln2}+O(\ell^5).$$
      Numerically: $(\ln P-\ell)/\ell^3=1.439155$ at $\ell=0.005$ and $1.446369$ at $\ell=-0.005$; mean $1.442762$ against $1/\ln2=1.442695$, slope $-0.7214$ against $-1/(2\ln2)=-0.7213$
      (two settings equal to 22 digits). So the fixed point 1 is triple (two sheets, repelling on both real sides).
      Formally (computed only for rank 5), the balanced step of rank $k$ has the form $\zeta+\zeta^{k-2}/(\ln2)^{k-4}+\dots$: the degeneracy grows with the rank.
    bereich: Balanced pentation $P(y)=y[4]y$ with the continuation br.satz.klammerung_fortsetzung; log coordinate $\ell=\ln y$
    einfach: 'For the balanced variants, the point 1 becomes "flatter" with every rank: the map deviates from the identity ever more slowly there.'
    pruefung:
      f1_folgt_unmittelbar: Formally yes (inserting the flow formula); uniform validity for $s\to0$ is not proved.
      f2_benutzte_voraussetzungen: Continuation via the Fatou coordinate; expansion of the fractional iterate for small $s$.
      f3_spezialfall: No.
      f4_uebertragbar: Ranks ≥ 6 need multi-sheeted Fatou coordinates (not computed).
      f5_neue_frage: Balanced ranks ≥ 6 numerically; how many sheets does the step of rank k really have?
    bewertung:
      nutzen: Shows that left and balanced ranks from 5 on are built differently.
      richtigkeit: numerical for rank 5 (4 digits in the coefficient), formal for higher ranks
    quellen:
    - stelle: forschung/runde_2026_10_25/14_klammerungen/BERICHT.md, Finding 12; kanonisch.py (kanonisch_A.txt, kanonisch_B.txt; the report gives
        1.43932 instead of 1.439155)
  en_theorie:
    einordnung: 'Contrast to the simple germs of the left ranks [[br.satz.linke_raenge_keim]]; sheets at the parabolic fixed point: [[it.satz.leau_fatou]].'
    genau: '$\ln P(e^\ell)=\ell+\ell^3/\ln2-\ell^4/(2\ln2)+\dots$: a triple fixed point.'
    warum: The iteration number $s=\ell/\ln2$ is itself small; the second term $s\ell^2$ thereby becomes a third one.
    worum: What does the step of the balanced pentation $y\mapsto y[4]y$ look like at 1?
- id: br.beob.boettcher_kneser_abstand
  quelle_hash: 197496ce9765
  theorie_hash: 0dd5d68fbfd2
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: Böttcher and Kneser differ for x²+1 only by a shift of 4.5·10⁻⁷ (defect E = 3.9·10⁻¹⁴)
    aussage: |
      - $x^2+1$: $\max\lvert p\rvert=4.476914\cdot10^{-7}$, $\lvert\hat p(1)\rvert=1.4006\cdot10^{-7}$, $\lvert\hat\theta_B(-1)\rvert=1.401\cdot10^{-7}$, defect $E=2\sum m\lvert\hat\theta_B(-m)\rvert^2=3.92\cdot10^{-14}$;
      - $x^4+1$: $\max\lvert p\rvert=2.199189\cdot10^{-4}$, $\lvert\hat p(1)\rvert=8.5462\cdot10^{-5}$, $\lvert\hat\theta_B(-1)\rvert=8.546\cdot10^{-5}$, $E=1.46\cdot10^{-8}$

      (two settings agree to $6\cdot10^{-17}$, two heights agree to $10^{-16}$; the noise is at $10^{-16}$, so $S_B\neq S_K$ is also clearly visible numerically.)
      Scan $d=2$: $|\hat p(1)|=6.65\cdot10^{-8}$ ($c=0.5$), $1.40\cdot10^{-7}$ ($c=1$), $3.02\cdot10^{-7}$ ($c=2$). **Weak conjecture (5 cases):**
      $|\hat p(1)|\approx e^{-2\pi\delta}$ with effective width $\delta=2.39\ldots2.63$ ($d=2$) and $1.49$ ($d=4$), roughly matching the bandwidth $\pi/(2\ln d)=2.27$ and $1.13$ from the proof,
      with a $c$-dependent prefactor. Runs with $c=4$, $d=4,c=2$ and $d=6$ failed because of overflow.
    bereich: $S_B$, $S_K$ as in br.satz.boettcher_nicht_kneser; $S_B(x)=S_K(x-1+p(x))$ with 1-periodic, real-analytic $p$; defect $E$ from br.satz.reelle_kennzeichnung
    einfach: The two solutions of x²+1 are different, but on the number line they differ only in the seventh digit. For practical computations
      they are the same — and yet only one of them is "Kneser". The error measure E from the real characterization sees the difference directly.
    pruefung:
      f1_folgt_unmittelbar: No (measured).
      f2_benutzte_voraussetzungen: Böttcher series, Kneser solver in two settings, negative modes at two heights Y = 0.03 and 0.06.
      f3_spezialfall: 'no'
      f4_uebertragbar: To every x^d + c with an escaping critical orbit; numerically limited by overflow.
      f5_neue_frage: Does ln|p̂(1)| = −2πδ(c, d) + O(1) hold with an explicit δ? Where are the singularities of p?
    bewertung:
      nutzen: Impressively shows how close another natural solution can lie to Kneser; test case for the defect E.
      richtigkeit: numerical to 10⁻¹⁶; size law weakly supported
    quellen:
    - stelle: forschung/runde_2026_10_18/09_superfunktionen/BERICHT.md, B2, B3 and Section 6; s7_boettcher.py, s8_scan.py
  en_theorie:
    worum: |
      How different are the Böttcher and Kneser superfunctions actually?
    genau: |
      For $x^2+1$: $S_B(x)=S_K(x-1+p(x))$ with $\max|p|=4.5\cdot10^{-7}$, defect $E=3.9\cdot10^{-14}$; for $x^4+1$: $2.2\cdot10^{-4}$ and $1.5\cdot10^{-8}$, respectively.
    warum: |
      Presumably both solutions are holomorphic in a wide band, and the difference is exponentially small in the bandwidth, about $e^{-2\pi\delta}$ with $\delta\approx\pi/(2\ln d)$ (weakly supported).
    einordnung: |
      Similar pattern to [[kl.beob.zwei_abel]] and [[kl.verm.streifenbreite]]; measured with the defect from [[br.satz.reelle_kennzeichnung]].
- id: br.beob.gegenbeispiel_doppelpunkt
  quelle_hash: f9c8502ae022
  theorie_hash: b66277e7db9e
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: The stage-4 counterexamples a and c each have a double point — they lie outside the Jordan case
    aussage: |-
      Counterexample a ($p=-0.035254\sin2\pi x+0.000462(\cos2\pi x-1)+0.03\sin4\pi x$) has exactly one double point, at $x\approx0.372$ and $0.614$ (point $\approx26.192+5.473i$);
      counterexample c ($p=-0.046023\sin2\pi x-0.001672(\cos2\pi x-1)+0.03\sin4\pi x$) at $x\approx0.341$ and $0.637$ ($\approx26.196+5.464i$); in both cases a small loop forms at the top.
      The perturbations are small ($|p|<0.07$), but steep: $\max p'\approx0.60$ (a) and $0.67$ (c), above the bound $0.431$ from br.satz.sehnenkriterium.
      So br.satz.momente_jordan says nothing about these examples.
    bereich: 'Counterexamples from br.satz.endlich_viele_reichen_nicht: a satisfies $M[\theta_T^2]=M[\theta_T]^2$, c the slog formula; data forschung/identitaeten_2026_10_14/etappe4/daten/gegenbeispiel_*_40.json'
    einfach: The old "look-alikes" of Kneser that satisfy individual formulas have a wave curve with a small knot. So they do not contradict the
      new theorem.
    pruefung:
      f1_folgt_unmittelbar: No (measured).
      f2_benutzte_voraussetzungen: 'Polygons with N = 400, 600 and other nodes (k = 4, dps 20): one intersection each time.'
      f3_spezialfall: 'no'
      f4_uebertragbar: —
      f5_neue_frage: Are there counterexamples to the whole moment family with a double point? → br.frage.momente_doppelpunkt
    bewertung:
      nutzen: Shows that the Jordan case does not cover the known counterexamples, and why.
      richtigkeit: numerical, three samplings
    nachgeprueft:
    - ergebnis: 'Cross-check when entering (25.10.2026): s2_fein.py 16 600 a and c respectively (new sampling) gives exactly one intersection
        each, at x ∈ [0.3717, 0.3733] with [0.6133, 0.6150] (a) and [0.3400, 0.3417] with [0.6367, 0.6383] (c); max p′ from the Fourier data 0.5985
        (a) and 0.6662 (c).'
    quellen:
    - stelle: forschung/runde_2026_10_25/04_momentenfamilie/BERICHT.md, Finding X; s2_fein.py, daten/log_s2_ac_15_400.txt, daten/log_s1_20_4.txt
  en_theorie:
    beispiel: 'Counterexample a: double point at $x\approx0.372$ and $0.614$.'
    einordnung: 'The examples come from [[br.satz.endlich_viele_reichen_nicht]]; open case: [[br.frage.momente_doppelpunkt]].'
    genau: Their wave curves each have a double point with a small loop at the top.
    warum: The perturbations are small, but steep ($p'$ up to 0.6); the speed fluctuates so strongly that two points of the curve meet.
    worum: Why do the known look-alikes of Kneser not contradict the Jordan theorem?
- id: br.beob.hauptblatt_singularitaet_trig
  quelle_hash: 63728c008087
  theorie_hash: 691e97ce5aaf
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Bendings by a trigonometric polynomial have a log singularity on the principal sheet in Re z > −2 — 48 of 48 cases
    aussage: |-
      For $p=0.1\sin2\pi z$, $0.01\sin2\pi z$, $0.1(\cos2\pi z-1)$, $0.03\sin4\pi z$, a mixture and 43 random monotone $p$ of degree $\le4$ there is $z^*\in H$, $\mathrm{Im}\,z^*>0$,
      with $\sigma(z^*)=-2$, reached from the real point $\mathrm{Re}\,z^*$ vertically without $\sigma$ hitting the cut $(-\infty,-2]$. There $T$ has a log singularity
      on the principal sheet ($\sigma'(z^*)\ne0$), so it is not in Hol(H). The hits:
      $-1.34447550088905+0.43879214577273i$ ($\varepsilon=0.1$), $-1.40241335014+0.84925715767i$ ($0.01\sin$), $-1.65165420789+0.33975837427i$ ($\cos-1$),
      $-1.68002515627+0.26418492215i$ ($\sin4\pi z$), $-1.70286485526+0.22694484402i$ (mixture); in each case $|\sigma(z^*)+2|<10^{-40}$.
      For $\varepsilon=0.1$ the image of the vertical path stays entirely in the upper half-plane (distance to the cut $\ge0.019$ up to 1 % before the end).
      Thus the observation from br.beob.verbiegungen_singularitaeten becomes a proof on the principal sheet: the possibility left open there, "all branch points
      on secondary sheets", does not occur for these bendings.
    bereich: $T=\mathrm{sexp}_K\circ\sigma$, $\sigma=\mathrm{id}+p$, $p$ a real trigonometric polynomial with $p(0)=0$ and $1+p'>0.05$ on $\mathbb
      R$; base $e$
    einfach: For many different bendings of Kneser one finds a point in the right half-plane where the bent tetration becomes infinite like a
      logarithm — on the path that one reaches directly from the real line. So such bendings are not smooth everywhere.
    pruefung:
      f1_folgt_unmittelbar: 'No: location of the root and course of the path are computed; the log singularity at −2 on the principal sheet is
        known.'
      f2_benutzte_voraussetzungen: Only σ is evaluated (no Kneser value); holomorphy of sexp_K on ℂ ∖ (−∞, −2]; sign change of Im σ on 4000 and
        12000 path points respectively (dps 30/40), floating point.
      f3_spezialfall: Confirms br.satz.taylorradius_halbebene (E) on examples.
      f4_uebertragbar: To every base b > η and every entire bending, as far as the root lies on the principal sheet.
      f5_neue_frage: Does it hold for every non-constant entire p (br.verm.verbiegung_hauptblatt)?
    bewertung:
      nutzen: Rules out the obvious counterexample candidates for Q*.
      richtigkeit: 'numerical; cross-check 25.10.2026: script run again (same 5 hits, 43 of 43), ε = 0.1 confirmed with own code (findroot, 20000
        path points, bisection)'
    quellen:
    - stelle: forschung/runde_2026_10_25/01_halbebene_eindeutigkeit/BERICHT.md, B9, B10; hauptblatt.py, log_hauptblatt.txt, log_gegenprobe.txt,
        log_zufall.txt
  en_theorie:
    beispiel: '$\varepsilon=0.1$: $z^*=-1.34447550088905+0.43879214577273i$; the image of the path stays entirely in the upper half-plane.'
    einordnung: 'Makes [[br.beob.verbiegungen_singularitaeten]] precise; supports [[br.verm.verbiegung_hauptblatt]]; why counting is not enough:
      [[br.kor.nebenblatt_minus2_regulaer]].'
    genau: In 48 of 48 cases there is $z^*\in H$ with $\sigma(z^*)=-2$ that is reached vertically from the axis without $\sigma$ hitting the cut.
    warum: On the principal sheet, $\mathrm{sexp}_K$ is logarithmically singular at $-2$. If $\sigma$ stays outside $(-\infty,-2]$ along the path,
      one is on the principal sheet, and $T$ becomes infinite at $z^*$.
    worum: Do bendings of Kneser really have their singularities in $H$ on the principal sheet — or only on secondary sheets, where they would
      not matter?
- id: br.beob.klammerung_werte
  quelle_hash: a474f7353b4a
  theorie_hash: b75c5145cc23
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Values of the continued variants to over 20 digits: 2[4]3 = 14.6545…, 2[5′]½ = 3.3049…, 2[6′]½ = 8.4762…'
    aussage: |-
      Setting A (dps 30, $n=300$, $K=12$) against B (dps 50, $n=1500$, $K=18$), 22 digits equal:
      $2[4]3=14.654511776029386087290142357920$, $2[4]\sqrt2=2.5519515900664733159948710551$, $e[4]3=5164.0796335205401942184734139$, $\tfrac12[4]3=0.75719198254705640265505464700$;
      $2[5']\tfrac12=3.3049080007536475312904140452$, $2[5']\tfrac32=468247.12773186285106947604232$, $e[5']\tfrac12=12.540371827877451627512874303$, $\tfrac12[5']\tfrac12=0.56420394844110023442988843693$;
      $F^{[1/2]}(1)=1.5134281085001618745523784596$ (group check $F^{[1/2]}\circ F^{[1/2]}(1)-e=3\cdot10^{-46}$).
      Left hexation to base 2: the step in log coordinates is $G(\zeta)=F(F(F(\zeta)))e^{-\zeta}=\zeta+2\zeta^2+5\zeta^3+\tfrac{65}6\zeta^4+\dots$ (no fractional iterate needed), and
      $2[6']\tfrac12=8.4762321835075403787413216014$ (15 digits between two settings; semigroup check $1.3\cdot10^{-37}$; check $\ln(2[6']1)=1024\ln2$).
      Cross-check when entering with a different method (formal half-iterate near 0 instead of Fatou coordinate, dps 40): $F^{[1/2]}(1)$, $2[4]\sqrt2$, $2[5']\tfrac12$ equal to 30 digits, $2[6']\tfrac12$ to 25 digits.
      $F^{[1/2]}(1)$ is $\mathrm{prodtet}_e(\tfrac12)$ and agrees with br.beob.produkt_tetration_werte (1.5134281085).
    bereich: Continuation according to br.satz.klammerung_fortsetzung; $a[4]b$ balanced with $b=2^t$; left hexation to base 2 via its own step
    einfach: Concrete numbers for the new fractional towers, confirmed to more than 20 digits and by two different computation routes.
    pruefung:
      f1_folgt_unmittelbar: No (computation).
      f2_benutzte_voraussetzungen: Fatou series up to $K$ terms, $n$ backward and forward steps respectively, Newton inversion.
      f3_spezialfall: No.
      f4_uebertragbar: To every left or balanced variant with a parabolic germ at 1.
      f5_neue_frage: Higher left ranks with non-integer base (rank 6′ to base $e$) need fractional iterates in the step itself.
    bewertung:
      nutzen: Check values for any future computation on these variants.
      richtigkeit: numerical, 22 digits; confirmed when entering with a second method to 25–30 digits
    quellen:
    - stelle: forschung/runde_2026_10_25/14_klammerungen/BERICHT.md, Findings 6, 14; kanonisch.py, hexation_links.py, kanonisch_A.txt, kanonisch_B.txt,
        hexation_A.txt, hexation_B.txt
  en_theorie:
    einordnung: 'Computation following [[br.satz.klammerung_fortsetzung]]; germ of the left hexation: [[br.satz.linke_raenge_keim]]; $F^{[1/2]}(1)=\mathrm{prodtet}_e(\tfrac12)$
      as in [[br.beob.produkt_tetration_werte]].'
    genau: $2[4]3=14.6545117760\ldots$, $2[5']\tfrac12=3.3049080007\ldots$, $F^{[1/2]}(1)=1.5134281085\ldots$, $2[6']\tfrac12=8.4762321835\ldots$
    warum: Two settings of the Fatou computation agree to 22 digits; a second method (formal half-iterate near 0) confirms the values to 25–30
      digits.
    worum: Check values of the continued variants.
- id: br.beob.kneser_kurve_sehnen
  quelle_hash: 9177ab940cd0
  theorie_hash: e8626c5efe98
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Kneser's θ-curve has no double point and goes around positively; every horizontal line meets it at most twice; chord constant m* =
      0.3010
    aussage: |-
      $\Gamma_K$ has no double point and goes around $c=M[\theta]=a_0$ once positively (area $+0.0762$); every horizontal line meets it at most twice, and on all
      horizontal chords $\mu>0$. The chord constant is
      $$m^*=\inf_{t<s}\frac{\mu(s,t)}{\min(s-t,\,1-s+t)}=0.3010,$$
      attained at $t=0.2414$, $s=0.7412$ at height $\mathrm{Im}\,\theta=5.4532$ (almost exactly opposite: $s-t\approx\tfrac12$).
    bereich: base $e$; $\Gamma_K=\theta((0,1))$ on the real axis; $\mu$ and $m^*$ as in br.satz.sehnenkriterium
    einfach: 'The curve that Kneser''s wave draws on the number line does not intersect itself and has a simple shape: every horizontal line meets
      it at most twice.'
    pruefung:
      f1_folgt_unmittelbar: No (measured).
      f2_benutzte_voraussetzungen: Sampling N = 400 (dps 15), 600 (dps 16), 800 (dps 18) with geometric refinement down to x = 10⁻¹²; the tip
        itself only analytically.
      f3_spezialfall: 'no'
      f4_uebertragbar: Not yet computed for base 2 and other bases above η.
      f5_neue_frage: Can the absence of double points be proved, e.g. via the univalence of θ as a function of q = e^{2πiz} on the disk?
    bewertung:
      nutzen: Supplies the number that makes the chord criterion explicit.
      richtigkeit: numerical, three samplings, four digits
    nachgeprueft:
    - ergebnis: 'Cross-check when entering (25.10.2026): s2_fein.py 16 600 kneser (new polygon, 671 points) gives 0 intersections, area 0.076155,
        winding number +1; s4_sehnen.py with 4000 and 8000 heights gives m* = 0.3010 at the same place.'
    quellen:
    - stelle: forschung/runde_2026_10_25/04_momentenfamilie/BERICHT.md, Findings K and m*; s2_fein.py, s4_sehnen.py, daten/log_s4_15_400.txt,
        daten/log_s4_18_800.txt
  en_theorie:
    beispiel: 'The narrowest point lies almost exactly opposite: $t=0.2414$, $s=0.7412$.'
    einordnung: 'Used in [[br.satz.sehnenkriterium]]; local form: [[kn.satz.theta_singularitaet]].'
    genau: Free of double points, once positively around $a_0$, every horizontal line is met at most twice; $m^*=0.3010$.
    warum: Measured on polygons with 400 to 800 points; at the tip (at the integers) the curve runs very slowly to infinity, and only the local
      form helps there.
    worum: What does the curve look like that Kneser's wave $\theta$ draws on the real axis?
- id: br.beob.kneser_logkonvex
  quelle_hash: ebc34136662b
  theorie_hash: f931ea0dae47
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: Kneser has T′ log-convex (minimum of (log T′)″ = 0.9196) — but this does not characterize
    aussage: |
      $(\log T')''>0$ on $(-2,\infty)$ with minimum $0.9196$ at $x\approx-0.04$ (equivalently: $1/\mathrm{slog}'$ convex). Measured on $(-2,2]$ (step 0.02, dps 40);
      to the right of that proved via $(\log T')''(x+1)=(\log T')''(x)+T''(x)$ and $T''>0$ for $x\ge0$. The linear tetration has $(\log T')''=0$ on $(-1,1)$, so it lies exactly on the boundary.
      Not characterizing: it is an open condition, and all nearby bendings satisfy it too.
    bereich: Kneser tetration to base $e$ on $(-2,\infty)$
    einfach: The derivative of Kneser's tetration is "logarithmically curved upward", with a clear margin. But this also holds for slightly bent
      tetrations, so it does not pin down Kneser.
    pruefung:
      f1_folgt_unmittelbar: To the right of 2 yes (recursion); on $(-2,2]$ only measured.
      f2_benutzte_voraussetzungen: Functional equation, $T''>0$ for $x\ge0$ (inflection point at −0.5218).
      f3_spezialfall: Counterpart to the log-convexity in Bohr–Mollerup.
      f4_uebertragbar: To other bases; there other minima.
      f5_neue_frage: Is there a base for which the log-convexity of $T'$ breaks?
    bewertung:
      nutzen: Clarifies that log-convexity does not work here as it does for Γ.
      richtigkeit: numerical on (−2, 2], proved to the right
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, L; e4_logkonvex.py
  en_theorie:
    worum: |
      Is $T'$ log-convex like Γ?
    genau: |
      For Kneser yes, with $\min(\log T')''=0.9196$; the linear tetration lies exactly on the boundary with $(\log T')''=0$.
    warum: |
      To the right of 2, $(\log T')''(x+1)=(\log T')''(x)+T''(x)$ carries the positivity over; measured on the left.
    beispiel: |
      Minimum at $x\approx-0.04$.
    einordnung: |
      Open condition, so it does not characterize ([[br.satz.endliche_vorzeichen_offen]]); comparison with [[br.frage.bohr_mollerup]].
- id: br.beob.kneser_ungerade_99
  quelle_hash: 0a4a76330aa5
  theorie_hash: 4d7247723610
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: 'Kneser: all odd Taylor coefficients up to order 99 positive on [−1.95, 1.5]'
    aussage: |
      $c_{2n+1}(x)>0$ for $2n+1\le99$ on $x\in[-1.95,0.5]$ and, as far as two computation routes agree (orders 75–99), on $(0.5,1.5]$.
