      Extends the measurement for gr.verm.ungerade_ableitungen from order 25 to 99.
    bereich: Kneser tetration to base $e$, $x\in[-1.95,0.5]$ (step 0.05), plus $(0.5,1.5]$ via two centers; dps 60
    einfach: For Kneser's tetration, all odd derivatives up to the 99th are positive at all points checked — as mike3 conjectured.
    pruefung:
      f1_folgt_unmittelbar: For high orders the positivity follows from br.satz.taylorradius_halbebene; for middle orders it does not.
      f2_benutzte_voraussetzungen: Taylor data from stage 3; for $x>0.5$ cancellation in the exp route, so counted only when two routes agree.
      f3_spezialfall: No.
      f4_uebertragbar: To other bases with the same method.
      f5_neue_frage: Middle orders at $x>1$ — there Levenstein predicts first sign changes of the even orders only very late.
    bewertung:
      nutzen: Stronger evidence for mike3's conjecture.
      richtigkeit: numerical, dps 60
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, K; e1_kneser_ungerade.py, e1b_rechts.py
  en_theorie:
    worum: |
      New measurement for mike3's conjecture.
    genau: |
      All odd Taylor coefficients up to order 99 are positive on $[-1.95,1.5]$.
    warum: |
      Computation with 60 digits; for $x>0.5$ counted only where two computation routes agree.
    beispiel: |
      Smallest normalized value 0.952 at $k=1$, $x\approx-1.65$.
    einordnung: |
      Supports [[gr.verm.ungerade_ableitungen]]; consequence of it: [[br.satz.ungerade_ableitungen_halbebene]].
- id: br.beob.produkt_iteration_dreieck
  quelle_hash: 3c43bd435efb
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'The iteration of x·eˣ: a new counting triangle and exact Fatou coefficients'
    aussage: |-
      As for $e^x-1$ (it.satz.zeta_polynom_partitionen), the coefficients of $(xe^x)^{\circ t}$ are polynomials in $t$; in the binomial basis
      $\binom tj$ the integer triangle $2;\ 3,12;\ 4,84,144;\ 5,510,2760,2880;\dots$ arises, with diagonal $n!(n-1)!$ and row sums $2,15,232,6155$.
      At $t=-1$ one gets $(-n)^{n-1}$, i.e. the coefficients of Lambert W — the counterpart of the Möbius number for $e^x-1$.
      The Fatou coordinate is exactly
      $$\alpha(x)=-\tfrac1x+\tfrac12\ln x-\tfrac x6+\tfrac{x^2}{16}-\tfrac{19x^3}{540}+\tfrac{x^4}{48}-\tfrac{41x^5}{4200}+\tfrac{37x^6}{103680}+\dots$$
      (for $e^x-1$: $-\tfrac2x+\tfrac13\ln x-\tfrac x{36}+\tfrac{x^2}{540}+\dots$). All coefficients are rational because $\ln F=\ln x+x$ holds exactly: $\alpha(F)-\alpha=1$ becomes
      $(1-e^{-x})/x+\beta x+\sum c_k(F^k-x^k)=1$ (22 terms in forschung/runde_2026_10_25/14_klammerungen/fatou_reihe_ausgabe.txt); $|c_k|(2\pi)^k/(k-1)!$ stays for $k\le22$
      between 0.03 and 5.4. The triangle, row sums, Julia coefficients $2,-3,10,-50,321,-2422$ and the
      half iterate are not in the OEIS; only the simple iterates (×2, A185298) are known.
    einfach: For product tetration, too, the coefficients of the fractional repetitions count something — the numbers for this are not yet in
      any sequence database. Backward (t = −1), exactly the known coefficients of the Lambert W function appear.
    beweis:
      text: Polynomiality in $t$ as for every formal iteration with $f'(0)=1$ (Jabotinsky); the value at $t=-1$ is the inverse series $W(x)=\sum(-n)^{n-1}x^n/n!$;
        Fatou coefficients from the recursion of $\alpha(xe^x)=\alpha(x)+1$. Checked exactly up to $n=16$.
    pruefung:
      f1_folgt_unmittelbar: The identities yes; the combinatorial interpretation (chains of pointed partitions, Chapoton–Vallette) has not been
        checked.
      f2_benutzte_voraussetzungen: Formal power series.
      f3_spezialfall: Analogous to it.satz.zeta_polynom_partitionen.
      f4_uebertragbar: To every map $x\,h(x)$ with $h(0)=1$.
      f5_neue_frage: Which objects does the triangle count — chains in the lattice of pointed partitions?
    bewertung:
      nutzen: New counting sequences and exact tools for product tetration.
      richtigkeit: complete for the identities; interpretation open
    quellen:
    - stelle: forschung/identitaeten_2026_10_14/BERICHT_ETAPPE1.md, K5/K6; b_diagonalen.py, a_fatou.py
- id: br.beob.produkt_tetration_werte
  quelle_hash: 0abbbf4fb4a6
  theorie_hash: 3423bb890be3
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'Fatou product tetration: prodtet_e(½) = 1.5134281085 — the interpolation in the forum was already right'
    aussage: |
      With the Fatou coordinate from br.satz.produkt_parabolisch (descent with Lambert W to $x\approx5\cdot10^{-5}$, there the series
      $\alpha(x)=-\tfrac1x+\tfrac12\ln x-\tfrac16x+\tfrac1{16}x^2-\tfrac{19}{540}x^3+\dots$, then back) one gets
      $$\mathrm{prodtet}_e(\tfrac12)=1.5134281085\ldots$$
      The check $\mathrm{prodtet}_e(-1)=W(1)$, $\mathrm{prodtet}_e(0)=1$, $\mathrm{prodtet}_e(1)=e$ holds to 20 digits. The value from the Lagrange interpolation
      in the forum ($1.5134$, tid 1816) agrees in all digits given there: the interpolation "far to the left, then forward" lands at the Fatou solution,
      just as for base $\eta$.
    einfach: With the natural method for slow fixed points one gets a definite value for the product tetration at ½. The value the forum found
      with a simple interpolation in Desmos agrees with it.
    pruefung:
      f1_folgt_unmittelbar: No (computed).
      f2_benutzte_voraussetzungen: Fatou coordinate up to $x^{6}$, 20000 descents with Lambert W, 40 digits.
      f3_spezialfall: 'no'
      f4_uebertragbar: To every base via the change of base (br.def.produkt_tetration).
      f5_neue_frage: Is the Fatou product tetration convex on all of ℝ, and why does the Lagrange interpolation hit it (convergence theorem as
        for Lévy, it.konstr.levy)?
    bewertung:
      nutzen: Gives reference values for experiments with product tetration.
      richtigkeit: numerical
    quellen:
    - stelle: Value 1.5134 (Lagrange interpolation, Desmos)
    - {}
  en_theorie:
    beispiel: |
      Check: the same computation with $c=1$ gives $e$ to 20 digits.
    einordnung: |
      Theorem behind it: [[br.satz.produkt_parabolisch]]; questions about the shape: [[br.frage.verwandte_funktionen]].
    genau: |
      $\mathrm{prodtet}_e(\tfrac12)=1.5134281085\ldots$; the forum value $1.5134$ (Lagrange interpolation) agrees in all given digits.
    warum: |
      Computation: go back a thousand times with $W$ to near 0, shift by $\tfrac12$ there in the Fatou coordinate, then go forward the same number of times with $xe^x$.
      The interpolation in the forum does essentially the same — far to the left the function is almost linear in the Fatou coordinate — which is why it hits the value.
    worum: |
      Concrete numbers for the natural product tetration, and a comparison with the forum value.
- id: br.beob.verbiegungen_singularitaeten
  quelle_hash: a432ede56e96
  theorie_hash: 5e380fdba29f
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Bendings of Kneser have singularities in Re z > −2: Taylor radius 0.2–1.7 instead of x + 2, odd derivatives negative from order 3–15'
    aussage: |-
      All 13 bendings tested violate C(0) at 8–20 of 20 grid points (smallest violating odd order 3, 5 or 15); radius at $x=0.3$: 0.20–1.74 instead of 2.3.
      The only exception in the measurement window: $\varepsilon=10^{-6}$ (singularity at height 2.42, outside all disks with $x\le0.4$).
      Sine perturbation: logarithmic branch points at $\varphi(z_0)=-2$ on the principal sheet, height $\approx\ln(4(x+2)/\varepsilon)/2\pi$ (e.g. $\varepsilon=0.03$: $z_0\approx-0.318+0.766i$).
      Möbius bending: branch points at distance $\delta=\ln(1/|a|)/2\pi$ from the axis, hence $\rho_T\le\delta$ for all $x$.
      Small perturbation, gross violation: $\varepsilon=10^{-3}$ gives $T^{(5)}(-0.6)=-0.408212081901$ (Kneser $5.40941046332$); $\varepsilon=0.03$ gives $T'''(0)=-5.98442555504$ (Kneser 1.2747).
    bereich: '$T=\mathrm{sexp}_K(x+p(x))$: sine, cosine and Möbius perturbations and the counterexamples from stage 4; grid $x=-1.5,\dots,0.4$,
      orders $k<100$, dps 50'
    einfach: Even a tiny bending of Kneser makes some odd derivatives negative, because it creates a disturbance point in the complex plane that
      shortens the Taylor series considerably.
    pruefung:
      f1_folgt_unmittelbar: The height formulas follow from the log singularity at −2 (derived); location and sheet numerical.
      f2_benutzte_voraussetzungen: Holomorphy of Kneser on $\mathbb C\setminus(-\infty,-2]$; series composition, two routes agree to 12 digits.
      f3_spezialfall: Confirms br.satz.taylorradius_halbebene (E) in examples.
      f4_uebertragbar: To every perturbation with entire, non-constant $p$ (argument principle), as far as the solutions lie on the principal
        sheet.
      f5_neue_frage: Is there a bending whose branch points all lie on secondary sheets? For trigonometric polynomials no (48 cases, br.beob.hauptblatt_singularitaet_trig);
        in general br.verm.verbiegung_hauptblatt.
    bewertung:
      nutzen: Shows that the local condition is very selective in practice.
      richtigkeit: numerical, two independent routes
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, E1, E2, E3, X, Table 2; e2_stoerungen.py, e3_singularitaeten.py,
        t2_gegenprobe.py
  en_theorie:
    beispiel: '$\varepsilon=10^{-3}$: $T^{(5)}(-0.6)=-0.408$ instead of $+5.409$.'
    einordnung: Evidence for [[br.satz.taylorradius_halbebene]] and for [[br.frage.halbebene_eindeutigkeit]].
    genau: They have branch points in $\mathrm{Re}\,z>-2$, at height $\approx\ln(1/\varepsilon)/2\pi$; as a result the Taylor radius drops and
      even low odd derivatives become negative.
    warum: Where $z+p(z)=-2$ holds, $T=\mathrm{sexp}_K(z+p(z))$ inherits Kneser's log singularity at $-2$.
    worum: How do genuine bendings of Kneser violate the local condition?
- id: br.def.hyperoperation
  quelle_hash: 33e5aa60a2be
  theorie_hash: dd794f98c082
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Hyperoperations and Knuth arrows
    aussage: '$a\uparrow\uparrow n=a^{a^{\cdot^{\cdot^{a}}}}$ ($n$ levels), $a\uparrow^{k+1}n$ iterates $\uparrow^k$. The name “tetration”: Goodstein
      1947; arrow notation: Knuth 1976.'
  en_theorie:
    beispiel: |
      $3\uparrow\uparrow3=3^{27}=7\,625\,597\,484\,987$. $2\uparrow\uparrow5=2^{65536}$ has $19\,729$ digits. Fifth level (pentation): $2\uparrow\uparrow\uparrow3=2\uparrow\uparrow(2\uparrow\uparrow2)=2\uparrow\uparrow4=65\,536$.
    einordnung: |
      The entry point in the textbook: Chapter 0 and [[gr.def.turm]]. How fast the levels grow is measured by logic ([[br.satz.kalmar]]).
    genau: |
      $a\uparrow b=a^b$, $a\uparrow\uparrow n=a^{a^{\cdot^{\cdot^{a}}}}$ ($n$ levels, parenthesized from the right), and in general $a\uparrow^{k+1}n$ iterates the operation $\uparrow^k$:
      $a\uparrow^{k+1}(n+1)=a\uparrow^k(a\uparrow^{k+1}n)$. The name “tetration” comes from Goodstein (1947), the arrows from Knuth (1976).
    warum: |
      A definition. Parenthesized from the right, because $(a^a)^a=a^{a\cdot a}$ would only be an exponentiation and would bring nothing new.
    worum: |
      Tetration is the fourth level of a ladder: repeated addition gives multiplication, repeated multiplication gives exponentiation, repeated exponentiation gives tetration —
      and so on. For the levels there is a notation of its own, with arrows.
- id: br.def.iteration_wirkung
  quelle_hash: 56c1414db613
  theorie_hash: 97d71c11e791
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'Iteration as an action: heights from an arbitrary number domain, superfunctions as compatible maps'
    aussage: |
      Let $A$ be a monoid (for example $\mathbb N$, $\mathbb R$, $\mathbb C$ with $+$). An **$A$-action** on a set $Y$ is $F:A\times Y\to Y$ with
      $F(0,y)=y$ and $F(a+b,y)=F(a,F(b,y))$ — "$F(a,\cdot)$ is the $a$-th iterate". Integer iteration is the $\mathbb N$-action $F(n,y)=f^{\circ n}(y)$.
      A superfunction $\chi$ with $\chi(a+1)=f(\chi(a))$ is a **compatible map** from the shift $a\mapsto a+1$ on $A$ to $f$ on $Y$.
      If $\chi$ is invertible, then $F_\chi(a,y)=\chi(a+\chi^{-1}(y))$ is an $A$-action that continues the integer iterates of $f$ — this is exactly the
      route tetration → fractional iterates of $\exp$. Globally this works only if $f$ has the same orbit structure as the shift (bijective, without periodic points).
    einfach: Iterating means applying a map again and again. One can phrase this so generally that the "number of repetitions" may come from any
      number domain. A tetration is then a translator between "count one further" and "compute e to the power once".
    formen:
    - notiz: action law
    - notiz: from an invertible superfunction
  en_theorie:
    beispiel: |
      $A=\mathbb R$, $f=\exp$, $\chi=T$: $F(\tfrac12,y)=T(\tfrac12+\mathrm{slog}\,y)$ is a half exponential function.
    einordnung: |
      Classical form: [[fg.def.iterationsgruppe]], [[fg.def.abel]]; the ladder of generalizations: [[br.frage.iterationsleiter]].
    genau: |
      An $A$-action $F(a,y)$ with $F(0,y)=y$, $F(a+b,y)=F(a,F(b,y))$; a superfunction is a compatible map from the shift on $A$ to $f$;
      from an invertible superfunction $\chi$ arises the action $\chi(a+\chi^{-1}(y))$.
    warum: |
      Tetration $T$ translates "count one further" into "apply $e^x$ once": $T(a+1)=e^{T(a)}$. If $T$ is invertible (with $\mathrm{slog}$), one can translate every
      shift by $a$ back: $\exp^{\circ a}(y)=T(a+\mathrm{slog}\,y)$ — this is the fractional iteration of $\exp$. The language of actions
      makes clear that this is only one case of a general pattern, and where it hits limits (fixed points, periodic points).
    worum: |
      What does "iterate" mean when the number of steps does not have to be an integer?
- id: br.def.produkt_tetration
  quelle_hash: 765bec836606
  theorie_hash: e30352c9a460
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'Product tetration: the superfunction of x·aˣ'
    aussage: |
      The **product tetration** to base $a>1$ is the superfunction of $g_a(x)=x\,a^x$ with starting value 1:
      $$\mathrm{prodtet}_a(c+1)=g_a(\mathrm{prodtet}_a(c)),\qquad \mathrm{prodtet}_a(0)=1.$$
      Going backward is done with Lambert W: $g_e^{-1}=W$, so $\mathrm{prodtet}_e(c-1)=W(\mathrm{prodtet}_e(c))$. Values: $\mathrm{prodtet}_e(-1)=W(1)=0.567143\ldots$,
      $\mathrm{prodtet}_e(1)=e$, $\mathrm{prodtet}_e(2)=e^{e+1}$. For $c\to-\infty$, $\mathrm{prodtet}_e(c)\to0$.
      **All bases are one:** $\ln a\cdot g_a(x)=g_e(x\ln a)$, so $g_a$ is conjugate to $g_e$ by a scaling and
      $$\mathrm{prodtet}_a(c)=\frac{\mathrm{prodtet}_e\bigl(c+\mathrm{prodslog}_e(\ln a)\bigr)}{\ln a}.$$
    einfach: Instead of computing "a to the power" again and again, one computes "x times a to the power x" again and again. This grows even a
      bit faster than tetration. Unlike for tetration, every base is just a stretched version of the base e — so one only has to understand a
      single function.
    formen:
    - notiz: descent with Lambert W
    - notiz: change of base is a scaling
    quellen:
    - {}
    - stelle: Change of base (there without proof)
  en_theorie:
    beispiel: |
      $\mathrm{prodtet}_e(1)=1\cdot e^1=e$, $\mathrm{prodtet}_e(2)=e\cdot e^e=e^{e+1}\approx41.19$, $\mathrm{prodtet}_e(-1)=W(1)=0.567143$ (the omega constant).
    einordnung: |
      How to continue it: [[br.satz.produkt_parabolisch]], values: [[br.beob.produkt_tetration_werte]]; the inverses $\omega_n$ of $x(e^x)\uparrow\uparrow n$: [[gr.def.epsilon_omega]].
    genau: |
      $\mathrm{prodtet}_a(c+1)=\mathrm{prodtet}_a(c)\,a^{\mathrm{prodtet}_a(c)}$, $\mathrm{prodtet}_a(0)=1$; backward with Lambert W; all bases are scalings of the base $e$.
    warum: |
      With $t=x\ln a$ one gets $x\,a^x\cdot\ln a=t\,e^t$. So whoever can iterate $t\mapsto te^t$ can do every base. For tetration this does not work —
      $a^x$ and $e^x$ are not connected by a scaling, which is why so much depends on the base there.
    worum: |
      A sister of tetration: instead of $x\mapsto a^x$ one iterates $x\mapsto x\,a^x$.
- id: br.frage.bohr_mollerup
  quelle_hash: 9eba94c0a896
  theorie_hash: 5fe7b267d267
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
  en:
    naechste_frage: Test on Kneser values which convexity conditions are satisfied, and whether periodic perturbations always violate them (counterexample
      search with $\theta=c\sin2\pi x$, $c\to0$).
    titel: Is there a real (Bohr–Mollerup-type) characterization of Kneser's tetration?
    aussage: |
      $\Gamma$ is uniquely determined by logarithmic convexity. For tetration, fg.kor.nichteindeutigkeit and
      ar.satz.keine_arith_info show: analyticity and monotonicity are not enough; the known uniqueness theorems are complex-variable theorems.
      Is there a real condition (convexity of all derivatives of $\operatorname{slog}$, total monotonicity, Carleman limit) that selects exactly Kneser's solution?
      Literature: For difference equations $\Delta f=g$ the Bohr–Mollerup theory is well developed (Krull 1948/49, Webster 1997, Marichal–Zenaïdi 2022:
      uniqueness as soon as $g$ is eventually $p$-convex). It does not apply directly here: $T(x+1)=b^{T(x)}$ and $\operatorname{slog}(b^x)=\operatorname{slog}(x)+1$
      are Abel and conjugation equations, respectively, not a $\Delta f=g$ with known $g$. Real partial answers: Hooshmand (convexity, kn.satz.hooshmand);
      for $b<\eta$ Szekeres' totally monotone Abel function (it.satz.szekeres_monoton).
  en_theorie:
    beispiel: |
      Bohr–Mollerup: $\Gamma(x+1)=x\Gamma(x)$, $\Gamma(1)=1$ and $\log\Gamma$ convex determine $\Gamma$ uniquely. A counterpart for $T(x+1)=e^{T(x)}$ is not known.
    einordnung: |
      Next step: test on Kneser values which convexity conditions are satisfied, and whether small periodic perturbations $\theta=c\sin2\pi x$ always violate them. Candidate: [[kn.verm.carleman_kneser]].
    genau: |
      Is there a real condition — for instance convexity of all derivatives of $\operatorname{slog}$, total monotonicity or the Carleman limit — that selects exactly Kneser's solution among the real-analytic tetrations?
    warum: |
      Open. What is known: analyticity and monotonicity do not suffice ([[fg.kor.nichteindeutigkeit]], [[ar.satz.keine_arith_info]]); Hooshmand's conditions even select the linear solution ([[kn.satz.hooshmand]]);
      the proved uniqueness theorems are complex-variable theorems ([[kn.satz.paulsen_cowgill]]).
    worum: |
      The gamma function is the only continuation of the factorial that is “logarithmically convex” — a purely real condition. Is there something like that for tetration? So far only complex-variable
      conditions select Kneser's solution.
- id: br.frage.halbebene_eindeutigkeit
  quelle_hash: 91d7b6df23a3
  theorie_hash: e2bbb8719ac3
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Q*: Is every real tetration that is holomorphic on Re z > −2 already Kneser?'
    aussage: |-
      Paulsen–Cowgill without the limit condition at $i\infty$, half-plane version. Approach: $\theta_T=h\circ T-z$ is then periodic and holomorphic on the upper half-plane except for log points ($T=L$)
      and places where $T$ winds around singular values of $\sigma$ (presumably $0,1,e,e^e,\dots$) (br.satz.enden_klassifikation); one would have to show that $q=e^{2\pi iz}=0$ cannot be an essential singularity. All bendings $\mathrm{sexp}_K\circ(\mathrm{id}+p)$ checked so far with entire,
      non-constant $p$ have branch points in $H$ ($z+p(z)=-2$ has $\sim2N$ solutions per period strip); for 48 trigonometric bendings, numerically documented, each has a branch point on the principal sheet
      (br.beob.hauptblatt_singularitaet_trig, br.verm.verbiegung_hauptblatt).
      Subquestion: For every tetration $\ne$ Kneser, is even $\sup_x\rho_T(x)<\infty$? Then already "$\rho_T$ unbounded" would be characterizing.
      **Status 25.10.2026:** The missing condition at $i\infty$ is exactly "$p_T$ single-valued and $o(e^{2\pi\,\mathrm{Im}\,z})$" (br.satz.halbebene_liouville_scharf); instead of the limit, "near $L$
      in a half-strip" suffices (br.satz.schroeder_kugel_genuegt); every genuine bending leaves the upper half-plane with $\sigma$ (br.satz.verbiegung_schwarz); the possible ends are classified,
      the most natural candidate for a counterexample is a swapped Kneser (br.frage.vertauschtes_kneser).
    einfach: Is it enough for uniqueness that the tetration is smooth in the right half-plane of the complex numbers? This is open, and whether
      a simple real characterization exists depends on this question.
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, D, Open questions 1 and 3
  en_theorie:
    beispiel: All bendings checked so far have branch points in the half-plane.
    einordnung: Related to [[kn.verm.tk_c2]]; decides [[br.satz.lokal_genau_dann_halbebene]].
    genau: Open. Paulsen–Cowgill additionally need $T(z)\to L$ for $\mathrm{Im}\,z\to\infty$.
    warum: Then $\theta_T$ would be periodic and holomorphic above up to harmless points; what is missing is to rule out an essential singularity
      at $q=0$.
    worum: Is holomorphy on $\mathrm{Re}\,z>-2$ (without a limit at $i\infty$) enough for uniqueness?
- id: br.frage.implosion
  quelle_hash: ecae3d5e45e8
  theorie_hash: e0d48de3c164
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    naechste_frage: 'Numerically: plot $m(b)+\pi\sqrt{2\eta/e}(b-\eta)^{-1/2}$ against $\ln(b-\eta)$ and against periodic terms in $(b-\eta)^{-1/2}$
      (exp.randgesetz supplies the first half).'
    titel: Kneser's tetration near η as parabolic implosion
    aussage: |
      For $b\downarrow\eta$ the tower passes the bottleneck at $e$ in $\approx\pi\sqrt{2\eta/e}(b-\eta)^{-1/2}$ steps. Can $T_b^{\mathrm K}$
      be described, after subtracting this transit time, by the Lavaurs map (from the two Fatou coordinates of $e^u-1$), and
      does a rigorous boundary law for $m(b)$ with constant and phase term follow from this?
    quellen:
    - {}
    - stelle: Lemma 8.2
  en_theorie:
    einordnung: |
      Next step: plot $m(b)+\pi\sqrt{2\eta/e}(b-\eta)^{-1/2}$ against $\ln(b-\eta)$ and against periodic terms in $(b-\eta)^{-1/2}$. Related: [[bw.lem.randgesetz]], [[kl.frage.stetig_eta]].
    genau: |
      For $b\downarrow\eta$ the tower passes the bottleneck in $\approx\pi\sqrt{2\eta/e}(b-\eta)^{-1/2}$ steps. Can $T_b^{\mathrm K}$, after subtracting this transit time, be described by the Lavaurs map (from the two
      Fatou coordinates of $e^u-1$) — and does a rigorous boundary law for $m(b)$ with constant and phase term follow from it?
    warum: |
      Open. What speaks in favor: At $\eta$ itself the situation is parabolic and described by Fatou coordinates ([[kl.satz.eta_koordinate]]); just above it, it is exactly the situation of implosion.
    worum: |
      For bases just above $\eta$ the tower squeezes through the bottleneck at $e$. The theory of parabolic implosion describes such passages very precisely. Can one use it to describe Kneser's
      tetration near $\eta$ and the boundary law exactly?
- id: br.frage.iterationsleiter
  quelle_hash: 10b4456d873f
  theorie_hash: c0ff630c5b25
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'MphLee''s ladder: from integer iteration to hyperoperations of arbitrary rank'
    aussage: |
      The notes arrange generalizations of iteration as a ladder (levels of description):
      1. integer iteration ($\mathbb N$-actions);
      2. real and complex iteration (tetration, Kneser, Fatou coordinates belong here);
      3. general monoids as "time";
      4. preorders as time: discrete, this gives complete recursion and iteration over ordinal numbers ($\omega$-composition),
         continuous, it gives composition integrals;
      5. arbitrary categories as time (functor categories, 2-categories);
      6. the construction applied to itself is supposed to give Goodstein-like hyperoperations of arbitrary rank — described by the author himself as "almost"
         reached.
      Open is whether level 6 really yields a definition of fractional ranks, and whether it fits with the operator approach for the half rank
      (kn.frage.halber_rang). Further open points in the notes: measuring obstructions to continuations via cohomology, and understanding the
      "log-like" counterpart via characters.
    einfach: 'A researcher in the forum builds a staircase: at the bottom is ordinary repeating, at the very top the operations of every level
      are supposed to stand — addition, multiplication, power, tetration and everything in between. The upper levels are not yet fully built.'
    quellen:
    - stelle: The "ladder" post, May 2022
  en_theorie:
    beispiel: |
      Level 4, discrete: iteration over ordinal numbers, for instance $f^{\circ\omega}=\lim_n f^{\circ n}$ — this is the road to ordinal tetration (br.satz.ordinal_tetration).
    einordnung: |
      Basic notion: [[br.def.iteration_wirkung]]; the question of fractional ranks from the analytic side: [[kn.frage.halber_rang]].
    genau: |
      Integer → real/complex iteration → monoids → preorders (ordinal numbers, integrals) → categories → hyperoperations of arbitrary rank.
    warum: |
      Each level replaces the "time" (the height) by a more general structure. The hope of the top level: if iteration is itself an operation
      that can be iterated, the hyperoperations arise by themselves — and with them perhaps a sense of fractional ranks.
    worum: |
      A map of the generalizations of iterating, laid out in the forum by MphLee as a "ladder".
- id: br.frage.kneser_hardy
  quelle_hash: 64d444423ea6
  theorie_hash: b096a585c329
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
  en:
    naechste_frage: 'Read Boshernitzan 1986; if open: numerically test sign changes of $T''''(x)T(x)-cT''(x)^2$ etc. for large $x$ (via slog reduction).'
    titel: Does the germ of Kneser's tetration lie in a Hardy field?
    aussage: Is every element of $\mathbb R(x,T,T',T'',\dots)$ eventually of fixed sign? A secondary source (a summary) attributes to Boshernitzan
      having shown this for, among others, Kneser's solution — **not checked against the original**.
  en_theorie:
    einordnung: |
      Next step: read Boshernitzan 1986; otherwise search numerically for sign changes of expressions like $T''T-cT'^2$ for large $x$ (via the slog reduction). Background: [[br.satz.boshernitzan]], [[br.frage.transexp]].
    genau: |
      Is every element of $\mathbb R(x,T,T',T'',\dots)$ eventually of fixed sign, i.e., does the germ of Kneser's tetration lie in a Hardy field?
    warum: |
      Open — in any case not settled. A secondary source attributes to Boshernitzan having shown this for, among others, Kneser's solution; this has not been checked against the original.
    worum: |
      Is Kneser's tetration so “well-behaved” that no combination of it and its derivatives changes sign infinitely often for large $x$?
- id: br.frage.momente_doppelpunkt
  quelle_hash: 59b69842b1d9
  theorie_hash: 210e3f6e4e0e
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Is there a tetration ≠ Kneser with a self-intersecting θ_T-curve that satisfies the whole moment family?
    aussage: |-
      By br.satz.momente_jordan, only the case remains of br.frage.momentenfamilie that $\Gamma_T$ has double points; such tetrations already exist for small perturbations
      (br.beob.gegenbeispiel_doppelpunkt). Then $\mathbb C\setminus\Gamma_T$ splits into several subdomains $U_j$: $C_T=1/(\zeta-c)$ holds on $\Omega_T$, on each $U_j$ the function $C_T$ is
      holomorphic, with jumps at the edges, summed over the sheets. On a self-intersecting curve there are many representing measures for $c$ (mixtures of harmonic
      measures of different subdomains) — the argument of the Jordan case does not suffice there. A counterexample has neither been found nor searched for.
      Possible ways: the winding-number function of the curve and an argument as in the Jordan case on the immersed domain over $\Gamma_T$ (Blank's problem); numerically, perturbations with
      $\sin4\pi x$ and large $p'$, for which one sets $V_2,\dots,V_K$ to zero simultaneously, and check whether the solutions converge as $K$ grows.
    einfach: 'Only the case in which the wave curve intersects itself is still open: could a tetration other than Kneser have all power means
      right there?'
    quellen:
    - stelle: forschung/runde_2026_10_25/04_momentenfamilie/BERICHT.md, Finding O, Section "What remains open", Open Questions 1–2
  en_theorie:
    beispiel: 'Candidates: perturbations with $\sin4\pi x$ and large $p''$, for which many moments are set to zero simultaneously.'
    einordnung: Remainder of [[br.frage.momentenfamilie]] after [[br.satz.momente_jordan]].
    genau: Is there $T\neq$ Kneser with a double point in $\Gamma_T$ and $M[\theta_T^k]=M[\theta_T]^k$ for all $k$?
    warum: On a self-intersecting curve there are many distributions with the same Cauchy transform outside; the Jordan argument breaks down.
    worum: The last open case of the moment question.
- id: br.frage.momentenfamilie
  quelle_hash: 612d82bb0553
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Does the moment family M[θᵏ] = M[θ]ᵏ (all k) pin down Kneser?
    aussage: |-
      Kneser satisfies $M[\theta^k]=M[\theta]^k$ for all $k$ (kn.satz.theta_mittelwerte). For general functions this family is weaker than
      “no negative modes” (it sees only the distribution of values; counterexample $f=e^{-2\pi ix}$). **Among tetrations** it is rigid to first order:
      $\delta V_k[p]=0$ for all $k$ forces $p$ to be constant — proved for perturbations that are holomorphic in the strip $|\mathrm{Im}z|<0.09$ (numerically already from $0.0008$).
      Open: does this also hold nonlinearly, or is there a tetration $\neq$ Kneser whose $\theta_T$ is a measure-preserving rearrangement of a boundary function that is holomorphic above?
      **Partial answer (round 25.10.2026):** If the wave curve $\theta_T$ is free of double points, the moment family forces Kneser (br.satz.momente_jordan, sketch), in particular for all $T$ with
      $0.7686<\varphi'<1.4306$ (br.kor.momente_umgebung) — without a strip condition. Only the case with a double point remains open (br.frage.momente_doppelpunkt).
    einfach: A simpler family of conditions — "the mean of the powers is the power of the mean" — already suffices locally to pin down Kneser.
      Whether it also suffices globally is open.
    quellen:
    - stelle: forschung/identitaeten_2026_10_14/etappe4/BERICHT_ETAPPE4.md, M; s3_univalenz.py
- id: br.frage.transexp
  quelle_hash: ab49f2045259
  theorie_hash: d02fd8a0c080
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    kern: zweitpruefung
    theorie: nein
  en:
    naechste_frage: Which properties of Kneser's solution (holomorphy in $\mathbb C\setminus(-\infty,-2]$, limits $L,\bar L$) yield the finiteness
      statements needed for Lion's criterion? Here tetration theory could contribute to new logic.
    titel: Is there a transexponential o-minimal structure?
    aussage: |
      Open problem (Miller dichotomy ⇒ question about growth beyond exp). Proposal by Marker–Miller: extend $\mathbb R_{\mathrm{an},\exp}$
      by a real-analytic solution of $f(x+1)=e^{f(x)}$. Padgett: the terms of $\mathbb R_{\mathrm{transexp}}$ form a Hardy field;
      o-minimality is open (quantifier elimination is missing). **Candidate from tetration theory:** Kneser's tetration.
  en_theorie:
    einordnung: |
      Why the known structures do not suffice: [[br.satz.nicht_definierbar]]. Related: [[br.frage.kneser_hardy]], [[kn.satz.kneser_eigenschaften]].
    genau: |
      Is there an o-minimal structure that defines functions growing faster than every iterated exponential? Proposal by Marker–Miller: extend $\mathbb R_{\mathrm{an},\exp}$ by a real-analytic solution of $f(x+1)=e^{f(x)}$.
      Padgett: the terms of the extension form a Hardy field; o-minimality is open.
    warum: |
      Open. What is missing is a quantifier elimination, or the finiteness statements one needs for o-minimality. Perhaps Kneser's complex properties (holomorphic on $\mathbb C\setminus(-\infty,-2]$,
      limits $L,\bar L$) provide exactly such finiteness statements — then tetration theory would contribute to new logic.
    worum: |
      Is there a “tame” mathematical world in which tetration lives? This is an open problem in logic — and Kneser's solution is a natural candidate.
- id: br.frage.vertauschtes_kneser
  quelle_hash: a367d258e3af
  theorie_hash: c3aad3f3d3e5
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Is there a "swapped Kneser" — a tetration on Re z > −2 that tends to L̄ instead of L at the top?
    aussage: |-
      By br.satz.enden_klassifikation (iii), the Schröder exponent at $\bar L$ would have to be a secondary branch $\log\bar L+2\pi ik$ with $k\ge1$ — so what is sought is a
      Kneser-type construction with a different branch of the multiplier logarithm. Paulsen–Cowgill does not rule this out (there $L$ is required at the top).
      This is the most natural candidate for a counterexample to Q* (br.frage.halbebene_eindeutigkeit).
      Further open subquestions: Can $E_T=\sigma(T)L^{-z}$ have a pole or an essential singularity at $q=0$? Can $T$ near $i\infty$ wind around the values $0,1,e,\dots$?
      Are the singular values of $\sigma$ exactly $0,1,e,e^e,\dots$?
    einfach: Kneser's tetration tends to the fixed point L far up. Could there be another, equally smooth tetration that instead tends to the
      mirrored fixed point? If so, the uniqueness question Q* would be answered with No.
    quellen:
    - stelle: forschung/runde_2026_10_25/01_halbebene_eindeutigkeit/BERICHT.md, B6 and Open Questions 1, 2, 4
  en_theorie:
    beispiel: For Kneser itself, $k=0$ at $L$.
    einordnung: From [[br.satz.enden_klassifikation]]; main question [[br.frage.halbebene_eindeutigkeit]].
    genau: At $\bar L$ it would have to have the Schröder exponent $\log\bar L+2\pi ik$ with $k\ge1$, that is, a secondary branch of the multiplier
      logarithm.
    warum: $|\bar L^{z}|$ grows upward; for the Schröder coordinate to tend to 0 nevertheless, it needs additional windings $e^{2\pi ikz}$.
    worum: 'The most natural candidate for a counterexample to Q*: a tetration that tends to $\bar L$ at the top.'
- id: br.frage.verwandte_funktionen
  quelle_hash: b2c40f158afd
  theorie_hash: ca9f73093521
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: What else one can investigate about related functions
    aussage: |
      Open, in part simple, questions about the functions of this area:
      - **Product tetration:** Is the Fatou solution convex, and is it (as for η) the only one with a monotonicity condition? What do $\mathrm{prodtet}'$
        and the derivative with respect to the base look like (analogous to gr.ableitung)? Is there a product superroot via the $\omega_n$ (gr.def.epsilon_omega)?
      - **Exponential factorial:** Does the continuation via sexp depend on the choice of the comparison function, and is it compatible with the total monotonicity from
        TPID 2 (ar.frage.ef_fortsetzung)?
      - **Families:** Which maps $x\,h(x)$ or $h(x)-1+u$ have a parabolic start, and do they always give polynomials in the height via a perturbation series
        (kn.konstr.stoerungsreihe)?
      - **Relations:** Are there identities between tetration, product tetration and the $\varepsilon_n$ (for example via $\ln$ steps), as there are
        between tetration and the superroot?
    einfach: 'A list of questions for further research: for the new functions one can investigate the same things as for tetration — derivatives,
      curvature, inverses, uniqueness. Some of these are easy to check at home with a computer.'
  en_theorie:
    beispiel: |
      A starting point: $\mathrm{prodtet}_e'(c)$ from the chain rule, $\mathrm{prodtet}'(c+1)=(1+\mathrm{prodtet}(c))\,e^{\mathrm{prodtet}(c)}\,\mathrm{prodtet}'(c)$ — analogous to gr.ableitung.
    einordnung: |
      Starting points: [[br.satz.produkt_parabolisch]], [[br.satz.vergleichsfunktion]], [[ar.frage.ef_fortsetzung]].
    genau: |
      Convexity and uniqueness of product tetration, derivatives with respect to height and base, product superroots, dependence of the exponential factorial on the
      comparison function, families with a parabolic start, identities between the functions.
    warum: |
      For tetration one already has answers or tools for each of these questions (chapter 1). Trying the same tools on neighboring functions
      shows which properties are special to $a^x$ and which hold generally for fast iteration.
    worum: |
      A work program for related functions — much of it is within reach with a computer.
- id: br.gescheitert.rotationszahl
  quelle_hash: 11e86173076b
  theorie_hash: dec681b0337f
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: —
      f3_spezialfall: —
      f1_folgt_unmittelbar: —
      f4_uebertragbar: 'Rule: before any “new invariant”, check whether it is compatible with the groupoid structure.'
    bewertung:
      nutzen: Prevents a computable but meaningless number.
      richtigkeit: Approach discarded (type error)
    titel: Rotation numbers and commutators of the phase maps
    aussage: |
      Idea: rotation number $\rho(\tilde H_{b,d})$ or commutators $[\tilde H_{e,2},\tilde H_{e,3}]$ as new invariants. Discarded:
      $\tilde H_{b,d}$ maps the base-$d$ phase circle to the base-$b$ phase circle; iteration ($b\ne d$) and the composition
      $\tilde H_{e,2}\circ\tilde H_{e,3}$ are **ill-typed** and have no tetration meaning. Only quantities compatible with the groupoid structure are invariant
      (means in the canonical Abel coordinates).
  en_theorie:
    einordnung: |
      Rule: before any “new invariant”, check whether it is compatible with the groupoid structure ([[bw.prop.gruppoid]]).
    genau: |
      **Discarded.** The idea was to take the rotation number $\rho(\tilde H_{b,d})$ or commutators such as $[\tilde H_{e,2},\tilde H_{e,3}]$ as new invariants. But $\tilde H_{b,d}$ maps the phase circle of base $d$ to that
      of base $b$. Iterating (for $b\ne d$) and $\tilde H_{e,2}\circ\tilde H_{e,3}$ have no tetration meaning.
    warum: |
      A map $A\to B$ can be iterated only if $A=B$. Rotation number and commutator require that; one can still compute the numbers — they just mean nothing.
      Only quantities that fit the change rule (groupoid) are invariant, for instance the means $\mu$.
    worum: |
      Circle maps have a famous invariant, the rotation number. Why not for the phase maps of the base change as well? Because that would be a type error: The
      map goes from one circle to a **different** circle.
- id: br.kor.linke_pentation_ausgewogen
  quelle_hash: f1cedd5de624
  theorie_hash: 58565c4a4aeb
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Left pentation = root of the balanced tetration of x^x: x[5′]t = (x^x [4] 2^t)^{1/x}'
    aussage: $$x[5']t=\bigl(x^x[4]2^t\bigr)^{1/x}.$$
    bereich: $x>0$; integer $t\ge0$, and real $t$ if both sides are continued with the same fractional iteration of $F(m)=me^m$ (br.satz.klammerung_fortsetzung)
    einfach: 'The fifth operation, parenthesized from the bottom, is nothing new: one takes the balanced tetration of x to the x and extracts
      the x-th root.'
    beweis:
      text: $\ln(x^x)=x\ln x=m_0$, so $\ln\bigl(x^x[4]2^n\bigr)=F^{[n]}(m_0)=x\ln(x[5']n)$ by br.satz.klammerung_log_reduktion. For real $t$ both
        sides are defined by the same $F^{[t]}$.
    pruefung:
      f1_folgt_unmittelbar: Yes.
      f2_benutzte_voraussetzungen: Log reduction; for real $t$ a common iteration of $F$.
      f3_spezialfall: Yes, of br.satz.klammerung_log_reduktion.
      f4_uebertragbar: To the convention $a_5b$ with $a^{a-1}$ instead of $x^x$.
      f5_neue_frage: Are there similar bridges between higher left and balanced ranks? (The germs differ, br.beob.ausgewogene_raenge_entartung.)
    bewertung:
      nutzen: Connects two previously separate variants.
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_25/14_klammerungen/BERICHT.md, Finding 2
  en_theorie:
    einordnung: Follows from [[br.satz.klammerung_log_reduktion]].
    genau: $x[5']t=(x^x[4]2^t)^{1/x}$.
    warum: Both start in the logarithm at the same value $m_0=x\ln x$ and iterate the same map $F$.
    worum: How are left pentation and balanced tetration related?
- id: br.kor.linke_varianten_nicht_eta
  quelle_hash: 37c8d9b28824
  theorie_hash: 2260c79bd24f
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: No left variant to a base x > 0 is formally conjugate to the tetration at η or to e^z − 1
    aussage: |-
      For $\eta^x$ around $e$ and for $e^z-1$, $\beta=\tfrac13$; for the left steps, $\beta=\tfrac12$ (rank 5′) and $\beta=(9-2k)/(2x)<0$ (rank $k+1\ge6′$) respectively.
      Because β is a formal conjugation invariant, none of these steps is formally (let alone analytically) conjugate to the η-tetration or to $e^z-1$.
      For rank 5′ this already appears in another form for the product tetration (br.satz.produkt_parabolisch: same germ up to scaling).
    bereich: 'Steps of the left ranks at $y=1$ (br.satz.linke_raenge_keim); η-tetration: $w\mapsto\eta^{e+w}-e$; formal conjugation of parabolic
      germs $z+az^2+\dots$, $a\neq0$'
    einfach: 'The operations parenthesized from the bottom are not a disguised tetration to base e^(1/e): a key number that does not change under
      any change of variables is different.'
    beweis:
      text: |-
        $\beta=1-b/a^2$ is invariant under $z\mapsto cz$ and under every formal conjugation (normal form $z+z^2+(1-\beta)z^3$). $\eta^{e+w}=e+w+w^2/(2e)+w^3/(6e^2)+\dots$ gives $b/a^2=\tfrac23$,
        likewise $e^z-1$. Values for the left steps from br.satz.linke_raenge_keim; $(9-2k)/(2x)=\tfrac13$ would imply $x<0$.
    bedingungen_text: For rank 5′ and for integer bases without condition; for rank $\ge6′$ with non-integer base under the condition of br.satz.linke_raenge_keim.
    pruefung:
      f1_folgt_unmittelbar: Yes, from br.satz.linke_raenge_keim and the invariance of β.
      f2_benutzte_voraussetzungen: Formal classification of parabolic germs (multiplicity and iterative residue).
      f3_spezialfall: Yes; for rank 5′ equivalent to the statement about the product tetration.
      f4_uebertragbar: To every comparison of parabolic hyperoperation variants.
      f5_neue_frage: Is there any real base at all for which a left variant is formally conjugate to a balanced one?
    bewertung:
      nutzen: Separates the variants cleanly from the η-tetration.
      richtigkeit: complete for rank 5′, otherwise as br.satz.linke_raenge_keim
    quellen:
    - stelle: forschung/runde_2026_10_25/14_klammerungen/BERICHT.md, Finding 9
  en_theorie:
    einordnung: 'Follows from [[br.satz.linke_raenge_keim]]; for rank 5′ already at [[br.satz.produkt_parabolisch]]; η-tetration: [[kl.satz.parabolisch]].'
    genau: 'No: its residue is $\tfrac13$, the left steps have $\tfrac12$ or a negative value.'
    warum: The iterative residue does not change under any series of coordinate changes; different residues rule out any conjugation.
    worum: Is a left variant perhaps merely a disguised tetration to base $\eta$?
- id: br.kor.momente_umgebung
  quelle_hash: e95a32d97f86
  theorie_hash: 257812da8731
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Nonlinear uniqueness in an explicit neighborhood: moment family and 0.7686 < φ′ < 1.4306 ⇒ Kneser'
    aussage: |-
      Every real-analytic tetration $T=\mathrm{sexp}\circ\varphi$ with $0.7686<\varphi'<1.4306$ (i.e. $-0.231<p'<0.431$) and $M[\theta_T^k]=M[\theta_T]^k$ for all $k$ is Kneser.
      Unlike the first-order rigidity in br.frage.momentenfamilie, this needs no strip condition on $p$ and does not apply only to small perturbations in the limit.
      The counterexamples from stage 4 that satisfy individual formulas (br.satz.endlich_viele_reichen_nicht) lie outside this neighborhood (br.beob.gegenbeispiel_doppelpunkt).
    bereich: real-analytic tetrations $T=\mathrm{sexp}\circ\varphi$ to base $e$, $\varphi=\mathrm{id}+p$
    einfach: All tetrations that do not differ too much from Kneser (the slope of the bending stays between 0.77 and 1.43) are recognized as Kneser
      by the family of power means — if the gaps in the proof can be closed.
    beweis:
      text: br.satz.sehnenkriterium makes $\theta_T$ free of double points; br.satz.momente_jordan then gives $T=$ Kneser.
      luecken:
      - All gaps of br.satz.momente_jordan (Smirnov class, H¹, orientation at the tip, position of c).
      - m* = 0.3010 only numerical, tip region only qualitative (br.satz.sehnenkriterium).
    pruefung:
      f1_folgt_unmittelbar: Yes, from br.satz.sehnenkriterium and br.satz.momente_jordan.
      f2_benutzte_voraussetzungen: Both theorems with their gaps; real-analytic T with φ′ within the bound.
      f3_spezialfall: Nonlinear version of the first-order rigidity from br.frage.momentenfamilie.
      f4_uebertragbar: To other bases above η with their own m*.
      f5_neue_frage: How large is the largest neighborhood? The convex set from br.satz.sehnenkriterium is much larger than the Lipschitz ball.
    bewertung:
      nutzen: Partial answer to br.frage.momentenfamilie with an explicit neighborhood.
      richtigkeit: Sketch (inherits the gaps of both theorems)
    quellen:
    - stelle: forschung/runde_2026_10_25/04_momentenfamilie/BERICHT.md, Finding N
  en_theorie:
    beispiel: The stage-4 look-alikes have $p'$ up to $0.60$ and $0.67$, respectively, and lie outside.
    einordnung: From [[br.satz.sehnenkriterium]] and [[br.satz.momente_jordan]]; partial answer to [[br.frage.momentenfamilie]].
    genau: $0.7686<\varphi'<1.4306$ and $M[\theta_T^k]=M[\theta_T]^k$ for all $k$ $\Rightarrow$ $T=$ Kneser (sketch).
    warum: In this neighborhood the wave curve is free of double points, and there the Jordan theorem applies.
    worum: An explicit neighborhood of Kneser in which the moment family alone recognizes Kneser.
- id: br.kor.nebenblatt_minus2_regulaer
  quelle_hash: 13bbef717d4d
  theorie_hash: 0cb7fd770c61
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: After crossing (−4, −3) once, −2 is a regular point of sexp_K
    aussage: |-
      On the sheet of $F=\mathrm{sexp}_K$ that one reaches when $z$ crosses the segment $(-4,-3)$ once, near $w=-2$ we have
      $$F(w)=\mathrm{Log}\bigl(\mathrm{Log}\,F(w+2)\pm2\pi i\bigr)\ \to\ \ln2\pi\pm\tfrac{i\pi}2,$$
      so $-2$ is regular there. Therefore merely counting the solutions of $\sigma(z)=-2$ (about $2N$ per period strip for degree $N$) does not yet prove a
      singularity in $H$; one has to follow the sheet (br.beob.hauptblatt_singularitaet_trig).
    bereich: Kneser's $\mathrm{sexp}_e$ and its continuation across the cut $(-\infty,-2]$
    einfach: On another "sheet" of Kneser's tetration the point −2 is harmless. That is why it is not enough to count how often a bending hits
      the value −2 — one has to check which sheet one is on at the time.
    beweis:
      text: |-
        If $z$ crosses the segment $(-4,-3)$, then $z+1$ crosses the segment $(-3,-2)$, and there $F(z+1)$ jumps by $\mp2\pi i$ (kn.satz.minus2_hebbar). So on the new sheet
        $F(w)=\mathrm{Log}\,F(w+1)$ with $F(w+1)=\mathrm{Log}\,F(w+2)\pm2\pi i$. At $w=-2$, $F(0)=1$, so $F(-1)=\pm2\pi i\ne0$ and $F(-2)=\ln2\pi\pm i\pi/2$; everything is holomorphic there.
    pruefung:
      f1_folgt_unmittelbar: Yes, local computation from the jump 2πi across (−3, −2).
      f2_benutzte_voraussetzungen: kn.satz.minus2_hebbar; F(0) = 1.
      f3_spezialfall: Same mechanism as in kn.satz.nebenblatt_zweigpunkte.
      f4_uebertragbar: To every base b > η (jump 2πi/ln b).
      f5_neue_frage: On which sheets is −2 singular? Is there a bending all of whose roots of σ = −2 lie on such regular sheets?
    bewertung:
      nutzen: Explains why the count from round 18 proves nothing and the principal-sheet test is necessary.
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_25/01_halbebene_eindeutigkeit/BERICHT.md, B11
  en_theorie:
    beispiel: $\mathrm{Log}(2\pi i)=1.8379+1.5708i$.
    einordnung: Mechanism like [[kn.satz.nebenblatt_zweigpunkte]], follows from [[kn.satz.minus2_hebbar]].
    genau: 'No: after crossing $(-4,-3)$ once, $F(-2)=\ln2\pi\pm i\pi/2$ is regular.'
    warum: On this sheet $F(-1)=\pm2\pi i$ instead of 0, and the logarithm of that is harmless.
    worum: Is $-2$ singular on every sheet of $\mathrm{sexp}_K$?
- id: br.lem.zungen_bis_unendlich
  quelle_hash: 84ed88192081
  theorie_hash: 967d0c8e4454
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: The regions where a bending σ points downward reach up to i∞, and σ is unbounded in both directions on their boundary
    aussage: |-
      (a) Every connected component of $\{\mathrm{Im}\,\sigma<0\}\cap U$ is unbounded upward (reaches $i\infty$), and on its boundary, where $\sigma$ is real,
      $\sigma$ is unbounded below and above.
      (b) If $\sigma'>0$ on $\mathbb R$, then the component of $\{\mathrm{Im}\,\sigma>0\}\cap U$ adjacent to $\mathbb R$ is unbounded upward.
    bereich: $\sigma=\mathrm{id}+p$ as in br.satz.verbiegung_schwarz, $p$ not constant
    einfach: Where a bending points downward, "tongues" arise that reach all the way up. On the boundary of these tongues the bending takes arbitrarily
      large and arbitrarily small real values — also values below −2, where Kneser's tetration has its cut.
    beweis:
      text: |-
        (a) Suppose $\sigma\ge m$ on the boundary of the component $W_0$. Then $u=\sigma-m+1$ maps $W_0$ into the lower half-plane and the boundary to $[1,\infty)$;
        $\mathrm{Im}\log u\in(-\pi,0)$ is harmonic, bounded, and 0 on the finite boundary. The boundary point $\infty$ is polar, so $\mathrm{Im}\log u\equiv0$ — a contradiction. Likewise for the upper bound.
        A component without $i\infty$ contradicts the maximum principle for $|g|=|e^{2\pi i\sigma}|$ (inside $>1$, on the boundary $=1$).
        (b) If the component were bounded above, $g$ on its image in the $q$-plane would be a proper map into the disk, hence surjective, and would hit 0 — but $g\ne0$ for $q\ne0$.
    pruefung:
      f1_folgt_unmittelbar: Yes, from the extended maximum principle (one boundary point is polar) and the theorem on proper maps.
      f2_benutzte_voraussetzungen: p not constant, single-valued holomorphic on U; for (b) additionally σ′ > 0 on ℝ.
      f3_spezialfall: Phragmén–Lindelöf argument for harmonic functions.
      f4_uebertragbar: To every periodic bending, independent of the tetration.
      f5_neue_frage: Must a boundary curve with σ ∈ (−n−1, −n) reach an integer value before it leaves H? That would prove br.verm.verbiegung_hauptblatt.
    bewertung:
      nutzen: Shows where a bending must hit Kneser's cut — starting point for the principal-sheet proof.
      richtigkeit: complete; re-read in the cross-check
    quellen:
    - stelle: forschung/runde_2026_10_25/01_halbebene_eindeutigkeit/BERICHT.md, B8 and proof of Lemma C
  en_theorie:
    beispiel: '$p=0.1\sin2\pi z$: far up, $\mathrm{Im}\,\sigma\approx y+0.05\,e^{2\pi y}\cos2\pi x$, so the tongues lie above $x\approx\pm\tfrac12$
      (where $\cos2\pi x<0$); on their boundary $\sigma$ also takes values below $-2$.'
    einordnung: Tool for [[br.verm.verbiegung_hauptblatt]]; complements [[br.satz.verbiegung_schwarz]].
    genau: Every component reaches $i\infty$, and $\sigma$ is unbounded below and above on its boundary.
    warum: |-
      If $\sigma$ were bounded below on the boundary, there would be a bounded harmonic function ($\mathrm{Im}\log$ of a shifted $\sigma$) with boundary value 0 that is not 0 —
      the maximum principle forbids this, because a single boundary point $\infty$ does not count.
    worum: 'The regions $\{\mathrm{Im}\,\sigma<0\}$ of a bending: what do they look like, and which values does $\sigma$ take on their boundary?'
- id: br.satz.ackermann
  quelle_hash: 16d51ac2167e
  theorie_hash: d467f652d95d
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: |
        Induction on $n$: $A(m+1,n+1)=A(m,A(m+1,n))$ with $A(m,x)=2\uparrow^{m-2}(x+3)-3$ gives $2\uparrow^{m-2}(2\uparrow^{m-1}(n+3))-3=2\uparrow^{m-1}(n+4)-3$; start
        $A(m+1,0)=A(m,1)=2\uparrow^{m-2}4-3=2\uparrow^{m-1}3-3$. FGH: $f_2(m)=m2^m\ge2^m$, hence $f_3(n)=f_2^{[n]}(n)\ge(2^{\,\cdot})^{[n]}(n)\ge2\uparrow\uparrow n$.
    pruefung:
      f2_benutzte_voraussetzungen: Definition of the hyperoperations (br.def.hyperoperation).
      f5_neue_frage: 'no'
      f3_spezialfall: 'Yes: Grzegorczyk hierarchy, Kalmár (br.satz.kalmar).'
      f1_folgt_unmittelbar: Yes, induction.
      f4_uebertragbar: To transfinite levels f_α (br.satz.ordinal_tetration).
    bewertung:
      nutzen: Connects tetration with computability and algorithm running times.
      richtigkeit: complete
    titel: 'Ackermann function and fast-growing hierarchy: A(4, n) = 2↑↑(n+3) − 3, f₃ ≥ 2↑↑n'
    aussage: |
      For the Ackermann–Péter function ($A(0,n)=n+1$, $A(m+1,0)=A(m,1)$, $A(m+1,n+1)=A(m,A(m+1,n))$) we have
      $$A(1,n)=n+2,\quad A(2,n)=2n+3,\quad A(3,n)=2^{n+3}-3,\quad A(4,n)=2\uparrow\uparrow(n+3)-3,$$
      in general $A(m,n)=2\uparrow^{m-2}(n+3)-3$: The rows of the Ackermann function are the hyperoperations with base 2. In the fast-growing hierarchy
      ($f_0(n)=n+1$, $f_{k+1}(n)=f_k^{[n]}(n)$) we have $f_3(n)\ge2\uparrow\uparrow n$ — tetration is level $f_3$. The inverses grow correspondingly slowly:
      $\log^*$ (gr.satz.logstern) and, even more slowly, the inverse Ackermann function $\alpha(n)$, which appears in the running time of union-find.
    einfach: 'The famous Ackermann function is nothing other than the hyperoperations with base 2, shifted by 3: the fourth row is tetration.'
    quellen:
    - {}
    - {}
    - stelle: inverse Ackermann function in union-find
    - {}
    - {}
  en_theorie:
    beispiel: |
      $A(4,0)=13=2\uparrow\uparrow3-3$, $A(4,1)=65533=2\uparrow\uparrow4-3$, $A(4,2)=2^{65536}-3$ (65536 binary digits).
    einordnung: |
      Related to [[br.satz.kalmar]]. The inverses ($\log^*$, inverse Ackermann function) grow extremely slowly — see [[gr.satz.logstern]].
    genau: |
      $A(1,n)=n+2$, $A(2,n)=2n+3$, $A(3,n)=2^{n+3}-3$, $A(4,n)=2\uparrow\uparrow(n+3)-3$. In the fast-growing hierarchy, $f_3(n)\ge2\uparrow\uparrow n$.
    warum: |
      1. Induction on $n$ with the recursion $A(m+1,n+1)=A(m,A(m+1,n))$: One level of $A(m+1,\cdot)$ applies $A(m,\cdot)$ once — just as one level of tetration
         exponentiates once.
      2. The offset $\pm3$ comes from the starting value $A(m+1,0)=A(m,1)$.
    worum: |
      The Ackermann function, the standard example of a computable but not primitive recursive function, is at its core the ladder of hyperoperations with base 2.
- id: br.satz.boettcher_nicht_kneser
  quelle_hash: a4ac7c19610e
  theorie_hash: 4d646949c117
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: Polynomials have a second natural real superfunction (Böttcher, from ∞) — and it is not Kneser's solution
    aussage: |
      $S_B(z):=\varphi^{-1}\bigl(\exp(G(c)\,d^z)\bigr)$ is a real, real-analytic superfunction of $f$ with $S_B(0)=c$ and $S_B(-1)=0$ (square-root branching at $-2$),
      just like $S_K$ — it corresponds to regular iteration at the superattracting fixed point $\infty$. Nevertheless $S_B\neq S_K$.
      ($G(1)=0.40735452273948$ for $d=2$, $0.17707602108109$ for $d=4$.) For $e^x$ there is no counterpart, because $\infty$ is an essential singularity there.
    bereich: $f(x)=x^d+c$, $d$ even, $f(x)>x$ on $\mathbb R$ (e.g. $x^2+1$, $x^4+1$); Böttcher coordinate $\varphi$ with $\varphi(f(w))=\varphi(w)^d$,
      $\varphi(w)\sim w$ at $\infty$; Green function $G$ of the filled Julia set $K$; Kneser superfunction $S_K$ from kn.satz.zoo_singulaerer_ort
    einfach: 'For polynomials like x²+1 there are two quite different natural ways to apply a function "half as often": one comes from the complex
      fixed point (Kneser), the other from infinity (Böttcher). Both are real and smooth. One can prove that they are not equal.'
    beweis:
      text: |
        The critical orbit $0\to c\to\dots$ runs off to $\infty$, so $K$ is a Cantor set with $K\cap\mathbb R=\emptyset$; $G\ge0$ is harmonic on $\mathbb C\setminus K$,
        $G=0$ on $K$, $G=\log|\varphi|$ near $\infty$. Suppose $S_B=S_K$. Then $G(S_K(z))=G(c)\,\mathrm{Re}\,d^z$ near the real half-line. Let $U_0$ be the component of
        $\{z\in\mathbb H:S_K(z)\notin K\}$ that contains a strip over $(-2,\infty)$; there both sides are harmonic, hence equal; because $G>0$, we get $\mathrm{Re}\,d^z>0$,
        so $U_0\subset B_0=\{0<\mathrm{Im}\,z<\pi/(2\ln d)\}$. Boundary points of $U_0$ in $\mathbb H$ would have $\mathrm{Re}\,d^z=0$, and there are none in $B_0$; hence $U_0=B_0$.
        On the upper edge there then lies the connected curve $x\mapsto S_K(x+i\pi/(2\ln d))$ inside the totally disconnected set $K$, so it is constant — a contradiction.
        Only this is needed: $S_K$ holomorphic on $\mathbb H$, non-constant, real on $\mathbb R$.
    pruefung:
      f1_folgt_unmittelbar: No; the proof needs the Green function, a Cantor set and an open-closed argument.
      f2_benutzte_voraussetzungen: Böttcher coordinate (it.satz.boettcher), K Cantor set (critical orbit escapes), S_K holomorphic on ℍ and non-constant.
      f3_spezialfall: 'Related to it.satz.karlin_mcgregor: regular iterations at two different fixed points (here L and ∞) do not agree.'
      f4_uebertragbar: To every polynomial with an escaping critical orbit and a real superfunction without a real fixed point.
      f5_neue_frage: How large exactly is the difference (br.beob.boettcher_kneser_abstand), and where are the singularities of the connecting
        function p?
    bewertung:
      nutzen: First case of a second, equally natural real superfunction besides Kneser; shows that "natural + real-analytic" does not determine
        Kneser.
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_18/09_superfunktionen/BERICHT.md, B1 and B-B1 (Section 6); s7_boettcher.py
  en_theorie:
    worum: |
      A polynomial $x^d+c$ has two natural starting points for fractional iteration: the complex fixed point $L$ (Kneser) and the superattracting fixed point $\infty$ (Böttcher).
    genau: |
      $S_B=\varphi^{-1}(\exp(G(c)d^z))$ is real-analytic and a superfunction, but $S_B\neq S_K$.
    warum: |
      If $S_B=S_K$, then $G\circ S_K=G(c)\,\mathrm{Re}\,d^z$ would have to hold on a whole band; at its boundary $S_K$ would have to map a curve into the Cantor set $K$ — which is possible only if $S_K$ is constant.
    beispiel: |
      $x^2+1$: $G(1)=0.40735452273948$; $S_B(0)=1$, $S_B(-1)=0$ as for $S_K$.
    einordnung: |
      Related to [[it.satz.karlin_mcgregor]] (regular iterations at different fixed points are different) and [[it.satz.boettcher]]; size of the difference: [[br.beob.boettcher_kneser_abstand]].
- id: br.satz.boshernitzan
  quelle_hash: 824aeb0e610f
  theorie_hash: a5299c0f91f3
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: zweitpruefung
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
  en:
    beweis:
      text: Boshernitzan 1986.
    pruefung:
      f2_benutzte_voraussetzungen: 'To be checked against the original: which solution exactly.'
      f5_neue_frage: Does the Kneser germ lie in a Hardy field? → br.frage.kneser_hardy
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: —
    bewertung:
      nutzen: First bridge tetration ↔ asymptotic analysis.
      richtigkeit: established (literature), detail unchecked
    titel: Transexponential Hardy fields exist
    aussage: There are Hardy fields that contain functions that grow faster than every iterated exponential (solutions of $f(x+1)=e^{f(x)}$).
  en_theorie:
    einordnung: |
      Does Kneser's solution also lie in a Hardy field? [[br.frage.kneser_hardy]].
    genau: |
      There are Hardy fields with functions that grow faster than every iterated exponential, for instance solutions of $f(x+1)=e^{f(x)}$ (Boshernitzan 1986).
    warum: |
      Theorem from the literature; which solution exactly is meant is to be checked against the original. A Hardy field is a field of function germs at $+\infty$ that is closed under differentiation;
      in it every function eventually has a fixed sign.
    worum: |
      Hardy fields are collections of “well-behaved” functions that do not oscillate infinitely often for large $x$. There are such collections that contain functions that grow faster than any
      exponential tower — that is, tetration-like functions.
- id: br.satz.enden_klassifikation
  quelle_hash: 9b845c41231e
  theorie_hash: 9117111428b9
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'How a tetration on Re z > −2 can end at the top: Schröder exponent log L + 2πik or log L̄ + 2πik — only L with k = 0 occurs'
    aussage: |-
      Let $E_T$ be single-valued near $q=0$. Then:
      (i) $E_T$ removable $\iff T\to L$. A zero of order $k$ corresponds to $\sigma(T)\sim e^{z(\log L+2\pi ik)}$, a pole of order $k$ corresponds to $e^{z(\log L-2\pi ik)}$;
      in that case $|\sigma(T)|\to\infty$ (because $2\pi k>b$).
      (ii) Zeros of order $k\ge1$ do not occur (br.satz.schroeder_kugel_genuegt); only Kneser with $k=0$ is realized.
      (iii) If $T$ had the limit $\bar L$ at $+i\infty$ ("swapped Kneser"), the Schröder exponent at $\bar L$ would have to be a secondary branch $\log\bar L+2\pi ik$ with $k\ge1$,
      since $|\bar L^{z}|=e^{ax+by}$ grows and forces $E(0)=0$. Paulsen–Cowgill does **not** rule out this case.
      Candidates for a counterexample to Q* are therefore only: ends without a limit ($E_T$ with a pole or an essential singularity), ends at $\bar L$ with $k\ge1$,
      ends at other fixed points $L_j$ of $\exp$, and $T$ that wind around singular values of $\sigma$ near $i\infty$ (then $E_T$ is multivalued).
    bereich: base $e$; $T\in$ Hol(H); $E_T(q)=\sigma(T(z))\,L^{-z}$ on an upper half-strip, as a function of $q=e^{2\pi iz}$
    einfach: Far up in the complex plane, a tetration that is smooth in the right half-plane can behave in only a few ways. Kneser's way — calmly
      approaching the fixed point L — is the only one that actually occurs, as long as a certain coordinate can be chosen single-valued. What
      remains is a few, precisely named candidates for a counterexample.
    beweis:
      text: |-
        If $E$ is single-valued and removable with a zero of order $k\ge0$, then $\zeta=e^{z(\log L+2\pi ik)}E_1(q)$ with $E_1(0)\ne0$; a pole gives $e^{z(\log L-2\pi ik)}$.
        (ii) from br.satz.schroeder_kugel_genuegt. (iii) With the Schröder function at $\bar L$: bounded $\zeta\to0$ and $|\bar L^{-z}|=e^{-ax-by}\to0$ give $E(0)=0$.
        $\sigma=\Psi^{-1}$ with entire $\Psi$, $\Psi(Lw)=e^{\Psi(w)}$: $\Psi$ omits 0, has no critical points ($\Psi'(Lw)=e^{\Psi(w)}\Psi'(w)/L$, $\Psi'(0)=1$), and the orbit $0,1,e,e^e,\dots$
        consists of asymptotic values.
      luecken:
      - Single-valuedness of E_T requires that T avoids encircling the singular values of σ near i∞; that these are exactly 0, 1, e, eᵉ, … has
        not been proved.
      - 'Pole case: that T then has no limit is not carried out (σ(T) runs along a logarithmic spiral to ∞; Ψ could have an asymptotic value there).'
      - (iii) presupposes a single-valued Schröder coordinate at L̄.
    pruefung:
      f1_folgt_unmittelbar: 'Almost: Laurent classification of the isolated singularity of E_T at q = 0 plus br.satz.schroeder_kugel_genuegt.'
      f2_benutzte_voraussetzungen: Single-valuedness of E_T (gap), univalence of σ near L, Paulsen–Cowgill (via br.satz.schroeder_kugel_genuegt).
      f3_spezialfall: Classification of the ends of a superfunction via the Schröder coordinate, as is usual for Kneser-type constructions.
      f4_uebertragbar: To every base b > η (exponent log λ + 2πik).
      f5_neue_frage: Is there a swapped Kneser (br.frage.vertauschtes_kneser)? Can E_T have a pole or an essential singularity?
    bewertung:
      nutzen: Narrows the possible counterexamples to Q* down to a few named types.
      richtigkeit: Sketch; core (Laurent in q) complete, three named gaps
    quellen:
    - stelle: forschung/runde_2026_10_25/01_halbebene_eindeutigkeit/BERICHT.md, B4, B5, B6, B12 and proof "Finding 4/6"
  en_theorie:
    beispiel: 'Kneser: removable with $E(0)=\kappa\ne0$, so $k=0$.'
    einordnung: 'Open: [[br.frage.vertauschtes_kneser]]; presupposed: [[br.satz.schroeder_kugel_genuegt]].'
    genau: |-
      If $E_T=\sigma(T)L^{-z}$ is single-valued in $q$, a zero of order $k$ corresponds to the exponent $\log L+2\pi ik$, a pole to the exponent $\log L-2\pi ik$.
      Only $k=0$ at $L$ occurs; an end at $\bar L$ would need a secondary branch $k\ge1$.
    warum: An isolated singularity at $q=0$ is removable (with a zero), a pole, or essential. The factor $L^{z}$ decays upward, $\bar L^{z}$ grows
      — so an end at $\bar L$ forces a zero.
    worum: How can a tetration from Hol(H) behave far up, and which cases remain as a counterexample to Q*?
- id: br.satz.endlich_viele_reichen_nicht
  quelle_hash: 0333357c1697
  theorie_hash: f0819dd33594
  herkunft:
    modell: sonnet
    datum: '2026-10-15'
  geprueft: nein
  en:
    titel: No single real mean-value formula — and no finite list — singles out Kneser
    aussage: |
      To first order, every mean-value condition $C$ sees only the part of $p$ with positive frequency:
      $\delta C[p]=\sum_{k\ge1}\hat F_C(k)\,\overline{\hat p(k)}$ with a fixed weight function $F_C$ that is holomorphic above (for instance $F=2(\theta-a_0)(1+\theta')$ for $M[\theta^2]=M[\theta]^2$).
      It follows that **finitely many such equations never pin down Kneser** — there is always a curve of non-constant perturbations $p$ along which all of them hold exactly.
      Explicitly constructed (each equation satisfied to $10^{-35}$ or better, independently re-checked with 50 digits): tetrations $\neq$ Kneser that satisfy
      $M[\theta_T^2]=M[\theta_T]^2$, or the σ-product $=1$, or $\int_1^e\mathrm{slog}_T'^2/h'=1$, or $M[\ln(T'\,h'\circ T)]=0$ — for example
      $p=0.03\sin4\pi x-0.0460228\sin2\pi x-0.00167248(\cos2\pi x-1)$ for the slog formula —, one that satisfies the first and the second at once, and one
      (with a tiny perturbation) that satisfies three formulas and the first three Fourier conditions at once. None of these quantities has an extremum at Kneser.
      The linear tetration violates all of them (e.g. $\int_1^e\mathrm{slog}'^2/h'=0.96753$).
    bereich: real-analytic tetrations $T(x)=\mathrm{sexp}(x+p(x))$, $p$ 1-periodic, $1+p'>0$, $T(0)=1$; conditions from kn.satz.theta_mittelwerte
    einfach: 'A single equation is too weak: there are many tetrations that satisfy it just as well as Kneser does. We have explicitly constructed
      such “look-alikes” for each of the new formulas. To pin down Kneser, one needs infinitely many conditions.'
    beweis:
      text: |
        Linearizing $\theta_T=\theta(x+p)+p$ and the mean-value principle give the weight form (confirmed numerically to $10^{-17}$). If the linear map
        $p\mapsto(\delta C_1,\dots,\delta C_n)$ onto $\mathbb C^n$ is surjective (shown for each single condition, e.g. $\hat F(1)=2a_1\neq0$), the implicit function theorem
        in finitely many trigonometric parameters yields a solution curve. Counterexamples via Newton and secant methods, dps 40, re-checked with dps 50.
    pruefung:
      f1_folgt_unmittelbar: 'Almost: a dimension argument (a function against finitely many numbers); the explicit linearization and the counterexamples
        make it concrete.'
      f2_benutzte_voraussetzungen: Mean-value principle (kn.satz.theta_mittelwerte) for the linearization; because the weights F_C are not integrable
        at the integers, their coefficients must be taken regularized (M[F·(e^{−2πijx} − 1)]); the counterexamples themselves were recomputed
        directly.
      f3_spezialfall: 'Sharpens fg.kor.nichteindeutigkeit: analytic + monotone + finitely many integral equations is not enough.'
      f4_uebertragbar: To any finite list of conditions that depend continuously on p.
      f5_neue_frage: Which infinite family suffices (br.satz.reelle_kennzeichnung)?
    bewertung:
      nutzen: 'Answers whether one of the real Kneser formulas alone suffices: no.'
      richtigkeit: complete; counterexamples to 10⁻³⁵
    quellen:
    - stelle: forschung/identitaeten_2026_10_14/etappe4/BERICHT_ETAPPE4.md, S1, S2, Table 3; s2_gegenbeispiele.py, s5_pruefen.py
  en_theorie:
    beispiel: |
      $p=0.03\sin4\pi x-0.0460228\sin2\pi x-0.00167248(\cos2\pi x-1)$ satisfies $\int_1^e\mathrm{slog}_T'^2/h'=1$ to $10^{-35}$, but is not Kneser.
    einordnung: |
      The formulas themselves: [[kn.satz.theta_mittelwerte]]; what suffices instead: [[br.satz.reelle_kennzeichnung]].
    genau: |
      No: finitely many mean-value equations still admit tetrations $T\neq$ Kneser; such "look-alikes" are constructed explicitly.
    warum: |
      $p$ is an entire function, hence infinitely many numbers; each equation fixes only one number. Finitely many equations cut out of this
      infinite-dimensional space only a surface, on which many others lie besides Kneser.
    worum: |
      Does one of the real Kneser formulas pin down Kneser on its own? **Notation:** every smooth tetration is $T(x)=\mathrm{sexp}(x+p(x))$ with a 1-periodic
      function $p$; its wave is $\theta_T(x)=h(T(x))-x$ with the regular Abel function $h$ at the complex fixed point ([[kn.def.theta_welle]]). Kneser means: $p$ constant.
- id: br.satz.endliche_vorzeichen_offen
  quelle_hash: 0f66a4e938ee
  theorie_hash: e064c2f48568
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: Finitely many sign conditions never separate Kneser from nearby bendings; the boundaries are universal
    aussage: |
      (N3) For every fixed order $n$ and every tetration, $T^{(n)}$ has the sign $(-1)^{n-1}$ at $-2$ and is positive for large $x$; $\mathrm{slog}^{(n)}$ has the sign $(-1)^{n-1}$ at $+\infty$ and is positive at $-\infty$.
      Positivity of $T',\dots,T^{(n)}$ on an interval of length 1 carries over to the right.
      (N4) For every $N$, all sufficiently small bendings (Möbius $|a|<a_N$, sine $\varepsilon<\varepsilon_N$) have the same signs and numbers of zeros of $T',\dots,T^{(N)}$ on $(-2,\infty)$ as Kneser.
      So a characterizing sign condition must contain infinitely many orders, and violations occur only at orders $\to\infty$.
    bereich: real-analytic tetrations; bendings $T=\mathrm{sexp}_K(x+p(x))$ (sine, Möbius)
    einfach: If one checks only finitely many derivatives, a slightly bent tetration looks exactly like Kneser. So one has to look at infinitely
      many derivatives.
    beweis:
      text: |
        N3: Lemma 0 at $-2$; to the right $(e^T)^{(n)}=e^TY_n(T',\dots,T^{(n)})$ with the complete Bell polynomial (nonnegative coefficients); slog via Faà di Bruno.
        N4: $T_a\to T_K$ with all derivatives uniformly on compact sets, at the left boundary $B_a\to B_K$, at the right boundary N3 carries; simple zeros remain stable.
      luecken:
      - The simplicity of the zeros of Kneser's $T^{(k)}$, $k\le N$, is only supported numerically (every even derivative up to 26 changes sign
        exactly once).
    pruefung:
      f1_folgt_unmittelbar: N3 almost (Lemma 0 and Bell polynomials); N4 from continuity of the derivatives in the perturbation.
      f2_benutzte_voraussetzungen: Lemma 0, Bell polynomials, simplicity of the zeros (numerical).
      f3_spezialfall: Sign version of br.satz.endlich_viele_reichen_nicht; N3 generalizes gr.kor.konvex_nach_oben.
      f4_uebertragbar: To every family of bendings that tends to Kneser in $C^N$.
      f5_neue_frage: Which infinite family of signs suffices — and does it suffice only together with $x\to\infty$?
    bewertung:
      nutzen: Explains why local conditions need high orders and x → ∞.
      richtigkeit: N3 complete, N4 with a numerical gap
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, N3, N4, B-N3; e2_stoerungen.py
  en_theorie:
    worum: |
      Can a list of finitely many sign conditions select Kneser?
    genau: |
      No: small bendings have the same sign patterns as Kneser for $T',\dots,T^{(N)}$; at the boundaries the signs are the same for all tetrations.
    warum: |
      The derivatives depend continuously on the bending, and simple zeros move only slightly.
    beispiel: |
      Sine perturbation $10^{-4}$: first violation only at order 15; at $10^{-6}$ none at all in the measurement window.
    einordnung: |
      Sign counterpart to [[br.satz.endlich_viele_reichen_nicht]].
- id: br.satz.gevrey_fourier
  quelle_hash: 776d63d4805c
  theorie_hash: eb357044fb25
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: Standard (Paley–Wiener type).
    pruefung:
      f2_benutzte_voraussetzungen: —
      f5_neue_frage: Is bw.frage.streifen_gevrey exactly the question $\sigma^*>0$?
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: Textbook.
      f4_uebertragbar: Translates the strip question into a pure question about modes.
    bewertung:
      nutzen: Sharpens the open question.
      richtigkeit: established
    titel: Fourier characterization of strip analyticity and Gevrey classes
    aussage: |
      A 1-periodic $f$ is holomorphic in $|\operatorname{Im}\theta|<\sigma$ if and only if $|\hat f(k)|\le C_\varepsilon e^{-2\pi(\sigma-\varepsilon)|k|}$ for all $\varepsilon>0$.
      $f$ is Gevrey-$s$ if and only if $|\hat f(k)|\le Ce^{-c|k|^{1/s}}$. A decay $\ln A_k\sim-2\pi\sigma^*k-a\sqrt k$ is therefore analytic for $\sigma^*>0$ and Gevrey-2 for $\sigma^*=0$.
  en_theorie:
    beispiel: |
      $\sum_ke^{-2\pi\sigma|k|}e^{2\pi ik\theta}$ is holomorphic exactly in the strip $|\operatorname{Im}\theta|<\sigma$. With $\hat f(k)=e^{-\sqrt{|k|}}$, $f$ is smooth but not analytic in any strip.
    einordnung: |
      Translates the open question [[bw.frage.streifen_gevrey]] into a pure question about modes. Application to the seams: [[bw.satz.fourier_naht]].
    genau: |
      A 1-periodic function $f$ is holomorphic in $|\operatorname{Im}\theta|<\sigma$ if and only if $|\hat f(k)|\le C_\varepsilon e^{-2\pi(\sigma-\varepsilon)|k|}$ for all $\varepsilon>0$. $f$ is Gevrey-$s$ if and only if
      $|\hat f(k)|\le Ce^{-c|k|^{1/s}}$. A decay $\ln A_k\sim-2\pi\sigma^*k-a\sqrt k$ is analytic for $\sigma^*>0$ and Gevrey-2 for $\sigma^*=0$.
    warum: |
      Standard (Paley–Wiener type): The Fourier series $\sum\hat f(k)e^{2\pi ik\theta}$ converges at $\theta=x+iy$ if and only if $|\hat f(k)|e^{2\pi|k||y|}$ is summable. Conversely, in the integral for $\hat f(k)$ one shifts the
      contour by $\pm i\sigma$.
    worum: |
      How smooth a periodic function is can be read off its Fourier components: If they decay exponentially, it is analytic in a strip; if they decay only like $e^{-c\sqrt k}$, it is
      “almost analytic” (Gevrey).
- id: br.satz.halbebene_liouville_scharf
  quelle_hash: aa57a6d2c13e
  theorie_hash: 45866f8bd4f5
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Q* holds as soon as the bending p_T is single-valued at the top and grows more slowly than e^(2π Im z) — the threshold is sharp
    aussage: |-
      If $p_T$ continues uniquely holomorphically to $U$ and the one-sided bound
      $$-\mathrm{Im}\,p_T(z)\le o\bigl(e^{2\pi\,\mathrm{Im}\,z}\bigr)\qquad(\mathrm{Im}\,z\to\infty,\ \text{uniformly in }\mathrm{Re}\,z),$$
      holds, then $p_T\equiv0$, so $T$ is the Kneser tetration. Instead of $-\mathrm{Im}\,p_T$ one may also take $+\mathrm{Im}\,p_T$ or $\pm\mathrm{Re}\,p_T$.
      The threshold is sharp (as a statement about periodic functions): $p=\varepsilon\sin2\pi z$ grows exactly like $\tfrac\varepsilon2e^{2\pi\,\mathrm{Im}\,z}$.
      For Q* (br.frage.halbebene_eindeutigkeit) this means: a counterexample in Hol(H) either has a $p_T$ that is multivalued on $U$ ($T$ hits
      branch points of $\mathrm{slog}_K$ there), or $|p_T|\ge c\,e^{2\pi\,\mathrm{Im}\,z}$ holds along a sequence. So the missing condition at $i\infty$ is
      "$p_T$ single-valued and $o(e^{2\pi\,\mathrm{Im}\,z})$" — much weaker than the limit $L$ in Paulsen–Cowgill.
    bereich: real tetrations $T$ to base $e$ on $(-2,\infty)$ with $T(0)=1$; $T=\mathrm{sexp}_K\circ(\mathrm{id}+p_T)$, $p_T=\mathrm{slog}_K\circ
      T-\mathrm{id}$; $U=\{\mathrm{Im}\,z>0\}$
    einfach: 'Every real tetration is a "bent" Kneser tetration: T(x) = Kneser(x + p(x)) with a periodic bending p. If p can be continued into
      the upper half-plane and grows there more slowly than e to the power 2π times the height, then p is zero — the tetration is Kneser. A simple
      sine grows exactly as fast as this threshold.'
    beweis:
      text: |-
        $P(q):=p_T(z)$ is holomorphic on $0<|q|<1$ and, by real analyticity, also on an annulus around $|q|=1$, and the reflection $P(1/\bar q)=\overline{P(q)}$
        continues $P$ to $\mathbb C^*$: $P=\sum c_nq^n$ with $c_{-n}=\bar c_n$. For $f=iP$ (coefficients $a_n=ic_n$) and $A(r)=\max(0,\sup_{|q|=r}\mathrm{Re}\,f)$ we have
        $\frac1\pi\int\mathrm{Re}\,f(re^{it})e^{-int}dt=a_nr^n+\overline{a_{-n}}r^{-n}$ and $|\mathrm{Re}\,f|\le2A-\mathrm{Re}\,f$, hence
        $|a_{-m}|\le r^m(4A(r)+2|a_0|)+|a_m|r^{2m}$ (Borel–Carathéodory). The hypothesis is $A(r)=o(1/r)$; letting $r\to0$ gives $c_{-m}=0$ for $m\ge1$, and by symmetry
        $c_m=0$. So $p_T$ is constant, and $T(0)=1$ gives $p_T=0$. Sharpness: $\sin2\pi z=(e^{2\pi iz}-e^{-2\pi iz})/2i$.
    pruefung:
      f1_folgt_unmittelbar: 'Almost: a Laurent series in q and a Borel–Carathéodory estimate; the reflection c₋ₙ = c̄ₙ turns the one-sided bound
        into a two-sided one.'
      f2_benutzte_voraussetzungen: p_T real-analytic, 1-periodic, uniquely holomorphic on U with the one-sided bound; T(0) = 1. Holomorphy of
        T on Re z > −2 is not used.
      f3_spezialfall: Generalizes fg.lem.periodisch_liouville (there bounded above and below) to one-sided growth o(e^{2π Im z}) for real p.
      f4_uebertragbar: To every base b > η (with sexp_b, slog_b) and every real superfunction written as a bending of a reference solution.
      f5_neue_frage: When is p_T single-valued on U for T ∈ Hol(H)? The multivaluedness comes from the branch points of slog_K (br.satz.enden_klassifikation).
    bewertung:
      nutzen: Names exactly which condition at i∞ is missing for Q*.
      richtigkeit: complete; proof re-read in the cross-check 25.10.2026
    quellen:
    - stelle: forschung/runde_2026_10_25/01_halbebene_eindeutigkeit/BERICHT.md, B1, B2 and proof of Theorem A
  en_theorie:
    beispiel: $p=\varepsilon\sin2\pi z$ has $|p|\approx\tfrac\varepsilon2e^{2\pi\,\mathrm{Im}\,z}$ — exactly at the threshold; the corresponding
      tetration is nevertheless not in Hol(H) ([[br.beob.hauptblatt_singularitaet_trig]]).
    einordnung: 'Generalizes [[fg.lem.periodisch_liouville]]; partial answer to [[br.frage.halbebene_eindeutigkeit]]; the form with a limit: [[br.satz.schroeder_kugel_genuegt]].'
    genau: $p_T$ uniquely holomorphic on $U$ and one-sidedly $-\mathrm{Im}\,p_T\le o(e^{2\pi\,\mathrm{Im}\,z})$ $\Rightarrow$ $p_T\equiv0$. The
      threshold $e^{2\pi\,\mathrm{Im}\,z}$ is the size of $\sin2\pi z$.
    warum: |-
      In $q=e^{2\pi iz}$, $p_T$ is a Laurent series; because $p_T$ is real, the coefficients of $q^n$ and $q^{-n}$ belong together. A one-sided bound on the
      real part controls, by Borel–Carathéodory, all coefficients of $q^{-n}$; the growing modes drop out, and by symmetry the decaying ones too.
    worum: |-
      Q* asks whether holomorphy on $\mathrm{Re}\,z>-2$ already forces Kneser. Every real tetration is $T=\mathrm{sexp}_K\circ(\mathrm{id}+p_T)$ with periodic $p_T$;
      Kneser means $p_T=0$. Which condition on $p_T$ far up is enough?
- id: br.satz.halbexp_komplexitaet
  quelle_hash: d76bfb1149e0
  theorie_hash: 177726830f97
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Miltersen–Vinodchandran–Watanabe (BRICS RS-99-46, COCOON 1999); Chen–Hirahara–Ren (arXiv 2309.12912).
    pruefung:
      f2_benutzte_voraussetzungen: Complexity theory (Karp–Lipton-type arguments, binary search over circuits).
      f5_neue_frage: Which growth properties of a half-exponential function does the argument need exactly? (kn.satz.halbe_exp_wachstum)
      f3_spezialfall: —
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: Half-exponential functions also occur in Hardy fields (br.satz.boshernitzan).
    bewertung:
      nutzen: Shows where half-iterates of the exponential function play a role outside analysis.
      richtigkeit: Literature, checked via abstracts and surveys
    titel: 'Half-exponential functions in complexity theory: the “half-exponential barrier” (1999) and its fall (2023)'
    aussage: |
      (i) **Miltersen–Vinodchandran–Watanabe (1999):** For $\mathrm{MA}_{\mathrm{EXP}}$, $\mathrm{ZPEXP}^{\mathrm{NP}}$ and $\Sigma_2^{\mathrm{exp}}$, the known techniques can prove circuit lower bounds
      exactly up to **half-exponential** size — the method needs a function $f$ with $f(f(n))\le2^{o(n)}$, and it yields no more than that.
      (ii) **Chen–Hirahara–Ren (2023):** A language in $\mathrm{S}_2\mathrm{E}/_1$ requires circuits of size at least $2^n/n$; the same holds for $\Sigma_2\mathrm{E}$ among others. This overcomes the
      half-exponential barrier for these classes.
    bereich: circuit size of languages in exponential complexity classes; $f$ half-exponential if $f(f(n))$ is roughly $2^{n}$
    einfach: In theoretical computer science one ran into a limit for a long time that grows exactly “half as fast as exponential” — a half exponential
      function, as with Kneser. Only in 2023 did the leap beyond it succeed.
    quellen:
    - stelle: Abstract
    - stelle: Abstract
  en_theorie:
    beispiel: |
      A function like $2^{\sqrt n}$ is too large: $2^{\sqrt{2^{\sqrt n}}}$ grows faster than $2^n$. Half-exponential functions lie between all
      functions $2^{(\log n)^k}$ and all $2^{n^\varepsilon}$.
    einordnung: |
      The growth of half-exponential functions: [[kn.satz.halbe_exp_wachstum]]; in Hardy fields: [[br.satz.boshernitzan]].
    genau: |
      For some exponential complexity classes the known methods gave, from 1999 on, only half-exponential lower bounds for circuit size; in 2023 almost maximal
      lower bounds $2^n/n$ were proved.
    warum: |
      The 1999 argument is a case distinction: Either all languages of a class have small circuits — then a hierarchy collapses up to a size $f$ —,
      or not. The collapse costs one application of $f$ too many; for both cases to fit together, $f(f(n))$ must stay below $2^n$. That is exactly the half-iterate.
    worum: |
      Half-exponential functions — functions that give the exponential function when applied twice in a row — appear not only in Kneser's work, but also as the
      limit of what can be proved about the complexity of computational problems.
- id: br.satz.hyperop_varianten
  quelle_hash: 96200c894de9
  theorie_hash: 7153f546b3cd
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Other parenthesizations: left-parenthesized, balanced, and Bennett''s commutative hyperoperations'
    aussage: |-
      (i) **Left-parenthesized** tetration is trivial: with $x[4']0=x$ we have $x[4']n=x^{x^n}$; only the left pentation
      ($x[5']0=x$, $x[5'](n+1)=(x[5']n)[4']x$) becomes nontrivial: $x[5']1=x^{x^x}$, $x[5']2=x^{x^{x+x^{x+1}}}$.
      (ii) **Balanced** ($a[n+1](2b)=(a[n+1]b)[n](a[n+1]b)$) again gives $\cdot$ and exponentiation for levels 2, 3; balanced tetration is the iteration of $x\mapsto x^x$
      at the point $2^t$: $a[4]2^t=f^{[t]}(a)$ with $f(x)=x^x$ — a fixed point at 1 with $f'(1)=1$ (parabolic). In the logarithm this is the iteration of $me^m$, i.e. of the
      product tetration; so there is a natural fractional height without Kneser (sketched in br.satz.klammerung_fortsetzung).
      (iii) **Bennett (1915):** $x\oplus_sy=\exp^{[s]}\bigl(\log^{[s]}x+\log^{[s]}y\bigr)$ gives addition, multiplication and $x\oplus_2y=e^{\ln x\ln y}$ for $s=0,1,2$; every level is
      commutative, associative, and distributes over the previous one. With $\exp^{[1/2]}$ (kn.satz.halbe_exp) an operation “between + and ·” arises.
    einfach: How you parenthesize a tower is a choice. Parenthesized from the top, you get the usual tetration; from the bottom, something simple.
      Bennett proposed an entirely different ladder in 1915, in which every level stays commutative — and with the half-exponential function you
      even get intermediate levels.
    beweis:
      text: |-
        (i) $x[4'](n+1)=(x[4']n)^x$ with $x[4']0=x$ gives $x^{x^n}$; the left pentation by substitution. (ii) Induction on $b=2^k$. (iii) Conjugation with $\log^{[s]}$ transfers commutativity and associativity of
        addition; distributivity: $\log^{[s]}(x\oplus_s y)=\log^{[s]}x+\log^{[s]}y$, and $\exp$ turns sums into products, so $\oplus_{s+1}$ distributes over $\oplus_s$.
    pruefung:
      f1_folgt_unmittelbar: Yes.
      f2_benutzte_voraussetzungen: 'For (iii) with non-integer s: an iteration group exp^[s].'
      f3_spezialfall: 'Yes: conjugation of a group operation.'
      f4_uebertragbar: Any iteration group instead of exp^[s].
      f5_neue_frage: 'Is there a natural choice for the intermediate levels (Nixon''s half-operations, forum tid 1386, 1535)? Structure of the
        left ranks at 1: br.satz.linke_raenge_keim.'
    bewertung:
      nutzen: Shows what freedom lies in the definition of the hyperoperations.
      richtigkeit: complete
    quellen:
    - {}
    - {}
    - {}
    - stelle: (i) left-evaluated hyperoperations
    - stelle: (iii) Bennett's sequence as a sequence of monoids, field by completion
  en_theorie:
    beispiel: $2\oplus_22=e^{(\ln2)^2}=1.6168$; $e\oplus_2y=y$ — $e$ is the neutral element of level 2.
    einordnung: With the half-exponential function ([[kn.satz.halbe_exp]]), Bennett levels between the integer ones can be formed.
    genau: |-
      - **Left:** $x[4']n=x^{x^n}$, the left pentation is nontrivial.
      - **Balanced:** doubling instead of counting further; balanced tetration iterates $x\mapsto x^x$.
      - **Bennett (1915):** $x\oplus_sy=\exp^{[s]}(\log^{[s]}x+\log^{[s]}y)$ — every level commutative and associative, $\oplus_2$ is $e^{\ln x\ln y}$.
    warum: |-
      1. Left: $(x^{x^n})^x=x^{x^{n+1}}$.
      2. Bennett: With $\log^{[s]}$ every level is converted into ordinary addition; commutativity and associativity come from there, and because $\exp$ turns sums into
         products, every level distributes over the previous one.
    worum: |-
      “Tetration” presupposes a parenthesization: from the top. Other parenthesizations and other ladders give other operations — some trivial, some with beautiful
      laws.
- id: br.satz.kalmar
  quelle_hash: 244a546cec6a
  theorie_hash: 6920a5a00f38
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: Every elementary function is bounded by a tower $2^{2^{\cdot^{\cdot^{x}}}}$ of fixed height; $2\uparrow\uparrow n$ exceeds every fixed
        height.
    pruefung:
      f2_benutzte_voraussetzungen: Tower bound (literature).
      f5_neue_frage: 'Structural analogy: “elementary” (computability) and “$\mathbb R_{\mathrm{an},\exp}$-definable” (geometry) have the same
        tower bound; tetration is the first to break out in both.'
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: Yes, from the tower bound for elementary functions.
      f4_uebertragbar: —
    bewertung:
      nutzen: Connects two worlds with the same bound.
      richtigkeit: complete
    titel: Tetration is primitive recursive, but not elementary
    aussage: $n\mapsto2\uparrow\uparrow n$ is primitive recursive (Grzegorczyk level $\mathcal E^4$), but not Kalmár-elementary ($\mathcal E^3$).
  en_theorie:
    beispiel: |
      Two worlds, the same bound: “elementary” in computability and “definable in $\mathbb R_{\mathrm{an},\exp}$” in geometry are both bounded by towers of fixed height — and in both,
      tetration is the first to break out.
    einordnung: |
      Counterpart: [[br.satz.nicht_definierbar]]. The arrow ladder: [[br.def.hyperoperation]].
    genau: |
      $n\mapsto2\uparrow\uparrow n$ is primitive recursive (Grzegorczyk level $\mathcal E^4$), but not Kalmár-elementary ($\mathcal E^3$).
    warum: |
      Every elementary function is bounded by a tower $2^{2^{\cdot^{\cdot^{x}}}}$ of fixed height; $2\uparrow\uparrow n$ exceeds every fixed height. It is primitive recursive because it is computable with nested loops of fixed
      depth.
    worum: |
      In computability too, tetration is the first function to break through a natural limit: It is computable with simple loops, but not “elementary”.
- id: br.satz.klammerung_fortsetzung
  quelle_hash: 68e3a6ba6bc8
  theorie_hash: 589a7f701a8e
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Fractional heights for balanced tetration and left pentation via the Fatou coordinate of m·e^m — entirely without Kneser
    aussage: |-
      For $m>0$ (repelling side) let $\Phi(m)=\lim_n\bigl(\Phi_{\rm as}(W^{[n]}(m))+n\bigr)$, for $m<0$ (attracting side) $\Phi(m)=\lim_n\bigl(\Phi_{\rm as}(F^{[n]}(m))-n\bigr)$,
      and $F^{[t]}=\Phi^{-1}(\Phi+t)$ on each side. With this,
      $$a[4]2^t=\exp F^{[t]}(\ln a),\qquad x[5']t=\exp\bigl(F^{[t]}(x\ln x)/x\bigr)$$
      are defined for all real $t$, real-analytic in $t$ and with the semigroup property. For $x>1$ resp. $0<x<1$, $x\ln x$ lies on the repelling resp. attracting side (likewise $\ln a$ for $a>1$ resp. $a<1$).
      The Fatou coordinate of each side is unique up to an additive constant, and this drops out of $F^{[t]}$: one needs **no** Kneser procedure. Numerical error about $c_{K+1}n^{-K-1}$.
      On the repelling side this is exactly the product tetration: $F^{[t]}(m)=\mathrm{prodtet}_e(\mathrm{prodslog}_e(m)+t)$ (br.satz.produkt_parabolisch), so e.g. $a[4]2^t=\exp\,\mathrm{prodtet}_e\bigl(\mathrm{prodslog}_e(\ln a)+t\bigr)$ for $a>1$.
    bereich: $F(m)=me^m$, parabolic fixed point 0; real starting values $m\neq0$; asymptotic Fatou series $\Phi_{\rm as}(m)=-1/m+\tfrac12\ln|m|-m/6+m^2/16-\dots$
      (br.beob.produkt_iteration_dreieck; in the report 22 terms exactly)
    einfach: Because both variants merely repeat m ↦ m·e^m, and this map has a particularly simple fixed point at 0, there is a natural way to
      apply them "half" or "one and a half times" as well — much simpler than for ordinary tetration.
    beweis:
      text: |-
        On the attracting and the repelling real sheet there exists a Fatou coordinate (it.satz.leau_fatou) with the asymptotic series $\Phi_{\rm as}$; $W^{[n]}(m)\to0^+$ and $F^{[n]}(m)\to0^-$ respectively,
        so the limits converge. $\Phi^{-1}(\Phi+t)$ does not depend on the additive constant. Computation with Newton inversion of $\Phi_{\rm as}$ (kanonisch.py).
      luecken:
      - The uniqueness theorem for Fatou coordinates is cited and not verified for the real sheet; which additional real condition singles out
        this iteration among all real-analytic iterations of F (e.g. the asymptotics $F^{[t]}(m)=m+tm^2+\dots$ as for Szekeres, it.satz.szekeres)
        is not carried out.
    pruefung:
      f1_folgt_unmittelbar: 'Almost: standard theory of parabolic fixed points, applied to $F$.'
      f2_benutzte_voraussetzungen: Existence and uniqueness of the Fatou coordinate on the real sheets; convergence of $W^{[n]}$ and $F^{[n]}$
        to 0.
      f3_spezialfall: 'Yes: regular parabolic iteration as for the product tetration (br.satz.produkt_parabolisch) and for $b=\eta$ (kl.satz.parabolisch).'
      f4_uebertragbar: To all left ranks (germ at 1 parabolic, br.satz.linke_raenge_keim); for balanced ranks ≥ 5 these are multi-sheeted Fatou
        coordinates.
      f5_neue_frage: Is the continuation analytic at $x=1$ (resp. $a=1$)? (Presumably not, it.verm.mexp_halbiterierte_divergent.)
    bewertung:
      nutzen: Gives these variants fractional heights without a freedom of choice θ; on the repelling side it is already in the graph as the product
        tetration.
      richtigkeit: Sketch; building blocks from the literature, uniqueness statement cited (cf. it.satz.szekeres)
    quellen:
    - stelle: forschung/runde_2026_10_25/14_klammerungen/BERICHT.md, Finding 5; kanonisch.py
    - stelle: §10 (Leau–Fatou, Fatou coordinates)
  en_theorie:
    beispiel: $2[4]\sqrt2=\exp F^{[1/2]}(\ln2)=2.55195159006647\ldots$
    einordnung: |-
      Building blocks: [[it.satz.leau_fatou]] and the Fatou series of $xe^x$ ([[br.beob.produkt_iteration_dreieck]]); on the repelling side it is the product tetration ([[br.satz.produkt_parabolisch]]);
      same approach for $b=\eta$ ([[kl.satz.parabolisch]]); real uniqueness: [[it.satz.szekeres]].
    genau: 'Via the Fatou coordinate of $F$ at its parabolic fixed point 0: $F^{[t]}=\Phi^{-1}(\Phi+t)$, separately on the repelling ($m>0$) and
      attracting side ($m<0$).'
    warum: |-
      At a parabolic fixed point the Fatou coordinate is unique up to a constant on each sheet, and the constant drops out when iterating. For ordinary tetration, no
      such real fixed point exists (for $b>\eta$), which is why Kneser is needed there.
    worum: How does one continue the height of these variants to real numbers without the freedom of choice θ of ordinary tetration?
- id: br.satz.klammerung_log_reduktion
  quelle_hash: d2c3e188a9bc
  theorie_hash: eb1fb31b29a7
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Balanced tetration and left pentation are both the iteration of F(m) = m·e^m (inverse: Lambert W)'
    aussage: |-
      With $F(m)=me^m$ we have exactly $\ln(y^y)=F(\ln y)$ and $\ln\bigl(z[4']x\bigr)=\zeta e^{x\zeta}$ ($\zeta=\ln z$); with $m=x\zeta$ the step of the left pentation also becomes $F$. For integers $n\ge0$:
      $$a[4]2^n=\exp F^{[n]}(\ln a),\qquad x[5']n=\exp\bigl(F^{[n]}(x\ln x)/x\bigr).$$
      Likewise in the convention $a_4b=a^{a^{b-1}}$, $a_5(b+1)=(a_5b)_4a$, $a_51=a$ (according to the report the Wikipedia convention): $a_5b=\exp\bigl(F^{[b-1]}((a-1)\ln a)/(a-1)\bigr)$ for $a\neq1$.
      $F$ is exactly the step $g_e(x)=xe^x$ of the product tetration (br.def.produkt_tetration; with $m=\lambda x$ also $x\mapsto xe^{\lambda x}$): all these variants are the same parabolic iteration.
      In the complex domain, $F$ has exactly the fixed points $m=2\pi ik$ with multiplier $1+2\pi ik$ (repelling for $k\neq0$); for $x^x$ they all lie above $y=1$ on different sheets of the logarithm, for the step of the left pentation at $\ln y=2\pi ik/x$.
    bereich: Left hyperoperations and balanced tetration as in br.satz.hyperop_varianten; $x>0$, $a>0$; integer heights
    einfach: Two unusual ways of building towers — balanced (x to the x, again and again) and parenthesized from the bottom — look different.
      If one takes the logarithm, both become the same simple map m ↦ m·e^m.
    beweis:
      text: |-
        $\ln(y^y)=y\ln y=e^\ell\ell=F(\ell)$ with $\ell=\ln y$; the balanced recursion $a[4]2b=(a[4]b)^{a[4]b}$ is therefore $\ell\mapsto F(\ell)$, and $a[4]1=a$.
        Left: $\ln(z^{z^x})=z^x\ln z=\zeta e^{x\zeta}$; with $m_n:=x\ln(x[5']n)$ we get $m_{n+1}=x\zeta_ne^{x\zeta_n}=F(m_n)$, $m_0=x\ln x$. The second convention likewise with $a-1$ instead of $x$.
        Fixed points: $me^m=m\iff m=0$ or $e^m=1$; $F'(m)=(1+m)e^m$.
    pruefung:
      f1_folgt_unmittelbar: Yes (one line).
      f2_benutzte_voraussetzungen: Only the recursions; for integer heights no iteration theory.
      f3_spezialfall: For $x^x$ the logarithm conjugation is folklore; with the product tetration a common normal form.
      f4_uebertragbar: To every variant whose step in the logarithm has the form $\zeta e^{c\zeta}$.
      f5_neue_frage: Fractional heights via the Fatou coordinate of $F$ (br.satz.klammerung_fortsetzung).
    bewertung:
      nutzen: Reduces three variants to one map and makes them computable with standard theory; for x^x probably folklore, for the left pentation
        not found.
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_25/14_klammerungen/BERICHT.md, Findings 1, 3, 13
  en_theorie:
    beispiel: $2[5']1=\exp(F(2\ln2)/2)=\exp(2\ln2\cdot4/2)=16=2^{2^2}$.
    einordnung: Complements [[br.satz.hyperop_varianten]]; $F$ is the step of the product tetration ([[br.def.produkt_tetration]], [[br.satz.produkt_parabolisch]]);
      the inverse is Lambert W ([[fp.satz.lambert]]).
    genau: 'In the logarithm both are the iteration of $F(m)=me^m$: $a[4]2^n=\exp F^{[n]}(\ln a)$, $x[5'']n=\exp(F^{[n]}(x\ln x)/x)$.'
    warum: $\ln(y^y)=y\ln y$, and with $y=e^\ell$ this is $\ell e^\ell$. For the left pentation, $\ln(z^{z^x})=\zeta e^{x\zeta}$; with $m=x\zeta$
      one gets $me^m$ again.
    worum: Balanced tetration (iteration of $x\mapsto x^x$) and left pentation (iteration of $y\mapsto y^{y^x}$) look different. What is behind
      this?
- id: br.satz.linke_raenge_keim
  quelle_hash: 58ae634efe12
  theorie_hash: 0bc468fbdca9
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: All left ranks from 5 on have the same structure at 1; iterative residue ½ at rank 5′ and (9 − 2k)/(2x) for the step of rank k + 1
      ≥ 6′
    aussage: |-
      $$T_k(\zeta,s)=\zeta+s\zeta^2+(A_ks^2+B_ks)\zeta^3+O(\zeta^4),\qquad A_4=\tfrac12,\ B_4=0;\qquad A_k=1,\ B_k=k-\tfrac92\ \ (k\ge5),$$
      from the recursion $A_{k+1}=1$, $B_{k+1}=A_k+B_k$. The step of every left rank is parabolic at $y=1$ with second coefficient = base $x$, and its iterative residue is
      $$\beta=\tfrac12\ \ \text{(left pentation, every }x),\qquad \beta=\frac{9-2k}{2x}\ \ (k\ge5):\ \text{hexation }-\tfrac1{2x},\ \text{rank 7′ }-\tfrac3{2x}.$$
      Left hexation to base 2: $G=\zeta+2\zeta^2+5\zeta^3+\dots$, $\beta=-\tfrac14$.
    bereich: '$T_k(\zeta,s):=\ln\bigl(e^\zeta[k'']s\bigr)$ for left ranks $k\ge4$; step of rank $k+1$ to base $x$: $u\mapsto T_k(u,x)$, fixed
      point $u=0$ ($y=1$); iterative residue $\beta=1-b/a^2$ for $u+au^2+bu^3+\dots$'
    einfach: All operations parenthesized from the bottom, from the fifth on, look the same at 1. They differ only in one key number, and there
      is a simple formula for it.
    beweis:
      text: |-
        Induction: if $T_k(u,s)=u+su^2+(As^2+Bs)u^3+\dots$, then the step of rank $k+1$ to base $y=e^\zeta$ is the germ $u\mapsto u+yu^2+(Ay^2+By)u^3$.
        Its $s$-fold iterate is $u+sau^2+(sb+s(s-1)a^2)u^3$; starting from $u=\zeta$ with $y=1+\zeta+\dots$ this gives $\zeta+s\zeta^2+(s^2+(A+B)s)\zeta^3$. Start $T_4=\zeta e^{s\zeta}$.
        For integer $s$ the iteration formula is induction; for real $s$ it is the formal flow formula (named condition). Exact check in fractions: $T_5,T_6,T_7$ for $s=1\dots4$ give $n^2+(k-\tfrac92)n$.
    bedingungen_text: For rank 5′ and for integer base $x$ without condition (only integer iteration numbers). For rank $\ge6′$ with non-integer
      base under the assumption that the canonical fractional iterate (br.satz.klammerung_fortsetzung) has the formal expansion uniformly in $s$
      (standard theorem, not verified).
    pruefung:
      f1_folgt_unmittelbar: 'Almost: induction with the iteration formula for germs of third order.'
      f2_benutzte_voraussetzungen: Log reduction of the first step; iteration formula; for real iteration numbers the uniform expansion.
      f3_spezialfall: Rank 5′ is the germ of the product tetration (br.satz.produkt_parabolisch, residue ½).
      f4_uebertragbar: Higher orders $\zeta^4,\dots$ can be obtained recursively in the same way.
      f5_neue_frage: Cite or prove uniformity in $s$; take $B_k=k-\tfrac92$ as a function of $k$ seriously for a fractional rank between 5′ and
        6′?
    bewertung:
      nutzen: One key number that distinguishes all left ranks and makes them comparable.
      richtigkeit: complete for rank 5′ and integer bases; otherwise under the named condition; checked exactly for s = 1…4 at k = 5, 6, 7 and
        recomputed when entering
    quellen:
    - stelle: forschung/runde_2026_10_25/14_klammerungen/BERICHT.md, Findings 7, 8; rang_keime.py, rang_keime_ausgabe.txt
  en_theorie:
    beispiel: 'Left hexation to base 2: step $\zeta+2\zeta^2+5\zeta^3+\dots$, residue $1-5/4=-\tfrac14$.'
    einordnung: 'Builds on [[br.satz.klammerung_log_reduktion]]; consequence: [[br.kor.linke_varianten_nicht_eta]]; the residue governs the rate
      in [[it.satz.parabolische_rate]].'
    genau: $\ln(e^\zeta[k']s)=\zeta+s\zeta^2+(A_ks^2+B_ks)\zeta^3+\dots$ with $A_k=1$, $B_k=k-\tfrac92$ ($k\ge5$); iterative residue of the step
      $\tfrac12$ (rank 5′) and $(9-2k)/(2x)$ respectively.
    warum: Each rank iterates the previous one; the iteration formula $u+sau^2+(sb+s(s-1)a^2)u^3$ for germs gives the recursion $B_{k+1}=A_k+B_k$.
    worum: What do the higher left ranks look like at the fixed point 1?
- id: br.satz.lokal_genau_dann_halbebene
  quelle_hash: e8cfe0822a3d
  theorie_hash: 9ab82d72d64a
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: 'Reduction: a local real characterization of Kneser exists exactly when holomorphy on Re z > −2 already forces Kneser'
    aussage: |
      Let Q*: "every real tetration that is holomorphic on $\mathrm{Re}\,z>-2$ is Kneser". Then each of the conditions (b)–(e) characterizes Kneser **exactly when** Q* holds.
      For C($n_0$), "Q* ⇒ characterizes" holds (the converse is open, and that Kneser satisfies C(0) is mike3's conjecture).
      Q* is Paulsen–Cowgill without the limit condition at $i\infty$, in the half-plane version (stronger than kn.verm.tk_c2).
    bereich: real-analytic tetrations to base $e$; conditions (b)–(e) from br.satz.taylorradius_halbebene and C($n_0$) from br.satz.ungerade_ableitungen_halbebene
    einfach: 'The search for a simple real condition for Kneser is now reduced to a single question: Is it enough that the tetration is smooth
      in the right half-plane? If yes, the condition exists; if no, it does not.'
    beweis:
      text: |
        {T satisfies (b)} = Hol(H) by br.satz.taylorradius_halbebene, {T satisfies C($n_0$)} ⊂ Hol(H) by br.satz.ungerade_ableitungen_halbebene. If Q* holds, Hol(H) consists of Kneser only.
        If there is a $T^*\ne$ Kneser in Hol(H), then $T^*$ satisfies (b), so the condition does not characterize.
    pruefung:
      f1_folgt_unmittelbar: Yes, from the two theorems.
      f2_benutzte_voraussetzungen: br.satz.taylorradius_halbebene, br.satz.ungerade_ableitungen_halbebene.
      f3_spezialfall: No.
      f4_uebertragbar: To every base above η.
      f5_neue_frage: Q* itself (br.frage.halbebene_eindeutigkeit).
    bewertung:
      nutzen: 'Precise answer to the form of the Bohr–Mollerup question: local works exactly when Q*.'
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, D
  en_theorie:
    worum: |
      Is there a local real characterization of Kneser?
    genau: |
      Yes exactly when Q* holds: every real tetration that is holomorphic on $\mathrm{Re}\,z>-2$ is Kneser.
    warum: |
      The condition from [[br.satz.taylorradius_halbebene]] describes exactly half-plane holomorphy; so it characterizes exactly when this class contains only Kneser.
    beispiel: |
      A Möbius bending is holomorphic on every bounded domain but violates the condition for large $x$ — one needs $x\to\infty$ as in Bohr–Mollerup.
    einordnung: |
      Reduces [[br.frage.bohr_mollerup]] to [[br.frage.halbebene_eindeutigkeit]]; uniqueness with a limit: [[kn.satz.paulsen_cowgill]].
- id: br.satz.momente_cauchy
  quelle_hash: 92f316cd7a3d
  theorie_hash: 857c8c27009a
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Moment family ⇔ the Cauchy transform of the values of θ_T is 1/(ζ − c) outside the curve
    aussage: |-
      Let $C_T(\zeta)=\displaystyle\int_0^1\frac{dx}{\zeta-\theta_T(x)}$ be the Cauchy transform of the value distribution of $\theta_T$ and $\Omega_T$ the component of
      $\mathbb C\setminus\Gamma_T$ that contains a left half-plane. Then
      $$M[\theta_T^k]=M[\theta_T]^k\ \text{for all }k\ge1\iff C_T(\zeta)=\frac1{\zeta-c}\ \text{on }\Omega_T .$$
      In particular $c$ does not lie in $\Omega_T$. So the infinitely many equations of the moment family are **one** equation for a holomorphic function.
      Numerically (Kneser, 20 digits): $|C_T-1/(\zeta-c)|\le7\cdot10^{-22}$ at $\zeta=-5,\ 20+5i,\ 25+10i,\ 26-3i$. For counterexample a from stage 4 (only $M[\theta_T^2]=M[\theta_T]^2$)
      the deviation at $\zeta=-5$ is $2.4\cdot10^{-10}$, matching the first violated moment ($\approx V_3/(\zeta-c)^4=2.7\cdot10^{-10}$).
    bereich: real-analytic tetrations $T=\mathrm{sexp}\circ\varphi$ to base $e$, $\varphi=\mathrm{id}+p$, $p$ 1-periodic, $\varphi'>0$; $\theta_T=h\circ
      T-\mathrm{id}$, $M=\int_0^1$, $c=M[\theta_T]$, $\Gamma_T=\theta_T((0,1))$
    einfach: 'Instead of infinitely many equations "mean of the k-th power = k-th power of the mean", a single one suffices: a certain function
      formed from all values of the wave must look exactly like 1/(ζ − c) outside the wave curve.'
    beweis:
      text: |-
        For $\mathrm{Re}\,\zeta<-R_T\le\inf\mathrm{Re}\,\theta_T$ we have $1/(\zeta-w)=-\int_0^\infty e^{t(\zeta-w)}dt$ for all $w\in\Gamma_T$. Fubini (integrand $\le e^{t(\mathrm{Re}\,\zeta+R_T)}$) gives
        $C_T(\zeta)=-\int_0^\infty e^{t\zeta}\Lambda(t)\,dt$ with $\Lambda(t)=M[e^{-t\theta_T}]=\sum_k(-t)^kM[\theta_T^k]/k!$ (dominated by $M[e^{t|\theta_T|}]<\infty$).
        Under the moment family, $\Lambda(t)=e^{-tc}$, so $C_T=1/(\zeta-c)$ on the half-plane and, by continuation, on all of $\Omega_T$. Conversely, the
        uniqueness of the Laplace transform gives $\Lambda(t)=e^{-tc}$ for $t>0$; because $\Lambda$ is entire, this holds for all $t$, and the Taylor coefficients are the moments.
        If $c$ lay in $\Omega_T$, the function $C_T$, holomorphic there, would have a pole.
    bedingungen_text: Uses that Re θ_T is bounded below on (0, 1) (at both ends Re θ_T → +∞). This comes from the local form of kn.satz.theta_singularitaet,
      which is tied there to the engine assumption (E) (branch choice certified with intervals, kn.satz.zweigwahl_zertifikat). The integrability
      of e^{λ|θ_T|} follows from the majorant of kn.satz.theta_mittelwerte.
    pruefung:
      f1_folgt_unmittelbar: 'Almost: moments ↔ Laplace transform ↔ Cauchy transform is classical; what is new is the application to θ_T.'
      f2_benutzte_voraussetzungen: Re θ_T bounded below (local form at the ends); M[e^{λ|θ_T|}] < ∞ for all λ (majorant |θ| ≤ 31.7 + 2.91 lnlnln(1/|z|)
        from kn.satz.theta_mittelwerte, transferred via θ_T = θ∘φ + p and min φ′ > 0).
      f3_spezialfall: 'Yes: a moment problem with an exponentially integrable distribution is determined by the Laplace transform.'
      f4_uebertragbar: To every base above η with the same local form at the integers.
      f5_neue_frage: When is 1/(ζ − c) the only continuation into the interior of the curve? → br.satz.momente_jordan
    bewertung:
      nutzen: Turns the infinite moment family into one equation for a holomorphic function; basis of the Jordan theorem.
      richtigkeit: proved except for the behavior at the ends (local form); numerical to 7·10⁻²²
    quellen:
    - stelle: forschung/runde_2026_10_25/04_momentenfamilie/BERICHT.md, Finding C and Theorem C; s1_kurve.py
  en_theorie:
    beispiel: For Kneser it holds to $7\cdot10^{-22}$; a look-alike that satisfies only $k=2$ misses it by $2.4\cdot10^{-10}$ — exactly as much
      as the third moment predicts.
    einordnung: Initial question [[br.frage.momentenfamilie]]; consequence in the Jordan case [[br.satz.momente_jordan]].
    genau: It holds if and only if $\int_0^1dx/(\zeta-\theta_T(x))=1/(\zeta-c)$ on the outer component of $\mathbb C\setminus\Gamma_T$.
    warum: |-
      Far to the left, $1/(\zeta-w)$ is a Laplace transform; if one swaps the integrals, the Laplace transform of $M[e^{-t\theta_T}]=\sum(-t)^kM[\theta_T^k]/k!$ appears.
      The moment family says exactly that this sum is $e^{-tc}$.
    worum: The moment family $M[\theta_T^k]=M[\theta_T]^k$ is infinitely many equations. Can they be combined into one?
- id: br.satz.momente_jordan
  quelle_hash: 3484419244ed
  theorie_hash: 0d086d026bcc
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'Jordan case: moment family and a θ_T-curve without double points force Kneser'
    aussage: |-
      If $\theta_T$ is injective on $(0,1)$ and $M[\theta_T^k]=M[\theta_T]^k$ holds for all $k$, then
      $$\theta_T(x)=G\bigl(e^{2\pi i(x+\beta)}\bigr)$$
      with the conformal map $G:\mathbb D\to D_T$, $G(0)=c$, and a constant $\beta$. So the values of $\theta_T$ are distributed exactly according to the harmonic measure of $D_T$ seen from the point $c$,
      $\theta_T$ has no negative Fourier modes, and by br.satz.reelle_kennzeichnung $T=$ Kneser.
      The obvious constructions for counterexamples fail: $\theta_T=G(\beta-x)$ (only negative modes) has the wrong direction of circulation at the tip, and $G\circ\psi$ with a
      measure-preserving map $\psi$ of degree $n\ge2$ would have $n$ tips per period instead of one.
    bereich: as in br.satz.momente_cauchy; $\Gamma_T$ a Jordan curve through $\infty$ (i.e. $\theta_T$ injective on $(0,1)$), $D_T$ the component
      of $\hat{\mathbb C}\setminus\Gamma_T$ that is not $\Omega_T$
    einfach: If the wave curve does not intersect itself, the means of all powers determine how fast the curve is traversed — and that works in
      only one way, exactly as for Kneser. So such a tetration is Kneser.
    beweis:
      text: |-
        Near $x=0$, $\theta_T(x)=\theta(\varphi'(0)x)+O(x)$, and the distance between the two sides of the tip ($\asymp1/(X\ln X)$) is much larger than $O(x)$; therefore $D_T$ lies, as for Kneser,
        to the left of the direction of travel. $C_T(\zeta)=\int_\Gamma f(z)\,dz/(\zeta-z)$ with $f=1/\theta_T'$ jumps across $\Gamma_T$ by $-2\pi if$ (Plemelj). With $C_T=1/(\zeta-c)$ on $\Omega_T$
        (br.satz.momente_cauchy), $\Phi:=1/(\zeta-c)-C_T$ has on $D_T$ a simple pole at $c$ (residue 1) and the boundary values $\Phi(\theta_T(x))\,\theta_T'(x)=2\pi i$.
        $F(q):=q\,\Phi(G(q))\,G'(q)$ is holomorphic on $\mathbb D$ with $F(0)=1$, and on the circle $q=e^{i\tau}$ we have $F\,d\tau=2\pi\,dx$, so $F$ is real and $\ge0$ there. A holomorphic $F$
        with real boundary values is constant, so $F\equiv1$ and $dx/d\tau=1/2\pi$: that is the claim. No negative modes; then br.satz.reelle_kennzeichnung (Paulsen–Cowgill).
      luecken:
      - (a) “Im F has boundary value 0 ⇒ Im F ≡ 0” needs F in the Smirnov class; D_T is unbounded with a very thin tip (G only in H^p for p <
        ½), F is not estimated.
      - (b) Isolated zeros of θ_T′ (cusps of the curve) are excluded; this concerns only a null set, but is not carried out.
      - (c) For “no negative modes” one needs G ∈ H¹; only θ_T ∈ L¹ is known.
      - (d) The direction of circulation at the tip is justified only via the local form; that c lies in D_T (and not on Γ_T) is not shown separately
        — br.satz.momente_cauchy gives only c ∉ Ω_T.
    pruefung:
      f1_folgt_unmittelbar: No; the core is the positivity of F = q·Φ(G)·G′ on the circle.
      f2_benutzte_voraussetzungen: br.satz.momente_cauchy; Jordan property of Γ_T; Plemelj jump; Hardy and Smirnov classes (gaps a, c); orientation
        at the tip (local form); br.satz.reelle_kennzeichnung.
      f3_spezialfall: 'Yes: on a Jordan domain, the harmonic measure is the only distribution on the boundary with Cauchy transform 1/(ζ − c)
        outside.'
      f4_uebertragbar: To every base above η and to Kneser-type waves with exactly one tip per period.
      f5_neue_frage: Case with a double point (br.frage.momente_doppelpunkt); close gap (a) via the local form and |θ_T| ≲ log log log.
    bewertung:
      nutzen: Answers br.frage.momentenfamilie for all tetrations with a wave curve free of double points (up to the gaps).
      richtigkeit: Proof sketch with four named gaps
    quellen:
    - stelle: forschung/runde_2026_10_25/04_momentenfamilie/BERICHT.md, Findings J and R, Theorem J and Section (R)
  en_theorie:
    beispiel: 'Kneser itself: $G(q)=\theta(z)$ with $q=e^{2\pi iz}$, $\beta=0$.'
    einordnung: From [[br.satz.momente_cauchy]] and [[br.satz.reelle_kennzeichnung]]; [[br.frage.momente_doppelpunkt]] remains open.
    genau: 'Yes (sketch): then $\theta_T(x)=G(e^{2\pi i(x+\beta)})$ with the conformal map $G$ of the interior domain, so no negative modes, so
      Kneser.'
    warum: |-
      Outside, the Cauchy transform is $1/(\zeta-c)$; its jump across the curve gives inside a function with a fixed pole at $c$. Pulled back to the disk it becomes
      a holomorphic function with real, positive boundary values — and that is constant. This fixes the speed.
    worum: Does the moment family force Kneser when the wave curve does not intersect itself?
- id: br.satz.nicht_definierbar
  quelle_hash: ee306b2e785c
  theorie_hash: b061e02ee1f0
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: |
        $c:=\min_{[x_0,x_0+1]}E$; after one step all values are $\ge e^{c}>0$. For $y$ large, $k=\lfloor y-x_0\rfloor-1$:
        $E(y)=\exp^{\circ k}(E(y-k))\ge\exp^{\circ k}(e^c)$. With $k=n+j$: $\exp^{\circ n}(\exp^{\circ j}(e^c))\ge\exp^{\circ n}(y)$,
        as soon as $\exp^{\circ j}(e^c)\ge y$ — holds for large $y$, since $j\approx y$ and $\exp^{\circ j}$ grows tower-like.
    pruefung:
      f2_benutzte_voraussetzungen: Only continuity on one period (for the minimum); no monotonicity, no analyticity.
      f5_neue_frage: Is there any o-minimal structure at all that defines a tetration? → br.frage.transexp
      f3_spezialfall: Same structure as br.satz.kalmar (computability).
      f1_folgt_unmittelbar: Yes, from br.satz.vdd_miller and an elementary growth comparison.
      f4_uebertragbar: Every base $b>1$ with unbounded tower, i.e., $b>\eta$.
    bewertung:
      nutzen: Explains why tetration lies outside classical tame geometry.
      richtigkeit: complete
    voraussetzungen:
    - text: E continuous on [x_0, ∞) with E(x+1) = e^{E(x)}
    - text: E monotone or analytic
    titel: No real tetration is definable in ℝ_an,exp
    aussage: $E$ eventually exceeds every $\exp^{\circ n}$; hence $E$ is not definable in any exponentially bounded o-minimal structure, in particular
      not in $\mathbb R_{\mathrm{an},\exp}$.
    bereich: every continuous real solution of $E(x+1)=e^{E(x)}$ on a half-line
    quellen:
    - stelle: Growth bound (Prop. 9.10)
    - {}
    - stelle: elementary growth comparison
  en_theorie:
    beispiel: |
      Even the linear tetration with its kinks overtakes $\exp^{\circ5}$: monotonicity or smoothness are not needed.
    einordnung: |
      Is there any tame structure at all that contains tetration? [[br.frage.transexp]]. The same situation in computability: [[br.satz.kalmar]].
    genau: |
      If $E$ is continuous on $[x_0,\infty)$ with $E(x+1)=e^{E(x)}$, then $E$ eventually exceeds every $\exp^{\circ n}$. Hence $E$ is not definable in any exponentially bounded o-minimal structure,
      in particular not in $\mathbb R_{\mathrm{an},\exp}$.
    warum: |
      1. Let $c=\min_{[x_0,x_0+1]}E$. After one step all values are $\ge e^c>0$.
      2. For large $y$ and $k=\lfloor y-x_0\rfloor-1$ we have $E(y)=\exp^{\circ k}(E(y-k))\ge\exp^{\circ k}(e^c)$.
      3. Write $k=n+j$: $\exp^{\circ n}(\exp^{\circ j}(e^c))\ge\exp^{\circ n}(y)$ as soon as $\exp^{\circ j}(e^c)\ge y$ — and that holds soon, because $j$ grows with $y$ and $\exp^{\circ j}$ grows tower-like.
      4. By [[br.satz.vdd_miller]], $E$ is not definable.
    worum: |
      Every real tetration — smooth or not — eventually overtakes every tower of fixed height. That is why it fits into none of the classical “tame” structures.
- id: br.satz.ordinal_tetration
  quelle_hash: 655c45fd19c5
  theorie_hash: 1b7b70e998c9
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
    zusatz: nein
  en:
    beweis:
      text: Cantor (ε-numbers); fixed-point property ω^{ε₀} = ε₀ directly from the definition as a supremum. Gentzen 1936.
    pruefung:
      f2_benutzte_voraussetzungen: Continuity of ordinal exponentiation in the exponent.
      f5_neue_frage: 'no'
      f3_spezialfall: 'Yes: fixed points of normal functions (Veblen).'
      f1_folgt_unmittelbar: Yes, from the definition of ε₀.
      f4_uebertragbar: Higher operations via Veblen functions.
    bewertung:
      nutzen: Shows where tetration appears in logic.
      richtigkeit: Literature
    titel: 'Tetration of ordinals: ω↑↑ω = ε₀, and after that it stops'
    aussage: |
      With Cantor's exponentiation of ordinals, $\omega\uparrow\uparrow n=\omega^{\omega^{\cdot^{\cdot^\omega}}}$ and $\omega\uparrow\uparrow\omega=\sup_n\omega\uparrow\uparrow n=\varepsilon_0$, the smallest solution of
      $\omega^x=x$. The naive continuation $\omega\uparrow\uparrow(\alpha+1)=\omega^{\omega\uparrow\uparrow\alpha}$ stands still afterwards: $\omega\uparrow\uparrow(\omega+1)=\omega^{\varepsilon_0}=\varepsilon_0$.
      $\varepsilon_0$ is the proof-theoretic strength of Peano arithmetic (Gentzen); Goodstein's theorem hinges on it, and its sequences grow with towers.
      Doner–Tarski (1969) continue the hyperoperations continuously to ordinals via suprema ($O_0=+$, $O_1=\cdot$, $O_2=$ exponentiation); their third level is
      no longer a tower, but $\alpha\,O_3\,(1+\beta)=\alpha^{\alpha^\beta}$ — this too shows that the usual tetration does not carry on in the transfinite.
    einfach: You can build towers with infinite ordinals too. The infinitely high tower of ω is called ε₀ — and since ω raised to ε₀ is again
      ε₀, higher towers get you no further.
    quellen:
    - {}
    - {}
    - stelle: Def. 1, Thm. 3(iii)
  en_theorie:
    beispiel: |
      Goodstein sequences (numbers in “hereditary” base notation, the base grows) reach 0 after some time — provable with ordinals below $\varepsilon_0$,
      but not in Peano arithmetic.
    einordnung: |
      Logical side of the hyperoperations ([[br.def.hyperoperation]], [[br.satz.ackermann]]).
    genau: |
      $$\omega\uparrow\uparrow\omega=\sup\{\omega,\omega^\omega,\omega^{\omega^\omega},\dots\}=\varepsilon_0,\qquad\omega^{\varepsilon_0}=\varepsilon_0.$$
      Hence $\omega\uparrow\uparrow(\omega+1)=\varepsilon_0$ again — the simple continuation stands still.
    warum: |
      1. Ordinal exponentiations are continuous in the exponent; the supremum of the towers is therefore a fixed point of $x\mapsto\omega^x$.
      2. $\varepsilon_0$ is the smallest such fixed point; every further level gives $\varepsilon_0$ again.
    worum: |
      What happens to towers made of infinite ordinals? The infinite tower of $\omega$ is the famous number $\varepsilon_0$.
- id: br.satz.privalov
  quelle_hash: b6ddf2f8d192
  theorie_hash: c13e15cb1001
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: Zygmund, Garnett.
    pruefung:
      f2_benutzte_voraussetzungen: Dini modulus
      f5_neue_frage: Underpins bw.satz.kern_existenz
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: 'No'
      f4_uebertragbar: —
    bewertung:
      nutzen: Key tool of Paper V.
      richtigkeit: established
    titel: Privalov–Dini for conjugate functions
    aussage: If $u\in C(\mathbb T)$ has a Dini modulus of continuity, then the conjugate function $\tilde u$ is continuous; $\tilde u-iu$ is the
      boundary value of a function that is holomorphic in the half-plane (disk) and extends continuously.
  en_theorie:
    beispiel: |
      $u(\theta)=\cos2\pi\theta$ has the partner $\tilde u=\sin2\pi\theta$; $\tilde u-iu=-ie^{2\pi i\theta}$ is the boundary value of $-ie^{2\pi iz}$, holomorphic and decaying in the upper half-plane.
    einordnung: |
      Key to [[bw.satz.kern_existenz]].
    genau: |
      If $u\in C(\mathbb T)$ has a Dini modulus of continuity, then the conjugate function $\tilde u$ is continuous, and $\tilde u-iu$ is the boundary value of a function that is holomorphic in the half-plane (disk) and extends continuously.
    warum: |
      Theorem from the literature (Zygmund, Garnett). The conjugate function is the Hilbert transform: in Fourier language, $e^{2\pi ik\theta}$ is multiplied by $-i\,\mathrm{sign}(k)$. The Dini condition ensures that the
      singular integral stays continuous.
    worum: |
      For every sufficiently smooth periodic function $u$ there is a “partner” $\tilde u$ such that $\tilde u-iu$ is the boundary value of a holomorphic function. This is the
      tool with which one constructs the base kernel without the engine.
- id: br.satz.produkt_iteration_ketten
  quelle_hash: 9ad8c66b326d
  theorie_hash: e2507df17cb1
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: The iterates of x·eˣ count chains of pointed partitions; Möbius number (−1)^(n−1)·n^(n−2)
    aussage: |
      $$n!\,[x^n]\,(xe^x)^{\circ t}=\sum_j B'(n,j)\binom tj,$$
      where $B'(n,j)$ is the number of strict chains $\hat0<\sigma_1<\dots<\sigma_j$ whose last member $\sigma_j$ is maximal (a single block with a point).
      This is the triangle $2;\ 3,12;\ 4,84,144;\ 5,510,2760,2880;\ 6,3210,41940,117360,86400$ from br.beob.produkt_iteration_dreieck (diagonal $n!(n-1)!$,
      row sums $2,15,232,6155,248916$). For each of the $n$ maxima $M$ we have $\mu(\hat0,M)=(-1)^{n-1}n^{n-2}$; the sum $(-n)^{n-1}=n!\,[x^n]\,W(x)$ is the value at $t=-1$.
    bereich: Lattice of pointed partitions of an $n$-set (order of Chapoton–Vallette), $\hat0$ = finest partition
    einfach: 'The numbers in the triangle of the repeated map x·eˣ count something concrete: ways of merging a set step by step into ever coarser
      groups, each with one marked member, until only one group is left.'
    beweis:
      text: |
        $xE$ (pointed set) $\circ F$ means: choose a block of $F$-structures and a point in it. So $(xE)^{\circ t}$ are the multichains
        $\hat0\le\pi_1\le\dots\le\pi_t$ with $\pi_t$ having one block, the points being inherited upward (order of Chapoton–Vallette). The distinct members above $\hat0$
        form a strict chain up to the maximum; their positions among the $t$ levels can be chosen in $\binom tj$ ways. At $t=-1$: $\sum_j(-1)^jB'(n,j)=\sum_M\mu(\hat0,M)$ (Hall)
        $=n![x^n]W(x)=(-n)^{n-1}$; symmetry gives the Möbius number. Checked by counting for $n\le6$.
    pruefung:
      f1_folgt_unmittelbar: Yes, as soon as one reads the iteration as a composition of species of the pointed sets.
      f2_benutzte_voraussetzungen: Exponential generating functions, Hall's theorem, Lagrange inversion for W.
      f3_spezialfall: Counterpart to it.satz.zeta_polynom_partitionen (eˣ − 1 and the ordinary partition lattice).
      f4_uebertragbar: To other species $F$ with $F=x+\dots$ (chains in suitable operad lattices).
      f5_neue_frage: Is the Möbius formula already in Chapoton–Vallette (arXiv math/0410051, full text not checked)? It fits dim PreLie(n) = n^{n−1}.
    bewertung:
      nutzen: Explains the triangle from br.beob.produkt_iteration_dreieck combinatorially.
      richtigkeit: complete; checked by counting for n ≤ 6
    quellen:
    - stelle: forschung/runde_2026_10_18/05_kombinatorik/BERICHT.md, P1–P3 and B6; s4_punktiert.py
    - {}
  en_theorie:
    worum: |
      What does the integer triangle of the iterates of $xe^x$ count?
    genau: |
      $n![x^n](xe^x)^{\circ t}=\sum_jB'(n,j)\binom tj$, $B'(n,j)$ = chains of length $j$ of pointed partitions that end in the one-block maximum; $\mu(\hat0,M)=(-1)^{n-1}n^{n-2}$.
    warum: |
      $xe^x$ is the species "set with one point"; its $t$-fold composition gives multichains of pointed partitions. At $t=-1$, Hall's theorem gives the Möbius number, and the inverse function is Lambert W.
    beispiel: |
      $n=4$: $4\binom t1+84\binom t2+144\binom t3$ (diagonal $4!\cdot3!=144$).
    einordnung: |
      Explains [[br.beob.produkt_iteration_dreieck]]; counterpart for $e^x-1$: [[it.satz.zeta_polynom_partitionen]].
- id: br.satz.produkt_parabolisch
  quelle_hash: 6b2963e6da30
  theorie_hash: 55e0fc399662
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: Product tetration lives at a parabolic fixed point — like tetration at η, not like Kneser
    aussage: |-
      $0$ is a parabolic fixed point: $g(x)=x+\lambda x^2+\tfrac{\lambda^2}{2}x^3+\dots$ The formal iterates have coefficients that are polynomials in the
      iteration number $c$:
      $$g^{\circ c}(x)=x+c\lambda x^2+\tfrac{c(2c-1)}{2}\lambda^2x^3+O(x^4)$$
      (as in the answer in the forum). The series diverges in general (cf. it.satz.baker for $e^z-1$); the formal half iterate diverges numerically like $(k-2)!/(2\pi)^k$
      (it.verm.mexp_halbiterierte_divergent). The natural continuation is the Fatou coordinate
      $\alpha(x)=-\tfrac1{\lambda x}+\tfrac12\ln x+\dots$ of the repelling side, $\mathrm{prodtet}(c)=\alpha^{-1}(\alpha(1)+c)$.
      The iterative residue is $\tfrac12$; for $e^x-1$ it is $\tfrac13$ — **the two maps are not even formally conjugate**, so product tetration
      is its own parabolic iteration and not a disguised tetration.
      The same map is, in the logarithm, the balanced tetration and the left pentation (br.satz.klammerung_log_reduktion).
    bereich: $g(x)=xe^{\lambda x}$, $\lambda>0$, real axis to the right of 0
    einfach: 'At 0, x·eˣ almost stands still — the map pushes away only very slowly. For such points there is a known method (Fatou coordinates)
      that fixes the intermediate values naturally, exactly as for tetration to base η. A computation shows: x·eˣ and eˣ − 1 look similar, but
      differ even in the small.'
    beweis:
      text: |-
        Compare coefficients: for $g=x+a_2x^2+a_3x^3+\dots$ one has $g^{\circ c}=x+ca_2x^2+(ca_3+c(c-1)a_2^2)x^3+\dots$; with $a_2=\lambda$, $a_3=\lambda^2/2$ this gives
        $c(2c-1)\lambda^2/2$. The iterative residue $1-a_3/a_2^2$ is invariant under scalings and is a formal invariant of parabolic germs (Leau–Fatou,
        Écalle); it is $\tfrac12$ for $xe^x$ and $\tfrac13$ for $e^x-1$. The Fatou coordinate solves $\alpha(g(x))=\alpha(x)+1$; its logarithm coefficient is
        the iterative residue. Checked in exp.verwandte_funktionen.
    pruefung:
      f1_folgt_unmittelbar: Yes, from the theory of parabolic germs.
      f2_benutzte_voraussetzungen: $\lambda>0$; real axis to the right of 0 (repelling side).
      f3_spezialfall: 'Yes: of it.satz.leau_fatou; the same situation as tetration to base η at the fixed point e.'
      f4_uebertragbar: To every map $x\,h(x)$ with $h(0)=1$, $h'(0)>0$ — a whole family of "tetrations" with a parabolic start.
      f5_neue_frage: Is the Fatou product tetration the only one that satisfies a monotonicity or convexity condition (as for η)?
    bewertung:
      nutzen: Places product tetration in the known theory and shows that it is determined naturally.
      richtigkeit: complete
    quellen:
    - stelle: Answer of 08.07.2026 (series around the fixed point 0)
    - {}
  en_theorie:
    beispiel: 'Half iterate: $c=\tfrac12$ gives $x+\tfrac\lambda2x^2+0\cdot x^3+\dots$ — the $x^3$ term vanishes exactly at $c=\tfrac12$.'
    einordnung: 'General theory: [[it.satz.leau_fatou]], divergence of the formal series: [[it.satz.baker]]; the same structure in the perturbation
      series: [[kn.konstr.stoerungsreihe]].'
    genau: |-
      $0$ is parabolic ($g'(0)=1$); formal iterate $x+c\lambda x^2+\tfrac{c(2c-1)}2\lambda^2x^3+\dots$; Fatou coordinate $\alpha=-\tfrac1{\lambda x}+\tfrac12\ln x+\dots$;
      iterative residue $\tfrac12$ (for $e^x-1$: $\tfrac13$).
    warum: |-
      Near 0, $xe^x$ pushes on by only about $x^2$ — the orbit creeps out of the fixed point like $-1/n$. The Fatou coordinate "stretches" this creeping
      into steps of equal size; in it the fractional iteration is simply $\alpha+c$. This is the same situation as for base $\eta$ at the fixed point $e$.
      The iterative residue (the factor in front of $\ln x$) is a formal invariant: because it differs for $xe^x$ and $e^x-1$, one map cannot be turned
      into the other by a change of coordinates — not even formally.
    worum: Which fractional iterate of $xe^x$ is the natural one? The answer is already in the theory of parabolic fixed points.
- id: br.satz.reelle_kennzeichnung
  quelle_hash: eff2c6b1746c
  theorie_hash: 06459b3f3349
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    titel: 'A real but nonlocal characterization of Kneser: infinitely many Fourier equations or a defect E(T) = 0'
    aussage: |-
      $$T=\text{Kneser}\iff\int_0^1h(T(x))\,e^{2\pi imx}\,dx=\frac{1}{2\pi im}\ \ \text{for all }m\ge1\iff E(T)=0,$$
      equivalently: the real and imaginary parts of $h(T(x))-x$ form a periodic Hilbert pair. The **defect**
      $$E(T)=\tfrac14\iint\frac{|\theta_T(x)-\theta_T(y)|^2}{\sin^2\pi(x-y)}\,dx\,dy-\tfrac1\pi\,\mathrm{Fläche}(\theta_T)=2\sum_{m\ge1}m\,|\hat\theta_T(-m)|^2\ \ge0$$
      is a single real quantity that attains its minimum 0 exactly at Kneser (area = the area enclosed by the curve $\theta_T$).
      For real-analytic $T$ the negative modes decay exponentially; for the linear tetration only like $m^{-2}$ ($E\approx4.7\cdot10^{-5}$).
      An exactly solvable example: if one bends Kneser with a Möbius map ($e^{2\pi i\varphi}=e^{i\alpha}(q-a)/(1-\bar aq)$), then
      $\hat\theta_T(-n)=ia^n/(2\pi n)$ and $E=-\ln(1-|a|^2)/(2\pi^2)$.
      Like Bohr–Mollerup for Γ, this is a condition on the real axis only — but **nonlocal** (Hilbert kernel); a local condition (signs of derivatives) remains open.
    bereich: real-analytic tetrations $T$ with $T'>0$, $T(0)=1$, base $b>\eta$; $\theta_T(x)=h(T(x))-x$ with the regular Abel function $h$ at
      the fixed point $L$
    einfach: 'One can recognize Kneser after all with computations on the number line alone: a certain "error quantity" is always at least zero
      and equals zero exactly at Kneser. Unlike for the gamma function, however, this is not a simple curvature condition at every point, but
      a condition that concerns the whole period at once.'
    beweis:
      text: |-
        “$\Leftarrow$”: If the negative modes vanish, $\theta_T$ is the boundary value of a periodic function holomorphic in the upper half-plane (Hardy space,
        Lusin–Privalov); then $T$ satisfies Kneser's conditions, and Paulsen–Cowgill (kn.satz.paulsen_komplex) gives $T=$ Kneser. “$\Rightarrow$”: Stage 3, Z5.
        $E$: Douglas formula for the Dirichlet energy plus the area formula $\tfrac1\pi\mathrm{Fläche}=\sum_m m(|\hat\theta(m)|^2-|\hat\theta(-m)|^2)$.
        Integrability of $\theta_T$ at the points where $x+p(x)$ is an integer: the same majorant as in kn.satz.theta_mittelwerte (Grunsky/Koebe).
        Möbius example: exact Fourier expansion, numerically to $5\cdot10^{-29}$.
    pruefung:
      f1_folgt_unmittelbar: 'At its core yes: Paulsen–Cowgill in Hardy-space language. New are the real form, the defect E and the Möbius example.'
      f2_benutzte_voraussetzungen: Paulsen–Cowgill uniqueness; Hardy-space theory; majorant at the integers.
      f3_spezialfall: 'Yes: of “θ holomorphic above ⇔ Kneser”.'
      f4_uebertragbar: To every base above η.
      f5_neue_frage: Is there a local characterization? Do fewer conditions suffice (only even m, only real parts)? Does the moment family pin
        down Kneser (br.frage.momentenfamilie; in the Jordan case yes, sketched in br.satz.momente_jordan)?
    bewertung:
      nutzen: First purely real characterization of Kneser with an extremal principle — a partial answer to br.frage.bohr_mollerup.
      richtigkeit: complete (Paulsen–Cowgill and majorant cited or proved, respectively)
    quellen:
    - stelle: forschung/identitaeten_2026_10_14/etappe4/BERICHT_ETAPPE4.md, S3, S4, MÖ, Lemma R; s1_moebius.py, s4_hooshmand.py
  en_theorie:
    beispiel: 'Linear tetration: $E\approx4.7\cdot10^{-5}$. Möbius bending of Kneser with parameter $a$: $E=-\ln(1-|a|^2)/(2\pi^2)$.'
    einordnung: 'Why less does not suffice: [[br.satz.endlich_viele_reichen_nicht]]; the old question: [[br.frage.bohr_mollerup]]; a simpler family:
      [[br.frage.momentenfamilie]].'
    genau: $T=$ Kneser if and only if all negative Fourier coefficients of $\theta_T$ vanish, i.e. if the defect $E(T)=2\sum_{m\ge1}m|\hat\theta_T(-m)|^2$
      is zero.
    warum: |-
      No negative frequencies means: $\theta_T$ can be continued holomorphically into the upper half-plane. By Paulsen–Cowgill, exactly this property selects Kneser.
      $E$ is a sum of squares, hence $\ge0$, and zero only without negative frequencies.
    worum: |-
      A condition on the real axis only that selects exactly Kneser — similar to Bohr–Mollerup for Γ. **Notation:** $T(x)=\mathrm{sexp}(x+p(x))$,
      $\theta_T(x)=h(T(x))-x$ with the regular Abel function $h$ at the complex fixed point $L$ ([[kn.def.theta_welle]]); $\hat\theta_T(-m)$ is the Fourier coefficient at frequency $-m$.
- id: br.satz.ripa
  quelle_hash: c0d8861acd89
  theorie_hash: ead7881f997d
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: Ripà 2011 (book, origin), Ripà 2020, Ripà–Onnis 2022, Ripà 2024.
    pruefung:
      f2_benutzte_voraussetzungen: Case distinction by $a\bmod20$ only from the abstract.
      f5_neue_frage: Is there a $p$-adic analogue of Kneser (continuous height $\mathbb Z_p$)?
      f3_spezialfall: $p$-adic convergence of the tower (fixed point of $x\mapsto a^x$ in $\mathbb Z_p$).
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: '$p$-adic tetration: the tower converges $p$-adically to a fixed point of $a^x$.'
