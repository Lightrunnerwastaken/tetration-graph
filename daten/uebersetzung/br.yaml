      f3_spezialfall: $p$-adic convergence of the tower (fixed point of $x\mapsto a^x$ in $\mathbb Z_p$).
      f1_folgt_unmittelbar: No.
      f4_uebertragbar: '$p$-adic tetration: the tower converges $p$-adically to a fixed point of $a^x$.'
    bewertung:
      nutzen: Discrete counterpart to analysis.
      richtigkeit: Literature; formula for a ≡ 5 (mod 10) confirmed without deviation in an experiment on 40 bases ≤ 400
    titel: Congruence speed (Ripà, Ripà–Onnis)
    aussage: 'The number of new stable final digits per level, $V(a)$, is constant from some height on; for $a\not\equiv0\pmod{10}$, $V(a)$ is
      a 2-adic or 5-adic valuation of $a\pm1$ or $a^2+1$, depending on $a\bmod 20$. For $a\equiv5\pmod{10}$: $V(a)=v_2(a^2-1)-1$ (OEIS A317905).
      Every value occurs: for every $c\ge1$ there are infinitely many $c$-th powers $a$ with $V(a)=c$ (Ripà 2024).'
  en_theorie:
    beispiel: |
      $V(3)=1$ (see above), $V(5)=2$, $V(15)=4$, $V(65)=6$. Check of the formula: $65^2-1=4224=2^7\cdot33$, so $V(65)=7-1=6$. Confirmed without deviation for 40 bases $a\equiv5\pmod{10}$ up to 400.
    einordnung: |
      Question: is there a $p$-adic analogue of Kneser, a continuous height in $\mathbb Z_p$? Foundation: [[br.satz.turm_mod_m]].
    genau: |
      The number of new stable final digits per level, $V(a)$, is constant from some height on (Ripà 2020, Ripà–Onnis 2022). For $a\not\equiv0\pmod{10}$, $V(a)$ is a 2-adic or 5-adic valuation of $a\pm1$ or $a^2+1$, depending on
      $a\bmod20$; for $a\equiv5\pmod{10}$ we have $V(a)=v_2(a^2-1)-1$.
    warum: |
      Theorem from the literature (the case distinction by $a\bmod20$ is taken over here only from the abstract). Background: The tower converges 2-adically and 5-adically to a fixed point of $x\mapsto a^x$; how fast,
      is told by the valuation — the same idea as a multiplier, only in the $p$-adic numbers.
    worum: |
      How fast do the final digits of a tower become fixed? A fixed number of new digits is added per level, and this number can be computed from the base.
- id: br.satz.sattel_knoten
  quelle_hash: 0ae7fcb30ab4
  theorie_hash: b62182549e71
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: Pomeau–Manneville (intermittency), Douady (parabolic implosion).
    pruefung:
      f2_benutzte_voraussetzungen: Exact form of the error not checked against the original.
      f5_neue_frage: $O(1)$ term and phase dependence (Lavaurs) → br.frage.implosion
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: Leading term yes (integral); the $O(1)$ error needs Fatou coordinates.
      f4_uebertragbar: '$\exp_b$ near $\eta$ at the point $e$ ($b=\eta+\delta$, $w=y-e$): $a=1/(2e)$, $\varepsilon=e^2\delta/\eta$, hence $N\approx\pi\sqrt{2\eta/(e\delta)}$
        → bw.lem.randgesetz, fp.beob.tpid6_rate.'
    bewertung:
      nutzen: Explains the boundary law.
      richtigkeit: Leading term established
    titel: Transit time through a saddle-node bottleneck
    aussage: The number of iterations through the bottleneck is $N(\varepsilon)=\pi/\sqrt{a\varepsilon}+O(1)$ (continuum limit $\int dw/(\varepsilon+aw^2)$);
      rigorous via parabolic implosion.
    bereich: $w\mapsto w+\varepsilon+aw^2+O(w^3,\varepsilon w)$, $a,\varepsilon>0$ small
  en_theorie:
    beispiel: |
      Tower to base $\eta+\delta$ at the point $e$: $a=1/(2e)$, $\varepsilon=e^2\delta/\eta$, hence $N\approx\pi\sqrt{2\eta/e}\,\delta^{-1/2}$. At $\delta=10^{-6}$: $3231$ steps, leading term $3239$.
    einordnung: |
      Explains the boundary law [[bw.lem.randgesetz]]. Rigorous with constant: [[br.frage.implosion]]. At $\delta=0$ the bottleneck becomes parabolic ([[kl.satz.parabolisch]]).
    genau: |
      For $w\mapsto w+\varepsilon+aw^2+O(w^3,\varepsilon w)$ with small $a,\varepsilon>0$, the number of steps through the bottleneck is $N(\varepsilon)=\pi/\sqrt{a\varepsilon}+O(1)$.
    warum: |
      Continuum limit: Each step moves by $\varepsilon+aw^2$, so $dw/dn\approx\varepsilon+aw^2$ and $N\approx\int_{-\infty}^\infty\frac{dw}{\varepsilon+aw^2}=\frac{\pi}{\sqrt{a\varepsilon}}$. The $O(1)$ error is controlled with Fatou coordinates
      (parabolic implosion, Douady); in physics this is called Pomeau–Manneville intermittency.
    worum: |
      A bottleneck: A map that almost has a fixed point — only a tiny $\varepsilon$ is missing — holds the orbit up for a long time. The waiting time grows like $1/\sqrt\varepsilon$. This is exactly what happens to the
      tower for bases just above $\eta$ near $e$.
- id: br.satz.shishikura
  quelle_hash: de70ca52745d
  theorie_hash: 2321769c07fe
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
  en:
    beweis:
      text: 'Lavaurs 1989 (limits), Shishikura 2000 (perturbed Fatou coordinates); Douady 1994. Not checked against the original. The computation
        for exp_b here: $w=y-e$, $w\mapsto w+\varepsilon+w^2/(2e)$ with $\varepsilon=e^2\delta/\eta$, fixed points $\pm i\sqrt{2e\varepsilon}$,
        multiplier $1\pm i\sqrt{2\varepsilon/e}$.'
    pruefung:
      f2_benutzte_voraussetzungen: Exact conditions on the direction of perturbation and on the gate not checked against the original; the constant
        $1/\alpha$ for exp_b recomputed here and confirmed by the TPID-6 rate (exp.tpid6).
      f5_neue_frage: Prove the boundary law and the TPID-6 rate with an error term (br.frage.implosion); limit of Kneser for $b\downarrow\eta$
        as a Lavaurs map.
      f3_spezialfall: 'Sharpens br.satz.sattel_knoten: instead of “$\pi/\sqrt{a\varepsilon}+O(1)$” an exact description of the $O(1)$ via the
        Lavaurs phase $\sigma$.'
      f1_folgt_unmittelbar: No (deep theory of parabolic implosion).
      f4_uebertragbar: Kneser's slog for $b>\eta$ is holomorphic on a domain around $\mathbb R$ between $L$ and $\bar L$ with slog∘exp_b = slog
        + 1 — i.e., a Fatou coordinate on the gate. That it agrees with $\Phi_f$ up to a constant is plausible (both uniformize the same quotient
        cylinder), but not checked here.
    bewertung:
      nutzen: The tool with which the boundary law and the TPID-6 rate could become provable.
      richtigkeit: established (literature, unchecked)
    titel: Perturbed Fatou coordinates and the Lavaurs map
    aussage: |
      For $f$ near $f_0$ (suitable direction, $\alpha(f)$ small with $\operatorname{Re}\alpha>0$) there is a **perturbed Fatou coordinate** $\Phi_f$ on a “gate”
      between the two fixed points: $\Phi_f(f(z))=\Phi_f(z)+1$; on one side it approaches the attracting, on the other the repelling Fatou coordinate of $f_0$,
      the translation in between is $\approx1/\alpha(f)$ (Shishikura). Consequence (Lavaurs): From $f_k\to f_0$ and $n_k-1/\alpha(f_k)\to\sigma$ it follows that
      $$f_k^{\circ n_k}\;\to\;\Psi_0^{\text{rep}}\bigl(\Phi_0^{\text{att}}(z)+\sigma\bigr)\quad\text{(Lavaurs map)}.$$
      For $\exp_b$ with $b=\eta+\delta$ at $e$: fixed points $L,\bar L$ with multiplier $\approx1\pm i\sqrt{2e\delta/\eta}$, hence
      $1/\alpha\approx2\pi/\sqrt{2e\delta/\eta}=\pi\sqrt{2\eta/(e\delta)}$ — exactly the transit time of the boundary law.
    bereich: $f_0$ with a parabolic fixed point (multiplier 1, one petal), $f$ near $f_0$ with two nearby fixed points, multiplier $e^{\pm2\pi
      i\alpha(f)}$
  en_theorie:
    beispiel: |
      $\delta=10^{-6}$: $1/\alpha\approx\pi\sqrt{2\cdot1.4447/(2.7183\cdot10^{-6})}=3239$ steps through the gate. Conversely, the base of a
      1000-level tower that gives exactly 1000 requires $\delta\approx2\pi^2\eta/(e\cdot10^6)=1.05\cdot10^{-5}$ — measured $1.0451\cdot10^{-5}$ ([[fp.beob.tpid6_rate]]).
    einordnung: |
      The tool with which the boundary law ([[bw.lem.randgesetz]]) and the TPID-6 rate with an error term could become provable
      ([[br.frage.implosion]]). Kneser's slog for $b>\eta$ is a Fatou coordinate on exactly this gate; that it agrees with Shishikura's $\Phi_f$
      is plausible but not checked here. The repelling half $\Psi_0^{\text{rep}}$ is, for $\exp_\eta$, the function cheta ([[kl.satz.cheta]]).
    genau: |
      Let $f_0$ be a map with a parabolic fixed point (multiplier 1) and $f$ a small perturbation in which it splits into two fixed points with
      multiplier $e^{\pm2\pi i\alpha(f)}$.
      - **Shishikura:** On the gate between the fixed points there is a **perturbed Fatou coordinate** $\Phi_f$ with $\Phi_f(f(z))=\Phi_f(z)+1$. On the left
        it resembles the attracting, on the right the repelling Fatou coordinate of $f_0$; in between lies a translation of about $1/\alpha(f)$.
      - **Lavaurs:** If $f_k\to f_0$ and $n_k-1/\alpha(f_k)\to\sigma$, then
        $$f_k^{\circ n_k}\;\to\;\Psi_0^{\text{rep}}\bigl(\Phi_0^{\text{att}}(z)+\sigma\bigr).$$
      - **For $\exp_b$, $b=\eta+\delta$:** The fixed points near $e$ have multiplier $\approx1\pm i\sqrt{2e\delta/\eta}$, hence
        $$\frac1\alpha\approx\frac{2\pi}{\sqrt{2e\delta/\eta}}=\pi\sqrt{\frac{2\eta}{e\,\delta}}.$$
    warum: |
      The general theorem is substantial theory (literature, not checked against the original). The computation for $\exp_b$, by contrast, is short:
      1. With $w=y-e$, a step of $y\mapsto b^y$ near $e$ is approximately $w\mapsto w+\varepsilon+\frac{w^2}{2e}$, $\varepsilon=e^2\delta/\eta$.
      2. Fixed points: $\varepsilon+w^2/(2e)=0$, hence $w=\pm i\sqrt{2e\varepsilon}$.
      3. Multiplier there: $1+w/e=1\pm i\sqrt{2\varepsilon/e}=1\pm i\sqrt{2e\delta/\eta}\approx e^{\pm i\sqrt{2e\delta/\eta}}$, hence $2\pi\alpha\approx\sqrt{2e\delta/\eta}$.
      4. Thus $1/\alpha\approx\pi\sqrt{2\eta/(e\delta)}$ — the same number that the simple bottleneck theorem ([[br.satz.sattel_knoten]]) gives as the number of steps.
         The new theorem additionally says what happens with the remainder $\sigma$.
    worum: |
      Just above $\eta$ the point of tangency at $e$ splits into two complex fixed points $L$ and $\bar L$, and between them a narrow “gate” forms,
      through which the tower creeps slowly. The theory of **parabolic implosion** (Lavaurs, Douady, Shishikura) describes this
      passage precisely: There is a coordinate in which every step is again “$+1$”, and the number of steps through the gate is essentially
      $1/\alpha$, where $\alpha$ can be read off from the multiplier of the two fixed points.
- id: br.satz.slog_nie_total_monoton
  quelle_hash: 70722dd6c0a7
  theorie_hash: 7429969c9a89
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: slog′ is not totally monotone on an interval for any tetration, and never log-concave (no Pólya frequency function)
    aussage: |
      (N1) $\mathrm{slog}_T'$ is completely monotone or absolutely monotone on no open interval; $T'$ is absolutely monotone nowhere; if $T'$ is completely monotone on $(a,b)$, then already on $(-2,b]$
      (for Kneser at most $b\le-0.5218$).
      (N2) $\log\mathrm{slog}_T'$ is convex at $+\infty$ and cannot be convex everywhere; so $\mathrm{slog}_T'$ is neither log-concave (not a PF₂ function, not a Pólya frequency function) nor log-convex.
    bereich: every real-analytic tetration to base $e$ and its $\mathrm{slog}_T$ on $\mathbb R$
    einfach: 'Two obvious ideas for a Gamma-like characterization fail for every tetration, not only for Kneser: the derivative of the superlogarithm
      never has the particularly nice sign or curvature properties one would need.'
    beweis:
      text: |
        N1: Bernstein turns $u\mapsto f(\beta'-u)$ into a power series with coefficients $\ge0$; by Pringsheim the singularity lies on the real axis, $\mathrm{slog}_T$ is analytic on all of $\mathbb R$, hence entire;
        then $\mathrm{slog}_T(e^w)=\mathrm{slog}_T(w)+1$ on $\mathbb C$, and at $w=L$ we get $0=1$. For $T'$ analogously ($T$ would be entire, or the Pringsheim point is $-2$).
        N2: $(\log\mathrm{slog}')''(w)=(1-G'(\ell)+G''(\ell))/w^2$, $\ell=\log w$, with $G',G''\to0$; a function that is convex everywhere with $\log\mathrm{slog}'\sim-\log w$ on the right and $\sim w$ on the left does not exist.
    pruefung:
      f1_folgt_unmittelbar: From Bernstein, Pringsheim and "slog is not entire".
      f2_benutzte_voraussetzungen: Analyticity of $\mathrm{slog}_T$ on $\mathbb R$, fixed point $L$, asymptotics of $\mathrm{slog}$ at $\pm\infty$
        (N2 derived by standard induction).
      f3_spezialfall: No.
      f4_uebertragbar: To every base $b>\eta$.
      f5_neue_frage: Which weaker sign condition on the slog side remains possible?
    bewertung:
      nutzen: Rules out two obvious Bohr–Mollerup routes for all tetrations.
      richtigkeit: 'complete (N2: asymptotics derived)'
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, N1, N2, B-N1, B-N2
  en_theorie:
    worum: |
      Two obvious Gamma-like conditions on the slog side: total monotonicity and log-concavity of $\mathrm{slog}'$.
    genau: |
      Both are impossible for every tetration.
    warum: |
      Total monotonicity would make $\mathrm{slog}$ an entire function; then $\mathrm{slog}(e^w)=\mathrm{slog}(w)+1$ would also hold at the fixed point $L$, that is, $0=1$.
      For log-convexity, the asymptotics at $+\infty$ and $-\infty$ do not fit together.
    beispiel: |
      Kneser: $T''<0$ only on $(-2,-0.5218)$.
    einordnung: |
      Negative for [[br.frage.bohr_mollerup]]; boundary behavior as in [[gr.kor.konvex_nach_oben]].
- id: br.satz.taylorradius_halbebene
  quelle_hash: e0b2291e6fec
  theorie_hash: 5acd238c5251
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: 'Local extremal principle: ρ_T(x) ≤ x + 2 for every tetration, equality everywhere exactly for holomorphy on Re z > −2 — Kneser is
      maximal at every point'
    aussage: |
      For every such $T$ we have $\rho_T(x)\le x+2$, and $D_T(x):=x+2-\rho_T(x)\ge0$ is non-decreasing. The following are equivalent:
      (a) $T$ is holomorphic on $H=\{\mathrm{Re}\,z>-2\}$; (b) at every point $x$ we have $(-1)^{k-1}k(x+2)^kT^{(k)}(x)/k!\to1$, in particular $(-1)^{k-1}T^{(k)}(x)>0$ for all large $k$;
      (c) (b) on a sequence $x_j\to\infty$; (d) $\rho_T(x)=x+2$ for all $x$; (e) $\rho_T(x)-x\to2$ for $x\to\infty$.
      Kneser is holomorphic on $\mathbb C\setminus(-\infty,-2]$, so it has $D\equiv0$. If $T$ has a singular point $z_0\in H$, then $T$ violates (b) at all $x$ with $|x-z_0|<x+2$, and $D_T(x)\ge\mathrm{Re}\,z_0+2-o(1)$.
    bereich: real-analytic tetrations $T$ on $(-2,\infty)$, $T(x+1)=e^{T(x)}$, $T(0)=1$, $T'>0$; for $b>\eta$ verbatim with $\log_b$
    einfach: At every point one can measure how far the Taylor series of a tetration reaches. It never reaches past the point −2. Kneser's tetration
      attains this maximum everywhere; equivalently, its high derivatives alternate in sign like those of log(x+2).
    beweis:
      text: |
        Lemma 0: $T(x)=\log(x+2)+B(x+2)$ with $B$ analytic near 0 (from $T(x+1)=\log T(x+2)$), likewise in the complex case if $T$ is holomorphic on $H$.
        (a)⇒(b): $B$ is holomorphic on a neighborhood of the closed disk $\overline{D(x,x+2)}$, and the coefficients of $\log(z+2)$ dominate.
        (c)⇒(a): Pringsheim — if the coefficients of $-T(x-u)$ are positive from $k_0$ on, there is a singularity at $u=R$ on the real axis; since $T$ is analytic on $(-2,\infty)$, it follows that $R=x+2$; the disks $D(x_j,x_j+2)$ exhaust $H$.
        $\rho_T\le x+2$ because $T\to-\infty$ at $-2$; $\rho$ is 1-Lipschitz, hence $D_T$ is non-decreasing and (e)⇒(d). Singularity in $H$: monodromy on the simply connected $H$.
    pruefung:
      f1_folgt_unmittelbar: At its core from Pringsheim and the log structure at −2 (Lemma 0); the combination into an equivalence is new.
      f2_benutzte_voraussetzungen: Real analyticity on $(-2,\infty)$, functional equation, $T\to-\infty$ at $-2$.
      f3_spezialfall: Sharpens Levenstein's observation (high derivatives behave like log(x+2)) into a characterization of half-plane holomorphy.
      f4_uebertragbar: To every base $b>\eta$.
      f5_neue_frage: Does holomorphy on $H$ already force Kneser (br.frage.halbebene_eindeutigkeit)?
    bewertung:
      nutzen: First local, real quantity for which Kneser is extremal at every point — Bohr–Mollerup-like.
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, A, B, E, Lemma 0, B-A, B-B; e1_kneser_ungerade.py
    - stelle: 'Levenstein: high derivatives follow log(x+2)'
  en_theorie:
    worum: |
      Bohr–Mollerup characterizes Γ by a condition at every point. We look for something similar for Kneser. The suitable local quantity is the
      radius of convergence $\rho_T(x)$ of the Taylor series at $x$.
    genau: |
      $\rho_T(x)\le x+2$ always; $\rho_T(x)=x+2$ for all $x$ $\iff$ $T$ holomorphic on $\mathrm{Re}\,z>-2$ $\iff$ $(-1)^{k-1}k(x+2)^kT^{(k)}(x)/k!\to1$ at every point.
    warum: |
      Every tetration has a singularity like $\log(x+2)$ at $-2$, so no series reaches further. If $T$ is holomorphic in the half-plane, $\log(z+2)$ is the nearest singularity
      and determines the high coefficients. Conversely, a fixed sign pattern forces the singularity onto the real axis by Pringsheim, hence to $-2$.
    beispiel: |
      Kneser: the normalized quotient is $1.0000$ at $k=99$ for $x\le0.15$; a sine bending with $\varepsilon=0.03$ has radius only $\approx0.8$ at $x=0.3$.
    einordnung: |
      Partly answers [[br.frage.bohr_mollerup]]; nonlocal counterpart [[br.satz.reelle_kennzeichnung]]; [[br.frage.halbebene_eindeutigkeit]] remains open.
- id: br.satz.turm_mod_m
  quelle_hash: 9b054b1a3d38
  theorie_hash: fa949fbcc8b7
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
    zusatz: nein
  en:
    beweis:
      text: 'Induction on $m$: $a^k\bmod m$ depends, for $k\ge\log_2 m$, only on $k\bmod\lambda(m)$ (Carmichael), and $\lambda(m)<m$; the exponents
        $a\uparrow\uparrow(n-1)$ become constant mod $\lambda(m)$.'
    pruefung:
      f2_benutzte_voraussetzungen: Only number theory mod m.
      f5_neue_frage: How many final digits stabilize per level? → br.satz.ripa
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: Yes, from the generalized Euler theorem.
      f4_uebertragbar: To mixed towers and p-adic (ar.satz.selbstpotenz_kongruenz, ar.satz.padische_tuerme).
    bewertung:
      nutzen: Discrete side of tetration.
      richtigkeit: complete
    titel: Towers modulo m become constant
    aussage: The sequence $a\uparrow\uparrow n \bmod m$ is eventually constant.
    bereich: integers $a\ge1$, $m\ge1$
    einfach: If you look only at the last digits of a tower like 3^3^3^…, they stop changing beyond a certain height — even though the number
      itself becomes unimaginably large.
    quellen:
    - {}
    - stelle: Abstract, §1–2 (also for mixed towers)
    - stelle: own proof, experiment
  en_theorie:
    beispiel: |
      The last ten digits of $3\uparrow\uparrow n$: $n=3$: …5597484987, $n=4$: …6100739387, $n=5$: …9660355387, $n=6$: …5126595387, $n=7$: …3200195387, $n=8$: …5504195387.
      Per level, exactly one further digit becomes fixed: …87, …387, …5387, …95387, …195387.
    einordnung: |
      How many digits become fixed per level: [[br.satz.ripa]].
    genau: |
      For integers $a,m\ge1$ the sequence $a\uparrow\uparrow n\bmod m$ is eventually constant.
    warum: |
      1. For large exponents, $a^k\bmod m$ depends only on $k\bmod\lambda(m)$ (generalized Euler theorem; $\lambda$ is the Carmichael function), and $\lambda(m)<m$.
      2. The exponent of $a\uparrow\uparrow n$ is $a\uparrow\uparrow(n-1)$. By induction (on $m$) it is eventually constant modulo $\lambda(m)$.
      3. Hence $a\uparrow\uparrow n\bmod m$ is also eventually constant.
    worum: |
      If you look only at the last digits of a tower like $3^{3^{3^{\cdot^{\cdot}}}}$, they stop changing beyond a certain height — even though the number itself becomes unimaginably large.
- id: br.satz.ungerade_ableitungen_halbebene
  quelle_hash: c8b84c0745d1
  theorie_hash: 4d8ee68f3dbd
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    titel: Positive odd derivatives — from some order on — force holomorphy on Re z > −2
    aussage: |
      If $T^{(2n+1)}\ge0$ on $(-2,\infty)$ for all $n\ge n_0$ (some $n_0$), then $T$ is real-analytic and holomorphic on $H=\{\mathrm{Re}\,z>-2\}$.
      If the condition holds only on $(X,\infty)$, holomorphy follows on $\mathrm{Re}\,z>X$. Thus mike3's conjecture (gr.verm.ungerade_ableitungen) is stronger than expected:
      it implies half-plane holomorphy.
    bereich: $C^\infty$ tetrations $T$ on $(-2,\infty)$ to base $e$ (analyticity is not assumed)
    einfach: If from a certain order on all odd derivatives are never negative, then the tetration is automatically very smooth — it can be continued
      into the whole right half-plane of the complex numbers.
    beweis:
      text: |
        Lemma (Bernstein, absolutely convex functions; proved here directly): if $g\in C^\infty(a,\infty)$ with $g^{(2k)}\ge0$ for all $k$, then $g$ is analytic at $x$ with radius $\ge x-a$
        (Taylor with integral remainder for $E(u)=\tfrac12(g(x+u)+g(x-u))$ gives $g^{(2k)}(x)\le M(2k)!/r^{2k}$; odd orders via convexity of $g^{(2k)}$).
        With $g=T^{(2n_0+1)}$, $a=-2$: $g$ is holomorphic on all $D(x,x+2)$, hence on $H$; $T$ is obtained by integration.
    pruefung:
      f1_folgt_unmittelbar: From Bernstein's lemma on absolutely convex functions, applied to a high odd derivative.
      f2_benutzte_voraussetzungen: Only $C^\infty$ and the sign; the functional equation only for the location of $-2$.
      f3_spezialfall: Variant of Bernstein's theorem.
      f4_uebertragbar: To every base $b>\eta$ and every function with a singularity at $-2$.
      f5_neue_frage: Does every tetration holomorphic on $H$ also satisfy C(0)? Does C(0) hold for Kneser?
    bewertung:
      nutzen: 'Places mike3''s conjecture: it is a half-plane condition.'
      richtigkeit: complete
    quellen:
    - stelle: forschung/runde_2026_10_18/08_reelle_kennzeichnung/BERICHT.md, C, B-C
    - stelle: Conjecture (mike3)
  en_theorie:
    worum: |
      mike3 conjectured: all odd derivatives of Kneser are positive. What follows from such a condition?
    genau: |
      $T^{(2n+1)}\ge0$ for all $n\ge n_0$ on $(-2,\infty)$ ⇒ $T$ holomorphic on $\mathrm{Re}\,z>-2$.
    warum: |
      By Bernstein, a function whose even derivatives are all $\ge0$ is analytic with radius up to the boundary of the interval. We apply this to a high odd derivative of $T$.
    beispiel: |
      Kneser satisfies the condition numerically up to order 99 ([[br.beob.kneser_ungerade_99]]).
    einordnung: |
      Places [[gr.verm.ungerade_ableitungen]]; together with [[br.satz.taylorradius_halbebene]] the basis for [[br.satz.lokal_genau_dann_halbebene]].
- id: br.satz.vdd_miller
  quelle_hash: eceefa30009a
  theorie_hash: f806a8691722
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: zweitpruefung
    kern: zweitpruefung
    theorie: nein
  en:
    beweis:
      text: van den Dries–Miller 1994, Prop. 9.10 (still valid after the correction); sketch in van den Dries–Macintyre–Marker 1994, §4.8.
    pruefung:
      f2_benutzte_voraussetzungen: Cell decomposition / preparation theorem
      f5_neue_frage: Tetration lies outside → br.satz.nicht_definierbar
      f3_spezialfall: 'no'
      f1_folgt_unmittelbar: 'No'
      f4_uebertragbar: —
    bewertung:
      nutzen: Growth bound of tame geometry.
      richtigkeit: established (literature)
    titel: Definable functions in ℝ_an,exp are bounded by exponential towers
    aussage: Every function $f:\mathbb R\to\mathbb R$ definable in $\mathbb R_{\mathrm{an},\exp}$ is eventually bounded by an iterated exponential
      $\exp^{\circ n}$.
  en_theorie:
    beispiel: |
      $x^x=e^{x\ln x}$, $e^{e^x}$, $\log\log x$ or $x^{x^x}$ — all stay below a tower of fixed height.
    einordnung: |
      Consequence for tetration: [[br.satz.nicht_definierbar]]. The same tower bound in computability: [[br.satz.kalmar]].
    genau: |
      Every function $f:\mathbb R\to\mathbb R$ definable in $\mathbb R_{\mathrm{an},\exp}$ is eventually bounded by an iterated exponential $\exp^{\circ n}$ (van den Dries–Miller 1994).
    warum: |
      Theorem from the literature. The basis is a preparation theorem: definable functions split into finitely many pieces on which they are built from $\exp$, $\log$ and bounded analytic functions
      in finitely many steps. Each step raises the tower by at most one level.
    worum: |
      “Tame geometry” allows logarithms, exponential functions and analytic functions on compact pieces — but everything one can build from them grows
      at most like a tower of fixed height. Tetration grows faster.
- id: br.satz.vergleichsfunktion
  quelle_hash: a9ef7b6f730e
  theorie_hash: b71a5500c78a
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    titel: 'Continuing with a comparison function: exponential factorial and product tetration are the same limit trick'
    aussage: |
      Both forum proposals follow one pattern: one already knows a continuous superfunction $S$ of a **comparison map** $g$, and the sequence
      $a_n$ in question behaves for large $n$ like $S(n+\text{const})$. Then one continues by
      $$a(x)=\lim_{k\to\infty}\Phi_x^{(k)}\bigl(S(x+k+D)\bigr),\qquad D=\lim_n\bigl(S^{-1}(a_n)-n\bigr),$$
      where $\Phi_x^{(k)}$ are the $k$ backward steps of the sequence's own recursion. For the exponential factorial ($a_n=n^{a_{n-1}}$, $S=\mathrm{sexp}_e$)
      $\Phi$ is a chain of logarithms to the bases $x+1,\dots,x+k$ (tid 1828); for tetration with product tetration as the comparison (tid 1816),
      $S=\mathrm{prodtet}$. This is exactly the limit trick kn.satz.grenzwert_trick, or the change of base $T\circ\mathrm{slog}$: the backward steps
      contract every error doubly exponentially, which is why $D$ converges so fast.
      As with the change of base, one should not expect the result to be analytic or "the" natural solution.
      Checked for the exponential factorial (ar.konstr.ef_sexp): $D=-1.0552140087$, the integer values come back to $10^{-12}$.
    einfach: 'A known trick: one already knows a smooth function that, for large numbers, grows almost the same as the one being sought. One computes
      far out with this known function and then goes back step by step. Errors become tiny very quickly. This is how the forum continued both
      the exponential factorial and tetration (via product tetration).'
    beweis:
      text: 'Classification: both proposals have the form $\lim_k\Phi^{(k)}\circ S(\cdot+k+D)$ from kn.satz.grenzwert_trick.'
      luecken:
      - Convergence for the exponential factorial only measured (doubly exponential, integer values to 10⁻¹²), not proved.
      - For tetration with product tetration as the comparison (tid 1816), neither convergence nor smoothness has been checked.
    pruefung:
      f1_folgt_unmittelbar: The classification yes; convergence is measured for the exponential factorial, for tid 1816 only plausible.
      f2_benutzte_voraussetzungen: A continuous superfunction $S$ of the comparison map; fast contraction of the backward steps.
      f3_spezialfall: 'Yes: of kn.satz.grenzwert_trick; the change of base (bw.def.F_bd) is the same case with $S$ = tetration to another base.'
      f4_uebertragbar: To every sequence that grows like a known superfunction (hyperfactorials, towers with alternating bases).
      f5_neue_frage: Does the result depend on the choice of $S$ (sexp versus prodtet as the comparison)? For the change of base the answer is
        yes — as a θ-wave.
    bewertung:
      nutzen: Shows that two new forum ideas are a known tool, and what one can expect from them.
      richtigkeit: Classification certain, convergence partly measured
    quellen:
    - {}
    - {}
    - {}
    - stelle: Classification as the limit trick
  en_theorie:
    beispiel: |
      Exponential factorial: $D=-1.0552140087$, $0.5!_2=0.7575097219$ (ar.konstr.ef_sexp).
    einordnung: |
      General form: [[kn.satz.grenzwert_trick]]; the same case between two bases: [[bw.def.F_bd]]; application: [[ar.konstr.ef_sexp]].
    genau: |
      If $a_n$ grows like $S(n+D)$ for a known superfunction $S$, one continues by $a(x)=\lim_k\Phi_x^{(k)}(S(x+k+D))$ with the backward steps $\Phi$ of the sequence's own recursion.
    warum: |
      Far out, $a_n$ and $S(n+D)$ are almost equal; each backward step is a logarithm and makes the relative error tiny. That is why the
      sequence converges doubly exponentially and the integer values come back exactly. What the trick does not provide: a reason why precisely this continuation is
      "right" — a different comparison function can give a different solution (for the change of base they differ by a θ-wave).
    worum: |
      Two new forum ideas — exponential factorial via sexp and tetration via product tetration — are the same old trick.
- id: br.satz.young_kreis
  quelle_hash: '460719923996'
  theorie_hash: 0aa400184ddc
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft:
    beweis: nein
    intern: nein
    kern: zweitpruefung
    theorie: zweitpruefung
  en:
    beweis:
      text: |
        Young's equation $\int_0^1\tilde H+\int_{\tilde H(0)}^{\tilde H(1)}\tilde H^{-1}=\tilde H(1)$. Since $\tilde H^{-1}-\mathrm{id}$
        is 1-periodic, $\int_{\tilde H(0)}^{\tilde H(0)+1}\tilde H^{-1}=\int_0^1(\tilde H^{-1}-\mathrm{id})+\tilde H(0)+\tfrac12$. Substitute.
    pruefung:
      f2_benutzte_voraussetzungen: Only monotonicity and the degree-one property.
      f5_neue_frage: 'Classifies bw.satz.antisymmetrie as a special case: tetration provides only the inverse.'
      f3_spezialfall: Equality case of Young's inequality.
      f1_folgt_unmittelbar: Yes (Young, equality case).
      f4_uebertragbar: Every lift of a circle homeomorphism.
    bewertung:
      nutzen: Shows that Paper II Thm. B is not tetration-specific content.
      richtigkeit: complete
    voraussetzungen:
    - text: H̃ continuous, strictly increasing, H̃(x+1) = H̃(x)+1
    - text: H̃ differentiable
    titel: Area identity for inverse circle homeomorphisms
    aussage: $\displaystyle\int_0^1(\tilde H(x)-x)\,dx=-\int_0^1(\tilde H^{-1}(y)-y)\,dy$.
    bereich: $\tilde H:\mathbb R\to\mathbb R$ strictly increasing homeomorphism with $\tilde H(x+1)=\tilde H(x)+1$
  en_theorie:
    beispiel: |
      $\tilde H(x)=x+0.3$: left $0.3$, right $-(-0.3)$. Base change: $\mu_{e,2}=-1.128403776628924$ and the mean of the inverse $+1.128403776629334$; for 200 random lifts the formula holds up to $6\cdot10^{-10}$.
    einordnung: |
      Makes [[bw.satz.antisymmetrie]] a special case: Tetration provides only that $\tilde H_{d,b}$ is the inverse of $\tilde H_{b,d}$.
    genau: |
      If $\tilde H:\mathbb R\to\mathbb R$ is a strictly increasing homeomorphism with $\tilde H(x+1)=\tilde H(x)+1$, then
      $$\int_0^1(\tilde H(x)-x)\,dx=-\int_0^1(\tilde H^{-1}(y)-y)\,dy.$$
    warum: |
      1. Young's equation: $\int_0^1\tilde H+\int_{\tilde H(0)}^{\tilde H(1)}\tilde H^{-1}=\tilde H(1)$ — two areas complement each other to a rectangle (as in [[gr.satz.young]]).
      2. $\tilde H^{-1}-\mathrm{id}$ is 1-periodic, hence $\int_{\tilde H(0)}^{\tilde H(0)+1}\tilde H^{-1}=\int_0^1(\tilde H^{-1}-\mathrm{id})+\tilde H(0)+\tfrac12$.
      3. Substitute and use $\tilde H(1)=\tilde H(0)+1$. Differentiability is not needed anywhere.
    worum: |
      An area formula for circle maps: The area between the graph of such a map and the diagonal is exactly the negative of the corresponding area for the
      inverse map. This is the actual reason for the antisymmetry in the base change.
