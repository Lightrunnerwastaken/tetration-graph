forum_tid1177:
  art: forum
  autor: S. Levenstein (sheldonison), J. D. Nixon (JmsNxn), Ember Edison
  titel: pentation and hexation
  ort: Tetration Forum, tid 1177, 07.08.2017–18.09.2019 (Beiträge 1–10; Beitrag 5 = pid 8759, 6 = pid 8760, 7 = pid 8761, 8 = pid 8762)
  geprueft: original
  notiz: 'Levenstein 07.08.2017: hex(−3) = −2, lineare Hexation singulär nahe −3.86, weil hex(−2.86) ≈ −1.85 der Fixpunkt der Tetration ist; Fixpunkte der Pentation −2.25975… ± 1.38442… i. Nixon 21.08.2017: jede analytische Hyperoperation der Stufe n erfüllt f(−k) = 1−k (0 ≤ k ≤ n−1), Beweis Trappmann zugeschrieben. Levenstein 03.09.2017: Hexation Kneser-artig über einen Kreis zwischen den konjugierten Fixpunkten der Pentation mit θ-Abbildung (≈ 30 Stellen für reelle Basen), Heptation regulär am linken reellen Fixpunkt der Hexation; beschränkt bis ≈ 1.635 (Pentation, nach Nuinho), ≈ 1.738 (Hexation), 1.799 (Heptation), 1.839 (Oktation); Eindeutigkeit „zeigbar“, ohne Argument. Nixon 03./04.09.2017: b > ηₙ ⇔ b↑ⁿx → ∞ (ohne Beweis), daraus Beschränktheit für b < 2. Levenstein 04.09.2017: warum eₙ → 4?; Basis 1.84: Heptation fast mit oberem Fixpunkt nahe 3.7, oct(45) ≈ 4.05.'
forum_tid1518:
