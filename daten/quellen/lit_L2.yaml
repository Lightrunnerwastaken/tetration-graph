walker1991_jmaa:
  art: literatur
  autor: P. L. Walker
  titel: On the solutions of an Abelian functional equation
  ort: J. Math. Anal. Appl. 155(1) (1991), 93–110, doi:10.1016/0022-247X(91)90029-Y (Zbl über zbMATH Open)
  geprueft: sekundaer
  notiz: 'zbMATH-Rezension: zwei Lösungen von f(e^{z/e}) = f(z) + 1 über die Iteration von 1 − e^{−z} und log(1+z), eine 2π-periodisch für Re z < e, eine auf ℂ ohne (−∞, e]; Zahlenwerte. Nach Trappmann–Kouznetsov 2011 (S. 4, Ref. 12) enthält die Arbeit auch ein Zahlverfahren für die Potenzreihenkoeffizienten eines 4-Logarithmus um 0 (ohne Konvergenzbeweis).'
walker1988:
  art: literatur
  autor: P. L. Walker
  titel: A class of functional equations which have entire solutions
  ort: Bull. Austral. Math. Soc. 38(3) (1988), 351–356, doi:10.1017/S0004972700027702
  geprueft: sekundaer
  notiz: Bibliografie über Crossref; Inhalt nur als Vorarbeit in der zbMATH-Rezension von Walker 1991 (Math. Comp.) genannt.
clenshaw1986:
  art: literatur
  autor: C. W. Clenshaw, D. W. Lozier, F. W. J. Olver, P. R. Turner
  titel: Generalized exponential and logarithmic functions
  ort: Comput. Math. Appl. Part B 12 (1986), 1091–1101 (Zbl 0621.33002)
  geprueft: sekundaer
  notiz: 'zbMATH-Rezension: Verallgemeinerungen von exp und log, zwei Fassungen untersucht; Anwendungen in der Rechnerarithmetik (sehr grosse und kleine Zahlen, Level-Index) und bei funktionalen Wurzeln. Die genaue Definition nicht gelesen.'
szekeres1998:
  art: literatur
  autor: G. Szekeres
  titel: "Abel's equation and regular growth: variations on a theme by Abel"
  ort: Experiment. Math. 7(2) (1998), 85–100, doi:10.1080/10586458.1998.10504359 (Zbl 0918.39006)
  geprueft: sekundaer
  notiz: 'zbMATH-Rezension (J. Aczél): F analytisch auf [0,∞), F(0) = 0, F''(0) = c ≥ 1, F'' > 0; Auswahl der „besten“ Abel-Lösung über einen Begriff „regulären Wachstums“; Vermutung: eine abgeschwächte vollständige Monotonie der Fourier-Koeffizienten von φ∘A⁻¹ entscheidet das reguläre Wachstum, gestützt durch Rechnungen; Bezug zu P. Lévy 1928.'
forum_tid213:
  art: forum
  autor: H. Trappmann (bo198214), S. Levenstein (sheldonison), mike3
  titel: Kneser's Super Logarithm
  ort: Tetration Forum, tid 213, ab 19.11.2008
  geprueft: original
  notiz: 'Trappmanns Darstellung von Knesers Beweis: Problem 1941 auf der DMV-Tagung in Jena besprochen; Schröder-Funktion an c ≈ 0.318 + 1.337 i, fortgesetzt auf die obere Halbebene ohne die Punkte expⁿ(0), Umkehrung ganz; Riemann-Abbildung auf die Kreisscheibe, die von z ↦ z + c induzierte Möbius-Abbildung muss parabolisch sein; Spiegelung gibt reelle Analytizität. Eindeutigkeit wird Kneser nicht zugeschrieben.'
forum_tid170:
  art: forum
  autor: H. Trappmann (bo198214), G. Helms (Gottfried), Ivars
  titel: open problems / Discussion
  ort: Tetration Forum, tid 170, 2008
  geprueft: original
  notiz: 'Trappmann vermutet für f(x) = x² + x − 1/16 (Fixpunkte ±1/4), dass die Eigenwerte abgeschnittener Carleman-Matrizen nicht mehr gegen die Potenzen der Ableitung an einem Fixpunkt gehen; Helms: Eigenwertmengen wachsender Abschnitte stabilisieren sich nicht.'
