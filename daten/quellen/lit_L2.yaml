# ---------------------------------------------------------------- Basiswechsel, Wachstum
paulsen_cowgill2021:
  art: literatur
  autor: W. Paulsen, S. Cowgill
  titel: Incompatible growth rates of the tetrations
  ort: Indian J. Math. 63(1) (2021), 127–141 (zbMATH 1470.39046)
  geprueft: sekundaer
  notiz: 'Inhalt über die zbMATH-Zusammenfassung: Kneser-Tetrationen zu zwei verschiedenen Basen liegen nicht in einem gemeinsamen Hardy-Körper; die von ihnen erzeugten gebrochenen Iterierten sind in keinem Hardy-Körper verträglich. Text nicht frei zugänglich; Levenstein kündigt die Arbeit im Forum an (tid 1189, 31.03.2018).'
paulsen2026:
  art: literatur
  autor: W. Paulsen
  titel: Analyzing the function z↑↑a for fractional a
  ort: Adv. Comput. Math. 52(2) (2026), Nr. 25, 21 S., doi:10.1007/s10444-026-10300-z (eingereicht 09.10.2024, online 01.04.2026)
  geprueft: sekundaer
  notiz: Nur Metadaten (Crossref, zbMATH 8187345); Inhalt nicht zugänglich — betrifft die Tetration als Funktion der Basis.
forum_tid937:
  art: forum
  autor: J. D. Nixon (JmsNxn), S. Levenstein (sheldonison)
  titel: Fractional calculus and tetration
  ort: Tetration Forum, tid 937, 2014
  geprueft: sekundaer
  notiz: 'Nur Suchtreffer-Auszug: Levenstein — beim Basiswechsel über η konvergieren alle Ableitungen auf der reellen Achse, wachsen aber zu schnell für Analytizität; die Basiswechsel-Funktion ist im Komplexen nicht definiert.'
forum_tid1308:
  art: forum
  autor: J. D. Nixon (JmsNxn)
  titel: A different approach to the base-change method
  ort: Tetration Forum, tid 1308, 17.03.2021
  geprueft: original
  notiz: 'Basiswechsel von η nach e: gebrochene Iterierte zur Basis η über eine inverse Mellin-Transformation, Ansatz φ(z) = Ψ⁻¹(exp(L·slog_η z + θ(slog_η z))); die Wahl von θ, die φ reell macht, bleibt offen.'
forum_tid26:
  art: forum
  autor: G. Helms (Gottfried)
  titel: Gottfried Helms' change of base formula
  ort: Tetration Forum, tid 26, 16.08.2007
  geprueft: original
  notiz: 'Basiswechsel zwischen regulären Tetrationen unter η über die Eigenzerlegung der Carleman-Matrix (Eigenwerte als Potenzen von log t angenommen); Beispiel √2 → 2.5^{1/2.5}: y₂ ≈ 2.342 mit 24 × 24-Matrizen.'

