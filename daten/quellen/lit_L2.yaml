  notiz: 'Basis ν ≈ 1.6353245 (= η₄): Tetration mit parabolischem oberem Fixpunkt ≈ 3.0885323 und unterem −1.640873 (Ableitung ≈ 4.806); Pentation dort über den unteren Fixpunkt, pent(2) ≈ 2.0088543, Periode ≈ 4.002370 i; Levenstein: parabolische Pentation (wie „cheta“) wäre eine andere Funktion.'
forum_tid675:
