# Themengebiete (Übersichtsebene). Reihenfolge = Anordnung in der Übersicht.
- id: gr
  name: Grundlagen
  kurz: Einstieg — Werte, Ableitungen, Integrale, Ableitung nach der Basis und der Superlogarithmus, elementar bewiesen und nachgerechnet
  farbe: "#3fa7c4"
- id: fg
  name: Funktionalgleichungen
  kurz: Abel-, Schröder- und Tetrationsgleichung; Struktur aller Lösungen, Nicht-Eindeutigkeit
  farbe: "#3d6fb6"
- id: it
  name: Lokale Iterationstheorie
  kurz: Iteration nahe einem Fixpunkt — Koenigs, Leau–Fatou, Écalle, Baker, Erdős–Jabotinsky
  farbe: "#2f8f83"
- id: fp
  name: Fixpunkte und unendlicher Turm
  kurz: Fixpunkte von b^z über Lambert W, Schwelle η = e^{1/e}, Konvergenz von b^{b^{…}}
  farbe: "#6a8f2f"
- id: kl
  name: Lösungsklassen nach Basis
  kurz: reguläre Tetration (1 < b < η), parabolischer Fall b = η, Abel-Funktionen an verschiedenen Fixpunkten
  farbe: "#b0832b"
- id: kn
  name: Kneser-Tetration und slog
  kurz: Knesers Konstruktion, Eindeutigkeitssätze, Singularität bei −2, alternative Konstruktionen
  farbe: "#b5523b"
- id: bw
  name: Basiswechsel
  kurz: Mischbasen-Höhenabbildung slog_b ∘ T_d, Phasengesetz, Antwortkern, Rekonstruktion (Papers I–VI)
  farbe: "#8c4fa3"
- id: ar
  name: Arithmetik und Transzendenz
  kurz: algebraische Werte, Schanuel, Zählsätze auf dem Graphen, Natur von T_e(1/2)
  farbe: "#a3456e"
- id: br
  name: Brücken zu anderen Gebieten
  kurz: o-Minimalität und Hardy-Felder, Kreisabbildungen, Sattel-Knoten-Durchgang, Gevrey, Türme mod m, Berechenbarkeit
  farbe: "#5b6575"
