  quelle_hash: a2cc1731ccb4
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Foundations
    untertitel: Values, derivatives, shape of the curve and areas — what every tetration must satisfy, no matter how it is built.
    teile:
    - text: |
        This chapter needs only school mathematics: powers, logarithms, derivative and integral. Almost everything here follows from the one
        equation $T(x+1)=a^{T(x)}$ and therefore holds for **every** tetration, not just for one particular construction. Where a
        particular construction is meant (mostly Kneser's, for base $e$), this is stated.
    - {}
    - {}
    - text: |
        The super-logarithm inverts the tetration in the **height**: it asks how often one has to exponentiate. One can also invert it in the
        **base** and ask which number, raised to the power of itself, gives a prescribed $x$. This is the **super-root** — and
        here again the Lambert W function helps, which later also delivers all fixed points.
    - {}
    - {}
    - {}
    - {}
    - {}
    - {}
    - text: |
        **What is fixed and what is free.** The equation $T(x+1)=a^{T(x)}$ connects only points that lie an integer apart. Hence there are exactly
        two kinds of statements. The first kind holds for **every** tetration: values at integer points, the swap rule $T(x+1)^{T(y)}=T(y+1)^{T(x)}$, the Taylor ladder
        from one level to the next, and $\ln a=T'(0)/T'(-1)$ — one level higher, $\ln a=P'(0)P'(-2)/P'(-1)^2$ for the pentation. The others connect points
        at non-integer distance, such as $T(\tfrac12)$ with $T(0)$; they depend on the chosen tetration ([[gr.satz.frei_und_fest]]).
    - {}
    - text: |
        **What does tetration allow us to do?** Five things that are impossible without it. *Half steps:* $\exp^{[s]}(x)=T(\operatorname{slog}x+s)$ is a function that,
        applied twice, gives $e^x$ — no formula built from $\exp$ and $\ln$ can do that ([[kn.satz.halbe_exp_wachstum]]). *Measuring growth:* $\operatorname{slog}f(x)-\operatorname{slog}x$
        counts how many exponential functions are contained in $f$, and with tetration this number can be a fraction ([[gr.satz.exponentialitaet]]). *Making huge numbers tangible:*
        the number of digits and the last digits of towers that could never be written out ([[gr.satz.stellen]], [[br.satz.turm_mod_m]]). *Solving equations:* $x^x=c$ or $x^{x^x}=c$
        with super-roots ([[gr.satz.superwurzel]]). *Building further:* pentation, hexation and all higher levels arise by the same step — and carry the same
        fixed relations upward ([[gr.satz.stufenleiter]]).
- art: kapitel
  id: k10
