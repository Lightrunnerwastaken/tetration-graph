  id: k8
  quelle_hash: a300580fd625
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: The base plane
    untertitel: Complex bases, regions, spirals, the period-2 bulb and the square wave.
    teile:
    - text: |
        If you admit complex bases, the number line becomes a plane full of patterns: a region in which the tower comes to rest,
        buds with cycles, spirals, dust made of escaping bases. This chapter sorts the patterns and shows which formulas lie behind them.

        ![[bild:exp.parameterraum]] Left: every base $b$ in the rectangle, colored by the period into which its tower falls. The large region in the middle is the
        Shell–Thron region (period 1); the buds on the boundary carry cycles. Right: the tower to base $i$ spirals into its fixed point.

        > The one number that orders almost everything is the multiplier $\lambda$ at the fixed point: inside $|\lambda|<1$, on the boundary $|\lambda|=1$, in the buds a cycle
        > whose multiplier takes over the role.
    - {}
    - {}
    - {}
- art: kapitel
  id: k9
  quelle_hash: 4713e3da650d
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Numbers and arithmetic
    untertitel: Is T_e(1/2) rational? Towers modulo m, transcendence and o-minimal structures.
    teile:
    - text: |
        The values of tetrations are numbers — what kind of numbers? This chapter collects what is known about irrationality,
        transcendence and divisibility of towers, and which tools from number theory and logic apply here.

        > The honest balance up front: even for $e^e=T_e(2)$ it is not proved that it is irrational. What is proved are statements about **pairs** of neighboring
        > values and about the **number** of simple points on the graph — about a single value like $T_e(\tfrac12)$ there are only numerical exclusions.
    - {}
    - {}
    - {}
    - {}
