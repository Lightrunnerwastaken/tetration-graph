  en:
    titel: Bridges to other fields
    untertitel: Logic and growth, circle maps, bottlenecks, discrete mathematics and real analysis.
    teile:
    - text: |
        Tetration shows up in many fields, often under another name: as a growth class in logic, as a circle map in
        dynamics, as a bottleneck when passing a saddle point. These connections are collected here.
    - {}
    - {}
    - {}
