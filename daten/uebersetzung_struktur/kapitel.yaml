  en:
    titel: 'Formula collection: fixed and free'
    untertitel: What every tetration must satisfy, what can be chosen freely — and which condition fixes the choice again.
    teile:
    - text: |
        Here are the formulas of the graph at a glance, sorted by a single question:
        **Does this hold for every tetration, or does it depend on which one you have chosen?**
        The answer follows a simple rule ([[gr.satz.frei_und_fest|Free and fixed]]):

        > A formula holds for every tetration if and only if it connects only points that lie an **integer** apart. Anything that connects points at distance ½ or 0.3 has to be chosen.

        Notation: $a>0$, $a\ne1$ is the base, $c=\ln a$, $T$ a tetration with $T(x+1)=a^{T(x)}$ and $T(0)=1$, $A=\operatorname{slog}_a$ its inverse,
        $P$ the pentation and $H_k$ the $k$-th level ($H_3=a^x$, $H_4=T$, $H_5=P$). Each row points to the node with proof and conditions.
    - abschnitt: 'Fixed: values and rules of computation'
    - text: |
        | Formula | in words | Node |
        | --- | --- | --- |
        | $T(x+1)=a^{T(x)}$, $T(x-1)=\log_aT(x)$ | the equation itself, forward and backward | [[fg.def.tetration|Definition]] |
        | $T(-1)=0$, $T(1)=a$, $T(2)=a^a$, $T(n)=a\uparrow\uparrow n$ | at integer points everything is determined; at $-2$ there is no value | [[fg.lem.ganzzahlwerte|Integer arguments]] |
        | $T(x)\to-\infty$ for $x\to-2^+$ | for $a>1$; range all of $\mathbb R$ for $a>\eta$, otherwise up to the lower fixed point | [[gr.satz.gestalt|Shape]] |
        | $T(x+n)=\exp_a^{\circ n}\bigl(T(x)\bigr)$ | integer steps are iteration — a rule $T(m+n)=T(m)\ast T(n)$ does not exist | [[gr.satz.tauschregel|No addition rule]] |
        | $T(x+1)^{T(y)}=T(y+1)^{T(x)}=a^{T(x)T(y)}$ | two levels may be swapped; for integers: $16^2=4^4=2^8$ | [[gr.satz.tauschregel|Swap rule]] |
        | $a=T(x+1)^{1/T(x)}$, $T(x+2)=T(x+1)^{T(x+1)/T(x)}$ | the base is contained in every pair of neighboring values ($x\ne-1$) | [[gr.satz.tauschregel|Swap rule]] |
        | $\lfloor a\uparrow\uparrow n\cdot\log_{10}a\rfloor+1$ | number of digits of $a\uparrow\uparrow(n+1)$ | [[gr.satz.stellen|Digits]] |
        | $a\uparrow\uparrow n\bmod m$ becomes constant | the last digits of a tower eventually stand still | [[br.satz.turm_mod_m|Towers mod m]] |
        | $H_k(-j)=-(j-1)$ for $j=1,\dots,k-3$ | $T(-1)=0$; $P(-1)=0$, $P(-2)=-1$; each level inherits one more integer point | [[gr.satz.stufenleiter|Ladder of levels]] |
    - abschnitt: 'Fixed: super-logarithm'
    - text: |
        | Formula | in words | Node |
        | --- | --- | --- |
        | $A(a^y)=A(y)+1$, $A(1)=0$, $A(0)=-1$, $A(a)=1$ | every power adds one; $A\to-2$ for $y\to-\infty$ | [[gr.satz.slog_grund|slog basics]] |
        | $\lceil A(y)\rceil=\log_a^*y$ | rounded up: how often one must take the logarithm until one is at most 1 | [[gr.satz.logstern|log*]] |
        | $A'(y)=1/T'(A(y))$, $A'(y)=c\,a^yA'(a^y)$ | derivative of the inverse | [[gr.satz.slog_ableitung|slog derivative]] |
        | $A'(0)/A'(1)=\ln a$ | the logarithm from two slog slopes | [[gr.satz.ln_aus_steigungen|ln from slopes]] |
        | $A'(x)\,L_0L_1\cdots L_m\to0$, $L_k=\log_a^{\circ k}x$ | slog becomes flatter than every level of the logarithm scale | [[gr.satz.slog_steigung_langsam|slog′ slow]] |
    - abschnitt: 'Fixed: derivatives'
    - text: |
        All rows hold for every tetration that is differentiable at the points in question.

        | Formula | in words | Node |
        | --- | --- | --- |
        | $T'(x+1)=c\,T(x+1)\,T'(x)$ | chain rule: one level higher times $c$ times the function value | [[gr.satz.kettenregel|Chain rule]] |
        | $\ln T'(x+1)-\ln T'(x)=\ln c+c\,T(x)$ | for $a=e$, $T$ is the difference of $\ln T'$ over one step | [[gr.satz.kettenregel|Chain rule]] |
        | $T'(x+n)=c^n\,T'(x)\prod_{k=1}^{n}T(x+k)$ | over $n$ integer steps a product | [[gr.kor.produktformel|Product formula]] |
        | $T''(x+1)=c\,T(x+1)\bigl[c\,T'(x)^2+T''(x)\bigr]$ | curvature one level higher | [[gr.satz.zweite_ableitung|Second derivative]] |
        | $T^{(n)}(x+1)=T(x+1)\,B_n\bigl(cT'(x),\dots,cT^{(n)}(x)\bigr)$ | the whole Taylor series jumps one level further (Bell polynomials) | [[gr.satz.taylor_leiter|Taylor ladder]] |
        | $(\ln T)^{(k)}(x+1)=c\,T^{(k)}(x)$ | the same backward, without Bell polynomials | [[gr.satz.ln_aus_steigungen|ln from slopes]] |
        | $\ln a=\dfrac{T'(0)}{T'(-1)}=\dfrac{T''(0)-T'(0)^2}{T''(-1)}$ | ratios of slopes are independent of the solution | [[gr.satz.ln_aus_steigungen|ln from slopes]] |
        | $\ln a=\dfrac{P'(0)\,P'(-2)}{P'(-1)^2}$ | the same one level higher, for the pentation | [[gr.satz.stufenleiter|Ladder of levels]] |
        | $\ln\ln a=\sum_{j=0}^{m}(-1)^j\binom mj\ln H_{3+m}'(-j)$ | for every level: a row from Pascal's triangle | [[gr.satz.stufenleiter|Ladder of levels]] |
        | $T'(x)$ and $T'(x+1)$ have the same sign | for $a>1$; for $0<a<1$ the sign changes — there no solution is monotone | [[gr.satz.vorzeichen|Sign]] |
        | $T''\ge0$ on one period $\Rightarrow$ $T''>0$ to the right of it | convexity is inherited upward | [[gr.kor.konvex_nach_oben|Convex upward]] |
        | $T'(x+n)^{1/n}\to\lambda=a_*\ln a$ | for $1<a<\eta$: the slope falls by the factor $\lambda$ per level | [[gr.satz.abklingen|Decay]] |
    - abschnitt: 'Fixed: integrals'
    - text: |
        | Formula | in words | Node |
        | --- | --- | --- |
        | $\int_m^nT+\int_{T(m)}^{T(n)}A=n\,T(n)-m\,T(m)$ | area under $T$ plus area beside $A$ makes a rectangle | [[gr.satz.young|Young]] |
        | $\int_0^1T=1-c\int_0^1a^uA(u)\,du$, also $1<\int_0^1T<a$ | equivalent form, with bounds | [[gr.kor.integral_formen|Integral forms]] |
        | $\int_{-1}^0T=-\int_0^1A$ | the area below is a slog area | [[gr.satz.integral_unten|Lower integral]] |
        | $\int_x^{x+1}T'(u)\,T(u+1)\,du=\dfrac{T(x+2)-T(x+1)}{c}$ | an integral over one period, entirely without choice | [[gr.satz.integral_produkt|Product integral]] |
        | $\int_x^{x+1}\ln T(u+1)\,du=c\int_x^{x+1}T(u)\,du$ | logarithm one level higher = area one level lower | [[gr.satz.integral_log|Log integral]] |
        | $\int_0^1{}^{2n}x\,dx\to0.676714\ldots$, $\int_0^1{}^{2n+1}x\,dx\to0.631309\ldots$ | even and odd tower integrals have different limits | [[gr.satz.turmintegral_grenzen|Tower integrals]] |
        | $I_\infty(r+1)=2M-I_\infty(r)$, $M=0.654011822\ldots$ | at fractional height: corners, mean value and symmetry are fixed | [[gr.satz.turmintegral_periodisch|Periodic tower integral]] |
    - abschnitt: 'Fixed: derivative with respect to the base and growth'
    - text: |
        | Formula | in words | Node |
        | --- | --- | --- |
        | $D(x+1)=c\,T(x+1)\,D(x)+\dfrac{T(x+1)\,T(x)}{a}$, $D=\partial_aT$, $D(0)=0$ | the base derivative satisfies a linear step equation | [[gr.satz.basis_gleichung|Base equation]] |
        | $t_{n+1}'=t_{n+1}\bigl(t_n/a+c\,t_n'\bigr)$, $t_n=a\uparrow\uparrow n$ | at integer heights a simple recursion | [[gr.satz.basis_ganz|Base, integer heights]] |
        | $\partial_ay=S_a(x)\,\partial_xy-S_a(y)$ | Kobi's equation for every tower of integer height | [[gr.satz.turm_pde|Tower equation]] |
        | $h'(a)=\dfrac{h^2}{a(1-h\ln a)}$, $h=a^{a^{\cdots}}$ | derivative of the infinite tower | [[gr.satz.turm_ableitung|Tower derivative]] |
        | $h(a)=e-\sqrt{2e^3(\eta-a)/\eta}+\dots$ | a square root at $\eta$ | [[gr.satz.wurzel_eta|Root at η]] |
        | $\chi(f)=\lim\bigl(A(f(x))-A(x)\bigr)$, $\chi(f\circ g)=\chi(f)+\chi(g)$ | slog counts exponentials; integer values are the same for every slog | [[gr.satz.exponentialitaet|Exponentiality]] |
        | $f\circ f=\exp$ $\Rightarrow$ $x^n\prec f(x)\prec e^{x^\varepsilon}$ | every half-exponential function lies between polynomials and $e^{x^\varepsilon}$ | [[kn.satz.halbe_exp_wachstum|Half-exp growth]] |
    - abschnitt: 'Free: what depends on the choice'
    - text: |
        Every other tetration is $\tilde T=T\circ(\mathrm{id}+p)$ with a 1-periodic function $p$, $p(0)=0$ ([[fg.satz.allgemeine_loesung|General solution]]).
        Because $p$ looks the same at $x$ and $x+1$, it drops out of all the formulas above. What it does change is listed here — with the value of Kneser's tetration to base $e$
        as an example.

        | Quantity | why free | Kneser, base $e$ |
        | --- | --- | --- |
        | $T(x)$ at non-integer $x$ | every value between the two integer neighbors is possible, even real-analytic — [[fg.kor.nichteindeutigkeit|Non-uniqueness]] | $T_e(\tfrac12)=1.6463542337\ldots$ |
        | $T'(0)$ | a single free number; it fixes all $T'(n)$ — [[gr.kor.ganze_stellen|Integer arguments]] | $1.0917673512\ldots$ (linear: jump from $1$ to $\ln a$, no jump at $a=e$) |
        | Ratios across half steps, e.g. $T'(\tfrac12)/T'(0)$ | $p$ acts differently at $0$ and $\tfrac12$ — [[gr.satz.frei_und_fest|Free and fixed]] | $1.44276$ (with $p=0.05\,\sin\ldots$: $0.79178$) |
        | Position and number of inflection points | Kneser has exactly one, regular ones below $\eta$ none — [[gr.beob.wendepunkte|Inflection points]] | $x_w=-0.5218$ |
        | Individual areas such as $\int_{-1}^0T$ | only the rectangle sum (Young) is fixed — [[gr.beob.integral_halb|Integral ½]] | $0.4992181828\ldots$ (linear: $\tfrac12$) |
        | Base derivative at fractional height | the step equation fixes it only up to $T'\cdot$(periodic) — [[gr.beob.kneser_pde_wackeln|Kneser wobbles]] | at base 2, $p$ wobbles by $5.7\cdot10^{-4}$ |
        | the half-exponential function itself | $T(A(x)+\tfrac12+p(A(x)))$ solves $f\circ f=\exp$ just as well — [[kn.satz.halbe_exp|Half-exp]] | $f(0)=0.4985632879\ldots$ |
        | fractional exponentiality | another slog lets $A(f)-A(x)$ oscillate — [[gr.satz.exponentialitaet|Exponentiality]] | $\chi=\tfrac12$ only with Kneser's slog |
        | Shape of the tower-integral curve | distribution of the heights at which the square waves jump — [[gr.satz.turmintegral_periodisch|Periodic tower integral]] | (below $1$ no natural choice) |
        | Smoothness | continuous, $C^1$ or analytic — depending on the construction — [[kn.satz.linear_glatt|Linear, smooth]] | analytic (linear: $C^1$ only at $e$, never $C^2$) |
    - abschnitt: What fixes the choice again
    - text: |
        To turn “free” into “fixed” again, one needs an additional condition. The known ones that select exactly one solution are **complex** — they look
        beyond the real axis.

        | Condition | Bases | selects |
        | --- | --- | --- |
        | holomorphic on $\operatorname{Re}z>-2$, $T(x+iy)\to L$ for $y\to+\infty$ and $\to\bar L$ for $y\to-\infty$ | $a>\eta$ | exactly Kneser's tetration — [[kn.satz.paulsen_cowgill|Paulsen–Cowgill]] |
        | holomorphic and bounded on $\operatorname{Re}z\ge0$ | $1<a\le\eta$ | exactly the regular tetration — [[kl.satz.carlson|Carlson]] |
        | real-analytic and strictly increasing | all $a>1$ | still infinitely many — [[fg.kor.nichteindeutigkeit|Non-uniqueness]] |
        | a real condition such as log-convexity for $\Gamma$ | $a>\eta$ | **open** — [[br.frage.bohr_mollerup|Bohr–Mollerup question]] |
        | linear on $(-1,0]$ | all | the linear tetration (only continuous) — [[kn.konstr.linear|Linear]] |
