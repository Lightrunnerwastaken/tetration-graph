  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: What is tetration?
    untertitel: From the power tower to the question of what a “half height” should be — everything you need for the chapters that follow.
    teile:
    - abschnitt: Computing by repeating
    - text: |
        The basic operations of arithmetic grow out of one another by repetition. Anyone who computes $3+3+3+3$ has added the same number four times and
        writes $4\cdot 3$ for short. Anyone who computes $3\cdot3\cdot3\cdot3$ has multiplied the same number four times and writes $3^4$.
        The next step is obvious: you repeat the *exponentiation*. Four threes stacked on top of each other as exponents,
        $$3^{3^{3^{3}}},$$
        are called a **power tower** of height 4, written $3\uparrow\uparrow4$ (Knuth's arrow notation) or ${}^{4}3$.
        The operation is called **tetration** — from the Greek *tetra* for four, because it is the fourth level after addition,
        multiplication and exponentiation.

        A tower is evaluated **from the top**. $3^{3^3}$ means $3^{(3^3)}=3^{27}=7\,625\,597\,484\,987$ and not $(3^3)^3=27^3=19\,683$.
        This is no accident of notation: evaluated from the bottom, the tower would collapse to $3^{3\cdot3\cdot3}$ — nothing new would come out,
        just an ordinary power. Only evaluating from the top produces the new, incredibly fast growth.

        Formally, one defines the tower level by level: $a\uparrow\uparrow1=a$ and $a\uparrow\uparrow(n+1)=a^{\,a\uparrow\uparrow n}$.
        A new level thus means: “$a$ to the power of the previous result.” We also set $a\uparrow\uparrow0=1$, because then the
        rule holds for the first step as well: $a^{1}=a$. This is the first node of the graph: [[gr.def.turm]].
    - unterschrift: The same idea, applied four times. On the logarithmic axis a power becomes a straight line — the tower shoots away all the
        same.
    - abschnitt: How huge towers get
    - text: |
        Even small towers defy the imagination. $2\uparrow\uparrow3=2^{2^2}=16$, $2\uparrow\uparrow4=2^{16}=65\,536$ — and
        $2\uparrow\uparrow5=2^{65536}$ already has $19\,729$ decimal digits. The number $3\uparrow\uparrow4=3^{7\,625\,597\,484\,987}$ has
        $3\,638\,334\,640\,025$ digits; it could not be written out on any computer in the world.

        How can we know how many digits it has, then? With the logarithm. The number of digits of a number $m$ is
        $\lfloor\log_{10}m\rfloor+1$, and the logarithm of a power brings the exponent down:
        $$\log_{10}\bigl(a\uparrow\uparrow(n+1)\bigr)=a\uparrow\uparrow n\cdot\log_{10}a .$$
        So the logarithm removes **exactly one level** from the tower. This one observation carries the whole theory: anyone who wants to
        understand towers computes with repeated logarithms. More on this in [[gr.satz.stellen]] and, for the super-logarithm, in [[gr.satz.logstern]].
    - abschnitt: Small bases — the tower comes to rest
    - text: |
        Not every tower explodes. Take $a=\sqrt2\approx1.414$ and build level by level:
        $$1,\ \ \sqrt2=1.414,\ \ \sqrt2^{\sqrt2}=1.633,\ \ 1.761,\ \ 1.841,\ \ 1.893,\ \ 1.927,\ \ 1.950,\ \dots$$
        The values grow, but ever more slowly, and come arbitrarily close to the number $2$. The infinite tower $\sqrt2^{\sqrt2^{\sqrt2^{\cdots}}}$
        is therefore a perfectly ordinary number: $2$.

        Why exactly $2$? If the tower has a limit $h$, then one more level changes nothing: $h=a^{h}$.
        For $a=\sqrt2$, $h=2$ satisfies this equation, since $\sqrt2^{\,2}=2$. Such a number is called a **fixed point** of the map
        $x\mapsto a^x$. Geometrically, a fixed point is an intersection of the curve $y=a^x$ with the line $y=x$, and computing
        the tower is a staircase between the two curves (right picture).
    - unterschrift: Left — depending on the base, $y=b^x$ crosses the line twice, touches it, or misses it. Right — the tower to base √2 as a
        staircase between curve and line; it runs into the lower intersection point 2.
    - text: |
        Whether there are any intersection points at all depends on a single number:
        $$\eta=e^{1/e}\approx1.444667861 .$$
        If the base is smaller than $\eta$, then $y=a^x$ crosses the line twice; the lower intersection point **attracts** the tower.
        At $a=\eta$ the curves touch exactly at $x=e$. If $a>\eta$, there is no intersection point — the tower grows beyond all
        bounds. This is the content of [[fp.def.eta]] and [[fp.satz.reelle_fixpunkte]].

        There is a limit downward as well. For bases between $0$ and $1$ the tower jumps alternately up and down.
        Down to the base $e^{-e}\approx0.066$ the jumping dies down and the tower converges nonetheless. Below that it never stops:
        for base $0.03$ the tower oscillates forever between roughly $0.82$ and $0.056$ — a **2-cycle**. Leonhard Euler summarized the
        result like this: the infinite tower $a^{a^{a^{\cdots}}}$ converges exactly for
        $$e^{-e}\le a\le e^{1/e}$$
        ([[fp.satz.turm_reell]]).
    - unterschrift: Bases below 1. At 0.3 the back-and-forth gets ever smaller; at 0.03 it persists forever.
    - abschnitt: The base as a variable
    - text: |
        You can also let the base vary. The simplest function of this kind is $x^x$: it starts at $1$ (as $x\to0$), first dips a
        little, has its lowest value $e^{-1/e}=1/\eta\approx0.692$ at $x=1/e$, and then rises steeply ([[gr.satz.selbstpotenz]]).
        That $\eta$ shows up here already is no accident — it is the same computation as for the intersection points above.

        Higher towers of $x$, that is ${}^2x=x^x$, ${}^3x=x^{x^x}$ and so on, show everything at once: above $\eta$ they run away,
        between $e^{-e}$ and $\eta$ they contract onto a single curve, and below $e^{-e}$ they split into two branches —
        even heights on top, odd heights below. This splitting is the reason why the areas under the towers have two different limits
        ([[gr.satz.turmintegral_grenzen]]).
    - unterschrift: Left, the self-power $x^x$. Right, the towers ${}^n x$ — they split at $e^{-e}$ and end at η.
    - abschnitt: Half heights — the real question
    - text: |
        So far every tower had a whole number of levels. What is a tower with $2.5$ levels? Just as one got from $2^3$ to $2^{0.5}=\sqrt2$,
        we would like a **function** $T(x)$ that hits the towers at the integer points and connects them sensibly in between.
        What “sensibly” means is dictated by the building rule of the tower, carried over to all heights:
        $$T(x+1)=a^{T(x)},\qquad T(0)=1 .$$
        Such a function is called **a tetration to base $a$**. The equation immediately gives $T(1)=a$, $T(2)=a^a$ and so on,
        and, going backward, $T(-1)=0$ (since $a^0=1$). Still further to the left every tetration plunges to $-\infty$ as soon as $x$ approaches $-2$ ([[gr.satz.gestalt]]).

        Here lies the main difficulty of the whole field: **the equation alone does not determine $T$.** One can prescribe $T$ almost arbitrarily on the piece
        between $-1$ and $0$ — say as a straight line $T(x)=1+x$ — and then continue it to the right, piece by piece, using the equation.
        This gives the “linear tetration.” It satisfies the equation exactly but has kinks. With smoother
        prescriptions one gets smoother solutions, and there are infinitely many of them ([[fg.kor.nichteindeutigkeit]]).

        Which one is the “right” one? The answer from research: one additionally demands good properties in the **complex plane**, and then
        exactly one solution remains.
        - For $1<a<\eta$ it is the **regular tetration**, built at the attracting fixed point: there every step looks almost like a
          scaling, and a half scaling is easy to define (Chapters 4 and 5). For base $\sqrt2$, $T(1/2)=1.24362\ldots$
          and the curve comes to rest at $2$.
        - For $a>\eta$ it is **Kneser's tetration** (1950), built at a pair of complex fixed points with an additional
          correction (Chapter 6). For base $e$, $T(1/2)=1.6463542\ldots$; the linear tetration would give $e^{1/2}=1.6487\ldots$, so
          almost the same, but not quite the same.
    - unterschrift: Left, two tetrations to base e — Kneser (smooth) and the linear one (with kinks); the inset shows their small difference.
        Right, the regular tetration to base √2, approaching the fixed point 2.
    - abschnitt: The inverse — the super-logarithm
    - text: |
        Every increasing tetration comes with an inverse function, the **super-logarithm** $\operatorname{slog}_a$. It answers the question:
        “At what height does the tower reach the value $y$?” From $T(x+1)=a^{T(x)}$ we get
        $$\operatorname{slog}_a(a^{y})=\operatorname{slog}_a(y)+1 .$$
        One logarithm less means one level lower. Rounded up, the super-logarithm simply counts how often one has to take the logarithm
        until one lands at $1$ or below ([[gr.satz.logstern]]). In technical language it is an **Abel function**, and almost every deeper
        construction in this book first builds an Abel function and then inverts it.
    - abschnitt: A short history
    - text: |
        The question is old; the answers are astonishingly recent.
        - **1783 — Euler** finds for which bases the infinite tower has a limit; in **1844** **Eisenstein** gives a series for this limit ([[fp.satz.turm_reell]]).
        - **1936–1962 — Barrow, Thron, Shell** settle the same question for complex bases: the Shell–Thron region ([[fp.satz.shell_thron]]).
        - **1947 — Goodstein** gives the operation its name “tetration”; in **1976** **Knuth's** arrows $\uparrow\uparrow$ are added ([[br.def.hyperoperation]]).
        - **1950 — Hellmuth Kneser** builds a real-analytic half-iterate of $e^x$ — from which Kneser's tetration later emerges ([[kn.konstr.kneser]]).
        - **1958 and 1962 — George Szekeres** develops the regular iteration of real functions and finds a purely real uniqueness condition
          ([[it.satz.szekeres]], [[it.satz.szekeres_monoton]]); he also notes that Kneser's solution is not singled out by growth alone.
        - **Around 1991** **Asimov, Hickerson and Schroeppel** notice that the base $\sqrt2$ has two different natural solutions ([[kl.beob.zwei_abel]]);
          in the same year **Walker** builds an infinitely differentiable solution ([[kn.konstr.walker]]).
        - **From 2007** the **tetration forum** (Henryk Trappmann, Andrew Robbins, Jay Fox, Sheldon Levenstein, Dmitrii Kouznetsov and others) collects methods,
          numbers and open questions — from pentation ([[kn.konstr.pentation]]) to the list of open problems (TPID).
        - **2009–2012** **Kouznetsov and Trappmann** compute the solutions cleanly in the complex plane for the first time and prove a uniqueness result
          ([[kn.satz.trappmann_kouznetsov]], [[kl.satz.vier_sqrt2]]).
        - **2017** **Paulsen and Cowgill** show that Kneser's solution is uniquely determined by simple conditions ([[kn.satz.paulsen_cowgill]]);
          **2019** brings complex bases ([[kn.satz.paulsen_komplex]]).

        This book gathers all of this in one place, recomputes every number, and says for every statement how certain it is.
    - abschnitt: How this book is organized
    - text: |
        Every statement sits in its own box. At the top it says what kind of statement it is (definition, theorem, conjecture …), how well
        established it is, and whom it is meant for (introductory, advanced, research). Below that comes the statement itself in concise
        mathematical form, and then the detailed explanation in fixed parts:
        - **What it is about** — the idea, without presupposing any formulas.
        - **Precisely** — the statement once more, with every symbol explained.
        - **Why it holds** — the justification, step by step.
        - **Example** — with real numbers you can recompute.
        - **Context** — what the statement builds on and where it leads.

        The “Details and sources” button opens everything else: hypotheses and whether the proof really needs them, sources,
        experiments, the check questions. Blue words are links to other statements. The chapters build on one another; if you only want to
        understand what tetration is, Chapters 0 to 2 will take you far.

        > A word on honesty: “proved” means proved here. Numbers that were only measured are called “numerical,” conjectures
        > are called conjectures, and refuted ideas stay in place so that you can see why they are wrong.
