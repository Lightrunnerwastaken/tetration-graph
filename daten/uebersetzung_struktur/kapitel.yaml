  id: k2
  quelle_hash: 2ef5192bc5f5
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Fixed points and the infinite tower
    untertitel: Where the tower comes to rest, why η is the limit, and what happens in the complex plane.
    teile:
    - text: |
        A **fixed point** of the map $f(z)=a^z$ is a number $L$ with $a^{L}=L$. Fixed points decide everything: whether the infinite tower
        converges, how quickly a tetration comes to rest, and which construction can be used for half heights. How strongly a
        fixed point attracts or repels is measured by its **multiplier** $\lambda=f'(L)=L\ln a$: if $|\lambda|<1$ it attracts; if $|\lambda|>1$
        it repels; for $|\lambda|=1$ it is “neutral” — this is the hardest case.
    - {}
    - {}
- art: kapitel
  id: k3
  quelle_hash: f02920571bd5
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: The equation and why it is not enough
    untertitel: The Abel and Schröder equations, the freedom in the solutions and what restricts it.
    teile:
    - text: |
        The tetration equation $F(x+1)=a^{F(x)}$ is a special case of a general question: for a map $f$ one looks for a
        function that carries out “$f$ in continuous time.” This chapter shows why the equation alone has infinitely many solutions,
        how to describe all of them (one solution, shifted by a periodic function) and which additional conditions single one out.
    - {}
    - {}
    - {}
- art: kapitel
  id: k4
  quelle_hash: 0aa483f1b041
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Iteration at a fixed point
    untertitel: Koenigs, Leau–Fatou, Écalle — the tool for building half steps.
    teile:
    - text: |
        Near a fixed point, every smooth map looks almost linear. This chapter turns that into exact coordinates:
        at an attracting or repelling fixed point the Koenigs coordinate, in which the map is a pure scaling; at a neutral
        (parabolic) fixed point the Fatou coordinate, in which it is a pure translation. In both coordinates a half
        step is obvious.
    - {}
    - {}
    - {}
- art: kapitel
  id: k5
  quelle_hash: eadbef10f176
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Tetration below η
    untertitel: The regular solution, fractional sums, the borderline case η and its digamma structure.
    teile:
    - text: |
        For bases between $1$ and $\eta$ there is an attracting real fixed point, and with the tools from Chapter 4 one obtains
        the regular tetration. This chapter builds it, computes with it (spectral series, fractional sums, derivative formula) and follows
        what happens in the limit as the base approaches $\eta$.
    - {}
    - {}
    - {}
    - {}
- art: kapitel
  id: k6
  quelle_hash: 344fd51105cb
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Kneser and the super-logarithm
    untertitel: Tetration for bases above η, its uniqueness and its alternatives.
    teile:
    - text: |
        Above $\eta$ there is no real fixed point any more, only a complex pair $L,\bar L$. In 1950 Kneser showed how to build a real-analytic
        tetration from it nonetheless. This chapter explains the construction, why it is unique
        (Paulsen–Cowgill), where it becomes singular, and what other proposals there are.
    - {}
    - {}
    - {}
    - {}
    - text: |
        **What is all this for?** In 1950 Kneser was actually looking for a function $f$ with $f(f(x))=e^x$. With the tetration it is there at once:
        $f(x)=T(\operatorname{slog}x+\tfrac12)$. It grows faster than any polynomial and more slowly than any $e^{x^\varepsilon}$ — a growth class
        that cannot be written down with $\exp$ and $\log$ alone.
    - {}
    - text: |
        **One level higher.** With a finished tetration $T_b$ one can repeat the whole game: pentation is iterated tetration,
        $b\uparrow\uparrow\uparrow3=T_b(T_b(b))$. For fractional heights one again needs a fixed point — the tetration to base $e$ meets
        the line $y=x$ at $-1.85$ —, and there the same regular iteration helps as in Chapter 5. A nice echo appears along the way:
        just as $\eta$ and $e$ mark the limit of the infinite tower, $\eta_4\approx1.6353$ and $e_4\approx3.0885$ mark the limit
        of the infinite pentation.
    - {}
    - {}
- art: kapitel
  id: k7
  quelle_hash: 640ea55b14af
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: zweitpruefung
  en:
    titel: Base change
    untertitel: How the tetration to base d is translated into the heights of base b — phase law, wave and common fixed points.
    teile:
    - text: |
        The question of this chapter: at what height does the tower to base $b$ reach the value that the tower to base $d$ has at height $x$?
        The answer $\operatorname{slog}_b(T_d(x))$ is almost $x+\text{const}$, but with a small periodic wave. Here you will find
        where the wave comes from, what it looks like, and when it vanishes.

        ![[bild:k7_phase]] Left: $\operatorname{slog}_e(T_2(n+\theta))-(n+\theta)$ for $n=0,\dots,4$ — the curves fall, level by level, onto an almost horizontal line at
        $\mu=-1.1284$. Right: what is left over, the wave $P(\theta)$, magnified ten-thousandfold.

        ### Roadmap
        - **Phase law and channel:** why the translation comes to rest, and which assumptions were needed for this or have meanwhile been proved.
        - **Circle map:** the wave as a map of the circle to itself; it follows that the forward and the return path cancel exactly.
        - **Modes:** how fast the Fourier components of the wave decay, and why an apparent singularity was a computational artifact.
        - **Response kernel and hub:** the wave to first order and a single table column $m(b)$ that carries all the means.
        - **Riemann–Hilbert and reconstruction:** the derivative with respect to the base, without a computing engine — all the way to the tetration to base $2$ from the one to base $e$.
        - **Common fixed points:** when the change of base needs no wave at all.

        > The strands reach all the way to the current state of research. If you are reading for the first time, take along the definition, the phase law, the antisymmetry, the hub and the
        > common fixed points, and skip the rest.
    - {}
    - {}
    - {}
    - {}
    - {}
    - {}
    - {}
