      after Nuninho), ≈ 1.738 (hexation), 1.799 (heptation), 1.839 (octation); uniqueness “provable”, without argument. Nixon 03./04.09.2017:
      b > ηₙ ⇔ b↑ⁿx → ∞ (without proof), hence boundedness for b < 2. Levenstein 04.09.2017: why eₙ → 4?; base 1.84: heptation almost with upper
      fixed point near 3.7, oct(45) ≈ 4.05.'
