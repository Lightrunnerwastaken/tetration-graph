  en:
    titel: exp_η ↔ e^u − 1 and divergent half-iterates
    frage: Is the conjugation exact? How do the coefficients of the formal half-iterate grow?
    ergebnis:
      zusammenfassung: 'Conjugation exact (residual 9.0e-60). Half-iterate: c_2 = 1/4, c_3 = 1/48, …; |c_n|^(1/n) grows from 0.196 (n=10) to 1.630
        (n=60) — divergent, as in Baker.'
      pruefungen:
      - name: η^{e+eu} = e + e(e^u − 1) at 20 complex random points
      - name: g∘g = e^u − 1 exact up to degree 60
      - name: known initial coefficients c_2 = 1/4, c_3 = 1/48
      - name: '|c_n|^{1/n} grows (n = 30 → 60) — no finite radius of convergence visible'
- art: experiment
  id: exp.eta_digamma
  quelle_hash: d3aac3fef0ce
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Base η — reciprocal coordinate, C_T, digamma; reciprocal tower sums
    frage: What is the value of C_T, does the digamma decomposition of the fractional sum at η including the constant hold, and does the first
      term of the reciprocal sum dominate above η?
    ergebnis:
      zusammenfassung: 'Base η: C_T = 2.7982481542313876625 (from integer heights), T_η(1/2) = 1.257153075054173, Σ_k[T(k) − e + 2e/k] = 10.79756227493931,
        Σ T′(k) = 1.4502290173934; digamma decomposition confirmed. C_2 = 0.8125152587890625, C_e = 0.4338677391894938.'
      pruefungen:
      - name: 'exact transformations: q(x+1) = (1 − e^{−2q})/2 and Z(x+1) = 1 + coth(1/Z)'
      - name: C_T = lim Φ(Z(n)) − n is stable (n = 2500 … 20000)
      - name: asymptotics Z(n) = n + (1/3) log n + C_T + O(log n / n)
      - name: Fatou coordinate independent of the iteration depth (N = 1000 vs 3000)
      - name: 'fractional sum: S(3/2) − S(1/2) = T(3/2)'
      - name: 'fractional sum at an integer argument: S(3) = T(1) + T(2) + T(3)'
      - name: regularized series Σ_k [T(k) − e + 2e/k] with tail stable (10⁴ vs 2·10⁴ terms)
      - name: 'digamma decomposition: S(x) = e x − 2e(ψ(x+1)+γ) + Σ_k[T(k) − e + 2e/k] − 2e((log x + 1)/3 + C_T)/x + …'
      - name: T′(n) via the transfer formula = T′ from the Fatou asymptotics (n = 20000)
      - name: Σ_{k≥1} T′(k) converges (T′(k) ≈ 2e/k²)
      - name: C_2 = 1/2 + 1/4 + 1/16 + 1/65536 + … = 0.8125152587890625 + 2^{−65536} + …
      - name: 'above η: C_b − R_b(x) = Σ_m b^{−T(x+m)}, first term dominates (ratio → 1, base 2, x = 1/2, 3/2, 5/2)'
