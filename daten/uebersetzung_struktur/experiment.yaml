      zusammenfassung: 2 − ηₙ decays like n^(−1.47); prediction η₇ ≈ 1.8399 versus Levenstein 2017 ≈ 1.839. TPID 11 (1) holds for n = 4…6; the
        quotients 1.594, 0.9208 do not decide (2).
      pruefungen:
      - name: ηₙ and eₙ increase (n = 3 … 6)
      - name: '2 − ηₙ: local power exponents almost equal (range < 0.02), geometric quotients increase'
      - name: prediction η₇ from the power law matches Levenstein's ≈ 1.839 (|Δ| < 0.002, both exponents)
      - name: Levenstein's η₅ ≈ 1.738 and η₆ ≈ 1.799 agree with the 30-digit values to the stated digits
      - name: 'TPID 11 (1): ηₙ² < e_{n−1} for n = 4, 5, 6'
      - name: 'TPID 11 (2): quotients (ηₙ² − e_{n−1})/(η_{n−1}² − e_{n−2}) — two values, no decision possible'
      - name: 'TPID 11 rewritten: r_n = (4 − e_{n−1})/(4(2−ηₙ) − (2−ηₙ)²) < 1 and decreasing (n = 4, 5, 6)'
      - name: 'self super-root: s(2) = ln2/W(ln2) = 1.559610469462…, s(3) = 1.635078474636… (Robbins 2009); s(3) < η₄'
