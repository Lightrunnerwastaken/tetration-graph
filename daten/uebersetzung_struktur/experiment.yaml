  en:
    titel: Bases with a common fixed point and base change at it
    frage: Which real bases share a fixed point, how do their towers run, and is A_b(T_d(x)) at the common L a straight line without a wave?
    ergebnis:
      zusammenfassung: 'Bases with a common L form families u_k = (Log L + 2πik)/L. Real: e^{π/2+2πk} (L = i), −exp((π/2+2πk)π/W(π)) (L = i·W(π)/π)
        and 8 mixed pairs. At the common L, α_b(T_d(x)) = C1 + C2 x + O(λ_d^x), C2 = log λ_d/log λ_b — no persistent wave; with different L, α_b(T_d)
        becomes constant.'
      pruefungen:
      - name: 'family: u_k = (Log L + 2πik)/L all have the same fixed point L (L = L_e, k = −3…3)'
      - name: multipliers of the family differ by 2πi
      - name: 'real pairs: e^{π/2+2πk} share L = i; −exp((π/2+2πk)π/W(π)) share L = i·W(π)/π'
      - name: mixed pairs (positive and negative real base with the same L) found and recomputed
      - name: 'e^{π/2} ← e^{5π/2} (L = i): α_b(T_d(x)) − (C1 + C2 x) decays like |λ_d|^x (rate 2.06102 vs ln|λ_d| = 2.06102)'
      - name: 'e^{π/2} ← e^{5π/2} (L = i): first correction a1·λ_d^x·w/log λ_b is correct (x ≤ −10)'
      - name: 'e^{π/2} ← e^{5π/2} (L = i): best-fit line on [−12, −8] has slope log λ_d/log λ_b'
      - name: 'e^{π/2} ← e^{−3π/2} (L = i, partner on the left): α_b(T_d(x)) − (C1 + C2 x) decays like |λ_d|^x (rate 1.55019 vs ln|λ_d| = 1.55019)'
      - name: 'e^{π/2} ← e^{−3π/2} (L = i, partner on the left): first correction a1·λ_d^x·w/log λ_b is correct (x ≤ −10)'
      - name: 'e^{π/2} ← e^{−3π/2} (L = i, partner on the left): best-fit line on [−12, −8] has slope log λ_d/log λ_b'
      - name: '√2 ← −√2 (L = 2): α_b(T_d(x)) − (C1 + C2 x) decays like |λ_d|^x (rate 1.84393 vs ln|λ_d| = 1.84393)'
      - name: '√2 ← −√2 (L = 2): first correction a1·λ_d^x·w/log λ_b is correct (x ≤ −10)'
      - name: '√2 ← −√2 (L = 2): best-fit line on [−12, −8] has slope log λ_d/log λ_b'
      - name: 'e ← e^{1−2πi/L_e} (L = L_e): α_b(T_d(x)) − (C1 + C2 x) decays like |λ_d|^x (rate 1.60063 vs ln|λ_d| = 1.60063)'
      - name: 'e ← e^{1−2πi/L_e} (L = L_e): first correction a1·λ_d^x·w/log λ_b is correct (x ≤ −10)'
      - name: 'e ← e^{1−2πi/L_e} (L = L_e): best-fit line on [−12, −8] has slope log λ_d/log λ_b'
      - name: '2.0841 ← -1659.6 (mixed): α_b(T_d(x)) − (C1 + C2 x) decays like |λ_d|^x (rate 2.61797 vs ln|λ_d| = 2.61797)'
      - name: '2.0841 ← -1659.6 (mixed): first correction a1·λ_d^x·w/log λ_b is correct (x ≤ −10)'
      - name: '2.0841 ← -1659.6 (mixed): best-fit line on [−12, −8] has slope log λ_d/log λ_b'
      - name: 'Control test, different fixed points (e^{π/2} versus e): slope decays like |λ_e|^x toward 0 — α_b(T_d(x)) becomes constant, not
          linear'
