# Maschinell geführt (python -m wissen.uebersetzung einlesen …). Englische Fassung je Aussage; quelle_hash = Hash der
# übersetzten deutschen Texte. Nicht von Hand ändern, ausser Fehler in einzelnen Texten – dann `geprueft` anpassen.
- art: experiment
  id: exp.abel_bruchsumme
  quelle_hash: adf29a2c2efc
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Fractional sum of the super-logarithm (base e)
    frage: Does A'' decay like 1/y², does the compensated fractional sum converge, and does γ_A exist?
    ergebnis:
      zusammenfassung: Compensated fractional sum of slog_e converges (A'' = O(1/y²)); S(1/2) = -0.115097609083, γ_A = 0.4951728249; difference
        equation and S'' = −Σ A'' confirmed.
      pruefungen:
      - name: interpolant + reduction A(y) = n + A(lnⁿ y) matches Kneser slog_e at free points (0.37, 2.5, 40)
      - name: normalization A(1) = 0, A(e) = 1, A(0) = −1
      - name: differentiated Abel equation e·A'(e) = A'(1) via both representations; A'(1) = 1/T'(0)
      - name: estimate |A''(y)| ≤ C/y² (y² |A''(y)| bounded and decreasing)
      - name: compensated series converges (N = 1000 vs 4000 with tail correction)
      - name: difference equation S(3/2) − S(1/2) = A(3/2)
      - name: 'integer arguments: S(1) = A(1) = 0, S(2) = A(1) + A(2)'
      - name: S''(x) = −Σ_k A''(k+x) (x = 1/2)
      - name: constant γ_A = lim [Σ_{k≤N} A'(k) − A(N)] exists
- art: experiment
  id: exp.ableitung
  quelle_hash: e80a80435227
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Derivatives and inflection points
    frage: Do chain rule, product formula and the formula for T″ hold for Kneser (e) and regular (√2)? How many inflection points do the curves
      have?
    ergebnis:
      zusammenfassung: 'All derivative identities confirmed for Kneser e to ≤ 1e-20. T_e''(0) = 1.091767351258321, T_e''''(0) = 0.54296642580339.
        Inflection points (Kneser): b=1.5: [''3.986806975''], b=2: [''-0.03024454275''], b=e: [''-0.5217647926''], b=3: [''-0.6038637144''], b=5:
        [''-0.8469203702''], b=10: [''-0.9967056974''], b=100: [''-1.181880344'']. Regular (1<b<η): b=1.2: none, b=1.3: none, b=1.41421: none,
        b=1.44: none.'
      pruefungen:
      - name: chain rule T'(x+1) = ln a·T(x+1)·T'(x) (Kneser e, 6 points x, relative)
      - name: product formula T'(x+n) = (ln a)^n ∏ T(x+k) · T'(x), n = 2, 3
      - name: T'(−1) = T'(0)/ln a
      - name: T'(2) = (ln a)² · a · a^a · T'(0)
      - name: first own version with factor T(x+1)² is WRONG (control test)
      - name: T''(x+1) = ln a·T(x+1)·[ln a·T'(x)² + T''(x)] (relative)
      - name: (ln T)''(x+1) = ln a · T''(x)
      - name: 'Taylor at 0: coefficient 0 is T(0) = 1'
      - name: chain rule for the regular √2 tetration
      - name: 'Kneser b=1.5: exactly one inflection point on (−1.94, 11.86)'
      - name: 'Kneser b=2: exactly one inflection point on (−1.94, 3.4)'
      - name: 'Kneser b=e: exactly one inflection point on (−1.94, 2.26)'
      - name: 'Kneser b=3: exactly one inflection point on (−1.94, 2.08)'
      - name: 'Kneser b=5: exactly one inflection point on (−1.94, 1.54)'
      - name: 'Kneser b=10: exactly one inflection point on (−1.94, 1.18)'
      - name: 'Kneser b=100: exactly one inflection point on (−1.94, 0.7)'
      - name: 'regular b=1.2: no inflection point (concave everywhere) on (−1.9, 8)'
      - name: 'regular b=1.3: no inflection point (concave everywhere) on (−1.9, 8)'
      - name: 'regular b=1.4142: no inflection point (concave everywhere) on (−1.9, 8)'
      - name: 'regular b=1.44: no inflection point (concave everywhere) on (−1.9, 8)'
- art: experiment
  id: exp.ableitungen_vorzeichen
  quelle_hash: 11ba17869008
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Signs of the derivatives of Kneser's tetration T_e
    frage: Are all odd derivatives positive, do the even ones change sign exactly once, and where?
    ergebnis:
      zusammenfassung: 'Odd derivatives up to 25 positive everywhere (20 points); even ones change sign exactly once: x₂ = -0.52176479, x₁₀ =
        -0.185914, x₂₂ = 0.00779022, x₂₆ = 0.0465848; log(x+2) law confirmed.'
      pruefungen:
      - name: all odd derivatives up to order 25 positive at 20 points in [−1.8, 2]
      - name: every even derivative (2 … 26) changes sign exactly once on the grid, from − to +
      - name: x₂ (inflection point) = −0.5218… as gr.beob.wendepunkte
      - name: the sign-change points x_{2n} move to the right
      - name: 'high derivatives follow log(x+2): a_k·k·(−1)^{k+1} → 1 at x0 = −1 (distance like 2^{−k})'
      - name: 'at x0 = 0.5 all derivatives up to order 26 are positive (Levenstein: the first negative one is the 406th)'
- art: experiment
  id: exp.basisableitung
  quelle_hash: cf3c173a21a6
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Derivative with respect to the base and square root at η
    frage: Do the recursion for d/da (a↑↑n), the formula for h′(a) and the square-root law at η hold?
    ergebnis:
      zusammenfassung: Derivative recursion and h'(a) formula confirmed to ≤ 1e-35; (e − h)/√(2e³(η−a)/η) = 0.999998383423 at η−a = 1e-12; next
        order ≈ -1.61658·√(η−a).
      pruefungen:
      - name: recursion for d/da (a↑↑n) = numerical derivative (relative)
      - name: 'Example d/da a^a = a^a (1 + ln a) at a = 2: 4(1 + ln 2)'
      - name: h'(a) = h²/(a(1 − h ln a)) for the infinite tower (5 bases, relative)
      - name: 'square-root law: (e − h(a)) / √(2e³(η−a)/η) → 1'
      - name: deviation from the square-root law decays like √(η − a) (next order)
- art: experiment
  id: exp.bruchsummen
  quelle_hash: 5592fbc94bc6
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Limit formula, fractional sums, fractional product (base √2)
    frage: How fast does the limit formula converge? Does the fractional sum satisfy S(x+1) − S(x) = T(x)? Does the derivative formula with fractional
      product hold only for the regular solution?
    ergebnis:
      zusammenfassung: 'Limit formula: error 5.2e-21 at n = 120, rate ≈ λ; thereafter the rounding error grows (factor 1/λ per step backward).
        Fractional sum S(1/2) = 0.4277749202048676, S(x+1) − S(x) = T(x) exactly. Fractional-product formula for the regular solution to 3.8e-36,
        violated for T∘(id+θ) by 0.0185…0.2.'
      pruefungen:
      - name: 'limit formula: error at n = 120 below 1e-20'
      - name: 'rounding amplification visible: larger at n = 200 than at n = 120 (optimum in between)'
      - name: error rate per step ≈ λ = ln 2
      - name: 'fractional sum: S(1/2 + 1) − S(1/2) = T(1/2)'
      - name: 'fractional sum: S(1) = T(0) = 1, S(2) = 1 + √2'
      - name: 'regular tetration: T''(x+h)/T''(x) = (ln b)^h · fractional product (h = 0.3, 0.5, 1.7)'
      - name: 'control test T∘(id+θ), θ = 0.05·(1−cos 2πx)/2: formula violated (deviation > 1e-3)'
- art: experiment
  id: exp.carleman
  quelle_hash: 4fdb972c33ee
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Intuitive slog vs. Kneser
    frage: Does the truncated Carleman slog converge to Kneser's slog, and how fast?
    ergebnis:
      zusammenfassung: 'Interior points: error 1.7e-5 (n=16) → 9.2e-9 (n=128), ≈ 8.04 digits; decay algebraic ≈ n^-3.81, not geometric. Point
        1.25 near |L_e|: 6.3e-9. Convergence supported, but slow; the 10 digits expected in advance were not reached.'
      pruefungen:
      - name: error (interior points) drops by a factor > 100 from n=16 to n=128
      - name: no stagnation (maximum error drops by ≥ 10 % at every step from n=16 on)
      - name: algebraic decay n^p fits better than geometric e^{−cn}
- art: experiment
  id: exp.cheta
  quelle_hash: e280cabd2e62
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Upper superexponential functions (√2 at 4, cheta at η) and Szekeres' monotonicity
    frage: Does the upper solution at 4 and the Fatou coordinate from above at e, respectively, satisfy the tetration equation with the correct
      values and asymptotes, and is the Abel function of e^u − 1 totally monotone, but a perturbed one not?
    ergebnis:
      zusammenfassung: 'usexp_√2(1/2) = 5.27364736917811 (entire, period 19.2361i); cheta(1/2) = 9.68935067535323, C_ch = -1.25696115887251; cheta(x)
        − e ≈ 2e/|x| as x → −∞. Szekeres: Abel function of e^u − 1 totally monotone up to order 8, perturbation 0.001·sin 2πA violates this at
        u = 0.0025.'
      pruefungen:
      - name: '√2 upper: usexp(0) = 5, usexp(1) = √2⁵, usexp(−1) = log_√2 5'
      - name: '√2 upper: equation usexp(z+1) = √2^usexp(z) also in the complex case (z = 0.3 + 2i)'
      - name: '√2 upper: periodic with 2πi/ln λ₄ (period 19.24 i)'
      - name: '√2 upper: usexp(x) → 4 as x → −∞ (distance at x = −30 like λ₄^x)'
      - name: constant C_ch = lim Φ(Z(cheta(−n))) + n stable (n = 2500 … 20000)
      - name: cheta(−1) = 2e, cheta(0) = e², cheta(1) = e^e (recovered from the Fatou coordinate)
      - name: cheta(1/2) independent of the depth (N = 1000 versus 3000)
      - name: equation cheta(x+1) = η^cheta(x) at x = −0.3
      - name: cheta(x) ≈ e + 2e/|x| as x → −∞
      - name: 'control, lower solution: T_η(1/2) = 1.25715307505…'
      - name: 'Szekeres: A′ > 0, A″ < 0, A‴ > 0, … up to the 8th derivative (u = 0.05 … 10)'
      - name: Abel equation A(e^u − 1) = A(u) + 1 (u = 0.7)
      - name: perturbed Abel function A + 0.001·sin 2πA violates this already at the 2nd derivative (near 0)
- art: experiment
  id: exp.eta_baker
