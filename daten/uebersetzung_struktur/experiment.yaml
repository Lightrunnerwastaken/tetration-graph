  quelle_hash: 97ff0bb95993
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Kobi's equation for towers and the Kneser base derivative
    frage: Does ∂_a y = S(x)∂_x y − S(y) hold for integer heights, and is p = ∂_b slog − S·slog′ constant for Kneser?
    ergebnis:
      zusammenfassung: Kobi's equation holds exactly for integer heights; for Kneser p = ∂_b slog − S·slog′ is periodic with mean -3.15733299588
        (b = 2) and range 0.00057 — so Kneser satisfies it at fractional height only almost.
      pruefungen:
      - name: ∂_a f_n = S(x)·∂_x f_n − S(f_n) for n = 1, 2, 3 (4 bases, 3 points, relative)
      - name: S(a^x) = a^x ln a · S(x) − x·a^(x−1)
      - name: 'p is 1-periodic in slog: p(slog = −1) = p(slog = 0) (b = 2, e)'
      - name: 'Kneser: p almost constant, but not constant — range small compared with the mean, yet far above the computational precision'
