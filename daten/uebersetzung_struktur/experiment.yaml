        0.00034 at N = 32; s=3/10, p=2 (polynomial, x0 = 0.7): 1.0 at N = 32; s=1/2, p=1/2 (x0 on the boundary): 0.23 at N = 32; s=3/10, p=1/2
        (x0 outside): 0.42 at N = 32'
      pruefungen:
      - name: 'TPID 3, s=3/4, p=2/3 (attracting, x0 inside the circle): distance to 1, p, p², p³ decreases and is below 10⁻³ at N = 32'
      - name: 'TPID 3, s=3/4, p=3/2 (repelling, x0 inside the circle): distance to 1, p, p², p³ decreases and is below 10⁻³ at N = 32'
      - name: 'Counterexample candidate s=3/10, p=2 (polynomial, x0 = 0.7): no eigenvalue near p = 2, largest modulus ≈ 1 (spectrum of the superattracting
          fixed point −s)'
      - name: 'Borderline case s=1/2, p=1/2 (x0 on the boundary): no approach up to N = 32 (distance stays > 0.1) — fixed point 1 − s not in the
          circle of convergence |x| < s'
      - name: 'Borderline case s=3/10, p=1/2 (x0 outside): no approach up to N = 32 (distance stays > 0.1) — fixed point 1 − s not in the circle
          of convergence |x| < s'
