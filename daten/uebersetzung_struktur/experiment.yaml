  id: exp.koenigs_kalkuel
  quelle_hash: 778bd8036a42
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Koenigs calculus, value-side and quasiconformal base change
    frage: Do the spectral series, Lambert fractional sum, derivative/integral/shift calculus, the power law T_b∘A_d, the Jacobian formula and
      the quasiconformal base change hold?
    ergebnis:
      zusammenfassung: Spectral series, derivative, integral and shift calculus and Lambert fractional sum confirmed for √2. K = T_√2∘A_1.3 is
        in Koenigs coordinates the power ρ = 0.38495759 (branching exponent measured 0.38495759); Jacobian formula via fractional sums confirmed.
        Quasiconformal base change conjugates, but is holomorphic only for equal multiplier. Normal form e^w + κ confirmed.
      pruefungen:
      - name: 'spectral series: a + Σ c_n λ^{nx} = regular tetration (x = 6, 9)'
      - name: 'differentiating ↔ factor n·log λ: spectral T′(6) = 1/slog′(T(6))'
      - name: c₂ = ln b·c₁²/(2(λ − 1)) (formula of the synthesis)
      - name: 'shift sum ↔ 1/(1 − λ^n): Σ_k T′(6+k) via transfer formula = Lambert series'
      - name: fractional sum in Lambert form = direct fractional sum (x = 6, h = 1/2)
      - name: 'integrating ↔ 1/(n log λ): ∫_6^∞ (T − a) dt = −Σ c_n λ^{6n}/(n log λ)'
      - name: 'value-side: χ_√2(K(y)) = χ_1.3(y)^ρ with ρ = log λ_b/log λ_d = 0.38495759'
      - name: 'branching at the repelling fixed point: K(y) − a_b ≈ C·(a_d − y)^ρ'
      - name: 'Jacobian formula: log K′ changes by h·log(ln b/ln d) + ln b·Σ_b − ln d·Σ_d'
      - name: 'quasiconformal: K ∘ f_d = f_b ∘ K (return maps conjugate, time preserved)'
      - name: 'obstruction: K is not holomorphic (∂K/∂z̄ ≠ 0), but holomorphic for equal multiplier'
      - name: 'normal form: H(z) = cz + κ conjugates e^{cz} to e^w + κ, and H(1) = E_κ(κ) (tower = singular orbit)'
