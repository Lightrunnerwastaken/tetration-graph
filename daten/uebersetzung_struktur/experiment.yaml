  en:
    titel: TPID 3 — eigenvalues of truncated Carleman matrices of (x+s)^p − s, with borderline cases
    frage: Do the eigenvalues tend to 1, p, p², …, as TPID 3 conjectures — and also when the fixed point 1 − s lies outside the circle of convergence
      of the expansion around 0?
