- art: experiment
  id: exp.forum_formeln
  quelle_hash: 99cadd20c23c
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Fixed-point sums, Newton series, tower series in ln x and i^i^i^…
    frage: Are four formulas from the Tetration Forum correct?
    ergebnis:
      zusammenfassung: Fox's rational fixed-point sums follow from (e^z−1)/(e^z−z); the Newton series of the integer iterates hits the regular
        tetration; x↑↑n agrees with the infinite tower up to (ln x)^n; i^i^i^… = 0.43828 + 0.36059i.
      pruefungen:
      - name: Fox's numerators = −(m−1)!·[z^(m−1)] (e^z−1)/(e^z−z) for m = 2 … 11
      - name: Σ L_k^(−m) over 8000 fixed points hits −1, −1/2, 1/3, 3/8, −1/20 up to the tail (error < tail size)
      - name: Newton series of the integer iterates at h = ½ → regular √2 tetration (distance decreases with N)
      - name: x↑↑n and the infinite tower h(ln x) agree exactly up to (ln x)^n, no longer from (ln x)^(n+1) on (n = 1 … 7)
      - name: i^i^i^… = (2i/π)·W(−iπ/2) = 0.4382829… + 0.3605924…i; multiplier |λ| < 1, iteration converges
