  id: exp.tetra_euler
  quelle_hash: df7788b33443
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: η₄ and e₄ — contact of T_b with y = x, three characterizations
    frage: For which base does Kneser's tetration touch the line y = x, where, and do the number of fixed points, the self tetra-root and the
      convergence of the infinite pentation coincide there?
    ergebnis:
      zusammenfassung: η₄ = 1.635324496715276399345345, e₄ = 3.088532271806717654482181 (Levenstein 2010 confirmed); number of fixed points 3
        → 1 at η₄; 1.6↑↑↑∞ = 2.26438440348, 1.7↑↑↑n diverges; self tetra-root maximal at e₄.
      pruefungen:
      - name: η₄ as in Levenstein (2010, 32 digits) to 1e-28
      - name: e₄ as in Levenstein to 1e-26
      - name: 'contact: T(e₄) = e₄, T''(e₄) = 1, T''''(e₄) > 0'
      - name: 'negative fixed point at η₄: L = −1.64087257571659… with multiplier 4.80600575430175… (Levenstein)'
      - name: three real fixed points for η < b < η₄ (1.5, 1.6), one for b > η₄ (1.7, 2, e)
      - name: 'near η₄: minimum of T_b(x) − x negative for η₄ − 10⁻⁴ (two intersections at e₄), positive for η₄ + 10⁻⁴ (none)'
      - name: self tetra-root b(y) (T_b(y) = y) is smaller than η₄ for y ≠ e₄ — maximum η₄ at e₄
      - name: 'b = 1.6 < η₄: 1.6↑↑↑n increases monotonically to the lower positive fixed point (attracting, T'' < 1)'
      - name: 'b = 1.7 > η₄: 1.7↑↑↑n grows past e₄ beyond 5 (thereafter T_b(x) > x without intersection → unbounded)'
      - name: 'below η (base √2, regular): positive fixed point of T attracting, √2↑↑↑∞ converges there'
