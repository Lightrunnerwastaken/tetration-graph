  en:
    titel: TPID 10 and 11 at the terms η₃ … η₆ — distance law and comparison with Levenstein 2017
    frage: Do 2 − ηₙ and 4 − eₙ decay by a power law, does its extrapolation hit Levenstein's η₇ ≈ 1.839, and does tommy1729's inequality ηₙ²
      < e_{n−1} hold?
