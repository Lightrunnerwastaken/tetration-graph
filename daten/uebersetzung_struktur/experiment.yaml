  id: exp.superwurzel
  quelle_hash: f765f1672515
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    titel: Super-roots — square, third, infinite
    frage: Does e^{W(ln x)} solve y^y = x, how many real solutions are there, is the series around 1 correct, does the iteration for the third
      super-root converge, and when is y^{1/y} the base of a tower converging to y?
    ergebnis:
      zusammenfassung: 'ssrt(2) = 1.55961046946, ssrt(10) = 2.50618414559; series around 1 confirmed; number of solutions 0/2/1; third super-root
        of 2: 1.47668433736; infinite super-root = y^(1/y) exactly on [1/e, e].'
      pruefungen:
      - name: ssrt(x) = e^{W(ln x)} solves y^y = x (6 values)
      - name: equivalent form ln x / W(ln x)
      - name: 'integer cases: ssrt(4) = 2, ssrt(27) = 3'
      - name: 'number of solutions: none below e^{−1/e}, two in (e^{−1/e}, 1), one above 1'
      - name: the two solutions for x = 0.8 are e^{W₀(ln x)} and e^{W₋₁(ln x)}, both in (0, 1)
      - name: 'series around 1: 1 + (x−1) − (x−1)² + 3/2 (x−1)³ − 17/6 (x−1)⁴ + 37/6 − 1759/120 + 13279/360 …'
      - name: 'third super-root: iteration y ← e^{W(W(y ln Y))} converges and solves y^{y^y} = Y'
      - name: tower of y^{1/y} converges to y for 1/e ≤ y ≤ e (y = 0.5, 1.5, 2, 2.6)
      - name: 'outside (y = 3): tower of 3^{1/3} tends to the lower fixed point 2.4780…, not to 3'
      - name: y ↦ y^{1/y} is strictly increasing on [1/e, e] (inverse of the infinite tower)
