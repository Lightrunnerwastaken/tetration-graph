  geprueft: nein
  en:
    name: Classical transcendence
    verlauf: Hermite–Lindemann, Gelfond–Schneider, Schanuel; even e^e is open. The reciprocal sum of a tower of integers is a Liouville number;
      the one for base e is open.
- art: strang
