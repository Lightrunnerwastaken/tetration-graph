  en:
    name: Fractional ranks — a hyperoperation between power and tetration?
    verlauf: The half step is a fractional iteration of an operator on functions. Exact in the linear model, holomorphic in second order; two
      obvious shortcuts fail. The rank coordinate Φ is computable (Abel equation exact, existence numerical); Φ = 3.5 fixes the ladder above it,
      not the half rank itself.
- art: strang
  id: kn.hoehere_stufen
  quelle_hash: 2a079653c8b2
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    name: Higher levels — pentation
    verlauf: Tetration has a fixed point at −1.85; iterated regularly there it gives pentation, one level higher hexation (regular up to η₅, above
      that Kneser-like and, unlike Kneser's tetration, branched in the upper half-plane; touching base η₆ = 1.7991). Above η and e lie η₄, e₄
      and η₅, e₅ — do they tend to 2 and 4?
- art: strang
  id: kn.konstruktion
  quelle_hash: 5789b398b74e
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    name: Kneser's construction
    verlauf: Regular at the complex fixed point is not real; a Riemann mapping corrects this; high-precision values.
- art: strang
  id: kn.naeherung
  quelle_hash: 18dd70557973
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    name: Computing it yourself
    verlauf: A polynomial on [−1, 0] and the functional equation are enough for Desmos; the table says how accurate each polynomial is.
- art: strang
  id: kn.raenge_basis
  quelle_hash: 5e72f362683a
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    name: The hierarchy as a function of the base
    verlauf: To the left of zero the ranks alternate (a pole and a fixed point at even ones, none at odd ones); only the odd limit bases η₃, η₅,
      … are break points — at η₄ pentation is analytic, at η₅ hexation jumps by a periodic height shift θ ~ 10⁻⁵.
- art: strang
  id: kn.rand
  quelle_hash: 3cff7a023dbc
  herkunft:
    modell: sonnet
    datum: '2026-10-12'
  geprueft: nein
  en:
    name: Singularity at −2
    verlauf: Every solution behaves like log_b(x+2); differentiability at the point −1 suffices for this.
- art: strang
  id: kn.riemannflaeche
  quelle_hash: ffe2b4769ff3
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    name: Riemann surfaces of sexp and slog
    verlauf: The surface of sexp is a full logarithmic covering of its own shift; it is branched exactly over the points whose tower lands on
      that of a negative integer — dense in ℂ, but countable. The surface of slog leads, via a 2πi-periodic sheet and the exact monodromy around
      L, to the three base points L, L̄, 0 and an equally dense, exp-invariant branch set.
- art: strang
  id: kn.singularitaeten
  quelle_hash: 523c2e2819c6
  herkunft:
    modell: sonnet
    datum: '2026-10-18'
  geprueft: nein
  en:
    name: Cuts and Taylor coefficients of sexp
    verlauf: The logarithm at −2 is removable down to −3; from this follow the Taylor signs (c₂₂ < 0), the range of values and infinitely many
      branch points on side sheets.
- art: strang
  id: kn.stoerung
  quelle_hash: 0fc273a93fdb
  herkunft:
    modell: sonnet
    datum: '2026-10-14'
  geprueft: nein
  en:
    name: Tetration as a perturbation of eˣ − 1
    verlauf: One bends eˣ − 1 into eˣ and expands in the bending parameter; each order is a polynomial in the height. The series diverges, and
      the best truncation lies 2·10⁻⁷ away from Kneser.
- art: strang
  id: kn.theta
  quelle_hash: 96aba651244f
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    name: Measuring Kneser's wave θ precisely
    verlauf: Kneser's solution is the regular solution at the complex fixed point plus a wave θ; it is singular exactly at the integers, with
      infinitely many sheets, and its Fourier coefficients follow a closed formula with exponent 1. Its phase is the phase of 1 + θ′ at the real
      point 1/(2πn) and repeats at the edges of the periods in iterated logarithms. The branch choice behind this is certified with interval arithmetic
      (base e and 2); one engine assumption with tolerance 0.027 remains.
- art: strang
  id: kn.theta_komplex
  quelle_hash: 59be14c0e977
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    name: Kneser's wave for complex bases
    verlauf: For complex bases the singularity at the integers and the coefficient law remain, above and below with a constant of their own; near
      the Shell–Thron boundary, in a bud, a new singularity appears just above the axis, over the orbit value sexp(4).
- art: strang
  id: kn.theta_raenge
  quelle_hash: 4bf25675c3d9
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    name: Kneser's wave on all ranks
    verlauf: On even ranks the wave is singular where the Kneser solution hits the fixed point two levels lower, with exponent ln λᵣ₋₄ / ln λᵣ₋₂
      (derived up to the choice of branch, checked up to rank 10); at an attracting fixed point (rank 5) it ends at a natural boundary, the edge
      of the basin.
