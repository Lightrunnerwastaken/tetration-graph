    datum: '2026-10-18'
  geprueft: nein
  en:
    name: Towers modulo k and p-adic
    verlauf: Residues of towers become constant, n^n modulo k is periodic, p-adically every tower converges — to a Lambert series in log_p a,
      with exactly V·(H − t) finished digits and a Koenigs constant for the next ones; from rank 4 on no p-adic continuation in the height; the
      exponential factorial has the period Λ̃(m).
