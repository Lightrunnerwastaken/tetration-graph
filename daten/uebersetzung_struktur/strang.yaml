- art: strang
  id: ar.gleichung
  quelle_hash: b7d2acac0953
  herkunft:
    modell: sonnet
    datum: '2026-10-25'
  geprueft: nein
  en:
    name: What the equation forces
    verlauf: Of two neighboring values, one is transcendental, and likewise of two neighboring slopes (T′(1) = e·T′(0)); the real equation fixes
      neither T(½) nor T′(0); “Schanuel ⇒ transcendental for all solutions” is equivalent to ¬Schanuel; and almost everywhere everything is transcendental.
