# Forschungsstränge des Gebiets br: Untergruppen mit einer Zeile, was dort passiert (sichtbar auf der mittleren Zoomstufe der Karte).
# Jede Aussage gehört höchstens einem Strang an. Neue Stränge dürfen auch in eigenen Dateien daten/straenge/<name>.yaml stehen.

- id: br.logik
  gebiet: br
  name: Logik und Wachstum
  verlauf: Tetration sprengt ℝ_an,exp und die elementaren Funktionen; ob eine o-minimale Struktur sie fassen kann, ist offen.
  mitglieder: [br.satz.vdd_miller, br.satz.nicht_definierbar, br.satz.boshernitzan, br.frage.kneser_hardy, br.frage.transexp, br.satz.kalmar, br.def.hyperoperation, br.satz.ackermann, br.satz.ordinal_tetration, br.satz.hyperop_varianten, br.satz.halbexp_komplexitaet]
- id: br.kreis
  gebiet: br
  name: Kreis und Fourier
  verlauf: Flächenidentität, konjugierte Funktionen, Gevrey-Kennzeichnung — Werkzeuge der Basiswechsel-Serie.
  mitglieder: [br.satz.young_kreis, br.gescheitert.rotationszahl, br.satz.privalov, br.satz.gevrey_fourier]
- id: br.engpass
  gebiet: br
  name: Engpass bei η
  verlauf: Sattel-Knoten-Durchgang erklärt das Randgesetz und die TPID-6-Rate; gestörte Fatou-Koordinaten (Lavaurs, Shishikura) könnten beides beweisen.
  mitglieder: [br.satz.sattel_knoten, br.frage.implosion, br.satz.shishikura]
- id: br.diskret
  gebiet: br
  name: Türme modulo m
  verlauf: Endziffern werden stabil; die Kongruenzgeschwindigkeit folgt p-adischen Bewertungen.
  mitglieder: [br.satz.turm_mod_m, br.satz.ripa]
- id: br.reell
  gebiet: br
  name: Reelle Kennzeichnung?
  verlauf: Gibt es ein Bohr–Mollerup für Tetration? Eine reelle, aber nichtlokale Kennzeichnung gibt es (Defekt E = 0); keine endliche Liste von Integralformeln reicht; lokal kennzeichnet der Taylor-Radius x+2 an jeder Stelle genau die Halbebenen-Holomorphie — ob diese schon Kneser erzwingt, ist offen.
  mitglieder: [br.frage.bohr_mollerup, br.satz.reelle_kennzeichnung, br.satz.endlich_viele_reichen_nicht, br.satz.taylorradius_halbebene, br.satz.ungerade_ableitungen_halbebene, br.satz.lokal_genau_dann_halbebene, br.frage.halbebene_eindeutigkeit, br.satz.slog_nie_total_monoton, br.satz.endliche_vorzeichen_offen, br.beob.verbiegungen_singularitaeten, br.beob.kneser_ungerade_99, br.beob.kneser_logkonvex]
- id: br.halbebene
  gebiet: br
  name: 'Q*: erzwingt die Halbebene schon Kneser?'
  verlauf: Was bei i∞ fehlt, ist genau benannt (p_T eindeutig und langsamer als e^(2π Im z)); echte Verbiegungen müssen die obere Halbebene verlassen, ihre Enden sind klassifiziert — offen bleibt vor allem ein „vertauschtes Kneser“.
  mitglieder: [br.satz.halbebene_liouville_scharf, br.satz.schroeder_kugel_genuegt, br.satz.enden_klassifikation, br.satz.verbiegung_schwarz, br.lem.zungen_bis_unendlich, br.beob.hauptblatt_singularitaet_trig, br.verm.verbiegung_hauptblatt, br.kor.nebenblatt_minus2_regulaer, br.frage.vertauschtes_kneser]
- id: br.momente
  gebiet: br
  name: Die Momentenfamilie
  verlauf: Die Momente sind eine Cauchy-Transformierte; ist die Wellenkurve doppelpunktfrei, erzwingen sie Kneser (Skizze), ausdrücklich für 0.77 < φ′ < 1.43; die alten Doppelgänger haben einen Doppelpunkt, und dieser Fall ist offen.
  mitglieder: [br.frage.momentenfamilie, br.satz.momente_cauchy, br.satz.sehnenkriterium, br.beob.kneser_kurve_sehnen, br.satz.momente_jordan, br.kor.momente_umgebung, br.beob.gegenbeispiel_doppelpunkt, br.frage.momente_doppelpunkt]
- id: br.verwandte
  gebiet: br
  name: Verwandte Funktionen
  verlauf: Produkt-Tetration lebt an einem parabolischen Fixpunkt; Exponentialfakultät und Produkt-Tetration werden mit demselben Grenzwert-Trick fortgesetzt.
  mitglieder: [br.def.produkt_tetration, br.satz.produkt_parabolisch, br.beob.produkt_tetration_werte, br.beob.produkt_iteration_dreieck, br.satz.vergleichsfunktion, br.frage.verwandte_funktionen, br.satz.produkt_iteration_ketten]
- id: br.wirkungen
  gebiet: br
  name: Iteration als Wirkung
  verlauf: Höhen aus einem beliebigen Zahlbereich; Superfunktionen als verträgliche Abbildungen; eine Leiter bis zu Hyperoperationen beliebigen Rangs.
  mitglieder: [br.def.iteration_wirkung, br.frage.iterationsleiter]
- id: br.boettcher
  gebiet: br
  name: Zwei natürliche Superfunktionen
  verlauf: Polynome haben neben Kneser eine Böttcher-Superfunktion von ∞ her; verschieden, aber nur um 10⁻⁷.
  mitglieder: [br.satz.boettcher_nicht_kneser, br.beob.boettcher_kneser_abstand]
- id: br.klammerungen
  gebiet: br
  name: Andere Klammerungen — linke und ausgewogene Hyperoperationen
  verlauf: Im Logarithmus sind ausgewogene Tetration und linke Pentation die Iteration von m·eᵐ (wie die Produkt-Tetration); der parabolische Fixpunkt gibt gebrochene Höhen ohne Kneser, und die linken Ränge unterscheiden sich nur im iterativen Residuum.
  mitglieder: [br.satz.klammerung_log_reduktion, br.kor.linke_pentation_ausgewogen, br.satz.klammerung_fortsetzung, br.beob.klammerung_werte, br.satz.linke_raenge_keim, br.kor.linke_varianten_nicht_eta, br.beob.ausgewogene_raenge_entartung]
