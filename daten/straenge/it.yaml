# Forschungsstränge des Gebiets it: Untergruppen mit einer Zeile, was dort passiert (sichtbar auf der mittleren Zoomstufe der Karte).
# Jede Aussage gehört höchstens einem Strang an. Neue Stränge dürfen auch in eigenen Dateien daten/straenge/<name>.yaml stehen.

- id: it.hyperbolisch
  gebiet: it
  name: Hyperbolische und superanziehende Fixpunkte
  verlauf: Koenigs linearisiert, Böttcher macht superanziehende Punkte zu Potenzen; die reguläre Iteration ist die einzige am Fixpunkt holomorphe, und an zwei Fixpunkten stimmen die beiden nur bei Möbius überein (Karlin–McGregor).
  mitglieder: [it.satz.koenigs, it.satz.vertauschbar, it.lem.julia, it.satz.moebius_iteration, it.satz.elementare_superfunktionen, it.satz.karlin_mcgregor, it.satz.boettcher, it.satz.sternberg_reell]
- id: it.parabolisch
  gebiet: it
  name: Parabolische Fixpunkte
  verlauf: Fatou-Koordinaten existieren, aber formale Iterierte divergieren (Baker) und nur Möbius-Abbildungen sind einbettbar; Écalle–Voronin misst die Hindernisse; Bahnen laufen nur wie 1/n hinein; Lévy und Szekeres bauen daraus die gebrochene Iteration von eˣ.
  mitglieder: [it.satz.leau_fatou, it.satz.ecalle_voronin, it.satz.szekeres, it.satz.baker, it.satz.erdos_jabotinsky, it.satz.szekeres_monoton, it.satz.moebius_familie, it.satz.parabolische_rate, it.satz.baker_einbettung, it.konstr.levy, it.satz.zeta_polynom_partitionen]
- id: it.indifferent
  gebiet: it
  name: Irrational indifferente Fixpunkte
  verlauf: Bei Drehzahlen, die extrem gut durch Brüche annäherbar sind, gibt es keine Linearisierung (Cremer); sonst Siegel-Scheiben (fp.satz.neutral).
  mitglieder: [it.satz.cremer]
