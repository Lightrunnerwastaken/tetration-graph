# Forschungsstränge des Gebiets it: Untergruppen mit einer Zeile, was dort passiert (sichtbar auf der mittleren Zoomstufe der Karte).
# Jede Aussage gehört höchstens einem Strang an. Neue Stränge dürfen auch in eigenen Dateien daten/straenge/<name>.yaml stehen.

- id: it.hyperbolisch
  gebiet: it
  name: Hyperbolische und superanziehende Fixpunkte
  verlauf: Koenigs linearisiert, Böttcher macht superanziehende Punkte zu Potenzen; die reguläre Iteration ist die einzige am Fixpunkt holomorphe, und an zwei Fixpunkten stimmen die beiden nur bei Möbius überein (Karlin–McGregor).
  mitglieder: [it.satz.koenigs, it.satz.vertauschbar, it.lem.julia, it.satz.moebius_iteration, it.satz.elementare_superfunktionen, it.satz.karlin_mcgregor, it.satz.boettcher, it.satz.sternberg_reell, it.satz.poincare_polynom_surjektiv]
- id: it.parabolisch
  gebiet: it
  name: Parabolische Fixpunkte
  verlauf: Fatou-Koordinaten existieren, aber formale Iterierte divergieren (Baker) und nur Möbius-Abbildungen sind einbettbar; Écalle–Voronin misst die Hindernisse; Bahnen laufen nur wie 1/n hinein; Lévy und Szekeres bauen daraus die gebrochene Iteration von eˣ. Auch die formale Halbiterierte von m·eᵐ divergiert (numerisch).
  mitglieder: [it.satz.leau_fatou, it.satz.ecalle_voronin, it.satz.szekeres, it.satz.baker, it.satz.erdos_jabotinsky, it.satz.szekeres_monoton, it.satz.moebius_familie, it.satz.parabolische_rate, it.satz.baker_einbettung, it.konstr.levy, it.satz.zeta_polynom_partitionen, it.gescheitert.pentation_baeume, it.verm.mexp_halbiterierte_divergent]
- id: it.indifferent
  gebiet: it
  name: Irrational indifferente Fixpunkte
  verlauf: Bei Drehzahlen, die extrem gut durch Brüche annäherbar sind, gibt es keine Linearisierung (Cremer); sonst Siegel-Scheiben (fp.satz.neutral).
  mitglieder: [it.satz.cremer]
- id: it.erzeuger
  gebiet: it
  name: Der Erzeuger — Tetration als Strömung
  verlauf: 'Die Julia-Gleichung ist linear: kein ganzer Erzeuger, Starrheit am Fixpunkt, zwei Fixpunkte nur bei Resonanz; Knesers Feld ist an L genau C⁵. Der reguläre Erzeuger lebt auf der u-Ebene; seine Monodromie ist ein Zählwerk (IMG(exp) = ℤ≀ℤ≀…), jede Verzweigung ist logarithmisch.'
  mitglieder: [it.satz.kein_ganzer_erzeuger, it.lem.erzeuger_starr, it.satz.erzeuger_resonanz, it.satz.kneser_erzeuger, it.satz.regulaerer_erzeuger_fortsetzung, it.satz.julia_variation_bernoulli, it.kor.poincare_exp_ableitung_produkt, it.satz.erzeuger_riemannflaeche, it.satz.erzeuger_kranzrekursion, it.kor.erzeuger_verzweigung_logarithmisch, it.satz.erzeuger_monodromiegruppe, it.kor.erzeuger_umlaufwerte, it.kor.kneser_erzeuger_sigma, it.satz.regulaere_slog_riemannflaeche, it.satz.erzeuger_monodromie_basen]
