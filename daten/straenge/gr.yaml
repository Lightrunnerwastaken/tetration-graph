# Forschungsstränge des Gebiets gr: Untergruppen mit einer Zeile, was dort passiert (sichtbar auf der mittleren Zoomstufe der Karte).
# Jede Aussage gehört höchstens einem Strang an. Neue Stränge dürfen auch in eigenen Dateien daten/straenge/<name>.yaml stehen.

- id: gr.werte
  gebiet: gr
  name: Werte und Grössen
  verlauf: Was a↑↑n ist, wie viele Stellen es hat, und warum x^x bei 1/e am kleinsten ist (dort steckt schon η).
  mitglieder: [gr.def.turm, gr.satz.stellen, gr.satz.selbstpotenz, gr.satz.gestalt, gr.satz.kehrwert_turmsumme, gr.satz.grenzfaelle]
- id: gr.ableitung
  gebiet: gr
  name: Ableitungen
  verlauf: Eine Kettenregel erzeugt alles — Produktformel über ganze Schritte, ein einziger freier Wert T′(0), Konvexität vererbt sich nach oben.
  mitglieder: [gr.satz.kettenregel, gr.kor.produktformel, gr.kor.ganze_stellen, gr.satz.vorzeichen, gr.satz.zweite_ableitung, gr.kor.konvex_nach_oben, gr.satz.abklingen]
- id: gr.kurve
  gebiet: gr
  name: Gestalt der Kurve
  verlauf: Kneser-Kurven haben genau einen Wendepunkt, reguläre unter η keinen; ungerade Ableitungen scheinen überall positiv, und T(y)·T(−y) < 1 hält bis zur Basis 10.22.
  mitglieder: [gr.beob.kneser_ableitung, gr.beob.wendepunkte, gr.verm.ein_wendepunkt, gr.verm.tpid7, gr.gegen.tpid7_kneser, gr.verm.ungerade_ableitungen]
- id: gr.integrale
  gebiet: gr
  name: Integrale
  verlauf: Fläche unter T plus Fläche neben slog ergibt ein Rechteck; daraus folgen viele gleichwertige Formen.
  mitglieder: [gr.satz.young, gr.kor.integral_formen, gr.satz.integral_unten, gr.satz.integral_produkt, gr.satz.integral_log, gr.beob.integrale_kneser, gr.frage.integral_form, gr.beob.integral_halb]
- id: gr.basis
  gebiet: gr
  name: Ableitung nach der Basis
  verlauf: Bei ganzer Höhe eine einfache Rekursion; am unendlichen Turm eine Quadratwurzel bei η — dieselbe wie im Randgesetz der Forschung.
  mitglieder: [gr.satz.basis_ganz, gr.satz.basis_gleichung, gr.satz.turm_pde, gr.beob.kneser_pde_wackeln, gr.satz.turm_ableitung, gr.satz.wurzel_eta, gr.kor.basis_summe, gr.satz.omega_ableitung, gr.korr.grenzidentitaet]
- id: gr.turmintegrale
  gebiet: gr
  name: Turm-Integrale
  verlauf: Von ∫x^x (Bernoulli) zu ∫ⁿx — gerade und ungerade Höhen haben verschiedene Grenzwerte, die Lücke ist die Fläche zwischen den Ästen des 2-Zyklus.
  mitglieder: [gr.satz.sophomore, gr.satz.turmintegral_grenzen, gr.kor.turmintegral_formen, gr.verm.turmintegral_rate, gr.satz.turmintegral_periodisch]
- id: gr.slog
  gebiet: gr
  name: Superlogarithmus
  verlauf: slog zählt, wie oft man logarithmieren muss — stetig gemacht; seine Ableitung ist der Kehrwert von T′.
  mitglieder: [gr.satz.slog_grund, gr.satz.logstern, gr.satz.slog_ableitung, gr.satz.ln_aus_steigungen, gr.satz.slog_steigung_langsam]
- id: gr.umkehrungen
  gebiet: gr
  name: Umkehrungen — Superwurzeln
  verlauf: Welche Zahl hoch sich selbst gibt x? Lambert W antwortet geschlossen, für den Dreierturm zweimal W als Fixpunkt.
  mitglieder: [gr.satz.superwurzel, gr.satz.superwurzel_dritte, gr.def.epsilon_omega, gr.satz.superwurzel_omega, gr.satz.turm_superwurzel]
- id: gr.identitaeten
  gebiet: gr
  name: Identitäten — was fest ist, was frei ist
  verlauf: Tauschregel, Taylor-Leiter und Stufenleiter gelten für jede Tetration; fest ist nur, was ganze Schritte verbindet — und slog zählt Exponentiale.
  mitglieder: [gr.satz.tauschregel, gr.satz.taylor_leiter, gr.satz.stufenleiter, gr.satz.frei_und_fest, gr.satz.exponentialitaet]
