# Forschungsstränge des Gebiets ar: Untergruppen mit einer Zeile, was dort passiert (sichtbar auf der mittleren Zoomstufe der Karte).
# Jede Aussage gehört höchstens einem Strang an. Neue Stränge dürfen auch in eigenen Dateien daten/straenge/<name>.yaml stehen.

- id: ar.klassisch
  gebiet: ar
  name: Klassische Transzendenz
  verlauf: Hermite–Lindemann, Gelfond–Schneider, Schanuel; schon e^e ist offen.
  mitglieder: [ar.satz.hermite_lindemann, ar.satz.gelfond_schneider, ar.verm.schanuel, ar.frage.e_hoch_e, ar.satz.superwurzel_arith, ar.satz.rationale_tuerme, ar.frage.ganze_tuerme, ar.satz.ef_liouville, ar.frage.ef_fortsetzung, ar.konstr.ef_sexp, ar.satz.ef_null_ableitung, ar.verm.gelfond_turm, ar.satz.ssc_gelfond, ar.satz.sondow_marques_xx, ar.satz.liouville_tuerme, ar.satz.unendliche_tuerme_gs]
- id: ar.gleichung
  gebiet: ar
  name: Was die Gleichung erzwingt
  verlauf: Von zwei Nachbarwerten ist einer transzendent; die reelle Gleichung allein trägt keine Arithmetik.
  mitglieder: [ar.satz.orbitschranke, ar.kor.benachbart, ar.satz.schanuel_orbit, ar.satz.algebraische_basen, ar.satz.keine_arith_info]
- id: ar.zaehlen
  gebiet: ar
  name: Zählen auf dem Graphen
  verlauf: Pila–Wilkie gibt H^ε, Massers Methode polylogarithmisch — Konstanten noch nicht ausgeführt.
  mitglieder: [ar.satz.bpw, ar.satz.pila, ar.lem.nullstellen, ar.satz.masser_typ]
- id: ar.ks
  gebiet: ar
  name: Kneser–Schanuel
  verlauf: Funktional trivial wahr, arithmetisch eine Vermutung; T_e(1/2) ist bis Nenner 10^983 nicht rational.
  mitglieder: [ar.satz.funktional_ks, ar.verm.ks, ar.beob.ausschluss]
- id: ar.kongruenzen
  gebiet: ar
  name: Türme modulo k und p-adisch
  verlauf: Reste von Türmen werden konstant, n^n modulo k ist periodisch, p-adisch konvergiert jeder Turm — gegen eine Lambert-Reihe in log_p a, mit genau V·(H − t) fertigen Ziffern und einer Koenigs-Konstante für die nächsten; ab Rang 4 keine p-adische Höhen-Fortsetzung; die exponentielle Fakultät hat die Periode Λ̃(m).
  mitglieder: [ar.satz.selbstpotenz_kongruenz, ar.satz.padische_tuerme, ar.satz.padisch_bewertung, ar.kor.padisch_hoehere_raenge, ar.satz.padisch_lambert, ar.satz.padisch_isometrie, ar.satz.padisch_koenigs, ar.satz.pentation_block_konstant, ar.satz.keine_padische_interpolation, ar.satz.ef_periode, ar.konstr.ef_profinit]
- id: ar.identitaeten
  gebiet: ar
  name: Suche nach Formeln
  verlauf: Hochgenaue Kneser-Zahlen gegen klassische Konstanten geprüft — keine Relation mit kleinen Koeffizienten.
  mitglieder: [ar.beob.keine_relationen]
