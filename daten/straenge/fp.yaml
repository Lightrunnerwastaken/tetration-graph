# Forschungsstränge des Gebiets fp: Untergruppen mit einer Zeile, was dort passiert (sichtbar auf der mittleren Zoomstufe der Karte).
# Jede Aussage gehört höchstens einem Strang an. Neue Stränge dürfen auch in eigenen Dateien daten/straenge/<name>.yaml stehen.

- id: fp.fixpunkte
  gebiet: fp
  name: Fixpunkte von b^z
  verlauf: Lambert W liefert alle Fixpunkte; die Schwelle η trennt anziehend, parabolisch und abstossend.
  mitglieder: [fp.def.eta, fp.satz.lambert, fp.satz.reelle_fixpunkte, fp.satz.abstossend, fp.satz.fixpunkt_summen]
- id: fp.turm
  gebiet: fp
  name: Unendlicher Turm
  verlauf: Der Turm konvergiert reell von e^{−e} bis e^{1/e}, komplex genau im Shell–Thron-Gebiet (aussen nie, Baker–Rippon), auch mit veränderlichen Basen; umgekehrt gibt y^{1/y} die Basis zum Grenzwert y; ⁿx = n zwingt x gegen η, mit Abstand 10.49/n² aus dem Engpass.
  mitglieder: [fp.satz.turm_reell, fp.satz.shell_thron, fp.verm.knospen, fp.satz.unendliche_superwurzel, fp.satz.tpid6, fp.beob.tpid6_rate, fp.satz.shell_thron_flaeche, fp.satz.turm_reihe_ln, fp.beob.i_turm, fp.satz.nachbar_turm, fp.frage.tpid12_13, fp.satz.baker_rippon_kardioide, fp.satz.thron_variabel]
- id: fp.periode2
  gebiet: fp
  name: Unter der Eulerschen Schranke
  verlauf: Unter e^{−e} springt der Turm zwischen zwei Werten (Barrow; analytische Grenzfunktionen) — die Region hat eine geschlossene Form (Baker–Rippon), ist kein Kreis, an der Spitze gilt √6/e·n^{−1/2}, und die Phase wird zur Rechteckwelle.
  mitglieder: [fp.satz.p2_form, fp.satz.p2_kein_kreis, fp.satz.p2_raten, fp.satz.rechteckwelle, fp.satz.baker_rippon_periodisch, fp.satz.grenzfunktionen]
- id: fp.parameterraum
  gebiet: fp
  name: Regionen der Basen-Ebene
  verlauf: Der Multiplikator ist die Koordinate; innen kommt der Turm zur Ruhe, in den Knospen p/q drehen q-Zyklen, an rationalen Randpunkten parabolisch, an irrationalen Siegel-Scheiben.
  mitglieder: [fp.satz.multiplikator_rezept, fp.satz.parameter_konform, fp.satz.exp_normalform, fp.def.basenklassen, fp.beob.regionen, fp.verm.knospen_drehzahl, fp.satz.parabolisch_rand, fp.satz.neutral, fp.satz.gleiches_L, fp.beob.gleiches_L_kategorien, fp.beob.partner_keil, fp.beob.negative_achse, fp.satz.baker_rippon_parameter, fp.satz.messbare_dynamik, fp.satz.horn_eta]
- id: fp.spiralen_mittel
  gebiet: fp
  name: Spiralen und Mittelwerte
  verlauf: Türme spiralen mit λ; Kreismittel ganzer Höhen sind 1, für Höhe 1/2 nicht (Verzweigung w^t); Siegel-Scheiben des Turms sind unbeschränkt (Herman), der Turm läuft auf ihrem Rand (Rempe) — ob sein Zeitmittel dort der Fixpunkt ist, ist nur noch Skizze.
  mitglieder: [fp.satz.spirale, fp.satz.kreismittel, fp.kor.fourier_taylor, fp.verm.bruch_mittel, fp.gegen.bruch_mittel, fp.frage.holomorphe_familie, fp.verm.doppelmittel, fp.ann.siegel_rand, fp.satz.siegel_unbeschraenkt, fp.satz.siegel_mittel]
- id: fp.zufall
  gebiet: fp
  name: Türme mit zufälligen Basen
  verlauf: Zufall zerstört Eulers Zweierschwingung nicht unter 1, verschmilzt sie aber bei gleichverteilten Basen; über 1 entscheidet die Häufigkeit von Basen nahe 1, vermutlich mit slog-Schwelle.
  mitglieder: [fp.satz.zufallsturm_unter_eins, fp.satz.zufallsturm_divergenz, fp.beob.zufallsturm_verschmelzung, fp.verm.zufallsturm_konvergenz, fp.verm.zufallsturm_slog_schwelle]
