# Forschungsstränge des Gebiets kl: Untergruppen mit einer Zeile, was dort passiert (sichtbar auf der mittleren Zoomstufe der Karte).
# Jede Aussage gehört höchstens einem Strang an. Neue Stränge dürfen auch in eigenen Dateien daten/straenge/<name>.yaml stehen.

- id: kl.regulaer
  gebiet: kl
  name: Reguläre Tetration unter η
  verlauf: Koenigs am anziehenden Fixpunkt gibt die natürliche Lösung, am oberen eine ganze Superfunktion; Reshetnikovs q-Reihe rechnet sie aus den ganzen Werten zurück, und vermutlich ist ihre Ableitung vollständig monoton.
  mitglieder: [kl.satz.regulaer, kl.satz.vier_sqrt2, kl.satz.basis_unter_eins, kl.satz.obere_superexp, kl.beob.q_binomial, kl.verm.vollmonoton, kl.satz.folgen_vollmonoton, kl.satz.newton_reihe, kl.frage.tpid5, kl.satz.carlson, kl.satz.eps0_b_gegen_1]
- id: kl.zwei_abel
  gebiet: kl
  name: Zwei Fixpunkte, zwei Abel-Funktionen
  verlauf: Die Differenz ist periodisch und winzig; ihre Moden fallen wie k^{−5/4}·e^{−2π²k/|ln λ|} — neue, gemessene Vermutung.
  mitglieder: [kl.beob.zwei_abel, kl.verm.streifenbreite, kl.verm.faktor, kl.satz.resonanzbasen, kl.beob.resonanz_abweichung]
- id: kl.eta
  gebiet: kl
  name: Grenzfall η
  verlauf: 'Parabolische Tetration; exp_η ist an e konjugiert zu e^u − 1, also greift Bakers Satz. Bei η passen regulär und Kneser zusammen: Kneser setzt die reguläre Reihe auf 33 Stellen fort; der Defekt ist eine flache Singularität auf der regulären Seite (glatt, nicht analytisch). Knapp über η wächst die Vorwärtssumme der Basisableitung wie (b − η)^(−3/2).'
  mitglieder: [kl.satz.parabolisch, kl.kor.eta_baker, kl.frage.stetig_eta, kl.satz.eta_koordinate, kl.satz.eta_digamma, kl.beob.eta_konstanten, kl.verm.lambert_zeta, kl.satz.moebius_qdigamma, kl.beob.stetig_eta, kl.frage.eta_analytisch, kl.satz.cheta, kl.beob.kneser_fortsetzung_regulaer, kl.beob.eta_taylor, kl.beob.regulaer_flach_singulaer, kl.verm.eta_glatt_nicht_analytisch, kl.satz.c1_noerlund, kl.frage.eta_flacher_rest, kl.satz.kanalgesetz_vorwaertssumme]
- id: kl.bruch
  gebiet: kl
  name: Bruchschritte und Bruchsummen unter η
  verlauf: Weil der Turm gegen a läuft, wird ein halber Schritt dort eine Streckung um √λ; daraus Bruchsummen als Lambert-Reihen und eine Ableitungsformel, die nur die reguläre Lösung erfüllt.
  mitglieder: [kl.satz.grenzwertformel, kl.satz.bruchsumme, kl.satz.bruchprodukt, kl.satz.koenigs_spektral]
- id: kl.gleiches_L
  gebiet: kl
  name: Basiswechsel an Fixpunkten
  verlauf: Wertseitig ist der Basiswechsel eine Potenz, quasikonform eine Gitterabbildung; bei gemeinsamem Fixpunkt L wird der höhenseitige eine Gerade C₁ + C₂·x ohne Welle — mit verschiedenen L läuft der naive Höhenvergleich gegen eine Konstante.
  mitglieder: [kl.satz.basiswechsel_gleiches_L, kl.satz.invariante_daempfung, kl.satz.wertseitiger_basiswechsel, kl.satz.qk_basiswechsel, kl.satz.koenigs_basiswechsel, kl.gescheitert.naiver_basiswechsel, kl.frage.basiswechsel_kneser, kl.frage.gleiches_L_kneser]
