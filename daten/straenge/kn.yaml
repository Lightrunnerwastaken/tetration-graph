# Forschungsstränge des Gebiets kn: Untergruppen mit einer Zeile, was dort passiert (sichtbar auf der mittleren Zoomstufe der Karte).
# Jede Aussage gehört höchstens einem Strang an. Neue Stränge dürfen auch in eigenen Dateien daten/straenge/<name>.yaml stehen.

- id: kn.konstruktion
  gebiet: kn
  name: Knesers Konstruktion
  verlauf: Regulär am komplexen Fixpunkt ist nicht reell; eine Riemann-Abbildung korrigiert das; hochpräzise Werte.
  mitglieder: [kn.gescheitert.regulaer_an_L, kn.konstr.kneser, kn.satz.kneser_eigenschaften, kn.satz.paulsen_komplex, kn.beob.referenzwerte, kn.konstr.cauchy, kn.konstr.paulsen_cowgill_iteration]
- id: kn.eindeutigkeit
  gebiet: kn
  name: Eindeutigkeit
  verlauf: Vertikale Grenzwerte L, L̄ legen die Lösung fest (Paulsen–Cowgill, Trappmann–Kouznetsov).
  mitglieder: [kn.satz.paulsen_cowgill, kn.satz.trappmann_kouznetsov, kn.def.slog, kn.frage.beta_methode, kn.beob.kouznetsov_numerik, kn.satz.tk_kriterien, kn.verm.tk_c2]
- id: kn.rand
  gebiet: kn
  name: Singularität bei −2
  verlauf: Jede Lösung verhält sich wie log_b(x+2); dafür reicht Differenzierbarkeit im Punkt −1.
  mitglieder: [kn.satz.singulaer_minus2, kn.kor.basisvergleich]
- id: kn.andere
  gebiet: kn
  name: Andere Konstruktionen
  verlauf: Linear, Walker, Hooshmand, Carleman — der Carleman-slog nähert Kneser nur algebraisch (≈ n^{−3.8}).
  mitglieder: [kn.konstr.linear, kn.satz.linear_glatt, kn.satz.hooshmand, kn.konstr.walker, kn.konstr.carleman, kn.verm.carleman_kneser, kn.beob.carleman_rate, kn.satz.abel_bruchsumme, kn.frage.abel_bruchsumme, kn.verm.carleman_eigenwerte, kn.konstr.zwei_sinh, kn.konstr.kontinuumssumme, kn.konstr.quadratisch, kn.satz.grenzwert_trick, kn.satz.intuitiver_log, kn.konstr.paulsen_stoerung, kn.satz.walker_konjugation, kn.verm.szekeres_wachstum, kn.verm.tpid3, kn.verm.tpid3_bedingung, kn.frage.tpid14, kn.frage.tpid16, kn.frage.tpid17]
- id: kn.halbe_exp
  gebiet: kn
  name: Gebrochene Iterierte von exp
  verlauf: Knesers Ausgangsfrage f(f(x)) = eˣ, ihre Lösung über die Tetration, ihr Platz zwischen den Wachstumsklassen — und warum ein abgeschnittenes Polynom sie trifft.
  mitglieder: [kn.satz.halbe_exp, kn.satz.halbe_exp_wachstum, kn.verm.polynom_halbexp, kn.beob.slog_scheibe, kn.satz.halbexp_beschraenkt, kn.satz.polynom_halbexp_reduktion, kn.verm.polynom_halbexp_schranke, kn.satz.polynom_halbexp_endlich, kn.gescheitert.polynom_kantorovich, kn.satz.halbexp_singularitaet_L, kn.beob.polynom_halbexp_fehlergesetz, kn.beob.polynom_eckmode, kn.verm.polynom_halbexp_eckmoden, kn.satz.polynom_halbexp_hauptsatz, kn.satz.polynom_modelle, kn.beob.polynom_moebius_schwelle, kn.satz.kneser_e_zertifiziert, kn.satz.polynom_zweig_400, kn.beob.polynom_konforme_stabilitaet, kn.beob.polynom_rand_plateau, kn.satz.polynom_eckprofil, kn.satz.polynom_cd_identitaet, kn.satz.polynom_approximation_ecke, kn.verm.polynom_halbexp_kern, kn.satz.polynom_hauptsatz_kr0, kn.gescheitert.polynom_ecke_wege]
- id: kn.hoehere_stufen
  gebiet: kn
  name: Höhere Stufen — Pentation
  verlauf: Die Tetration hat bei −1.85 einen Fixpunkt; dort regulär iteriert entsteht die Pentation, eine Stufe höher die Hexation (bis η₅ regulär, darüber Kneser-artig und, anders als Knesers Tetration, in der oberen Halbebene verzweigt; Berührbasis η₆ = 1.7991). Über η und e liegen η₄, e₄ und η₅, e₅ — gehen sie gegen 2 und 4?
  mitglieder: [kn.konstr.pentation, kn.beob.pentation_werte, kn.beob.tetra_euler, kn.beob.stufe5, kn.satz.hexation_struktur, kn.konstr.hexation_regulaer, kn.beob.unendliche_hexation, kn.satz.kein_kneser_anziehend, kn.beob.hexation_verzweigt, kn.satz.hexation_keine_halbebene, kn.satz.hexation_eindeutig_g0, kn.satz.hexation_gebiete, kn.satz.hexation_logpunkt, kn.verm.hexation_streifen, kn.frage.hexation_kneser, kn.beob.stufe6, kn.beob.decation_reell]
- id: kn.etas
  gebiet: kn
  name: TPID 10 — Etas und Eulers
  verlauf: Gehen ηₙ → 2 und eₙ → 4? Interpolation (Robbins, mike3), Matrix-slog (nuninho), Kneser (Levenstein 2010, 2017), Heuristik (Nixon) und unsere 30-Stellen-Glieder mit Abstandsgesetz.
  mitglieder: [kn.verm.tpid10, kn.verm.tpid11, kn.beob.eta4_interpolation, kn.beob.eta4_matrix, kn.beob.hoehere_etas, kn.beob.tpid10_gesetz, kn.verm.beschraenkt_unter_2, kn.frage.pentation_untergrenze, kn.frage.andere_etas, kn.beob.eta7_eta8, kn.satz.schwellen_monoton, kn.satz.basis2_hoehe3, kn.satz.kritische_rate, kn.satz.eta_auswahl, kn.satz.eta_kriterium, kn.beob.kritische_profile, kn.beob.zwischenwerte_basis2]
- id: kn.halbrang
  gebiet: kn
  name: Gebrochene Ränge — eine Rechenart zwischen Potenz und Tetration?
  verlauf: Der halbe Schritt ist eine gebrochene Iteration eines Operators auf Funktionen. Im linearen Modell exakt, in zweiter Ordnung holomorph; zwei naheliegende Kurzwege scheitern.
  mitglieder: [kn.satz.halbrang_linear, kn.satz.halbrang_quadratisch, kn.gescheitert.polynom_rekonstruktion, kn.gescheitert.mischkurve, kn.satz.rangjets_exppoly, kn.beob.halbrang_basis2, kn.beob.halbrang_kneser_test, kn.beob.halbrang_divergenz, kn.beob.halbrang_theta_grenze, kn.beob.kneser_beschraenkte_summe, kn.beob.halbrang_rangfortsetzung, kn.frage.halber_rang]
